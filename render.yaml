services:
  - type: web
    name: examtree-api
    runtime: node
    rootDir: .
    buildCommand: bash build-api.sh
    startCommand: NODE_ENV=production node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically — no need to set it here

      # ── Database ──────────────────────────────────────────────────────────
      # Single canonical Neon PostgreSQL connection string.
      # Example: postgresql://user:pass@ep-xxx.us-east-1.aws.neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false   # set to the canonical ExamTree project in Render dashboard

      # ── Firebase Auth (server) ────────────────────────────────────────────
      # Paste the entire service account JSON as a single-line string.
      # Generate from: Firebase Console → Project Settings → Service Accounts
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false   # set in Render dashboard

      # ── Firebase (client — baked into Vite build) ─────────────────────────
      # Get from: Firebase Console → Project Settings → Your apps → SDK setup
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false

      # ── CORS ──────────────────────────────────────────────────────────────
      # Comma-separated list of allowed frontend origins (no trailing slash).
      # Example: https://yourapp.web.app,https://www.yourapp.com
      - key: CORS_ORIGINS
        sync: false   # set in Render dashboard

      # ── Razorpay (optional — omit if not using payments) ─────────────────
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_CURRENCY
        value: INR
      - key: ALLOW_MOCK_PAYMENTS
        value: "false"

      # ── Upstash Redis (optional — caching/rate-limiting) ──────────────────
      # Without these, the server degrades gracefully (no caching, no rate limits).
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

  # Pull every configured active RSS/Atom or curated official listing source.
  - type: cron
    name: examtree-current-affairs-feed-ingestion
    runtime: node
    rootDir: .
    schedule: "0 */3 * * *"
    buildCommand: bash build-current-affairs-worker.sh
    startCommand: NODE_ENV=production node --enable-source-maps artifacts/api-server/dist/current-affairs-feed-worker.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

  # Read high-trust official candidate pages transiently and stage atomic facts.
  # Page text stays in memory only; the DB stores fact claims, provenance and a
  # content hash. This runs after discovery but before clustering/promotion.
  - type: cron
    name: examtree-current-affairs-primary-enrichment
    runtime: node
    rootDir: .
    schedule: "10 */3 * * *"
    buildCommand: bash build-current-affairs-worker.sh
    startCommand: NODE_ENV=production node --enable-source-maps artifacts/api-server/dist/current-affairs-primary-enrichment-worker.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

  # Run after ingestion + primary fact enrichment. Strict gates auto-promote and
  # verify only strong evidence. The 00:20 UTC run also creates previous-day
  # India-time SSC/Banking/Punjab draft compilations and BANK_ONLY quiz-review
  # runs; it never publishes them automatically.
  - type: cron
    name: examtree-current-affairs-daily-orchestration
    runtime: node
    rootDir: .
    schedule: "20 */3 * * *"
    buildCommand: bash build-current-affairs-worker.sh
    startCommand: NODE_ENV=production node --enable-source-maps artifacts/api-server/dist/current-affairs-daily-worker.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

  # Bounded production recovery. Runs after the canonical 0/10/20 pipeline and
  # may only backfill draft notes, localizations and BANK_ONLY review questions.
  # It never approves releases, promotes Question Bank items or publishes content.
  - type: cron
    name: examtree-current-affairs-production-recovery
    runtime: node
    rootDir: .
    schedule: "50 */3 * * *"
    buildCommand: bash build-current-affairs-worker.sh
    startCommand: NODE_ENV=production node --enable-source-maps artifacts/api-server/dist/current-affairs-production-ops-worker.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

  # Materialize bounded, deduplicated in-app Current Affairs notifications.
  # This writes only the learner inbox. It does not call push/email/SMS providers.
  - type: cron
    name: examtree-current-affairs-inapp-notifications
    runtime: node
    rootDir: .
    schedule: "35 * * * *"
    buildCommand: bash build-current-affairs-worker.sh
    startCommand: NODE_ENV=production node --enable-source-maps artifacts/api-server/dist/current-affairs-notification-worker.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
