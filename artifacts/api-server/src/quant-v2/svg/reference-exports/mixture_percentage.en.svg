<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mixture reasoning" viewBox="0 0 720 522" width="720" height="522">
<rect width="100%" height="100%" fill="#f7fbf8"/>
<style>text{font-family:Arial, Noto Sans Devanagari, Noto Sans Gurmukhi, sans-serif;dominant-baseline:auto}.eq{font-variant-numeric:tabular-nums}</style>
<text x="80" y="42" font-size="24" font-weight="700" fill="#1f2a24">Mixture reasoning</text>
<text x="80" y="65" font-size="13" font-weight="400" fill="#607067">mixture_percentage · medium</text>
<rect x="80" y="78" width="560" height="76" rx="8" fill="#ffffff" stroke="#9fb7aa" stroke-width="1.2"/>
<text x="102" y="106" font-size="16" font-weight="700" fill="#1f2a24">Mixture balance</text>
<text class="eq" x="102" y="132" font-size="18" fill="#10251b">fixedComponent = 120 - 30</text>
<path d="M 360 158 L 360 168" stroke="#1f7a4f" stroke-width="1.5" fill="none"/>
<path d="M 355 162 L 360 170 L 365 162" stroke="#1f7a4f" stroke-width="1.5" fill="none"/>
<rect x="80" y="178" width="560" height="92" rx="8" fill="#ffffff" stroke="#9fb7aa" stroke-width="1.2"/>
<text x="102" y="206" font-size="16" font-weight="700" fill="#1f2a24">Mixture balance</text>
<text class="eq" x="102" y="232" font-size="18" fill="#10251b">finalMixtureTotal = fixedComponent × 100 /</text>
<text class="eq" x="102" y="254" font-size="18" fill="#10251b">( 100 - 50 )</text>
<path d="M 360 274 L 360 284" stroke="#1f7a4f" stroke-width="1.5" fill="none"/>
<path d="M 355 278 L 360 286 L 365 278" stroke="#1f7a4f" stroke-width="1.5" fill="none"/>
<rect x="80" y="294" width="560" height="76" rx="8" fill="#ffffff" stroke="#9fb7aa" stroke-width="1.2"/>
<text x="102" y="322" font-size="16" font-weight="700" fill="#1f2a24">Percentage relation</text>
<text class="eq" x="102" y="348" font-size="18" fill="#10251b">addedQuantity = finalMixtureTotal - 120</text>
<path d="M 360 374 L 360 384" stroke="#1f7a4f" stroke-width="1.5" fill="none"/>
<path d="M 355 378 L 360 386 L 365 378" stroke="#1f7a4f" stroke-width="1.5" fill="none"/>
<rect x="80" y="394" width="560" height="76" rx="8" fill="#eaf7ef" stroke="#1f7a4f" stroke-width="2"/>
<text x="102" y="422" font-size="16" font-weight="700" fill="#1f2a24">Answer</text>
<text class="eq" x="102" y="448" font-size="18" fill="#10251b">60</text>
</svg>