name: Validate MEN-CP-013 permanent English V4

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-013/**
      - .github/workflows/men-cp013-permanent-english-v4.yml
      - build-api.sh
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-cp013-permanent-english-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp013-permanent-english-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove 1,920 editorial-final permanent questions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/api-server/dist/quant-v4
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-013/permanent/runtime-v4.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/quant-v4/men-cp013-permanent-english-v4.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp013-permanent-english-v4.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/men-cp013-permanent-english-v4.test.log
      - name: Prove 64-question editorial-final review
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-013/permanent/review-v4.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/quant-v4/men-cp013-permanent-review-v4.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp013-permanent-review-v4.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/men-cp013-permanent-review-v4.test.log
      - name: Export editorial-final artifact
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-013/permanent/review-export-v4.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/quant-v4/men-cp013-permanent-review-export-v4.mjs
          cd artifacts/api-server
          node dist/quant-v4/men-cp013-permanent-review-export-v4.mjs 2>&1 | tee dist/quant-v4/men-cp013-permanent-review-export-v4.log
          test -s dist/quant-v4/men-cp013-permanent-english-review-v4.json
          test -s dist/quant-v4/men-cp013-permanent-english-review-v4.md
      - name: Regress permanent allocation
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-013/permanent/allocation.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/quant-v4/men-cp013-allocation-v4-regression.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp013-allocation-v4-regression.test.mjs
      - name: Build production API bundle
        run: bash build-api.sh
      - name: Upload editorial-final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-cp013-permanent-english-review-v4
          path: |
            artifacts/api-server/dist/quant-v4/men-cp013-permanent-english-v4.test.log
            artifacts/api-server/dist/quant-v4/men-cp013-permanent-review-v4.test.log
            artifacts/api-server/dist/quant-v4/men-cp013-permanent-review-export-v4.log
            artifacts/api-server/dist/quant-v4/men-cp013-permanent-english-review-v4.json
            artifacts/api-server/dist/quant-v4/men-cp013-permanent-english-review-v4.md
          if-no-files-found: error
          retention-days: 14
