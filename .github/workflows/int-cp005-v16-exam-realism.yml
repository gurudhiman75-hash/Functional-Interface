name: Validate INT-CP-005 V16 Exam Realism

on:
  pull_request:
    branches: [New-main]
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp005-variable-growth-decay-runtime-v16.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp005-variable-growth-decay-v16-*.ts"
      - ".github/workflows/int-cp005-v16-exam-realism.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: int-cp005-v16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-int-cp005-v16:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle V16 exam-realism audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp005-variable-growth-decay-v16-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-cp005-v16-audit.mjs
      - name: Run V16 exam-realism audit
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp005-v16-audit.mjs 2>&1 | tee dist/quant-v4/int-cp005-v16-audit.log
      - name: Bundle V16 review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp005-variable-growth-decay-v16-review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-cp005-v16-review-export.mjs
      - name: Export V16 review markdown
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp005-v16-review-export.mjs 2>&1 | tee dist/quant-v4/int-cp005-v16-review-export.log
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Verify V16 evidence markers
        run: |
          grep -q 'PASS_INT_CP005_V16_EXAM_REALISM' artifacts/api-server/dist/quant-v4/int-cp005-v16-audit.log
          grep -q 'PASS_INT_CP005_V16_REVIEW_EXPORT' artifacts/api-server/dist/quant-v4/int-cp005-v16-review-export.log
      - name: Upload V16 English review evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-cp005-v16-english-review
          path: |
            artifacts/api-server/dist/quant-v4/INT-CP-005-V16-ENGLISH-REVIEW.md
            artifacts/api-server/dist/quant-v4/int-cp005-v16-audit.log
          if-no-files-found: error
