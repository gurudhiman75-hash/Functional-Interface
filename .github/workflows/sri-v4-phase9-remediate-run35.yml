name: SRI Phase 9 remediate run35 localization

on:
  push:
    branches:
      - feature/sri-v4-phase9-localization-v1
    paths:
      - .github/workflows/sri-v4-phase9-remediate-run35.yml
  pull_request:
    branches:
      - New-main
    paths:
      - .github/workflows/sri-v4-phase9-remediate-run35.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sri-v4-phase9-localization-v1
      - name: Insert structural localization authority
        env:
          PAYLOAD: 
        run: |
          python - <<'PY'
          import base64, os, zlib
          from pathlib import Path
          p = Path('artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/permanent-localization-v1.ts')
          s = p.read_text(encoding='utf-8')
          sentinel = 'RUN35_SURD_LOCALIZATION_BLOCK_V1'
          if sentinel in s:
              raise SystemExit('Run35 localization block already present')
          marker = '  const denest = text.match(/^Denest (.+)\\.$/u);'
          if s.count(marker) != 1:
              raise SystemExit(f'Expected one insertion marker, found {s.count(marker)}')
          block = zlib.decompress(base64.b64decode(os.environ['PAYLOAD'])).decode('utf-8')
          s = s.replace(marker, block + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
      - name: Commit remediation and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sri-v4-phase9-remediate-run35.yml
          git add artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/permanent-localization-v1.ts
          git diff --cached --check
          git commit -m "SRI Phase 9: remediate C006-F and CP007-008 localization"
          git push origin HEAD:feature/sri-v4-phase9-localization-v1
