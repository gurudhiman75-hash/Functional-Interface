name: Validate INT-CP-007 Question Studio Review

on:
  pull_request:
    branches:
      - New-main
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp007-**'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp007-**'
      - 'artifacts/api-server/src/routes/admin-question-studio-interest-cp007.ts'
      - 'artifacts/api-server/src/routes/index.ts'
      - 'artifacts/admin-app/src/features/question-studio/interest-cp007-review-api.ts'
      - 'artifacts/admin-app/src/pages/content/QuestionStudioInterestCp007ReviewPanel.tsx'
      - 'artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx'
      - '.github/workflows/int-cp007-question-studio-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: int-cp007-question-studio-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-int-cp007-question-studio-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove CP007 frozen Question Studio adapter and lifecycle locks
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp007-question-studio-review-audit.ts | tee int-cp007-question-studio-review.log

      - name: Verify CP007 Question Studio audit marker
        run: grep -q 'PASS_INT_CP007_QUESTION_STUDIO_REVIEW_AUDIT' int-cp007-question-studio-review.log

      - name: Typecheck admin application
        run: pnpm --dir artifacts/admin-app typecheck

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Upload CP007 Question Studio validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-cp007-question-studio-review-evidence
          path: int-cp007-question-studio-review.log
          retention-days: 30
