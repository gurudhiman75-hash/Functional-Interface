name: SRI Phase 9 remediate run40 residual localization

on:
  push:
    branches:
      - feature/sri-v4-phase9-localization-v1
    paths:
      - .github/workflows/sri-v4-phase9-remediate-run40.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sri-v4-phase9-localization-v1
      - name: Insert C008 C009 structural localization authority
        env:
          PAYLOAD: 
        run: |
          python - <<'PY'
          import base64
          import os
          import pathlib
          import zlib

          target = pathlib.Path("artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/permanent-localization-v1.ts")
          helper = pathlib.Path(".github/workflows/sri-v4-phase9-remediate-run40.yml")
          source = target.read_text(encoding="utf-8")
          marker = "RUN40_C008_C009_LOCALIZATION_BLOCK_V1"
          block = zlib.decompress(base64.b64decode(os.environ["PAYLOAD"])).decode("utf-8")

          if marker not in source:
              function_needle = "export function localizeSriLearnerTextV1(text: string, locale: SriLocalizedLocaleV1): string {"
              if function_needle not in source:
                  raise SystemExit("localization function insertion point not found")
              block_with_marker = "// RUN40_C008_C009_LOCALIZATION_BLOCK_V1\n" + block + "\n\n"
              source = source.replace(function_needle, block_with_marker + function_needle, 1)

              call_needle = '  const exact = EXACT_SENTENCES[locale][text];\n  if (exact) return exact;\n'
              if call_needle not in source:
                  raise SystemExit("exact-sentence insertion point not found")
              call = call_needle + '\n  const run40Residual = localizeRun40ResidualTextV1(text, locale);\n  if (run40Residual) return run40Residual;\n'
              source = source.replace(call_needle, call, 1)
              target.write_text(source, encoding="utf-8")

          if helper.exists():
              helper.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/permanent-localization-v1.ts .github/workflows/sri-v4-phase9-remediate-run40.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "SRI Phase 9: close C008 C009 localization residuals"
          git push origin HEAD:feature/sri-v4-phase9-localization-v1
