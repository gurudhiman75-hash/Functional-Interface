name: TEMP Quant V4 Wave6 cumulative alignment

on:
  push:
    branches:
      - audit/quant-v4-cgl-2023-07-26-s3-full-quant-section-wave6-p2
    paths:
      - ".github/workflows/tmp-quant-v4-wave6-align.yml"

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/quant-v4-cgl-2023-07-26-s3-full-quant-section-wave6-p2
          fetch-depth: 0
      - name: Align cumulative evidence assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('artifacts/api-server/src/quant-v4/quality')
          replacements = {
              'assert.equal(QUANT_V4_REGISTERED_PYQ_OBSERVATIONS.length, 183)': 'assert.equal(QUANT_V4_REGISTERED_PYQ_OBSERVATIONS.length, 208)',
              'assert.equal(cgl.countableQuestionCount, 150)': 'assert.equal(cgl.countableQuestionCount, 175)',
              'assert.equal(cgl.distinctPaperCount, 21)': 'assert.equal(cgl.distinctPaperCount, 22)',
              'assert.equal(QUANT_V4_CGL_TIER_I_COMPLETE_SECTION_SPECS.length, 5)': 'assert.equal(QUANT_V4_CGL_TIER_I_COMPLETE_SECTION_SPECS.length, 6)',
              'assert.equal(whole.totalCountableQuestionCount, 150)': 'assert.equal(whole.totalCountableQuestionCount, 175)',
              'assert.equal(whole.completeSectionCount, 5)': 'assert.equal(whole.completeSectionCount, 6)',
              'assert.equal(whole.completeQuestionCount, 125)': 'assert.equal(whole.completeQuestionCount, 150)',
              'assert.equal(cgl.length, 150)': 'assert.equal(cgl.length, 175)',
              'assert.equal(numCgl.normalizedCountableObservationCount, 16)': 'assert.equal(numCgl.normalizedCountableObservationCount, 17)',
              'assert.equal(tmwCgl.normalizedCountableObservationCount, 13)': 'assert.equal(tmwCgl.normalizedCountableObservationCount, 17)',
              'assert.equal(cglTierI.normalizedCountableObservationCount, 16)': 'assert.equal(cglTierI.normalizedCountableObservationCount, 17)',
              'assert.equal(numAll.length, 22)': 'assert.equal(numAll.length, 23)',
              'assert.equal(numAll.filter((entry) => entry.examId === "SSC_CGL_TIER_I").length, 16)': 'assert.equal(numAll.filter((entry) => entry.examId === "SSC_CGL_TIER_I").length, 17)',
              'assert.equal(tmw.length, 18)': 'assert.equal(tmw.length, 22)',
              'assert.equal(tmw.filter((entry) => entry.examId === "SSC_CGL_TIER_I").length, 13)': 'assert.equal(tmw.filter((entry) => entry.examId === "SSC_CGL_TIER_I").length, 17)',
              'assert.equal(tsd001.length, 11)': 'assert.equal(tsd001.length, 12)',
              'assert.equal(tsd002.length, 4)': 'assert.equal(tsd002.length, 5)',
              'assert.equal(tsdAll.filter((entry) => entry.examId === "SSC_CGL_TIER_I").length, 9)': 'assert.equal(tsdAll.filter((entry) => entry.examId === "SSC_CGL_TIER_I").length, 11)',
              'assert.equal(alg001.length, 24)': 'assert.equal(alg001.length, 27)',
              'assert.equal(algebraAll.length, 35)': 'assert.equal(algebraAll.length, 38)',
              'assert.equal(algebraAll.filter((entry) => entry.examId === "SSC_CGL_TIER_I").length, 30)': 'assert.equal(algebraAll.filter((entry) => entry.examId === "SSC_CGL_TIER_I").length, 33)',
              'assert.equal(cgl.countableQuestionCount, 30)': 'assert.equal(cgl.countableQuestionCount, 33)',
              'assert.equal(cgl.distinctPaperCount, 20)': 'assert.equal(cgl.distinctPaperCount, 21)',
              'listRegisteredCountablePyqObservations({ packageId: "PNL-001" }).length, 9': 'listRegisteredCountablePyqObservations({ packageId: "PNL-001" }).length, 11',
              '"TMW-001": Object.freeze({ ...ZERO_COUNTS, SSC_CGL_TIER_I: 13, SSC_CGL_CHSL: 5 })': '"TMW-001": Object.freeze({ ...ZERO_COUNTS, SSC_CGL_TIER_I: 17, SSC_CGL_CHSL: 5 })',
              'SSC_CGL_TIER_I: 16,\n    SSC_CGL_CHSL: 5,': 'SSC_CGL_TIER_I: 17,\n    SSC_CGL_CHSL: 5,',
          }

          changed = []
          for path in root.glob('*.test.ts'):
              text = path.read_text()
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))

          print('Aligned files:')
          print('\n'.join(changed))
          PY
          git diff --check
      - name: Commit alignment
        run: |
          if git diff --quiet; then
            echo "No alignment changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/quality/*.test.ts
          git commit -m "test(quant-v4): align cumulative evidence to Wave6"
          git push origin HEAD:audit/quant-v4-cgl-2023-07-26-s3-full-quant-section-wave6-p2
