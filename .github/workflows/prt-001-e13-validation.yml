name: PRT-001 E13 Exhaustiveness Closure Validation

on:
  push:
    branches:
      - feat/prt-001-e13-exhaustiveness-closure
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/**"
      - "artifacts/api-server/src/quant-v4/generation-engine-core.ts"
      - ".github/workflows/prt-001-e13-validation.yml"
  pull_request:
    branches:
      - audit/prt-001-post-freeze-exhaustiveness-e13
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/**"
      - "artifacts/api-server/src/quant-v4/generation-engine-core.ts"
      - ".github/workflows/prt-001-e13-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prt-001-e13-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-prt-001-e13:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck PRT-001 E13 surface
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsc --noEmit --target es2022 --module esnext --moduleResolution bundler --resolveJsonModule --allowSyntheticDefaultImports --skipLibCheck --strictNullChecks --noImplicitAny --noImplicitReturns --noFallthroughCasesInSwitch \
            src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/index.ts \
            src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/prt-001.test.ts \
            src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/prt-001-e13-cross-chapter-ownership-audit.ts \
            | tee prt-001-e13-typecheck.log

      - name: Run deterministic PRT-001 corpus
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/prt-001.test.ts \
            | tee prt-001-e13-corpus.log

      - name: Run full PRT-001 freeze audit chain (includes E13 cross-chapter ownership)
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/prt-001-freeze-audit.ts \
            | tee prt-001-e13-freeze-audit.log

      - name: Run RAP-003 legacy Partnership ownership regression
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/prt-001-rap003-ownership-audit.ts \
            | tee prt-001-e13-rap-ownership.log

      - name: Upload PRT-001 E13 validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prt-001-e13-validation-logs
          path: |
            artifacts/api-server/prt-001-e13-typecheck.log
            artifacts/api-server/prt-001-e13-corpus.log
            artifacts/api-server/prt-001-e13-freeze-audit.log
            artifacts/api-server/prt-001-e13-rap-ownership.log
          retention-days: 14
