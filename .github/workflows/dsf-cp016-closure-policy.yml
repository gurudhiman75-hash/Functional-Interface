name: Validate DSF CP-016 Closure Policy

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-016/**
      - .github/workflows/dsf-cp016-closure-policy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsf-cp016-closure-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp016-closure-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle CP-016 closure policy audit
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/data-sufficiency/cp016
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-016/closure-policy.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/data-sufficiency/cp016/closure-policy.test.mjs
      - name: Run CP-016 closure policy audit
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/data-sufficiency/cp016/closure-policy.test.mjs
      - name: Bundle CP-016 exact implementation evidence ledger audit
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-016/implementation-evidence-ledger-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/data-sufficiency/cp016/implementation-evidence-ledger-v1.test.mjs
      - name: Run CP-016 exact implementation evidence ledger audit
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/data-sufficiency/cp016/implementation-evidence-ledger-v1.test.mjs
