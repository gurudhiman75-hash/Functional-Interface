name: Reasoning BLR-001 CP-007 Editorial V3

on:
  push:
    branches:
      - feat/blr-001-cp007-editorial-v3
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-006/**"
      - ".github/workflows/reasoning-blr-001-cp007-editorial-v3.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-006/**"
      - ".github/workflows/reasoning-blr-001-cp007-editorial-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blr-001-cp007-editorial-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp007-editorial-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove CP-006 source runtime
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-006/cp006-runtime.test.ts | tee cp006-source.log

      - name: Prove CP-007 V1 solver baseline
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-runtime.test.ts | tee cp007-v1-baseline.log

      - name: Prove CP-007 V2 engineering baseline
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-editorial-v2-exam-review-final.test.ts | tee cp007-v2-baseline.log

      - name: Prove CP-007 V3 semantic editorial bank
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-editorial-v3-authority.test.ts | tee cp007-v3.log

      - name: Export CP-007 V3 human-review pack
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/export-cp007-editorial-v3-review.ts cp007-editorial-v3-review-output | tee cp007-v3-export.log

      - name: Verify CP-007 V3 artifact contracts
        shell: bash
        run: |
          set -euo pipefail
          OUT=cp007-editorial-v3-review-output
          test -f "$OUT/blr-cp007-editorial-v3-summary.json"
          test -f "$OUT/blr-cp007-editorial-v3-records.jsonl"
          test -f "$OUT/blr-cp007-editorial-v3-records.csv"
          test -f "$OUT/blr-cp007-editorial-v3-review.html"
          test -f "$OUT/BLR-CP-007-EDITORIAL-V3-REVIEW.md"
          test "$(wc -l < "$OUT/blr-cp007-editorial-v3-records.jsonl")" -eq 168
          grep -q '"semanticScenarioCount": 168' "$OUT/blr-cp007-editorial-v3-summary.json"
          grep -q '"minimumSemanticScenariosPerPrototype": 8' "$OUT/blr-cp007-editorial-v3-summary.json"
          grep -q '"MALE": 75' "$OUT/blr-cp007-editorial-v3-summary.json"
          grep -q '"FEMALE": 75' "$OUT/blr-cp007-editorial-v3-summary.json"
          grep -q '"NEUTRAL": 18' "$OUT/blr-cp007-editorial-v3-summary.json"
          grep -q '"SYMBOL": 126' "$OUT/blr-cp007-editorial-v3-summary.json"
          grep -q '"LETTER": 29' "$OUT/blr-cp007-editorial-v3-summary.json"
          grep -q '"NEUTRAL_WORD": 13' "$OUT/blr-cp007-editorial-v3-summary.json"
          grep -q '"EASY": 32' "$OUT/blr-cp007-editorial-v3-summary.json"
          grep -q '"MEDIUM": 88' "$OUT/blr-cp007-editorial-v3-summary.json"
          grep -q '"HARD": 48' "$OUT/blr-cp007-editorial-v3-summary.json"
          grep -q '"validWrongGraphOptions": 504' "$OUT/blr-cp007-editorial-v3-summary.json"
          grep -q '"ql034MeaningfulCandidateQuestions": 32' "$OUT/blr-cp007-editorial-v3-summary.json"
          grep -q '168 genuinely varied English review questions' "$OUT/blr-cp007-editorial-v3-review.html"
          grep -q 'Diagram hidden for this direct lookup' "$OUT/blr-cp007-editorial-v3-review.html"
          grep -q 'Administrator review proof' "$OUT/blr-cp007-editorial-v3-review.html"
          ! grep -q '<strong>Therefore:</strong> Therefore' "$OUT/blr-cp007-editorial-v3-review.html"
          grep -q 'executable semantic-remodel review candidate' "$OUT/BLR-CP-007-EDITORIAL-V3-REVIEW.md"

      - name: Upload CP-007 V3 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp007-editorial-v3-logs
          path: |
            cp006-source.log
            cp007-v1-baseline.log
            cp007-v2-baseline.log
            cp007-v3.log
            cp007-v3-export.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload CP-007 V3 review pack
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp007-editorial-v3-human-review
          path: cp007-editorial-v3-review-output
          if-no-files-found: error
          retention-days: 30
