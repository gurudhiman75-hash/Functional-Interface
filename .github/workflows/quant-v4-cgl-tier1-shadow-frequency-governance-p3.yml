name: Quant V4 CGL Tier-I shadow frequency governance P3

on:
  push:
    branches:
      - audit/quant-v4-cgl-tier1-shadow-frequency-governance-p3
    paths:
      - ".github/workflows/quant-v4-cgl-tier1-shadow-frequency-governance-p3.yml"
      - "artifacts/api-server/src/quant-v4/quality/**"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/quality/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-v4-cgl-tier1-shadow-frequency-governance-p3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cgl-tier1-shadow-frequency-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle governance and regression proofs
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/quality
          for test in \
            quant-v4-cgl-tier1-shadow-frequency-governance-p3.test \
            quant-v4-whole-section-frequency-stability-p2.test \
            quant-v4-whole-section-frequency-calibration-p2.test \
            quant-v4-real-exam-simulation-p2.test
          do
            pnpm --dir artifacts/api-server exec esbuild \
              "src/quant-v4/quality/${test}.ts" \
              --bundle --platform=node --format=esm --packages=external \
              --outfile="dist/quant-v4/quality/${test}.mjs"
          done
      - name: Run shadow governance proof
        working-directory: artifacts/api-server
        run: node dist/quant-v4/quality/quant-v4-cgl-tier1-shadow-frequency-governance-p3.test.mjs
      - name: Run whole-section stability regression
        working-directory: artifacts/api-server
        run: |
          node dist/quant-v4/quality/quant-v4-whole-section-frequency-calibration-p2.test.mjs
          node dist/quant-v4/quality/quant-v4-whole-section-frequency-stability-p2.test.mjs
      - name: Run current runtime simulation regression
        working-directory: artifacts/api-server
        run: node dist/quant-v4/quality/quant-v4-real-exam-simulation-p2.test.mjs
      - name: Patch hygiene
        run: git diff --check
