name: Validate Notes Studio NS-016 Coverage Gap Research

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/notes-studio/coverage-gap-research.ts
      - artifacts/api-server/src/notes-studio/coverage-gap-research-provider.ts
      - artifacts/api-server/src/notes-studio/coverage-gap-research.test.ts
      - artifacts/api-server/src/routes/admin-notes-studio-coverage-gap-research.ts
      - artifacts/api-server/src/routes/admin-notes-studio-source-policy.ts
      - artifacts/admin-app/src/pages/content/NotesStudioCoverageGapResearchPage.tsx
      - artifacts/admin-app/src/pages/content/NotesStudioHubPage.tsx
      - docs/notes-studio-ns016-coverage-gap-research.md

permissions:
  contents: read

concurrency:
  group: notes-studio-ns016-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-notes-studio-coverage-gap-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run NS-016 deterministic contracts
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/coverage-gap-research.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-coverage-gap-research.test.mjs
          node artifacts/api-server/dist/notes-studio-coverage-gap-research.test.mjs

      - name: Verify non-factual research boundaries
        run: |
          grep -F 'acceptedClaimTextOnly: true' artifacts/api-server/src/routes/admin-notes-studio-coverage-gap-research.ts
          grep -F 'rawSourceTextSent: false' artifacts/api-server/src/routes/admin-notes-studio-coverage-gap-research.ts
          grep -F 'factualAnswersRequested: false' artifacts/api-server/src/routes/admin-notes-studio-coverage-gap-research.ts
          grep -F 'automaticSourceDiscovery: false' artifacts/api-server/src/routes/admin-notes-studio-coverage-gap-research.ts
          grep -F 'automaticClaimCreation: false' artifacts/api-server/src/routes/admin-notes-studio-coverage-gap-research.ts
          grep -F 'automaticCoverageMutation: false' artifacts/api-server/src/routes/admin-notes-studio-coverage-gap-research.ts
          grep -F 'adminNotesStudioCoverageGapResearchRouter' artifacts/api-server/src/routes/admin-notes-studio-source-policy.ts
          grep -F 'Coverage-gap research' artifacts/admin-app/src/pages/content/NotesStudioHubPage.tsx
          grep -F 'These are research prompts, not answers' artifacts/admin-app/src/pages/content/NotesStudioCoverageGapResearchPage.tsx
          if grep -F 'INSERT INTO content.note_source_claims' artifacts/api-server/src/routes/admin-notes-studio-coverage-gap-research.ts; then exit 1; fi
          if grep -F 'INSERT INTO content.note_coverage_item_claims' artifacts/api-server/src/routes/admin-notes-studio-coverage-gap-research.ts; then exit 1; fi
          if grep -F 'INSERT INTO content.note_sections' artifacts/api-server/src/routes/admin-notes-studio-coverage-gap-research.ts; then exit 1; fi
          if grep -F 'fetch(' artifacts/api-server/src/routes/admin-notes-studio-coverage-gap-research.ts; then exit 1; fi

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Typecheck admin app
        run: pnpm --dir artifacts/admin-app typecheck
