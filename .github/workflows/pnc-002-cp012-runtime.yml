name: Validate PNC-002 CP-012 mixed advanced runtime

on:
  push:
    branches:
      - feat/pnc-002-cp012-mixed-advanced-runtime-proof
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/**
      - .github/workflows/pnc-002-cp012-runtime.yml
  pull_request:
    branches:
      - feat/pnc-002-cp011-grouping-distribution
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/**
      - .github/workflows/pnc-002-cp012-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-pnc-002-cp012-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pnc-002-cp012:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: feat/pnc-002-cp012-mixed-advanced-runtime-proof
      - name: Apply review quality cleanup once
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002')
          runtime = root / 'foundation/cp012-mixed-runtime.ts'
          text = runtime.read_text()
          old_cases = '''    case "derangement": return { objectCount: pickSeeded(pools.derangement, random) };\n    case "fixedPoints": return { ...pickSeeded(pools.fixedPoints, random) };\n    case "twoSpecifiedFixed": return { objectCount: pickSeeded(pools.twoSpecifiedFixed, random) };\n'''
          new_case = '''    case "fixedPoints": {\n      const state = pickSeeded(pools.fixedPoints, random);\n      return entry.solveMode === "countExactlyKFixedPoints"\n        ? { objectCount: state.objectCount, fixedCount: state.fixedCount }\n        : { objectCount: state.objectCount };\n    }\n'''
          if old_cases in text:
              text = text.replace(old_cases, new_case, 1)
          elif new_case not in text:
              raise SystemExit('fixed-point buildValues block not found')
          old_committee = '    committeeSize: numberValue(parameters.values, "committeeSize") || 0,\n'
          new_committee = '    committeeSize: parameters.values.committeeSize === undefined ? "" : numberValue(parameters.values, "committeeSize"),\n'
          if old_committee in text:
              text = text.replace(old_committee, new_committee, 1)
          elif new_committee not in text:
              raise SystemExit('committeeSize explanation line not found')
          old_sum = r'String.raw`\sum_{j=0}^{${boxes}}(-1)^j'
          new_sum = r'String.raw`\sum_{j=0}^{${boxes - 1}}(-1)^j'
          if old_sum in text:
              text = text.replace(old_sum, new_sum, 1)
          elif new_sum not in text:
              raise SystemExit('two-colour summation formula not found')
          runtime.write_text(text)

          ranges_path = root / 'variable-ranges.cp012-mixed.library.json'
          ranges = json.loads(ranges_path.read_text())
          ranges['pools'].pop('derangement', None)
          ranges['pools'].pop('twoSpecifiedFixed', None)
          for pool in ranges['pools'].values():
              if isinstance(pool, list):
                  for state in pool:
                      if isinstance(state, dict) and state.get('committeeSize') == 0:
                          state.pop('committeeSize')
          ranges_path.write_text(json.dumps(ranges, indent=2) + '\n')

          explanations_path = root / 'explanation-by-ql.cp012-mixed.en.json'
          explanations = json.loads(explanations_path.read_text())
          line = explanations['entries']['PNC-QL-262']['lines'][1]
          addition = ' Binomial terms with impossible parameters are interpreted as zero.'
          if addition.strip() not in line:
              explanations['entries']['PNC-QL-262']['lines'][1] = line + addition
          explanations_path.write_text(json.dumps(explanations, indent=2) + '\n')
          PY
          if ! git diff --quiet -- \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/cp012-mixed-runtime.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/variable-ranges.cp012-mixed.library.json \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/explanation-by-ql.cp012-mixed.en.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add \
              artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/cp012-mixed-runtime.ts \
              artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/variable-ranges.cp012-mixed.library.json \
              artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/explanation-by-ql.cp012-mixed.en.json
            git commit -m "fix(pnc): remove CP-012 latent variables and clarify bounds"
            git push origin HEAD:feat/pnc-002-cp012-mixed-advanced-runtime-proof
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        shell: bash
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/pnc-002-cp012-diagnostics
          cp artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/cp012-mixed-runtime.ts artifacts/api-server/dist/quant-v4/pnc-002-cp012-diagnostics/cp012-mixed-runtime.ts
          cd artifacts/api-server
          set +e
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --resolveJsonModule \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/cp012-mixed-runtime.ts \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/cp012-mixed-runtime-reviewed.ts \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-cp012-mixed.test.ts \
            2>&1 | tee dist/quant-v4/pnc-002-cp012-diagnostics/typescript.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Bundle CP-012 runtime proof
        shell: bash
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/pnc-002-cp012-diagnostics
          set +e
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-cp012-mixed.test.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/pnc-002-cp012-proof.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/pnc-002-cp012-diagnostics/bundle.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Run CP-012 proof and generate review export
        working-directory: artifacts/api-server
        shell: bash
        run: |
          mkdir -p dist/quant-v4/pnc-002-cp012-diagnostics
          set +e
          node dist/quant-v4/pnc-002-cp012-proof.mjs 2>&1 | tee dist/quant-v4/pnc-002-cp012-diagnostics/runtime.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Publish CP-012 review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnc-002-cp012-question-explanation-review
          path: artifacts/api-server/dist/quant-v4/pnc-002-cp012-review/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish CP-012 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnc-002-cp012-diagnostics
          path: artifacts/api-server/dist/quant-v4/pnc-002-cp012-diagnostics/
          if-no-files-found: error
          retention-days: 3
