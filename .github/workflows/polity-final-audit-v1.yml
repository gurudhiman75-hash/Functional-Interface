name: Validate Polity POL-001 Final Audit V1

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/knowledge-v1/indian-polity/**
      - artifacts/api-server/src/question-studio/engines/knowledge-v1-pol001-adapter-v1.ts
      - artifacts/api-server/src/question-studio/engines/knowledge-v1-pol001-adapter-v1.test.ts
      - artifacts/api-server/src/question-studio/engines/knowledge-v1-adapter.ts
  push:
    branches:
      - New-main
    paths:
      - artifacts/api-server/src/knowledge-v1/indian-polity/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polity-final-audit-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pol001-final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile POL-001 final audit
        run: |
          mkdir -p artifacts/api-server/dist/polity
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/indian-polity/pol-001-final-audit-v1.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/polity/pol-001-final-audit-v1.mjs

      - name: Run POL-001 final audit
        run: node artifacts/api-server/dist/polity/pol-001-final-audit-v1.mjs

      - name: Run POL-001 CP001-CP002 multilingual parity audit
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/knowledge-v1/indian-polity/localization-v1/pol-cp001-cp002-localization-audit-v1.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/polity/pol-cp001-cp002-localization-audit-v1.mjs
          node dist/polity/pol-cp001-cp002-localization-audit-v1.mjs

      - name: Generate POL-001 CP001-CP002 multilingual review Markdown
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/knowledge-v1/indian-polity/localization-v1/pol-cp001-cp002-localization-export-v1.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/polity/pol-cp001-cp002-localization-export-v1.mjs
          node dist/polity/pol-cp001-cp002-localization-export-v1.mjs

      - name: Upload POL-001 CP001-CP002 multilingual review
        uses: actions/upload-artifact@v4
        with:
          name: polity-cp001-cp002-multilingual-review
          path: artifacts/api-server/dist/polity-review/POL-MULTILINGUAL-V1/*
          if-no-files-found: error
          retention-days: 30

      - name: Run POL-001 CP003-CP004 multilingual parity audit
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/knowledge-v1/indian-polity/localization-v1/pol-cp003-cp004-localization-audit-v1.ts \
            --bundle --packages=external --platform=node --format=esm \
