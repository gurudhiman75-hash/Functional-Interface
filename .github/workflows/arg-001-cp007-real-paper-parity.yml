name: Validate ARG-001 CP007 Real-Paper Parity

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp007-*'
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp006-*'
      - 'artifacts/api-server/src/routes/admin-question-studio-arguments-cp007-v2.ts'
      - 'artifacts/api-server/src/routes/admin-question-studio-registry.ts'
      - '.github/workflows/arg-001-cp007-real-paper-parity.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arg-001-cp007-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arg-cp007-real-paper-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair CP007 source typing on PR head and merge workspace
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          TARGET='artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp007-exam-profile-generator-v2.ts'

          repair() {
            python - "$TARGET" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          old = '  arguments: readonly [CandidateArgument, CandidateArgument, CandidateArgument, CandidateArgument];'
          new = '  arguments: readonly CandidateArgument[];'
          count = text.count(old)
          if count > 1:
              raise SystemExit(f'Expected at most one CP007 tuple contract, found {count}')
          if count == 1:
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          }

          git fetch origin "$HEAD_REF"
          git switch --detach "origin/$HEAD_REF"
          repair
          if ! git diff --quiet -- "$TARGET"; then
            git diff --check -- "$TARGET"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$TARGET"
            git commit -m 'fix(arg-001): repair CP007 argument container typing'
            git push origin "HEAD:$HEAD_REF"
          fi

          git switch --detach "$MERGE_SHA"
          repair
          git diff --check -- "$TARGET"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Strict TypeScript check for CP007 V2 profile generator
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowImportingTsExtensions \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/types.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp006-freeze-manifest.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp007-exam-profile-generator-v2.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp007-exam-profile-proof-v2.test.ts

      - name: Prove sourced profile coverage and trilingual semantics
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp007-exam-profile-proof-v2.test.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=dist/arg-001-cp007-real-paper-proof-v2.mjs
          node dist/arg-001-cp007-real-paper-proof-v2.mjs

      - name: Preserve exact CP006 frozen blobs
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp006-byte-freeze-proof.test.ts

      - name: Preserve CP006 behavioral freeze
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp006-freeze-proof.test.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=dist/arg-001-cp006-freeze-proof.mjs
          node dist/arg-001-cp006-freeze-proof.mjs

      - name: Preserve CP005 Question Studio core
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp005-question-studio-proof.test.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=dist/arg-001-cp005-question-studio-proof.mjs
          node dist/arg-001-cp005-question-studio-proof.mjs

      - name: Build production API
        working-directory: artifacts/api-server
        run: pnpm run build

      - name: Build production admin app
        working-directory: artifacts/admin-app
        run: pnpm run build

      - name: Lifecycle boundary
        run: |
          echo 'ARG-001 CP007 V2 adds sourced real-paper review profiles only.'
          echo 'The 29-file CP006 semantic/localization/runtime authority remains byte-identical.'
          echo 'Question Bank/test/mock/public/automatic learner publication remain locked.'
