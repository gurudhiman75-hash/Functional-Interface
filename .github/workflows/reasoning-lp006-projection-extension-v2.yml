name: Reasoning LP-006 Projection Extension V2

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-006-projection-extension-v1.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-006-projection-extension-v2.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-006-projection-extension-v2.test.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-006-projection-extension-v2-review-export.ts"
  workflow_dispatch:

concurrency:
  group: reasoning-lp006-projection-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove-projection-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove V2 explanation-only normalization
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-006-projection-extension-v2.test.ts
      - name: Reprove V1 semantic contract
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-006-projection-extension-v1.test.ts
      - name: Export V2 English review pack
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-006-projection-extension-v2-review-export.ts > LP-006-PROJECTION-EXTENSION-V2-REVIEW.md
      - uses: actions/upload-artifact@v4
        with:
          name: LP-006-PROJECTION-EXTENSION-V2-REVIEW
          path: LP-006-PROJECTION-EXTENSION-V2-REVIEW.md
          if-no-files-found: error
