name: Reasoning COD-001 CP-009 Exact Set and Missing

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-009/**"
      - ".github/workflows/reasoning-cod-001-cp009-exact-set-missing.yml"
  workflow_dispatch:

jobs:
  cp009-exact-set-missing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run exact set and missing-member audit
        id: prototype_audit
        shell: bash
        run: |
          set +e
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-009/exact-set-missing-prototype.test.ts > cod-cp009-exact-set-missing.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact set and missing-member diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod-001-cp009-exact-set-missing-audit
          path: cod-cp009-exact-set-missing.log
          retention-days: 7

      - name: Enforce exact set and missing-member result
        shell: bash
        run: |
          cat cod-cp009-exact-set-missing.log
          test "${{ steps.prototype_audit.outputs.exit_code }}" = "0"

      - name: Export exact set and missing-member review pack
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-009/export-exact-set-missing-review.ts cod-cp009-exact-set-missing-review-output

      - name: Upload exact set and missing-member review pack
        uses: actions/upload-artifact@v4
        with:
          name: cod-001-cp009-exact-set-missing-review
          path: cod-cp009-exact-set-missing-review-output
          retention-days: 7
