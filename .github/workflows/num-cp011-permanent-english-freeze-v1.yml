name: Validate NUM-CP-011 permanent allocation and English freeze

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-011/**"
      - ".github/workflows/num-cp011-permanent-english-freeze-v1.yml"
  workflow_dispatch:

concurrency:
  group: num-cp011-permanent-english-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-num-cp011-permanent-english:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Wave 01 regression
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-011/wave01/runtime.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp011-wave01-permanent-regression.mjs

      - name: Run Wave 01 regression
        run: node artifacts/api-server/dist/quant-v4/num-cp011-wave01-permanent-regression.mjs

      - name: Bundle Wave 02 regression
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-011/wave02/runtime.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp011-wave02-permanent-regression.mjs

      - name: Run Wave 02 regression
        run: node artifacts/api-server/dist/quant-v4/num-cp011-wave02-permanent-regression.mjs

      - name: Bundle Wave 03 runtime regression
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-011/wave03/runtime.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp011-wave03-permanent-regression.mjs

      - name: Run Wave 03 runtime regression
        run: node artifacts/api-server/dist/quant-v4/num-cp011-wave03-permanent-regression.mjs

      - name: Bundle Wave 03 edge conventions
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-011/wave03/edge-conventions.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp011-edge-conventions-permanent-regression.mjs

      - name: Run Wave 03 edge conventions
        run: node artifacts/api-server/dist/quant-v4/num-cp011-edge-conventions-permanent-regression.mjs

      - name: Bundle Wave 04 saturation regression
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-011/wave04/saturation.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp011-wave04-saturation-permanent-regression.mjs

      - name: Run Wave 04 saturation regression
        run: node artifacts/api-server/dist/quant-v4/num-cp011-wave04-saturation-permanent-regression.mjs

      - name: Bundle permanent allocation proof
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-011/permanent-allocation.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp011-permanent-allocation.mjs

      - name: Run permanent allocation proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-cp011-permanent-allocation.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-cp011-permanent-allocation.log

      - name: Bundle permanent English runtime proof
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-011/permanent-runtime.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp011-permanent-english-runtime.mjs

      - name: Run permanent English runtime proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-cp011-permanent-english-runtime.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-cp011-permanent-english-runtime.log

      - name: Bundle permanent English review exporter
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-011/permanent-review-export.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp011-permanent-review-export.mjs

      - name: Generate permanent English learner review
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/num-cp011-permanent-review-export.mjs 2>&1 | tee dist/quant-v4/num-cp011-permanent-review-export.log

      - name: Upload permanent English freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: num-cp011-permanent-english-freeze-v1
          path: |
            artifacts/api-server/dist/quant-v4/num-cp011-permanent-allocation.log
            artifacts/api-server/dist/quant-v4/num-cp011-permanent-english-runtime.log
            artifacts/api-server/dist/quant-v4/num-cp011-permanent-review-export.log
            artifacts/api-server/dist/quant-v4/num-cp011-permanent-english-review/audit.json
            artifacts/api-server/dist/quant-v4/num-cp011-permanent-english-review/review.json
            artifacts/api-server/dist/quant-v4/num-cp011-permanent-english-review/review.md
          if-no-files-found: error
          retention-days: 30
