name: Validate ARG-001 CP012 Editorial Remediation

on:
  push:
    branches:
      - feature/arg-001-cp012-editorial-remediation
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp012-*'
      - 'artifacts/api-server/src/routes/admin-question-studio-arguments-cp012.ts'
      - 'artifacts/api-server/src/routes/admin-question-studio-registry.ts'
      - '.github/workflows/arg-001-cp012-editorial-remediation.yml'
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp012-*'
      - 'artifacts/api-server/src/routes/admin-question-studio-arguments-cp012.ts'
      - 'artifacts/api-server/src/routes/admin-question-studio-registry.ts'
      - '.github/workflows/arg-001-cp012-editorial-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arg-001-cp012-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arg-cp012-editorial-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Strict TypeScript check for CP012-owned runtime
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowImportingTsExtensions \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp012-editorial-real-paper-remediation.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp012-editorial-real-paper-proof.test.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp012-question-studio-adapter.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp012-question-studio-proof.test.ts

      - name: Prove CP012 real-paper editorial remediation and cardinality anti-gaming
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp012-editorial-real-paper-proof.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/arg-001-cp012-editorial-real-paper-proof.mjs
          node dist/arg-001-cp012-editorial-real-paper-proof.mjs

      - name: Prove CP012 Question Studio activation and lifecycle locks
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp012-question-studio-proof.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/arg-001-cp012-question-studio-proof.mjs
          node dist/arg-001-cp012-question-studio-proof.mjs

      - name: Preserve CP010 correlated real-paper historical proof
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp010-correlated-real-paper-proof.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/arg-001-cp010-correlated-real-paper-proof.mjs
          node dist/arg-001-cp010-correlated-real-paper-proof.mjs

      - name: Preserve CP011 superseding-freeze evidence
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp011-superseding-freeze-proof.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/arg-001-cp011-superseding-freeze-proof.mjs
          node dist/arg-001-cp011-superseding-freeze-proof.mjs

      - name: Preserve exact CP006 historical core freeze
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp006-byte-freeze-proof.test.ts

      - name: Preserve exact CP008 historical real-paper freeze
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp008-byte-freeze-proof.test.ts

      - name: Build production API
        working-directory: artifacts/api-server
        run: pnpm run build

      - name: Build production admin app
        working-directory: artifacts/admin-app
        run: pnpm run build

      - name: CP012 lifecycle boundary
        run: |
          echo 'ARG-001 CP009 remains the core semantic authority.'
          echo 'ARG-001 CP012 supersedes CP010 only for the active real-paper editorial review path.'
          echo 'CP006/CP008/CP010/CP011 remain historical evidence and are not rewritten.'
          echo 'Learner release remains LOCKED pending manual editorial approval.'
          echo 'Question Bank/test/mock/public/automatic learner publication remain disabled.'
