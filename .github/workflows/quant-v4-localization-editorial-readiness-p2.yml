name: Quant V4 localization editorial readiness P2

on:
  push:
    branches:
      - audit/quant-v4-localization-editorial-readiness-p2
    paths:
      - "artifacts/api-server/src/quant-v4/quality/QUANT-V4-LOCALIZATION-EDITORIAL-READINESS-P2.md"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-localization-editorial-readiness-p2.test.ts"
      - "artifacts/api-server/src/quant-v4/topics/Probability/**"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/**"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/**"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/**"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/**"
      - ".github/workflows/quant-v4-localization-editorial-readiness-p2.yml"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/quality/QUANT-V4-LOCALIZATION-EDITORIAL-READINESS-P2.md"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-localization-editorial-readiness-p2.test.ts"
      - "artifacts/api-server/src/quant-v4/topics/Probability/**"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/**"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/**"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/**"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-v4-localization-editorial-p2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  localization-editorial-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle localization editorial P2 tests
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/localization-p2
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/quality/quant-v4-localization-editorial-readiness-p2.test.ts --bundle --platform=node --format=esm --packages=external --outfile=dist/quant-v4/localization-p2/editorial-readiness.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Probability/native-review-adapter.test.ts --bundle --platform=node --format=esm --packages=external --outfile=dist/quant-v4/localization-p2/probability-native-review.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Probability/native-editorial-quality-regression.test.ts --bundle --platform=node --format=esm --packages=external --outfile=dist/quant-v4/localization-p2/probability-editorial-wave01.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Probability/native-editorial-quality-wave02.test.ts --bundle --platform=node --format=esm --packages=external --outfile=dist/quant-v4/localization-p2/probability-editorial-wave02.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/post-final5-freeze-readiness.test.ts --bundle --platform=node --format=esm --packages=external --outfile=dist/quant-v4/localization-p2/trg001-final5-readiness.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/localization-cp007-v1.test.ts --bundle --platform=node --format=esm --packages=external --outfile=dist/quant-v4/localization-p2/trg002-cp007-localization.test.mjs

      - name: Guard current localization editorial lifecycle
        working-directory: artifacts/api-server
        run: node dist/quant-v4/localization-p2/editorial-readiness.test.mjs

      - name: Regress Probability native review boundary
        working-directory: artifacts/api-server
        run: node dist/quant-v4/localization-p2/probability-native-review.test.mjs

      - name: Regress Probability native editorial quality wave01
        working-directory: artifacts/api-server
        run: node dist/quant-v4/localization-p2/probability-editorial-wave01.test.mjs

      - name: Regress Probability native editorial quality wave02
        working-directory: artifacts/api-server
        run: node dist/quant-v4/localization-p2/probability-editorial-wave02.test.mjs

      - name: Regress TRG-001 post-Final5 freeze readiness
        working-directory: artifacts/api-server
        run: node dist/quant-v4/localization-p2/trg001-final5-readiness.test.mjs

      - name: Regress TRG-002 CP007 localization candidate
        working-directory: artifacts/api-server
        run: node dist/quant-v4/localization-p2/trg002-cp007-localization.test.mjs

      - name: Patch hygiene
        run: git diff --check
