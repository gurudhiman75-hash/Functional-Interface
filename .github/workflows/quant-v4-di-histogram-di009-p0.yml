name: Quant V4 Data Interpretation histogram DI V6

on:
  push:
    branches:
      - feature/di-009-histogram-promotion
    paths:
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-009/**"
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/visuals/**"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-009/**"
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/visuals/**"
  workflow_dispatch:

concurrency:
  group: quant-v4-di009-histogram-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  histogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Controlled-review lifecycle guard
        run: |
          test -d artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-009
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/visuals/histogram-svg.ts
          ! grep -R 'questionBankWritable: true\|testEligibility: "ELIGIBLE"\|testEligible: true\|mockTestEligible: true\|publiclyPublishable: true\|automaticStudentPublication: true\|productionReleaseAuthorized: true' artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-009
      - name: Histogram semantic architecture, deterministic, diversity, independent and shared visual proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-009/histogram-set.test.ts
      - name: Question Studio controlled-review integration proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-009/question-studio-integration.test.ts
      - name: Hindi Punjabi localization review proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-009/localization-review-v1.test.ts
      - name: Export Hindi Punjabi localization review pack
        run: |
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-009/export-localization-review-v1.ts /tmp/DI-009-LOCALIZATION-REVIEW-V1.md
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-009/export-localization-review-html-v1.ts /tmp/DI-009-LOCALIZATION-REVIEW-V1.html
      - name: Upload Hindi Punjabi localization review pack
        uses: actions/upload-artifact@v4
        with:
          name: di-009-localization-review-v1
          path: |
            /tmp/DI-009-LOCALIZATION-REVIEW-V1.md
            /tmp/DI-009-LOCALIZATION-REVIEW-V1.html
      - name: API server build
        run: pnpm --filter @workspace/api-server build
      - name: Patch hygiene
        run: git diff --check
