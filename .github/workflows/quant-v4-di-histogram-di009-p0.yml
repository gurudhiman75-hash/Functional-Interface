name: Quant V4 Data Interpretation histogram DI P0

on:
  push:
    branches:
      - feature/di-009-histogram-p0
    paths:
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-009/**"
      - ".github/workflows/quant-v4-di-histogram-di009-p0.yml"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-009/**"
      - ".github/workflows/quant-v4-di-histogram-di009-p0.yml"
  workflow_dispatch:

concurrency:
  group: quant-v4-di009-histogram-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  histogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Review-only lifecycle guard
        run: |
          test -d artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-009
          ! grep -R 'questionStudioDiscoverable: true\|questionBankWritable: true\|testEligibility: "ELIGIBLE"\|testEligible: true\|mockTestEligible: true\|publiclyPublishable: true\|automaticStudentPublication: true\|productionReleaseAuthorized: true' artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-009
      - name: Histogram deterministic and independent proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-009/histogram-set.test.ts
      - name: Export human review pack
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-009/export-review.ts DI-009-REVIEW-P0.md
      - uses: actions/upload-artifact@v4
        with:
          name: di-009-histogram-review-p0
          path: DI-009-REVIEW-P0.md
          if-no-files-found: error
          retention-days: 30
      - name: API server build
        run: pnpm --filter @workspace/api-server build
      - name: Patch hygiene
        run: git diff --check
