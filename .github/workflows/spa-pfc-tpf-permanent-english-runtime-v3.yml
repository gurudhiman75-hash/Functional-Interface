name: Validate SPA PFC TPF Permanent English Runtime V3

on:
  pull_request:
    branches: [New-main]
    paths:
      - "artifacts/api-server/src/reasoning-v1/foundation/spatial/**"
      - "artifacts/api-server/src/reasoning-v1/tests/spatial-*.test.ts"
      - "artifacts/admin-app/src/pages/content/QuestionStudioSpatialReviewPanel.tsx"
      - "artifacts/admin-app/src/pages/content/QuestionStudioSpatialReviewPanel.tsx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pfc-tpf-permanent-english-runtime-v3:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle PFC TPF English runtime V3 gate
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-paper-folding-permanent-english-runtime-v3.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-paper-folding-permanent-english-runtime-v3.test.mjs
      - name: Validate PFC TPF English runtime V3
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-permanent-english-runtime-v3.test.mjs
      - name: Upload PFC TPF English runtime V3 evidence
        uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: spa-pfc-tpf-permanent-english-runtime-v3
          path: artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-permanent-english-runtime-v3-evidence.json
          if-no-files-found: error
