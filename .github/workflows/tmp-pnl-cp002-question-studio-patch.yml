name: One-shot PNL CP-002 Question Studio routing patch

on:
  push:
    branches:
      - feat/pnl-001-cp002-question-studio-dynamic-review
    paths:
      - ".github/workflows/tmp-pnl-cp002-question-studio-patch.yml"
  pull_request:
    branches:
      - New-main
    paths:
      - ".github/workflows/tmp-pnl-cp002-question-studio-patch.yml"

permissions:
  contents: write

jobs:
  patch-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-cp002-question-studio-dynamic-review

      - name: Patch CP-specific dynamic routing and regression proof
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          engine = Path("artifacts/api-server/src/quant-v4/generation-engine.ts")
          source = engine.read_text()
          source, import_count = re.subn(
              r'import \{ runPnlCp001DynamicPipeline \} from "([^"]*/CP-001/cp001-dynamic-runtime)";',
              r'import { runPnlCp001DynamicPipeline } from "\1";\nimport { runPnlCp002DynamicPipeline } from "./topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-002/cp002-dynamic-runtime";',
              source,
              count=1,
          )
          if import_count != 1:
              raise SystemExit(f"Expected one CP-001 dynamic import, found {import_count}")
          source, ids_count = re.subn(
              r'const PNL_DYNAMIC_CP_IDS = \["PNL-CP-001"\] as const;',
              'const PNL_DYNAMIC_CP_IDS = ["PNL-CP-001", "PNL-CP-002"] as const;',
              source,
              count=1,
          )
          if ids_count != 1:
              raise SystemExit(f"Expected one dynamic CP list, found {ids_count}")
          block_start = source.index(
              '    const questionPackage = pnlRuntimeMode === "DYNAMIC_CANDIDATE"'
          )
          block_end = source.index("    results.push({", block_start)
          routing = '''    const questionPackage =
              pnlRuntimeMode === "DYNAMIC_CANDIDATE"
                ? cpId === "PNL-CP-001"
                  ? runPnlCp001DynamicPipeline({
                      difficultyBand,
                      language: language as "en",
                      questionLanguageId: request.questionLanguageId,
                      seed,
                    })
                  : cpId === "PNL-CP-002"
                    ? runPnlCp002DynamicPipeline({
                        difficultyBand,
                        language: language as "en",
                        questionLanguageId: request.questionLanguageId,
                        seed,
                      })
                    : (() => {
                        throw new QuantV4RequestError(
                          `No dynamic PNL runtime is registered for '${cpId}'.`,
                        );
                      })()
                : await pkg.run(cpId, {
                    difficulty: difficultyBand,
                    language,
                    questionLanguageId: request.questionLanguageId,
                    seed,
                  });
          '''.replace("          ", "")
          engine.write_text(source[:block_start] + routing + source[block_end:])

          integration = Path(
              "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/question-studio-integration.test.ts"
          )
          test = integration.read_text()
          replacements = [
              (
                  'assert.deepEqual((pnl as any).dynamicCandidateCpIds, ["PNL-CP-001"]);',
                  'assert.deepEqual((pnl as any).dynamicCandidateCpIds, ["PNL-CP-001", "PNL-CP-002"]);',
              ),
              (
                  '  assert.equal(questionPackage.canonicalProblemId, "PNL-CP-001");',
                  '  assert.ok(["PNL-CP-001", "PNL-CP-002"].includes(questionPackage.canonicalProblemId));',
              ),
              (
                  '      dynamicCandidateCpIds: ["PNL-CP-001"],',
                  '      dynamicCandidateCpIds: ["PNL-CP-001", "PNL-CP-002"],',
              ),
              (
                  '      canonicalProblemId: "PNL-CP-002",\n      seed: "pnl-dynamic-cp-safety",',
                  '      canonicalProblemId: "PNL-CP-003",\n      seed: "pnl-dynamic-cp-safety",',
              ),
              (
                  "/Unknown canonical problem 'PNL-CP-002'/,",
                  "/Unknown canonical problem 'PNL-CP-003'/,",
              ),
          ]
          for old, new in replacements:
              if test.count(old) != 1:
                  raise SystemExit(f"Integration proof expected one occurrence of: {old!r}")
              test = test.replace(old, new, 1)

          mixed_pattern = re.compile(
              r'assert\.deepEqual\(\n\s*\[\.\.\.new Set\(dynamicBatch\.questionPackages\.map\(\(pkg: any\) => pkg\.canonicalProblemId\)\)\],\n\s*\["PNL-CP-001"\],\n\s*"Dynamic candidate mode must be restricted to CP-001\."\,\n\s*\);'
          )
          mixed_replacement = '''assert.deepEqual(
            [
              ...new Set(
                dynamicBatch.questionPackages.map((pkg: any) => pkg.canonicalProblemId),
              ),
            ].sort(),
            ["PNL-CP-001", "PNL-CP-002"],
            "Dynamic candidate mode must be restricted to the two proven CP runtimes.",
          );'''.replace("          ", "")
          test, mixed_count = mixed_pattern.subn(mixed_replacement, test, count=1)
          if mixed_count != 1:
              raise SystemExit(f"Expected one mixed dynamic assertion, found {mixed_count}")
          integration.write_text(test)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run existing and CP-002 routing proofs
        run: |
          set -o pipefail
          for test in question-studio-integration.test.ts question-studio-cp002-dynamic-integration.test.ts; do
            output="src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.${test%.ts}.mjs"
            pnpm --dir artifacts/api-server exec esbuild \
              "src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/$test" \
              --bundle --platform=node --format=esm --outfile="$output" \
              2>&1 | tee -a pnl-cp002-question-studio-patch.log
            node "artifacts/api-server/$output" \
              2>&1 | tee -a pnl-cp002-question-studio-patch.log
          done

      - name: Commit proven routing patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/quant-v4/generation-engine.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/question-studio-integration.test.ts
          git commit -m "feat(pnl): route CP-002 dynamic candidates in Question Studio"
          git push origin HEAD:feat/pnl-001-cp002-question-studio-dynamic-review

      - name: Upload patch proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnl-cp002-question-studio-patch-proof
          path: pnl-cp002-question-studio-patch.log
          if-no-files-found: warn
          retention-days: 2
