name: Reasoning BLR-001 CP-001 Runtime

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/**"
      - ".github/workflows/reasoning-blr-001-cp001-prototype.yml"
  workflow_dispatch:

jobs:
  cp001-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run direct and composed relation audit
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-001/prototype.test.ts

      - name: Run identity, pair, claim, generation and branching audit
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-001/advanced-prototype.test.ts

      - name: Run gender and exact-lineage audit
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-001/lineage-prototype.test.ts

      - name: Run English editorial readiness audit
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-001/cp001-editorial-review.test.ts

      - name: Run human audit remediation gate
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-001/cp001-human-audit-remediation.test.ts

      - name: Run second source and gap audit
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-001/cp001-second-source-gap.test.ts

      - name: Enforce final discovery freeze
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-001/cp001-final-discovery-freeze.test.ts

      - name: Prove permanent English runtime
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-001/cp001-runtime.test.ts

      - name: Export remediated English review pack
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-001/export-cp001-review.ts blr-cp001-review-output

      - name: Export second source-gap appendix
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-001/export-cp001-second-gap-review.ts blr-cp001-review-output

      - name: Export permanent seven-QL review pack
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-001/export-cp001-permanent-review.ts blr-cp001-review-output

      - name: Upload BLR-CP-001 frozen English review pack
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp001-english-frozen-v1
          path: blr-cp001-review-output
          retention-days: 14
