name: Validate SPA Final Held-Gap Review V3

on:
  push:
    branches:
      - feature/spa-final-held-gap-v3-review-current-main
    paths:
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-final-held-gap-saturation-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-permanent-ql-allocation-v9.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-final-held-gap-review-runtime-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-final-held-gap-review-runtime-v2.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-final-held-gap-review-runtime-v3.ts
      - artifacts/api-server/src/reasoning-v1/tests/spatial-final-held-gap-review-runtime-v3.test.ts
      - artifacts/api-server/src/reasoning-v1/tests/spatial-final-held-gap-review-pack-v3.ts
      - .github/workflows/spa-final-held-gap-review-v3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle V3 runtime proof
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-final-held-gap-review-runtime-v3.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-final-held-gap-review-runtime-v3.test.mjs

      - name: Run V3 runtime proof
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-final-held-gap-review-runtime-v3.test.mjs 2>&1 \
            | tee dist/reasoning-v1/spatial/spa-final-held-gap-review-runtime-v3-run.log

      - name: Bundle V3 visual review pack generator
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-final-held-gap-review-pack-v3.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-final-held-gap-review-pack-v3.mjs

      - name: Generate V3 visual review pack
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-final-held-gap-review-pack-v3.mjs 2>&1 \
            | tee dist/reasoning-v1/spatial/spa-final-held-gap-review-pack-v3-run.log

      - name: Upload V3 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spa-final-held-gap-review-v3
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/spa-final-held-gap-review-runtime-v3-run.log
            artifacts/api-server/dist/reasoning-v1/spatial/spa-final-held-gap-review-runtime-v3-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-final-held-gap-review-pack-v3-run.log
            artifacts/api-server/dist/reasoning-v1/spatial/spa-final-held-gap-review-v3.html
            artifacts/api-server/dist/reasoning-v1/spatial/spa-final-held-gap-review-v3.json
          if-no-files-found: error