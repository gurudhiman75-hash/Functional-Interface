name: Validate SEA-002 CP008 Wave04 ALT12 saturation

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/**"
      - ".github/workflows/sea-002-cp008-wave04-alt12-saturation-v1.yml"
  workflow_dispatch:

concurrency:
  group: sea-002-cp008-wave04-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-sea-002-cp008-wave04:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove Wave04 source saturation
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/source-saturation-v3.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-source-saturation-v3.log

      - name: Independently solve source-backed ALT12 caselets
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/discovery-alt12-v1.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-alt12-discovery-v1.log

      - name: Freeze Wave04 solve-signature candidate set
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/solve-signature-v4.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-solve-signature-v4.log

      - name: Re-prove variable-side6 family
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/discovery-variable-side6-v1.test.ts

      - name: Re-prove ALT8 families
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/discovery-wave02-v1.test.ts

      - name: Re-prove CP007 approval boundary
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp007/review/prefreeze-authority-v1.test.ts

      - name: Upload Wave04 evidence
        uses: actions/upload-artifact@v4
        with:
          name: sea-002-cp008-wave04-alt12-saturation-v1
          path: |
            /tmp/sea-002-cp008-source-saturation-v3.log
            /tmp/sea-002-cp008-alt12-discovery-v1.log
            /tmp/sea-002-cp008-solve-signature-v4.log
          if-no-files-found: error
          retention-days: 30
