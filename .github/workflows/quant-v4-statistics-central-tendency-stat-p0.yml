name: Quant V4 Statistics central tendency STAT P0

on:
  push:
    branches:
      - feat/quant-v4-statistics-central-tendency-stat-p0
      - feature/stat-001-permanent-review-forward-port-v2
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Statistics/STAT-001/**"
      - "artifacts/api-server/src/quant-v4/topics/Statistics/shared/**"
      - "artifacts/api-server/src/question-studio/engines/quant-v4-adapter.ts"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Statistics/STAT-001/**"
      - "artifacts/api-server/src/quant-v4/topics/Statistics/shared/**"
      - "artifacts/api-server/src/question-studio/engines/quant-v4-adapter.ts"
  workflow_dispatch:

concurrency:
  group: quant-v4-statistics-stat-p0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  statistics-central-tendency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package namespace guard
        run: |
          test -d artifacts/api-server/src/quant-v4/topics/Statistics/STAT-001
          test ! -d artifacts/api-server/src/quant-v4/topics/Statistics/STA-001
          ! grep -R 'packageId: "STA-001"\|"STA-TEMP-' artifacts/api-server/src/quant-v4/topics/Statistics/STAT-001
      - name: Canonical STAT-001 API and permanent ownership proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Statistics/STAT-001/stat-001-api.test.ts
      - name: Generation and option scan
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Statistics/STAT-001/debug-generation-scan.ts
      - name: Central tendency deterministic proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Statistics/STAT-001/central-tendency.test.ts
      - name: Question Studio registry and lifecycle proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Statistics/STAT-001/question-studio-integration.test.ts
      - name: API server build
        run: pnpm --filter @workspace/api-server build
      - name: Patch hygiene
        run: git diff --check
