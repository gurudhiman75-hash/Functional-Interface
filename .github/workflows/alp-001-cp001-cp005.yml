name: Validate ALP-001 CP-001 through CP-005

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Alphabet-Test/ALP-001/**
      - .github/workflows/alp-001-cp001-cp005.yml

permissions:
  contents: read

concurrency:
  group: alp-001-cp001-cp005-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-alphabet-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Run ALP-001 chapter and localization audits
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Alphabet-Test/ALP-001
          OUT=dist/reasoning-v1/alp-001
          mkdir -p artifacts/api-server/$OUT
          for TEST in alp-001.test alp-001-localized.test alp-001-editorial-v2.test; do
            pnpm --dir artifacts/api-server exec esbuild \
              "$ROOT/$TEST.ts" \
              --bundle --platform=node --format=esm \
              --outfile="$OUT/$TEST.mjs"
            (cd artifacts/api-server && node "$OUT/$TEST.mjs")
          done
      - name: Run checkpoint audits
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Alphabet-Test/ALP-001
          OUT=dist/reasoning-v1/alp-001
          for CP in 001 002 003 004 005; do
            TEST="ALP-CP-$CP/alp-cp-$CP.test"
            pnpm --dir artifacts/api-server exec esbuild \
              "$ROOT/$TEST.ts" \
              --bundle --platform=node --format=esm \
              --outfile="$OUT/alp-cp-$CP.test.mjs"
            (cd artifacts/api-server && node "$OUT/alp-cp-$CP.test.mjs")
          done
      - name: Generate editorial-v2 review packs
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Alphabet-Test/ALP-001
          OUT=dist/reasoning-v1/alp-001
          REVIEW=artifacts/api-server/dist/reasoning-v1/alp-001/editorial-v2-review
          mkdir -p "$REVIEW"
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/export-review.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/export-review.mjs"
          (cd artifacts/api-server && node "$OUT/export-review.mjs" en-IN 3 "dist/reasoning-v1/alp-001/editorial-v2-review/alp-001-cp001-cp005-en-IN-editorial-v2-review.md")
          (cd artifacts/api-server && node "$OUT/export-review.mjs" hi-IN 2 "dist/reasoning-v1/alp-001/editorial-v2-review/alp-001-cp001-cp005-hi-IN-editorial-v2-review.md")
          (cd artifacts/api-server && node "$OUT/export-review.mjs" pa-IN 2 "dist/reasoning-v1/alp-001/editorial-v2-review/alp-001-cp001-cp005-pa-IN-editorial-v2-review.md")
          cat > "$REVIEW/README.txt" <<'EOF'
          ALP-001 CP-001 through CP-005 — Editorial V2 Review

          English: 104 QLs × 3 seeds = 312 questions
          Hindi:   104 QLs × 2 seeds = 208 questions
          Punjabi: 104 QLs × 2 seeds = 208 questions
          Total: 728 questions

          Review state: draft, unmerged and not publicly publishable.
          EOF
      - name: Upload editorial-v2 review packs
        uses: actions/upload-artifact@v4
        with:
          name: alp-001-cp001-cp005-editorial-v2-review
          path: artifacts/api-server/dist/reasoning-v1/alp-001/editorial-v2-review
          if-no-files-found: error
          retention-days: 14
