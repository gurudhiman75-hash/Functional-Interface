name: Validate complete ALP-001 chapter

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Alphabet-Test/ALP-001/**
      - .github/workflows/alp-001-cp001-cp005.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alp-001-complete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-alphabet-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/alp-001/chapter-complete-review
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Run chapter-wide audits
        id: chapter-audits
        continue-on-error: true
        run: |
          set -o pipefail
          ROOT=src/reasoning-v1/topics/Alphabet-Test/ALP-001
          OUT=dist/reasoning-v1/alp-001
          LOG=dist/reasoning-v1/alp-001/chapter-complete-review/chapter-audits.log
          STATUS=0
          mkdir -p artifacts/api-server/$OUT
          : > artifacts/api-server/$LOG
          for TEST in alp-001.test alp-001-completion.test alp-001-localized.test alp-001-editorial-v2.test; do
            {
              echo "===== $TEST ====="
              pnpm --dir artifacts/api-server exec esbuild \
                "$ROOT/$TEST.ts" \
                --bundle --platform=node --format=esm \
                --outfile="$OUT/$TEST.mjs"
              (cd artifacts/api-server && node "$OUT/$TEST.mjs")
            } 2>&1 | tee -a artifacts/api-server/$LOG || STATUS=$?
            if [ "$STATUS" -ne 0 ]; then break; fi
          done
          echo "$STATUS" > artifacts/api-server/dist/reasoning-v1/alp-001/chapter-complete-review/chapter-audits.status
          exit "$STATUS"
      - name: Run retained CP-001 through CP-005 regressions
        id: retained-audits
        if: steps.chapter-audits.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ROOT=src/reasoning-v1/topics/Alphabet-Test/ALP-001
          OUT=dist/reasoning-v1/alp-001
          LOG=dist/reasoning-v1/alp-001/chapter-complete-review/retained-checkpoints.log
          STATUS=0
          : > artifacts/api-server/$LOG
          for CP in 001 002 003 004 005; do
            TEST="ALP-CP-$CP/alp-cp-$CP.test"
            {
              echo "===== $TEST ====="
              pnpm --dir artifacts/api-server exec esbuild \
                "$ROOT/$TEST.ts" \
                --bundle --platform=node --format=esm \
                --outfile="$OUT/alp-cp-$CP.test.mjs"
              (cd artifacts/api-server && node "$OUT/alp-cp-$CP.test.mjs")
            } 2>&1 | tee -a artifacts/api-server/$LOG || STATUS=$?
            if [ "$STATUS" -ne 0 ]; then break; fi
          done
          echo "$STATUS" > artifacts/api-server/dist/reasoning-v1/alp-001/chapter-complete-review/retained-checkpoints.status
          exit "$STATUS"
      - name: Generate complete multilingual review packs
        if: steps.chapter-audits.outcome == 'success' && steps.retained-audits.outcome == 'success'
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Alphabet-Test/ALP-001
          OUT=dist/reasoning-v1/alp-001
          REVIEW=artifacts/api-server/dist/reasoning-v1/alp-001/chapter-complete-review
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/export-review.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/export-review.mjs"
          (cd artifacts/api-server && node "$OUT/export-review.mjs" en-IN 3 "dist/reasoning-v1/alp-001/chapter-complete-review/alp-001-cp001-cp010-en-IN-review.md")
          (cd artifacts/api-server && node "$OUT/export-review.mjs" hi-IN 2 "dist/reasoning-v1/alp-001/chapter-complete-review/alp-001-cp001-cp010-hi-IN-review.md")
          (cd artifacts/api-server && node "$OUT/export-review.mjs" pa-IN 2 "dist/reasoning-v1/alp-001/chapter-complete-review/alp-001-cp001-cp010-pa-IN-review.md")
          cat > "$REVIEW/README.txt" <<'EOF'
          ALP-001 CP-001 through CP-010 — Complete Chapter Review

          English: 156 QLs × 3 seeds = 468 questions
          Hindi:   156 QLs × 2 seeds = 312 questions
          Punjabi: 156 QLs × 2 seeds = 312 questions
          Total: 1,092 questions

          Review state: implemented chapter-complete candidate; not stored, test-eligible or publicly publishable.
          EOF
      - name: Upload complete chapter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alp-001-cp001-cp010-chapter-complete-review
          path: artifacts/api-server/dist/reasoning-v1/alp-001/chapter-complete-review
          if-no-files-found: error
          retention-days: 30
      - name: Enforce audit result
        if: always()
        run: |
          test "${{ steps.chapter-audits.outcome }}" = "success"
          test "${{ steps.retained-audits.outcome }}" = "success"
