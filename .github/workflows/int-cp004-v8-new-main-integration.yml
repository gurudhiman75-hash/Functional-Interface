name: Validate INT-CP-004 V8 New-main integration

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp004-**"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp004-**"
      - ".github/workflows/int-cp004-v8-new-main-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: int-cp004-v8-new-main-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-int-cp004-v8-new-main-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle English V2 freeze audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp004-english-freeze-v2-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp004-english-freeze-v2-audit.mjs

      - name: Run English V2 freeze audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp004-english-freeze-v2-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp004-english-freeze-v2-audit.log

      - name: Bundle V8 learner-surface audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp004-localization-v6-native-v8-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp004-localization-v6-native-v8-audit.mjs

      - name: Run V8 learner-surface audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp004-localization-v6-native-v8-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp004-localization-v6-native-v8-audit.log

      - name: Bundle V8 full review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp004-localization-v6-native-v8-review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp004-localization-v6-native-v8-review-export.mjs

      - name: Export V8 Hindi Punjabi full review packs
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp004-localization-v6-native-v8-review-export.mjs 2>&1 | tee dist/quant-v4/int-001-cp004-localization-v6-native-v8-review-export.log

      - name: Bundle immutable V8 freeze audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp004-hi-pa-v6-v8-freeze-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp004-hi-pa-v6-v8-freeze-audit.mjs

      - name: Run immutable V8 freeze audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp004-hi-pa-v6-v8-freeze-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp004-hi-pa-v6-v8-freeze-audit.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Verify closed delivery lifecycle and evidence
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          grep -q 'PASS_INT_CP004_APPROVED_ENGLISH_FREEZE_V2' artifacts/api-server/dist/quant-v4/int-001-cp004-english-freeze-v2-audit.log
          grep -q 'PASS_INT_CP004_HI_PA_V6_NATIVE_V8' artifacts/api-server/dist/quant-v4/int-001-cp004-localization-v6-native-v8-audit.log
          grep -q 'PASS_INT_CP004_HI_PA_V6_NATIVE_V8_REVIEW_EXPORT' artifacts/api-server/dist/quant-v4/int-001-cp004-localization-v6-native-v8-review-export.log
          grep -q 'PASS_INT_CP004_HI_PA_V6_V8_FREEZE' artifacts/api-server/dist/quant-v4/int-001-cp004-hi-pa-v6-v8-freeze-audit.log
          frozen=artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp004-localization-v6-native-v8-frozen.ts
          grep -q 'enabled: false' "$frozen"
          grep -q 'stagingStatus: "NOT_STAGED"' "$frozen"
          grep -q 'registrationStatus: "NOT_REGISTERED"' "$frozen"
          grep -q 'questionStudioDiscoverable: false' "$frozen"
          grep -q 'questionBankStatus: "NOT_STORED"' "$frozen"
          grep -q 'testEligibility: "INELIGIBLE"' "$frozen"
          grep -q 'publiclyPublishable: false' "$frozen"
