name: Apply PNC localization polish TypeScript fix

on:
  push:
    branches:
      - feat/pnc-002-hi-pa-localization
    paths:
      - .github/workflows/pnc-002-localization-polish-ts-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pnc-002-hi-pa-localization
      - name: Replace backreference strings with callbacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/localization-cp007-polished.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '.replace(/\\$([nk])\\$ के हर अनुमत मान पर/g, "दी गई सीमा में $\\1$ के हर संभव मान पर")',
              '.replace(/\\$([nk])\\$ के हर अनुमत मान पर/g, (_match, variable: string) => `दी गई सीमा में $${variable}$ के हर संभव मान पर`)',
          )
          text = text.replace(
              '.replace(/\\$([nk])\\$ ਦੇ ਹਰ ਮਨਜ਼ੂਰ ਮੁੱਲ ਉੱਤੇ/g, "ਦਿੱਤੀ ਹੱਦ ਵਿੱਚ $\\1$ ਦੇ ਹਰ ਸੰਭਵ ਮੁੱਲ ਉੱਤੇ")',
              '.replace(/\\$([nk])\\$ ਦੇ ਹਰ ਮਨਜ਼ੂਰ ਮੁੱਲ ਉੱਤੇ/g, (_match, variable: string) => `ਦਿੱਤੀ ਹੱਦ ਵਿੱਚ $${variable}$ ਦੇ ਹਰ ਸੰਭਵ ਮੁੱਲ ਉੱਤੇ`)',
          )
          if '\\1' in text:
              raise SystemExit("backreference escape remains")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/localization-cp007-polished.ts
          git commit -m "fix(pnc): use safe localization replacement callbacks"
          git push origin HEAD:feat/pnc-002-hi-pa-localization
