name: SRI Phase 9 patch C004-C localization

on:
  push:
    branches:
      - feature/sri-v4-phase9-localization-v1
    paths:
      - .github/workflows/sri-v4-phase9-patch-c004c-localization.yml

permissions:
  contents: write

jobs:
  patch-c004c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sri-v4-phase9-localization-v1
      - name: Insert exact whole-phrase localization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/permanent-localization-v1.ts')
          text = path.read_text(encoding='utf-8')
          rows = {
              'hi-IN': '    ["Recognize a^(mx) as (a^x)^m.", "a^(mx) को (a^x)^m के रूप में पहचानिए।"],\n',
              'pa-IN': '    ["Recognize a^(mx) as (a^x)^m.", "a^(mx) ਨੂੰ (a^x)^m ਦੇ ਰੂਪ ਵਿੱਚ ਪਛਾਣੋ।"],\n',
          }
          for locale, row in rows.items():
              anchor = f'  "{locale}": [\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f'Unexpected {locale} phrase-table anchor count')
              if row.strip() in text:
                  continue
              text = text.replace(anchor, anchor + row, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit durable phrase patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/permanent-localization-v1.ts
          git diff --cached --check
          git commit -m "SRI Phase 9: localize C004-C power recognition phrase"
          git push origin HEAD:feature/sri-v4-phase9-localization-v1
