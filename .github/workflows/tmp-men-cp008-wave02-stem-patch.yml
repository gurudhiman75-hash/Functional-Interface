name: Temporary MEN-CP-008 Wave02 stem patch

on:
  push:
    branches:
      - feat/men-002-cp008-gap-wave-02
    paths:
      - .github/workflows/tmp-men-cp008-wave02-stem-patch.yml

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/men-002-cp008-gap-wave-02
          fetch-depth: 0

      - name: Correct roller stem policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp008-gap-wave-02/runtime.ts')
          text = path.read_text(encoding='utf-8')
          old = '`Find the total swept area of a cylindrical roller with radius ${dimension(radius)}, length ${dimension(length)} and ${revolutions} revolutions.`'
          new = '`Find the total swept area of a cylindrical roller with radius ${dimension(radius)}, length ${dimension(length)} and ${revolutions} revolutions. Use $\\pi=22/7$.`'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one roller stem, found {count}.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp008-gap-wave-02/runtime.ts
          git commit -m "fix(mensuration): declare pi policy in every Wave02 roller stem"
          git push origin HEAD:feat/men-002-cp008-gap-wave-02
