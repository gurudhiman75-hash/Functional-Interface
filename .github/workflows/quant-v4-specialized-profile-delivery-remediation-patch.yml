name: Quant V4 specialized profile delivery remediation patch

on:
  push:
    branches:
      - audit/quant-v4-specialized-profile-delivery-remediation-p2
    paths:
      - ".github/workflows/quant-v4-specialized-profile-delivery-remediation-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/quant-v4-specialized-profile-delivery-remediation-p2
          fetch-depth: 0
      - name: Preserve examProfileId at admin ingress
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("artifacts/api-server/src/routes/admin-question-studio-average.ts")
          text = p.read_text()
          old = "  const explicit = asString(body?.examProfile).toUpperCase();"
          new = "  const explicit = asString(body?.examProfile ?? body?.examProfileId).toUpperCase();"
          if text.count(old) != 1:
              raise SystemExit(f"expected one admin profile resolver match, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/admin-question-studio-average.ts
          git diff --cached --check
          git commit -m "fix(quant-v4): preserve examProfileId at admin ingress"
          git push origin HEAD:audit/quant-v4-specialized-profile-delivery-remediation-p2
          # retry marker: final ingress alias pass
