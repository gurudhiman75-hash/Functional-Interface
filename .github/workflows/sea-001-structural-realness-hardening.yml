name: Validate SEA-001 structural realness hardening

on:
  push:
    branches:
      - feat/sea-001-structural-realness-hardening
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/**
      - .github/workflows/sea-001-structural-realness-hardening.yml
  pull_request:
    branches:
      - feat/sea-001-realness-final-gate
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  structural-realness-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sea-001-structural-realness-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply semantic answer-slot balancing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/generation/person-presentation.ts')
          text = path.read_text()
          old = '''    const random = new DeterministicRandom(
              `${presentationSeed}:visible-options:${child.queryContractId}:${child.answerDeterminingFactFingerprint}:Q${questionOrder}`,
            );
            const options = random.shuffle(child.options);
            const answerIndex = options.findIndex((option) => option.isCorrect);
            if (answerIndex < 0) throw new Error(`SEA-001 child ${child.queryContractId} lost its correct option`);
            return {
              ...child,
              questionOrder,
              options,
              answerIndex,
            };'''
          new = '''    const random = new DeterministicRandom(
              `${presentationSeed}:visible-distractors:${child.queryContractId}:${child.answerDeterminingFactFingerprint}:Q${questionOrder}`,
            );
            const shuffled = random.shuffle(child.options);
            const correctOption = shuffled.find((option) => option.isCorrect);
            if (!correctOption) throw new Error(`SEA-001 child ${child.queryContractId} lost its correct option`);
            const options = shuffled.filter((option) => !option.isCorrect);
            const answerIndex = (stableNumber(
              `${child.queryContractId}|${child.answerDeterminingFactFingerprint}|Q${questionOrder}|answer-slot-v1`,
            ) % 4) as 0 | 1 | 2 | 3;
            options.splice(answerIndex, 0, correctOption);
            return {
              ...child,
              questionOrder,
              options,
              answerIndex,
            };'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif 'answer-slot-v1' not in text:
              raise SystemExit('Expected SEA-001 option placement block not found; refusing broad edit')
          PY
          git diff --check
          if ! git diff --quiet -- artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/generation/person-presentation.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/generation/person-presentation.ts
            git commit -m "fix(seating): decouple answer slots from display names"
            git push origin HEAD:feat/sea-001-structural-realness-hardening
          fi
      - name: Validate affected generators
        run: |
          node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/sea-001-source-audit-proof.test.ts
          node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/cp003-proof.test.ts
          node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/cp004-proof.test.ts
      - name: Remeasure full 1,600-caselet realness gate
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/sea-001-structural-hardening-proof.test.ts
