name: MEN-001 CP-006 Review Diversity Patch

on:
  push:
    branches:
      - feat/men-001-cp006-runtime-proof
    paths:
      - .github/workflows/men-001-cp006-review-diversity-patch.yml

permissions:
  contents: write

jobs:
  patch-exporter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/men-001-cp006-runtime-proof

      - name: Scope distinct review samples to CP-006
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/human-review-export.ts")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '  "Three distinct deterministic samples are exported per active QL to CSV. The Markdown view shows the first sample for each QL.",',
                  '  "Three deterministic samples are exported per active QL to CSV. CP-006 samples are required to be distinct; the Markdown view shows the first sample for each QL.",',
              ),
              (
                  '  const seenQuestions = new Set<string>();',
                  '  const requireDistinctSamples = entry.cpId === "MEN-CP-006";\n  const seenQuestions = new Set<string>();',
              ),
              (
                  '    if (seenQuestions.has(fingerprint)) continue;',
                  '    if (requireDistinctSamples && seenQuestions.has(fingerprint)) continue;',
              ),
              (
                  '  if (selected.length !== REVIEW_SAMPLE_COUNT) {',
                  '  if (requireDistinctSamples && selected.length !== REVIEW_SAMPLE_COUNT) {',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}; found {count}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit scoped review guard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/human-review-export.ts
          git commit -m "fix(mensuration): scope distinct review guard to CP-006"
          git push origin HEAD:feat/men-001-cp006-runtime-proof
