name: Validate Notes Studio NS-009 Syllabus Planning

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/migrations/20260830_notes_studio_source_pack_ns009_planning.sql
      - artifacts/api-server/src/notes-studio/planning.ts
      - artifacts/api-server/src/notes-studio/planning.test.ts
      - artifacts/api-server/src/notes-studio/production-readiness.ts
      - artifacts/api-server/src/notes-studio/production-readiness.test.ts
      - artifacts/api-server/src/notes-studio/production-readiness-bootstrap.sql
      - artifacts/api-server/src/routes/admin-notes-studio-planning.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/admin-app/src/pages/content/NotesStudioPlanningPage.tsx
      - artifacts/admin-app/src/pages/content/NotesStudioHubPage.tsx
      - docs/notes-studio-ns009-syllabus-planning.md

permissions:
  contents: read

concurrency:
  group: notes-studio-ns009-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-notes-studio-syllabus-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run NS-009 planning contracts
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/planning.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-planning.test.mjs
          node artifacts/api-server/dist/notes-studio-planning.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/production-readiness.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-production-readiness.test.mjs
          node artifacts/api-server/dist/notes-studio-production-readiness.test.mjs

      - name: Verify planning boundaries
        run: |
          grep -F "'20260830_notes_studio_source_pack_ns009_planning.sql'" artifacts/api-server/src/notes-studio/production-readiness.ts
          grep -F "automaticSourceIngestion: false" artifacts/api-server/src/routes/admin-notes-studio-planning.ts
          grep -F "automaticGeneration: false" artifacts/api-server/src/routes/admin-notes-studio-planning.ts
          grep -F "automaticPublication: false" artifacts/api-server/src/routes/admin-notes-studio-planning.ts
          grep -F "source_language, state, brief, target_resource_id" artifacts/api-server/src/routes/admin-notes-studio-planning.ts
          grep -F "'brief'" artifacts/api-server/src/routes/admin-notes-studio-planning.ts
          grep -F 'adminNotesStudioPlanningRouter' artifacts/api-server/src/routes/index.ts
          grep -F 'Syllabus planning' artifacts/admin-app/src/pages/content/NotesStudioHubPage.tsx
          grep -F 'Automatic publication' artifacts/admin-app/src/pages/content/NotesStudioPlanningPage.tsx

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Typecheck admin app
        run: pnpm --dir artifacts/admin-app typecheck
