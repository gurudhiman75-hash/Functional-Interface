name: Apply DIR-CP-004 visible-guide layering fix

on:
  push:
    branches:
      - feat/dir-cp-004-relative-position
    paths:
      - .github/workflows/dir-001-runtime-proof.yml

permissions:
  contents: write

concurrency:
  group: apply-dir-cp-004-guide-layer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/dir-cp-004-relative-position

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Put query guide between relation edges and labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/DIR-CP-004")
          diagram = root / "relative-position-diagram.ts"
          text = diagram.read_text(encoding="utf-8")
          pattern = re.compile(r'  const usedLabelRects: RectGeometry\[\] = \[\];\n  const relationLines = relations\.map\(\(relation, index\) => \{.*?\n  \}\)\.join\(""\);\n\n  const queryOverlay', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit("Could not locate the relation rendering block")
          replacement = '''  const usedLabelRects: RectGeometry[] = [];
          const relationParts = relations.map((relation, index) => {
            const from = project(coordinates[relation.referenceEntity]);
            const to = project(coordinates[relation.subjectEntity]);
            const dx = to.x - from.x;
            const dy = to.y - from.y;
            const length = Math.hypot(dx, dy);
            if (length <= 1e-9) throw new Error("A displayed relation may not have zero length");
            const midX = (from.x + to.x) / 2;
            const midY = (from.y + to.y) / 2;
            const perpendicularX = -dy / length;
            const perpendicularY = dx / length;
            const side = index % 2 === 0 ? 1 : -1;
            const perpendicularOffsets = [side * 28, -side * 28, side * 43, -side * 43, side * 58, -side * 58, 0];
            const alongOffsets = [0, -24, 24, -42, 42];
            const unitX = dx / length;
            const unitY = dy / length;
            const width = 46;
            const height = 25;
            let labelRect: RectGeometry | null = null;
            for (const perpendicularOffset of perpendicularOffsets) {
              for (const alongOffset of alongOffsets) {
                const candidate = {
                  x: midX + perpendicularX * perpendicularOffset + unitX * alongOffset - width / 2,
                  y: midY + perpendicularY * perpendicularOffset + unitY * alongOffset - height / 2,
                  width,
                  height,
                };
                if (labelRectIsClear(candidate, projectedNodes, usedLabelRects)) {
                  labelRect = candidate;
                  break;
                }
              }
              if (labelRect) break;
            }
            if (!labelRect) throw new Error(`Unable to place relation label for ${relation.referenceEntity} and ${relation.subjectEntity}`);
            usedLabelRects.push(labelRect);
            const labelX = labelRect.x + labelRect.width / 2;
            const labelY = labelRect.y + labelRect.height / 2;
            return {
              edge: `<line data-role="relation-edge" x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" stroke="#64748b" stroke-width="2.5" marker-end="url(#relationArrow)"/>`,
              label: `<g data-role="relation-distance"><rect x="${labelRect.x}" y="${labelRect.y}" width="${labelRect.width}" height="${labelRect.height}" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="${labelX}" y="${labelY + 4}" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">${relation.distance} m</text></g>`,
            };
          });
          const relationEdges = relationParts.map(({ edge }) => edge).join("");
          const relationLabels = relationParts.map(({ label }) => label).join("");

          const queryOverlay'''
          text = text[:match.start()] + replacement + text[match.end():]
          old_order = '''    collinearGuide,
              queryOverlay,
              relationLines,
              nodes,'''
          new_order = '''    collinearGuide,
              relationEdges,
              queryOverlay,
              relationLabels,
              nodes,'''
          if text.count(old_order) != 1:
              raise SystemExit(f"Expected one SVG layer-order block, found {text.count(old_order)}")
          text = text.replace(old_order, new_order, 1)
          diagram.write_text(text, encoding="utf-8")

          test = root / "dir-cp-004.test.ts"
          t = test.read_text(encoding="utf-8")
          replacements = [
              (
                  "assert.ok(generated.explanation.diagram.svg.indexOf('data-role=\"query-relation-line\"') < generated.explanation.diagram.svg.indexOf('data-role=\"relation-distance\"'), \"Relation guide must remain behind labels\");",
                  "assert.ok(generated.explanation.diagram.svg.indexOf('data-role=\"relation-edge\"') < generated.explanation.diagram.svg.indexOf('data-role=\"query-relation-line\"'), \"Relation guide must remain visible above relation edges\");\n      assert.ok(generated.explanation.diagram.svg.indexOf('data-role=\"query-relation-line\"') < generated.explanation.diagram.svg.indexOf('data-role=\"relation-distance\"'), \"Relation guide must remain behind labels\");",
              ),
              (
                  "assert.ok(generated.explanation.diagram.svg.indexOf('data-role=\"query-relation-line\"') < generated.explanation.diagram.svg.indexOf('data-role=\"relation-distance\"'), \"Query line must remain behind relation labels\");",
                  "assert.ok(generated.explanation.diagram.svg.indexOf('data-role=\"relation-edge\"') < generated.explanation.diagram.svg.indexOf('data-role=\"query-relation-line\"'), \"Shortest-distance line must remain visible above relation edges\");\n      assert.ok(generated.explanation.diagram.svg.indexOf('data-role=\"query-relation-line\"') < generated.explanation.diagram.svg.indexOf('data-role=\"relation-distance\"'), \"Query line must remain behind relation labels\");",
              ),
              (
                  "assert.ok(generated.explanation.diagram.svg.indexOf('data-role=\"query-relation-line\"') < generated.explanation.diagram.svg.indexOf('data-role=\"relation-distance\"'), \"Lookup guide must remain behind labels\");",
                  "assert.ok(generated.explanation.diagram.svg.indexOf('data-role=\"relation-edge\"') < generated.explanation.diagram.svg.indexOf('data-role=\"query-relation-line\"'), \"Lookup guide must remain visible above relation edges\");\n      assert.ok(generated.explanation.diagram.svg.indexOf('data-role=\"query-relation-line\"') < generated.explanation.diagram.svg.indexOf('data-role=\"relation-distance\"'), \"Lookup guide must remain behind labels\");",
              ),
          ]
          for old, new in replacements:
              if t.count(old) != 1:
                  raise SystemExit(f"Expected one test assertion match, found {t.count(old)}: {old[:80]}")
              t = t.replace(old, new, 1)
          test.write_text(t, encoding="utf-8")
          PY

      - name: Validate strict TypeScript
        run: |
          cd artifacts/api-server
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/Direction-Sense/DIR-001 -name '*.ts' -print)

      - name: Run all DIR proofs and export CP-004 review
        run: |
          set -euo pipefail
          API=artifacts/api-server
          ROOT=src/reasoning-v1/topics/Direction-Sense/DIR-001
          bundle_run() {
            local source="$1"
            local output="$2"
            pnpm --dir "$API" exec esbuild "$source" --bundle --platform=node --format=esm --outfile="$output"
            node "$API/$output"
          }
          bundle_run "$ROOT/foundation/foundation.test.ts" "dist/reasoning-v1/dir-001-foundation.test.mjs"
          bundle_run "$ROOT/DIR-CP-001/dir-cp-001.test.ts" "dist/reasoning-v1/dir-cp-001.test.mjs"
          bundle_run "$ROOT/DIR-CP-002/dir-cp-002.test.ts" "dist/reasoning-v1/dir-cp-002.test.mjs"
          bundle_run "$ROOT/DIR-CP-003/dir-cp-003.test.ts" "dist/reasoning-v1/dir-cp-003.test.mjs"
          bundle_run "$ROOT/DIR-CP-004/dir-cp-004.test.ts" "dist/reasoning-v1/dir-cp-004.test.mjs"
          pnpm --dir "$API" exec esbuild "$ROOT/DIR-CP-004/dir-cp-004-generate-review-export.ts" --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/dir-cp-004-generate-review-export.mjs
          (cd "$API" && node dist/reasoning-v1/dir-cp-004-generate-review-export.mjs)

      - name: Commit validated layering fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/DIR-CP-004/relative-position-diagram.ts \
            artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/DIR-CP-004/dir-cp-004.test.ts
          git diff --cached --check
          git commit -m "fix(reasoning): keep CP-004 query guides visibly layered"
          git push origin HEAD:feat/dir-cp-004-relative-position
