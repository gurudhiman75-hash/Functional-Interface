name: Push validated DIR-CP-003 shortest-distance correction

on:
  pull_request:
    branches:
      - feat/reasoning-dir-001-design
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/dir-001-runtime-proof.yml
  push:
    branches:
      - feat/dir-cp-003-displacement
    paths:
      - .github/workflows/dir-001-runtime-proof.yml

permissions:
  contents: write

concurrency:
  group: push-dir-cp-003-shortest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/dir-cp-003-displacement
          fetch-depth: 0

      - name: Reapply previously validated guarded patch
        run: |
          git show 90d4b20ebc0922dac73d9ed08c1f2ff0496d0feb:.github/workflows/dir-001-runtime-proof.yml \
            | sed -n '39,247p' \
            | sed 's/^          //' \
            > /tmp/dir-cp-003-shortest-patch.py
          python /tmp/dir-cp-003-shortest-patch.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate transformed source
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          cd artifacts/api-server
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/Direction-Sense/DIR-001 -name '*.ts' -print)
          pnpm exec esbuild src/reasoning-v1/topics/Direction-Sense/DIR-001/DIR-CP-002/dir-cp-002.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/dir-cp-002.test.mjs
          node dist/reasoning-v1/dir-cp-002.test.mjs
          pnpm exec esbuild src/reasoning-v1/topics/Direction-Sense/DIR-001/DIR-CP-003/dir-cp-003.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/dir-cp-003.test.mjs
          node dist/reasoning-v1/dir-cp-003.test.mjs

      - name: Push source-only correction
        run: |
          git config user.name "ExamTree automation"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001
          git commit -m "fix(reasoning): illustrate CP-003 shortest-distance derivation"
          git push origin HEAD:feat/dir-cp-003-displacement
