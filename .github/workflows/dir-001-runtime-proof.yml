name: Apply and validate DIR-CP-004 source bundle

on:
  push:
    branches:
      - feat/dir-cp-004-relative-position
    paths:
      - .github/workflows/dir-001-runtime-proof.yml

permissions:
  contents: write

concurrency:
  group: apply-dir-cp-004-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CP-004 branch
        uses: actions/checkout@v4
        with:
          ref: feat/dir-cp-004-relative-position
          fetch-depth: 0

      - name: Reconstruct reviewed source bundle
        run: |
          cat .examtree-temp/dir-cp-004/part-* | base64 --decode > /tmp/cp004-source.tar.gz
          tar -tzf /tmp/cp004-source.tar.gz
          tar -xzf /tmp/cp004-source.tar.gz
          rm -rf .examtree-temp/dir-cp-004

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Strict typecheck DIR-001
        run: |
          cd artifacts/api-server
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/Direction-Sense/DIR-001 -name '*.ts' -print)

      - name: Run foundation and CP-001 proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Direction-Sense/DIR-001/foundation/foundation.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/dir-001-foundation.test.mjs
          node artifacts/api-server/dist/reasoning-v1/dir-001-foundation.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Direction-Sense/DIR-001/DIR-CP-001/dir-cp-001.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/dir-cp-001.test.mjs
          node artifacts/api-server/dist/reasoning-v1/dir-cp-001.test.mjs

      - name: Run CP-002 through CP-004 proofs
        run: |
          for cp in 002 003 004; do
            pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Direction-Sense/DIR-001/DIR-CP-${cp}/dir-cp-${cp}.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/dir-cp-${cp}.test.mjs
            node artifacts/api-server/dist/reasoning-v1/dir-cp-${cp}.test.mjs
          done

      - name: Generate CP-004 review files
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Direction-Sense/DIR-001/DIR-CP-004/dir-cp-004-generate-review-export.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/dir-cp-004-generate-review-export.mjs
          cd artifacts/api-server
          node dist/reasoning-v1/dir-cp-004-generate-review-export.mjs

      - name: Publish validated CP-004 review
        uses: actions/upload-artifact@v4
        with:
          name: dir-cp-004-question-review-precommit
          path: artifacts/api-server/dist/reasoning-v1/dir-cp-004-review-export/
          if-no-files-found: error
          retention-days: 7

      - name: Commit validated CP-004 source
        run: |
          git config user.name "ExamTree automation"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001 .examtree-temp/dir-cp-004
          git status --short
          git commit -m "feat(reasoning): implement DIR-CP-004 relative-position graphs"
          git push origin HEAD:feat/dir-cp-004-relative-position
