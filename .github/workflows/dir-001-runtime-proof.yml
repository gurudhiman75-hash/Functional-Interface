name: Apply reviewed DIR-CP-004 presentation refinements

on:
  push:
    branches:
      - feat/dir-cp-004-relative-position
    paths:
      - .github/workflows/dir-001-runtime-proof.yml

permissions:
  contents: write

concurrency:
  group: apply-dir-cp-004-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/dir-cp-004-relative-position

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply systemic review refinements
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/DIR-CP-004")

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          generator = root / "generator.ts"
          replace_once(
              generator,
              '      : `The shortest distance is √(${horizontal}² + ${vertical}²) = √${delta.squaredDistance} = ${distance} metres.`;',
              '      : `The shortest distance is √(${horizontal}² + ${vertical}²) = √(${horizontal ** 2} + ${vertical ** 2}) = √${delta.squaredDistance} = ${distance} metres.`;',
          )
          replace_once(
              generator,
              '      buildRelativePositionDiagram(graph.coordinates, graph.relations),\n      { subject, reference },',
              '      buildRelativePositionDiagram(graph.coordinates, graph.relations, { queryPair: { subject, reference } }),\n      { subject, reference },',
          )
          replace_once(
              generator,
              '      buildRelativePositionDiagram(graph.coordinates, graph.relations),\n      { reference, direction },',
              '      buildRelativePositionDiagram(graph.coordinates, graph.relations, { queryPair: { subject, reference } }),\n      { subject, reference, direction },',
          )

          diagram = root / "relative-position-diagram.ts"
          replace_once(
              diagram,
              '        const line = `<line data-role="query-relation-line" x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" stroke="#2563eb" stroke-width="3" stroke-dasharray="9 7" stroke-linecap="round"/>`;\n        if (!options.queryPair.shortestDistanceLabel) return line;',
              '        const guideKind = options.queryPair.shortestDistanceLabel ? "shortest-distance" : "relation-guide";\n        const line = `<line data-role="query-relation-line" data-guide-kind="${guideKind}" x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" stroke="${guideKind === "shortest-distance" ? "#2563eb" : "#93c5fd"}" stroke-width="${guideKind === "shortest-distance" ? 3 : 2.2}" stroke-dasharray="9 7" stroke-linecap="round" opacity="${guideKind === "shortest-distance" ? 1 : 0.82}"/>`;\n        if (!options.queryPair.shortestDistanceLabel) return line;',
          )

          test = root / "dir-cp-004.test.ts"
          replace_once(
              test,
              '      assert.equal(queryLines, 0);\n      assert.equal(distanceKeys, 0);\n      assert.ok(generated.stem.includes("In which direction"));',
              '      assert.equal(queryLines, 1);\n      assert.equal(distanceKeys, 0);\n      assert.ok(generated.explanation.diagram.svg.includes(\'data-guide-kind="relation-guide"\'));\n      assert.ok(generated.explanation.diagram.svg.indexOf(\'data-role="query-relation-line"\') < generated.explanation.diagram.svg.indexOf(\'data-role="relation-distance"\'), "Relation guide must remain behind labels");\n      assert.ok(generated.stem.includes("In which direction"));',
          )
          replace_once(
              test,
              '      assert.ok(generated.explanation.calculationLine?.includes("shortest distance") || generated.explanation.calculationLine?.includes("straight-line distance"));\n      assert.equal(queryLines, 1);\n      assert.equal(distanceKeys, 1);',
              '      assert.ok(generated.explanation.calculationLine?.includes("shortest distance") || generated.explanation.calculationLine?.includes("straight-line distance"));\n      const horizontal = Math.abs(coordinates[query.subject!].x - coordinates[query.reference!].x);\n      const vertical = Math.abs(coordinates[query.subject!].y - coordinates[query.reference!].y);\n      if (horizontal > 0 && vertical > 0) {\n        assert.ok(generated.explanation.calculationLine!.includes(`${horizontal ** 2} + ${vertical ** 2}`), "Pythagorean working must show the squared values being added");\n      }\n      assert.equal(queryLines, 1);\n      assert.equal(distanceKeys, 1);\n      assert.ok(generated.explanation.diagram.svg.includes(\'data-guide-kind="shortest-distance"\'));',
          )
          replace_once(
              test,
              '      const query = (generated.structuredPrompt.query ?? {}) as { readonly reference?: string; readonly direction?: string };',
              '      const query = (generated.structuredPrompt.query ?? {}) as { readonly subject?: string; readonly reference?: string; readonly direction?: string };',
          )
          replace_once(
              test,
              '      assert.equal(queryLines, 0);\n      assert.equal(distanceKeys, 0);\n      assert.ok(generated.stem.includes("Who is"));',
              '      assert.equal(query.subject, answer.entity);\n      assert.equal(queryLines, 1);\n      assert.equal(distanceKeys, 0);\n      assert.ok(generated.explanation.diagram.svg.includes(\'data-guide-kind="relation-guide"\'));\n      assert.ok(generated.explanation.diagram.svg.indexOf(\'data-role="query-relation-line"\') < generated.explanation.diagram.svg.indexOf(\'data-role="relation-distance"\'), "Lookup guide must remain behind labels");\n      assert.ok(generated.stem.includes("Who is"));',
          )
          PY

      - name: Validate strict TypeScript
        run: |
          cd artifacts/api-server
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/Direction-Sense/DIR-001 -name '*.ts' -print)

      - name: Run DIR regression and CP-004 proofs
        run: |
          set -euo pipefail
          API=artifacts/api-server
          ROOT=src/reasoning-v1/topics/Direction-Sense/DIR-001
          bundle_run() {
            local source="$1"
            local output="$2"
            pnpm --dir "$API" exec esbuild "$source" --bundle --platform=node --format=esm --outfile="$output"
            node "$API/$output"
          }
          bundle_run "$ROOT/foundation/foundation.test.ts" "dist/reasoning-v1/dir-001-foundation.test.mjs"
          bundle_run "$ROOT/DIR-CP-001/dir-cp-001.test.ts" "dist/reasoning-v1/dir-cp-001.test.mjs"
          bundle_run "$ROOT/DIR-CP-002/dir-cp-002.test.ts" "dist/reasoning-v1/dir-cp-002.test.mjs"
          bundle_run "$ROOT/DIR-CP-003/dir-cp-003.test.ts" "dist/reasoning-v1/dir-cp-003.test.mjs"
          bundle_run "$ROOT/DIR-CP-004/dir-cp-004.test.ts" "dist/reasoning-v1/dir-cp-004.test.mjs"
          pnpm --dir "$API" exec esbuild "$ROOT/DIR-CP-004/dir-cp-004-generate-review-export.ts" --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/dir-cp-004-generate-review-export.mjs
          (cd "$API" && node dist/reasoning-v1/dir-cp-004-generate-review-export.mjs)

      - name: Commit validated source refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/DIR-CP-004/generator.ts \
            artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/DIR-CP-004/relative-position-diagram.ts \
            artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/DIR-CP-004/dir-cp-004.test.ts
          git diff --cached --check
          git commit -m "fix(reasoning): clarify CP-004 target relations and distance working"
          git push origin HEAD:feat/dir-cp-004-relative-position
