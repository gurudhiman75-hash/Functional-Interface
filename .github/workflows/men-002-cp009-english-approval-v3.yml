name: Validate MEN-CP-009 English approval V3

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-009/**
      - .github/workflows/men-002-cp009-english-approval-v3.yml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-002-cp009-english-approval-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp009-english-approval-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove learner presentation V3 regression
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-009/coverage-v2/student-view-v3.test.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/men-cp009-student-view-v3.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp009-student-view-v3.test.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/men-cp009-student-view-v3.test.log

      - name: Prove explicit English approval wrapper
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-009/approved/english.test.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/men-cp009-approved-english-v3.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp009-approved-english-v3.test.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/men-cp009-approved-english-v3.test.log

      - name: Re-export reviewed learner HTML V3
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-009/coverage-v2/html-review-export-v3.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/men-cp009-html-review-export-v3.mjs
          cd artifacts/api-server
          node dist/quant-v4/men-cp009-html-review-export-v3.mjs \
            2>&1 | tee dist/quant-v4/men-cp009-html-review-export-v3.log
          test -s dist/quant-v4/MEN-CP-009-ENGLISH-REVIEW-V3.html
          test "$(grep -o 'class=\"question-card\"' dist/quant-v4/MEN-CP-009-ENGLISH-REVIEW-V3.html | wc -l)" -eq 110

      - name: Build production API bundle
        shell: bash
        run: bash build-api.sh

      - name: Upload CP-009 English approval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-cp009-english-approved-v3
          path: |
            artifacts/api-server/dist/quant-v4/men-cp009-student-view-v3.test.log
            artifacts/api-server/dist/quant-v4/men-cp009-approved-english-v3.test.log
            artifacts/api-server/dist/quant-v4/men-cp009-html-review-export-v3.log
            artifacts/api-server/dist/quant-v4/MEN-CP-009-ENGLISH-REVIEW-V3.html
          if-no-files-found: error
          retention-days: 14
