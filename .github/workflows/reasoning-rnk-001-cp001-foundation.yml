name: Validate RNK-001 CP-001 Foundation

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/**"
      - ".github/workflows/reasoning-rnk-001-cp001-foundation.yml"
  workflow_dispatch:

jobs:
  cp001-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run deterministic foundation and independent-solver audit
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-001/cp001-foundation.test.ts
          rnk-cp001-foundation-output

      - name: Run raw source and inverse-gap mathematical audit
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-001/cp001-source-wave.test.ts

      - name: Run reviewed source and inverse-gap editorial audit
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-001/cp001-source-wave-reviewed.test.ts
          rnk-cp001-source-wave-reviewed-output

      - name: Run raw final mirrored inverse mathematical audit
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-001/cp001-final-inverse-gap.test.ts

      - name: Prove provisional nine-authority consolidation
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-001/cp001-provisional-consolidation.test.ts
          rnk-cp001-consolidation-output

      - name: Prove provisional authority English review runtime
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-001/cp001-provisional-authority-runtime.test.ts
          rnk-cp001-authority-review-output

      - name: Humanize and audit English authority corpus
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-001/cp001-english-reviewed-authority-runtime.test.ts
          rnk-cp001-authority-review-output

      - name: Lock reviewed zero-one edge phrasing
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-001/cp001-english-manual-review-edge.test.ts

      - name: Enforce learner-facing review corpus hygiene
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-001/cp001-review-corpus-hygiene.test.ts
          rnk-cp001-review-hygiene-output

      - name: Enforce final source and gap audit
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-001/cp001-final-source-gap.test.ts
          rnk-cp001-final-source-gap-output

      - name: Enforce final English discovery freeze
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-001/cp001-final-discovery-freeze.test.ts
          rnk-cp001-freeze-output

      - name: Prove permanent English review runtime
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-001/cp001-permanent-runtime.test.ts
          rnk-cp001-permanent-output

      - name: Upload RNK-CP-001 frozen evidence
        uses: actions/upload-artifact@v4
        with:
          name: rnk-001-cp001-english-frozen-v1
          path: |
            rnk-cp001-foundation-output
            rnk-cp001-source-wave-reviewed-output
            rnk-cp001-consolidation-output
            rnk-cp001-authority-review-output
            rnk-cp001-review-hygiene-output
            rnk-cp001-final-source-gap-output
            rnk-cp001-freeze-output
            rnk-cp001-permanent-output
          retention-days: 14
