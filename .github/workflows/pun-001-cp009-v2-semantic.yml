name: Validate PUN-001 CP009 V2 Semantic

on:
  pull_request:
    branches:
      - feature/pun-001-cp008-v4-restored
    paths:
      - "artifacts/api-server/src/punjabi-v1/**"
      - ".github/workflows/pun-001-cp009-v2-semantic.yml"
  workflow_dispatch:

jobs:
  validate-cp009-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle CP009 V2 proof
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/punjabi-v1/packages/PUN-001/checkpoints/CP009/CP009.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/pun-001-cp009-v2.test.mjs

      - name: Run CP009 V2 proof
        working-directory: artifacts/api-server
        run: node dist/pun-001-cp009-v2.test.mjs

      - name: Run full Punjabi V1 regression
        working-directory: artifacts/api-server
        run: pnpm run test:punjabi-v1

      - name: Build API server
        working-directory: artifacts/api-server
        run: pnpm run build
