name: Quant V4 Data Interpretation table DI V2

on:
  push:
    branches:
      - feature/di-001-table-v2-review
    paths:
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-001/**"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-001/**"
  workflow_dispatch:

concurrency:
  group: quant-v4-di001-table-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  table-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Review-only lifecycle guard
        run: |
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-001/table-set-v2.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-001/table-v2-types.ts
          ! grep -R 'questionStudioDiscoverable: true\|questionBankWritable: true\|testEligibility: "ELIGIBLE"\|testEligible: true\|mockTestEligible: true\|publiclyPublishable: true\|automaticStudentPublication: true\|productionReleaseAuthorized: true' artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-001/table-set-v2.ts artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-001/table-v2-types.ts
      - name: DI-001 V2 deterministic, diversity and independent proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-001/table-set-v2.test.ts
      - name: Export Markdown review pack
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-001/export-review-v2.ts DI-001-REVIEW-V2.md
      - name: Export standalone HTML review pack
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-001/export-review-v2-html.ts DI-001-REVIEW-V2.html
      - uses: actions/upload-artifact@v4
        with:
          name: di-001-table-review-v2
          path: |
            DI-001-REVIEW-V2.md
            DI-001-REVIEW-V2.html
          if-no-files-found: error
          retention-days: 30
      - name: API server build
        run: pnpm --filter @workspace/api-server build
      - name: Patch hygiene
        run: git diff --check
