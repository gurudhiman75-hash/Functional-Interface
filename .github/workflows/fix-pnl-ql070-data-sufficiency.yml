name: Fix PNL QL-070 data sufficiency

on:
  push:
    branches:
      - feat/pnl-001-ql070-data-sufficiency
    paths:
      - ".github/workflows/fix-pnl-ql070-data-sufficiency.yml"

permissions:
  contents: write

