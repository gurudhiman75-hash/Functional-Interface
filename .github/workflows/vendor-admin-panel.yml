name: Validate integrated admin panel

on:
  push:
    branches:
      - replace-admin-with-new-panel
    paths:
      - artifacts/admin-app/**
      - artifacts/api-server/**
      - artifacts/examtree/src/App.tsx
      - package.json
      - pnpm-lock.yaml
      - firebase.json
      - scripts/assemble-hosting.mjs
      - .github/workflows/vendor-admin-panel.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: validate-integrated-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-admin-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout integration source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ExamTree API server with admin routes
        run: pnpm --dir artifacts/api-server build

      - name: Verify admin Question Studio route is bundled
        run: |
          grep -R "question_studio.generation_run.created" artifacts/api-server/dist >/dev/null
          grep -R "ADMIN_DATABASE_URL" artifacts/api-server/dist >/dev/null

      - name: Typecheck complete admin application
        id: admin_typecheck
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          pnpm run typecheck:admin > diagnostics/admin-ui-typecheck.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat diagnostics/admin-ui-typecheck.txt
          exit 0

      - name: Persist admin UI diagnostics
        if: github.event_name == 'push' && steps.admin_typecheck.outputs.status != '0' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/admin-ui-typecheck.txt
          git commit -m 'Record admin UI typecheck failure'
          git push origin HEAD:replace-admin-with-new-panel

      - name: Stop after admin UI typecheck failure
        if: steps.admin_typecheck.outputs.status != '0'
        run: exit 1

      - name: Test complete admin application
        run: pnpm run test:admin

      - name: Build complete admin application
        run: pnpm run build:admin

      - name: Build student application
        run: pnpm run build:web

      - name: Assemble single-site hosting output
        run: |
          node scripts/assemble-hosting.mjs
          test -f artifacts/examtree/dist/public/index.html
          test -f artifacts/examtree/dist/public/admin/index.html
