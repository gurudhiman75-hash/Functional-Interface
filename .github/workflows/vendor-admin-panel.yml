name: Validate integrated admin panel

on:
  push:
    branches:
      - replace-admin-with-new-panel
    paths:
      - artifacts/admin-app/**
      - artifacts/api-server/**
      - artifacts/examtree/src/**
      - docs/admin-panel-integration.md
      - docs/frontend-truth-audit.md
      - docs/database-migrations/**
      - package.json
      - pnpm-lock.yaml
      - firebase.json
      - scripts/assemble-hosting.mjs
      - .github/workflows/vendor-admin-panel.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/admin-app/**
      - artifacts/examtree/src/**
      - artifacts/api-server/src/routes/index.ts
      - artifacts/api-server/src/routes/admin-content-review.ts
      - artifacts/api-server/src/routes/admin-question-studio-quality.ts
      - artifacts/api-server/src/routes/admin-question-studio-regeneration.ts
      - artifacts/api-server/src/routes/admin-session.ts
      - artifacts/api-server/src/routes/admin-taxonomy*.ts
      - artifacts/api-server/src/routes/admin-test-qa*.ts
      - artifacts/api-server/src/routes/admin-test-blueprints.ts
      - artifacts/api-server/src/routes/admin-test-series.ts
      - artifacts/api-server/src/lib/admin-*.ts
      - artifacts/api-server/src/lib/question-studio-quality*.ts
      - artifacts/api-server/src/lib/question-studio-regeneration*.ts
      - artifacts/api-server/src/lib/db.ts
      - docs/admin-panel-integration.md
      - docs/frontend-truth-audit.md
      - docs/database-migrations/**
      - package.json
      - pnpm-lock.yaml
      - firebase.json
      - scripts/assemble-hosting.mjs
      - .github/workflows/vendor-admin-panel.yml

permissions:
  contents: read

concurrency:
  group: validate-integrated-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-admin-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout integration source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce canonical database freeze
        run: |
          if grep -R --exclude-dir=.git --exclude='vendor-admin-panel.yml' 'ADMIN_DATABASE_URL' artifacts docs render.yaml; then
            echo 'Second database configuration is forbidden.'
            exit 1
          fi
          test "$(grep -c 'postgres(connectionString)' artifacts/api-server/src/lib/db.ts)" -eq 1
          ! grep -R --include='*.ts' --include='*.mjs' -E 'postgres\((process\.env\.|[A-Z_]*DATABASE_URL)' artifacts/api-server/src

      - name: Enforce canonical admin surface
        run: |
          test ! -e artifacts/api-server/src/routes/admin-data.ts
          test ! -e artifacts/examtree/src/pages/admin.tsx
          test ! -e artifacts/examtree/src/pages/admin-generator.tsx
          test ! -e artifacts/examtree/src/lib/admin-repo.ts
          ! grep -R --include='*.ts' --include='*.tsx' '/admin-data' artifacts/api-server/src/routes/index.ts artifacts/admin-app/src artifacts/examtree/src
          ! grep -F 'DELETE FROM' artifacts/api-server/src/routes/index.ts

      - name: Enforce truthful frontend surface
        run: |
          ! grep -F 'PrototypeStoreProvider' artifacts/admin-app/src/App.tsx
          ! grep -F 'Prototype Mode' artifacts/admin-app/src/app/layout/Topbar.tsx
          ! grep -F 'PROTOTYPE_ROLES' artifacts/admin-app/src/app/layout/Topbar.tsx
          ! grep -E 'href: "/(packages|performance)"' artifacts/examtree/src/components/AppSidebar.tsx
          ! grep -F 'hydrateAdminDataFromCloud' artifacts/examtree/src/App.tsx
          grep -F 'Admin roadmap workspace' artifacts/admin-app/src/pages/PendingWorkspacePage.tsx
          grep -F 'No prototype or browser-local records are displayed' artifacts/admin-app/src/pages/PendingWorkspacePage.tsx
          grep -F 'canonical-attempt-history' artifacts/examtree/src/pages/activity.tsx
          grep -F "status: 'live'" artifacts/admin-app/src/app/nav/navigation.ts
          grep -F "status: 'in_progress'" artifacts/admin-app/src/app/nav/navigation.ts
          grep -F "status: 'planned'" artifacts/admin-app/src/app/nav/navigation.ts
          grep -F 'Question Studio' artifacts/admin-app/src/app/nav/navigation.ts
          grep -F 'Coverage Planner' artifacts/admin-app/src/app/nav/navigation.ts
          grep -F 'Orders & Payments' artifacts/admin-app/src/app/nav/navigation.ts
          grep -F 'Audit Logs' artifacts/admin-app/src/app/nav/navigation.ts
          grep -F 'collapsed || openGroups[group.id]' artifacts/admin-app/src/app/layout/Sidebar.tsx

      - name: Enforce Question Studio production gate
        run: |
          grep -F 'QuestionStudioOperationsPage' artifacts/admin-app/src/App.tsx
          grep -F 'QuestionStudioCockpitPage' artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx
          grep -F 'QuestionStudioRecoveryDock' artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx
          grep -F 'Retry all needs fix' artifacts/admin-app/src/pages/content/QuestionStudioRecoveryDock.tsx
          grep -F 'findDuplicateMatches' artifacts/admin-app/src/pages/content/QuestionStudioCockpitPage.tsx
          grep -F 'Create immutable revision' artifacts/admin-app/src/pages/content/QuestionStudioCockpitPage.tsx
          grep -F 'QUESTION_STUDIO_QUALITY_BLOCKED' artifacts/api-server/src/routes/admin-question-studio-quality.ts
          grep -F 'question_studio.generated_item.revised' artifacts/api-server/src/routes/admin-question-studio-quality.ts
          grep -F 'question_studio.generated_item.regenerated' artifacts/api-server/src/routes/admin-question-studio-regeneration.ts
          grep -F 'adminQuestionStudioRegenerationRouter' artifacts/api-server/src/routes/admin-question-studio-registry.ts
          grep -F 'adminQuestionStudioQualityRouter' artifacts/api-server/src/routes/admin-question-studio-registry.ts

      - name: Enforce canonical taxonomy and coverage
        run: |
          grep -F 'TaxonomyWorkspacePage' artifacts/admin-app/src/App.tsx
          grep -F 'CoveragePlannerPage' artifacts/admin-app/src/App.tsx
          grep -F 'Canonical hierarchy' artifacts/admin-app/src/pages/content/TaxonomyWorkspacePage.tsx
          grep -F 'coverage matrix' artifacts/admin-app/src/pages/content/CoveragePlannerPage.tsx
          grep -F 'adminTaxonomyRouter' artifacts/api-server/src/routes/index.ts
          grep -F 'adminTaxonomyCoverageRouter' artifacts/api-server/src/routes/index.ts
          grep -F 'catalog.taxonomy_node.created' artifacts/api-server/src/routes/admin-taxonomy.ts
          grep -F 'catalog.taxonomy_coverage.updated' artifacts/api-server/src/routes/admin-taxonomy-coverage.ts
          ! grep -F 'useQuestions' artifacts/admin-app/src/pages/content/CoveragePlannerPage.tsx
          ! grep -F '@/app/store/coverage' artifacts/admin-app/src/pages/content/CoveragePlannerPage.tsx
          grep -F "path: '/content/coverage'" artifacts/admin-app/src/app/nav/navigation.ts
          grep -F "path: '/content/taxonomy'" artifacts/admin-app/src/app/nav/navigation.ts

      - name: Enforce canonical content review
        run: |
          grep -F 'ContentReviewPage' artifacts/admin-app/src/App.tsx
          grep -F 'ContentReviewWorkspace' artifacts/admin-app/src/pages/content/ContentReviewPage.tsx
          grep -F 'useContentReviewController' artifacts/admin-app/src/pages/content/ContentReviewWorkspace.tsx
          grep -F 'Compare versions' artifacts/admin-app/src/pages/content/ContentReviewDetail.tsx
          grep -F 'content.review.assignment.changed' artifacts/api-server/src/routes/admin-content-review.ts
          grep -F 'content.review.comment.added' artifacts/api-server/src/routes/admin-content-review.ts
          grep -F 'content.review.comment.resolution.changed' artifacts/api-server/src/routes/admin-content-review.ts
          grep -F 'adminContentReviewRouter' artifacts/api-server/src/routes/index.ts
          ! grep -F 'usePrototypeStore' artifacts/admin-app/src/pages/content/ContentReviewPage.tsx
          ! grep -F '@/app/store/' artifacts/admin-app/src/pages/content/ContentReviewPage.tsx
          grep -F "path: '/content/review'" artifacts/admin-app/src/app/nav/navigation.ts

      - name: Enforce canonical Test QA
        run: |
          grep -F 'TestQAWorkspacePage' artifacts/admin-app/src/App.tsx
          grep -F 'CanonicalTestQaPage' artifacts/admin-app/src/pages/tests/TestQAWorkspacePage.tsx
          grep -F 'Server-enforced publish gate' artifacts/admin-app/src/pages/tests/CanonicalTestQaPage.tsx
          grep -F 'buildTestQaChecks' artifacts/admin-app/src/pages/tests/TestQaDetail.tsx
          grep -F 'assessment.test.qa_assignment.changed' artifacts/api-server/src/lib/admin-test-qa.ts
          grep -F 'assessment.test.qa_comment.added' artifacts/api-server/src/lib/admin-test-qa.ts
          grep -F 'assessment.test.qa_comment.resolution.changed' artifacts/api-server/src/lib/admin-test-qa.ts
          grep -F 'TEST_QA_GATE_BLOCKED' artifacts/api-server/src/routes/admin-test-qa-gate.ts
          grep -F 'adminTestQaRouter' artifacts/api-server/src/routes/index.ts
          grep -F 'adminTestQaGateRouter' artifacts/api-server/src/routes/index.ts
          ! grep -F 'usePrototypeStore' artifacts/admin-app/src/pages/tests/TestQAWorkspacePage.tsx
          ! grep -F '@/app/store/' artifacts/admin-app/src/pages/tests/TestQAWorkspacePage.tsx
          grep -F "path: '/tests/qa'" artifacts/admin-app/src/app/nav/navigation.ts

      - name: Enforce canonical Exam Blueprints
        run: |
          grep -F 'ExamBlueprintsPage' artifacts/admin-app/src/App.tsx
          grep -F 'Coverage preview and deterministic assembly' artifacts/admin-app/src/pages/tests/ExamBlueprintsWorkspacePage.tsx
          grep -F 'All blueprint quotas are satisfiable' artifacts/admin-app/src/pages/tests/ExamBlueprintsWorkspacePage.tsx
          grep -F 'adminTestBlueprintsRouter' artifacts/api-server/src/routes/index.ts
          grep -F 'assessment.test_blueprint.created' artifacts/api-server/src/routes/admin-test-blueprints.ts
          grep -F 'assessment.test_blueprint.version.created' artifacts/api-server/src/routes/admin-test-blueprints.ts
          grep -F 'assessment.test.assembled_from_blueprint' artifacts/api-server/src/routes/admin-test-blueprints.ts
          grep -F 'BLUEPRINT_ASSEMBLY_SHORTAGE' artifacts/api-server/src/routes/admin-test-blueprints.ts
          ! grep -F 'usePrototypeStore' artifacts/admin-app/src/pages/tests/ExamBlueprintsWorkspacePage.tsx
          ! grep -F '@/app/store/' artifacts/admin-app/src/pages/tests/ExamBlueprintsWorkspacePage.tsx
          grep -F "path: '/tests/blueprints'" artifacts/admin-app/src/app/nav/navigation.ts

      - name: Enforce canonical Test Series
        run: |
          grep -F 'TestSeriesPage' artifacts/admin-app/src/App.tsx
          grep -F 'Canonical immutable series versions' artifacts/admin-app/src/pages/tests/TestSeriesWorkspacePage.tsx
          grep -F 'Release readiness' artifacts/admin-app/src/pages/tests/TestSeriesWorkspacePage.tsx
          grep -F 'adminTestSeriesRouter' artifacts/api-server/src/routes/index.ts
          grep -F 'assessment.test_series.created' artifacts/api-server/src/routes/admin-test-series.ts
          grep -F 'assessment.test_series.version.created' artifacts/api-server/src/routes/admin-test-series.ts
          grep -F 'assessment.test_series.archived' artifacts/api-server/src/routes/admin-test-series.ts
          grep -F 'assessment.test_series.restored' artifacts/api-server/src/routes/admin-test-series.ts
          grep -F 'assessment.test_series_items' artifacts/api-server/src/routes/admin-test-series.ts
          grep -F 'CREATE TABLE assessment.test_series' docs/database-migrations/2026-07-20-canonical-test-series.sql
          ! grep -F 'usePrototypeStore' artifacts/admin-app/src/pages/tests/TestSeriesWorkspacePage.tsx
          ! grep -F '@/app/store/' artifacts/admin-app/src/pages/tests/TestSeriesWorkspacePage.tsx
          grep -F "path: '/tests/series'" artifacts/admin-app/src/app/nav/navigation.ts

      - name: Build ExamTree API server with admin routes
        run: pnpm --dir artifacts/api-server build

      - name: Verify admin production routes are bundled
        run: |
          grep -R "question_studio.generation_run.created" artifacts/api-server/dist >/dev/null
          grep -R "question_studio.generated_item.revised" artifacts/api-server/dist >/dev/null
          grep -R "question_studio.generated_item.regenerated" artifacts/api-server/dist >/dev/null
          grep -R "QUESTION_STUDIO_QUALITY_BLOCKED" artifacts/api-server/dist >/dev/null
          grep -R "catalog.taxonomy_node.created" artifacts/api-server/dist >/dev/null
          grep -R "catalog.taxonomy_coverage.updated" artifacts/api-server/dist >/dev/null
          grep -R "content.review.assignment.changed" artifacts/api-server/dist >/dev/null
          grep -R "content.review.comment.added" artifacts/api-server/dist >/dev/null
          grep -R "content.review.comment.resolution.changed" artifacts/api-server/dist >/dev/null
          grep -R "assessment.test.qa_assignment.changed" artifacts/api-server/dist >/dev/null
          grep -R "assessment.test.qa_comment.added" artifacts/api-server/dist >/dev/null
          grep -R "assessment.test.qa_comment.resolution.changed" artifacts/api-server/dist >/dev/null
          grep -R "TEST_QA_GATE_BLOCKED" artifacts/api-server/dist >/dev/null
          grep -R "assessment.test_blueprint.created" artifacts/api-server/dist >/dev/null
          grep -R "assessment.test_blueprint.version.created" artifacts/api-server/dist >/dev/null
          grep -R "assessment.test.assembled_from_blueprint" artifacts/api-server/dist >/dev/null
          grep -R "BLUEPRINT_ASSEMBLY_SHORTAGE" artifacts/api-server/dist >/dev/null
          grep -R "assessment.test_series.created" artifacts/api-server/dist >/dev/null
          grep -R "assessment.test_series.version.created" artifacts/api-server/dist >/dev/null
          grep -R "assessment.test_series.archived" artifacts/api-server/dist >/dev/null
          grep -R "DATABASE_URL environment variable is required" artifacts/api-server/dist >/dev/null
          grep -R "content.question.version.created" artifacts/api-server/dist >/dev/null
          grep -R "assessment.test.version.created" artifacts/api-server/dist >/dev/null
          grep -R "assessment.test.published" artifacts/api-server/dist >/dev/null
          ! grep "/admin-data" artifacts/api-server/dist/index.mjs

      - name: Test admin identity RBAC and content rules
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/lib/admin-rbac.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-rbac.test.mjs
          node artifacts/api-server/dist/admin-rbac.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/routes/admin-session.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-session.test.mjs
          node artifacts/api-server/dist/admin-session.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/lib/admin-question-management.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-question-management.test.mjs
          node artifacts/api-server/dist/admin-question-management.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/lib/admin-test-management.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-test-management.test.mjs
          node artifacts/api-server/dist/admin-test-management.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/lib/question-studio-quality.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/question-studio-quality.test.mjs
          node artifacts/api-server/dist/question-studio-quality.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/lib/question-studio-regeneration.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/question-studio-regeneration.test.mjs
          node artifacts/api-server/dist/question-studio-regeneration.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/lib/admin-taxonomy-management.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-taxonomy-management.test.mjs
          node artifacts/api-server/dist/admin-taxonomy-management.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/lib/admin-content-review.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-content-review.test.mjs
          node artifacts/api-server/dist/admin-content-review.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/lib/admin-test-qa.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-test-qa.test.mjs
          node artifacts/api-server/dist/admin-test-qa.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/lib/admin-test-blueprint.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-test-blueprint.test.mjs
          node artifacts/api-server/dist/admin-test-blueprint.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/lib/admin-test-series.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-test-series.test.mjs
          node artifacts/api-server/dist/admin-test-series.test.mjs

      - name: Typecheck complete admin application
        id: admin_typecheck
        continue-on-error: true
        run: pnpm run typecheck:admin > admin-typecheck.log 2>&1

      - name: Upload admin typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-typecheck-log
          path: admin-typecheck.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Enforce admin typecheck result
        if: steps.admin_typecheck.outcome == 'failure'
        run: |
          cat admin-typecheck.log
          exit 1

      - name: Test complete admin application
        run: pnpm run test:admin

      - name: Build complete admin application
        run: pnpm run build:admin

      - name: Build student application
        run: pnpm run build:web

      - name: Assemble single-site hosting output
        run: |
          node scripts/assemble-hosting.mjs
          test -f artifacts/examtree/dist/public/index.html
          test -f artifacts/examtree/dist/public/admin/index.html