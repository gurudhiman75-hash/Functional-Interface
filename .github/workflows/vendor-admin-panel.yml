name: Validate integrated admin panel

on:
  push:
    branches:
      - replace-admin-with-new-panel
    paths:
      - artifacts/admin-app/**
      - artifacts/api-server/**
      - artifacts/examtree/src/**
      - docs/admin-panel-integration.md
      - package.json
      - pnpm-lock.yaml
      - firebase.json
      - scripts/assemble-hosting.mjs
      - .github/workflows/vendor-admin-panel.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: validate-integrated-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-admin-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout integration source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce canonical database freeze
        run: |
          if grep -R --exclude-dir=.git --exclude='vendor-admin-panel.yml' 'ADMIN_DATABASE_URL' artifacts docs render.yaml; then
            echo 'Second database configuration is forbidden.'
            exit 1
          fi
          test "$(grep -c 'postgres(connectionString)' artifacts/api-server/src/lib/db.ts)" -eq 1
          ! grep -R --include='*.ts' --include='*.mjs' -E 'postgres\((process\.env\.|[A-Z_]*DATABASE_URL)' artifacts/api-server/src

      - name: Enforce canonical admin surface
        run: |
          test ! -e artifacts/api-server/src/routes/admin-data.ts
          test ! -e artifacts/examtree/src/pages/admin.tsx
          test ! -e artifacts/examtree/src/pages/admin-generator.tsx
          test ! -e artifacts/examtree/src/lib/admin-repo.ts
          ! grep -R --include='*.ts' --include='*.tsx' '/admin-data' artifacts/api-server/src/routes/index.ts artifacts/admin-app/src artifacts/examtree/src
          ! grep -E 'DELETE FROM ["'"']?(questions|tests|categories|subcategories)["'"']?' artifacts/api-server/src/routes/index.ts

      - name: Build ExamTree API server with admin routes
        run: pnpm --dir artifacts/api-server build

      - name: Verify admin production routes are bundled
        run: |
          grep -R "question_studio.generation_run.created" artifacts/api-server/dist >/dev/null
          grep -R "DATABASE_URL environment variable is required" artifacts/api-server/dist >/dev/null
          grep -R "content.question.version.created" artifacts/api-server/dist >/dev/null
          grep -R "assessment.test.version.created" artifacts/api-server/dist >/dev/null
          grep -R "assessment.test.published" artifacts/api-server/dist >/dev/null
          ! grep "/admin-data" artifacts/api-server/dist/index.mjs

      - name: Test admin identity RBAC and content rules
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/lib/admin-rbac.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-rbac.test.mjs
          node artifacts/api-server/dist/admin-rbac.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/routes/admin-session.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-session.test.mjs
          node artifacts/api-server/dist/admin-session.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/lib/admin-question-management.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-question-management.test.mjs
          node artifacts/api-server/dist/admin-question-management.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/lib/admin-test-management.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-test-management.test.mjs
          node artifacts/api-server/dist/admin-test-management.test.mjs

      - name: Typecheck complete admin application
        id: admin_typecheck
        continue-on-error: true
        run: pnpm run typecheck:admin > admin-typecheck.log 2>&1

      - name: Upload admin typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-typecheck-log
          path: admin-typecheck.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Enforce admin typecheck result
        if: steps.admin_typecheck.outcome == 'failure'
        run: |
          cat admin-typecheck.log
          exit 1

      - name: Test complete admin application
        run: pnpm run test:admin

      - name: Build complete admin application
        run: pnpm run build:admin

      - name: Build student application
        run: pnpm run build:web

      - name: Assemble single-site hosting output
        run: |
          node scripts/assemble-hosting.mjs
          test -f artifacts/examtree/dist/public/index.html
          test -f artifacts/examtree/dist/public/admin/index.html
