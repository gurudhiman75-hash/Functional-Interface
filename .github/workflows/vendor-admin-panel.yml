name: Validate integrated admin panel

on:
  push:
    branches:
      - replace-admin-with-new-panel
    paths:
      - artifacts/admin-app/**
      - artifacts/api-server/**
      - artifacts/examtree/src/**
      - docs/admin-panel-integration.md
      - package.json
      - pnpm-lock.yaml
      - firebase.json
      - scripts/assemble-hosting.mjs
      - .github/workflows/vendor-admin-panel.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: validate-integrated-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-admin-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout integration source
        uses: actions/checkout@v4
        with:
          ref: fix/question-publish-visibility
          fetch-depth: 0

      - name: Apply question publishing visibility hotfix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          detail_path = Path('artifacts/admin-app/src/pages/content/QuestionDetailPage.tsx')
          detail = detail_path.read_text()

          if "const canPublish = hasPermission('content.questions.publish') || canApprove;" not in detail:
              detail = detail.replace(
                  "  const canArchive = hasPermission('content.questions.delete');",
                  "  const canArchive = hasPermission('content.questions.delete');\n  const canPublish = hasPermission('content.questions.publish') || canApprove;",
              )

          detail = detail.replace(
              "          <PublishingReadiness detail={detail} />",
              "          <PublishingReadiness\n            detail={detail}\n            canPublish={canPublish}\n            saving={saving}\n            onPublish={() => void runAction('publish', 'Question published')}\n          />",
          )
          detail = detail.replace(
              "              {canApprove && question.status === 'approved' && (",
              "              {canPublish && question.status === 'approved' && (",
          )

          old_signature = "function PublishingReadiness({ detail }: { detail: QuestionDetailResponse }) {\n  if (detail.question.publishedVersionId) {"
          new_signature = """function PublishingReadiness({
  detail,
  canPublish,
  saving,
  onPublish,
}: {
  detail: QuestionDetailResponse;
  canPublish: boolean;
  saving: boolean;
  onPublish: () => void;
}) {
  if (detail.question.publishedVersionId) {"""
          detail = detail.replace(old_signature, new_signature)

          old_ready = """      <CardContent>
        {detail.publicationIssues.length === 0 ? (
          <p className=\"text-sm font-medium text-success\">Ready to publish.</p>
        ) : ("""
          new_ready = """      <CardContent className=\"space-y-3\">
        {detail.publicationIssues.length === 0 ? (
          <>
            <p className=\"text-sm font-medium text-success\">Ready to publish.</p>
            {detail.question.status === 'approved' && canPublish && (
              <Button className=\"w-full\" onClick={onPublish} disabled={saving}>
                {saving ? (
                  <Loader2 className=\"mr-1.5 h-4 w-4 animate-spin\" />
                ) : (
                  <Rocket className=\"mr-1.5 h-4 w-4\" />
                )}
                Publish to Test Builder
              </Button>
            )}
            {detail.question.status === 'approved' && !canPublish && (
              <p className=\"text-xs text-muted-foreground\">
                Your role does not include question publishing permission.
              </p>
            )}
          </>
        ) : ("""
          detail = detail.replace(old_ready, new_ready)
          detail_path.write_text(detail)

          context_path = Path('artifacts/admin-app/src/integrations/AdminPermissionContext.tsx')
          context = context_path.read_text()
          context = context.replace(
              """  const hasPermission = (permission: string) => Boolean(
    session?.permissions.includes('*') || session?.permissions.includes(permission),
  );""",
              """  const hasPermission = (permission: string) => Boolean(
    session?.roles.includes('super_admin')
      || session?.permissions.includes('*')
      || session?.permissions.includes(permission),
  );""",
          )
          context_path.write_text(context)

          management_path = Path('artifacts/api-server/src/lib/admin-question-management.ts')
          management = management_path.read_text().replace(
              """  publish: {
    status: \"published\",
    permission: \"content.questions.approve\",""",
              """  publish: {
    status: \"published\",
    permission: \"content.questions.publish\",""",
          )
          management_path.write_text(management)

          test_path = Path('artifacts/api-server/src/lib/admin-question-management.test.ts')
          test_text = test_path.read_text()
          assertion = '  assert.equal(getQuestionLifecycleConfig("publish").permission, "content.questions.publish");'
          if assertion not in test_text:
              test_text = test_text.replace(
                  '  assert.equal(getQuestionLifecycleConfig("publish").status, "published");',
                  '  assert.equal(getQuestionLifecycleConfig("publish").status, "published");\n' + assertion,
              )
          test_path.write_text(test_text)
          PY

      - name: Commit generated hotfix when needed
        run: |
          if git diff --quiet; then
            echo "Hotfix already applied."
            exit 0
          fi
          git config user.name "ExamTree CI"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/admin-app/src/pages/content/QuestionDetailPage.tsx \
                  artifacts/admin-app/src/integrations/AdminPermissionContext.tsx \
                  artifacts/api-server/src/lib/admin-question-management.ts \
                  artifacts/api-server/src/lib/admin-question-management.test.ts
          git commit -m "fix(admin): expose question publishing action"
          git push origin HEAD:fix/question-publish-visibility

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ExamTree API server with admin routes
        run: pnpm --dir artifacts/api-server build

      - name: Verify admin production routes are bundled
        run: |
          grep -R "question_studio.generation_run.created" artifacts/api-server/dist >/dev/null
          grep -R "ADMIN_DATABASE_URL" artifacts/api-server/dist >/dev/null
          grep -R "content.question.version.created" artifacts/api-server/dist >/dev/null
          grep -R "assessment.test.version.created" artifacts/api-server/dist >/dev/null
          grep -R "assessment.test.published" artifacts/api-server/dist >/dev/null

      - name: Test admin identity RBAC and content rules
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
          ADMIN_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/lib/admin-rbac.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-rbac.test.mjs
          node artifacts/api-server/dist/admin-rbac.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/routes/admin-session.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-session.test.mjs
          node artifacts/api-server/dist/admin-session.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/lib/admin-question-management.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-question-management.test.mjs
          node artifacts/api-server/dist/admin-question-management.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/lib/admin-test-management.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-test-management.test.mjs
          node artifacts/api-server/dist/admin-test-management.test.mjs

      - name: Typecheck complete admin application
        id: admin_typecheck
        continue-on-error: true
        run: pnpm run typecheck:admin > admin-typecheck.log 2>&1

      - name: Upload admin typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-typecheck-log
          path: admin-typecheck.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Enforce admin typecheck result
        if: steps.admin_typecheck.outcome == 'failure'
        run: |
          cat admin-typecheck.log
          exit 1

      - name: Test complete admin application
        run: pnpm run test:admin

      - name: Build complete admin application
        run: pnpm run build:admin

      - name: Build student application
        run: pnpm run build:web

      - name: Assemble single-site hosting output
        run: |
          node scripts/assemble-hosting.mjs
          test -f artifacts/examtree/dist/public/index.html
          test -f artifacts/examtree/dist/public/admin/index.html
