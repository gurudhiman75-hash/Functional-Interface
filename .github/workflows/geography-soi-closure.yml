name: Validate GEO-SOI-001 Chapter Closure
on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/indian-geography/soils/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geo-soi-001-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate-soils-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run GEO-SOI-001 chapter closure audit
        run: |
          mkdir -p artifacts/api-server/dist/geography
          pnpm --dir artifacts/api-server exec esbuild src/knowledge-v1/indian-geography/soils/geo-soi-001-chapter-closure-v1.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/geography/geo-soi-001-chapter-closure-v1.test.mjs
          node artifacts/api-server/dist/geography/geo-soi-001-chapter-closure-v1.test.mjs
      - name: Materialize closure report
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/knowledge-v1/indian-geography/soils/geo-soi-001-export-closure-v1.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/geography/geo-soi-001-export-closure-v1.mjs
          cd artifacts/api-server
          node dist/geography/geo-soi-001-export-closure-v1.mjs
      - name: Upload closure report
        uses: actions/upload-artifact@v4
        with:
          name: GEO-SOI-001-CHAPTER-CLOSURE-AUDIT-V1
          path: artifacts/api-server/dist/geography-review/GEO-SOI-001-CLOSURE-V1/
          if-no-files-found: error
          retention-days: 30
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
