name: Validate Question Studio async enqueue foundation
on:
  pull_request:
    branches: [New-main]
    paths:
      - 'artifacts/api-server/migrations/20261013_question_studio_async_enqueue_idempotency.sql'
      - 'artifacts/api-server/src/question-studio/async-enqueue-contract.ts'
      - 'artifacts/api-server/src/question-studio/async-enqueue-foundation.ts'
      - 'artifacts/api-server/src/question-studio/async-enqueue-contract.test.ts'
      - 'tests/qs-async-enqueue-foundation-contract.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qs-async-enqueue-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  enqueue-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce non-live, idempotent transaction contract
        run: node --test tests/qs-async-enqueue-foundation-contract.test.mjs
      - name: Install locked API dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile --filter @workspace/api-server...
      - name: Compile isolated queue intent service
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/question-studio/async-enqueue-foundation.ts --platform=node --format=esm --target=node22 --outfile=dist/question-studio/async-enqueue-foundation.mjs
      - name: Execute canonical hashing and identity unit tests
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/question-studio/async-enqueue-contract.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=dist/question-studio/async-enqueue-contract.test.mjs
          node artifacts/api-server/dist/question-studio/async-enqueue-contract.test.mjs
      - name: Patch hygiene
        run: git diff --check
