name: Validate Question Studio route registry

on:
  pull_request:
    branches: [New-main]
    paths:
      - 'artifacts/api-server/src/routes/admin-question-studio-registry.ts'
      - 'artifacts/api-server/src/routes/admin-question-studio-*.ts'
      - 'artifacts/api-server/src/routes/index.ts'
      - 'artifacts/api-server/src/question-studio/build-question-studio-capabilities-manifest.ts'
      - 'artifacts/api-server/src/question-studio/runtime-read-path-isolation.test.ts'
      - 'artifacts/api-server/build.mjs'
      - '.github/workflows/question-studio-route-registry.yml'
  push:
    paths:
      - 'artifacts/api-server/src/routes/admin-question-studio-registry.ts'
      - 'artifacts/api-server/src/routes/admin-question-studio-*.ts'
      - 'artifacts/api-server/src/routes/index.ts'
      - 'artifacts/api-server/src/question-studio/build-question-studio-capabilities-manifest.ts'
      - 'artifacts/api-server/src/question-studio/runtime-read-path-isolation.test.ts'
      - 'artifacts/api-server/build.mjs'
      - '.github/workflows/question-studio-route-registry.yml'
  workflow_dispatch:

concurrency:
  group: question-studio-route-registry-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-route-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify global route index isolates read paths before the registry
        shell: bash
        run: |
          set -euo pipefail
          index='artifacts/api-server/src/routes/index.ts'
          registry='artifacts/api-server/src/routes/admin-question-studio-registry.ts'

          grep -Fq 'const adminQuestionStudioCapabilitiesRouter = lazyExactRouter("/capabilities"' "$index"
          grep -Fq 'const adminQuestionStudioReviewPageRouter = lazyExactRouter("/review-page"' "$index"
          grep -Fq 'const adminQuestionStudioRegistryRouter = lazyRouter(() => import("./admin-question-studio-registry"));' "$index"

          capabilities_line=$(grep -nF 'router.use("/admin/question-studio", adminQuestionStudioCapabilitiesRouter);' "$index" | cut -d: -f1)
          review_line=$(grep -nF 'router.use("/admin/question-studio", adminQuestionStudioReviewPageRouter);' "$index" | cut -d: -f1)
          registry_line=$(grep -nF 'router.use("/admin/question-studio", adminQuestionStudioRegistryRouter);' "$index" | cut -d: -f1)
          test "$capabilities_line" -lt "$registry_line"
          test "$review_line" -lt "$registry_line"

          if grep -Eq '^import adminQuestionStudio.*from "\./admin-question-studio-' "$index"; then
            echo 'Static Question Studio router import found in routes/index.ts; keep the fast paths dynamically loaded.' >&2
            exit 1
          fi

          direct_mounts=$(grep -Fc 'router.use("/admin/question-studio",' "$index" || true)
          test "$direct_mounts" -eq 3
          test -s "$registry"

      - name: Verify legacy catch-all remains last in registry
        shell: bash
        run: |
          set -euo pipefail
          registry='artifacts/api-server/src/routes/admin-question-studio-registry.ts'
          last_mount=$(grep '^[[:space:]]*router.use(adminQuestionStudio' "$registry" | tail -n 1 | tr -d '[:space:]')
          test "$last_mount" = 'router.use(adminQuestionStudioRouter);'

      - name: Validate runtime read-path isolation contract
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/api-server
          node --experimental-strip-types src/question-studio/runtime-read-path-isolation.test.ts

      - name: Report focused CI contract
        run: echo 'Question Studio route registry + runtime read isolation PASS'
