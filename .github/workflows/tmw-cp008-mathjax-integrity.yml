name: Validate TMW-001 CP008 MathJax integrity

on:
  push:
    branches:
      - fix/tmw-001-cp008-multilingual-editorial-review
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/**
      - .github/workflows/tmw-cp008-mathjax-integrity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mathjax:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: >-
          pnpm exec tsc --noEmit --target es2022 --module esnext --moduleResolution bundler
          --strictNullChecks --noImplicitAny --noImplicitReturns --noFallthroughCasesInSwitch
          --skipLibCheck --types node
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp008-multilingual-editorial-review-finalizer.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp008-mathjax-integrity.test.ts
      - name: Bundle CP008 MathJax integrity proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp008-mathjax-integrity.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-cp008-mathjax-integrity.test.mjs
      - name: Run 624 MathJax integrity cases
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/tmw-001-cp008-mathjax-integrity.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/tmw-001-cp008-mathjax-integrity.log
      - name: Upload MathJax integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmw-001-cp008-mathjax-integrity
          path: artifacts/api-server/dist/quant-v4/tmw-001-cp008-mathjax-integrity.log
          if-no-files-found: warn
          retention-days: 14
