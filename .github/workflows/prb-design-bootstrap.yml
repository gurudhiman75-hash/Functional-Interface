name: Probability design materialization

on:
  push:
    branches:
      - feat/prb-probability-end-to-end
    paths:
      - '.github/workflows/prb-design-bootstrap.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/prb-probability-end-to-end
          fetch-depth: 0

      - name: Reconstruct verified payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .prb-bootstrap -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 12
          cat .prb-bootstrap/part-* > /tmp/probability_payload.b64
          base64 -d /tmp/probability_payload.b64 > /tmp/probability_payload.tar.gz
          echo "5f7d1bbf4edb77b2c40763e87cded5296cf960d372dfdeb37831f60b9d1330e4  /tmp/probability_payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/probability_payload.tar.gz -C .
          rm -f artifacts/api-server/src/quant-v4/topics/Probability/cases-001-005.ts
          rm -f artifacts/api-server/src/quant-v4/topics/Probability/cases-006-009.ts

      - name: Typecheck Probability surface
        shell: bash
        run: |
          set +e
          npx --yes tsc --ignoreConfig --noEmit --target ES2022 --module commonjs --moduleResolution node --resolveJsonModule --esModuleInterop --skipLibCheck \
            $(find artifacts/api-server/src/quant-v4/shared/counting artifacts/api-server/src/quant-v4/topics/Probability -name '*.ts' -print) \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-001/foundation/math.ts \
            > /tmp/probability-tsc.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error::$line"
            done < /tmp/probability-tsc.log
            exit "$status"
          fi

      - name: Run design QA
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/package.test.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/package.test.ts
            artifacts/api-server/src/quant-v4/topics/Probability/probability-family.test.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/question-studio-smoke.test.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/question-studio-smoke.test.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/diversity-test.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/diversity-test.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/coverage-audit.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/coverage-audit.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/residual-qa.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/residual-qa.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/explanation-quality-audit.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/explanation-quality-audit.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/cross-chapter-duplicate-audit.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/cross-chapter-duplicate-audit.ts
            artifacts/api-server/src/quant-v4/topics/Probability/cross-package-duplicate-audit.ts
            artifacts/api-server/src/quant-v4/topics/Probability/cross-chapter-authority-audit.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/multilingual-parity-test.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/multilingual-parity-test.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/maturity-audit.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/maturity-audit.ts
          )
          for test in "${tests[@]}"; do
            npx --yes tsx "$test"
          done

      - name: Commit materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .prb-bootstrap
          rm -f .github/workflows/prb-design-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(probability): implement uploaded design architecture and QA"
          git push origin HEAD:feat/prb-probability-end-to-end
