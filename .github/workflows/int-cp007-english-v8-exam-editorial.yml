name: Validate INT-CP-007 English Review V8 Exam Editorial

on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp007-scheme-equivalence-english-v4.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp007-scheme-equivalence-english-v5.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp007-scheme-equivalence-english-v6.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp007-scheme-equivalence-english-v7.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp007-scheme-equivalence-english-v8.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp007-english-v8-exam-editorial-audit.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp007-english-v8-review-export.ts'
      - '.github/workflows/int-cp007-english-v8-exam-editorial.yml'

jobs:
  validate-int-cp007-english-v8-exam-editorial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle CP007 English V8 editorial audit
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp007-english-v8-exam-editorial-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/int-cp007-english-v8-exam-editorial-audit.mjs

      - name: Run CP007 English V8 editorial audit
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp007-english-v8-exam-editorial-audit.mjs 2>&1 | tee dist/quant-v4/int-cp007-english-v8-exam-editorial-audit.log

      - name: Bundle CP007 English V8 review exporter
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp007-english-v8-review-export.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/int-cp007-english-v8-review-export.mjs

      - name: Export CP007 English V8 review
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp007-english-v8-review-export.mjs 2>&1 | tee dist/quant-v4/int-cp007-english-v8-review-export.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Verify CP007 English V8 markers
        run: |
          grep -q 'PASS_INT_CP007_ENGLISH_V8_EXAM_EDITORIAL_AUDIT' artifacts/api-server/dist/quant-v4/int-cp007-english-v8-exam-editorial-audit.log
          grep -q 'PASS_INT_CP007_ENGLISH_V8_EXAM_EDITORIAL_REVIEW_EXPORT' artifacts/api-server/dist/quant-v4/int-cp007-english-v8-review-export.log

      - name: Upload CP007 English V8 review evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-cp007-english-v8-exam-editorial-review
          path: |
            artifacts/api-server/dist/quant-v4/INT-CP-007-ENGLISH-V8-EXAM-EDITORIAL-REVIEW.md
            artifacts/api-server/dist/quant-v4/int-cp007-english-v8-exam-editorial-audit.log
            artifacts/api-server/dist/quant-v4/int-cp007-english-v8-review-export.log
          if-no-files-found: error
