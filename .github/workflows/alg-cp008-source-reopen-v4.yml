name: Validate Algebra CP-008 controlled source reopen V4

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/permanent/english-review-v4-cp008.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/permanent-english-review-v4-cp008.test.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/ALG-CP008-SOURCE-REOPEN-V4.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alg-cp008-source-reopen-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp008-source-reopen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle approved English V3 freeze proof
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/algebra
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/permanent-english-freeze-v3.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/quant-v4/algebra/permanent-english-freeze-v3.test.mjs
      - name: Run approved English V3 freeze proof
        run: |
          cd artifacts/api-server
          node dist/quant-v4/algebra/permanent-english-freeze-v3.test.mjs
      - name: Bundle CP-008 V4 controlled-reopen proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/permanent-english-review-v4-cp008.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/quant-v4/algebra/permanent-english-review-v4-cp008.test.mjs
      - name: Run CP-008 V4 controlled-reopen proof
        run: |
          cd artifacts/api-server
          node dist/quant-v4/algebra/permanent-english-review-v4-cp008.test.mjs
      - name: Upload CP-008 V4 review pack
        uses: actions/upload-artifact@v4
        with:
          name: algebra-cp008-source-reopen-v4-review
          path: artifacts/api-server/dist/quant-v4/algebra/algebra-cp008-source-reopen-v4-review.md
          if-no-files-found: error
