name: Validate SPA PFC-001 Foundation V1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pfc-foundation-v1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle PFC historical proofs and current discovery gates
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          for test in \
            spatial-paper-folding-foundation-v1 \
            spatial-paper-folding-discovery-v1 \
            spatial-paper-folding-discovery-audit-v1 \
            spatial-permanent-ql-allocation-v3 \
            spatial-paper-folding-permanent-english-runtime-v1 \
            spatial-paper-folding-english-freeze-v1 \
            spatial-paper-folding-localization-v1 \
            spatial-paper-folding-localization-freeze-v1 \
            spatial-paper-folding-source-saturation-v2 \
            spatial-paper-folding-source-saturated-discovery-v1 \
            spatial-paper-folding-post-execution-source-gap-audit-v1 \
            spatial-paper-folding-source-saturated-discovery-v2 \
            spatial-paper-folding-merge-split-ql-proposal-v1 \
            spatial-paper-folding-source-saturated-english-review-v1 \
            spatial-paper-folding-source-saturated-english-review-v1-1 \
            spatial-paper-folding-source-saturated-english-review-v1-2 \
            spatial-paper-folding-source-saturated-english-review-v1-3
          do
            pnpm --dir artifacts/api-server exec esbuild \
              src/reasoning-v1/tests/${test}.test.ts \
              --bundle --platform=node --format=esm \
              --outfile=dist/reasoning-v1/spatial/${test}.test.mjs
          done

      - name: Run historical PFC foundation proof
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-foundation-v1.test.mjs

      - name: Run historical 800-question PFC discovery proof
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-discovery-v1.test.mjs

      - name: Run historical PFC discovery coverage audit
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-discovery-audit-v1.test.mjs

      - name: Validate historical PFC QL allocation record
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-permanent-ql-allocation-v3.test.mjs

      - name: Validate historical PFC permanent English runtime V1
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-permanent-english-runtime-v1.test.mjs

      - name: Validate historical PFC English freeze authority V1
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-english-freeze-v1.test.mjs

      - name: Validate historical PFC Hindi Punjabi localization parity V1
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-localization-v1.test.mjs

      - name: Validate historical PFC Hindi Punjabi freeze authority V1
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-localization-freeze-v1.test.mjs

      - name: Validate current PFC source saturation and multi-shape V2 boundary
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-source-saturation-v2.test.mjs

      - name: Validate PFC multi-shape reverse and TPF executable discovery Wave 1
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-source-saturated-discovery-v1.test.mjs

      - name: Validate post-Wave-1 source gap audit
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-post-execution-source-gap-audit-v1.test.mjs

      - name: Validate PFC and TPF executable gap closure Wave 2
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-source-saturated-discovery-v2.test.mjs

      - name: Validate source-saturated PFC/TPF merge-split and QL proposal
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-merge-split-ql-proposal-v1.test.mjs

      - name: Generate and validate source-saturated English learner review V1
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-source-saturated-english-review-v1.test.mjs

      - name: Validate learner-review V1.1 notch presentation remediation
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-source-saturated-english-review-v1-1.test.mjs

      - name: Validate learner-review V1.2 loading, transparency and option distinctness
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-source-saturated-english-review-v1-2.test.mjs

      - name: Validate learner-review V1.3 perceptual option separation
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-source-saturated-english-review-v1-3.test.mjs

      - name: Upload PFC historical and source-saturation evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-pfc-001-source-saturation-v2
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-001-foundation-v1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-001-discovery-v3-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-001-discovery-v3-review.html
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-001-discovery-audit-v1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-001-permanent-ql-allocation-v3-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-001-permanent-english-runtime-v1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-001-permanent-english-runtime-v1-review.html
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-001-english-freeze-v1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-001-hi-pa-localization-v1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-001-hi-pa-localization-v1-review.html
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-001-hi-pa-localization-freeze-v1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-001-source-saturation-v2-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-executable-discovery-wave1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-post-execution-source-gap-audit-v1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-executable-discovery-wave2-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-merge-split-ql-proposal-v1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-source-saturated-english-review-v1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-source-saturated-english-review-v1.html
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-source-saturated-english-review-v1-1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-source-saturated-english-review-v1-1.html
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-source-saturated-english-review-v1-2-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-source-saturated-english-review-v1-2.html
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-source-saturated-english-review-v1-3-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-source-saturated-english-review-v1-3.html
          if-no-files-found: error
