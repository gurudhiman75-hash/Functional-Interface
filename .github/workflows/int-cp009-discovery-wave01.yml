name: Validate INT-CP-009 Dated Cash-Flow Discovery Wave 01

on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/INT-CP-009/**'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp009-dated-cash-flow-discovery-v1.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp009-discovery-wave01-audit.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp009-discovery-wave01-review-export.ts'
      - '.github/workflows/int-cp009-discovery-wave01.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: int-cp009-discovery-wave01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-int-cp009-discovery-wave01:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Reconfirm CP008 multilingual frozen base
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp008-localized-v6-freeze-audit.ts | tee int-cp008-localized-v6-freeze-regression.log
      - name: Verify CP008 frozen-base marker
        run: grep -q 'PASS_INT_CP008_LOCALIZED_V6_FREEZE_AUDIT' int-cp008-localized-v6-freeze-regression.log
      - name: Run CP009 Wave01 discovery audit
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp009-discovery-wave01-audit.ts | tee int-cp009-discovery-wave01.log
      - name: Verify CP009 Wave01 marker
        run: grep -q 'PASS_INT_CP009_DISCOVERY_WAVE01_AUDIT' int-cp009-discovery-wave01.log
      - name: Export CP009 Wave01 manual review pack
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp009-discovery-wave01-review-export.ts > INT-CP-009-WAVE01-REVIEW.md
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Record exact validation head
        run: |
          echo "validated_head=$(git rev-parse HEAD)" | tee int-cp009-discovery-wave01-head.log
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Upload CP009 Wave01 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-cp009-dated-cash-flow-discovery-wave01
          path: |
            int-cp008-localized-v6-freeze-regression.log
            int-cp009-discovery-wave01.log
            int-cp009-discovery-wave01-head.log
            INT-CP-009-WAVE01-REVIEW.md
          retention-days: 30
          if-no-files-found: warn
