name: Quant V4 specialized profile bypass map P2

on:
  push:
    branches:
      - audit/quant-v4-specialized-profile-bypass-map-p2
    paths:
      - "artifacts/api-server/src/quant-v4/question-studio-generation-engine.ts"
      - "artifacts/api-server/src/quant-v4/question-studio-review-engine.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/question-studio-banking-integration.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-specialized-profile-bypass-map-p2.test.ts"
      - "artifacts/api-server/src/quant-v4/quality/QUANT-V4-SPECIALIZED-PROFILE-BYPASS-MAP-P2.md"
      - ".github/workflows/quant-v4-specialized-profile-bypass-map-p2.yml"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/question-studio-generation-engine.ts"
      - "artifacts/api-server/src/quant-v4/question-studio-review-engine.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/question-studio-banking-integration.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-specialized-profile-bypass-map-p2.test.ts"
      - "artifacts/api-server/src/quant-v4/quality/QUANT-V4-SPECIALIZED-PROFILE-BYPASS-MAP-P2.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-v4-specialized-profile-bypass-map-p2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  specialized-profile-bypass-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle specialized profile bypass audit
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/quality
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/quality/quant-v4-specialized-profile-bypass-map-p2.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/quant-v4/quality/quant-v4-specialized-profile-bypass-map-p2.test.mjs

      - name: Run specialized profile bypass audit
        working-directory: artifacts/api-server
        run: node dist/quant-v4/quality/quant-v4-specialized-profile-bypass-map-p2.test.mjs

      - name: Patch hygiene
        run: git diff --check
