name: Validate RNK-001 CP-004 Discovery

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/README.md"
      - "artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/rnk-001-open-ql-discovery.md"
      - ".github/workflows/reasoning-rnk-001-cp004-discovery.yml"
  workflow_dispatch:

jobs:
  cp004-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run raw multi-entity order discovery and solver audit
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-foundation.test.ts
          rnk-cp004-discovery-output

      - name: Enforce adaptive exam-readiness English V2 gates
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-exam-ready.test.ts
          rnk-cp004-exam-ready-v2-output

      - name: Verify upper and lower block presentation
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-bridge-presentation.test.ts

      - name: Upload RNK-CP-004 adaptive remodel V2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: rnk-001-cp004-english-remodel-v2-review-pending
          path: |
            rnk-cp004-discovery-output
            rnk-cp004-exam-ready-v2-output
          retention-days: 14
