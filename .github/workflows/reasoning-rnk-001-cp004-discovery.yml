name: Validate RNK-001 CP-004 Discovery

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/README.md"
      - "artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/rnk-001-open-ql-discovery.md"
      - ".github/workflows/reasoning-rnk-001-cp004-discovery.yml"
  workflow_dispatch:

jobs:
  cp004-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run raw multi-entity order discovery and solver audit
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-foundation.test.ts
          rnk-cp004-discovery-output

      - name: Preserve final V6 regression gates
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-exam-ready-v6-publish-gates.test.ts
          rnk-cp004-exam-ready-v6-regression-output

      - name: Enforce targeted SSC and banking English Remodel V7 gates
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-exam-ready-v7-final-gates.test.ts
          rnk-cp004-exam-ready-v7-base-output

      - name: Enforce final V7 learner-help release alignment
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-exam-ready-v7-release-gates.test.ts
          rnk-cp004-exam-ready-v7-release-output

      - name: Enforce approved English source and inverse expansion
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-source-inverse-v1-gates.test.ts
          rnk-cp004-source-inverse-v1-output

      - name: Enforce authority ownership and merge-split consolidation
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-authority-consolidation-v1-gates.test.ts
          rnk-cp004-authority-consolidation-v1-output

      - name: Upload RNK-CP-004 approved-English consolidation evidence
        uses: actions/upload-artifact@v4
        with:
          name: rnk-001-cp004-approved-english-authority-consolidation-active
          path: |
            rnk-cp004-discovery-output
            rnk-cp004-exam-ready-v6-regression-output
            rnk-cp004-exam-ready-v7-base-output
            rnk-cp004-exam-ready-v7-release-output
            rnk-cp004-source-inverse-v1-output
            rnk-cp004-authority-consolidation-v1-output
          retention-days: 14
