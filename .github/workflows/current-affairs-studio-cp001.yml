name: Validate Current Affairs Studio CP001

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/migrations/20260828_current_affairs_studio.sql"
      - "artifacts/api-server/src/current-affairs/**"
      - "artifacts/api-server/src/routes/admin-current-affairs.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - ".github/workflows/current-affairs-studio-cp001.yml"
  push:
    branches:
      - New-main
      - feature/current-affairs-studio-cp001-foundation
    paths:
      - "artifacts/api-server/migrations/20260828_current_affairs_studio.sql"
      - "artifacts/api-server/src/current-affairs/**"
      - "artifacts/api-server/src/routes/admin-current-affairs.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - ".github/workflows/current-affairs-studio-cp001.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-affairs-studio-cp001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-current-affairs-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Current Affairs core contracts
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/core.test.ts | tee current-affairs-core.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Verify route registration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'import adminCurrentAffairsRouter from "./admin-current-affairs";' artifacts/api-server/src/routes/index.ts
          grep -Fq 'router.use("/admin/current-affairs", adminCurrentAffairsRouter);' artifacts/api-server/src/routes/index.ts

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-affairs-studio-cp001-log
          path: current-affairs-core.log
          retention-days: 14
