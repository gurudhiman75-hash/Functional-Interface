name: Validate SYL-001 Banking inactive profile V3
on:
  pull_request:
    branches:
      - prototype/syl-001-bank-possibility-shell
      - audit/syl-001-source-profile-freeze
      - feat/syl-001-learner-v4
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/profile-plan-v3.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-shell-v2.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-shell-v2-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-modal-candidate-overlay-v1.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-modal-candidate-overlay-v1-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-banking-modal-candidate-review-v1.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/source-authority/banking-source-profile-v4.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/source-authority/freeze-readiness-v3.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/source-authority/freeze-readiness-v4.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/source-authority/freeze-readiness-v5.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/source-authority/freeze-readiness-v6.ts
      - .github/workflows/reasoning-syl-001-bank-profile-v3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-profile-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Bundle ordinary Banking possibility V2 audit
        run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-shell-v2-audit.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/syl-001-banking-possibility-shell-v2-audit.test.mjs
      - name: Audit ordinary Banking possibility V2
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-banking-possibility-shell-v2-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-banking-possibility-shell-v2-audit.log

      - name: Bundle profile planner V3
        run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Syllogism/SYL-001/runtime/profile-plan-v3.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/syl-001-profile-plan-v3.mjs
      - name: Audit inactive Banking candidate family
        shell: bash
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-profile-plan-v3-audit.log
          import assert from 'node:assert/strict';
          const m = await import('./artifacts/api-server/dist/reasoning-v1/syl-001-profile-plan-v3.mjs');
          const plan = m.buildSylProfilePlanV3('BANKING', 731, 100);
          assert.deepEqual(plan.readinessCounts, { ACTIVE_CANONICAL: 80, CANDIDATE_INACTIVE: 20, BLOCKED_REMODEL: 0, PRACTICE_ONLY: 0 });
          const slots = plan.slots.filter((s) => s.familyId === 'BANK_POSSIBILITY_IN_CONCLUSION_SET');
          assert.equal(slots.length, 20);
          assert.ok(slots.every((s) => s.canonicalQlId === null && s.registrationRequired === true));
          assert.ok(slots.every((s) => s.candidateAuthorities.includes('SYL_001_BANKING_POSSIBILITY_SHELL_V2')));
          assert.ok(slots.every((s) => s.candidateAuthorities.includes('SYL_001_BANKING_CAN_NEVER_BE_EDITORIAL_V4')));
          assert.equal(plan.connectedToGenerator, false);
          assert.equal(plan.activationPermitted, false);
          console.log(JSON.stringify({ status: 'PASS_SYL_001_PROFILE_PLAN_V3', readiness: plan.readinessCounts, candidateSlots: slots.length, candidateAuthorities: m.SYL_PROFILE_PLAN_V3.candidateAuthorities, registered: false, connectedToGenerator: false, activationPermitted: false }, null, 2));
          NODE

      - name: Bundle inactive Banking modal candidate overlay audit
        run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-modal-candidate-overlay-v1-audit.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/syl-001-banking-modal-candidate-overlay-v1-audit.test.mjs
      - name: Audit deterministic inactive Banking modal bindings
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-banking-modal-candidate-overlay-v1-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-banking-modal-candidate-overlay-v1-audit.log
          grep -q '"SYL-QL-018"' artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/types.ts
          if grep -q '"SYL-QL-019"' artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/types.ts; then
            echo 'Unexpected permanent SYL-QL-019 registration.' >&2
            exit 1
          fi

      - name: Bundle Banking modal human review exporter
        run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-banking-modal-candidate-review-v1.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/export-syl-001-bank-modal-candidate-review-v1.mjs
      - name: Generate and audit Banking modal human review pack
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/export-syl-001-bank-modal-candidate-review-v1.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-bank-modal-candidate-review-v1.log
          test -s dist/reasoning-v1/syl-001-bank-modal-candidate-review-v1/SYL-001-BANKING-MODAL-CANDIDATE-HUMAN-REVIEW-V1.html
          test -s dist/reasoning-v1/syl-001-bank-modal-candidate-review-v1/SYL-001-BANKING-MODAL-CANDIDATE-HUMAN-REVIEW-V1.md
          test -s dist/reasoning-v1/syl-001-bank-modal-candidate-review-v1/summary.json
          grep -q '"localizedRecords": 60' dist/reasoning-v1/syl-001-bank-modal-candidate-review-v1/summary.json
          grep -q '"omittedDiagrams": 0' dist/reasoning-v1/syl-001-bank-modal-candidate-review-v1/summary.json
          grep -q '"emittedQlIds": 0' dist/reasoning-v1/syl-001-bank-modal-candidate-review-v1/summary.json
          grep -q '"nonEnglishConventionLeaks": 0' dist/reasoning-v1/syl-001-bank-modal-candidate-review-v1/summary.json
          grep -q '"activationPermitted": false' dist/reasoning-v1/syl-001-bank-modal-candidate-review-v1/summary.json

      - name: Bundle freeze readiness V3 regression
        run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Syllogism/SYL-001/source-authority/freeze-readiness-v3.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/syl-001-freeze-readiness-v3.mjs
      - name: Audit post-remodel freeze decision regression
        shell: bash
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-freeze-readiness-v3-audit.log
          import assert from 'node:assert/strict';
          const m = await import('./artifacts/api-server/dist/reasoning-v1/syl-001-freeze-readiness-v3.mjs');
          assert.deepEqual(m.SYL_FREEZE_READINESS_V3.counts, { MET: 3, PARTIAL: 4, BLOCKED: 3 });
          assert.equal(m.SYL_FREEZE_READINESS_V3.status, 'NOT_READY_FOR_PROFILE_OR_QL_FREEZE');
          assert.equal(m.SYL_FREEZE_READINESS_V3.bankingRemodelBlockerClosed, true);
          assert.equal(m.SYL_FREEZE_READINESS_V3.bankingCandidateInactive, true);
          const bank = m.SYL_FREEZE_REQUIREMENTS_V3.find((r) => r.requirementId === 'BANKING_PROFILE_MOCK_READY');
          assert.equal(bank?.status, 'PARTIAL');
          assert.match(bank?.evidence ?? '', /80% active canonical/);
          assert.match(bank?.evidence ?? '', /20% candidate-inactive/);
          assert.equal(m.SYL_FREEZE_READINESS_V3.permanentQlFreezePermitted, false);
          assert.equal(m.SYL_FREEZE_READINESS_V3.profileActivationPermitted, false);
          assert.equal(m.SYL_FREEZE_READINESS_V3.generatorIntegrationPermitted, false);
          console.log(JSON.stringify({ status: 'PASS_SYL_001_FREEZE_READINESS_V3_REGRESSION', decision: m.SYL_FREEZE_READINESS_V3.status, counts: m.SYL_FREEZE_READINESS_V3.counts, bankingProfileStatus: bank?.status, activationPermitted: false }, null, 2));
          NODE

      - name: Bundle freeze readiness V6
        run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Syllogism/SYL-001/source-authority/freeze-readiness-v6.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/syl-001-freeze-readiness-v6.mjs
      - name: Audit inactive adapter readiness supersession
        shell: bash
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-freeze-readiness-v6-audit.log
          import assert from 'node:assert/strict';
          const m = await import('./artifacts/api-server/dist/reasoning-v1/syl-001-freeze-readiness-v6.mjs');
          const r = m.SYL_FREEZE_READINESS_V6;
          assert.equal(r.status, 'NOT_READY_FOR_PROFILE_OR_QL_FREEZE');
          assert.equal(r.requirementCount, 11);
          assert.deepEqual(r.counts, { MET: 5, PARTIAL: 4, BLOCKED: 2 });
          const inactiveAdapter = m.SYL_FREEZE_REQUIREMENTS_V6.find((entry) => entry.requirementId === 'INACTIVE_PROFILE_CANDIDATE_ADAPTER_PROVEN');
          assert.equal(inactiveAdapter?.status, 'MET');
          assert.match(inactiveAdapter?.evidence ?? '', /SYL_001_BANKING_MODAL_CANDIDATE_OVERLAY_V1/);
          assert.equal(m.SYL_FREEZE_REQUIREMENTS_V6.some((entry) => entry.requirementId === 'PROFILE_PLANNER_CONNECTED_TO_GENERATOR'), false);
          assert.equal(m.SYL_FREEZE_REQUIREMENTS_V6.find((entry) => entry.requirementId === 'DIFFICULTY_CALIBRATED')?.status, 'BLOCKED');
          assert.equal(m.SYL_FREEZE_REQUIREMENTS_V6.find((entry) => entry.requirementId === 'SOURCE_PROFILE_FROZEN')?.status, 'BLOCKED');
          assert.equal(r.inactiveProfileCandidateAdapterProven, true);
          assert.equal(r.bankingCandidateSlotsPerHundred, 20);
          assert.deepEqual(r.bankingEvaluationCoveragePerHundred, { ORDINARY_POSSIBILITY: 10, CAN_NEVER: 10 });
          assert.equal(r.bankingEvaluationCoverageIsExamFrequencyClaim, false);
          assert.equal(r.permanentQl019Created, false);
          assert.equal(r.bankingExactWeightingFrozen, false);
          assert.equal(r.exactPercentageWeightingPermitted, false);
          assert.equal(r.connectedToProductionGenerator, false);
          assert.equal(r.permanentQlFreezePermitted, false);
          assert.equal(r.profileActivationPermitted, false);
          assert.equal(r.generatorIntegrationPermitted, false);
          assert.equal(r.questionStudioActivationPermitted, false);
          assert.equal(r.questionBankWritePermitted, false);
          assert.equal(r.testDeliveryPermitted, false);
          assert.equal(r.publicPublishingPermitted, false);
          assert.equal(r.difficultyActivationPermitted, false);
          assert.equal(r.prMergeRecommended, false);
          console.log(JSON.stringify({ status: 'PASS_SYL_001_FREEZE_READINESS_V6', decision: r.status, counts: r.counts, inactiveProfileCandidateAdapterProven: true, candidateSlotsPerHundred: r.bankingCandidateSlotsPerHundred, evaluationCoveragePerHundred: r.bankingEvaluationCoveragePerHundred, sourceFrequencyClaim: false, permanentQl019Created: false, exactWeightingFrozen: false, connectedToProductionGenerator: false, activationPermitted: false }, null, 2));
          NODE

      - name: Upload profile V3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syl-001-bank-profile-v3
          path: |
            artifacts/api-server/dist/reasoning-v1/syl-001-banking-possibility-shell-v2-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-profile-plan-v3-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-banking-modal-candidate-overlay-v1-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-bank-modal-candidate-review-v1.log
            artifacts/api-server/dist/reasoning-v1/syl-001-freeze-readiness-v3-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-freeze-readiness-v6-audit.log
            dist/reasoning-v1/syl-001-bank-modal-candidate-review-v1/**
          if-no-files-found: error
          retention-days: 30
