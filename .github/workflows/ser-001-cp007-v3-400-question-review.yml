name: Export SER-001 CP-007 V3 400-question review pack

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-B/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-C/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-D/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-E/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-DISTRACTOR-AUDIT/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUTHORITY-FREEZE-CANDIDATE/**
      - .github/workflows/ser-001-cp007-v3-400-question-review.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-cp007-v3-400-question-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-400-question-review-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/cp007-v3-400-review

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Export exactly 400 questions and explanations
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-v3-400-review
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/export-adaptive-review-v3-400-questions.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/export-adaptive-review-v3-400-questions.mjs"
          (cd artifacts/api-server && node "$OUT/export-adaptive-review-v3-400-questions.mjs") \
            > "$EVIDENCE/SER-CP-007-V3-400-Questions-and-Explanations-Review.md"

      - name: Validate review file
        run: |
          set -euo pipefail
          FILE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-v3-400-review/SER-CP-007-V3-400-Questions-and-Explanations-Review.md
          grep -q '# SER-CP-007 — 400 Questions and Explanations Review Pack' "$FILE"
          grep -q 'Questions:             400' "$FILE"
          grep -q 'Templates represented: 140' "$FILE"
          grep -q 'Candidate authorities: 13' "$FILE"
          QUESTION_COUNT=$(grep -c '^## Question [0-9][0-9][0-9]$' "$FILE")
          ANSWER_COUNT=$(grep -c '^\*\*Answer:\*\*' "$FILE")
          EXPLANATION_COUNT=$(grep -c '^### Explanation$' "$FILE")
          test "$QUESTION_COUNT" -eq 400
          test "$ANSWER_COUNT" -eq 400
          test "$EXPLANATION_COUNT" -eq 400
          echo "PASS_SER_CP007_V3_400_QUESTION_EXPLANATION_REVIEW_PACK"

      - name: Upload 400-question Markdown review pack
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-cp007-v3-400-question-review
          path: artifacts/api-server/dist/reasoning-v1/ser-001/cp007-v3-400-review/SER-CP-007-V3-400-Questions-and-Explanations-Review.md
          if-no-files-found: error
          retention-days: 30
