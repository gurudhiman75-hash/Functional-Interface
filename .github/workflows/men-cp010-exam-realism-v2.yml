name: Validate MEN-CP-010 exam realism V2

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-010/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp010-foundation/**
      - .github/workflows/men-cp010-exam-realism-v2.yml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: men-cp010-exam-realism-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-exam-realism-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove CP010 exam-realism freeze V2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/api-server/dist/quant-v4
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-010/permanent/frozen-runtime-v2.test.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/quant-v4/men-cp010-exam-realism-v2.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp010-exam-realism-v2.test.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/men-cp010-exam-realism-v2.test.log

      - name: Export 208-question setter review
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-010/permanent/review-export-v2.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/quant-v4/men-cp010-exam-realism-review-v2.export.mjs
          node artifacts/api-server/dist/quant-v4/men-cp010-exam-realism-review-v2.export.mjs
          test -s artifacts/api-server/dist/quant-v4/men-cp010-exam-realism-review-v2.json
          test -s artifacts/api-server/dist/quant-v4/men-cp010-exam-realism-review-v2.md

      - name: Regress V1 English freeze
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-010/permanent/frozen-runtime-v1.test.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/quant-v4/men-cp010-freeze-v1-regression.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp010-freeze-v1-regression.test.mjs

      - name: Build production API bundle
        run: bash build-api.sh

      - name: Upload setter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-cp010-exam-realism-v2
          path: |
            artifacts/api-server/dist/quant-v4/men-cp010-exam-realism-v2.test.log
            artifacts/api-server/dist/quant-v4/men-cp010-exam-realism-review-v2.json
            artifacts/api-server/dist/quant-v4/men-cp010-exam-realism-review-v2.md
          if-no-files-found: error
          retention-days: 14
