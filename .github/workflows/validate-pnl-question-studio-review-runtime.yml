name: Apply PNL QL-070 generator authority fix

on:
  push:
    branches:
      - feat/pnl-001-ql070-data-sufficiency
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/**"
      - ".github/workflows/validate-pnl-question-studio-review-runtime.yml"

permissions:
  contents: write

jobs:
  apply-generator-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-ql070-data-sufficiency
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch authoritative editorial generators
        run: node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-ql070-generator-fix.mjs

      - name: Format generator sources
        run: |
          pnpm exec prettier --write \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/foundation/editorial-v2-legacy-builder.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/foundation/editorial-v2-multilingual-normalizer.ts

      - name: Prepare legacy bundle paths
        run: |
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          ln -s ../CP-001 "$root/foundation/CP-001"
          ln -s ../CP-002 "$root/foundation/CP-002"
          ln -s ../CP-003 "$root/foundation/CP-003"

      - name: Regenerate committed English source
        run: |
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/editorial-v2-cp001-cp003-export.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/foundation/.editorial-v2-cp001-cp003-export.mjs
          node "$root/foundation/.editorial-v2-cp001-cp003-export.mjs"
          cp \
            "$root/foundation/.editorial-v2-generated/CP-002.editorial-content.en.json" \
            "$root/CP-002/editorial-content.en.json"

      - name: Regenerate committed Hindi and Punjabi sources
        run: |
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/editorial-v2-multilingual-export.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-multilingual-export.mjs
          node "$root/.editorial-v2-multilingual-export.mjs"
          cp \
            "$root/.editorial-v2-multilingual-generated/CP-002.editorial-content.hi.json" \
            "$root/CP-002/editorial-content.hi.json"
          cp \
            "$root/.editorial-v2-multilingual-generated/CP-002.editorial-content.pa.json" \
            "$root/CP-002/editorial-content.pa.json"

      - name: Prove English and multilingual source parity
        run: |
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/editorial-v2-cp001-cp003-audit.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/foundation/.editorial-v2-cp001-cp003-audit.mjs
          node "$root/foundation/.editorial-v2-cp001-cp003-audit.mjs"
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/editorial-v2-multilingual-source-parity.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-multilingual-source-parity.mjs
          node "$root/.editorial-v2-multilingual-source-parity.mjs"

      - name: Re-run QL-070 runtime proofs
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-002/cp002-dynamic-runtime.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=/tmp/pnl-cp002-dynamic-runtime.test.mjs
          node /tmp/pnl-cp002-dynamic-runtime.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/question-studio-integration.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=/tmp/pnl-question-studio-integration.test.mjs
          node /tmp/pnl-question-studio-integration.test.mjs

      - name: Commit validated authority alignment
        run: |
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          rm -f "$root/foundation/CP-001" "$root/foundation/CP-002" "$root/foundation/CP-003"
          rm -rf "$root/foundation/.editorial-v2-generated" "$root/.editorial-v2-multilingual-generated"
          rm -f \
            "$root/foundation/.editorial-v2-cp001-cp003-export.mjs" \
            "$root/foundation/.editorial-v2-cp001-cp003-audit.mjs" \
            "$root/.editorial-v2-multilingual-export.mjs" \
            "$root/.editorial-v2-multilingual-source-parity.mjs" \
            "$root/pnl-ql070-generator-fix.mjs"
          git fetch origin New-main
          git checkout origin/New-main -- .github/workflows/validate-pnl-question-studio-review-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(pnl): align QL-070 editorial generators"
          git push origin HEAD:feat/pnl-001-ql070-data-sufficiency
