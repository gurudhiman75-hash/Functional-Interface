name: quant-v4-di-arithmetic-advanced-di008-v1

on:
  pull_request:
    branches: [New-main]
    paths:
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-008/**"
  workflow_dispatch:

concurrency:
  group: quant-v4-di-arithmetic-advanced-di008-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  advanced-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Advanced arithmetic domain proof
        run: npx -y tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-008/advanced-arithmetic-v1.test.ts
      - name: Advanced arithmetic Question Studio integration
        run: npx -y tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-008/advanced-arithmetic-question-studio-v1.test.ts
      - name: Generate review HTML
        run: npx -y tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-008/export-advanced-arithmetic-review-v1.ts /tmp/DI-008-ADVANCED-ARITHMETIC-REVIEW-V1.html
      - name: Lifecycle locks
        run: |
          ! grep -R 'questionBankWritable: true\|testEligible: true\|mockTestEligible: true\|publiclyPublishable: true\|automaticStudentPublication: true\|productionReleaseAuthorized: true' artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-008/advanced-arithmetic-v1.ts artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-008/advanced-arithmetic-question-studio-v1.test.ts
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: di-008-advanced-arithmetic-review-v1
          path: /tmp/DI-008-ADVANCED-ARITHMETIC-REVIEW-V1.html
          if-no-files-found: error
      - name: Patch hygiene
        run: git diff --check
