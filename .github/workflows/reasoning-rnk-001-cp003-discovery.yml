name: Validate RNK-001 CP-003 Discovery

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-003/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/README.md"
      - "artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/rnk-001-open-ql-discovery.md"
      - "artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-001-MANIFEST-AMENDMENT-CP003.md"
      - ".github/workflows/reasoning-rnk-001-cp003-discovery.yml"
  workflow_dispatch:

jobs:
  cp003-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run approved initial transformation audit
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-003/cp003-foundation.test.ts
          rnk-cp003-discovery-output

      - name: Run source-gap and inverse expansion audit
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-003/cp003-source-wave.test.ts
          rnk-cp003-source-wave-output

      - name: Audit final supplementary English pack
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-003/cp003-source-wave-final.test.ts
          rnk-cp003-source-reviewed-output

      - name: Prove nine-authority consolidation
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-003/cp003-consolidation.test.ts
          rnk-cp003-consolidation-output

      - name: Enforce final source and ownership gap closure
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-003/cp003-final-source-gap.test.ts
          rnk-cp003-final-source-gap-output

      - name: Prove permanent English review runtime
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-003/cp003-permanent-runtime.test.ts
          rnk-cp003-permanent-output

      - name: Enforce final English discovery freeze
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-003/cp003-final-discovery-freeze.test.ts
          rnk-cp003-final-freeze-output

      - name: Upload RNK-CP-003 frozen evidence
        uses: actions/upload-artifact@v4
        with:
          name: rnk-001-cp003-english-frozen-v1
          path: |
            rnk-cp003-discovery-output
            rnk-cp003-source-wave-output
            rnk-cp003-source-reviewed-output
            rnk-cp003-consolidation-output
            rnk-cp003-final-source-gap-output
            rnk-cp003-permanent-output
            rnk-cp003-final-freeze-output
          retention-days: 14
