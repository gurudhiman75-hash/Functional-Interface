name: Humanise TMW-CP-011 explanations

on:
  pull_request:
    branches:
      - design/tmw-001-blueprint
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/tmw-cp011-humanise-patch.yml
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp011-teacher.ts

permissions:
  contents: write

concurrency:
  group: humanise-tmw-cp011-${{ github.ref }}
  cancel-in-progress: true

jobs:
  humanise:
    if: github.head_ref == 'feat/tmw-cp011'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/tmw-cp011
      - name: Apply teacher-language patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001')

          presentation = root / 'foundation/cp011-presentation.ts'
          text = presentation.read_text()
          import_line = 'import { cp011TeacherConclusion, cp011TeacherOpening, cp011TeacherShortcut, cp011TeacherSteps } from "./cp011-teacher";\n'
          anchor = 'import { cp011RatesFor } from "./cp011-engine";\n'
          if import_line not in text:
              text = text.replace(anchor, anchor + import_line)
          replacements = {
              ' on each succeeding day': ' each day',
              "preceding day's output": "previous day's output",
              'Initial daily output:': 'Day 1 output:',
              'Daily arithmetic change:': 'Daily change:',
              'Number of scheduled days:': 'Number of days:',
              'Rate switch occurs after day ': 'The rate changes after Day ',
              'Post-switch rate:': 'New daily rate:',
              'Second agent\'s first-day output:': 'Second person\'s Day 1 output:',
              'Second agent\'s daily change:': 'Second person\'s daily change:',
              'Rejected first-day output:': 'Rejected output on Day 1:',
              'Rejected-output daily change:': 'Change in rejected output each day:',
              'Displayed daily rates:': 'Daily outputs in order:',
              'opening:keyRule(entry),': 'opening:cp011TeacherOpening(entry),',
              'steps:s.workedLatex.map(x=>`\\(${x}\\)`),': 'steps:cp011TeacherSteps(entry,p,s),',
              'shortcut:shortcut(entry,p,s),': 'shortcut:cp011TeacherShortcut(entry,s),',
              'conclusion:`Therefore, ${s.answerText} is the required answer.`,': 'conclusion:cp011TeacherConclusion(s),',
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f'presentation anchor missing: {old}')
              text = text.replace(old, new)
          presentation.write_text(text)

          options = root / 'foundation/cp011-options.ts'
          text = options.read_text()
          marker = 'const trapText:'
          if marker not in text:
              raise SystemExit('trap block marker missing')
          replacement = r'''const trapText:Record<Exclude<TmwCp011MisconceptionId,"CORRECT">,string>={
 FIRST_RATE_USED_FOR_ALL_DAYS:"This assumes the Day 1 output stays unchanged on every day.",
 LAST_RATE_USED_FOR_ALL_DAYS:"This uses the last day's output for every day.",
 RATE_CHANGE_COUNT_OFF_BY_ONE:"This counts the daily changes incorrectly. Remember: n days have only n − 1 changes.",
 ARITHMETIC_MEAN_MISUSED:"This gives the overall average instead of the required rate for the second part.",
 AP_SUM_HALF_OMITTED:"This adds the first and last outputs but forgets the division by 2 in the arithmetic-series total.",
 PHASE_DURATIONS_IGNORED:"This uses both rates for the whole schedule instead of using each rate only for its own days.",
 AVERAGE_REPORTED_AS_INITIAL:"This reports the average daily output instead of the Day 1 output.",
 AVERAGE_OUTPUT_REPORTED_AS_CHANGE:"This reports the average daily output instead of the daily increase or decrease.",
 TARGET_DIVIDED_BY_INITIAL_RATE:"This divides the target by the Day 1 rate and wrongly assumes the output never changes.",
 TERMINAL_PARTIAL_DAY_IGNORED:"This rounds the last partly used day to a whole day or leaves that fraction out.",
 GEOMETRIC_TREATED_AS_ARITHMETIC:"This treats repeated multiplication as though the same amount were added each day.",
 GEOMETRIC_SUM_FACTOR_WRONG:"This leaves out one or more multiplier terms when finding the Day 1 output.",
 MULTIPLIER_NOT_COMPOUNDED:"This applies the multiplier only once instead of applying it again every day.",
 MULTIPLIER_AS_ADDITIVE_INCREASE:"This treats a multiplication factor as an amount to be added.",
 THRESHOLD_DAY_OFF_BY_ONE:"This moves the rate change one day too early or one day too late.",
 POST_SWITCH_RATE_APPLIED_FROM_DAY_ONE:"This uses the new rate from Day 1 instead of starting it after the stated change day.",
 POST_SWITCH_DURATION_REPORTED:"This gives the number of days at the new rate, not the day after which the rate changed.",
 ORIGINAL_RATE_REPORTED:"This repeats the old rate instead of calculating the new rate.",
 REMAINING_PERIOD_COUNT_WRONG:"This divides by all scheduled days instead of only the days after the rate changes.",
 CREW_VARIATION_IGNORED:"This keeps one day's worker count for the entire schedule.",
 FULL_SCHEDULE_AVERAGE_USED_FOR_EARLY_COMPLETION:"This uses the average for all displayed days even though the target is reached earlier.",
 CREW_RATE_OMITTED:"This adds worker counts but forgets to multiply by one worker's daily output.",
 PEER_SEQUENCE_OMITTED:"This leaves out one person's changing output.",
 NEGATIVE_SEQUENCE_IGNORED:"This totals accepted output but forgets to deduct rejected output.",
 NEGATIVE_SEQUENCE_ADDED:"This adds rejected output instead of subtracting it.",
 TABLE_ORDER_IGNORED:"This changes the given day order instead of following it exactly.",
 DEADLINE_GAP_NOT_SPREAD:"This treats the entire shortfall as one day's extra output instead of sharing it across all days.",
 TOTAL_AVERAGE_REPORTED_AS_ADJUSTMENT:"This gives the target's average per day, not the extra amount needed above the plan.",
 PLANNED_RATE_REPORTED_AS_ADJUSTMENT:"This repeats the planned Day 1 output instead of finding the extra daily amount.",
 NEW_RATE_REPORTED_AS_CHANGE:"This gives the new rate itself instead of the increase or decrease from the old rate.",
 INVERSE_FORMULA_REVERSED:"This works backward in the wrong direction, changing the sign or size of the answer.",
 PLAUSIBLE_SCALE_ERROR:"This comes from a believable multiplication, division or cancellation slip in the final calculation."
};
export function selectTmwCp011Trap(options:TmwCp011Option[],correctIndex:number):TmwCp011CommonTrap{const index=(correctIndex+1)%4;const option=options[index];if(option.misconceptionId==="CORRECT")throw new Error("trap selected correct option");const optionLabel=`Option ${"ABCD"[index]}`;return{optionLabel,optionText:option.text,misconceptionId:option.misconceptionId,explanation:`Don't fall for ${optionLabel} (${option.text})! ${trapText[option.misconceptionId]}`};}
'''
          options.write_text(text[:text.index(marker)] + replacement)

          runtime = root / 'foundation/cp011-runtime.ts'
          text = runtime.read_text()
          text = text.replace('if(q.explanation.steps.length<3)errors.push("standard working too brief");', 'if(q.explanation.steps.length<4)errors.push("standard working too brief");')
          old = ' if(/Do not choose|Don\'t choose/i.test(text))errors.push("negative trap command");'
          new = ''' if(/Do not choose|Don't choose/i.test(text))errors.push("legacy trap command");
 const expectedTrapPrefix=`Don't fall for ${q.explanation.commonTrap.optionLabel} (${q.explanation.commonTrap.optionText})!`;
 if(!q.explanation.commonTrap.explanation.startsWith(expectedTrapPrefix))errors.push("direct trap advice missing");
 if(!q.explanation.opening.startsWith("Let's"))errors.push("teacher voice missing");
 if(/arithmetic progression|geometric progression|sum identity|inverse relation|recover the unknown parameter|substitute parameters/i.test(text))errors.push("academic jargon");'''
          if old not in text and 'direct trap advice missing' not in text:
              raise SystemExit('runtime trap anchor missing')
          text = text.replace(old, new)
          runtime.write_text(text)

          audit = root / 'tmw-001-cp011-audit.ts'
          text = audit.read_text()
          for old, new in {
              '/Initial daily output:/': '/Day 1 output:/',
              '/Daily arithmetic change:/': '/Daily change:/',
              '/Rate switch occurs after day/': '/The rate changes after Day/',
              '/Post-switch rate:/': '/New daily rate:/',
              'question.explanation.steps.length < 3': 'question.explanation.steps.length < 4',
              '/terminal day/i.test(question.explanation.opening)': '/last partly used day/i.test(question.explanation.opening)',
          }.items():
              text = text.replace(old, new)
          anchor = '    if (/Do not choose|Don\'t choose/i.test(learnerText)) failures.push(`${entry.qlId}:${index}:negative trap command`);\n'
          inserted = '''    if (/Do not choose|Don't choose/i.test(learnerText)) failures.push(`${entry.qlId}:${index}:legacy trap command`);
    const expectedTrapPrefix = `Don't fall for ${question.explanation.commonTrap.optionLabel} (${question.explanation.commonTrap.optionText})!`;
    if (!question.explanation.commonTrap.explanation.startsWith(expectedTrapPrefix)) failures.push(`${entry.qlId}:${index}:direct trap advice missing`);
    if (!question.explanation.opening.startsWith("Let's")) failures.push(`${entry.qlId}:${index}:teacher voice missing`);
    if (/arithmetic progression|geometric progression|sum identity|inverse relation|recover the unknown parameter|substitute parameters/i.test(learnerText)) failures.push(`${entry.qlId}:${index}:academic jargon`);
'''
          if anchor in text:
              text = text.replace(anchor, inserted)
          elif 'direct trap advice missing' not in text:
              raise SystemExit('audit trap anchor missing')
          expansion_anchor = '    if (entry.qlId === "TMW-QL-210" && !/last partly used day/i.test(question.explanation.opening)) failures.push(`${entry.qlId}:${index}:crew completion key rule incomplete`);\n'
          expansion = expansion_anchor + '''    if (["TMW-QL-193", "TMW-QL-197"].includes(entry.qlId)) {
      const daySteps = question.explanation.steps.filter((step) => /^Day \\d+ output/.test(step));
      if (daySteps.length !== question.parameters.days) failures.push(`${entry.qlId}:${index}:daily output list incomplete`);
      if (!question.explanation.steps.at(-1)?.startsWith("Total output =")) failures.push(`${entry.qlId}:${index}:expanded total missing`);
    }
    if (entry.qlId === "TMW-QL-204" && question.explanation.steps.filter((step) => /^Day \\d+ output/.test(step)).length !== 5) failures.push(`${entry.qlId}:${index}:crew day products incomplete`);
    if (["TMW-QL-194", "TMW-QL-198", "TMW-QL-207", "TMW-QL-210"].includes(entry.qlId)) {
      if (!question.explanation.steps.some((step) => step.startsWith("Work completed after"))) failures.push(`${entry.qlId}:${index}:complete-day total missing`);
      if (!question.explanation.steps.some((step) => step.startsWith("Work still left"))) failures.push(`${entry.qlId}:${index}:remaining work missing`);
      if (!question.explanation.steps.some((step) => step.startsWith("Part of Day"))) failures.push(`${entry.qlId}:${index}:partial-day calculation missing`);
    }
'''
          if expansion_anchor in text and 'daily output list incomplete' not in text:
              text = text.replace(expansion_anchor, expansion)
          audit.write_text(text)

          editorial = root / 'TMW-CP-011-EDITORIAL-REVIEW.md'
          text = editorial.read_text()
          note = '''\n## Explanation simplification audit\n\nThe learner layer now uses a direct teacher voice across all 19 QLs. Academic phrases such as “arithmetic progression”, “geometric progression”, “sum identity” and “inverse relation” are rejected from learner text. Daily outputs, crew products, phase products and final partial-day arithmetic are expanded explicitly. Every trap begins with “Don't fall for Option X (...)!” and then explains the exact student mistake in plain language. Reviewer misconception IDs remain metadata only.\n'''
          if '## Explanation simplification audit' not in text:
              editorial.write_text(text + note)

          status = root / 'TMW-CP-011-IMPLEMENTATION-STATUS.md'
          text = status.read_text()
          note = '''\n## Teacher-language refinement\n\nFollowing the 57-question editorial audit, the generator now provides plain-English openings, expanded day-by-day or phase-by-phase working, simpler speed shortcuts and direct student-facing trap advice. Permanent runtime and corpus guards reject academic jargon, fewer than four standard-working lines, missing direct trap prefixes and incomplete daily/partial-day calculations. Numerical states, answer keys and QL ownership are unchanged.\n'''
          if '## Teacher-language refinement' not in text:
              status.write_text(text + note)
          PY
      - name: Install locked workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Validate humanised runtime and audit
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp011.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/tmw-001-cp011.humanise-test.mjs
          node artifacts/api-server/dist/quant-v4/tmw-001-cp011.humanise-test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp011-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/tmw-001-cp011.humanise-audit.mjs
          node artifacts/api-server/dist/quant-v4/tmw-001-cp011.humanise-audit.mjs
      - name: Commit teacher-language refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp011-presentation.ts
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp011-options.ts
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp011-runtime.ts
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp011-audit.ts
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/TMW-CP-011-EDITORIAL-REVIEW.md
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/TMW-CP-011-IMPLEMENTATION-STATUS.md
          git commit -m "refactor(tmw): simplify CP-011 learner explanations"
          git push origin HEAD:feat/tmw-cp011
