name: Validate SYL-001 structured-proof remodel V3

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/**
      - .github/workflows/reasoning-syl-001-remodel-v3.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-syl-001-remodel-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-syl-001-remodel-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle structured-proof V3 authority
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/remodel-v3/authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-remodel-v3-authority.test.mjs

      - name: Run structured-proof V3 authority
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-remodel-v3-authority.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-remodel-v3-authority.log

      - name: Bundle learner-safe review-surface authority
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/remodel-v3/review-surface.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-remodel-v3-review-surface.test.mjs

      - name: Run learner-safe review-surface authority
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-remodel-v3-review-surface.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-remodel-v3-review-surface.log

      - name: Bundle immutable V3 review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/remodel-v3/export-review.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-remodel-v3-export-review.mjs

      - name: Generate immutable V3 review package
        env:
          SYL_V3_REVIEW_DIR: artifacts/api-server/dist/reasoning-v1/syl-001-remodel-v3-review
        run: node artifacts/api-server/dist/reasoning-v1/syl-001-remodel-v3-export-review.mjs

      - name: Upload V3 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syl-001-remodel-v3-review
          path: |
            artifacts/api-server/dist/reasoning-v1/syl-001-remodel-v3-authority.log
            artifacts/api-server/dist/reasoning-v1/syl-001-remodel-v3-review-surface.log
            artifacts/api-server/dist/reasoning-v1/syl-001-remodel-v3-review/**
          if-no-files-found: error
          retention-days: 30
