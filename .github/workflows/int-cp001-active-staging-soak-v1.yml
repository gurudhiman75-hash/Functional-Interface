name: Validate INT-CP-001 active staging soak V1

on:
  pull_request:
    branches:
      - audit/int-001-cp001-pre-registration-contract
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/**"
      - ".github/workflows/int-cp001-active-staging-soak-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-int-cp001-active-staging-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle active staging soak audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp001-active-staging-soak-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp001-active-staging-soak-audit.mjs

      - name: Run active staging soak audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp001-active-staging-soak-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp001-active-staging-soak-audit.log

      - name: Verify soak evidence
        run: grep -q 'PASS_INT_CP001_ACTIVE_STAGING_SOAK_V1' artifacts/api-server/dist/quant-v4/int-001-cp001-active-staging-soak-audit.log

      - name: Upload soak evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-cp001-active-staging-soak-v1
          path: artifacts/api-server/dist/quant-v4/int-001-cp001-active-staging-soak-audit.log
          if-no-files-found: error
          retention-days: 14
