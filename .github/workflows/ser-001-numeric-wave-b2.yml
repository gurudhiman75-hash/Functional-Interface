name: Validate SER-001 numeric Wave B2

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-NUMERIC-WAVE-B2/**
      - .github/workflows/ser-001-numeric-wave-b2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-numeric-wave-b2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-numeric-wave-b2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/numeric-wave-b2

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Run Wave B2 executable audit
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-NUMERIC-WAVE-B2
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/numeric-wave-b2
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/ser-numeric-wave-b2.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-numeric-wave-b2.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-numeric-wave-b2.test.mjs") \
            | tee "$EVIDENCE/wave-b2-audit.json"
          cp "artifacts/api-server/$ROOT/ser-numeric-wave-b2-report.md" \
            "$EVIDENCE/ser-numeric-wave-b2-report.md"

      - name: Upload Wave B2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-numeric-wave-b2
          path: artifacts/api-server/dist/reasoning-v1/ser-001/numeric-wave-b2
          if-no-files-found: error
          retention-days: 30
