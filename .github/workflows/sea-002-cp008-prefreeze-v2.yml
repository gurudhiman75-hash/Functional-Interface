name: Validate SEA-002 CP008 final prefreeze V2

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/**"
      - ".github/workflows/sea-002-cp008-prefreeze-v2.yml"
  workflow_dispatch:

concurrency:
  group: sea-002-cp008-prefreeze-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-sea-002-cp008-prefreeze-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-prove source saturation
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/source-saturation-v3.test.ts
      - name: Re-prove permanent allocation
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/permanent/allocation.test.ts
      - name: Certify English editorial V2
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/english-review-v2.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-english-review-v2.log
      - name: Certify Hindi Punjabi editorial V2
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/localization-v2.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-localization-v2.log
      - name: Certify final prefreeze authority V2
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/review/prefreeze-authority-v2.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-prefreeze-authority-v2.log
      - name: Verify pinned certified review evidence V2
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/review/certified-evidence-v2.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-certified-evidence-v2.log
      - name: Prove exact approval-to-freeze contract V2
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/review/freeze-contract-v2.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-freeze-contract-v2.log
      - name: Prove blocked Question Studio V2 preview adapter
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/question-studio-preintegration-v2.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-question-studio-v2.log
      - name: Export English V2 review surfaces
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/english-review-export-v2.ts
          > /tmp/sea-002-cp008-english-review-v2.json
      - name: Export localized V2 review surfaces
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/localization-export-v2.ts
          > /tmp/sea-002-cp008-localization-v2.json
      - name: Re-prove source-backed ALT12 uniqueness
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/discovery-alt12-v1.test.ts
      - name: Re-prove variable-side6 uniqueness
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/discovery-variable-side6-v1.test.ts
      - name: Re-prove CP007 approval boundary
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp007/review/prefreeze-authority-v1.test.ts
      - name: Upload CP008 final V2 prefreeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: sea-002-cp008-prefreeze-v2
          path: |
            /tmp/sea-002-cp008-english-review-v2.log
            /tmp/sea-002-cp008-localization-v2.log
            /tmp/sea-002-cp008-prefreeze-authority-v2.log
            /tmp/sea-002-cp008-certified-evidence-v2.log
            /tmp/sea-002-cp008-freeze-contract-v2.log
            /tmp/sea-002-cp008-question-studio-v2.log
            /tmp/sea-002-cp008-english-review-v2.json
            /tmp/sea-002-cp008-localization-v2.json
          if-no-files-found: error
          retention-days: 30
