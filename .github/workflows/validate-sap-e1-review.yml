name: Validate SAP E1 E2 Reviews

on:
  pull_request:
    branches:
      - audit/sap-exhaustiveness-2026-08
      - feat/sap-e1-r2-exam-remodel

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle E1 R2 production review V4
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-E1-R2-REVIEW-V4.ts --bundle --platform=node --format=esm --outfile=dist/e1-r2-review.mjs
      - name: Generate and validate E1 R2 production review V4
        run: node artifacts/api-server/dist/e1-r2-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sap-e1-r2-300-review-v4
          path: artifacts/api-server/dist/quant-v4/sap-e1-r2-review/**
          if-no-files-found: error
          retention-days: 30
      - name: Bundle E2 CP011 CP012 production review R4
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-E2-300-REVIEW-R4.ts --bundle --platform=node --format=esm --outfile=dist/e2-review.mjs
      - name: Generate and validate E2 CP011 CP012 production review R4
        run: node artifacts/api-server/dist/e2-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sap-e2-cp011-cp012-300-review-r4
          path: artifacts/api-server/dist/quant-v4/sap-e2-review/**
          if-no-files-found: error
          retention-days: 30
