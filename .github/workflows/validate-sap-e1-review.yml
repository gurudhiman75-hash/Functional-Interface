name: Validate SAP E1 300 Review

on:
  pull_request:
    branches:
      - audit/sap-exhaustiveness-2026-08

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Bundle E1 R2 review generators
        run: |
          mkdir -p artifacts/api-server/dist/e1-r2-review
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-004/e1-r2-exam-runtime.ts --bundle --platform=node --format=esm --outfile=dist/e1-r2-review/cp004.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-005/e1-r2-exam-runtime.ts --bundle --platform=node --format=esm --outfile=dist/e1-r2-review/cp005.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-002/SAP-CP-010/e1-r2-exam-runtime-final.ts --bundle --platform=node --format=esm --outfile=dist/e1-r2-review/cp010.mjs

      - name: Build and validate 300-question E1 R2 review
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const root = process.cwd();
          const dist = path.join(root, 'artifacts/api-server/dist/e1-r2-review');
          const cp004 = await import(path.join(dist, 'cp004.mjs'));
          const cp005 = await import(path.join(dist, 'cp005.mjs'));
          const cp010 = await import(path.join(dist, 'cp010.mjs'));

          const families = [
            ...cp004.SAP_CP004_E1_R2_STRUCTURES.map(id => ({ id, generate: seed => cp004.generateSapCp004E1R2(id, seed) })),
            ...cp005.SAP_CP005_E1_R2_STRUCTURES.map(id => ({ id, generate: seed => cp005.generateSapCp005E1R2(id, seed) })),
            ...cp010.SAP_CP010_E1_R2_STRUCTURES.map(id => ({ id, generate: seed => cp010.generateSapCp010E1R2(id, seed) })),
          ];
          assert.equal(families.length, 24);

          const records = [];
          const add = q => records.push({ ...q, questionId: `SAP-E1-R2-${String(records.length + 1).padStart(3, '0')}` });
          for (const family of families) for (let seed = 1; seed <= 12; seed++) add(family.generate(seed));

          const ssc0 = families[0], ssc1 = families[1];
          for (const seed of [13,14,15,16]) add(ssc0.generate(seed));
          for (const seed of [17,18]) add(ssc1.generate(seed));
          const bank0 = families[12], bank1 = families[13];
          for (const seed of [13,14,15,16]) add(bank0.generate(seed));
          for (const seed of [19,20]) add(bank1.generate(seed));

          assert.equal(records.length, 300);
          assert.equal(new Set(records.map(r => r.stem)).size, 300);
          assert.equal(new Set(records.map(r => r.canonicalPayloadKey)).size, 300);
          assert.equal(new Set(records.map(r => r.generationIdentity)).size, 300);

          const structureCounts = Object.fromEntries(families.map(f => [f.id, records.filter(r => r.structureId === f.id).length]));
          assert.equal(Object.keys(structureCounts).length, 24);
          for (const count of Object.values(structureCounts)) assert.ok(count >= 12);

          const profiles = { SSC: records.filter(r => r.profile === 'SSC').length, BANK: records.filter(r => r.profile === 'BANK').length };
          assert.deepEqual(profiles, { SSC: 150, BANK: 150 });

          const positions = [0,0,0,0];
          let last = -1, streak = 0, hard = 0;
          for (const r of records) {
            assert.equal(r.validation.ok, true, `${r.questionId}: ${r.validation.errors.join('; ')}`);
            assert.ok(r.decisionCount >= 2, `${r.questionId}: one-step question`);
            assert.ok(r.structureId.includes('-R2-'), `${r.questionId}: non-R2 structure leaked into review`);
            assert.notEqual(r.checkpointId, 'SAP-CP-007');
            assert.equal(r.options.length, 4);
            assert.equal(new Set(r.options.map(o => o.value)).size, 4);
            assert.equal(r.options[r.correctIndex]?.value, r.canonicalAnswer);
            assert.equal(r.lifecycle.permanentQlId, null);
            assert.equal(r.lifecycle.active, false);
            assert.equal(r.lifecycle.questionStudioDiscoverable, false);
            assert.equal(r.lifecycle.questionBankWritable, false);
            assert.equal(r.lifecycle.testEligible, false);
            assert.equal(r.lifecycle.publiclyPublishable, false);
            assert.doesNotMatch(r.stem, /\bround\b|For estimation, take|Using cancellation|using suitable approximation|nearest whole number/i);
            assert.doesNotMatch(r.stem, /[√∛∜]/);
            assert.doesNotMatch(r.options.map(o => o.value).join(' '), /Alternative\s+\d+/i);
            positions[r.correctIndex]++;
            streak = r.correctIndex === last ? streak + 1 : 1;
            last = r.correctIndex;
            assert.ok(streak < 3, `${r.questionId}: answer-position streak`);
            if (r.difficulty === 'HARD') hard++;
          }
          assert.deepEqual(positions, [75,75,75,75]);
          assert.ok(hard >= 80);

          const outDir = path.join(root, 'artifacts/api-server/dist/quant-v4/sap-e1-r2-review');
          fs.mkdirSync(outDir, { recursive: true });
          const summary = {
            reviewVersion: 'SAP-E1-R2-EXAM-REALISM-V2',
            questionCount: 300,
            profiles,
            structures: 24,
            structureCounts,
            answerPositions: positions,
            hardQuestions: hard,
            cp007NormalMockQuestions: 0,
            lifecycle: 'INACTIVE_HUMAN_REVIEW_CANDIDATE',
            permanentQlAllocation: 'NONE',
          };

          const md = [
            '# SAP E1-R2 — 300-Question Exam-Realism Review', '',
            `Questions: **${records.length}**`,
            `Profiles: **SSC ${profiles.SSC} / Bank ${profiles.BANK}**`,
            `Structures: **24**`,
            `A/B/C/D: **${positions.join(' / ')}**`, '',
            '> R2 review only. All records are inactive and unallocated. CP007 significant figures is intentionally absent from the normal mock corpus.', ''
          ];
          for (const r of records) {
            md.push(`## ${r.questionId} — ${r.profile} — ${r.structureId}`, '', `**Difficulty:** ${r.difficulty}  `, `**Decisions:** ${r.decisionCount}`, '', r.stem, '');
            r.options.forEach((o,i) => md.push(`${String.fromCharCode(65+i)}. ${o.value}`));
            md.push('', `**Correct:** ${String.fromCharCode(65+r.correctIndex)} — ${r.canonicalAnswer}`, '', `**Idea:** ${r.explanation.coreConcept}`, '', '**Working:**');
            r.explanation.steps.forEach((s,i) => md.push(`${i+1}. ${s}`));
            md.push('', `**Final:** ${r.explanation.finalAnswer}`, '');
          }
          fs.writeFileSync(path.join(outDir, 'SAP-E1-R2-300-REVIEW.md'), md.join('\n'));
          fs.writeFileSync(path.join(outDir, 'SAP-E1-R2-300-REVIEW.json'), JSON.stringify({ summary, records }, null, 2));
          fs.writeFileSync(path.join(outDir, 'summary.json'), JSON.stringify(summary, null, 2));

          const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          const cards = records.map(r => `<section><h2>${r.questionId} — ${r.profile} — ${r.structureId}</h2><p><b>${esc(r.difficulty)}</b> · ${r.decisionCount} decisions</p><p>${esc(r.stem)}</p><ol type="A">${r.options.map(o => `<li>${esc(o.value)}</li>`).join('')}</ol><p><b>Correct:</b> ${String.fromCharCode(65+r.correctIndex)} — ${esc(r.canonicalAnswer)}</p><p><b>Idea:</b> ${esc(r.explanation.coreConcept)}</p><ol>${r.explanation.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol><p><b>Final:</b> ${esc(r.explanation.finalAnswer)}</p></section>`).join('\n');
          const html = `<!doctype html><html><head><meta charset="utf-8"><title>SAP E1-R2 300 Review</title><script>MathJax={tex:{inlineMath:[['\\\\(','\\\\)']]},svg:{fontCache:'global'}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script><style>body{font-family:Arial,sans-serif;max-width:1080px;margin:24px auto;padding:0 20px;line-height:1.55}section{border-bottom:1px solid #ddd;padding:16px 0}h2{font-size:1.08rem}li{margin:.25rem 0}.meta{background:#f5f5f5;padding:12px}</style></head><body><h1>SAP E1-R2 — 300-Question Exam-Realism Review</h1><p class="meta">SSC ${profiles.SSC} · Bank ${profiles.BANK} · 24 structures · A/B/C/D ${positions.join(' / ')}</p>${cards}</body></html>`;
          fs.writeFileSync(path.join(outDir, 'SAP-E1-R2-300-REVIEW.html'), html);
          console.log(JSON.stringify(summary));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: sap-e1-r2-300-review
          path: artifacts/api-server/dist/quant-v4/sap-e1-r2-review/**
          if-no-files-found: error
          retention-days: 30
