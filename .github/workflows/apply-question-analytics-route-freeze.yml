name: Restore Question Analytics route freeze literals

on:
  push:
    branches:
      - fix/question-analytics-publication-freeze
    paths:
      - '.github/workflows/apply-question-analytics-route-freeze.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/question-analytics-publication-freeze
      - name: Restore frozen route literals
        run: |
          python -c "from pathlib import Path; p=Path('artifacts/admin-app/src/App.tsx'); t=p.read_text(); pairs=[(\"{path:'/analytics/questions/quality'\",\"{path: '/analytics/questions/quality'\"),(\"{path:'/analytics/questions/:questionVersionId'\",\"{path: '/analytics/questions/:questionVersionId'\"),(\"{path:'/analytics/questions'\",\"{path: '/analytics/questions'\")]; [(_ for _ in ()).throw(AssertionError(old)) if t.count(old)!=1 else None for old,new in pairs]; [None for old,new in pairs if not (t:=t.replace(old,new,1))]; p.write_text(t)"
          rm .github/workflows/apply-question-analytics-route-freeze.yml
      - name: Commit source-only formatting fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/admin-app/src/App.tsx .github/workflows/apply-question-analytics-route-freeze.yml
          git commit -m 'fix(analytics): restore frozen admin route literals'
          git push origin HEAD:fix/question-analytics-publication-freeze
