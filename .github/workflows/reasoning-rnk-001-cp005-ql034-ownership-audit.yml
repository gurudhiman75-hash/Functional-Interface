name: Validate RNK-001 CP-005 QL-034 Ownership Audit

on:
  push:
    branches:
      - audit/rnk-001-cp005-ql034-ownership
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/**
      - artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-005/**
      - artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/README.md
      - artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/rnk-001-open-ql-discovery.md
      - artifacts/api-server/src/reasoning-v1/question-studio-registry.ts
      - artifacts/api-server/src/reasoning-v1/question-studio-registry.test.ts
      - .github/workflows/reasoning-rnk-001-cp005-ql034-ownership-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rnk-cp005-ql034-ownership-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ql034-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove QL-034 versus CP-005 ownership boundary
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-005/rnk-cp005-ql034-ownership-audit.test.ts \
            | tee rnk-cp005-ql034-ownership.log

      - name: Validate frozen CP-004 permanent runtime and projection
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-permanent-runtime-v1-gates.test.ts \
            | tee rnk-cp004-permanent-runtime.log

      - name: Validate corrected CP-004 consolidation boundary
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-authority-consolidation-v1-gates.test.ts \
            rnk-cp004-authority-consolidation-output \
            | tee rnk-cp004-authority-boundary.log

      - name: Validate CP-005 V3 release semantics remain intact
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-005/cp005-partial-order-editorial-v3-release.test.ts \
            | tee rnk-cp005-v3-release.log

      - name: Validate book ownership reset remains intact
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/rnk-001-book-ownership-reset.test.ts \
            | tee rnk-book-ownership-reset.log

      - name: Validate discovery-only Question Studio registry
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/question-studio-registry.test.ts \
            | tee rnk-question-studio-registry.log

      - name: Build API server
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server build \
            | tee rnk-cp005-ql034-api-build.log

      - name: Upload ownership-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnk-001-cp005-ql034-ownership-audit-evidence
          path: |
            rnk-cp005-ql034-ownership.log
            rnk-cp004-permanent-runtime.log
            rnk-cp004-authority-boundary.log
            rnk-cp004-authority-consolidation-output/**
            rnk-cp005-v3-release.log
            rnk-book-ownership-reset.log
            rnk-question-studio-registry.log
            rnk-cp005-ql034-api-build.log
          if-no-files-found: ignore
          retention-days: 14
