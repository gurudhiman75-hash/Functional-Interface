name: MEN-001 Final Semantic Patch

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-001-final-semantic-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Add inverse-triangle concept and rectangle-wire traps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001")

          humanizer = root / "structured-comprehension-humanizer.ts"
          text = humanizer.read_text()
          concept_anchor = 'const TARGET_CONCEPTS: Readonly<Record<string, string>> = {\n'
          concept_line = '  "MEN-001-QL-004": "The triangle area formula A = 1/2 bh can be used backwards. Since area and base are known, double the area and divide by the base to get the perpendicular height.",\n'
          if concept_line not in text:
              if concept_anchor not in text:
                  raise SystemExit("TARGET_CONCEPTS anchor not found")
              text = text.replace(concept_anchor, concept_anchor + concept_line, 1)
          humanizer.write_text(text)

          traps = root / "structured-common-traps.ts"
          text = traps.read_text()
          explanation_anchor = '  "cp006-circle-area-report-source-square-area": "stopping at the area of the original square instead of finding the area of the reshaped circle",\n'
          explanation_lines = explanation_anchor + '''  "cp006-rectangle-square-divide-wire-by-two": "dividing the rectangle's total wire length by 2 instead of sharing it among 4 equal square sides",
            "cp006-rectangle-square-divide-wire-by-three": "dividing the rectangle's total wire length by 3 even though a square has 4 equal sides",
            "cp006-rectangle-square-divide-wire-by-eight": "dividing the rectangle's total wire length by 8 and making each square side half its correct length",
'''
          if '"cp006-rectangle-square-divide-wire-by-two"' not in text:
              if explanation_anchor not in text:
                  raise SystemExit("wire explanation anchor not found")
              text = text.replace(explanation_anchor, explanation_lines, 1)

          correction_anchor = '  "cp006-circle-area-report-source-square-area": "This is the original square\'s area. Continue by using its perimeter as the circle\'s circumference, find r, and then calculate πr².",\n'
          correction_lines = correction_anchor + '''  "cp006-rectangle-square-divide-wire-by-two": "A square has four equal sides. Divide the complete rectangle wire length by 4, not 2.",
            "cp006-rectangle-square-divide-wire-by-three": "A square has four equal sides. Divide the complete rectangle wire length by 4, not 3.",
            "cp006-rectangle-square-divide-wire-by-eight": "Divide the complete wire length by 4 once. Dividing by 8 halves the correct square side.",
'''
          if '"cp006-rectangle-square-divide-wire-by-two": "A square has four equal sides' not in text:
              if correction_anchor not in text:
                  raise SystemExit("wire correction anchor not found")
              text = text.replace(correction_anchor, correction_lines, 1)
          traps.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001
          git commit -m "fix(mensuration): correct inverse and rectangle-wire semantics"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
