name: QS production chapter review batches
on:
  pull_request:
    branches: [New-main]
    paths:
      - 'artifacts/api-server/src/question-studio/prod-chapter-review-*.mjs'
      - 'artifacts/api-server/src/routes/admin-question-studio-async-production-chapters.ts'
      - 'artifacts/api-server/src/routes/admin-question-studio-bulk-hardening.ts'
      - 'artifacts/api-server/src/async-task-receiver-prod-standalone.ts'
      - 'artifacts/api-server/universal-question-studio-worker-service.mjs'
      - 'artifacts/api-server/build-universal-worker.mjs'
      - 'Dockerfile.examtree-qs-prod-universal-worker'
      - 'tests/qs-prod-chapter-review-batches.test.mjs'
      - '.github/workflows/qs-prod-chapter-review-batches.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check artifacts/api-server/src/question-studio/prod-chapter-review-policy.mjs
          node --check artifacts/api-server/src/question-studio/prod-chapter-review-runtime.mjs
          node --check artifacts/api-server/universal-question-studio-worker-service.mjs
          node --check artifacts/api-server/build-universal-worker.mjs
          node --test tests/qs-prod-chapter-review-batches.test.mjs
