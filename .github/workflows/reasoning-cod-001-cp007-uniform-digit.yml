name: Reasoning COD-001 CP-007 Uniform Digit Prototype

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-007/**"
      - ".github/workflows/reasoning-cod-001-cp007-uniform-digit.yml"
  workflow_dispatch:

jobs:
  cp007-uniform-digit-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run uniform digit prototype audit
        id: prototype_audit
        shell: bash
        run: |
          set +e
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-007/uniform-digit-prototype.test.ts > cod-cp007-uniform-digit.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload prototype diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod-001-cp007-uniform-digit-audit
          path: cod-cp007-uniform-digit.log
          retention-days: 14

      - name: Enforce prototype result
        shell: bash
        run: |
          cat cod-cp007-uniform-digit.log
          test "${{ steps.prototype_audit.outputs.exit_code }}" = "0"

      - name: Export English prototype review pack
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-007/export-uniform-digit-review.ts cod-cp007-uniform-digit-review-output

      - name: Upload English prototype review pack
        uses: actions/upload-artifact@v4
        with:
          name: cod-001-cp007-uniform-digit-review
          path: cod-cp007-uniform-digit-review-output
          retention-days: 14
