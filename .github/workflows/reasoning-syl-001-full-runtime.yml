name: Validate SYL-001 pedagogy runtime

on:
  pull_request:
    branches:
      - feat/syl-001-foundation
      - feat/syl-001-full-runtime
      - feat/syl-001-structured-proof-v3
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/**
      - .github/workflows/reasoning-syl-001-full-runtime.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-syl-001-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-syl-001-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle foundation proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/foundation/foundation.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-foundation.test.mjs

      - name: Run foundation proof
        run: node artifacts/api-server/dist/reasoning-v1/syl-001-foundation.test.mjs

      - name: Bundle multilingual pedagogy audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/chapter-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-chapter-audit.test.mjs

      - name: Run multilingual pedagogy audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-chapter-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-chapter-audit.log

      - name: Bundle learner-quality audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-quality-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-learner-quality-audit.test.mjs

      - name: Run learner-quality audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-learner-quality-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-learner-quality-audit.log

      - name: Bundle weak-English language audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-language-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-learner-language-audit.test.mjs

      - name: Run weak-English language audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-learner-language-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-learner-language-audit.log

      - name: Bundle structured-proof V3 audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/structured-proof-v3-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-structured-proof-v3-audit.test.mjs

      - name: Run structured-proof V3 audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-structured-proof-v3-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-structured-proof-v3-audit.log

      - name: Bundle V3 language and accessibility audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/structured-proof-v3-language-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-structured-proof-v3-language-audit.test.mjs

      - name: Run V3 language and accessibility audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-structured-proof-v3-language-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-structured-proof-v3-language-audit.log

      - name: Bundle V3 discovery prototypes
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/discovery-prototypes-v3.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-discovery-prototypes-v3.test.mjs

      - name: Run V3 discovery prototypes
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-discovery-prototypes-v3.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-discovery-prototypes-v3.log

      - name: Bundle V4 learner explanation audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v4-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-learner-v4-audit.test.mjs

      - name: Run V4 learner explanation audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-learner-v4-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-learner-v4-audit.log

      - name: Bundle V4 Venn and parity audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/venn-diagram-v4-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-venn-v4-audit.test.mjs

      - name: Run V4 Venn and parity audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-venn-v4-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-venn-v4-audit.log

      - name: Bundle exhaustive QL gap discovery
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/ql-gap-discovery-v3.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-ql-gap-discovery-v3.mjs

      - name: Generate open QL gap report
        env:
          SYL_DISCOVERY_DIR: artifacts/api-server/dist/reasoning-v1/syl-001-discovery-v3
        run: node artifacts/api-server/dist/reasoning-v1/syl-001-ql-gap-discovery-v3.mjs

      - name: Bundle structured-proof V3 review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-review-v3.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-export-review-v3.mjs

      - name: Generate structured-proof V3 review pack
        env:
          SYL_REVIEW_DIR: artifacts/api-server/dist/reasoning-v1/syl-001-review-v3
        run: node artifacts/api-server/dist/reasoning-v1/syl-001-export-review-v3.mjs

      - name: Bundle V4 learner review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-review-v4.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-export-review-v4.mjs

      - name: Generate V4 learner review pack
        env:
          SYL_REVIEW_V4_DIR: artifacts/api-server/dist/reasoning-v1/syl-001-review-v4
        run: node artifacts/api-server/dist/reasoning-v1/syl-001-export-review-v4.mjs

      - name: Upload structured-proof review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syl-001-structured-proof-v4-learner-review
          path: |
            artifacts/api-server/dist/reasoning-v1/syl-001-chapter-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-learner-quality-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-learner-language-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-structured-proof-v3-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-structured-proof-v3-language-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-discovery-prototypes-v3.log
            artifacts/api-server/dist/reasoning-v1/syl-001-learner-v4-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-venn-v4-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-discovery-v3/**
            artifacts/api-server/dist/reasoning-v1/syl-001-review-v3/**
            artifacts/api-server/dist/reasoning-v1/syl-001-review-v4/**
          if-no-files-found: error
          retention-days: 30
