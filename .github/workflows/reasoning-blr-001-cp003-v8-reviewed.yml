name: Reasoning BLR-001 CP-003 V8 Reviewed

on:
  push:
    branches:
      - feat/blr-001-cp003-shared-family-runtime
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-learner-evidence-v8-reviewed.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-learner-evidence-v8-reviewed.test.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/export-cp003-learner-evidence-v8-reviewed.ts"
      - ".github/workflows/reasoning-blr-001-cp003-v8-reviewed.yml"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-learner-evidence-v8-reviewed.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-learner-evidence-v8-reviewed.test.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/export-cp003-learner-evidence-v8-reviewed.ts"
      - ".github/workflows/reasoning-blr-001-cp003-v8-reviewed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blr-001-cp003-v8-reviewed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-v8-reviewed:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run V8 base authenticity proof
        id: v8_base
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-learner-evidence-v8-candidate.test.ts > cp003-v8-base.log 2>&1

      - name: Run V8 reviewed editorial proof
        id: v8_reviewed
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-learner-evidence-v8-reviewed.test.ts > cp003-v8-reviewed.log 2>&1

      - name: Export V8 reviewed candidate pack
        id: v8_export
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/export-cp003-learner-evidence-v8-reviewed.ts cp003-v8-reviewed-output > cp003-v8-reviewed-export.log 2>&1

      - name: Verify reviewed artifact contracts
        id: artifact_contract
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT=cp003-v8-reviewed-output
          test -f "$OUT/blr-cp003-v8-reviewed-summary.json"
          test -f "$OUT/blr-cp003-v8-reviewed-candidates.html"
          grep -q 'min-width:0' "$OUT/blr-cp003-v8-reviewed-candidates.html"
          grep -q 'structuralSaturationProven' "$OUT/blr-cp003-v8-reviewed-summary.json"
          grep -q '"structuralSaturationProven": false' "$OUT/blr-cp003-v8-reviewed-summary.json"
          if grep -Eq '[A-Z][a-z]+ and [A-Z][a-z]+ is the only (pair|cousin pair)' "$OUT/blr-cp003-v8-reviewed-candidates.md"; then
            echo "Pair-grammar defect remains in reviewed pack."
            exit 1
          fi

      - name: Upload V8 reviewed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp003-v8-reviewed-logs
          path: |
            cp003-v8-base.log
            cp003-v8-reviewed.log
            cp003-v8-reviewed-export.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload V8 reviewed candidate pack
        if: steps.v8_export.outcome == 'success' && steps.artifact_contract.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp003-v8-reviewed-expanded-bank
          path: cp003-v8-reviewed-output
          if-no-files-found: error
          retention-days: 21

      - name: Enforce V8 base result
        if: steps.v8_base.outcome == 'failure'
        run: |
          cat cp003-v8-base.log
          exit 1

      - name: Enforce V8 reviewed result
        if: steps.v8_reviewed.outcome == 'failure'
        run: |
          cat cp003-v8-reviewed.log
          exit 1

      - name: Enforce V8 reviewed export
        if: steps.v8_export.outcome == 'failure'
        run: |
          cat cp003-v8-reviewed-export.log
          exit 1

      - name: Enforce artifact contract
        if: steps.artifact_contract.outcome == 'failure'
        run: exit 1
