name: Validate VEN-001 topology foundation

on:
  pull_request:
    branches: [New-main]
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Venn-Diagrams/VEN-001/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ven-001-topology-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  topology-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle topology proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Venn-Diagrams/VEN-001/logical-venn-topology.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/ven-001-topology.test.mjs
      - name: Run topology proof
        run: node artifacts/api-server/dist/reasoning-v1/ven-001-topology.test.mjs
      - name: Bundle renderer proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Venn-Diagrams/VEN-001/logical-venn-renderer.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/ven-001-renderer.test.mjs
      - name: Run renderer proof
        run: node artifacts/api-server/dist/reasoning-v1/ven-001-renderer.test.mjs
      - name: Bundle scenario authority proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Venn-Diagrams/VEN-001/ven-001-scenario-authorities.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/ven-001-authorities.test.mjs
      - name: Run scenario authority proof
        run: node artifacts/api-server/dist/reasoning-v1/ven-001-authorities.test.mjs
      - name: Bundle Question Studio integration proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Venn-Diagrams/VEN-001/question-studio-integration.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/ven-001-question-studio.test.mjs
      - name: Run Question Studio integration proof
        run: node artifacts/api-server/dist/reasoning-v1/ven-001-question-studio.test.mjs

      - name: Bundle and run next checkpoint question proofs
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Venn-Diagrams/VEN-001/ven-001-next-checkpoints.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/ven-001-next-checkpoints.test.mjs
      - name: Run next checkpoint question proofs
        run: node artifacts/api-server/dist/reasoning-v1/ven-001-next-checkpoints.test.mjs

      - name: Bundle and run numerical CP005-CP010 proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Venn-Diagrams/VEN-001/ven-001-numerical.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/ven-001-numerical.test.mjs
      - name: Run numerical CP005-CP010 proof
        run: node artifacts/api-server/dist/reasoning-v1/ven-001-numerical.test.mjs

      - name: Bundle and run CP011 shape-region proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Venn-Diagrams/VEN-001/ven-001-shape-regions.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/ven-001-shape-regions.test.mjs
      - name: Run CP011 shape-region proof
        run: node artifacts/api-server/dist/reasoning-v1/ven-001-shape-regions.test.mjs

      - name: Bundle permanent QL integration proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Venn-Diagrams/VEN-001/ql-registry-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/ven-001-ql-registry-audit.test.mjs
      - name: Run permanent QL integration proof
        run: node artifacts/api-server/dist/reasoning-v1/ven-001-ql-registry-audit.test.mjs

      - name: Regenerate review artifacts
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Venn-Diagrams/VEN-001/export-shape-regions-review.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/export-shape-review.mjs
          node artifacts/api-server/dist/reasoning-v1/export-shape-review.mjs
          pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Venn-Diagrams/VEN-001/export-numerical-review.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/export-numerical-review.mjs
          node artifacts/api-server/dist/reasoning-v1/export-numerical-review.mjs
      - name: Commit refreshed review artifacts
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/reasoning-v1/topics/Venn-Diagrams/VEN-001/VEN-001-*-REVIEW-V*.html artifacts/api-server/src/reasoning-v1/topics/Venn-Diagrams/VEN-001/VEN-001-*-REVIEW-V*.json
          if git diff --cached --quiet; then
            echo "Review artifacts already current."
          else
            git commit -m "Refresh VEN-001 review artifacts"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Check patch whitespace
        run: git diff --check
