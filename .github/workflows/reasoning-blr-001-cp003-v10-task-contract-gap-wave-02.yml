name: Reasoning BLR-001 CP-003 V10 Task Contract Gap Wave 02

on:
  push:
    branches:
      - feat/blr-001-cp003-shared-family-runtime
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v10-task-contract-gap-wave-02.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v10-task-contract-gap-wave-02-candidate.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v10-task-contract-gap-wave-02-candidate.test.ts"
      - ".github/workflows/reasoning-blr-001-cp003-v10-task-contract-gap-wave-02.yml"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v10-task-contract-gap-wave-02.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v10-task-contract-gap-wave-02-candidate.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v10-task-contract-gap-wave-02-candidate.test.ts"
      - ".github/workflows/reasoning-blr-001-cp003-v10-task-contract-gap-wave-02.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blr-001-cp003-v10-task-contract-gap-wave-02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-v10-task-contract-gap-wave-02:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Re-run approved V9 Wave 01 boundary
        id: wave01_approval
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v9-wave01-structural-staging-approved.test.ts > cp003-v10-wave01-approval.log 2>&1

      - name: Run V10 task-contract candidate proof
        id: v10_wave02
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v10-task-contract-gap-wave-02-candidate.test.ts > cp003-v10-task-contract-gap-wave-02.log 2>&1

      - name: Re-run final-freeze boundary
        id: freeze_boundary
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-final-freeze-readiness.test.ts > cp003-v10-freeze-boundary.log 2>&1

      - name: Upload V10 Wave 02 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp003-v10-task-contract-gap-wave-02-logs
          path: |
            cp003-v10-wave01-approval.log
            cp003-v10-task-contract-gap-wave-02.log
            cp003-v10-freeze-boundary.log
          if-no-files-found: error
          retention-days: 14

      - name: Enforce approved Wave 01 boundary
        if: steps.wave01_approval.outcome == 'failure'
        run: |
          cat cp003-v10-wave01-approval.log
          exit 1

      - name: Enforce V10 Wave 02 result
        if: steps.v10_wave02.outcome == 'failure'
        run: |
          cat cp003-v10-task-contract-gap-wave-02.log
          exit 1

      - name: Enforce freeze-boundary regression
        if: steps.freeze_boundary.outcome == 'failure'
        run: |
          cat cp003-v10-freeze-boundary.log
          exit 1
