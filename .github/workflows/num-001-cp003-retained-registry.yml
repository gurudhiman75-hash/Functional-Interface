name: Validate NUM-CP-003 retained registry

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-003/**
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/foundation/**
      - .github/workflows/num-001-cp003-retained-registry.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp003-retained-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp003-retained-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle retained registry audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-003/retained/template-registry.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp003-retained-registry.test.mjs
      - name: Run retained registry audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp003-retained-registry.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp003-retained-registry-proof.log
      - name: Upload retained registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: num-001-cp003-retained-registry
          path: artifacts/api-server/dist/quant-v4/num-001-cp003-retained-registry-proof.log
          if-no-files-found: error
          retention-days: 7
