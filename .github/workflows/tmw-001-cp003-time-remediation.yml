name: Remediate TMW CP-003 fractional time typography

on:
  pull_request:
    branches:
      - design/tmw-001-blueprint
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/tmw-001-cp003-time-remediation.yml

permissions:
  contents: write

concurrency:
  group: remediate-tmw-cp003-time
  cancel-in-progress: true

jobs:
  remediate-cp003-time:
    if: github.head_ref == 'audit/tmw-001-english-gap-freeze'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audit/tmw-001-english-gap-freeze
      - name: Route CP-003 time text through shared MathJax formatter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation')

          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f'{label} anchor not found')

          presentation = root / 'cp003-presentation.ts'
          text = presentation.read_text()
          text = replace_once(text,
            'import { divide, formatRational } from "./rational";',
            'import { divide, formatRational, formatTimeText } from "./rational";',
            'CP-003 presentation rational import')
          text = replace_once(text,
            'import { required, timeUnitLabel } from "./cp001-helpers";',
            'import { required } from "./cp001-helpers";',
            'CP-003 presentation helper import')
          text = replace_once(text,
            '  return `${formatRational(value)} ${timeUnitLabel(p.timeUnit, value)}`;',
            '  return formatTimeText(value, p.timeUnit, `${p.timeUnit}s`);',
            'CP-003 stem time renderer')
          presentation.write_text(text)

          solver = root / 'cp003-solver.ts'
          text = solver.read_text()
          text = replace_once(text,
            'import { add, divide, equals, formatRational, multiply, rational, reciprocal, subtract, toLatex } from "./rational";',
            'import { add, divide, equals, formatRational, formatTimeText, multiply, rational, reciprocal, subtract, toLatex } from "./rational";',
            'CP-003 solver rational import')
          text = replace_once(text,
            'import { required, timeUnitLabel } from "./cp001-helpers";',
            'import { required } from "./cp001-helpers";',
            'CP-003 solver helper import')
          text = replace_once(text,
            '  if (entry.answerType === "TIME") return `${formatRational(answer)} ${timeUnitLabel(p.timeUnit, answer)}`;',
            '  if (entry.answerType === "TIME") return formatTimeText(answer, p.timeUnit, `${p.timeUnit}s`);',
            'CP-003 solution time renderer')
          solver.write_text(text)

          options = root / 'cp003-options.ts'
          text = options.read_text()
          text = replace_once(text,
            'import { add, compare, divide, equals, multiply, rational, rationalKey, reciprocal, subtract } from "./rational";',
            'import { add, compare, divide, equals, formatTimeText, multiply, rational, rationalKey, reciprocal, subtract } from "./rational";',
            'CP-003 options rational import')
          text = replace_once(text,
            'import { required, seedNumber, timeUnitLabel } from "./cp001-helpers";',
            'import { required, seedNumber } from "./cp001-helpers";',
            'CP-003 options helper import')
          text = replace_once(text,
            '  if (entry.answerType === "TIME") return `${formatRational(value)} ${timeUnitLabel(p.timeUnit, value)}`;',
            '  if (entry.answerType === "TIME") return formatTimeText(value, p.timeUnit, `${p.timeUnit}s`);',
            'CP-003 option time renderer')
          options.write_text(text)
          PY
      - name: Install locked workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Validate CP-003 and chapter audit
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp003.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/tmw-001-cp003.time.mjs
          node artifacts/api-server/dist/quant-v4/tmw-001-cp003.time.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-english-gap-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/tmw-001-english-gap-audit.cp003-time.mjs
          (cd artifacts/api-server && node dist/quant-v4/tmw-001-english-gap-audit.cp003-time.mjs || true)
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('artifacts/api-server/dist/quant-v4/tmw-001-english-gap-audit.json', 'utf8'));
          if (report.summary.hardFailures !== 0) throw new Error(`chapter audit has ${report.summary.hardFailures} hard failures`);
          const hits = report.findings.filter((finding) => finding.code === 'ASCII_FRACTIONAL_TIME' && finding.cpId === 'TMW-CP-003');
          if (hits.length !== 0) throw new Error(`CP-003 ASCII fractional-time findings remain: ${hits.length}`);
          NODE
      - name: Commit CP-003 time typography
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp003-presentation.ts artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp003-solver.ts artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp003-options.ts; then
            echo 'CP-003 time typography is already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp003-presentation.ts artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp003-solver.ts artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp003-options.ts
          git commit -m 'fix(tmw): render CP-003 fractional times in MathJax'
          git push origin HEAD:audit/tmw-001-english-gap-freeze
