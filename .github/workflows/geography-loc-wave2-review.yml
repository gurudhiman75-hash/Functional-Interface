name: Validate GEO-LOC-001 Wave 2 Review

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/indian-geography/location-extent-neighbours/geo-loc-001-cp003-*"
      - "artifacts/api-server/src/knowledge-v1/indian-geography/location-extent-neighbours/GEO-LOC-001-CP003-*"
      - "artifacts/api-server/src/knowledge-v1/indian-geography/location-extent-neighbours/geo-loc-001-cp004-*"
      - "artifacts/api-server/src/knowledge-v1/indian-geography/location-extent-neighbours/GEO-LOC-001-CP004-*"
      - "artifacts/api-server/src/knowledge-v1/indian-geography/location-extent-neighbours/geo-loc-001-cp005-*"
      - "artifacts/api-server/src/knowledge-v1/indian-geography/location-extent-neighbours/GEO-LOC-001-CP005-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geo-loc-001-wave2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-wave2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Qualify CP003–CP005
        run: |
          mkdir -p artifacts/api-server/dist/geography
          for cp in 003 004 005; do
            pnpm --dir artifacts/api-server exec esbuild "src/knowledge-v1/indian-geography/location-extent-neighbours/geo-loc-001-cp${cp}-review-batch-v1.test.ts" --bundle --packages=external --platform=node --format=esm --outfile="dist/geography/geo-loc-001-cp${cp}-review-batch-v1.test.mjs"
            node "artifacts/api-server/dist/geography/geo-loc-001-cp${cp}-review-batch-v1.test.mjs"
          done
      - name: Materialize CP003–CP005 review files
        run: |
          mkdir -p artifacts/api-server/dist/geography
          for cp in 003 004 005; do
            pnpm --dir artifacts/api-server exec esbuild "src/knowledge-v1/indian-geography/location-extent-neighbours/geo-loc-001-cp${cp}-export-review-v1.ts" --bundle --packages=external --platform=node --format=esm --outfile="dist/geography/geo-loc-001-cp${cp}-export-review-v1.mjs"
            (cd artifacts/api-server && node "dist/geography/geo-loc-001-cp${cp}-export-review-v1.mjs")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: GEO-LOC-001-WAVE2-REVIEW
          path: |
            artifacts/api-server/dist/geography-review/GEO-LOC-001-CP003-V1/
            artifacts/api-server/dist/geography-review/GEO-LOC-001-CP004-V1/
            artifacts/api-server/dist/geography-review/GEO-LOC-001-CP005-V1/
          if-no-files-found: error
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
