name: Validate Punjabi Retrofit CP011

on:
  push:
    branches:
      - "feature/punjabi-retrofit-cp011-exhaustive-v1"
    paths:
      - "artifacts/api-server/src/punjabi-v1/**"
      - ".github/workflows/punjabi-forward-port-cp011.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/punjabi-v1/**"
      - ".github/workflows/punjabi-forward-port-cp011.yml"
  workflow_dispatch:

jobs:
  validate-cp011-retrofit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Bundle CP011 retrofit semantic proof
        working-directory: artifacts/api-server
        run: pnpm exec esbuild src/punjabi-v1/packages/PUN-001/checkpoints/CP011/CP011.test.ts --bundle --platform=node --format=esm --outfile=dist/punjabi-retrofit-cp011.test.mjs
      - name: Run CP011 retrofit semantic proof
        working-directory: artifacts/api-server
        run: node dist/punjabi-retrofit-cp011.test.mjs
      - name: Build API server
        working-directory: artifacts/api-server
        run: pnpm run build
