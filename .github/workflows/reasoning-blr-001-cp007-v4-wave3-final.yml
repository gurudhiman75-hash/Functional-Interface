name: Reasoning BLR-001 CP-007 V4 Wave 3 Final

on:
  push:
    branches:
      - remediate/blr-001-cp007-v4-self-review-fixes
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/**"
      - ".github/workflows/reasoning-blr-001-cp007-v4-wave3-final.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/**"
      - ".github/workflows/reasoning-blr-001-cp007-v4-wave3-final.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blr-001-cp007-v4-wave3-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-final-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove retained CP-006 solver
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-006/cp006-runtime.test.ts 2>&1 | tee cp006-source.log

      - name: Prove retained V3 authority
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-editorial-v3-authority.test.ts 2>&1 | tee cp007-v3.log

      - name: Prove Wave 3 remediation baseline
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-editorial-v4-wave3.test.ts 2>&1 | tee cp007-v4-wave3.log

      - name: Prove final semantic and editorial corpus
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-editorial-v4-wave3-final.test.ts 2>&1 | tee cp007-v4-wave3-final.log

      - name: Export final review pack
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/export-cp007-editorial-v4-wave3-final-review.ts cp007-editorial-v4-wave3-final-review-output 2>&1 | tee cp007-v4-wave3-final-export.log

      - name: Verify final artifact contracts
        shell: bash
        run: |
          set -euo pipefail
          OUT=cp007-editorial-v4-wave3-final-review-output
          test -f "$OUT/blr-cp007-v4-wave3-final-summary.json"
          test -f "$OUT/blr-cp007-v4-wave3-final-records.jsonl"
          test -f "$OUT/blr-cp007-v4-wave3-final-records.csv"
          test -f "$OUT/blr-cp007-v4-wave3-final-review.html"
          test -f "$OUT/BLR-CP-007-V4-WAVE3-FINAL-REVIEW.md"
          test "$(wc -l < "$OUT/blr-cp007-v4-wave3-final-records.jsonl")" -eq 168
          grep -q '"semanticAmbiguityCount": 0' "$OUT/blr-cp007-v4-wave3-final-summary.json"
          grep -q '"malformedLearnerExplanationCount": 0' "$OUT/blr-cp007-v4-wave3-final-summary.json"
          grep -q '"ql032BlankMeaningMismatchCount": 0' "$OUT/blr-cp007-v4-wave3-final-summary.json"
          grep -q '"learnerTokenWordOccurrences": 0' "$OUT/blr-cp007-v4-wave3-final-summary.json"
          grep -q '"codePersonCollisionCount": 0' "$OUT/blr-cp007-v4-wave3-final-summary.json"
          grep -q '"ql031SinglePositionDerivedDistractorCount": 0' "$OUT/blr-cp007-v4-wave3-final-summary.json"
          grep -q '"ql033FixedBlankOptionCount": 0' "$OUT/blr-cp007-v4-wave3-final-summary.json"
          grep -q '"ql034DistinctDecisiveStructureCount": 18' "$OUT/blr-cp007-v4-wave3-final-summary.json"
          grep -q '"ql034BroadTargetCount": 0' "$OUT/blr-cp007-v4-wave3-final-summary.json"

      - name: Upload final diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp007-v4-wave3-final-logs
          path: |
            cp006-source.log
            cp007-v3.log
            cp007-v4-wave3.log
            cp007-v4-wave3-final.log
            cp007-v4-wave3-final-export.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload final human-review pack
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp007-v4-wave3-final-human-review
          path: cp007-editorial-v4-wave3-final-review-output
          if-no-files-found: error
          retention-days: 30
