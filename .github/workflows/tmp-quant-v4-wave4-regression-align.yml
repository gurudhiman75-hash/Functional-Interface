name: TMP Quant V4 Wave4 regression alignment

on:
  push:
    branches:
      - audit/quant-v4-cgl-2023-07-27-s1-full-quant-section-wave4-p2
    paths:
      - ".github/workflows/tmp-quant-v4-wave4-regression-align.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/quant-v4-cgl-2023-07-27-s1-full-quant-section-wave4-p2
          fetch-depth: 0
      - name: Align cumulative evidence regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("artifacts/api-server/src/quant-v4/quality")

          def patch(name, replacements):
              p = root / name
              s = p.read_text()
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f"missing expected text in {name}: {old}")
                  s = s.replace(old, new)
              p.write_text(s)

          # Registry total changes in every historical regression that locks it.
          for p in root.glob("*.test.ts"):
              s = p.read_text()
              if "QUANT_V4_REGISTERED_PYQ_OBSERVATIONS.length, 133" in s:
                  p.write_text(s.replace("QUANT_V4_REGISTERED_PYQ_OBSERVATIONS.length, 133", "QUANT_V4_REGISTERED_PYQ_OBSERVATIONS.length, 158"))

          for name in ["quant-v4-algebra-pyq-normalization-wave2-p2.test.ts", "quant-v4-algebra-pyq-normalization-wave3-p2.test.ts"]:
              patch(name, [
                  ("assert.equal(alg001.length, 18);", "assert.equal(alg001.length, 21);"),
                  ("assert.equal(algebraAll.length, 29);", "assert.equal(algebraAll.length, 32);"),
                  ("assert.equal(algebraAll.filter((entry) => entry.examId === \"SSC_CGL_TIER_I\").length, 24);", "assert.equal(algebraAll.filter((entry) => entry.examId === \"SSC_CGL_TIER_I\").length, 27);"),
                  ("assert.equal(cgl.countableQuestionCount, 24);", "assert.equal(cgl.countableQuestionCount, 27);"),
                  ("assert.equal(cgl.distinctPaperCount, 18);", "assert.equal(cgl.distinctPaperCount, 19);"),
                  ("SSC_CGL_TIER_I: 24", "SSC_CGL_TIER_I: 27"),
              ])

          patch("quant-v4-tsd-pyq-normalization-wave1-p2.test.ts", [
              ("assert.equal(tsd001.length, 7);", "assert.equal(tsd001.length, 9);"),
              ("assert.equal(tsdAll.filter((entry) => entry.examId === \"SSC_CGL_TIER_I\").length, 4);", "assert.equal(tsdAll.filter((entry) => entry.examId === \"SSC_CGL_TIER_I\").length, 6);"),
          ])

          patch("quant-v4-percentage-chsl-pyq-normalization-wave1-p2.test.ts", [
              ("assert.equal(percentage.length, 7);", "assert.equal(percentage.length, 8);"),
              ("assert.equal(percentage.filter((entry) => entry.examId === \"SSC_CGL_TIER_I\").length, 2);", "assert.equal(percentage.filter((entry) => entry.examId === \"SSC_CGL_TIER_I\").length, 3);"),
          ])

          patch("quant-v4-tmw-chsl-pyq-normalization-wave1-p2.test.ts", [
              ("assert.equal(tmw.length, 12);", "assert.equal(tmw.length, 15);"),
              ("assert.equal(tmw.filter((entry) => entry.examId === \"SSC_CGL_TIER_I\").length, 7);", "assert.equal(tmw.filter((entry) => entry.examId === \"SSC_CGL_TIER_I\").length, 10);"),
              ("assert.equal(tmwCglContract.normalizedCountableObservationCount, 7);", "assert.equal(tmwCglContract.normalizedCountableObservationCount, 10);"),
          ])

          patch("quant-v4-number-system-ssc-pyq-normalization-wave2-p2.test.ts", [
              ("assert.equal(numAll.length, 20);", "assert.equal(numAll.length, 21);"),
              ("assert.equal(numAll.filter((entry) => entry.examId === \"SSC_CGL_TIER_I\").length, 14);", "assert.equal(numAll.filter((entry) => entry.examId === \"SSC_CGL_TIER_I\").length, 15);"),
              ("assert.equal(cglTierI.normalizedCountableObservationCount, 14);", "assert.equal(cglTierI.normalizedCountableObservationCount, 15);"),
          ])

          patch("quant-v4-cgl-tier1-cross-topic-pyq-normalization-wave1-p2.test.ts", [
              ("packageId: \"PNL-001\" }).length, 6", "packageId: \"PNL-001\" }).length, 8"),
              ("packageId: \"TMW-001\" }).length, 12", "packageId: \"TMW-001\" }).length, 15"),
              ("examIds: [\"SSC_CGL_TIER_I\"] }).length, 7", "examIds: [\"SSC_CGL_TIER_I\"] }).length, 10"),
              ("assert.equal(tmwCglContract.normalizedCountableObservationCount, 7);", "assert.equal(tmwCglContract.normalizedCountableObservationCount, 10);"),
              ("assert.equal(cgl.countableQuestionCount, 100);", "assert.equal(cgl.countableQuestionCount, 125);"),
              ("assert.equal(cgl.distinctPaperCount, 19);", "assert.equal(cgl.distinctPaperCount, 20);"),
              ("assert.equal(cgl.topicCoverageCount, 11);", "assert.equal(cgl.topicCoverageCount, 12);"),
          ])

          common_full = [
              ("packageId: \"ALG-001\" }).length, 18", "packageId: \"ALG-001\" }).length, 21"),
              ("packageId: \"NUM-001\" }).length, 20", "packageId: \"NUM-001\" }).length, 21"),
              ("packageId: \"PNL-001\" }).length, 6", "packageId: \"PNL-001\" }).length, 8"),
              ("packageId: \"TMW-001\" }).length, 12", "packageId: \"TMW-001\" }).length, 15"),
              ("packageId: \"TSD-001\" }).length, 7", "packageId: \"TSD-001\" }).length, 9"),
              ("assert.equal(numCgl.normalizedCountableObservationCount, 14);", "assert.equal(numCgl.normalizedCountableObservationCount, 15);"),
              ("assert.equal(tmwCgl.normalizedCountableObservationCount, 7);", "assert.equal(tmwCgl.normalizedCountableObservationCount, 10);"),
              ("assert.equal(cgl.countableQuestionCount, 100);", "assert.equal(cgl.countableQuestionCount, 125);"),
              ("assert.equal(cgl.distinctPaperCount, 19);", "assert.equal(cgl.distinctPaperCount, 20);"),
              ("assert.equal(cgl.topicCoverageCount, 11);", "assert.equal(cgl.topicCoverageCount, 12);"),
          ]

          patch("quant-v4-cgl-2024-s1-full-quant-section-wave1-p2.test.ts", common_full + [
              ("packageId: \"PCT-002\" }).length, 7", "packageId: \"PCT-002\" }).length, 8"),
          ])

          patch("quant-v4-cgl-2023-s2-full-quant-section-wave2-p2.test.ts", common_full + [
              ("packageId: \"SAP\" }).length, 2", "packageId: \"SAP\" }).length, 3"),
              ("packageId: \"RAP-001\" }).length, 2", "packageId: \"RAP-001\" }).length, 3"),
              ("packageId: \"DI-003\" }).length, 2", "packageId: \"DI-003\" }).length, 3"),
          ])

          patch("quant-v4-cgl-2022-s1-full-quant-section-wave3-p2.test.ts", common_full + [
              ("packageId: \"PCT-002\" }).length, 7", "packageId: \"PCT-002\" }).length, 8"),
              ("packageId: \"RAP-001\" }).length, 2", "packageId: \"RAP-001\" }).length, 3"),
              ("packageId: \"DI-003\" }).length, 2", "packageId: \"DI-003\" }).length, 3"),
              ("packageId: \"MEN-001\" }).length, 1", "packageId: \"MEN-001\" }).length, 2"),
          ])
          PY
          git diff --check
          rm .github/workflows/tmp-quant-v4-wave4-regression-align.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(quant-v4): align cumulative evidence regressions to Wave4"
          git push origin HEAD:audit/quant-v4-cgl-2023-07-27-s1-full-quant-section-wave4-p2
