name: Materialize Probability native editorial wave03

on:
  push:
    branches:
      - fix/prb-native-editorial-quality-wave03
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Probability/patch-native-editorial-wave03.mjs"
      - "artifacts/api-server/src/quant-v4/topics/Probability/native-editorial-quality-wave03.test.ts"
      - ".github/workflows/materialize-prb-native-editorial-wave03.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prb-native-editorial-quality-wave03
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply wave03 conditional-card rule
        run: node artifacts/api-server/src/quant-v4/topics/Probability/patch-native-editorial-wave03.mjs
      - name: Validate all 432 native explanation surfaces
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/multilingual-runtime.test.ts
      - name: Validate native math event labels
        run: |
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-math-event-labels.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-math-event-label-runtime.test.ts
      - name: Validate native editorial waves
        run: |
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-editorial-quality-regression.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-editorial-quality-wave02.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-editorial-quality-wave03.test.ts
      - name: Validate native human-review boundary
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-review-adapter.test.ts
      - name: Preserve English Probability readiness
        run: |
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/question-studio-profile.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/exam-readiness.test.ts
      - name: Commit materialized naturalizer only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Probability/shared/native-source-explanation-naturalizer.ts
          if git diff --cached --quiet; then
            echo "Wave03 naturalizer already materialized."
          else
            git commit -m "fix(probability): naturalize conditional face-card explanation"
            git push origin HEAD:fix/prb-native-editorial-quality-wave03
          fi
