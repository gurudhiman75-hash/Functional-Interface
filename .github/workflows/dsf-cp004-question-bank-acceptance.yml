name: Validate DSF-CP-004 Question Bank Acceptance

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/**
      - artifacts/api-server/src/lib/admin-question-conversion.ts
      - artifacts/api-server/src/lib/admin-question-management.ts
      - artifacts/api-server/src/lib/admin-question-studio-approval-policy.ts
      - artifacts/api-server/src/routes/admin-question-lifecycle-hardening.ts
      - artifacts/api-server/src/routes/admin-question-studio-bulk-hardening.ts
      - artifacts/api-server/src/routes/admin-question-studio-data-sufficiency.ts
      - artifacts/api-server/src/routes/admin-tests.ts
      - artifacts/api-server/src/routes/admin-test-blueprint-assembly.ts
      - artifacts/admin-app/src/features/question-studio/data-sufficiency-review-api.ts
      - artifacts/admin-app/src/pages/content/QuestionStudioDataSufficiencyReviewPanel.tsx
      - .github/workflows/dsf-cp004-question-bank-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsf-cp004-question-bank-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dsf-cp004-question-bank-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Build admin app
        run: pnpm --dir artifacts/admin-app build
      - name: Bundle DSF CP-004 and regression proofs
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/dsf
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-004/question-bank-acceptance-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp004-question-bank-acceptance.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-004/question-bank-acceptance-route-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp004-question-bank-route.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-003/exam-answer-profiles-approval-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp003-profile-approval-regression.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-003/exam-answer-profiles-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp003-profile-runtime-regression.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-003/exam-answer-profiles-route-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp003-profile-route-regression.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-002/question-studio-integration-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp002-runtime-regression.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-002/question-studio-route-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp002-route-regression.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-001/cp001-freeze-authority.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp001-freeze-regression.test.mjs
      - name: Run CP-004 Question Bank acceptance proof
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/dsf/dsf-cp004-question-bank-acceptance.test.mjs
      - name: Run CP-004 route and lifecycle proof
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/dsf/dsf-cp004-question-bank-route.test.mjs
      - name: Re-prove CP-003 profile review approval
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/dsf/dsf-cp003-profile-approval-regression.test.mjs
      - name: Re-prove CP-003 answer-profile runtime
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/dsf/dsf-cp003-profile-runtime-regression.test.mjs
      - name: Re-prove CP-003 route contract
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/dsf/dsf-cp003-profile-route-regression.test.mjs
      - name: Re-prove CP-002 Question Studio runtime
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/dsf/dsf-cp002-runtime-regression.test.mjs
      - name: Re-prove CP-002 route contract
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/dsf/dsf-cp002-route-regression.test.mjs
      - name: Re-prove CP-001 frozen authority
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/dsf/dsf-cp001-freeze-regression.test.mjs
