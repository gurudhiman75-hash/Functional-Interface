name: Validate INT-001 Comprehensive Gap Wave02 Allocation Readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/**'
      - '.github/workflows/int-001-comprehensive-gap-wave02-allocation-readiness.yml'

jobs:
  validate-int-001-comprehensive-gap-wave02-allocation-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ID-free candidate allocation-readiness audit
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-comprehensive-gap-wave02-allocation-readiness-audit.ts | tee int-001-comprehensive-gap-wave02-allocation-readiness.log
          grep -q 'PASS_INT_001_COMPREHENSIVE_GAP_WAVE02_ALLOCATION_READINESS_AUDIT' int-001-comprehensive-gap-wave02-allocation-readiness.log

      - name: Preserve Wave01 source/solver/packaging proof
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-comprehensive-gap-wave01-audit.ts | tee int-001-comprehensive-gap-wave02-wave01-regression.log
          grep -q 'PASS_INT_001_COMPREHENSIVE_GAP_WAVE01_AUDIT' int-001-comprehensive-gap-wave02-wave01-regression.log

      - name: Preserve Wave01 merge/split/ownership proof
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-comprehensive-gap-wave01-merge-split-audit.ts | tee int-001-comprehensive-gap-wave02-merge-split-regression.log
          grep -q 'PASS_INT_001_COMPREHENSIVE_GAP_WAVE01_MERGE_SPLIT_AUDIT' int-001-comprehensive-gap-wave02-merge-split-regression.log

      - name: Preserve 130-QL chapter final readiness
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-chapter-final-readiness-v1-audit.ts | tee int-001-comprehensive-gap-wave02-final-readiness-regression.log
          grep -q 'PASS_INT_001_CHAPTER_FINAL_READINESS_V1_AUDIT' int-001-comprehensive-gap-wave02-final-readiness-regression.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Record exact validation head
        shell: bash
        run: |
          echo "validated_head=$(git rev-parse HEAD)" | tee int-001-comprehensive-gap-wave02-allocation-readiness-head.log
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-001-comprehensive-gap-wave02-allocation-readiness
          path: |
            int-001-comprehensive-gap-wave02-allocation-readiness.log
            int-001-comprehensive-gap-wave02-wave01-regression.log
            int-001-comprehensive-gap-wave02-merge-split-regression.log
            int-001-comprehensive-gap-wave02-final-readiness-regression.log
            int-001-comprehensive-gap-wave02-allocation-readiness-head.log
          retention-days: 30
