name: Validate SYL-001 Banking cross-exam census V3

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/source-authority/banking-paper-census-v2.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/source-authority/banking-cross-exam-census-v1.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/source-authority/banking-cross-exam-census-v2.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/source-authority/banking-cross-exam-census-v3.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/source-authority/banking-cross-exam-census-v3-audit.test.ts"
      - ".github/workflows/reasoning-syl-001-bank-cross-exam-census-v3.yml"
  workflow_dispatch:

jobs:
  validate-cross-exam-census-v3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle Banking cross-exam census V3 audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/source-authority/banking-cross-exam-census-v3-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-bank-cross-exam-census-v3-audit.test.mjs
      - name: Run Banking cross-exam census V3 audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-bank-cross-exam-census-v3-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-bank-cross-exam-census-v3-audit.log
      - name: Upload Banking cross-exam census V3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: syl-001-bank-cross-exam-census-v3
          path: artifacts/api-server/dist/reasoning-v1/syl-001-bank-cross-exam-census-v3-audit.log
          if-no-files-found: error
          retention-days: 30
