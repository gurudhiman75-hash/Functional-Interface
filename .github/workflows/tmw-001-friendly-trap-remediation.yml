name: Migrate TMW CP-002 fractional time typography

on:
  pull_request:
    branches:
      - design/tmw-001-blueprint
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/tmw-001-friendly-trap-remediation.yml

permissions:
  contents: write

jobs:
  migrate-cp002-time:
    if: github.head_ref == 'audit/tmw-001-english-gap-freeze'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audit/tmw-001-english-gap-freeze
      - name: Route CP-002 solution and options through shared formatter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation')

          solver = root / 'cp002-solver.ts'
          text = solver.read_text()
          replacements = [
            ('import { add, divide, equals, formatRational, multiply, rational, reciprocal, subtract, toLatex } from "./rational";', 'import { add, divide, equals, formatRational, formatTimeText, multiply, rational, reciprocal, subtract, toLatex } from "./rational";'),
            ('import { required, timeUnitLabel } from "./cp001-helpers";', 'import { required } from "./cp001-helpers";'),
            ('if (entry.answerType === "TIME") return `${value} ${timeUnitLabel(p.timeUnit, answer)}`;', 'if (entry.answerType === "TIME") return formatTimeText(answer, p.timeUnit, `${p.timeUnit}s`);'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'CP-002 solver anchor not found: {old}')
              text = text.replace(old, new, 1)
          solver.write_text(text)

          options = root / 'cp002-options.ts'
          text = options.read_text()
          replacements = [
            ('import { add, compare, divide, equals, multiply, rational, reciprocal, subtract } from "./rational";', 'import { add, compare, divide, equals, formatTimeText, multiply, rational, reciprocal, subtract } from "./rational";'),
            ('if (entry.answerType === "TIME") return `${rendered} ${value.numerator === value.denominator ? p.timeUnit : `${p.timeUnit}s`}`;', 'if (entry.answerType === "TIME") return formatTimeText(value, p.timeUnit, `${p.timeUnit}s`);'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'CP-002 options anchor not found: {old}')
              text = text.replace(old, new, 1)
          options.write_text(text)
          PY
      - name: Install locked workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Validate CP-002 and chapter audit
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp002.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/tmw-001-cp002.time.mjs
          node artifacts/api-server/dist/quant-v4/tmw-001-cp002.time.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-english-gap-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/tmw-001-english-gap-audit.cp002-time.mjs
          (cd artifacts/api-server && node dist/quant-v4/tmw-001-english-gap-audit.cp002-time.mjs || true)
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('artifacts/api-server/dist/quant-v4/tmw-001-english-gap-audit.json', 'utf8'));
          if (report.summary.hardFailures !== 0) throw new Error(`chapter audit has ${report.summary.hardFailures} hard failures`);
          const hits = report.findings.filter((finding) => finding.code === 'ASCII_FRACTIONAL_TIME' && finding.cpId === 'TMW-CP-002');
          if (hits.length !== 0) throw new Error(`CP-002 ASCII fractional-time findings remain: ${hits.length}`);
          NODE
      - name: Commit CP-002 time typography
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp002-solver.ts artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp002-options.ts
          git commit -m 'fix(tmw): render CP-002 fractional times in MathJax'
          git push origin HEAD:audit/tmw-001-english-gap-freeze
