name: Reasoning BLR-001 CP-003 V8 Authenticity

on:
  push:
    branches:
      - feat/blr-001-cp003-shared-family-runtime
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v8-authenticity-authority-audit.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-learner-evidence-v8-candidate.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-learner-evidence-v8-candidate.test.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/export-cp003-learner-evidence-v8-candidate.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/BLR-CP-003-V8-AUTHENTICITY-AND-UNSTACKED-REMEDIATION.md"
      - ".github/workflows/reasoning-blr-001-cp003-v8-authenticity.yml"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v8-authenticity-authority-audit.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-learner-evidence-v8-candidate.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-learner-evidence-v8-candidate.test.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/export-cp003-learner-evidence-v8-candidate.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/BLR-CP-003-V8-AUTHENTICITY-AND-UNSTACKED-REMEDIATION.md"
      - ".github/workflows/reasoning-blr-001-cp003-v8-authenticity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blr-001-cp003-v8-authenticity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-v8-authenticity:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run preserved V7 remediation proof
        id: v7_source
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-learner-evidence-v7-candidate.test.ts > cp003-v7-source.log 2>&1

      - name: Run V8 authority and full-bank authenticity proof
        id: v8_authenticity
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-learner-evidence-v8-candidate.test.ts > cp003-v8-authenticity.log 2>&1

      - name: Export V8 full-bank human-review pack
        id: v8_export
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/export-cp003-learner-evidence-v8-candidate.ts cp003-v8-candidate-output > cp003-v8-export.log 2>&1

      - name: Verify responsive V8 HTML contract
        id: responsive_html
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          HTML=cp003-v8-candidate-output/blr-cp003-v8-candidates.html
          test -f "$HTML"
          grep -q 'min-width:0' "$HTML"
          grep -q '@media(max-width:640px)' "$HTML"
          if grep -q 'min-width:720px' "$HTML"; then
            echo "Legacy fixed SVG width remains in V8 HTML."
            exit 1
          fi

      - name: Re-run historical final-freeze boundary
        id: freeze_boundary
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-final-freeze-readiness.test.ts > cp003-v8-freeze-boundary.log 2>&1

      - name: Upload V8 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp003-v8-authenticity-logs
          path: |
            cp003-v7-source.log
            cp003-v8-authenticity.log
            cp003-v8-export.log
            cp003-v8-freeze-boundary.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload V8 full-bank review pack
        if: steps.v8_export.outcome == 'success' && steps.responsive_html.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp003-v8-full-bank-authenticity
          path: cp003-v8-candidate-output
          if-no-files-found: error
          retention-days: 21

      - name: Enforce preserved V7 result
        if: steps.v7_source.outcome == 'failure'
        run: |
          cat cp003-v7-source.log
          exit 1

      - name: Enforce V8 authenticity result
        if: steps.v8_authenticity.outcome == 'failure'
        run: |
          cat cp003-v8-authenticity.log
          exit 1

      - name: Enforce V8 export result
        if: steps.v8_export.outcome == 'failure'
        run: |
          cat cp003-v8-export.log
          exit 1

      - name: Enforce responsive HTML result
        if: steps.responsive_html.outcome == 'failure'
        run: exit 1

      - name: Enforce freeze-boundary regression
        if: steps.freeze_boundary.outcome == 'failure'
        run: |
          cat cp003-v8-freeze-boundary.log
          exit 1
