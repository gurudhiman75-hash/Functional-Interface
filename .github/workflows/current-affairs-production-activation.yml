name: Validate Current Affairs Production Activation

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/current-affairs/**"
      - "artifacts/api-server/src/routes/admin-current-affairs-production-ops.ts"
      - "artifacts/api-server/src/routes/admin-current-affairs-editorial-activation.ts"
      - "artifacts/api-server/src/app.ts"
      - "artifacts/api-server/migrations/*current_affairs*.sql"
      - "artifacts/api-server/ensure-current-affairs.mjs"
      - "artifacts/api-server/ensure-current-affairs-fonts.mjs"
      - "artifacts/api-server/build-runtime.mjs"
      - "artifacts/admin-app/src/features/current-affairs/**"
      - "artifacts/admin-app/src/pages/content/CurrentAffairsProductionReadinessPage.tsx"
      - "artifacts/admin-app/src/pages/content/CurrentAffairsEditorial*.tsx"
      - "artifacts/admin-app/src/App.tsx"
      - "build-api.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-affairs-production-activation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/examtree
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned Current Affairs PDF fonts
        run: node artifacts/api-server/ensure-current-affairs-fonts.mjs

      - name: Run cumulative Current Affairs policy contracts
        run: |
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/core.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/ingestion.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/intelligence.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/content.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/automation.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/source-fetch.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/orchestration-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/official-listing.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/primary-fact-extraction.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/original-authoring.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/multilingual-localization.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/multilingual-question-localization.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/periodic-rollup-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/story-threading.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/release-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/question-promotion-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/quiz-delivery-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/revision-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/dashboard-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/personalization-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/notification-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/question-editorial-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/production-readiness-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/on-demand-yesterday-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/daily-discovery-census.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/daily-master-pack.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/open-news-discovery.test.ts

      - name: Verify ordered production schema bootstrap
        shell: bash
        run: |
          set -euo pipefail
          runner=artifacts/api-server/ensure-current-affairs.mjs
          recovery=artifacts/api-server/migrations/20260831_current_affairs_primary_source_recovery.sql
          census=artifacts/api-server/migrations/20260831_current_affairs_daily_discovery_census.sql
          opennews=artifacts/api-server/migrations/20260831_current_affairs_open_news_discovery.sql
          test -f "$runner"
          test -f "$recovery"
          test -f "$census"
          test -f "$opennews"
          grep -Fq 'pg_advisory_lock' "$runner"
          grep -Fq 'platform.current_affairs_schema_migrations' "$runner"
          grep -Fq '20260828_current_affairs_studio.sql' "$runner"
          grep -Fq '20260830_current_affairs_production_ops.sql' "$runner"
          grep -Fq '20260831_current_affairs_primary_source_recovery.sql' "$runner"
          grep -Fq '20260831_current_affairs_daily_discovery_census.sql' "$runner"
          grep -Fq '20260831_current_affairs_open_news_discovery.sql' "$runner"
          grep -Fq 'current_affairs_daily_discovery_census' "$runner"
          grep -Fq 'current_affairs_daily_master_packs' "$runner"
          grep -Fq 'gdelt_open_news' "$runner"
          grep -Fq 'Current Affairs schema verified' "$runner"
          grep -Fq 'https://www.pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3' "$recovery"
          grep -Fq 'https://punjab.gov.in/impnotifications/' "$recovery"
          grep -Fq "'the_hindu_national'" "$census"
          grep -Fq "'reuters_india', 'Reuters — India', 'newswire'" "$census"
          grep -Fq "'discovery_only', 'manual'" "$census"
          grep -Fq "'gdelt_open_news'" "$opennews"
          grep -Fq "'discovery_only'" "$opennews"
          grep -Fq "'api'" "$opennews"
          grep -Fq "'specialist'" "$opennews"
          grep -Fq 'allow_raw_text_persistence=false' "$opennews"
          for file in $(grep -oE '20[0-9]{6}_current_affairs_[a-z0-9_]+\.sql' "$runner" | sort -u); do
            test -f "artifacts/api-server/migrations/$file"
          done
          grep -Fq 'ensure-learning-resources.mjs' build-api.sh
          grep -Fq 'ensure-current-affairs.mjs' build-api.sh

      - name: Verify on-demand authority remains draft-only
        shell: bash
        run: |
          set -euo pipefail
          runtime=artifacts/api-server/src/current-affairs/on-demand-yesterday-runtime.ts
          route=artifacts/api-server/src/routes/admin-current-affairs-production-ops.ts
          grep -Fq 'runScheduledFeedIngestion' "$runtime"
          grep -Fq 'runOpenNewsDiscovery' "$runtime"
          grep -Fq 'runScheduledPrimaryFactEnrichment' "$runtime"
          grep -Fq 'runScheduledIntelligenceProcessing' "$runtime"
          grep -Fq 'runCurrentAffairsProductionRecovery' "$runtime"
          grep -Fq 'refreshDailyDiscoveryCensus' "$runtime"
          grep -Fq 'materializeDailyMasterPacks' "$runtime"
          grep -Fq 'publicationAuthority: false' "$runtime"
          grep -Fq 'canonicalQuestionPromotion: false' "$runtime"
          grep -Fq 'automaticStudentPublication: false' "$runtime"
          grep -Fq 'requireAdminPermission("jobs.manage")' "$route"

      - name: Verify open-news discovery boundary
        shell: bash
        run: |
          set -euo pipefail
          discovery=artifacts/api-server/src/current-affairs/open-news-discovery.ts
          policy=artifacts/api-server/src/current-affairs/on-demand-yesterday-policy.ts
          grep -Fq 'https://api.gdeltproject.org/api/v2/doc/doc' "$discovery"
          grep -Fq 'sourcecountry:india sourcelang:english' "$discovery"
          grep -Fq 'dateSemantics: "gdelt_discovery_seen_at_not_publication_date"' "$discovery"
          grep -Fq 'publisherArticleBodiesFetched: false' "$discovery"
          grep -Fq 'rawArticlePersistence: false' "$discovery"
          grep -Fq 'verificationAuthority: false' "$discovery"
          grep -Fq 'publicationAuthority: false' "$discovery"
          grep -Fq '"open_news_discovery"' "$policy"
          ! grep -Fq 'fetch(article.url' "$discovery"
          ! grep -Fq 'fetch(article.domain' "$discovery"

      - name: Verify multilingual daily census and master-pack boundary
        shell: bash
        run: |
          set -euo pipefail
          census=artifacts/api-server/src/current-affairs/daily-discovery-census.ts
          master=artifacts/api-server/src/current-affairs/daily-master-pack.ts
          pdf=artifacts/api-server/src/current-affairs/daily-master-pack-pdf.ts
          route=artifacts/api-server/src/routes/admin-current-affairs-production-ops.ts
          admin=artifacts/admin-app/src/pages/content/CurrentAffairsProductionReadinessPage.tsx
          fonts=artifacts/api-server/ensure-current-affairs-fonts.mjs
          runtime_build=artifacts/api-server/build-runtime.mjs
          grep -Fq 'coverageConfidenceScore' "$census"
          grep -Fq 'trustedNewsCandidateCount' "$census"
          grep -Fq 'highPriorityUnresolvedCount' "$census"
          grep -Fq 'status IN (' "$master"
          grep -Fq 'approved_or_published_master_pack_is_immutable' "$master"
          grep -Fq 'DAILY_MASTER_PACK_LANGUAGES = ["en", "hi", "pa"]' "$master"
          grep -Fq 'localized_event_parity_incomplete' "$master"
          grep -Fq 'evaluateLocalizedMasterPackParity' "$master"
          grep -Fq 'Draft only. Publication and Question Bank promotion require separate editorial authority.' "$master"
          grep -Fq 'assertDailyMasterPackPdfFontCoverage' "$pdf"
          grep -Fq 'GlobalFonts.registerFromPath' "$pdf"
          grep -Fq 'cmapSubtables' "$pdf"
          grep -Fq 'runtime font checksum mismatch' "$pdf"
          grep -Fq 'CURRENT_AFFAIRS_FONT_UPSTREAM' "$fonts"
          grep -Fq 'ade3d1533e06b2b1462ffcde8e08b129627ca360' "$fonts"
          grep -Fq 'expectedGitBlobSha1' "$fonts"
          grep -Fq 'ensureCurrentAffairsFonts' "$runtime_build"
          grep -Fq 'current-affairs-fonts' "$runtime_build"
          grep -Fq '"/production/discovery-census"' "$route"
          grep -Fq '"/production/master-packs"' "$route"
          grep -Fq '"/production/master-pack"' "$route"
          grep -Fq '"/production/master-pack/text"' "$route"
          grep -Fq '"/production/master-pack/pdf"' "$route"
          ! grep -Fq 'CURRENT_AFFAIRS_MULTILINGUAL_PDF_FONT_GATE' "$route"
          grep -Fq 'Download Markdown' "$admin"
          grep -Fq 'Download PDF' "$admin"
          grep -Fq 'checksum-verified' "$admin"
          ! grep -Fq 'PDF font gate' "$admin"
          ! grep -Fq "status='published'" "$master"
          ! grep -Fq 'question-promotion' "$master"

      - name: Verify production route, audit entity, and admin action
        shell: bash
        run: |
          set -euo pipefail
          route=artifacts/api-server/src/routes/admin-current-affairs-production-ops.ts
          grep -Fq '/api/admin/current-affairs' artifacts/api-server/src/app.ts
          grep -Fq '"/production/generate-yesterday"' "$route"
          grep -Fq 'const generationRequestId = randomUUID();' "$route"
          grep -Fq 'entity_type, entity_id, reason, summary, metadata' "$route"
          grep -Fq "'current_affairs_generation_request'" "$route"
          grep -Fq '${generationRequestId}::uuid' "$route"
          grep -Fq 'generationRequestId,' "$route"
          grep -Fq '/admin/current-affairs/production/generate-yesterday' artifacts/admin-app/src/features/current-affairs/production-ops-api.ts
          grep -Fq 'Generate Yesterday Now' artifacts/admin-app/src/pages/content/CurrentAffairsProductionReadinessPage.tsx
          grep -Fq "/content/current-affairs/production-readiness" artifacts/admin-app/src/App.tsx

      - name: Verify bounded editorial activation authority
        shell: bash
        run: |
          set -euo pipefail
          route=artifacts/api-server/src/routes/admin-current-affairs-editorial-activation.ts
          client=artifacts/admin-app/src/features/current-affairs/editorial-api.ts
          app=artifacts/api-server/src/app.ts
          admin=artifacts/admin-app/src/App.tsx
          grep -Fq 'adminCurrentAffairsEditorialActivationRouter' "$app"
          grep -Fq 'requireAdminPermission("content.questions.read")' "$route"
          grep -Fq 'requireAdminPermission("content.questions.update")' "$route"
          grep -Fq 'createManualAuthoringVersion' "$route"
          grep -Fq 'createManualCurrentAffairsLocalization' "$route"
          grep -Fq 'createManualCurrentAffairsEnglishQuestionRevision' "$route"
          grep -Fq 'createManualCurrentAffairsQuestionLocalization' "$route"
          grep -Fq 'approveCurrentAffairsQuestionEditorialItem' "$route"
          grep -Fq 'MANUAL_TITLE_SIMILARITY_LIMIT = 0.72' "$route"
          grep -Fq 'BANK_ONLY' artifacts/admin-app/src/pages/content/CurrentAffairsEditorialQuestionPage.tsx
          grep -Fq "/content/current-affairs/events/:eventId" "$admin"
          grep -Fq "/content/current-affairs/questions/:generationItemId" "$admin"
          grep -Fq "/content/current-affairs'" "$admin"
          ! grep -Fq '/release' "$client"
          ! grep -Fq '/promotion' "$client"
          ! grep -Fq '/learner' "$client"
          ! grep -Fq 'admin-current-affairs-release' "$route"
          ! grep -Fq 'question-promotion' "$route"
          ! grep -Fq 'quiz-delivery' "$route"
          ! grep -Fq 'notification' "$route"

      - name: Bundle Generate Yesterday runtime
        run: pnpm --dir artifacts/api-server exec esbuild src/current-affairs/on-demand-yesterday-runtime.ts --bundle --packages=external --platform=node --format=esm --outfile=/tmp/current-affairs-on-demand-yesterday.mjs

      - name: Bundle Open News discovery runtime
        run: pnpm --dir artifacts/api-server exec esbuild src/current-affairs/open-news-discovery.ts --bundle --packages=external --platform=node --format=esm --outfile=/tmp/current-affairs-open-news-discovery.mjs

      - name: Bundle Current Affairs editorial activation
        run: pnpm --dir artifacts/api-server exec esbuild src/routes/admin-current-affairs-editorial-activation.ts --bundle --packages=external --platform=node --format=esm --outfile=/tmp/current-affairs-editorial-activation.mjs

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Typecheck admin frontend
        run: pnpm --dir artifacts/admin-app typecheck

      - name: Build admin frontend
        run: pnpm --dir artifacts/admin-app build
