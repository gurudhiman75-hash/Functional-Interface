name: Validate PNL CP-005 dynamic candidate runtime

on:
  push:
    branches:
      - feat/pnl-001-cp005-dynamic-runtime
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/cp005-dynamic-*.ts"
      - ".github/workflows/validate-pnl-cp005-dynamic-runtime.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/cp005-dynamic-*.ts"
      - ".github/workflows/validate-pnl-cp005-dynamic-runtime.yml"

permissions:
  contents: write

jobs:
  validate-cp005-dynamic-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature source
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-cp005-dynamic-runtime

      - name: Remove zero-direction inverse boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/cp005-dynamic-cases.ts")
          source = path.read_text()
          old = "const declared = declaredPair(random);"
          replacement = '''const declared = {
                direction: "PROFIT" as const,
                ratePercent: rational(pickNumber(random, PROFIT_RATES)),
              };'''
          if source.count(old) != 1:
              if replacement in source:
                  raise SystemExit(0)
              raise SystemExit(f"expected one inverse declared selector, found {source.count(old)}")
          path.write_text(source.replace(old, replacement, 1))
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle dynamic runtime proof
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/cp005-dynamic-runtime.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/.cp005-dynamic-runtime.test.mjs \
            2>&1 | tee pnl-cp005-dynamic-runtime.log

      - name: Run 29-QL seed-sweep proof
        run: |
          set -o pipefail
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/.cp005-dynamic-runtime.test.mjs \
            2>&1 | tee -a pnl-cp005-dynamic-runtime.log

      - name: Commit proven correction
        run: |
          if git diff --quiet -- artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/cp005-dynamic-cases.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/cp005-dynamic-cases.ts
          git commit -m "fix(pnl): avoid CP-005 zero-direction inverse cases"
          git push origin HEAD:feat/pnl-001-cp005-dynamic-runtime

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnl-cp005-dynamic-runtime-proof
          path: pnl-cp005-dynamic-runtime.log
          if-no-files-found: error
          retention-days: 7
