name: Validate INT-001 Comprehensive Gap Wave01

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp010-sequential-mixed-source-reopen-v1.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp010-sequential-mixed-source-reopen-v2.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-comprehensive-gap-wave01-audit.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-comprehensive-gap-wave01-merge-split-audit.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/INT-001-COMPREHENSIVE-GAP-WAVE01-STATUS.md'
      - '.github/workflows/int-001-comprehensive-gap-wave01.yml'

jobs:
  validate-int-001-comprehensive-gap-wave01:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run source-backed sequential mixed gap audit
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-comprehensive-gap-wave01-audit.ts | tee int-001-comprehensive-gap-wave01.log
          grep -q 'PASS_INT_001_COMPREHENSIVE_GAP_WAVE01_AUDIT' int-001-comprehensive-gap-wave01.log

      - name: Prove minimal merge split and ownership structure
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-comprehensive-gap-wave01-merge-split-audit.ts | tee int-001-comprehensive-gap-wave01-merge-split.log
          grep -q 'PASS_INT_001_COMPREHENSIVE_GAP_WAVE01_MERGE_SPLIT_AUDIT' int-001-comprehensive-gap-wave01-merge-split.log

      - name: Preserve frozen chapter baseline
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-chapter-final-readiness-v1-audit.ts | tee int-001-baseline-regression.log
          grep -q 'PASS_INT_001_CHAPTER_FINAL_READINESS_V1_AUDIT' int-001-baseline-regression.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Record exact validation head
        run: |
          echo "validated_head=$(git rev-parse HEAD)" | tee int-001-comprehensive-gap-wave01-head.log
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Upload gap-wave evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-001-comprehensive-gap-wave01
          path: |
            int-001-comprehensive-gap-wave01.log
            int-001-comprehensive-gap-wave01-merge-split.log
            int-001-baseline-regression.log
            int-001-comprehensive-gap-wave01-head.log
          retention-days: 30
