name: Validate GEO-LOC-001 Wave 4 Review

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/indian-geography/location-extent-neighbours/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geo-loc-001-wave4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-wave4:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Qualify CP009–CP011
        run: |
          mkdir -p artifacts/api-server/dist/geography
          for cp in 009 010 011; do
            pnpm --dir artifacts/api-server exec esbuild "src/knowledge-v1/indian-geography/location-extent-neighbours/geo-loc-001-cp${cp}-review-batch-v1.test.ts" --bundle --packages=external --platform=node --format=esm --outfile="dist/geography/geo-loc-001-cp${cp}-review-batch-v1.test.mjs"
            node "artifacts/api-server/dist/geography/geo-loc-001-cp${cp}-review-batch-v1.test.mjs"
          done
      - name: Materialize CP009–CP011 review files
        run: |
          mkdir -p artifacts/api-server/dist/geography
          for cp in 009 010 011; do
            pnpm --dir artifacts/api-server exec esbuild "src/knowledge-v1/indian-geography/location-extent-neighbours/geo-loc-001-cp${cp}-export-review-v1.ts" --bundle --packages=external --platform=node --format=esm --outfile="dist/geography/geo-loc-001-cp${cp}-export-review-v1.mjs"
            (cd artifacts/api-server && node "dist/geography/geo-loc-001-cp${cp}-export-review-v1.mjs")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: GEO-LOC-001-WAVE4-REVIEW
          path: |
            artifacts/api-server/dist/geography-review/GEO-LOC-001-CP009-V1/
            artifacts/api-server/dist/geography-review/GEO-LOC-001-CP010-V1/
            artifacts/api-server/dist/geography-review/GEO-LOC-001-CP011-V1/
          if-no-files-found: error
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
