name: Validate SAP CP-001 Permanent Allocation

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/**"
      - ".github/workflows/validate-sap-cp001-permanent-allocation.yml"
  workflow_dispatch:

jobs:
  validate-sap-cp001-permanent-allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle permanent allocation authority
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-001/SAP-CP-001-PERMANENT-ALLOCATION-AUTHORITY.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/sap-cp001-permanent-allocation-authority.test.mjs

      - name: Run permanent allocation authority
        working-directory: artifacts/api-server
        run: node dist/sap-cp001-permanent-allocation-authority.test.mjs

      - name: Bundle updated saturation authority
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-001/SAP-CP-001-SATURATION-AUTHORITY.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/sap-cp001-post-allocation-saturation.test.mjs

      - name: Run updated saturation authority
        working-directory: artifacts/api-server
        run: node dist/sap-cp001-post-allocation-saturation.test.mjs
