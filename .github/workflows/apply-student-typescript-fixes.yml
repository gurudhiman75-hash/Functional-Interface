name: Apply student TypeScript baseline fixes

on:
  push:
    branches:
      - fix/student-typescript-baseline
    paths:
      - .github/workflows/apply-student-typescript-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-student-typescript-fixes
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/student-typescript-baseline
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Apply asserted source fixes
        run: node scripts/apply-student-typescript-fixes.mjs

      - name: Regenerate locked workspace graph
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Install regenerated lockfile
        run: pnpm install --frozen-lockfile

      - name: Run strict student typecheck
        run: pnpm --dir artifacts/examtree typecheck

      - name: Build student production application
        run: pnpm --dir artifacts/examtree build

      - name: Typecheck admin application
        run: pnpm run typecheck:admin

      - name: Remove temporary codemod machinery
        run: git rm scripts/apply-student-typescript-fixes.mjs .github/workflows/apply-student-typescript-fixes.yml

      - name: Commit verified fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/examtree artifacts/admin-app/package.json lib/api-zod/src/index.ts pnpm-lock.yaml
          git commit -m "fix(student): restore strict TypeScript baseline"
          git push origin HEAD:fix/student-typescript-baseline
