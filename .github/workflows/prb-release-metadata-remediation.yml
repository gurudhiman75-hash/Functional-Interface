name: Probability release metadata remediation

on:
  push:
    branches:
      - feat/prb-probability-end-to-end
    paths:
      - ".github/workflows/prb-release-metadata-remediation.yml"

permissions:
  contents: write

jobs:
  remediate-release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prb-probability-end-to-end

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Align Probability English mock release metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          engine_path = Path("artifacts/api-server/src/quant-v4/generation-engine.ts")
          engine = engine_path.read_text()

          old_package = "\n".join([
              '    runtimeMode: "AUTOMATED_PRODUCTION_QA",',
              '    reviewStatus: "AUTOMATED_PRODUCTION_QA_PENDING_MANUAL_REVIEW",',
              '    questionBankStatus: "NOT_STORED",',
              '    testEligibility: "INELIGIBLE",',
              '    publiclyPublishable: false,',
              '    exactArithmetic: "BIGINT_RATIONAL",',
          ])
          new_package = "\n".join([
              '    runtimeMode: "ENGLISH_MOCK_READY",',
              '    reviewStatus: "APPROVED_EDITORIAL_ENGLISH",',
              '    questionBankStatus: "WRITABLE",',
              '    testEligibility: "ELIGIBLE_WITH_FAMILY_LIMIT",',
              '    publiclyPublishable: false,',
              '    freezeStatus: "ENGLISH_MOCK_READY",',
              '    itemPolicyAuthority: "QUESTION_TRACEABILITY",',
              '    maxPerMockPerFamily: 1,',
              '    exactArithmetic: "BIGINT_RATIONAL",',
          ])
          engine = replace_once(engine, old_package, new_package, "Question Studio package metadata")

          engine = replace_once(
              engine,
              '      runtimeMode: pnlRuntimeMode ?? (isProbability ? "AUTOMATED_PRODUCTION_QA" : "DYNAMIC"),',
              '      runtimeMode: pnlRuntimeMode ?? (isProbability ? "ENGLISH_MOCK_READY" : "DYNAMIC"),',
              "Probability generation runtime mode",
          )

          old_context = "\n".join([
              '      ...(isProbability',
              '        ? {',
              '            reviewStatus: "AUTOMATED_PRODUCTION_QA_PENDING_MANUAL_REVIEW",',
              '            questionBankStatus: "NOT_STORED",',
              '            testEligibility: "INELIGIBLE",',
              '            publiclyPublishable: false,',
              '          }',
              '        : {}),',
          ])
          new_context = "\n".join([
              '      ...(isProbability',
              '        ? {',
              '            reviewStatus: "APPROVED_EDITORIAL_ENGLISH",',
              '            questionBankStatus: "WRITABLE",',
              '            testEligibility: "ELIGIBLE_WITH_FAMILY_LIMIT",',
              '            publiclyPublishable: false,',
              '            freezeStatus: "ENGLISH_MOCK_READY",',
              '            itemPolicyAuthority: "QUESTION_TRACEABILITY",',
              '            maxPerMockPerFamily: 1,',
              '          }',
              '        : {}),',
          ])
          engine = replace_once(engine, old_context, new_context, "Probability generation context metadata")
          engine_path.write_text(engine)

          test_path = Path("artifacts/api-server/src/quant-v4/topics/Probability/question-studio-profile.test.ts")
          test = test_path.read_text()

          package_anchor = '    assert(definition.optionCountByExamProfile?.BANKING_MAINS === 5, `${packageId} banking option count is incorrect.`);'
          package_assertions = "\n".join([
              package_anchor,
              '    assert(definition.runtimeMode === "ENGLISH_MOCK_READY", `${packageId} runtime mode is not English mock-ready.`);',
              '    assert(definition.reviewStatus === "APPROVED_EDITORIAL_ENGLISH", `${packageId} review status is not approved.`);',
              '    assert(definition.questionBankStatus === "WRITABLE", `${packageId} Question Bank status is not writable.`);',
              '    assert(definition.testEligibility === "ELIGIBLE_WITH_FAMILY_LIMIT", `${packageId} test eligibility is incorrect.`);',
              '    assert(definition.publiclyPublishable === false, `${packageId} must remain blocked from public publication.`);',
              '    assert(definition.freezeStatus === "ENGLISH_MOCK_READY", `${packageId} freeze status is incorrect.`);',
              '    assert(definition.maxPerMockPerFamily === 1, `${packageId} family limit is not enforced.`);',
          ])
          test = replace_once(test, package_anchor, package_assertions, "Question Studio package status assertions")

          context_anchor = '  assert(bankHard.questionPackages.length === 10, "Banking Mains hard-pool batch size is incorrect.");'
          context_assertions = "\n".join([
              context_anchor,
              '  for (const [label, batch] of [["SSC", ssc], ["Banking", bank]] as const) {',
              '    const context = batch.generationContext as any;',
              '    assert(context.runtimeMode === "ENGLISH_MOCK_READY", `${label} generation context is not English mock-ready.`);',
              '    assert(context.reviewStatus === "APPROVED_EDITORIAL_ENGLISH", `${label} generation context is not approved.`);',
              '    assert(context.questionBankStatus === "WRITABLE", `${label} generation context is not writable.`);',
              '    assert(context.testEligibility === "ELIGIBLE_WITH_FAMILY_LIMIT", `${label} generation context eligibility is incorrect.`);',
              '    assert(context.publiclyPublishable === false, `${label} generation context must remain non-public.`);',
              '    assert(context.freezeStatus === "ENGLISH_MOCK_READY", `${label} generation context freeze status is incorrect.`);',
              '    assert(context.maxPerMockPerFamily === 1, `${label} generation context family limit is incorrect.`);',
              '  }',
          ])
          test = replace_once(test, context_anchor, context_assertions, "Probability generation context assertions")
          test_path.write_text(test)
          PY

      - name: Verify Probability Question Studio release metadata
        run: |
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/question-studio-profile.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/exam-readiness.test.ts
          git diff --check

      - name: Commit remediation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prb-release-metadata-remediation.yml
          git add artifacts/api-server/src/quant-v4/generation-engine.ts
          git add artifacts/api-server/src/quant-v4/topics/Probability/question-studio-profile.test.ts
          git diff --cached --check
          git commit -m "fix(probability): align English mock release metadata"
          git push
