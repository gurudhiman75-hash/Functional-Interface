name: MEN-CP-007 Shortcut Equivalence Patch

on:
  pull_request:
    branches:
      - feat/men-002-cp007-gap-wave-03
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-cp007-shortcut-equivalence-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Allow only the approved presentation-equivalent shortcut pair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-007/men-cp-007-production-audit.ts")
          text = path.read_text(encoding="utf8")
          old = '''const crossContractShortcutDuplicates = [...shortcutOwners.entries()]
            .filter(([, owners]) => owners.size > 1)
            .map(([shortcut, owners]) => ({ shortcut, owners: [...owners] }));
          assert.deepEqual(crossContractShortcutDuplicates, [], "The same shortcut text is reused across distinct CP-007 contracts.");'''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines())
          new = '''const allowedPresentationEquivalentOwners = new Set([
            [
              "foundation:MEN-CP007-PROT-CUBOID-SPACE-DIAGONAL",
              "foundation:MEN-CP007-PROT-LONGEST-ROD-CUBOID",
            ].sort().join("|"),
          ]);
          const crossContractShortcutDuplicates = [...shortcutOwners.entries()]
            .filter(([, owners]) => owners.size > 1)
            .map(([shortcut, owners]) => ({ shortcut, owners: [...owners].sort() }))
            .filter(({ owners }) => !allowedPresentationEquivalentOwners.has(owners.join("|")));
          assert.deepEqual(crossContractShortcutDuplicates, [], "The same shortcut text is reused across genuinely distinct CP-007 contracts.");'''
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines())
          if text.count(old) != 1:
            raise SystemExit(f"Expected one duplicate-shortcut audit block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf8")
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-007/men-cp-007-production-audit.ts
          git commit -m "test(mensuration): allow approved presentation-equivalent shortcut"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
