name: Validate SAP-CP-008 additive approximation

on:
  pull_request:
    branches:
      - feat/sap-cp007-rounding-foundation
      - feat/sap-cp006-exact-synthesis-foundation
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-008/**
      - .github/workflows/validate-sap-cp008-additive.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-sap-cp008-additive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-sap-cp008-additive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle CP-008 authority
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-008/authority-v3.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/sap-cp008-authority.test.mjs
      - name: Run CP-008 authority
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/sap-cp008-authority.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/sap-cp008-authority.log
      - name: Upload CP-008 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sap-cp008-additive-authority
          path: artifacts/api-server/dist/quant-v4/sap-cp008-authority.log
          if-no-files-found: error
          retention-days: 30
