name: Validate SPA CND-001 Question Studio V2 Explanation Quality V1

on:
  push:
    branches:
      - feat/spa-cnd-001-explanation-v4-ql046-047-review
    paths:
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/cubes-dice-foundation-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/cubes-dice-voxel-exam-renderer-v2.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/cubes-dice-voxel-projection-runtime-v2.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-permanent-ql-allocation-v8.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/cubes-dice-voxel-projection-permanent-english-runtime-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/cubes-dice-student-solution-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/cubes-dice-question-studio-seeded-runtime-v2.ts
      - artifacts/api-server/src/reasoning-v1/tests/spatial-cubes-dice-question-studio-v2-explanation-quality-v1.test.ts
      - .github/workflows/spa-cnd-001-question-studio-v2-explanation-quality-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cnd-question-studio-v2-explanations:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build current API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle CND Question Studio V2 explanation proof
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-cubes-dice-question-studio-v2-explanation-quality-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-cubes-dice-question-studio-v2-explanation-quality-v1.test.mjs

      - name: Validate and generate direct review pack
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-cubes-dice-question-studio-v2-explanation-quality-v1.test.mjs \
            | tee dist/reasoning-v1/spatial/spa-cnd-001-question-studio-v2-explanation-review-run.log

      - name: Upload CND Question Studio V2 explanation review pack
        uses: actions/upload-artifact@v4
        with:
          name: spa-cnd-001-question-studio-v2-explanation-review-v1
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/spa-cnd-001-question-studio-v2-explanation-review.html
            artifacts/api-server/dist/reasoning-v1/spatial/spa-cnd-001-question-studio-v2-explanation-review-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-cnd-001-question-studio-v2-explanation-review-run.log
          if-no-files-found: error
