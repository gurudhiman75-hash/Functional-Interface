name: Validate SPA-FND-001 visual runtime

on:
  pull_request:
    branches:
      - design/spa-001-family-blueprint
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/**
      - artifacts/api-server/src/reasoning-v1/tests/spatial-foundation.test.ts
      - .github/workflows/spa-fnd-001-visual-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spa-fnd-001-visual-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-spatial-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle spatial foundation proof
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-foundation.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-foundation.test.mjs
      - name: Run spatial foundation proof
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-foundation.test.mjs
