name: Apply PNL Multilingual Audit Parity Correction

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/**"
      - ".github/workflows/validate-pnl-multilingual-editorial-audit.yml"

permissions:
  contents: write

jobs:
  apply-audit-parity-correction:
    if: github.head_ref == 'audit/pnl-001-multilingual-editorial-freeze'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/pnl-001-multilingual-editorial-freeze
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Allow additional native teaching steps
        run: |
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-multilingual-audit-parity-fix.mjs
          pnpm exec prettier --write artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-001-multilingual-editorial-audit.ts

      - name: Prove existing multilingual source contract
        run: |
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          for source in \
            editorial-v2-multilingual-audit.ts \
            editorial-v2-multilingual-render.test.ts \
            editorial-v2-multilingual-source-parity.ts; do
            name="${source%.ts}"
            pnpm --dir artifacts/api-server exec esbuild \
              "src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/$source" \
              --bundle --platform=node --format=esm \
              --outfile="src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.$name.mjs"
            node "$root/.$name.mjs"
          done

      - name: Generate corrected 372-row audit corpus
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-001-multilingual-editorial-audit.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.pnl-001-multilingual-editorial-audit.mjs
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.pnl-001-multilingual-editorial-audit.mjs \
            2>&1 | tee pnl-multilingual-editorial-audit.log

      - name: Reject structural blockers
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = "dist/quant-v4/pnl-001-multilingual-editorial-audit/pnl-001-multilingual-editorial-findings.json";
          const findings = JSON.parse(fs.readFileSync(path, "utf8"));
          if (findings.fatalFindings.length) {
            console.error(JSON.stringify(findings.fatalFindings, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({ fatalFindingCount: 0 }, null, 2));
          NODE

      - name: Commit validated audit authority
        run: |
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          rm -f \
            "$root/.editorial-v2-multilingual-audit.mjs" \
            "$root/.editorial-v2-multilingual-render.test.mjs" \
            "$root/.editorial-v2-multilingual-source-parity.mjs" \
            "$root/.pnl-001-multilingual-editorial-audit.mjs" \
            "$root/pnl-multilingual-audit-parity-fix.mjs"
          git checkout 05119d96f5bebfb6d5cebaef0771cdfde37d16b4 -- .github/workflows/validate-pnl-multilingual-editorial-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "audit(pnl): allow enriched native teaching steps"
          git push origin HEAD:audit/pnl-001-multilingual-editorial-freeze

      - name: Upload multilingual review corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnl-001-multilingual-editorial-audit
          path: |
            dist/quant-v4/pnl-001-multilingual-editorial-audit
            pnl-multilingual-editorial-audit.log
          if-no-files-found: error
          retention-days: 14
