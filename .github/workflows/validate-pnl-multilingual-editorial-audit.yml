name: Apply PNL Multilingual Lexical Naturalness Wave 01

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/**"
      - ".github/workflows/validate-pnl-multilingual-editorial-audit.yml"

permissions:
  contents: write

jobs:
  apply-and-prove:
    if: github.head_ref == 'feat/pnl-001-multilingual-lexical-naturalness-wave01'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-multilingual-lexical-naturalness-wave01
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked workspace dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile

      - name: Apply native lexical authority
        run: |
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-multilingual-lexical-wave01-apply.mjs apply

      - name: Regenerate all native Editorial V2 libraries
        run: |
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/editorial-v2-multilingual-export.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-multilingual-export.mjs
          node "$root/.editorial-v2-multilingual-export.mjs"
          for cp in 001 002 003 004 005 006; do
            for language in hi pa; do
              cp "$root/.editorial-v2-multilingual-generated/CP-$cp.editorial-content.$language.json" \
                "$root/CP-$cp/editorial-content.$language.json"
            done
          done
          pnpm exec prettier --write \
            "$root/foundation/editorial-v2-multilingual-normalizer.ts" \
            "$root/CP-003/question-language.hi.json" \
            "$root/CP-003/question-language.pa.json" \
            "$root"/CP-*/editorial-content.hi.json \
            "$root"/CP-*/editorial-content.pa.json \
            "$root/pnl-001-multilingual-lexical-naturalness.test.ts"

      - name: Prove parity rendering naturalness and audit
        run: |
          set -o pipefail
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          for source in \
            editorial-v2-multilingual-audit.ts \
            editorial-v2-multilingual-render.test.ts \
            editorial-v2-multilingual-source-parity.ts \
            pnl-001-multilingual-lexical-naturalness.test.ts \
            pnl-001-multilingual-editorial-audit.ts; do
            name="${source%.ts}"
            pnpm --dir artifacts/api-server exec esbuild \
              "src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/$source" \
              --bundle --platform=node --format=esm \
              --outfile="src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.$name.mjs" \
              2>&1 | tee -a pnl-multilingual-lexical-wave01.log
            node "$root/.$name.mjs" 2>&1 | tee -a pnl-multilingual-lexical-wave01.log
          done
          node - <<'NODE'
          const fs = require("node:fs");
          const findings = JSON.parse(fs.readFileSync(
            "dist/quant-v4/pnl-001-multilingual-editorial-audit/pnl-001-multilingual-editorial-findings.json",
            "utf8",
          ));
          if (findings.fatalFindings.length || findings.lexicalReviewFindings.length) {
            console.error(JSON.stringify({
              fatalFindings: findings.fatalFindings,
              lexicalReviewFindings: findings.lexicalReviewFindings,
            }, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({
            fatalFindingCount: 0,
            lexicalReviewFindingCount: 0,
            editorialFindingCount: findings.editorialFindings.length,
          }, null, 2));
          NODE

      - name: Restore permanent workflow and commit
        run: |
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          git checkout 6375788c89adcfe7d5acf06616ca89ac0f57c0ad -- .github/workflows/validate-pnl-multilingual-editorial-audit.yml
          node "$root/pnl-multilingual-lexical-wave01-apply.mjs" finalize
          pnpm exec prettier --write .github/workflows/validate-pnl-multilingual-editorial-audit.yml
          rm -f \
            .github/workflows/implement-pnl-multilingual-lexical-wave01.yml \
            .github/workflows/run-pnl-multilingual-lexical-wave01.yml \
            "$root/pnl-multilingual-lexical-wave01-apply.mjs" \
            "$root"/.editorial-v2-multilingual-export.mjs \
            "$root"/.editorial-v2-multilingual-audit.mjs \
            "$root"/.editorial-v2-multilingual-render.test.mjs \
            "$root"/.editorial-v2-multilingual-source-parity.mjs \
            "$root"/.pnl-001-multilingual-lexical-naturalness.test.mjs \
            "$root"/.pnl-001-multilingual-editorial-audit.mjs
          rm -rf "$root/.editorial-v2-multilingual-generated"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(pnl): naturalize multilingual lexical authority"
          git push origin HEAD:feat/pnl-001-multilingual-lexical-naturalness-wave01

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnl-multilingual-lexical-wave01
          path: |
            pnl-multilingual-lexical-wave01.log
            dist/quant-v4/pnl-001-multilingual-editorial-audit
          if-no-files-found: error
          retention-days: 14
