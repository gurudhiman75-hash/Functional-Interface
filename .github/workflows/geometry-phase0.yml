name: Validate Geometry Phase 0 foundation

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/quant-v4/shared/geometry/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/**
      - .github/workflows/geometry-phase0.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geometry-phase0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-geometry-phase0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify composite Revision-3 design authority bytes
        run: |
          set -euo pipefail
          ROOT=artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry

          # Preserve and verify the original Revision-2 authority exactly.
          echo "aaf04f001b231c1c6548eb126d7788206239ce55c22613c1ef5f0630db263829  $ROOT/design-authority-rev2/part-01.md" | sha256sum -c -
          echo "b4ffa720d118f479928d6a12858a2f331d6371ffba38ab8005cc1d46a0de1e2e  $ROOT/design-authority-rev2/part-02.md" | sha256sum -c -
          echo "7166d89e7d6b88926121bc1e4d70772289b0a797abcc8016ff6600a4ee99f969  $ROOT/design-authority-rev2/part-03.md" | sha256sum -c -
          echo "90fc6bf15e319da3d82180a5943ffe4a68e71dd1d5bff00de7e33835ba0f3735  $ROOT/design-authority-rev2/part-04.md" | sha256sum -c -
          {
            cat "$ROOT/design-authority-rev2/part-01.md"
            printf '\n'
            cat "$ROOT/design-authority-rev2/part-02.md"
            cat "$ROOT/design-authority-rev2/part-03.md"
            printf '\n'
            cat "$ROOT/design-authority-rev2/part-04.md"
          } > /tmp/GEO-END-TO-END-DESIGN-REV2.reconstructed.md
          echo "1790e494167121d2541145deea128d202feb125496ac72533a3340f09edf10d8  /tmp/GEO-END-TO-END-DESIGN-REV2.reconstructed.md" | sha256sum -c -

          # Verify the Revision-3 diagram-policy amendment and its critical governance clauses.
          AMENDMENT="$ROOT/design-authority-rev3/diagram-policy-amendment.md"
          echo "08b8560c195b0bc090ef1c9c5ced5d0723c076db3bf7096fb01a108df2b06bf2  $AMENDMENT" | sha256sum -c -
          grep -F 'NO_DIAGRAM' "$AMENDMENT"
          grep -F 'OPTIONAL_STEM_DIAGRAM' "$AMENDMENT"
          grep -F 'REQUIRED_STEM_DIAGRAM' "$AMENDMENT"
          grep -F 'REQUIRED_SOLUTION_DIAGRAM' "$AMENDMENT"
          grep -F 'REQUIRED_BOTH' "$AMENDMENT"
          grep -F 'notToScale = true' "$AMENDMENT"
          grep -F 'Before permanent QL freeze' "$AMENDMENT"

          # Confirm the human-facing authority manifest points to the composite Revision-3 authority.
          grep -F 'End-to-End Design Authority Revision 3' "$ROOT/GEO-END-TO-END-DESIGN.md"
          grep -F 'design-authority-rev3/diagram-policy-amendment.md' "$ROOT/GEO-END-TO-END-DESIGN.md"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle Geometry Phase 0 proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/run-phase0.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/quant-v4/geometry-phase0.test.mjs
      - name: Run Geometry Phase 0 proof
        run: node artifacts/api-server/dist/quant-v4/geometry-phase0.test.mjs
