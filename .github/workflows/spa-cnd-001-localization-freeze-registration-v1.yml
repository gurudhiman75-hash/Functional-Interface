name: Validate SPA CND-001 Localization Freeze Registration V1

on:
  push:
    branches:
      - feat/spa-cnd-001-localization-freeze-registration-v1
    paths:
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/cubes-dice-student-solution-localization-freeze-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/cubes-dice-question-studio-registered-runtime-v1.ts
      - artifacts/api-server/src/reasoning-v1/tests/spatial-cubes-dice-localization-freeze-registration-v1.test.ts
      - artifacts/api-server/src/routes/admin-question-studio-cubes-dice.ts
      - artifacts/api-server/src/routes/admin-question-studio-registry.ts
      - artifacts/admin-app/src/features/question-studio/cubes-dice-review-api.ts
      - artifacts/admin-app/src/pages/content/QuestionStudioCubesDiceReviewPanel.tsx
      - artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx
      - .github/workflows/spa-cnd-001-localization-freeze-registration-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cnd-localization-freeze-registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Typecheck admin Question Studio UI
        run: pnpm --dir artifacts/admin-app typecheck

      - name: Bundle CND localization freeze registration proof
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-cubes-dice-localization-freeze-registration-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-cubes-dice-localization-freeze-registration-v1.test.mjs

      - name: Validate registration and generate localized review pack
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-cubes-dice-localization-freeze-registration-v1.test.mjs \
            | tee dist/reasoning-v1/spatial/cnd-001-localization-freeze-registration-v1-run.log

      - name: Upload localized review evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-cnd-001-localization-freeze-registration-review-v1
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/cnd-001-hi-pa-solution-review-v1.html
            artifacts/api-server/dist/reasoning-v1/spatial/cnd-001-localization-freeze-registration-v1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/cnd-001-localization-freeze-registration-v1-run.log
          if-no-files-found: error
