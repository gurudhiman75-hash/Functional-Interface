name: MEN-002 Wave01 Visible MathJax Patch

on:
  pull_request:
    branches:
      - design/men-002-end-to-end-discovery
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-002-wave01-visible-mathjax-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Restrict MathJax audit to learner-visible output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-01")

          runtime = root / "runtime.ts"
          text = runtime.read_text()
          old = '''  const serialised = JSON.stringify(question, (_key, value) => typeof value === "bigint" ? value.toString() : value);
          const explanationText = ['''.replace("          ", "")
          new = '''  const explanationText = ['''.replace("          ", "")
          if text.count(old) != 1:
            raise SystemExit(f"runtime serialised block: expected one match, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''  ].join("\\n");
          const checks = ['''.replace("          ", "")
          new = '''  ].join("\\n");
          const learnerText = [
            question.stem,
            ...question.options.map((option) => option.display),
            question.answer,
            explanationText,
          ].join("\\n");
          const checks = ['''.replace("          ", "")
          if text.count(old) != 1:
            raise SystemExit(f"runtime learner block: expected one match, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    { name: "MathJax cleanliness", passed: !/[½¼²³]/.test(serialised) && !/(^|[^\\\\])sqrt\\{/.test(explanationText), message: "Use MathJax fractions, powers and square roots." },'''
          new = '''    { name: "MathJax cleanliness", passed: !/[½¼²³]/.test(learnerText) && !/(^|[^\\\\])sqrt\\{/.test(explanationText), message: "Use MathJax fractions, powers and square roots." },'''
          if text.count(old) != 1:
            raise SystemExit(f"runtime MathJax check: expected one match, found {text.count(old)}")
          runtime.write_text(text.replace(old, new, 1))

          test = root / "runtime.test.ts"
          text = test.read_text()
          old = '''    const serialised = JSON.stringify(first, (_key, value) => typeof value === "bigint" ? value.toString() : value);
              const explanationText = ['''.replace("              ", "")
          new = '''    const explanationText = ['''.replace("              ", "")
          if text.count(old) != 1:
            raise SystemExit(f"test serialised block: expected one match, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    ].join("\\n");
              assert.equal(/[½¼²³]/.test(serialised), false, `${prototypeId} contains raw Unicode fractions or dimensional powers.`);'''.replace("              ", "")
          new = '''    ].join("\\n");
              const learnerText = [
                first.stem,
                ...first.options.map((option) => option.display),
                first.answer,
                explanationText,
              ].join("\\n");
              assert.equal(/[½¼²³]/.test(learnerText), false, `${prototypeId} contains raw Unicode fractions or dimensional powers in learner-visible output.`);'''.replace("              ", "")
          if text.count(old) != 1:
            raise SystemExit(f"test learner block: expected one match, found {text.count(old)}")
          test.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-01/runtime.ts artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-01/runtime.test.ts
          git commit -m "fix(mensuration): audit wave 01 learner-visible MathJax"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
