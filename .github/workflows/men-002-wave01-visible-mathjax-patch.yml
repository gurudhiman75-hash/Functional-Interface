name: MEN-002 Wave01 Visible MathJax Patch

on:
  pull_request:
    branches:
      - design/men-002-end-to-end-discovery
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-002-wave01-visible-mathjax-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Restrict MathJax audit to learner-visible output
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-01")

          runtime = root / "runtime.ts"
          text = runtime.read_text()
          text, count = re.subn(
            r'  const serialised = JSON\.stringify\(question,.*?\);\n',
            '',
            text,
            count=1,
          )
          if count != 1:
            raise SystemExit(f"runtime serialised declaration: expected one match, found {count}")

          marker = '  const checks = ['
          learner = '''  const learnerText = [
            question.stem,
            ...question.options.map((option) => option.display),
            question.answer,
            explanationText,
          ].join("\\n");
          '''
          learner = "\n".join(line[10:] if line.startswith("          ") else line for line in learner.splitlines())
          if text.count(marker) != 1:
            raise SystemExit(f"runtime checks marker: expected one match, found {text.count(marker)}")
          text = text.replace(marker, learner + marker, 1)
          if text.count('.test(serialised)') != 1:
            raise SystemExit(f"runtime serialised check: expected one match, found {text.count('.test(serialised)')}")
          runtime.write_text(text.replace('.test(serialised)', '.test(learnerText)', 1))

          test = root / "runtime.test.ts"
          text = test.read_text()
          text, count = re.subn(
            r'    const serialised = JSON\.stringify\(first,.*?\);\n',
            '',
            text,
            count=1,
          )
          if count != 1:
            raise SystemExit(f"test serialised declaration: expected one match, found {count}")

          marker = '    assert.equal(/[½¼²³]/.test(serialised), false, `${prototypeId} contains raw Unicode fractions or dimensional powers.`);'
          learner = '''    const learnerText = [
              first.stem,
              ...first.options.map((option) => option.display),
              first.answer,
              explanationText,
            ].join("\\n");
            '''
          learner = "\n".join(line[4:] if line.startswith("    ") else line for line in learner.splitlines())
          if text.count(marker) != 1:
            raise SystemExit(f"test Unicode assertion marker: expected one match, found {text.count(marker)}")
          replacement = learner + '    assert.equal(/[½¼²³]/.test(learnerText), false, `${prototypeId} contains raw Unicode fractions or dimensional powers in learner-visible output.`);'
          test.write_text(text.replace(marker, replacement, 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-01/runtime.ts artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-01/runtime.test.ts
          git commit -m "fix(mensuration): audit wave 01 learner-visible MathJax"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
