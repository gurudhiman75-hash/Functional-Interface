name: Validate NUM-CP-012 Wave 01 perfect-power foundation

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-012/**"
      - ".github/workflows/num-cp012-wave01-perfect-power-foundation-v1.yml"
  workflow_dispatch:

concurrency:
  group: num-cp012-wave01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-num-cp012-wave01-perfect-power-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Wave 01 runtime and independent audits
        shell: bash
        run: |
          set -euo pipefail
          base="src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-012/wave01"
          pnpm --dir artifacts/api-server exec esbuild "$base/runtime.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="dist/quant-v4/num-cp012-wave01-runtime-audit.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$base/independent-minimality.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="dist/quant-v4/num-cp012-wave01-independent-minimality.mjs"

      - name: Run exhaustive Wave 01 foundation audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-cp012-wave01-runtime-audit.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/num-cp012-wave01-runtime-audit.log

      - name: Run independent leastness and uniqueness audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-cp012-wave01-independent-minimality.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/num-cp012-wave01-independent-minimality.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Upload CP012 Wave 01 evidence
        uses: actions/upload-artifact@v4
        with:
          name: num-cp012-wave01-perfect-power-foundation-v1
          path: |
            artifacts/api-server/dist/quant-v4/num-cp012-wave01-runtime-audit.log
            artifacts/api-server/dist/quant-v4/num-cp012-wave01-independent-minimality.log
          if-no-files-found: error
          retention-days: 30
