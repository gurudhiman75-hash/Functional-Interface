name: Validate NUM-CP-001 Wave 03 discovery

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/**
      - .github/workflows/num-001-cp001-wave03-discovery.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp001-wave03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp001-wave03:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Wave 1 regression proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/wave01/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-wave01-regression.test.mjs

      - name: Run Wave 1 regression proof
        run: node artifacts/api-server/dist/quant-v4/num-001-cp001-wave01-regression.test.mjs

      - name: Bundle Wave 2 regression proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/wave02/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-wave02-regression.test.mjs

      - name: Run Wave 2 regression proof
        run: node artifacts/api-server/dist/quant-v4/num-001-cp001-wave02-regression.test.mjs

      - name: Bundle Wave 3 exact runtime proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/wave03/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-wave03-authority.test.mjs

      - name: Run Wave 3 exact runtime proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp001-wave03-authority.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp001-wave03-authority.log

      - name: Bundle Wave 3 structural audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/wave03/runtime-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-wave03-audit.mjs

      - name: Run Wave 3 structural audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp001-wave03-audit.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp001-wave03-audit.log

      - name: Bundle Wave 3 review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/wave03/review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-wave03-review-export.mjs

      - name: Generate Wave 3 review pack
        working-directory: artifacts/api-server
        run: node dist/quant-v4/num-001-cp001-wave03-review-export.mjs

      - name: Upload Wave 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: num-001-cp001-wave03-discovery
          path: |
            artifacts/api-server/dist/quant-v4/num-001-cp001-wave03-authority.log
            artifacts/api-server/dist/quant-v4/num-001-cp001-wave03-audit.log
            artifacts/api-server/dist/quant-v4/num-001-cp001-wave03-review.json
            artifacts/api-server/dist/quant-v4/num-001-cp001-wave03-review.md
          if-no-files-found: error
          retention-days: 14
