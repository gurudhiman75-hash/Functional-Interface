name: Validate Current Affairs Studio CP015

on:
  pull_request:
    branches:
      - New-main
      - feature/current-affairs-studio-cp001-foundation
      - feature/current-affairs-studio-cp002-ingestion
      - feature/current-affairs-studio-cp003-intelligence
      - feature/current-affairs-studio-cp004-content
      - feature/current-affairs-studio-cp005-scheduled-ingestion
      - feature/current-affairs-studio-cp006-daily-orchestration
      - feature/current-affairs-studio-cp007-official-source-pack
      - feature/current-affairs-studio-cp008-primary-fact-enrichment
      - feature/current-affairs-studio-cp009-original-authoring
      - feature/current-affairs-studio-cp010-multilingual-notes
      - feature/current-affairs-studio-cp011-multilingual-question-drafts
      - feature/current-affairs-studio-cp012-periodic-rollups
      - feature/current-affairs-studio-cp013-story-threading
      - feature/current-affairs-studio-cp014-editorial-release-control
    paths:
      - "artifacts/api-server/src/current-affairs/**"
      - "artifacts/api-server/src/routes/admin-current-affairs*.ts"
      - "artifacts/api-server/migrations/20260829_current_affairs_question_bank_promotion.sql"
      - ".github/workflows/current-affairs-cp015-question-bank-promotion.yml"
  push:
    branches:
      - feature/current-affairs-studio-cp015-question-bank-promotion
    paths:
      - "artifacts/api-server/src/current-affairs/**"
      - "artifacts/api-server/src/routes/admin-current-affairs*.ts"
      - "artifacts/api-server/migrations/20260829_current_affairs_question_bank_promotion.sql"
      - ".github/workflows/current-affairs-cp015-question-bank-promotion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-affairs-cp015-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-current-affairs-question-bank-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/examtree
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Current Affairs CP001 contracts
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/core.test.ts
      - name: Run Current Affairs CP002 ingestion contracts
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/ingestion.test.ts
      - name: Run Current Affairs CP003 intelligence contracts
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/intelligence.test.ts
      - name: Run Current Affairs CP004 content contracts
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/content.test.ts
      - name: Run Current Affairs CP005/CP007 automation contracts
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/automation.test.ts
      - name: Run Current Affairs CP006 orchestration policy contracts
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/orchestration-policy.test.ts
      - name: Run Current Affairs CP007 official listing contracts
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/official-listing.test.ts
      - name: Run Current Affairs CP008 primary fact extraction contracts
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/primary-fact-extraction.test.ts
      - name: Run Current Affairs CP009 original authoring contracts
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/original-authoring.test.ts
      - name: Run Current Affairs CP010 multilingual note contracts
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/multilingual-localization.test.ts
      - name: Run Current Affairs CP011 multilingual question contracts
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/multilingual-question-localization.test.ts
      - name: Run Current Affairs CP012 period policy contracts
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/periodic-rollup-policy.test.ts
      - name: Run Current Affairs CP013 story threading contracts
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/story-threading.test.ts
      - name: Run Current Affairs CP014 release policy contracts
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/release-policy.test.ts
      - name: Run Current Affairs CP015 promotion policy contracts
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/question-promotion-policy.test.ts

      - name: Verify promotion is frozen to the approved CP014 release snapshot
        shell: bash
        run: |
          set -euo pipefail
          schema=artifacts/api-server/migrations/20260829_current_affairs_question_bank_promotion.sql
          runtime=artifacts/api-server/src/current-affairs/question-promotion-runtime.ts
          policy=artifacts/api-server/src/current-affairs/question-promotion-policy.ts
          grep -Fq 'current_affairs_question_promotions' "$schema"
          grep -Fq 'current_affairs_release_question_items' "$schema"
          grep -Fq 'source_generation_version_id' "$schema"
          grep -Fq 'hindi_source_localization_id' "$schema"
          grep -Fq 'punjabi_source_localization_id' "$schema"
          grep -Fq 'hi_row.updated_at > release_row.approved_at' "$schema"
          grep -Fq 'pa_row.updated_at > release_row.approved_at' "$schema"
          grep -Fq 'current_version_id IS DISTINCT FROM NEW.source_generation_version_id' "$schema"
          grep -Fq 'changed after release approval' "$policy"
          grep -Fq 'currentSourceGenerationVersionId' "$runtime"
          grep -Fq 'frozenSourceGenerationVersionId' "$runtime"
          grep -Fq 'promotionPayloadHash' "$runtime"

      - name: Verify atomic canonical Question Bank and translation promotion
        shell: bash
        run: |
          set -euo pipefail
          runtime=artifacts/api-server/src/current-affairs/question-promotion-runtime.ts
          route=artifacts/api-server/src/routes/admin-current-affairs-question-promotion.ts
          mount=artifacts/api-server/src/routes/admin-current-affairs-release.ts
          grep -Fq 'convertApprovedGenerationItem' "$runtime"
          grep -Fq 'INSERT INTO content.question_translations' "$runtime"
          grep -Fq 'INSERT INTO content.question_translation_options' "$runtime"
          grep -Fq "status='approved'" "$runtime"
          grep -Fq 'optionKey(index)' "$runtime"
          grep -Fq 'questionBankAcceptanceMode: "BANK_ONLY"' "$runtime"
          grep -Fq 'examVersionAssigned: false' "$runtime"
          grep -Fq 'taxonomyAssigned: false' "$runtime"
          grep -Fq '/question-promotion/queue' "$route"
          grep -Fq '/question-promotion/releases/:id/promote' "$route"
          grep -Fq 'content.questions.approve' "$route"
          grep -Fq 'adminCurrentAffairsQuestionPromotionRouter' "$mount"

      - name: Verify BANK_ONLY publication bypass is closed at database boundary
        shell: bash
        run: |
          set -euo pipefail
          schema=artifacts/api-server/migrations/20260829_current_affairs_question_bank_promotion.sql
          grep -Fq 'guard_promoted_current_affairs_question_publication' "$schema"
          grep -Fq "acceptance_mode = 'BANK_ONLY'" "$schema"
          grep -Fq 'lifecycle.test_eligible IS DISTINCT FROM true' "$schema"
          grep -Fq 'lifecycle.publicly_publishable IS DISTINCT FROM true' "$schema"
          grep -Fq 'BEFORE UPDATE OF status, published_version_id ON content.questions' "$schema"
          grep -Fq 'revoke_promoted_current_affairs_questions_with_release' "$schema"
          grep -Fq "SET status='archived'::question_status" "$schema"

      - name: Verify CP015 does not invent exam mapping or open student publication
        shell: bash
        run: |
          set -euo pipefail
          runtime=artifacts/api-server/src/current-affairs/question-promotion-runtime.ts
          worker=artifacts/api-server/src/current-affairs/daily-worker.ts
          if grep -E 'SET[[:space:]]+exam_version_id|primary_taxonomy_node_id[[:space:]]*=|INSERT INTO content\.question_taxonomy_links' "$runtime"; then
            echo 'CP015 must not invent exam-version or taxonomy mapping during promotion'
            exit 1
          fi
          if grep -E "status[[:space:]]*=[[:space:]]*'published'::question_status|published_version_id[[:space:]]*=" "$runtime"; then
            echo 'CP015 must not publish canonical Current Affairs questions'
            exit 1
          fi
          grep -Fq 'testEligible: false' "$runtime"
          grep -Fq 'publiclyPublishable: false' "$runtime"
          grep -Fq 'automaticStudentPublication: false' "$runtime"
          if grep -Fq 'promoteCurrentAffairsReleaseQuestions' "$worker"; then
            echo 'Scheduled Current Affairs worker must never promote released questions to Question Bank'
            exit 1
          fi

      - name: Compile all Current Affairs workers
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/current-affairs/feed-worker.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/current-affairs-feed-worker.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/current-affairs/primary-enrichment-worker.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/current-affairs-primary-enrichment-worker.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/current-affairs/daily-worker.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/current-affairs-daily-worker.mjs

      - name: Build API server
        run: pnpm --dir artifacts/api-server build
