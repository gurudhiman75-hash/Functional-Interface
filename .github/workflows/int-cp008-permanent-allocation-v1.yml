name: Validate INT-CP-008 Permanent Allocation V1

on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp008-instalment-runtime-v1-final.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp008-permanent-allocation-v1-audit.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/INT-CP-008/INT-CP-008-PERMANENT-ALLOCATION-v1.md'
      - '.github/workflows/int-cp008-permanent-allocation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: int-cp008-permanent-allocation-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-int-cp008-permanent-allocation-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Rerun approved CP008 authority proposal audit
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp008-authority-proposal-audit.ts > int-cp008-authority-proposal-regression.log

      - name: Run CP008 permanent allocation audit
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp008-permanent-allocation-v1-audit.ts | tee int-cp008-permanent-allocation-v1.log

      - name: Verify permanent allocation marker
        run: grep -q 'PASS_INT_CP008_PERMANENT_ALLOCATION_V1_AUDIT' int-cp008-permanent-allocation-v1.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Record exact validation head
        run: |
          echo "validated_head=$(git rev-parse HEAD)" | tee int-cp008-permanent-allocation-v1-head.log
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Upload CP008 permanent allocation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-cp008-permanent-allocation-v1
          path: |
            int-cp008-authority-proposal-regression.log
            int-cp008-permanent-allocation-v1.log
            int-cp008-permanent-allocation-v1-head.log
          retention-days: 30
