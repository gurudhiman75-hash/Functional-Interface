name: Validate TSD CP-004 Straight-Line Relative Motion

on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001/cp004/**'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001/index.ts'
      - '.github/workflows/tsd-cp004-relative-motion.yml'
  push:
    branches:
      - feat/tsd-cp004-straight-line-relative-motion
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001/cp004/**'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001/index.ts'
      - '.github/workflows/tsd-cp004-relative-motion.yml'

jobs:
  validate-cp004:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce frozen CP003 and sole CP004 public surfaces
        run: |
          INDEX=artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001/index.ts
          grep -q 'cp003/localization/native-approved-freeze' "$INDEX"
          if grep -Eq 'cp003/localization/(native-final-candidate|native-final-polished-candidate)' "$INDEX"; then
            echo 'CP003 frozen public surface was reopened'
            exit 1
          fi
          grep -q 'cp004/final-review-candidate' "$INDEX"
          if grep -Eq 'cp004/(authority|types|generation|solver|verifier|runtime|runtime-final|runtime-v2|runtime-v3|native|native-final|native-polished|native-v2|native-v3|native-v4|native-v5|editorial-v2|final-surface|visual-v2|visual-v3|status)' "$INDEX"; then
            echo 'An intermediate CP004 entry point is publicly exported'
            exit 1
          fi

      - name: Bundle CP004 sole final proof and exporter
        run: |
          ROOT=src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001/cp004
          OUT=dist/quant-v4/tsd-001/cp004-final-surface
          mkdir -p artifacts/api-server/$OUT
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/proof-v5.ts" --bundle --platform=node --format=esm --outfile="$OUT/proof-v5.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/export-final-surface.ts" --bundle --platform=node --format=esm --outfile="$OUT/export-final-surface.mjs"

      - name: Run CP004 final exam-readiness proofs
        run: |
          set -o pipefail
          cd artifacts/api-server
          OUT=dist/quant-v4/tsd-001/cp004-final-surface
          node "$OUT/proof-v5.mjs" 2>&1 | tee "$OUT/proof-v5.log"
          node "$OUT/export-final-surface.mjs" "$OUT/artifact" 2>&1 | tee "$OUT/export-final-surface.log"

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Upload CP004 sole final review artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsd-cp004-final-review-surface
          path: |
            artifacts/api-server/dist/quant-v4/tsd-001/cp004-final-surface/artifact/*.json
            artifacts/api-server/dist/quant-v4/tsd-001/cp004-final-surface/artifact/*.html
            artifacts/api-server/dist/quant-v4/tsd-001/cp004-final-surface/*.log
          if-no-files-found: error
