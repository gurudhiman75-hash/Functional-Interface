name: Validate TSD CP-004 Straight-Line Relative Motion

on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001/cp004/**'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001/index.ts'
      - '.github/workflows/tsd-cp004-relative-motion.yml'
  push:
    branches:
      - feat/tsd-cp004-straight-line-relative-motion
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001/cp004/**'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001/index.ts'
      - '.github/workflows/tsd-cp004-relative-motion.yml'

jobs:
  validate-cp004:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Preserve frozen CP003 public surface
        run: |
          INDEX=artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001/index.ts
          grep -q 'cp003/localization/native-approved-freeze' "$INDEX"
          if grep -Eq 'cp003/localization/(native-final-candidate|native-final-polished-candidate)' "$INDEX"; then
            echo 'CP003 frozen public surface was reopened'
            exit 1
          fi

      - name: Bundle CP004 final proof and exporter
        run: |
          ROOT=src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001/cp004
          OUT=dist/quant-v4/tsd-001/cp004-editorial-v3-review
          mkdir -p artifacts/api-server/$OUT
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/proof-v4.ts" --bundle --platform=node --format=esm --outfile="$OUT/proof-v4.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/export-review-v3.ts" --bundle --platform=node --format=esm --outfile="$OUT/export-review-v3.mjs"

      - name: Run CP004 final exam-readiness and native grammar proofs
        run: |
          set -o pipefail
          cd artifacts/api-server
          OUT=dist/quant-v4/tsd-001/cp004-editorial-v3-review
          node "$OUT/proof-v4.mjs" 2>&1 | tee "$OUT/proof-v4.log"
          node "$OUT/export-review-v3.mjs" "$OUT/artifact" 2>&1 | tee "$OUT/export-v3.log"

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Upload CP004 final review artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsd-cp004-editorial-v3-multilingual-review
          path: |
            artifacts/api-server/dist/quant-v4/tsd-001/cp004-editorial-v3-review/artifact/*.json
            artifacts/api-server/dist/quant-v4/tsd-001/cp004-editorial-v3-review/artifact/*.html
            artifacts/api-server/dist/quant-v4/tsd-001/cp004-editorial-v3-review/*.log
          if-no-files-found: error
