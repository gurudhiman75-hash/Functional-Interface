name: Validate MEN-CP-012 permanent English runtime V2

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp012-foundation/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-012/**
      - .github/workflows/men-002-cp012-permanent-english-runtime-v2.yml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-002-cp012-permanent-english-runtime-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp012-permanent-english-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove 1,664 setter-hardened permanent questions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/api-server/dist/quant-v4
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-012/permanent/runtime-v2.test.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/quant-v4/men-cp012-permanent-english-runtime-v2.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp012-permanent-english-runtime-v2.test.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/men-cp012-permanent-english-runtime-v2.test.log
      - name: Prove 59-question setter-hardened review
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-012/permanent/review-v2.test.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/quant-v4/men-cp012-permanent-english-review-v2.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp012-permanent-english-review-v2.test.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/men-cp012-permanent-english-review-v2.test.log
      - name: Export setter-hardened review artifact
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-012/permanent/review-export-v2.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/quant-v4/men-cp012-permanent-english-review-v2.export.mjs
          cd artifacts/api-server
          node dist/quant-v4/men-cp012-permanent-english-review-v2.export.mjs \
            2>&1 | tee dist/quant-v4/men-cp012-permanent-english-review-v2.export.log
          test -s dist/quant-v4/men-cp012-permanent-english-review-v2.json
          test -s dist/quant-v4/men-cp012-permanent-english-review-v2.md
      - name: Regress permanent allocation V4
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-012/permanent/allocation.test.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/quant-v4/men-cp012-permanent-allocation-v4-regression-v2.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp012-permanent-allocation-v4-regression-v2.test.mjs
      - name: Build production API bundle
        run: bash build-api.sh
      - name: Upload setter-hardened permanent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-cp012-permanent-english-review-v2
          path: |
            artifacts/api-server/dist/quant-v4/men-cp012-permanent-english-runtime-v2.test.log
            artifacts/api-server/dist/quant-v4/men-cp012-permanent-english-review-v2.test.log
            artifacts/api-server/dist/quant-v4/men-cp012-permanent-english-review-v2.export.log
            artifacts/api-server/dist/quant-v4/men-cp012-permanent-english-review-v2.json
            artifacts/api-server/dist/quant-v4/men-cp012-permanent-english-review-v2.md
          if-no-files-found: error
          retention-days: 14
