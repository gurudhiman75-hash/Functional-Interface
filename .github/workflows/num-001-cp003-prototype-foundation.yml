name: Validate NUM-CP-003 prototype foundation

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/**
      - .github/workflows/num-001-cp003-prototype-foundation.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp003-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp003-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle deterministic proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/num-001-cp003-prototype.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp003-prototype.test.mjs
      - name: Run deterministic proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp003-prototype.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp003-prototype-proof.log
      - name: Bundle structural audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/num-001-cp003-structural-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp003-structural-audit.mjs
      - name: Run structural audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp003-structural-audit.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp003-structural-audit.log
      - name: Bundle review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/num-001-cp003-review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp003-review-export.mjs
      - name: Generate review pack
        working-directory: artifacts/api-server
        run: node dist/quant-v4/num-001-cp003-review-export.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: num-001-cp003-prototype-foundation
          path: |
            artifacts/api-server/dist/quant-v4/num-001-cp003-prototype-proof.log
            artifacts/api-server/dist/quant-v4/num-001-cp003-structural-audit.log
            artifacts/api-server/dist/quant-v4/num-001-cp003-prototype-review.json
            artifacts/api-server/dist/quant-v4/num-001-cp003-prototype-review.md
          if-no-files-found: error
          retention-days: 7
