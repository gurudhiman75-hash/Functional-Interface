name: Reasoning DIR-001 English Freeze

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/**
  push:
    branches: [New-main]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dir-001-english-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  english-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Prove English chapter corpus
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/reasoning-v1/topics/Direction-Sense/DIR-001/dir-001-english-freeze.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/dir-001-english-freeze.test.mjs
          node dist/reasoning-v1/dir-001-english-freeze.test.mjs
