name: Validate Current Affairs Studio CP024

on:
  pull_request:
    branches:
      - New-main
      - feature/current-affairs-studio-cp022-admin-control-center
      - feature/current-affairs-studio-cp023-editorial-workbench
    paths:
      - "artifacts/api-server/src/current-affairs/**"
      - "artifacts/api-server/src/routes/admin-current-affairs-*.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - "artifacts/api-server/migrations/20260830_current_affairs_question_editorial_guard.sql"
      - "artifacts/admin-app/src/features/current-affairs/**"
      - "artifacts/admin-app/src/pages/content/CurrentAffairsQuestionEditorial*.tsx"
      - "artifacts/admin-app/src/app/nav/navigation.ts"
      - "artifacts/admin-app/src/App.tsx"
      - ".github/workflows/current-affairs-cp024-question-editorial-workbench.yml"
  push:
    branches:
      - feature/current-affairs-studio-cp024-question-editorial-workbench
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-affairs-cp024-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-current-affairs-question-editorial-workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/examtree
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Current Affairs CP001-CP021 contracts
        run: |
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/core.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/ingestion.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/intelligence.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/content.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/automation.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/orchestration-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/official-listing.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/primary-fact-extraction.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/original-authoring.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/multilingual-localization.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/multilingual-question-localization.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/periodic-rollup-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/story-threading.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/release-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/question-promotion-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/quiz-delivery-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/revision-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/dashboard-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/personalization-policy.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/notification-policy.test.ts

      - name: Run CP024 question editorial policy contracts
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/current-affairs/question-editorial-policy.test.ts

      - name: Verify immutable English revision and BANK_ONLY boundary
        shell: bash
        run: |
          set -euo pipefail
          runtime=artifacts/api-server/src/current-affairs/question-editorial-runtime.ts
          grep -Fq 'INSERT INTO content.generation_item_versions' "$runtime"
          grep -Fq 'SET current_version_number=${nextVersionNumber}, status='"'"'unreviewed'"'"'' "$runtime"
          grep -Fq 'optionsAndCorrectIndexFrozen: true' "$runtime"
          grep -Fq 'questionBankAcceptanceMode: "BANK_ONLY"' "$runtime"
          grep -Fq 'publiclyPublishable: false' "$runtime"
          grep -Fq 'automaticStudentPublication: false' "$runtime"
          grep -Fq 'expectedAssociationOptions' "$runtime"
          grep -Fq 'expectedHindiOptions' "$runtime"
          grep -Fq 'expectedPunjabiOptions' "$runtime"

      - name: Verify multilingual approval and semantic option parity
        shell: bash
        run: |
          set -euo pipefail
          policy=artifacts/api-server/src/current-affairs/question-editorial-policy.ts
          runtime=artifacts/api-server/src/current-affairs/question-editorial-runtime.ts
          grep -Fq 'optionSemanticParity' "$policy"
          grep -Fq 'CA-QL-001' "$policy"
          grep -Fq 'CA-QL-002' "$policy"
          grep -Fq 'Every localized event-title option must match the current approved event-title localization' "$policy"
          grep -Fq 'evaluateCurrentAffairsQuestionEditorialReadiness' "$runtime"
          grep -Fq "SET status='approved'" "$runtime"
          if grep -E 'SET[[:space:]]+accepted_question_id|INSERT INTO content\.questions|INSERT INTO content\.question_versions|INSERT INTO content\.question_translations|UPDATE content\.questions|UPDATE content\.question_versions|UPDATE content\.question_translations' "$runtime"; then
            echo 'CP024 approval must not promote or mutate canonical Question Bank records'
            exit 1
          fi

      - name: Verify localization mutation requires re-review and locks after release
        shell: bash
        run: |
          set -euo pipefail
          guard=artifacts/api-server/migrations/20260830_current_affairs_question_editorial_guard.sql
          grep -Fq 'guard_current_affairs_question_localization_mutation' "$guard"
          grep -Fq 'item.accepted_question_id IS NOT NULL' "$guard"
          grep -Fq "promotion.status = 'active'" "$guard"
          grep -Fq "release.status = 'approved'" "$guard"
          grep -Fq "SET status = 'unreviewed'" "$guard"
          grep -Fq 'AFTER INSERT OR UPDATE OF localized_payload, status, input_fingerprint, quality_snapshot' "$guard"

      - name: Verify admin routes and canonical localization reuse
        shell: bash
        run: |
          set -euo pipefail
          route=artifacts/api-server/src/routes/admin-current-affairs-question-editorial-workbench.ts
          index=artifacts/api-server/src/routes/index.ts
          client=artifacts/admin-app/src/features/current-affairs/question-editorial-api.ts
          app=artifacts/admin-app/src/App.tsx
          nav=artifacts/admin-app/src/app/nav/navigation.ts
          grep -Fq '"/question-editorial/queue"' "$route"
          grep -Fq '"/question-editorial/:generationItemId/english"' "$route"
          grep -Fq '"/question-editorial/:generationItemId/approve"' "$route"
          grep -Fq 'requireAdminPermission("content.questions.update")' "$route"
          grep -Fq 'adminCurrentAffairsQuestionEditorialWorkbenchRouter' "$index"
          grep -Fq '/admin/current-affairs/question-localization/${encodeURIComponent(generationItemId)}/${languageCode}/manual' "$client"
          grep -Fq "path:'/content/current-affairs/questions'" "$app"
          grep -Fq "path:'/content/current-affairs/questions/:generationItemId'" "$app"
          grep -Fq "label: 'CA Question Review'" "$nav"

      - name: Verify workbench exposes evidence but no release authority
        shell: bash
        run: |
          set -euo pipefail
          page=artifacts/admin-app/src/pages/content/CurrentAffairsQuestionEditorialWorkbenchPage.tsx
          queue=artifacts/admin-app/src/pages/content/CurrentAffairsQuestionEditorialQueuePage.tsx
          grep -Fq 'Answer and distractor evidence' "$page"
          grep -Fq 'Evidence sources' "$page"
          grep -Fq 'Options and correct index are evidence-locked' "$page"
          grep -Fq 'Approve multilingual question' "$page"
          grep -Fq 'It does not promote to the Question Bank' "$page"
          grep -Fq 'Current Affairs Question Review' "$queue"
          if grep -E 'release-control/approve|question-promotion|accepted_question_id|publiclyPublishable:[[:space:]]*true' "$page"; then
            echo 'CP024 admin workbench must not gain release, promotion or public eligibility authority'
            exit 1
          fi

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Typecheck admin frontend
        run: pnpm --dir artifacts/admin-app typecheck

      - name: Build admin frontend
        run: pnpm --dir artifacts/admin-app build
