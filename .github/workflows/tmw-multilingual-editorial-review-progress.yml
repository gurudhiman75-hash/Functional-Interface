name: Validate TMW-001 multilingual editorial review progress

on:
  push:
    branches:
      - feat/tmw-001-hi-pa-localisation
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/**
      - .github/workflows/tmw-multilingual-editorial-review-progress.yml
      - package.json
      - pnpm-lock.yaml
  pull_request:
    branches:
      - design/tmw-001-blueprint
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/**
      - .github/workflows/tmw-multilingual-editorial-review-progress.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-tmw-editorial-review-progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-reviewed-checkpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -euo pipefail
          root="src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001"
          mapfile -t files < <(find "$root" -maxdepth 2 -type f \(
            -name 'cp0??-editorial-review-remediation*.ts' -o
            -name 'cp0??-editorial-field-cleanup.ts' -o
            -name 'localization-cp0??.ts' -o
            -name 'tmw-001-cp0??-editorial-review.test.ts' -o
            -name 'chapter-localized-runtime.ts'
          \) | sort)
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            "${files[@]}"
      - name: Bundle and run CP-001 through CP-010 editorial-review proofs
        shell: bash
        run: |
          set -euo pipefail
          root="src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001"
          out="artifacts/api-server/dist/quant-v4"
          mkdir -p "$out"
          for cp in 001 002 003 004 005 006 007 008 009 010; do
            source="${root}/tmw-001-cp${cp}-editorial-review.test.ts"
            bundle="dist/quant-v4/tmw-001-cp${cp}-editorial-review.test.mjs"
            log="${out}/tmw-001-cp${cp}-editorial-review-proof.log"
            pnpm --dir artifacts/api-server exec esbuild "$source" \
              --bundle --platform=node --format=esm --outfile="$bundle"
            node "artifacts/api-server/${bundle}" 2>&1 | tee "$log"
          done
      - name: Upload editorial-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmw-001-multilingual-editorial-review-progress
          path: artifacts/api-server/dist/quant-v4/tmw-001-cp*-editorial-review-proof.log
          if-no-files-found: error
          retention-days: 14
