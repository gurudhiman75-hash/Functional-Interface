name: Validate ENV Multilingual V1 Final Wave

on:
  push:
    branches:
      - feature/env-multilingual-v1-final-cp015-cp020
    paths:
      - artifacts/api-server/src/knowledge-v1/environment-ecology/localization-v1/**
      - artifacts/api-server/src/knowledge-v1/environment-ecology/environmental-laws/ENV-CP-015-STATUS.md
      - artifacts/api-server/src/knowledge-v1/environment-ecology/indian-environmental-institutions/ENV-CP-016-STATUS.md
      - artifacts/api-server/src/knowledge-v1/environment-ecology/international-environmental-conventions/ENV-CP-017-STATUS.md
      - artifacts/api-server/src/knowledge-v1/environment-ecology/project-tiger-tiger-reserves/ENV-CP-018-STATUS.md
      - artifacts/api-server/src/knowledge-v1/environment-ecology/ramsar-sites-wetlands/ENV-CP-019-STATUS.md
      - artifacts/api-server/src/knowledge-v1/environment-ecology/integrated-environment-gk/ENV-CP-020-STATUS.md
  pull_request:
    branches:
      - New-main
    paths:
      - artifacts/api-server/src/knowledge-v1/environment-ecology/localization-v1/**
      - artifacts/api-server/src/knowledge-v1/environment-ecology/environmental-laws/ENV-CP-015-STATUS.md
      - artifacts/api-server/src/knowledge-v1/environment-ecology/indian-environmental-institutions/ENV-CP-016-STATUS.md
      - artifacts/api-server/src/knowledge-v1/environment-ecology/international-environmental-conventions/ENV-CP-017-STATUS.md
      - artifacts/api-server/src/knowledge-v1/environment-ecology/project-tiger-tiger-reserves/ENV-CP-018-STATUS.md
      - artifacts/api-server/src/knowledge-v1/environment-ecology/ramsar-sites-wetlands/ENV-CP-019-STATUS.md
      - artifacts/api-server/src/knowledge-v1/environment-ecology/integrated-environment-gk/ENV-CP-020-STATUS.md
      - artifacts/api-server/src/question-studio/engine-registry.ts
      - artifacts/api-server/src/question-studio/engine-registry.test.ts
      - artifacts/api-server/src/question-studio/engines/knowledge-v1-adapter.ts
      - artifacts/api-server/src/question-studio/engines/knowledge-v1-env001-adapter-v1.ts
      - artifacts/api-server/src/question-studio/engines/knowledge-v1-env001-adapter-v1.test.ts
      - artifacts/admin-app/src/pages/content/QuestionStudioEnvironmentReviewPanel.tsx
      - artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx
  workflow_dispatch:

concurrency:
  group: env-multilingual-v1-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-env-cp015-cp020-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Validate chapter-wide statement opener
        run: |
          mkdir -p artifacts/api-server/dist/environment-review/ENV-MULTILINGUAL-V1
          pnpm --dir artifacts/api-server exec esbuild src/knowledge-v1/environment-ecology/localization-v1/env-statement-opener-consistency-proof-v1.ts --bundle --platform=node --format=esm --outfile=dist/environment-review/ENV-MULTILINGUAL-V1/env-statement-opener-consistency-proof-v1.mjs
          node artifacts/api-server/dist/environment-review/ENV-MULTILINGUAL-V1/env-statement-opener-consistency-proof-v1.mjs

      - name: Validate ENV-001 Question Studio adapter
        run: |
          mkdir -p artifacts/api-server/dist/environment-review/ENV-MULTILINGUAL-V1
          pnpm --dir artifacts/api-server exec esbuild src/question-studio/engines/knowledge-v1-env001-adapter-v1.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/environment-review/ENV-MULTILINGUAL-V1/knowledge-v1-env001-adapter-v1.test.mjs
          node artifacts/api-server/dist/environment-review/ENV-MULTILINGUAL-V1/knowledge-v1-env001-adapter-v1.test.mjs

      - name: Verify Environment admin panel mount
        run: |
          set -euo pipefail
          panel='artifacts/admin-app/src/pages/content/QuestionStudioEnvironmentReviewPanel.tsx'
          operations='artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx'
          test -s "$panel"
          grep -Fq "QuestionStudioEnvironmentReviewPanel" "$operations"
          grep -Fq "result.convertedCount !== 0 || result.reviewOnlyApprovedCount !== 1" "$panel"

      - name: Bundle final localization proof
        run: |
          mkdir -p artifacts/api-server/dist/environment-review/ENV-MULTILINGUAL-V1
          pnpm --dir artifacts/api-server exec esbuild src/knowledge-v1/environment-ecology/localization-v1/env-cp015-cp020-localization-proof-v1.ts --bundle --platform=node --format=esm --outfile=dist/environment-review/ENV-MULTILINGUAL-V1/env-cp015-cp020-localization-proof-v1.mjs

      - name: Validate CP015-CP020 localization
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/environment-review/ENV-MULTILINGUAL-V1/env-cp015-cp020-localization-proof-v1.mjs | tee dist/environment-review/ENV-MULTILINGUAL-V1/ENV-CP015-CP020-MULTILINGUAL-PROOF.log

      - name: Materialize final review Markdown
        run: |
          cd artifacts/api-server
          pnpm exec esbuild src/knowledge-v1/environment-ecology/localization-v1/env-localization-export-v1.ts --bundle --platform=node --format=esm --outfile=dist/environment-review/ENV-MULTILINGUAL-V1/env-localization-export-v1.mjs
          node dist/environment-review/ENV-MULTILINGUAL-V1/env-localization-export-v1.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: env-cp015-cp020-multilingual-v1
          path: |
            artifacts/api-server/dist/environment-review/ENV-MULTILINGUAL-V1/ENV-CP015-CP020-MULTILINGUAL-PROOF.json
            artifacts/api-server/dist/environment-review/ENV-MULTILINGUAL-V1/ENV-CP015-CP020-MULTILINGUAL-PROOF.log
            artifacts/api-server/dist/environment-review/ENV-MULTILINGUAL-V1/ENV-MULTILINGUAL-V1-CP015-REVIEW.md
            artifacts/api-server/dist/environment-review/ENV-MULTILINGUAL-V1/ENV-MULTILINGUAL-V1-CP016-REVIEW.md
            artifacts/api-server/dist/environment-review/ENV-MULTILINGUAL-V1/ENV-MULTILINGUAL-V1-CP017-REVIEW.md
            artifacts/api-server/dist/environment-review/ENV-MULTILINGUAL-V1/ENV-MULTILINGUAL-V1-CP018-REVIEW.md
            artifacts/api-server/dist/environment-review/ENV-MULTILINGUAL-V1/ENV-MULTILINGUAL-V1-CP019-REVIEW.md
            artifacts/api-server/dist/environment-review/ENV-MULTILINGUAL-V1/ENV-MULTILINGUAL-V1-CP020-REVIEW.md
          if-no-files-found: error
