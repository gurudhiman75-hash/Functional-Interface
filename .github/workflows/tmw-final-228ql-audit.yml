name: TMW-001 final 228 QL multilingual audit

on:
  push:
    branches:
      - fix/tmw-001-remediation-r4-exam-readiness
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/**
      - .github/workflows/tmw-final-228ql-audit.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmw-final-228-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: >-
          pnpm exec tsc
          --noEmit
          --target es2022
          --module esnext
          --moduleResolution bundler
          --strictNullChecks
          --noImplicitAny
          --noImplicitReturns
          --noFallthroughCasesInSwitch
          --skipLibCheck
          --types node
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/chapter-localized-runtime.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp011-options.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp012-coverage-closure-runtime.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp013-data-sufficiency-runtime.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp014-presentation-runtime.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/final-extension-presentation-polish.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp011-distractor-resilience.test.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-final-228ql-audit.test.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-final-228ql-export.ts
      - name: Bundle CP011 distractor resilience
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp011-distractor-resilience.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-cp011-distractor-resilience.test.mjs
      - name: Run CP011 distractor resilience
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/tmw-001-cp011-distractor-resilience.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/tmw-001-cp011-distractor-resilience.log
      - name: Bundle final audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-final-228ql-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-final-228ql-audit.test.mjs
      - name: Run final 684-package audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/tmw-001-final-228ql-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/tmw-001-final-228ql-audit.log
      - name: Bundle final export
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-final-228ql-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-final-228ql-export.mjs
      - name: Export all 684 student-facing packages
        run: >-
          node artifacts/api-server/dist/quant-v4/tmw-001-final-228ql-export.mjs
          artifacts/api-server/dist/quant-v4/tmw-001-final-228ql-audit.json
      - name: Upload final audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmw-001-final-228ql-audit
          path: |
            artifacts/api-server/dist/quant-v4/tmw-001-cp011-distractor-resilience.log
            artifacts/api-server/dist/quant-v4/tmw-001-final-228ql-audit.log
            artifacts/api-server/dist/quant-v4/tmw-001-final-228ql-audit.json
          if-no-files-found: warn
          retention-days: 30
