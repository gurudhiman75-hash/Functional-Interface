name: Validate MAL-CP-006 Wave 02 learner V2

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp006-wave02-learner-authority-v2.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-cp006-wave02-learner-v2-*.ts"
      - ".github/workflows/mal-cp006-wave02-learner-v2.yml"
  workflow_dispatch:

jobs:
  validate-wave02-learner-v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle V2 audit and review
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-cp006-wave02-learner-v2-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/mal-001-cp006-wave02-learner-v2-audit.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-cp006-wave02-learner-v2-review.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/mal-001-cp006-wave02-learner-v2-review.mjs
      - name: Run V2 audit and review
        shell: bash
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/mal-001-cp006-wave02-learner-v2-audit.mjs 2>&1 | tee dist/quant-v4/mal-001-cp006-wave02-learner-v2-audit.log
          node dist/quant-v4/mal-001-cp006-wave02-learner-v2-review.mjs 2>&1 | tee dist/quant-v4/mal-001-cp006-wave02-learner-v2-review.log
      - name: Upload V2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: mal-cp006-wave02-learner-v2
          path: |
            artifacts/api-server/dist/quant-v4/mal-001-cp006-wave02-learner-v2-audit.log
            artifacts/api-server/dist/quant-v4/mal-001-cp006-wave02-learner-v2-review.log
            artifacts/api-server/dist/quant-v4/MAL-CP-006-WAVE-02-FINAL-20Q-LEARNER-REVIEW-V2.md
          if-no-files-found: error
          retention-days: 14
