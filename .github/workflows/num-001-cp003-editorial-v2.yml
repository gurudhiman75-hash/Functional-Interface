name: Validate NUM-CP-003 English Editorial V2

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/**
      - .github/workflows/num-001-cp003-editorial-v2.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp003-editorial-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp003-editorial-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle retained runtime regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-003/retained/runtime.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp003-editorial-v2-retained-runtime.test.mjs

      - name: Run retained runtime regression
        run: node artifacts/api-server/dist/quant-v4/num-cp003-editorial-v2-retained-runtime.test.mjs

      - name: Bundle permanent allocation regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-003/permanent/allocation.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp003-editorial-v2-allocation.test.mjs

      - name: Run permanent allocation regression
        run: node artifacts/api-server/dist/quant-v4/num-cp003-editorial-v2-allocation.test.mjs

      - name: Bundle Editorial V2 audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-003/permanent/editorial-v2-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp003-editorial-v2-audit.mjs

      - name: Run Editorial V2 audit
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/num-cp003-editorial-v2-audit.mjs \
            2>&1 | tee dist/quant-v4/num-cp003-editorial-v2-audit.log

      - name: Upload Editorial V2 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: num-001-cp003-editorial-v2-review
          path: |
            artifacts/api-server/dist/quant-v4/num-cp003-editorial-v2-audit.log
            artifacts/api-server/dist/quant-v4/num-cp003-editorial-v2/num-cp003-editorial-v2-68q-review.json
            artifacts/api-server/dist/quant-v4/num-cp003-editorial-v2/num-cp003-editorial-v2-68q-review.md
            artifacts/api-server/dist/quant-v4/num-cp003-editorial-v2/num-cp003-editorial-v2-68q-review.csv
            artifacts/api-server/dist/quant-v4/num-cp003-editorial-v2/num-cp003-editorial-v2-audit.json
          if-no-files-found: warn
          retention-days: 30
