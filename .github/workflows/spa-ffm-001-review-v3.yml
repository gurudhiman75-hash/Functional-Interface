name: Validate SPA FFM-001 Two-QL Review V3

on:
  push:
    branches:
      - feature/spa-ffm-001-review-v2
    paths:
      - 'artifacts/api-server/src/reasoning-v1/foundation/spatial/figure-formation-source-saturation-v2.ts'
      - 'artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-permanent-ql-allocation-v10.ts'
      - 'artifacts/api-server/src/reasoning-v1/foundation/spatial/figure-formation-review-runtime-v3.ts'
      - 'artifacts/api-server/src/reasoning-v1/tests/figure-formation-ffm-001-review-v3.test.ts'
      - '.github/workflows/spa-ffm-001-review-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle FFM V3 review proof
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/figure-formation-ffm-001-review-v3.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/reasoning-v1/spatial/figure-formation-ffm-001-review-v3.test.mjs
      - name: Run FFM V3 review proof
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/figure-formation-ffm-001-review-v3.test.mjs 2>&1 \
            | tee dist/reasoning-v1/spatial/ffm-001-review-v3-run.log
      - name: Upload FFM V3 visual review and evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-ffm-001-review-v3
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/ffm-001-visual-review-v3.html
            artifacts/api-server/dist/reasoning-v1/spatial/ffm-001-review-v3-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/ffm-001-review-v3-run.log
          if-no-files-found: error
