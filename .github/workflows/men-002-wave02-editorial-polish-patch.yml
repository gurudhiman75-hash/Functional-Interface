name: MEN-002 Wave02 Editorial Polish Patch

on:
  pull_request:
    branches:
      - feat/men-002-cp007-gap-wave-01
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-002-wave02-editorial-polish-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Polish Wave-02 teaching language
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-02/runtime.ts")
          lines = path.read_text().splitlines()

          triplet_matches = [index for index, line in enumerate(lines) if "Recognise the Pythagorean pair" in line]
          if len(triplet_matches) != 1:
            raise SystemExit(f"Expected one Pythagorean wording line, found {len(triplet_matches)}")
          lines[triplet_matches[0]] = lines[triplet_matches[0]].replace("Pythagorean pair", "Pythagorean triplet")

          height_matches = [index for index, line in enumerate(lines) if "old\\\\ volume/new\\\\ base\\\\ area" in line]
          if len(height_matches) != 1:
            raise SystemExit(f"Expected one equal-volume shortcut line, found {len(height_matches)}")
          lines[height_matches[0]] = "    shortcut: `Divide the conserved old volume by the new base area.`,"

          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-02/runtime.ts
          git commit -m "fix(mensuration): polish Wave-02 teaching language"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
