name: Quant V4 Data Interpretation missing DI V2 review

on:
  push:
    branches:
      - feature/di-007-missing-v2-review
    paths:
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-007/**"
      - ".github/workflows/quant-v4-di-missing-di007-v2.yml"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-007/**"
  workflow_dispatch:

concurrency:
  group: quant-v4-di007-missing-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  missing-di-v2-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Review-only lifecycle guard
        run: |
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-007/missing-v2-types.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-007/missing-set-v2.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-007/independent-verifier-v2.ts
          ! grep -R 'questionStudioDiscoverable: true\|questionBankWritable: true\|testEligibility: "ELIGIBLE"\|testEligible: true\|mockTestEligible: true\|publiclyPublishable: true\|automaticStudentPublication: true\|productionReleaseAuthorized: true' \
            artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-007/missing-v2-types.ts \
            artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-007/missing-set-v2.ts
      - name: DI-007 V2 deterministic, diversity and independent proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-007/missing-set-v2.test.ts
      - name: Legacy DI-007 regression
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-007/missing-set.test.ts
      - name: Export Markdown review pack
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-007/export-review-v2.ts DI-007-REVIEW-V2.md
      - uses: actions/upload-artifact@v4
        with:
          name: di-007-missing-review-v2
          path: DI-007-REVIEW-V2.md
          if-no-files-found: error
          retention-days: 30
      - name: API server build
        run: pnpm --filter @workspace/api-server build
      - name: Patch hygiene
        run: git diff --check
