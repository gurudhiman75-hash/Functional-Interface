name: ARG-001 CP015 strict TypeScript diagnostic

on:
  push:
    branches:
      - feature/arg-001-cp012-editorial-remediation
    paths:
      - .github/workflows/arg-001-cp015-typescript-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arg-001-cp012-editorial-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply CP015 repair stack
        run: |
          python scripts/arg-cp015-simple-explanations-repair.py
          python scripts/arg-cp015-generic-fallback-routing-repair.py
          python scripts/arg-cp015-ql004-localized-routing-hotfix.py
          python scripts/arg-cp015-localized-routing-hotfix-v2.py
          python scripts/arg-cp015-localized-routing-hotfix-v3.py
          python scripts/arg-cp015-semantic-alignment-hotfix.py
          python scripts/arg-cp015-punjabi-naturalness-hotfix.py
          python scripts/arg-cp015-hindi-naturalness-hotfix.py
          python scripts/arg-cp015-final-editorial-integration-repair.py
      - name: Capture strict TypeScript failure
        working-directory: artifacts/api-server
        run: |
          set +e
          pnpm exec tsc --noEmit --target es2022 --module esnext --moduleResolution bundler --allowImportingTsExtensions --strictNullChecks --noImplicitAny --noImplicitReturns --noFallthroughCasesInSwitch --skipLibCheck --types node src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-perceived-diversity-expansion.ts src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-perceived-diversity-proof.test.ts src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-anti-gaming-grammar-proof.test.ts src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-semantic-alignment-proof.test.ts src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-punjabi-naturalness-proof.test.ts src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-hindi-naturalness-proof.test.ts src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-human-review-export.ts src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-human-review-global-uniqueness-proof.ts > /tmp/arg-cp015-ts.log 2>&1
          status=$?
          set -e
          mkdir -p ../../docs/review
          {
            echo "ARG-001 CP015 strict TypeScript diagnostic"
            echo "head: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID"
            echo
            cat /tmp/arg-cp015-ts.log
          } > ../../docs/review/ARG-001-CP015-LAST-TYPESCRIPT-FAILURE.txt
          git -C ../.. config user.name "github-actions[bot]"
          git -C ../.. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C ../.. add docs/review/ARG-001-CP015-LAST-TYPESCRIPT-FAILURE.txt
          git -C ../.. commit -m "chore(arg-cp015): capture TypeScript diagnostic" || true
          git -C ../.. push origin HEAD:feature/arg-001-cp012-editorial-remediation
          cat /tmp/arg-cp015-ts.log
          exit "$status"
