name: Validate CAL-001 end-to-end foundation

on:
  push:
    branches:
      - feat/reasoning-cal-001-end-to-end-foundation
      - fix/cal-001-exam-readiness-remediation
      - feat/cal-001-final-discovery-freeze
      - fix/cal-001-simplify-english-stems
      - fix/cal-001-final-english-editorial-freeze-v2
      - feat/cal-001-multilingual-human-freeze
      - feat/cal-001-question-studio-integration
      - feat/cal-001-production-lifecycle
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Calendar/CAL-001/**
      - artifacts/api-server/src/reasoning-v1/CAL-001-FAMILY-F-MANIFEST-AMENDMENT.md
      - artifacts/api-server/src/quant-v4/generation-engine.ts
      - .github/workflows/cal-001-foundation.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Calendar/CAL-001/**
      - artifacts/api-server/src/reasoning-v1/CAL-001-FAMILY-F-MANIFEST-AMENDMENT.md
      - artifacts/api-server/src/quant-v4/generation-engine.ts
      - .github/workflows/cal-001-foundation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-cal-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowImportingTsExtensions \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/Calendar/CAL-001 -name '*.ts' ! -name 'question-studio-runtime.test.ts' -print)

  exhaustive-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run Gregorian, generator and lifecycle proof
        shell: bash
        run: |
          set +e
          pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Calendar/CAL-001/foundation-proof.test.ts 2>&1 | tee /tmp/cal-001-foundation-proof.log
          echo "${PIPESTATUS[0]}" > /tmp/cal-001-foundation-proof-exit
          exit 0
      - name: Run exam-readiness remediation proof
        shell: bash
        run: |
          set +e
          pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Calendar/CAL-001/exam-readiness-proof.test.ts 2>&1 | tee /tmp/cal-001-exam-readiness-proof.log
          echo "${PIPESTATUS[0]}" > /tmp/cal-001-exam-readiness-proof-exit
          exit 0
      - name: Run simple English stem proof
        shell: bash
        run: |
          set +e
          pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Calendar/CAL-001/english-stem-simplification.test.ts 2>&1 | tee /tmp/cal-001-english-stem-simplification.log
          echo "${PIPESTATUS[0]}" > /tmp/cal-001-english-stem-simplification-exit
          exit 0
      - name: Run final English editorial freeze V2 proof
        shell: bash
        run: |
          set +e
          pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Calendar/CAL-001/english-editorial-freeze-v2.test.ts 2>&1 | tee /tmp/cal-001-english-editorial-freeze-v2.log
          echo "${PIPESTATUS[0]}" > /tmp/cal-001-english-editorial-freeze-v2-exit
          exit 0
      - name: Run Hindi Punjabi human-freeze and parity proof
        shell: bash
        run: |
          set +e
          pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Calendar/CAL-001/multilingual-freeze.test.ts 2>&1 | tee /tmp/cal-001-multilingual-freeze.log
          echo "${PIPESTATUS[0]}" > /tmp/cal-001-multilingual-freeze-exit
          exit 0
      - name: Run Hindi Punjabi grammar quality proof
        shell: bash
        run: |
          set +e
          pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Calendar/CAL-001/multilingual-editorial-quality.test.ts 2>&1 | tee /tmp/cal-001-multilingual-editorial-quality.log
          echo "${PIPESTATUS[0]}" > /tmp/cal-001-multilingual-editorial-quality-exit
          exit 0
      - name: Run final source-gap and permanent-identity freeze proof
        shell: bash
        run: |
          set +e
          pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Calendar/CAL-001/final-discovery-freeze.test.ts 2>&1 | tee /tmp/cal-001-final-discovery-freeze.log
          echo "${PIPESTATUS[0]}" > /tmp/cal-001-final-discovery-freeze-exit
          exit 0
      - name: Run Question Studio and production lifecycle proof
        shell: bash
        run: |
          set +e
          pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Calendar/CAL-001/question-studio-runtime.test.ts 2>&1 | tee /tmp/cal-001-question-studio-production.log
          echo "${PIPESTATUS[0]}" > /tmp/cal-001-question-studio-production-exit
          exit 0
      - name: Publish proof diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal-001-foundation-multilingual-and-production-proof
          path: |
            /tmp/cal-001-foundation-proof.log
            /tmp/cal-001-foundation-proof-exit
            /tmp/cal-001-exam-readiness-proof.log
            /tmp/cal-001-exam-readiness-proof-exit
            /tmp/cal-001-english-stem-simplification.log
            /tmp/cal-001-english-stem-simplification-exit
            /tmp/cal-001-english-editorial-freeze-v2.log
            /tmp/cal-001-english-editorial-freeze-v2-exit
            /tmp/cal-001-multilingual-freeze.log
            /tmp/cal-001-multilingual-freeze-exit
            /tmp/cal-001-multilingual-editorial-quality.log
            /tmp/cal-001-multilingual-editorial-quality-exit
            /tmp/cal-001-final-discovery-freeze.log
            /tmp/cal-001-final-discovery-freeze-exit
            /tmp/cal-001-question-studio-production.log
            /tmp/cal-001-question-studio-production-exit
          if-no-files-found: error
          retention-days: 14
      - name: Enforce proof results
        run: |
          test "$(cat /tmp/cal-001-foundation-proof-exit)" = "0"
          test "$(cat /tmp/cal-001-exam-readiness-proof-exit)" = "0"
          test "$(cat /tmp/cal-001-english-stem-simplification-exit)" = "0"
          test "$(cat /tmp/cal-001-english-editorial-freeze-v2-exit)" = "0"
          test "$(cat /tmp/cal-001-multilingual-freeze-exit)" = "0"
          test "$(cat /tmp/cal-001-multilingual-editorial-quality-exit)" = "0"
          test "$(cat /tmp/cal-001-final-discovery-freeze-exit)" = "0"
          test "$(cat /tmp/cal-001-question-studio-production-exit)" = "0"

  review-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Generate approved discovery review packs
        env:
          CAL_REVIEW_OUTPUT_DIR: /tmp/cal-001-review
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Calendar/CAL-001/review-export.ts
      - name: Generate source-gap review pack
        env:
          CAL_REVIEW_OUTPUT_DIR: /tmp/cal-001-review
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Calendar/CAL-001/source-gap-review-export.ts
      - name: Generate Hindi and Punjabi review packs
        env:
          CAL_REVIEW_OUTPUT_DIR: /tmp/cal-001-review
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Calendar/CAL-001/multilingual-review-export.ts
      - name: Publish review packs
        uses: actions/upload-artifact@v4
        with:
          name: cal-001-english-hindi-punjabi-review-evidence
          path: /tmp/cal-001-review/**
          if-no-files-found: error
          retention-days: 14
