name: Recognize AVG CP-002 symmetry evidence

on:
  pull_request:
    branches:
      - feat/avg-001-cp001-runtime-proof
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/**
      - .github/workflows/avg-001-runtime-proof.yml

permissions:
  contents: write

concurrency:
  group: recognize-avg-cp002-symmetry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout CP-003 branch
        uses: actions/checkout@v4
        with:
          ref: feat/avg-001-cp003-change-replacement
          fetch-depth: 0

      - name: Extend explanation evidence check
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/foundation/cp002-runtime.ts")
          text = path.read_text(encoding="utf-8")
          old = '''        line.includes("÷") ||
                /[+−-]/.test(line),'''
          new = '''        line.includes("÷") ||
                line.includes("=") ||
                /[+−-]/.test(line) ||
                /symmetr|balance|halfway/i.test(line),'''
          if old not in text:
              if 'symmetr|balance|halfway' in text:
                  raise SystemExit(0)
              raise SystemExit("CP-002 explanation evidence check was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit validator repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/foundation/cp002-runtime.ts
          if git diff --cached --quiet; then
            echo "Evidence check already aligned."
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix(avg): recognize CP-002 symmetry evidence in explanations"
          git push origin HEAD:feat/avg-001-cp003-change-replacement
