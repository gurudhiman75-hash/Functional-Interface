name: Finalize AVG CP-002 compatibility

on:
  pull_request:
    branches:
      - feat/avg-001-cp001-runtime-proof
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/**
      - .github/workflows/avg-001-runtime-proof.yml

permissions:
  contents: write

concurrency:
  group: finalize-avg-cp002-compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout CP-003 branch
        uses: actions/checkout@v4
        with:
          ref: feat/avg-001-cp003-change-replacement
          fetch-depth: 0

      - name: Align validator and remove duplicate stem
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001")

          runtime = root / "foundation/cp002-runtime.ts"
          text = runtime.read_text(encoding="utf-8")
          text, count = re.subn(
              r'''const minimumExplanationLines =\s*\n\s*pkg\.difficultyBand === "Easy" \? 4 : 5;''',
              'const minimumExplanationLines = 4;',
              text,
              count=1,
          )
          if count != 1 and 'const minimumExplanationLines = 4;' not in text:
              raise SystemExit(f"Could not align CP-002 minimum explanation lines; matches={count}")
          text = text.replace('line.includes("\\times")', 'line.includes("\\\\times")')
          text = text.replace('line.includes("\\div")', 'line.includes("\\\\div")')
          runtime.write_text(text, encoding="utf-8")

          ql_path = root / "question-language.cp002.en.json"
          ql = json.loads(ql_path.read_text(encoding="utf-8"))
          matches = [entry for entry in ql["entries"] if entry["qlId"] == "AVG-QL-076"]
          if len(matches) != 1:
              raise SystemExit(f"Expected one AVG-QL-076 entry; found {len(matches)}")
          matches[0]["template"] = "What is the average of {count} consecutive integers from {firstTerm} to {lastTerm}?"
          ql_path.write_text(json.dumps(ql, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit compatibility fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/foundation/cp002-runtime.ts
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/question-language.cp002.en.json
          git diff --cached --check
          git commit -m "fix(avg): finalize CP-002 compatibility with approved editorial content"
          git push origin HEAD:feat/avg-001-cp003-change-replacement
