name: Validate AVG-001 English freeze

on:
  pull_request:
    branches:
      - New-main
      - feat/avg-001-cp001-runtime-proof
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/**
      - artifacts/api-server/src/quant-v4/question-studio-generation-engine.ts
      - artifacts/api-server/src/routes/admin-question-studio-average.ts
      - artifacts/api-server/src/routes/index.ts
      - .github/workflows/avg-001-runtime-proof.yml

permissions:
  contents: read

concurrency:
  group: avg-001-english-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-avg-001:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Run AVG-001 proof and freeze gates
        run: |
          set -euo pipefail
          : > avg-freeze-diagnostics.log
          run_case() {
            name="$1"
            source="$2"
            output="dist/quant-v4/${name}.mjs"
            echo "===== $name =====" | tee -a avg-freeze-diagnostics.log
            pnpm --dir artifacts/api-server exec esbuild "$source" --bundle --platform=node --format=esm --outfile="$output" 2>&1 | tee -a avg-freeze-diagnostics.log
            (cd artifacts/api-server && node "$output") 2>&1 | tee -a avg-freeze-diagnostics.log
          }
          run_case avg-001-test src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001.test.ts
          run_case avg-001-independent src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-independent-verifier-audit.ts
          run_case avg-001-diversity src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-diversity-audit.ts
          run_case avg-001-context-realism src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-context-realism-audit.ts
          run_case avg-001-editorial-stems src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-editorial-stem-audit.ts
          run_case avg-001-natural-exam-language src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-natural-exam-language-audit.ts
          run_case avg-001-difficulty-calibration src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-difficulty-calibration-audit.ts
          run_case avg-001-distractor-realism src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-distractor-realism-audit.ts
          run_case avg-001-explanation-depth src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-explanation-depth-audit.ts
          run_case avg-001-question-studio src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-question-studio-integration-audit.ts
          run_case avg-001-cp001-coverage src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp001-coverage-audit.ts
          run_case avg-001-cp002-coverage src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp002-coverage-audit.ts
          run_case avg-001-cp002-ap-validity src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp002-ap-validity-audit.ts
          run_case avg-001-cp002-explanation-quality src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp002-explanation-quality-audit.ts
          run_case avg-001-cp002-residual src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp002-residual-qa.ts
          run_case avg-001-cp003-coverage src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp003-coverage-audit.ts
          run_case avg-001-cp003-state-validity src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp003-state-validity-audit.ts
          run_case avg-001-cp003-editorial-naturalness src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp003-editorial-naturalness-audit.ts
          run_case avg-001-cp003-explanation-quality src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp003-explanation-quality-audit.ts
          run_case avg-001-cp003-family-age src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp003-family-age-audit.ts
          run_case avg-001-cp003-residual src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp003-residual-qa.ts
          run_case avg-001-cp004-coverage src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp004-coverage-audit.ts
          run_case avg-001-cp004-state-validity src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp004-state-validity-audit.ts
          run_case avg-001-cp004-variety src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp004-variety-audit.ts
          run_case avg-001-cp005-coverage src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp005-coverage-audit.ts
          run_case avg-001-cp005-state-validity src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp005-state-validity-audit.ts
          run_case avg-001-cp005-editorial-variation src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp005-editorial-variation-audit.ts
          run_case avg-001-cp005-explanation-quality src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp005-explanation-quality-audit.ts
          run_case avg-001-cp006-coverage src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp006-coverage-audit.ts
          run_case avg-001-gap-expansion src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-gap-expansion-audit.ts
          run_case avg-001-freeze-readiness src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-freeze-readiness-audit.ts
          run_case avg-001-review-export src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-review-export.ts
          run_case avg-001-gap-expansion-review-export src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-gap-expansion-review-export.ts
          run_case avg-001-cp001-review-export src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp001-review-export.ts
          run_case avg-001-cp002-review-export src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp002-review-export.ts
          run_case avg-001-cp003-review-export src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp003-review-export.ts
          run_case avg-001-cp004-review-export src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp004-review-export.ts
          run_case avg-001-cp005-review-export src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp005-review-export.ts
          run_case avg-001-cp006-review-export src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp006-review-export.ts
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avg-001-freeze-diagnostics
          path: avg-freeze-diagnostics.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload approved English review CSVs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: avg-001-approved-english-review
          path: |
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-human-review-en.csv
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-gap-expansion-human-review-en.csv
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp001-human-review-en.csv
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp002-human-review-en.csv
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp003-human-review-en.csv
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp004-human-review-en.csv
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp005-human-review-en.csv
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp006-human-review-en.csv
          if-no-files-found: error
          retention-days: 14
