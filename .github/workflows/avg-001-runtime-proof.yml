name: Repair duplicated AVG CP-002 helper

on:
  pull_request:
    branches:
      - feat/avg-001-cp001-runtime-proof
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/**
      - .github/workflows/avg-001-runtime-proof.yml

permissions:
  contents: write

concurrency:
  group: repair-avg-cp002-helper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout CP-003 branch
        uses: actions/checkout@v4
        with:
          ref: feat/avg-001-cp003-change-replacement
          fetch-depth: 0

      - name: Remove duplicate helper declaration
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/foundation/cp002-runtime.ts")
          text = path.read_text(encoding="utf-8")
          marker = "function cp002ResultLabel(parameters: Avg001Parameters) {"
          first = text.find(marker)
          second = text.find(marker, first + 1) if first >= 0 else -1
          if first < 0:
              raise SystemExit("cp002ResultLabel helper is missing")
          if second >= 0:
              end = text.find("\n\nfunction renderCp002Explanation", second)
              if end < 0:
                  raise SystemExit("Could not locate the end of duplicated helper")
              text = text[:second] + text[end + 2:]
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit source repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/foundation/cp002-runtime.ts
          if git diff --cached --quiet; then
            echo "Duplicate already removed."
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix(avg): remove duplicate CP-002 result label helper"
          git push origin HEAD:feat/avg-001-cp003-change-replacement
