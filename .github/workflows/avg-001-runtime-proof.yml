name: Apply AVG equality-evidence correction

on:
  push:
    branches:
      - feat/avg-001-cp003-runtime

permissions:
  contents: write

concurrency:
  group: apply-avg-equality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/avg-001-cp003-runtime
          fetch-depth: 0

      - name: Apply equality-evidence correction
        run: |
          set -euo pipefail
          SCRIPT="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/patch-cp002-equality-evidence.py"
          if [ ! -f "$SCRIPT" ]; then
            echo "Patch already applied"
            exit 0
          fi
          python "$SCRIPT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/foundation/cp002-runtime.ts
          git add -u artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/patch-cp002-equality-evidence.py
          git commit -m "fix(avg): accept equality as explanation evidence"
          git push origin HEAD:feat/avg-001-cp003-runtime
