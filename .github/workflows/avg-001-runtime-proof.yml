name: Align AVG CP-002 explanation validator

on:
  pull_request:
    branches:
      - feat/avg-001-cp001-runtime-proof
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/**
      - .github/workflows/avg-001-runtime-proof.yml

permissions:
  contents: write

concurrency:
  group: align-avg-cp002-validator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout CP-003 branch
        uses: actions/checkout@v4
        with:
          ref: feat/avg-001-cp003-change-replacement
          fetch-depth: 0

      - name: Replace obsolete fixed-length check
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/foundation/cp002-runtime.ts")
          text = path.read_text(encoding="utf-8")
          old = '''  addCheck(
            "explanation-depth",
            pkg.explanation.lines.length >= 6,
            "Explanation contains at least six meaningful moves",
          );'''
          new = '''  const minimumExplanationLines =
            pkg.difficultyBand === "Easy" ? 4 : 5;
          addCheck(
            "explanation-depth",
            pkg.explanation.lines.length >= minimumExplanationLines &&
              pkg.explanation.lines.length <= 8,
            `Explanation contains ${minimumExplanationLines}–8 meaningful moves`,
          );
          addCheck(
            "explanation-arithmetic",
            pkg.explanation.lines.some(
              (line) =>
                line.includes("\\\\times") ||
                line.includes("\\\\div") ||
                line.includes("÷") ||
                /[+−-]/.test(line),
            ),
            "Explanation contains substituted arithmetic or symmetry evidence",
          );
          addCheck(
            "explanation-answer",
            pkg.explanation.lines.some((line) => line.includes(pkg.answer)),
            "Explanation contains the canonical answer",
          );'''
          if old not in text:
              if "minimumExplanationLines" in text:
                  raise SystemExit(0)
              raise SystemExit("Obsolete CP-002 explanation check was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit validator alignment
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/foundation/cp002-runtime.ts
          if git diff --cached --quiet; then
            echo "Validator already aligned."
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix(avg): align CP-002 explanation validator with editorial standard"
          git push origin HEAD:feat/avg-001-cp003-change-replacement
