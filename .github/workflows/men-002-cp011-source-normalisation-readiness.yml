name: Validate MEN-CP-011 source normalisation readiness

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/source-normalisation-readiness*.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-011/MEN-CP-011-DIRECT-SOURCE-NORMALISATION-READINESS.md
      - .github/workflows/men-002-cp011-source-normalisation-readiness.yml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-002-cp011-source-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove fail-closed source readiness ledger
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/source-normalisation-readiness.test.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/men-cp011-source-normalisation-readiness.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp011-source-normalisation-readiness.test.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/men-cp011-source-normalisation-readiness.test.log

      - name: Export source readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/source-normalisation-readiness-export.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/men-cp011-source-normalisation-readiness-export.mjs
          cd artifacts/api-server
          node dist/quant-v4/men-cp011-source-normalisation-readiness-export.mjs \
            2>&1 | tee dist/quant-v4/men-cp011-source-normalisation-readiness.log

      - name: Build production API bundle
        shell: bash
        run: bash build-api.sh

      - name: Upload source readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-cp011-source-normalisation-readiness
          path: |
            artifacts/api-server/dist/quant-v4/men-cp011-source-normalisation-readiness.test.log
            artifacts/api-server/dist/quant-v4/men-cp011-source-normalisation-readiness.log
            artifacts/api-server/dist/quant-v4/men-cp011-source-normalisation-readiness.json
            artifacts/api-server/dist/quant-v4/men-cp011-source-normalisation-readiness.md
          if-no-files-found: error
          retention-days: 14
