name: STAT-001 clean transplant

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Statistics/**"
  workflow_dispatch:

concurrency:
  group: stat001-clean-transplant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  transplant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quant-v4-statistics-central-tendency-stat-p0
          fetch-depth: 0
      - name: Build corrected STAT-001 files
        run: python artifacts/api-server/src/quant-v4/topics/Statistics/stat001-bootstrap.py
      - name: Validate patch
        run: git diff --check
      - name: Commit transplant
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f artifacts/api-server/src/quant-v4/topics/Statistics/.stat001-bootstrap-trigger
          git rm .github/workflows/stat001-bootstrap.yml artifacts/api-server/src/quant-v4/topics/Statistics/stat001-bootstrap.py
          git add artifacts/api-server/src/quant-v4/topics/Statistics .github/workflows/quant-v4-statistics-central-tendency-stat-p0.yml
          git commit -m "feat(statistics): add corrected STAT-001 central tendency runtime"
          git push origin HEAD:feat/quant-v4-statistics-central-tendency-stat-p0
