name: COM-003 Question Review File V1

on:
  push:
    branches:
      - feature/com003-office-productivity-discovery-v1
    paths:
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-question-review-file-v1.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-review-synthesis-v7.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-review-synthesis-v8.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-review-synthesis-v8.test.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-exam-realness-audit-v3.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-product-review-revocation-v1.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-product-review-revocation-v1.test.ts'
      - '.github/workflows/com003-question-review-file-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-review-file:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate V8 deep exam surfaces
        run: |
          mkdir -p artifacts/api-server/dist/com003-review-file
          for test in com003-review-synthesis-v8.test com003-product-review-revocation-v1.test; do
            pnpm --dir artifacts/api-server exec esbuild src/knowledge-v1/computer-awareness/${test}.ts --bundle --platform=node --format=esm --outfile=dist/com003-review-file/${test}.mjs
            node artifacts/api-server/dist/com003-review-file/${test}.mjs
          done
      - name: Generate V8 review artifact
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/knowledge-v1/computer-awareness/com003-question-review-file-v1.ts --bundle --platform=node --format=esm --outfile=dist/com003-review-file/com003-question-review-file-v1.mjs
          cd artifacts/api-server && node dist/com003-review-file/com003-question-review-file-v1.mjs
      - name: Verify artifact
        run: |
          FILE=artifacts/api-server/dist/com003-review-file/COM-003-Office-Productivity-English-Question-Review-V1.html
          test -s "$FILE"
          grep -q 'English V8 · Deep Exam Surface Review Candidate' "$FILE"
          grep -q 'DIRECT_RECALL' "$FILE"
          grep -q 'FUNCTIONAL_APPLICATION' "$FILE"
          grep -q 'EXAMPLE_RECOGNITION' "$FILE"
          grep -q 'CONTRAST_DISCRIMINATION' "$FILE"
          grep -q 'COM-003-QL-019' "$FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: com003-office-productivity-english-question-review-v1
          path: artifacts/api-server/dist/com003-review-file/COM-003-Office-Productivity-English-Question-Review-V1.html
          if-no-files-found: error
