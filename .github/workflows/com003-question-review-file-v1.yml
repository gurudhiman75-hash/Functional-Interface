name: COM-003 Question Review File V1

on:
  push:
    branches:
      - feature/com003-office-productivity-discovery-v1
    paths:
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-question-review-file-v1.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-review-synthesis-v5.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-review-synthesis-v6.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-review-synthesis-v6.test.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-exam-realness-audit-v1.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-product-review-revocation-v1.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-product-review-revocation-v1.test.ts'
      - '.github/workflows/com003-question-review-file-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-review-file:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate V6 exam-realness candidate and V4 revocation
        run: |
          mkdir -p artifacts/api-server/dist/com003-review-file
          for test in \
            com003-review-synthesis-v6.test \
            com003-product-review-revocation-v1.test; do
            pnpm --dir artifacts/api-server exec esbuild \
              src/knowledge-v1/computer-awareness/${test}.ts \
              --bundle --platform=node --format=esm \
              --outfile=dist/com003-review-file/${test}.mjs
            node artifacts/api-server/dist/com003-review-file/${test}.mjs
          done
      - name: Bundle review exporter
        run: |
          mkdir -p artifacts/api-server/dist/com003-review-file
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/computer-awareness/com003-question-review-file-v1.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/com003-review-file/com003-question-review-file-v1.mjs
      - name: Generate review file
        run: cd artifacts/api-server && node dist/com003-review-file/com003-question-review-file-v1.mjs
      - name: Verify review file
        run: |
          test -s artifacts/api-server/dist/com003-review-file/COM-003-Office-Productivity-English-Question-Review-V1.html
          grep -q '228 questions' artifacts/api-server/dist/com003-review-file/COM-003-Office-Productivity-English-Question-Review-V1.html
          grep -q 'COM-003-QL-019' artifacts/api-server/dist/com003-review-file/COM-003-Office-Productivity-English-Question-Review-V1.html
          grep -q 'English V6 Exam-Realness Remediation Candidate' artifacts/api-server/dist/com003-review-file/COM-003-Office-Productivity-English-Question-Review-V1.html
          grep -q 'REJECTED — stems not exam level' artifacts/api-server/dist/com003-review-file/COM-003-Office-Productivity-English-Question-Review-V1.html
          grep -q 'V5 technical disposition' artifacts/api-server/dist/com003-review-file/COM-003-Office-Productivity-English-Question-Review-V1.html
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: com003-office-productivity-english-question-review-v1
          path: artifacts/api-server/dist/com003-review-file/COM-003-Office-Productivity-English-Question-Review-V1.html
          if-no-files-found: error
