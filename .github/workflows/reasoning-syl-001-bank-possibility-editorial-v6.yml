name: Validate SYL-001 Banking possibility editorial V6

on:
  pull_request:
    branches: [audit/syl-001-source-profile-freeze, feat/syl-001-learner-v4, New-main]
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-editorial-v6.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-editorial-v6-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-banking-possibility-editorial-v6.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-review-question-v4.ts
      - .github/workflows/reasoning-syl-001-bank-possibility-editorial-v6.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-syl-001-bank-possibility-editorial-v6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-editorial-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle V6 audit
        run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-editorial-v6-audit.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/syl-001-bank-possibility-editorial-v6-audit.test.mjs
      - name: Run V6 audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-editorial-v6-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-editorial-v6-audit.log
      - name: Bundle V6 exporter
        run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-banking-possibility-editorial-v6.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/export-syl-001-bank-possibility-editorial-v6.mjs
      - name: Generate V6 review pack
        run: node artifacts/api-server/dist/reasoning-v1/export-syl-001-bank-possibility-editorial-v6.mjs
      - name: Upload V6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syl-001-bank-possibility-editorial-v6
          path: |
            artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-editorial-v6-audit.log
            dist/reasoning-v1/syl-001-bank-possibility-editorial-v6/**
          if-no-files-found: error
          retention-days: 30
