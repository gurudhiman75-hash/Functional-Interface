name: Validate SER-001 CP-007 V5 structural depth

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-D/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUTHORITY-FREEZE-CANDIDATE/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-DISTRACTOR-AUDIT/**
      - .github/workflows/ser-001-cp007-v5-structural-depth.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-cp007-v5-structural-depth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-export-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/cp007-v5-structural-depth

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Run V5 structural-depth proof
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-v5-structural-depth
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/adaptive-review-v5-structural-depth.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/adaptive-review-v5-structural-depth.test.mjs"
          (cd artifacts/api-server && node "$OUT/adaptive-review-v5-structural-depth.test.mjs") \
            | tee "$EVIDENCE/SER-CP-007-V5-Structural-Depth-Proof.json"
          grep -q 'PASS_SER_CP007_V5_STRUCTURAL_DEPTH_REMEDIATION' \
            "$EVIDENCE/SER-CP-007-V5-Structural-Depth-Proof.json"
          grep -q '"knownBadQuestionRejected": true' \
            "$EVIDENCE/SER-CP-007-V5-Structural-Depth-Proof.json"
          grep -q '"structuralDepthFailures": 0' \
            "$EVIDENCE/SER-CP-007-V5-Structural-Depth-Proof.json"

      - name: Export V5 400-question review pack
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-v5-structural-depth
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/export-adaptive-review-v5-400-questions.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/export-adaptive-review-v5-400-questions.mjs"
          (cd artifacts/api-server && node "$OUT/export-adaptive-review-v5-400-questions.mjs") \
            > "$EVIDENCE/SER-CP-007-V5-400-Non-Trivial-Questions-and-Explanations-Review.md"

      - name: Validate V5 review pack
        run: |
          set -euo pipefail
          FILE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-v5-structural-depth/SER-CP-007-V5-400-Non-Trivial-Questions-and-Explanations-Review.md
          grep -q '# SER-CP-007 V5 — 400 Non-Trivial Questions and Explanations Review' "$FILE"
          grep -q 'Structural-depth failures:    0' "$FILE"
          grep -q 'Requires intended rule application: \*\*YES\*\*' "$FILE"
          QUESTION_COUNT=$(grep -c '^## Question [0-9][0-9][0-9]$' "$FILE")
          ANSWER_COUNT=$(grep -c '^\*\*Answer:\*\*' "$FILE")
          EXPLANATION_COUNT=$(grep -c '^### Explanation$' "$FILE")
          STRUCTURAL_PASS_COUNT=$(grep -c '^\- \*\*Structural depth:\*\* \*\*PASS\*\*$' "$FILE")
          test "$QUESTION_COUNT" -eq 400
          test "$ANSWER_COUNT" -eq 400
          test "$EXPLANATION_COUNT" -eq 400
          test "$STRUCTURAL_PASS_COUNT" -eq 400
          ! grep -q 'CGRLMQF, XTIONJU, CGRLMQF, XTIONJU' "$FILE"
          echo 'PASS_SER_CP007_V5_400_NON_TRIVIAL_REVIEW_PACK'

      - name: Upload V5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-cp007-v5-structural-depth
          path: artifacts/api-server/dist/reasoning-v1/ser-001/cp007-v5-structural-depth/
          if-no-files-found: error
          retention-days: 30
