name: Validate complete PNC-002 Hindi Punjabi localisation

on:
  push:
    branches:
      - feat/pnc-002-complete-hi-pa-localization
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/**
      - .github/workflows/pnc-002-localization-complete-approved.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/**
      - .github/workflows/pnc-002-localization-complete-approved.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pnc-002-localization-complete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pnc-002-localization-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: >-
          pnpm exec tsc
          --noEmit
          --target es2022
          --module esnext
          --moduleResolution bundler
          --resolveJsonModule
          --allowSyntheticDefaultImports
          --strictNullChecks
          --noImplicitAny
          --noImplicitReturns
          --noFallthroughCasesInSwitch
          --skipLibCheck
          --types node
          src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/localization-checkpoint-shared.ts
          src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/localization-cp007-approved.ts
          src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/localization-cp010.ts
          src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/localization-cp010-approved.ts
          src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/localization-cp011.ts
          src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/localization-cp011-approved.ts
          src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/localization-cp012.ts
          src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/localization-cp012-approved.ts
          src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/localization-pnc002-approved.ts
          src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-localization-complete-approved.test.ts
      - name: Bundle complete localisation proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-localization-complete-approved.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/pnc-002-localization-complete-approved-proof.mjs
      - name: Run complete localisation proof
        working-directory: artifacts/api-server
        run: node dist/quant-v4/pnc-002-localization-complete-approved-proof.mjs
