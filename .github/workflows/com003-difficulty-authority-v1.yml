name: COM-003 Difficulty Authority V1

on:
  push:
    branches:
      - feature/com003-office-productivity-discovery-v1
    paths:
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-difficulty-authority-v1.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-difficulty-authority-v1.test.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-difficulty-review-file-v1.ts'
      - '.github/workflows/com003-difficulty-authority-v1.yml'
  pull_request:
    branches:
      - integration/computer-content-engine-mainline-v1
    paths:
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-difficulty-authority-v1.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-difficulty-authority-v1.test.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-difficulty-review-file-v1.ts'
      - '.github/workflows/com003-difficulty-authority-v1.yml'

permissions:
  contents: read

concurrency:
  group: com003-difficulty-authority-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle difficulty authority and review artifact
        run: |
          mkdir -p artifacts/api-server/dist/com003-difficulty-v1
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/computer-awareness/com003-difficulty-authority-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/com003-difficulty-v1/com003-difficulty-authority-v1.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/computer-awareness/com003-difficulty-review-file-v1.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/com003-difficulty-v1/com003-difficulty-review-file-v1.mjs
      - name: Run difficulty authority audit
        run: node artifacts/api-server/dist/com003-difficulty-v1/com003-difficulty-authority-v1.test.mjs
      - name: Generate difficulty review artifact
        run: cd artifacts/api-server && node dist/com003-difficulty-v1/com003-difficulty-review-file-v1.mjs
      - name: Verify difficulty review artifact
        run: |
          FILE=artifacts/api-server/dist/com003-difficulty-review/COM-003-Office-Productivity-Difficulty-Authority-V1.html
          test -s "$FILE"
          grep -q '228 questions' "$FILE"
          grep -q 'Easy 92' "$FILE"
          grep -q 'Medium 136' "$FILE"
          grep -q 'Hard 0' "$FILE"
          grep -q 'Hard routing:</b> not authorized' "$FILE"
          grep -q 'COM-003-QL-019' "$FILE"
      - name: Upload difficulty review artifact
        uses: actions/upload-artifact@v4
        with:
          name: com003-office-productivity-difficulty-authority-v1-review
          path: artifacts/api-server/dist/com003-difficulty-review/COM-003-Office-Productivity-Difficulty-Authority-V1.html
          if-no-files-found: error
