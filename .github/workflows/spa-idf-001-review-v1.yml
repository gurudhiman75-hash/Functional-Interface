name: Validate SPA IDF-001 Review V1

on:
  pull_request:
    branches:
      - New-main
    paths:
      - 'artifacts/api-server/src/reasoning-v1/foundation/spatial/identical-figure-**'
      - 'artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-permanent-ql-allocation-v13.ts'
      - 'artifacts/api-server/src/reasoning-v1/tests/identical-figure-idf-001-**'
      - '.github/workflows/spa-fmt-001-freeze-question-studio-v1.yml'
  workflow_dispatch:

concurrency:
  group: spa-idf-001-review-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle IDF-001 semantic review proof
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/identical-figure-idf-001-review-v1.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/reasoning-v1/spatial/identical-figure-idf-001-review-v1.test.mjs

      - name: Run IDF-001 semantic review proof
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/identical-figure-idf-001-review-v1.test.mjs 2>&1 \
            | tee dist/reasoning-v1/spatial/idf-001-review-v1-run.log

      - name: Bundle IDF-001 visual review pack
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/identical-figure-idf-001-visual-review-v1.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/reasoning-v1/spatial/identical-figure-idf-001-visual-review-v1.mjs

      - name: Generate IDF-001 visual review pack
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/identical-figure-idf-001-visual-review-v1.mjs 2>&1 \
            | tee dist/reasoning-v1/spatial/idf-001-visual-review-v1-run.log

      - name: Upload IDF-001 V1 review evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-idf-001-review-v1
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/idf-001-review-v1-run.log
            artifacts/api-server/dist/reasoning-v1/spatial/spa-idf-001-visual-review-v1.html
            artifacts/api-server/dist/reasoning-v1/spatial/spa-idf-001-visual-review-v1.json
            artifacts/api-server/dist/reasoning-v1/spatial/idf-001-visual-review-v1-run.log
          if-no-files-found: error
