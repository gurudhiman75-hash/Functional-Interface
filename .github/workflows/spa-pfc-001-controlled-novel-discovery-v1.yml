name: Validate SPA PFC-001 Controlled Novel Discovery V1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pfc-controlled-novel-discovery-v1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle controlled-novel discovery gate
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-paper-folding-innovation-discovery-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-paper-folding-innovation-discovery-v1.test.mjs
      - name: Validate controlled-novel PFC discovery
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-innovation-discovery-v1.test.mjs
      - name: Upload controlled-novel discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-pfc-controlled-novel-discovery-v1
          path: artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-controlled-novel-discovery-v1-evidence.json
          if-no-files-found: error
