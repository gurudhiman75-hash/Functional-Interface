name: Validate NUM-CP-003 permanent allocation

on:
  pull_request:
    branches:
      - New-main
      - feat/num-001-cp003-prototype-foundation
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-003/permanent/**
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-003/retained/**
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/foundation/**
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-003/NUM-CP-003-17-TEMPLATE-PRODUCT-APPROVAL.md
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-003/NUM-CP-003-PERMANENT-ALLOCATION-CHECKPOINT.md
      - .github/workflows/num-001-cp003-permanent-allocation.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp003-permanent-allocation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp003-permanent-allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle retained-registry regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-003/retained/template-registry.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp003-permanent-retained-registry.mjs
      - name: Run retained-registry regression
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp003-permanent-retained-registry.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp003-permanent-retained-registry.log
      - name: Bundle permanent-allocation proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-003/permanent/allocation.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp003-permanent-allocation.test.mjs
      - name: Run permanent-allocation proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp003-permanent-allocation.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp003-permanent-allocation-proof.log
      - name: Upload permanent-allocation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: num-001-cp003-permanent-allocation
          path: |
            artifacts/api-server/dist/quant-v4/num-001-cp003-permanent-retained-registry.log
            artifacts/api-server/dist/quant-v4/num-001-cp003-permanent-allocation-proof.log
          if-no-files-found: error
          retention-days: 7
