name: Sync BLR-CP-002 With New-main

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  sync-feature-branch:
    if: >-
      github.event.pull_request.base.ref == 'feat/blr-001-cp002-pointer-runtime' &&
      github.event.pull_request.head.ref == 'New-main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out CP-002 feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/blr-001-cp002-pointer-runtime
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "ExamTree CI"
          git config user.email "exam-tree-ci@users.noreply.github.com"

      - name: Merge current New-main
        run: |
          git fetch origin New-main
          git merge --no-ff origin/New-main -m "Merge current New-main into frozen BLR-CP-002"

      - name: Push synchronized feature branch
        run: git push origin HEAD:feat/blr-001-cp002-pointer-runtime
