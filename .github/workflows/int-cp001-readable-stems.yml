name: Validate INT-CP-001 readable stems

on:
  pull_request:
    branches:
      - feat/int-001-cp001-inactive-release-readiness
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/**
      - .github/workflows/int-cp001-readable-stems.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-int-cp001-readable-stems-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-int-cp001-readable-stems:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle approved English regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp001-final-freeze-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp001-readable-english-regression.mjs
      - name: Run approved English regression
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/int-001-cp001-readable-english-regression.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/int-001-cp001-readable-english-regression.log

      - name: Bundle approved multilingual V2 regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp001-multilingual-v2-approval-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp001-readable-v2-regression.mjs
      - name: Run approved multilingual V2 regression
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/int-001-cp001-readable-v2-regression.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/int-001-cp001-readable-v2-regression.log

      - name: Bundle readable-stem audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp001-readable-stem-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp001-readable-stem-audit.mjs
      - name: Run readable-stem audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/int-001-cp001-readable-stem-audit.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/int-001-cp001-readable-stem-audit.log

      - name: Bundle readable-stem review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp001-readable-stem-review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp001-readable-stem-review-export.mjs
      - name: Generate readable-stem review packs
        working-directory: artifacts/api-server
        run: node dist/quant-v4/int-001-cp001-readable-stem-review-export.mjs

      - name: Upload readable-stem evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-cp001-readable-stem-review
          path: |
            artifacts/api-server/dist/quant-v4/int-001-cp001-readable-english-regression.log
            artifacts/api-server/dist/quant-v4/int-001-cp001-readable-v2-regression.log
            artifacts/api-server/dist/quant-v4/int-001-cp001-readable-stem-audit.log
            artifacts/api-server/dist/quant-v4/int-001-cp001-english-v4-readable-stem-review.json
            artifacts/api-server/dist/quant-v4/int-001-cp001-english-v4-readable-stem-review.md
            artifacts/api-server/dist/quant-v4/int-001-cp001-hindi-v3-readable-stem-review.json
            artifacts/api-server/dist/quant-v4/int-001-cp001-hindi-v3-readable-stem-review.md
            artifacts/api-server/dist/quant-v4/int-001-cp001-punjabi-v3-readable-stem-review.json
            artifacts/api-server/dist/quant-v4/int-001-cp001-punjabi-v3-readable-stem-review.md
            artifacts/api-server/dist/quant-v4/int-001-cp001-readable-stem-review-summary.json
          if-no-files-found: warn
          retention-days: 7
