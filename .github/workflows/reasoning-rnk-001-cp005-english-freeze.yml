name: Validate RNK-001 CP-005 English Freeze

on:
  push:
    branches:
      - freeze/rnk-001-cp005-english
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/**'
      - 'artifacts/api-server/src/reasoning-v1/question-studio-registry*'
      - '.github/workflows/reasoning-rnk-001-cp005-english-freeze.yml'
  workflow_dispatch:

jobs:
  validate-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate frozen 576-question CP-005 runtime
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-005/cp005-permanent-runtime-v1-gates.test.ts \
            | tee rnk-cp005-permanent-freeze.log

      - name: Validate pinned candidate regression
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-005/cp005-permanent-runtime-candidate-v1.test.ts \
            | tee rnk-cp005-candidate-regression.log

      - name: Validate CP-005 V3 release semantics remain intact
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-005/cp005-partial-order-editorial-v3-release.test.ts \
            | tee rnk-cp005-v3-release.log

      - name: Validate QL-034 ownership boundary remains intact
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-005/rnk-cp005-ql034-ownership-audit.test.ts \
            | tee rnk-cp005-ql034-ownership.log

      - name: Validate frozen CP-004 permanent projection
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-permanent-runtime-v1-gates.test.ts \
            | tee rnk-cp004-permanent-runtime.log

      - name: Validate Question Studio remains disabled
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/question-studio-registry.test.ts \
            | tee rnk-question-studio-registry.log

      - name: Build API server
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server build \
            | tee rnk-cp005-freeze-api-build.log

      - name: Upload freeze evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnk-001-cp005-english-freeze-evidence
          path: |
            rnk-cp005-permanent-freeze.log
            rnk-cp005-candidate-regression.log
            rnk-cp005-v3-release.log
            rnk-cp005-ql034-ownership.log
            rnk-cp004-permanent-runtime.log
            rnk-question-studio-registry.log
            rnk-cp005-freeze-api-build.log
          if-no-files-found: ignore
          retention-days: 14
