name: COM-003 V14 Simple Direct Exam Review

on:
  push:
    branches:
      - feature/com003-office-productivity-discovery-v1
    paths:
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-review-synthesis-v13.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-review-synthesis-v14.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-review-synthesis-v14.test.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-question-review-md-v14.ts'
      - '.github/workflows/com003-v14-simple-direct-exam-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate V14 simple direct exam language
        run: |
          mkdir -p artifacts/api-server/dist/com003-review-v14
          pnpm --dir artifacts/api-server exec esbuild src/knowledge-v1/computer-awareness/com003-review-synthesis-v14.test.ts --bundle --platform=node --format=esm --outfile=dist/com003-review-v14/com003-review-synthesis-v14.test.mjs
          set +e
          node artifacts/api-server/dist/com003-review-v14/com003-review-synthesis-v14.test.mjs 2>&1 | tee artifacts/api-server/dist/com003-review-v14/validation.log
          STATUS=${PIPESTATUS[0]}
          set -e
          exit $STATUS
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: com003-v14-validation-log
          path: artifacts/api-server/dist/com003-review-v14/validation.log
          if-no-files-found: warn
      - name: Generate V14 Markdown review file
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/knowledge-v1/computer-awareness/com003-question-review-md-v14.ts --bundle --platform=node --format=esm --outfile=dist/com003-review-v14/com003-question-review-md-v14.mjs
          cd artifacts/api-server && node dist/com003-review-v14/com003-question-review-md-v14.mjs
      - name: Verify Markdown review file
        run: |
          FILE=artifacts/api-server/dist/com003-review-v14/COM-003-Office-Productivity-English-Question-Review-V14.md
          test -s "$FILE"
          grep -q 'English V14 · Simple Direct Exam Language Review Candidate' "$FILE"
          grep -q '228 questions' "$FILE"
          grep -q 'COM-003-QL-019' "$FILE"
          ! grep -Eiq 'is described as|refers to which|what is is|what does The|shortcut for start|Windows desktop version|keyboard shortcut|as applicable|configured/common|basic numeric-count context|merged outputs|recipient/data-source|supplied set or range|evenly ordered intervals' "$FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: com003-office-productivity-english-question-review-v14
          path: artifacts/api-server/dist/com003-review-v14/COM-003-Office-Productivity-English-Question-Review-V14.md
          if-no-files-found: error
