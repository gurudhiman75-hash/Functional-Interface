name: Validate SPA FFM-001 Review V4

on:
  push:
    branches:
      - feature/spa-ffm-001-review-v4
    paths:
      - "artifacts/api-server/src/reasoning-v1/foundation/spatial/figure-formation-*.ts"
      - "artifacts/api-server/src/reasoning-v1/tests/figure-formation-ffm-001-*.ts"
      - ".github/workflows/spa-ffm-001-review-v4.yml"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/foundation/spatial/figure-formation-*.ts"
      - "artifacts/api-server/src/reasoning-v1/tests/figure-formation-ffm-001-*.ts"
      - ".github/workflows/spa-ffm-001-review-v4.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Typecheck admin Question Studio UI
        run: pnpm --dir artifacts/admin-app typecheck

      - name: Bundle FFM-001 V4 review proof
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/figure-formation-ffm-001-review-v4.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/reasoning-v1/spatial/figure-formation-ffm-001-review-v4.test.mjs

      - name: Run FFM-001 V4 review proof
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/figure-formation-ffm-001-review-v4.test.mjs 2>&1 \
            | tee dist/reasoning-v1/spatial/ffm-001-review-v4-run.log

      - name: Bundle FFM-001 V4 visual review pack
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/figure-formation-ffm-001-visual-review-v4.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/reasoning-v1/spatial/figure-formation-ffm-001-visual-review-v4.mjs

      - name: Generate FFM-001 V4 visual review pack
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/figure-formation-ffm-001-visual-review-v4.mjs 2>&1 \
            | tee dist/reasoning-v1/spatial/ffm-001-visual-review-v4-run.log

      - name: Upload FFM-001 V4 review evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-ffm-001-review-v4
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/ffm-001-review-v4-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/ffm-001-review-v4-run.log
            artifacts/api-server/dist/reasoning-v1/spatial/spa-ffm-001-visual-review-v4.html
            artifacts/api-server/dist/reasoning-v1/spatial/spa-ffm-001-visual-review-v4.json
            artifacts/api-server/dist/reasoning-v1/spatial/ffm-001-visual-review-v4-run.log
          if-no-files-found: error
