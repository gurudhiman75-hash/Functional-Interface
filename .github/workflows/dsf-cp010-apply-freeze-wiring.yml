name: Apply DSF-CP-010 Freeze Wiring

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-010/**
      - .github/workflows/dsf-cp010-apply-freeze-wiring.yml

permissions:
  contents: write

concurrency:
  group: dsf-cp010-apply-freeze-wiring-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-dsf-cp010-freeze-wiring:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CP010 feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply CP010 freeze wiring patch
        run: python artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-010/apply-cp010-freeze-patch-v2.py
      - name: Commit and push wiring
        run: |
          if git diff --quiet; then
            echo "CP010 freeze wiring already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/admin-question-studio-data-sufficiency.ts \
                  artifacts/admin-app/src/features/question-studio/data-sufficiency-review-api.ts \
                  artifacts/admin-app/src/pages/content/QuestionStudioDataSufficiencyReviewPanel.tsx
          git commit -m "DSF-CP-010: wire final multilingual freeze into Question Studio"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
