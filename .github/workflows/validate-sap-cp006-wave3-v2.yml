name: Validate SAP-CP-006 exact-arithmetic data sufficiency v2

on:
  pull_request:
    branches:
      - New-main
      - feat/sap-cp005-structural-cancellation-foundation
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-006/**
      - .github/workflows/validate-sap-cp006-wave3-v2.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-sap-cp006-wave3-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-sap-cp006-wave3-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle wave-three v2 authority
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-006/authority-wave3-v2.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/sap-cp006-wave3-v2-authority.test.mjs
      - name: Run wave-three v2 authority
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/sap-cp006-wave3-v2-authority.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/sap-cp006-wave3-v2-authority.log
      - name: Upload wave-three v2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sap-cp006-wave3-v2-authority
          path: artifacts/api-server/dist/quant-v4/sap-cp006-wave3-v2-authority.log
          if-no-files-found: error
          retention-days: 30
