name: Reasoning COD-001 Runtime

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/**"
      - ".github/workflows/reasoning-cod-001-runtime.yml"
  workflow_dispatch:

jobs:
  cod-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run COD-CP-001 exhaustive runtime audit
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-001/cod-cp-001.test.ts

      - name: Run COD-CP-002 exhaustive runtime audit
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-002/cod-cp-002.test.ts
