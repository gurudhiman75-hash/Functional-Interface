name: Reasoning COD-001 Runtime

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/**"
      - ".github/workflows/reasoning-cod-001-runtime.yml"
  workflow_dispatch:

jobs:
  cod-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run COD-CP-001 exhaustive runtime audit
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-001/cod-cp-001.test.ts

      - name: Run COD-CP-002 exhaustive runtime audit
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-002/cod-cp-002.test.ts

      - name: Run COD-CP-003 exhaustive runtime audit
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-003/cod-cp-003.test.ts

      - name: Run COD-CP-004 exhaustive runtime audit
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-004/cod-cp-004.test.ts

      - name: Run CP-001 to CP-004 editorial regression audit
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/review/cod-cp001-cp004-editorial.test.ts

      - name: Run standard competitive-exam stem audit
        id: standard_stems
        shell: bash
        run: |
          set +e
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/review/cod-standard-exam-stems.test.ts > cod-standard-exam-stems.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload standard stem audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod-001-standard-exam-stem-audit
          path: cod-standard-exam-stems.log
          retention-days: 7

      - name: Enforce standard competitive-exam stem result
        shell: bash
        run: |
          cat cod-standard-exam-stems.log
          test "${{ steps.standard_stems.outputs.exit_code }}" = "0"

      - name: Export CP-001 to CP-004 editorial review corpus
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/review/export-cp001-cp004-review.ts cod-review-output

      - name: Upload editorial review corpus
        uses: actions/upload-artifact@v4
        with:
          name: cod-001-cp001-cp004-editorial-review
          path: cod-review-output
          retention-days: 7
