name: Validate INT-CP-004 Hindi Punjabi V8 freeze

on:
  pull_request:
    branches:
      - feat/int-cp004-hi-pa-v6-localisation
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp004-localization-v6-native-v8-frozen.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp004-hi-pa-v6-v8-freeze-audit.ts"
      - ".github/workflows/int-cp004-hi-pa-v6-v8-freeze.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-int-cp004-hi-pa-v8-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle V8 source audit
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp004-localization-v6-native-v8-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/int-001-cp004-localization-v6-native-v8-audit.mjs

      - name: Run V8 source audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp004-localization-v6-native-v8-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp004-localization-v6-native-v8-audit.log

      - name: Bundle V8 freeze audit
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp004-hi-pa-v6-v8-freeze-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/int-001-cp004-hi-pa-v6-v8-freeze-audit.mjs

      - name: Run V8 freeze audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp004-hi-pa-v6-v8-freeze-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp004-hi-pa-v6-v8-freeze-audit.log

      - name: Bundle CP-001 isolation audit
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp001-question-studio-pre-registration-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/int-001-cp001-question-studio-pre-registration-audit.mjs

      - name: Run CP-001 isolation audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp001-question-studio-pre-registration-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp001-question-studio-pre-registration-audit.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Verify freeze evidence
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          grep -q 'PASS_INT_CP004_HI_PA_V6_NATIVE_V8' artifacts/api-server/dist/quant-v4/int-001-cp004-localization-v6-native-v8-audit.log
          grep -q 'PASS_INT_CP004_HI_PA_V6_V8_FREEZE' artifacts/api-server/dist/quant-v4/int-001-cp004-hi-pa-v6-v8-freeze-audit.log
          grep -q 'PASS_INT_CP001_QUESTION_STUDIO_PRE_REGISTRATION' artifacts/api-server/dist/quant-v4/int-001-cp001-question-studio-pre-registration-audit.log
          test -f artifacts/api-server/dist/quant-v4/int-cp004-hi-pa-v6-v8-freeze/int-cp004-hi-pa-v6-v8-freeze-audit.json

      - name: Upload V8 freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-cp004-hi-pa-v6-v8-freeze-evidence
          path: |
            artifacts/api-server/dist/quant-v4/int-001-cp004-localization-v6-native-v8-audit.log
            artifacts/api-server/dist/quant-v4/int-001-cp004-hi-pa-v6-v8-freeze-audit.log
            artifacts/api-server/dist/quant-v4/int-001-cp001-question-studio-pre-registration-audit.log
            artifacts/api-server/dist/quant-v4/int-cp004-hi-pa-v6-v8-freeze/**
          if-no-files-found: error
          retention-days: 30
