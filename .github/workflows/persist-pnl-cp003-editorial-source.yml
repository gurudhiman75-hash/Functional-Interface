name: Persist PNL CP-003 editorial source correction

on:
  push:
    branches:
      - feat/pnl-001-question-studio-review-runtime
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/foundation/editorial-v2-legacy-normalized.ts"
      - ".github/workflows/persist-pnl-cp003-editorial-source.yml"

permissions:
  contents: write

jobs:
  persist-cp003:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-question-studio-review-runtime
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate normalized CP-001 through CP-003 libraries
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/editorial-v2-cp001-cp003-export.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-cp001-cp003-export.mjs
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-cp001-cp003-export.mjs

      - name: Persist only corrected CP-003 source
        run: |
          cp \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-generated/CP-003.editorial-content.en.json \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/editorial-content.en.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/editorial-content.en.json

          if git diff --cached --quiet; then
            echo "CP-003 editorial source already matches the normalized generator."
          else
            git commit -m "fix(pnl): persist complete QL-092 target in CP-003 source"
            git push origin HEAD:feat/pnl-001-question-studio-review-runtime
          fi
