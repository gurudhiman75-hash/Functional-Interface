name: Verify TRG-002 CP008 Localization V1

on:
  push:
    branches: [feat/trg-002-localization-hi-pa-v1]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/**
      - .github/workflows/trg-002-cp008-localization-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trg-002-cp008-localization-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Targeted Trigonometry TypeScript compile
        run: |
          cat > artifacts/api-server/tsconfig.trg002-localization.json <<'EOF'
          {"extends":"./tsconfig.json","compilerOptions":{"noEmit":true},"include":["src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/**/*.ts"],"exclude":["src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/question-studio-storage.test.ts"],"references":[]}
          EOF
          pnpm exec tsc -p artifacts/api-server/tsconfig.trg002-localization.json --pretty false
      - name: Protect frozen English 96-QL content
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/production-freeze-96.test.ts
      - name: Execute CP008 Hindi Punjabi semantic-parity gate
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/localization-cp008-v1.test.ts
      - name: Export CP008 bilingual human-review pack
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/export-localization-cp008-review-v1.ts
      - name: Verify CP008 review artifact
        run: |
          JSON=artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/review-artifacts/localization-cp008-v1/TRG-002-CP008-HI-PA-LOCALIZATION-REVIEW-V1.json
          HTML=artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/review-artifacts/localization-cp008-v1/TRG-002-CP008-HI-PA-LOCALIZATION-REVIEW-V1.html
          test -s "$JSON" && test -s "$HTML"
          node - "$JSON" <<'NODE'
          const fs=require('fs'); const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(rows.length!==48) throw new Error(`Expected 48 records, got ${rows.length}`);
          const qls=new Set(rows.map(r=>r.qlId)); if(qls.size!==24) throw new Error(`Expected 24 QLs, got ${qls.size}`);
          for(const id of qls){const n=Number(id.slice(-3)); if(n<25||n>48) throw new Error(`${id}: outside CP008`); const a=rows.filter(r=>r.qlId===id); if(a.length!==2||!a.some(r=>r.locale==='hi-IN')||!a.some(r=>r.locale==='pa-IN')) throw new Error(`${id}: bilingual pair missing`);}
          for(const r of rows){if(r.humanReviewStatus!=='PENDING'||r.freezeStatus!=='NOT_FROZEN'||r.activationAuthorized!==false||r.localizationLifecycle?.multilingualFreezeGranted!==false||r.localizationLifecycle?.productDeliveryUnlocked!==false) throw new Error(`${r.qlId}:${r.locale}: lifecycle lock drift`);}
          console.log(`TRG002_CP008_LOCALIZATION_REVIEW_PACK_PASS records=${rows.length} qls=${qls.size} locales=2 human=PENDING freeze=NO activation=OFF`);
          NODE
      - name: Upload CP008 localization review pack
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trg-002-cp008-hi-pa-localization-review-v1
          path: artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/review-artifacts/localization-cp008-v1/
          if-no-files-found: error
          retention-days: 14
