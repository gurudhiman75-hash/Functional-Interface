name: Export MEN-CP-008 post-merge review source

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-008/review/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-008/permanent/**
      - .github/workflows/men-002-cp008-post-merge-review-export.yml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: export-men-002-cp008-post-merge-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-review-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle post-merge review exporter
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-008/review/export-review-json.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/men-cp008-post-merge-review-export.mjs

      - name: Generate and validate source-backed review JSON
        shell: bash
        run: |
          set -euo pipefail
          node artifacts/api-server/dist/quant-v4/men-cp008-post-merge-review-export.mjs
          test -s dist/review/MEN-CP-008-English-Review-Source.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('dist/review/MEN-CP-008-English-Review-Source.json', 'utf8'));
          if (payload.meta.sourceAuthority !== 'New-main@dea83939713e551dce5286287fdf0f1f4049416e') throw new Error('Wrong source authority.');
          if (payload.meta.qlCount !== 52 || payload.meta.recordCount !== 156) throw new Error('Wrong review inventory.');
          if (payload.meta.firstQlId !== 'MEN-002-QL-044' || payload.meta.lastQlId !== 'MEN-002-QL-095') throw new Error('Wrong QL range.');
          if (!payload.records.every((record) => record.question.validation.valid && record.question.verification.valid)) throw new Error('Proof failure in exported record.');
          if (!payload.records.every((record) => /^(Think|Picture)\b/.test(record.question.explanation.keyRule))) throw new Error('Visual-first hook missing.');
          if (!payload.records.every((record) => record.question.explanation.shortcut.startsWith('⚡ Exam speed:'))) throw new Error('Exam-speed prefix missing.');
          console.log(`Validated ${payload.meta.recordCount} merged-runtime review records.`);
          NODE

      - name: Re-prove all permanent CP-008 packages
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-008/permanent/english.test.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/men-cp008-post-merge-review-proof.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp008-post-merge-review-proof.test.mjs

      - name: Build production API bundle
        shell: bash
        run: bash build-api.sh

      - name: Upload merged-runtime review source
        uses: actions/upload-artifact@v4
        with:
          name: MEN-CP-008-English-Review-Source
          path: dist/review/MEN-CP-008-English-Review-Source.json
          if-no-files-found: error
          retention-days: 14
