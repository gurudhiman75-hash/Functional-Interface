name: Validate SPA PFC-001 Final Combined English Review V1.2

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/foundation/spatial/**"
      - "artifacts/api-server/src/reasoning-v1/tests/spatial-*.test.ts"
      - "artifacts/admin-app/src/features/question-studio/**"
      - "artifacts/admin-app/src/pages/content/QuestionStudioSpatialReviewPanel.tsx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pfc-final-combined-english-review-v1-2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle final combined V1.2 option-clarity gate
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-paper-folding-final-combined-english-review-v1-2.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-paper-folding-final-combined-english-review-v1-2.test.mjs
      - name: Validate final combined PFC TPF V1.2 option clarity
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-final-combined-english-review-v1-2.test.mjs
      - name: Upload final combined V1.2 learner-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: spa-pfc-tpf-final-combined-review-v1-2
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-final-combined-review-v1-2.html
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-final-combined-review-v1-2-evidence.json
          if-no-files-found: error
