name: Validate PGK-001 Localization V1

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/punjab-gk/localization-v1/**"
      - "artifacts/api-server/src/knowledge-v1/punjab-gk/pgk-001-cp*-review-batch-v*.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgk-localization-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pgk-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and run all PGK multilingual audits
        run: |
          mkdir -p artifacts/api-server/dist/pgk-review
          for src in artifacts/api-server/src/knowledge-v1/punjab-gk/localization-v1/pgk-cp*-localization-audit-v1.ts; do
            name="$(basename "$src" .ts)"
            pnpm --dir artifacts/api-server exec esbuild               "src/knowledge-v1/punjab-gk/localization-v1/$(basename "$src")"               --bundle --packages=external --platform=node --format=esm               --outfile="dist/pgk-review/$name.mjs"
            (cd artifacts/api-server && node "dist/pgk-review/$name.mjs")
          done
      - name: Build and materialize all PGK multilingual review artifacts
        run: |
          for src in artifacts/api-server/src/knowledge-v1/punjab-gk/localization-v1/pgk-cp*-localization-export-v1.ts; do
            name="$(basename "$src" .ts)"
            pnpm --dir artifacts/api-server exec esbuild               "src/knowledge-v1/punjab-gk/localization-v1/$(basename "$src")"               --bundle --packages=external --platform=node --format=esm               --outfile="dist/pgk-review/$name.mjs"
            (cd artifacts/api-server && node "dist/pgk-review/$name.mjs")
          done
      - name: Upload PGK multilingual review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PGK-MULTILINGUAL-V1-REVIEW
          path: artifacts/api-server/dist/pgk-review/PGK-MULTILINGUAL-V1/*.md
          if-no-files-found: error
          retention-days: 30
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
