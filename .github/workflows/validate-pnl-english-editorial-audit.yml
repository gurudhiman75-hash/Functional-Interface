name: Harden PNL English Editorial Audit Sampling

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/**"
      - ".github/workflows/validate-pnl-english-editorial-audit.yml"

permissions:
  contents: write

jobs:
  harden-audit-sampling:
    if: github.head_ref == 'audit/pnl-001-english-sampling-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/pnl-001-english-sampling-hardening
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic sampling hardening
        run: node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-english-audit-sampling-hardening.mjs

      - name: Format audit authority
        run: pnpm exec prettier --write artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-001-english-editorial-audit.ts

      - name: Run existing editorial regressions
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-editorial-seed-regression.test.ts --bundle --platform=node --format=esm --outfile=/tmp/pnl-cp003-editorial-seed-regression.test.mjs
          node /tmp/pnl-cp003-editorial-seed-regression.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/cp005-editorial-seed-regression.test.ts --bundle --platform=node --format=esm --outfile=/tmp/pnl-cp005-editorial-seed-regression.test.mjs
          node /tmp/pnl-cp005-editorial-seed-regression.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-editorial-option-regression.test.ts --bundle --platform=node --format=esm --outfile=/tmp/pnl-editorial-option-regression.test.mjs
          node /tmp/pnl-editorial-option-regression.test.mjs

      - name: Generate hardened audit corpus
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-001-english-editorial-audit.ts --bundle --platform=node --format=esm --outfile=/tmp/pnl-001-english-editorial-audit.mjs
          node /tmp/pnl-001-english-editorial-audit.mjs | tee pnl-english-sampling-hardening.log

      - name: Verify and document sampling result
        run: node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-english-audit-sampling-report.mjs

      - name: Commit validated audit authority
        run: |
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          git fetch origin New-main
          git checkout origin/New-main -- .github/workflows/validate-pnl-english-editorial-audit.yml
          rm -f "$root/pnl-english-audit-sampling-hardening.mjs" "$root/pnl-english-audit-sampling-report.mjs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "audit(pnl): harden English editorial sampling"
          git push origin HEAD:audit/pnl-001-english-sampling-hardening

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnl-001-english-sampling-hardening
          path: |
            dist/quant-v4/pnl-001-english-editorial-audit
            pnl-english-sampling-hardening.log
          if-no-files-found: error
          retention-days: 14
