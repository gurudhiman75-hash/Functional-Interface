name: Validate NUM-CP-002 permanent allocation

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/**
      - .github/workflows/num-001-cp002-permanent-allocation.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp002-permanent-allocation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp002-permanent-allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle approved merge-split proposal proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-002/merge-split/proposal.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp002-allocation-merge-split-regression.test.mjs

      - name: Run approved merge-split proposal proof
        run: node artifacts/api-server/dist/quant-v4/num-001-cp002-allocation-merge-split-regression.test.mjs

      - name: Bundle NUM-CP-002 permanent allocation proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-002/permanent/allocation.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp002-permanent-allocation.test.mjs

      - name: Run NUM-CP-002 permanent allocation proof
        run: node artifacts/api-server/dist/quant-v4/num-001-cp002-permanent-allocation.test.mjs

      - name: Bundle chapter allocation registry proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/design/number-system-current-allocation-registry.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/number-system-current-allocation-registry.test.mjs

      - name: Run chapter allocation registry proof
        run: node artifacts/api-server/dist/quant-v4/number-system-current-allocation-registry.test.mjs
