name: SCI Biology Multilingual V1

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/science/biology-localization-v1/**"
      - "artifacts/api-server/src/knowledge-v1/science/cell-biology/**"
      - "artifacts/api-server/src/knowledge-v1/science/plant-biology/**"
      - "artifacts/api-server/src/knowledge-v1/science/human-digestive-system/**"
      - "artifacts/api-server/src/knowledge-v1/science/respiratory-system/**"
  workflow_dispatch:

concurrency:
  group: sci-biology-multilingual-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  biology-multilingual-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle Biology multilingual audit
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/knowledge-v1/science/biology-localization-v1/sci-biology-cp019-multilingual-audit-v1.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/sci-biology-cp019-multilingual-audit-v1.mjs
      - name: Run Biology CP019 multilingual audit
        working-directory: artifacts/api-server
        run: node dist/sci-biology-cp019-multilingual-audit-v1.mjs
      - name: Bundle Biology CP020 multilingual audit
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/knowledge-v1/science/biology-localization-v1/sci-biology-cp020-multilingual-audit-v1.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/sci-biology-cp020-multilingual-audit-v1.mjs
      - name: Run Biology CP020 multilingual audit
        working-directory: artifacts/api-server
        run: node dist/sci-biology-cp020-multilingual-audit-v1.mjs

      - name: Bundle Biology CP021 multilingual audit
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/knowledge-v1/science/biology-localization-v1/sci-biology-cp021-multilingual-audit-v1.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/sci-biology-cp021-multilingual-audit-v1.mjs
      - name: Run Biology CP021 multilingual audit
        working-directory: artifacts/api-server
        run: node dist/sci-biology-cp021-multilingual-audit-v1.mjs
      - name: Bundle Biology CP022 multilingual audit
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/knowledge-v1/science/biology-localization-v1/sci-biology-cp022-multilingual-audit-v1.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/sci-biology-cp022-multilingual-audit-v1.mjs
      - name: Run Biology CP022 multilingual audit
        working-directory: artifacts/api-server
        run: node dist/sci-biology-cp022-multilingual-audit-v1.mjs

      - name: Upload CP021-CP022 review files
        uses: actions/upload-artifact@v4
        with:
          name: sci-cp021-cp022-review-files
          path: |
            artifacts/api-server/src/knowledge-v1/science/biology-localization-v1/SCI-CP-021-MULTILINGUAL-REVIEW.md
            artifacts/api-server/src/knowledge-v1/science/biology-localization-v1/SCI-CP-022-MULTILINGUAL-REVIEW.md
          if-no-files-found: error
