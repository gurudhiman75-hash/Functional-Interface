name: Validate SER-001 CP-001 foundation

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/**
      - .github/workflows/ser-001-cp001-foundation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-cp001-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-series-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/cp001-open-discovery

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Run SER-CP-001 executable discovery audit
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-001
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp001-open-discovery
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/ser-cp-001.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-001.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-001.test.mjs") \
            | tee "$EVIDENCE/audit.json"

      - name: Generate exact English review pack
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-001
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp001-open-discovery
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/export-review.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/export-review.mjs"
          (cd artifacts/api-server && node "$OUT/export-review.mjs") \
            > "$EVIDENCE/ser-cp-001-en-IN-review.md"
          cat > "$EVIDENCE/README.txt" <<'EOF'
          SER-001 / SER-CP-001 open executable discovery

          Permanent QLs: 0
          Temporary templates: 4
          Candidate solve authorities: 1
          Audit volume: 480 deterministic English questions
          Review pack: 32 exact English questions

          This evidence does not activate Question Studio, Question Bank,
          test eligibility or public publication.
          EOF

      - name: Upload SER-CP-001 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-cp001-open-discovery
          path: artifacts/api-server/dist/reasoning-v1/ser-001/cp001-open-discovery
          if-no-files-found: error
          retention-days: 30
