name: Validate DSF-CP-007 Production Readiness Freeze

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/**
      - artifacts/api-server/src/routes/admin-question-studio-data-sufficiency.ts
      - artifacts/api-server/src/routes/admin-question-lifecycle-hardening.ts
      - artifacts/api-server/src/routes/admin-tests.ts
      - artifacts/api-server/src/routes/student-test-series.ts
      - artifacts/api-server/src/lib/admin-test-series.ts
      - .github/workflows/dsf-cp007-production-readiness-freeze.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsf-cp007-production-readiness-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dsf-cp007-production-readiness-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Build admin app
        run: pnpm --dir artifacts/admin-app build
      - name: Bundle DSF CP007 proofs
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/dsf
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-007/production-readiness-freeze-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp007-production-readiness-freeze.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-007/student-delivery-contract-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp007-student-delivery-contract.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-006/mock-test-release-v1.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/reasoning-v1/dsf/dsf-cp006-regression.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-003/exam-answer-profiles-approval-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp003-approval-regression.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-001/cp001-freeze-authority.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp001-freeze-regression.test.mjs
      - name: Run CP007 production readiness freeze proof
        run: cd artifacts/api-server && node dist/reasoning-v1/dsf/dsf-cp007-production-readiness-freeze.test.mjs
      - name: Run CP007 student delivery contract proof
        run: cd artifacts/api-server && node dist/reasoning-v1/dsf/dsf-cp007-student-delivery-contract.test.mjs
      - name: Re-prove CP006 mock eligibility
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
        run: cd artifacts/api-server && node dist/reasoning-v1/dsf/dsf-cp006-regression.test.mjs
      - name: Re-prove CP003 reviewed answer profiles
        run: cd artifacts/api-server && node dist/reasoning-v1/dsf/dsf-cp003-approval-regression.test.mjs
      - name: Re-prove CP001 frozen semantics
        run: cd artifacts/api-server && node dist/reasoning-v1/dsf/dsf-cp001-freeze-regression.test.mjs
