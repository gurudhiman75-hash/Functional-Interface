name: Validate MEN-CP-011 conical shell ownership audit

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/conical-ownership*.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-011/MEN-CP-011-CONICAL-SHELL-OWNERSHIP-AUDIT.md
      - .github/workflows/men-002-cp011-conical-ownership.yml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-002-cp011-conical-ownership-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-conical-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove conical ownership matrix
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/conical-ownership.test.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/men-cp011-conical-ownership.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp011-conical-ownership.test.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/men-cp011-conical-ownership.test.log

      - name: Export conical ownership evidence
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/conical-ownership-review-export.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/men-cp011-conical-ownership-review-export.mjs
          cd artifacts/api-server
          node dist/quant-v4/men-cp011-conical-ownership-review-export.mjs \
            2>&1 | tee dist/quant-v4/men-cp011-conical-ownership-audit.log

      - name: Build production API bundle
        shell: bash
        run: bash build-api.sh

      - name: Upload conical ownership evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-cp011-conical-shell-ownership-audit
          path: |
            artifacts/api-server/dist/quant-v4/men-cp011-conical-ownership.test.log
            artifacts/api-server/dist/quant-v4/men-cp011-conical-ownership-audit.log
            artifacts/api-server/dist/quant-v4/men-cp011-conical-ownership-audit.json
            artifacts/api-server/dist/quant-v4/men-cp011-conical-ownership-audit.md
          if-no-files-found: error
          retention-days: 14
