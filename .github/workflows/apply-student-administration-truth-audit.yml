name: Apply Student Administration truth audit

on:
  push:
    branches:
      - feat/canonical-student-administration
    paths:
      - scripts/apply-student-administration-truth-audit.mjs
      - .github/workflows/apply-student-administration-truth-audit.yml

permissions:
  contents: write

concurrency:
  group: apply-student-administration-truth-audit
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/canonical-student-administration
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply asserted truth-audit edits
        run: node scripts/apply-student-administration-truth-audit.mjs

      - name: Verify truth classification
        run: |
          grep -F '| `/users/students` | LIVE |' docs/frontend-truth-audit.md
          grep -F '| `/users/students/:id` | LIVE |' docs/frontend-truth-audit.md
          grep -F 'Student Administration reuses `identity.users`' docs/frontend-truth-audit.md
          ! sed -n '/### In-progress admin workspaces/,/### Planned admin workspaces/p' docs/frontend-truth-audit.md | grep -Fx -- '- Students'
          grep -F 'read-only canonical Student Administration directory/profile foundation' docs/frontend-truth-audit.md

      - name: Remove temporary synchronization machinery
        run: git rm scripts/apply-student-administration-truth-audit.mjs .github/workflows/apply-student-administration-truth-audit.yml

      - name: Commit synchronized truth audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/frontend-truth-audit.md
          git commit -m "docs(students): synchronize frontend truth audit"
          git push origin HEAD:feat/canonical-student-administration
