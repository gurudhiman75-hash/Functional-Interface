name: Reasoning DIR-001 Hindi

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/**
  push:
    branches: [New-main]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dir-001-hindi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hindi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Prove Hindi chapter corpus
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/dir-001-hindi.test.ts
