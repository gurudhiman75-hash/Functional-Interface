name: Validate DIR-001 Hindi localization

on:
  pull_request:
    branches:
      - feat/reasoning-dir-001-design
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/**
      - .github/workflows/dir-001-hindi.yml
  push:
    branches:
      - feat/dir-001-hindi-localization
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/**
      - .github/workflows/dir-001-hindi.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-dir-001-hindi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dir-001-hindi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck DIR-001 Hindi localization
        run: |
          set +e
          cd artifacts/api-server
          pnpm exec tsc --noEmit --target es2022 --module esnext --moduleResolution bundler --allowSyntheticDefaultImports --strictNullChecks --noImplicitAny --noImplicitReturns --noFallthroughCasesInSwitch --skipLibCheck --types node $(find src/reasoning-v1/topics/Direction-Sense/DIR-001 -name '*.ts' -print) > ../../dir-001-hindi-typecheck.log 2>&1
          status="$?"
          cd ../..
          echo "$status" > dir-001-hindi-typecheck-exit.txt
          cat dir-001-hindi-typecheck.log
          exit 0
      - name: Publish Hindi typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dir-001-hindi-typecheck-diagnostics
          path: |
            dir-001-hindi-typecheck.log
            dir-001-hindi-typecheck-exit.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Hindi typecheck result
        run: test "$(cat dir-001-hindi-typecheck-exit.txt)" = "0"
      - name: Bundle Hindi proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Direction-Sense/DIR-001/dir-001-hindi.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/dir-001-hindi.test.mjs
      - name: Run Hindi proof
        run: |
          set +e
          node artifacts/api-server/dist/reasoning-v1/dir-001-hindi.test.mjs > dir-001-hindi-proof.log 2>&1
          echo "$?" > dir-001-hindi-proof-exit.txt
          cat dir-001-hindi-proof.log
          exit 0
      - name: Publish Hindi proof diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dir-001-hindi-proof-diagnostics
          path: |
            dir-001-hindi-proof.log
            dir-001-hindi-proof-exit.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Hindi proof result
        run: test "$(cat dir-001-hindi-proof-exit.txt)" = "0"
      - name: Bundle Hindi review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Direction-Sense/DIR-001/dir-001-hindi-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/dir-001-hindi-export.mjs
      - name: Generate Hindi review files
        working-directory: artifacts/api-server
        run: node dist/reasoning-v1/dir-001-hindi-export.mjs
      - name: Publish Hindi review files
        uses: actions/upload-artifact@v4
        with:
          name: dir-001-hindi-question-review
          path: artifacts/api-server/dist/reasoning-v1/dir-001-hindi-review/
          if-no-files-found: error
          retention-days: 21
