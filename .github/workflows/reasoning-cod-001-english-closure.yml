name: Reasoning COD-001 English Closure
on:
  pull_request:
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/**
      - .github/workflows/reasoning-cod-001-english-closure.yml
  workflow_dispatch:
jobs:
  cod-english-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run whole-chapter English closure audit
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/review/cod-001-english-closure.test.ts
