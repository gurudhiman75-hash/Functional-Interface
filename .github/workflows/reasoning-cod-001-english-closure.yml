name: Reasoning COD-001 English Closure
on:
  pull_request:
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/**
      - .github/workflows/reasoning-cod-001-english-closure.yml
  workflow_dispatch:
jobs:
  cod-english-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run whole-chapter English closure audit
        id: closure
        shell: bash
        run: |
          set +e
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/review/cod-001-english-closure.test.ts > cod-001-english-closure.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload closure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod-001-english-closure
          path: cod-001-english-closure.log
          retention-days: 14
      - name: Enforce closure result
        run: |
          cat cod-001-english-closure.log
          test "${{ steps.closure.outputs.exit_code }}" = "0"
