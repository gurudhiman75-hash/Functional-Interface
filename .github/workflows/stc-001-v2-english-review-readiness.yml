name: Validate STC-001 V2 English Review Readiness

on:
  pull_request:
    branches:
      - New-main
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/editorial-v2-*'
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/question-studio-review-v2.ts'
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/question-studio-v2-integration.test.ts'
      - 'artifacts/api-server/src/reasoning-v1/question-studio-review-registry.ts'
      - '.github/workflows/stc-001-v2-editorial.yml'
      - '.github/workflows/stc-001-v2-english-review-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stc-001-v2-english-review-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  english-review-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Preserve immutable V1 audit baseline
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/chapter-freeze-v1-proof.test.ts

      - name: Re-prove V2 surface diversity
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/editorial-v2-diversity-proof.test.ts

      - name: Re-prove V2 Question Studio review routing
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/question-studio-v2-integration.test.ts

      - name: Prove learner-facing English review readiness
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/editorial-v2-review-readiness-proof.test.ts

      - name: Export exact 48-question English human-review pack
        env:
          STC_V2_REVIEW_OUT: stc-001-v2-english-review-pack
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/editorial-v2-review-pack.ts

      - name: Upload English review artifact
        uses: actions/upload-artifact@v4
        with:
          name: stc-001-v2-english-review-pack
          path: stc-001-v2-english-review-pack
          if-no-files-found: error
          retention-days: 30

      - name: Build production API server
        run: pnpm --dir artifacts/api-server build

      - name: Assert lifecycle boundary
        run: |
          echo 'STC-001 V2 status: READY_FOR_EXPLICIT_ENGLISH_EDITORIAL_REVIEW'
          echo 'English frozen: false'
          echo 'Hindi/Punjabi localization: pending'
          echo 'V2 Banking five-way: pending'
          echo 'Question Bank/test/mock/public/automatic publication: locked'
