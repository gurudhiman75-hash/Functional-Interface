name: Validate STC-001 V2.1 Trilingual Review Readiness

on:
  pull_request:
    branches:
      - New-main
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/editorial-v2-*'
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/question-studio-review-v2.ts'
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/question-studio-v2-integration.test.ts'
      - '.github/workflows/stc-001-v2-editorial.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stc-001-v2-1-trilingual-review-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trilingual-review-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Preserve immutable V1 audit baseline
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/chapter-freeze-v1-proof.test.ts

      - name: Re-prove V2.1 English surface diversity
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/editorial-v2-diversity-proof.test.ts

      - name: Prove canonical English learner-surface quality
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/editorial-v2-review-readiness-proof.test.ts

      - name: Prove EN-HI-PA semantic parity across 144 canonical four-way surfaces
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/editorial-v2-localization-proof.test.ts

      - name: Prove anti-gaming scheduler and explicit saturation block
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/editorial-v2-1-saturation-boundary-proof.test.ts

      - name: Re-prove archived either-or solver authorities remain logically valid
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/editorial-v2-five-way-proof.test.ts

      - name: Re-prove shared V2.1 Question Studio routing and V1 compatibility
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/question-studio-v2-integration.test.ts --bundle --platform=node --format=esm --outfile=dist/stc-001/question-studio-v2-1-integration.test.mjs
          node artifacts/api-server/dist/stc-001/question-studio-v2-1-integration.test.mjs

      - name: Export exact 144-surface active trilingual human-review pack
        env:
          STC_V2_REVIEW_OUT: stc-001-v2-1-trilingual-review-pack
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Conclusion/STC-001/editorial-v2-trilingual-review-pack.ts

      - name: Upload V2.1 trilingual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: stc-001-v2-1-trilingual-review-pack
          path: stc-001-v2-1-trilingual-review-pack
          if-no-files-found: error
          retention-days: 30

      - name: Build production API server
        run: pnpm --dir artifacts/api-server build

      - name: Build production admin app
        run: pnpm --dir artifacts/admin-app build

      - name: Assert lifecycle boundary
        run: |
          echo 'STC-001 V2.1 status: TRILINGUAL_EDITORIAL_REVIEW_READY_BUT_SATURATION_BLOCKED'
          echo 'English/Hindi/Punjabi: canonical scenario-ID and answer parity locked for review'
          echo 'Runtime anti-gaming: 16-slot non-periodic authority/order scheduler'
          echo 'Generation-ready: false; current curated ceiling 16 presentations/QL vs required >=1000 distinct questions/QL'
          echo 'Banking five-way either/or: inactive in non-syllogistic STC; solver pool retained for audit only'
          echo 'V1: preserved frozen audit baseline'
          echo 'Question Bank/test/mock/public/automatic publication: locked'
