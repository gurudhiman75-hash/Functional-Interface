name: Validate IOP-001 English permanent authorities

on:
  push:
    branches:
      - feat/iop-001-foundation-cp001-cp004
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/**
      - .github/workflows/iop-001-foundation.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/**
      - .github/workflows/iop-001-foundation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-iop-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chapter-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowImportingTsExtensions \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/InputOutput/IOP-001 -name '*.ts' -print)

      - name: Re-run CP001-CP004 foundation proof
        env:
          IOP_FOUNDATION_CASES: 80
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/foundation-proof.test.ts

      - name: Run CP005-CP010 advanced proof
        env:
          IOP_ADVANCED_CASES: 40
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/advanced-proof.test.ts

      - name: Run source-backed CP008 mixed transformation proof
        env:
          IOP_MIXED_SOURCE_CASES: 160
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/mixed-source-gap-proof.test.ts

      - name: Prove source-normalized permanent QL allocation
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/permanent-authorities.test.ts

      - name: Prove all eight frozen English permanent authorities
        env:
          IOP_ENGLISH_CASES_PER_QL: 12
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/english-production.test.ts

      - name: Audit English review balance and visible box arithmetic
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/english-review-audit.test.ts

      - name: Audit rich object pools and explanation substance
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/english-review-quality.test.ts

      - name: Prove content-addressed human English freeze
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/english-freeze-authority.test.ts

      - name: Generate frozen English review pack
        env:
          IOP_ENGLISH_REVIEW_OUTPUT_DIR: /tmp/iop-english-permanent-review
          IOP_ENGLISH_REVIEW_EXAMPLES_PER_MODE: 2
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/english-frozen-review-export.ts

      - name: Generate CP001-CP004 discovery review pack
        env:
          IOP_FOUNDATION_REVIEW_OUTPUT_DIR: /tmp/iop-foundation-review
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/review-export.ts

      - name: Generate CP005-CP010 discovery review pack
        env:
          IOP_ADVANCED_REVIEW_OUTPUT_DIR: /tmp/iop-advanced-review
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/advanced-review-export.ts

      - name: Build production API
        working-directory: artifacts/api-server
        run: pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: iop-001-english-permanent-review
          path: /tmp/iop-english-permanent-review/**
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: iop-cp001-cp004-foundation-review
          path: /tmp/iop-foundation-review/**
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: iop-cp005-cp010-advanced-review
          path: /tmp/iop-advanced-review/**
          if-no-files-found: error
          retention-days: 14
