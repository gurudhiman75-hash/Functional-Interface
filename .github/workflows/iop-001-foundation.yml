name: Validate IOP-001 CP001-CP010 discovery + source gap

on:
  push:
    branches:
      - feat/iop-001-foundation-cp001-cp004
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/**
      - .github/workflows/iop-001-foundation.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/**
      - .github/workflows/iop-001-foundation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-iop-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowImportingTsExtensions \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/InputOutput/IOP-001 -name '*.ts' -print)

  foundation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-run CP001-CP004 foundation proof
        env:
          IOP_FOUNDATION_CASES: 80
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/foundation-proof.test.ts

  advanced-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run CP005-CP010 advanced proof
        env:
          IOP_ADVANCED_CASES: 40
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/advanced-proof.test.ts

  mixed-source-gap-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run source-backed CP008 mixed transformation gap proof
        env:
          IOP_MIXED_SOURCE_CASES: 160
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/mixed-source-gap-proof.test.ts

  foundation-review-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate CP001-CP004 English review pack
        env:
          IOP_FOUNDATION_REVIEW_OUTPUT_DIR: /tmp/iop-foundation-review
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/review-export.ts
      - uses: actions/upload-artifact@v4
        with:
          name: iop-cp001-cp004-foundation-review
          path: /tmp/iop-foundation-review/**
          if-no-files-found: error
          retention-days: 14

  advanced-review-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate CP005-CP010 English review pack
        env:
          IOP_ADVANCED_REVIEW_OUTPUT_DIR: /tmp/iop-advanced-review
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/advanced-review-export.ts
      - uses: actions/upload-artifact@v4
        with:
          name: iop-cp005-cp010-advanced-review
          path: /tmp/iop-advanced-review/**
          if-no-files-found: error
          retention-days: 14

  api-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build production API
        working-directory: artifacts/api-server
        run: pnpm run build
