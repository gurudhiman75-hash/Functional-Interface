name: Validate DSF-CP-032 Question Studio QL002

on:
  pull_request:
    branches:
      - audit/dsf-001-cp031-ql002-localization-review
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dsf-cp032:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle CP032 integration test
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-032/question-studio-ql002-integration-v1.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/dsf-cp032-question-studio.test.mjs
      - name: Validate CP032 integration
        run: node artifacts/api-server/dist/reasoning-v1/dsf-cp032-question-studio.test.mjs
