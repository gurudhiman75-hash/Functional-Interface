name: Validate DSF-CP-034 Final Deep Audit Closure

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dsf-cp034:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle CP034 final closure audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-034/final-deep-audit-closure-v1.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/dsf-cp034-final-closure.test.mjs
      - name: Run CP034 final closure audit
        run: node artifacts/api-server/dist/reasoning-v1/dsf-cp034-final-closure.test.mjs
      - name: Build production API
        run: pnpm --dir artifacts/api-server build
