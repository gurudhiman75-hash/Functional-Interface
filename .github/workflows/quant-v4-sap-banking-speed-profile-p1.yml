name: Quant V4 SAP Banking Speed Profile P1

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/banking-speed-profile.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-BANKING-SPEED-PROFILE.test.ts"
  push:
    branches:
      - "feat/sap-banking-speed-profile-p1"
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/banking-speed-profile.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-BANKING-SPEED-PROFILE.test.ts"
      - ".github/workflows/quant-v4-sap-banking-speed-profile-p1.yml"

concurrency:
  group: quant-v4-sap-banking-speed-p1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  banking-speed-profile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/api-server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: SAP Banking Speed Profile deterministic proof
        run: npx --yes tsx src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-BANKING-SPEED-PROFILE.test.ts
      - name: Existing SAP Question Studio chapter acceptance
        run: npx --yes tsx src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-QUESTION-STUDIO-CHAPTER-ACCEPTANCE.test.ts
      - name: Quant V4 central exam-profile conformance
        run: npx --yes tsx src/quant-v4/quality/quant-v4-exam-profile-conformance.test.ts
      - name: Patch hygiene
        run: git -C ../.. diff --check origin/New-main...HEAD
