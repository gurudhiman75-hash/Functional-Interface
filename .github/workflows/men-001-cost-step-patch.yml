name: MEN-001 Cost Step Patch

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-001-cost-step-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Add teacher wording for combined cost or rate step
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-comprehension-humanizer.ts")
          text = path.read_text()
          old = '''    case "Calculate the Cost":
              return "First confirm the correct area or boundary length, then multiply it by the stated rate. Keep the currency already used in the question.";
            case "Calculate the Rate":
              return "Divide the total cost by the matching area or boundary length. The unit tells you whether the rate is per metre or per square metre.";'''
          new = '''    case "Calculate the Cost":
              return "First confirm the correct area or boundary length, then multiply it by the stated rate. Keep the currency already used in the question.";
            case "Calculate the Rate":
              return "Divide the total cost by the matching area or boundary length. The unit tells you whether the rate is per metre or per square metre.";
            case "Calculate the Cost or Rate":
              return /Rate/.test(mode)
                ? "First find the complete area or boundary length, then divide the stated total cost by that measure to obtain the rate per matching unit."
                : "First find the complete area or boundary length, then multiply it by the stated rate to obtain the total cost in the currency used by the question.";'''
          if old not in text:
              raise SystemExit("Expected cost/rate step block not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-comprehension-humanizer.ts
          git commit -m "fix(mensuration): explain combined cost-rate steps"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
