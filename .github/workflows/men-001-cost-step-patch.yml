name: MEN-001 Cost Step Patch

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-001-cost-step-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Add teacher wording for combined cost or rate step
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-comprehension-humanizer.ts")
          lines = path.read_text().splitlines()
          if any('case "Calculate the Cost or Rate"' in line for line in lines):
              raise SystemExit("Combined cost/rate wording already exists")

          marker = 'return "Divide the total cost by the matching area or boundary length. The unit tells you whether the rate is per metre or per square metre.";'
          for index, line in enumerate(lines):
              if marker not in line:
                  continue
              indent = line[: len(line) - len(line.lstrip())]
              case_indent = indent[:-2]
              addition = [
                  f'{case_indent}case "Calculate the Cost or Rate":',
                  f'{indent}return /Rate/.test(mode)',
                  f'{indent}  ? "First find the complete area or boundary length, then divide the stated total cost by that measure to obtain the rate per matching unit."',
                  f'{indent}  : "First find the complete area or boundary length, then multiply it by the stated rate to obtain the total cost in the currency used by the question.";',
              ]
              lines[index + 1:index + 1] = addition
              path.write_text("\n".join(lines) + "\n")
              break
          else:
              raise SystemExit("Rate explanation marker not found")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-comprehension-humanizer.ts
          git commit -m "fix(mensuration): explain combined cost-rate steps"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
