name: Validate BTD-001 CP008 HI PA Freeze Readiness V1

on:
  push:
    branches:
      - feature/btd-cp008-hi-pa-freeze-readiness-v1
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-008/**'
      - '.github/workflows/btd-cp008-hi-pa-freeze-readiness-v1.yml'
  pull_request:
    branches:
      - feature/btd-cp007-hi-pa-localization-v1
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-008/**'
      - '.github/workflows/btd-cp008-hi-pa-freeze-readiness-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btd-cp008-hi-pa-freeze-readiness-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-btd-cp008-hi-pa-freeze-readiness-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-prove CP007 localization review authority
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-007/btd-cp007-hi-pa-localization-v7-audit.ts | tee btd-cp008-upstream-cp007.log
          grep -q 'PASS_BTD_001_CP007_HI_PA_LOCALIZATION_AUDIT_V6' btd-cp008-upstream-cp007.log
          grep -q 'PASS_BTD_001_CP007_HI_PA_LOCALIZATION_AUDIT_V7' btd-cp008-upstream-cp007.log

      - name: Enforce multilingual freeze-readiness manifest
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-008/btd-cp008-hi-pa-freeze-readiness-v1-audit.ts | tee btd-cp008-hi-pa-freeze-readiness-v1.log
          grep -q 'PASS_BTD_001_CP008_HI_PA_FREEZE_READINESS_AUDIT_V1' btd-cp008-hi-pa-freeze-readiness-v1.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Record exact validation head
        shell: bash
        run: |
          echo "validated_head=$(git rev-parse HEAD)" | tee btd-cp008-hi-pa-freeze-readiness-v1-head.log
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: btd-cp008-hi-pa-freeze-readiness-v1
          path: |
            btd-cp008-upstream-cp007.log
            btd-cp008-hi-pa-freeze-readiness-v1.log
            btd-cp008-hi-pa-freeze-readiness-v1-head.log
          retention-days: 30
