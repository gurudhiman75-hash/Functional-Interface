name: Validate Indian Geography Rivers V1

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/indian-geography/rivers-drainage/**"
      - ".github/workflows/indian-geography-rivers-v1.yml"
  workflow_dispatch:

concurrency:
  group: indian-geography-rivers-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-rivers-content-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle GEO-RIV-001 CP001 validation gates
        run: |
          mkdir -p artifacts/api-server/dist/geography-tests
          tests=(
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp001-validator.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp001-review-generator.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp001-review-batch.test.ts"
          )
          for test_file in "${tests[@]}"; do
            output_name="$(basename "${test_file}" .ts).mjs"
            pnpm --dir artifacts/api-server exec esbuild \
              "${test_file}" \
              --bundle --packages=external --platform=node --format=esm \
              --outfile="dist/geography-tests/${output_name}"
          done

      - name: Run GEO-RIV-001 CP001 validation gates
        run: |
          for test_file in artifacts/api-server/dist/geography-tests/*.mjs; do
            node "${test_file}"
          done

      - name: Materialize GEO-RIV-001 CP001 review batch
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp001-export-review.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/geography-tests/geo-riv-001-cp001-export-review.mjs
          cd artifacts/api-server
          node dist/geography-tests/geo-riv-001-cp001-export-review.mjs

      - name: Upload GEO-RIV-001 CP001 review artifact
        uses: actions/upload-artifact@v4
        with:
          name: GEO-RIV-001-CP001-REVIEW-BATCH-V1
          path: artifacts/api-server/dist/geography-review/GEO-RIV-001-CP001/
          if-no-files-found: error
          retention-days: 30

      - name: Build API server
        run: pnpm --dir artifacts/api-server build
