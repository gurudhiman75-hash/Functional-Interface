name: Export ANA-CP-008 localized review files

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/export-provisional-localized-review.ts
      - artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/provisional-language-templates.localized.ts
      - .github/workflows/ana-cp-008-localized-review-export.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-ana-cp-008-localized-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Generate Hindi Punjabi and JSON review files
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/export-provisional-localized-review.ts
      - name: Verify generated files
        run: |
          test -s ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/review-artifacts/ana-cp-008-provisional-hindi-review.md
          test -s ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/review-artifacts/ana-cp-008-provisional-punjabi-review.md
          test -s ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/review-artifacts/ana-cp-008-provisional-localized-review.json
      - name: Upload localized review files
        uses: actions/upload-artifact@v4
        with:
          name: ana-cp-008-provisional-localized-review
          path: artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/review-artifacts/
          if-no-files-found: error
          retention-days: 14
