name: Export Punjabi Retrofit CP005 Review

on:
  push:
    branches:
      - "feature/punjabi-retrofit-cp005-exhaustive-v1"
    paths:
      - "artifacts/api-server/src/punjabi-v1/**"
      - ".github/workflows/punjabi-forward-port-cp005-review.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/punjabi-v1/**"
      - ".github/workflows/punjabi-forward-port-cp005-review.yml"
  workflow_dispatch:

jobs:
  review-cp005-retrofit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bundle CP005 retrofit review exporter
        working-directory: artifacts/api-server
        run: pnpm exec esbuild src/punjabi-v1/packages/PUN-001/checkpoints/CP005/export-review.ts --bundle --platform=node --format=esm --outfile=dist/punjabi-retrofit-cp005-review.mjs
      - name: Generate CP005 retrofit review pack
        working-directory: artifacts/api-server
        run: node dist/punjabi-retrofit-cp005-review.mjs
      - name: Upload CP005 retrofit review pack
        uses: actions/upload-artifact@v4
        with:
          name: PUN-001-CP005-RETROFIT-REVIEW-120
          path: artifacts/api-server/PUN-001-CP005-RETROFIT-REVIEW.md
          if-no-files-found: error
