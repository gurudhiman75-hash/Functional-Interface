name: Validate INT-CP-004 Hindi Punjabi localisation

on:
  pull_request:
    branches:
      - freeze/int-cp004-approved-english-v1
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp004-localization-*.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp004-localized-*.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp004-localiz*.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/INT-CP-004/INT-CP-004-HI-PA-LOCALISATION-PLAN.md"
      - ".github/workflows/int-cp004-hi-pa-localisation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-int-cp004-hi-pa-localisation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle inherited CP-004 approved English freeze audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp004-english-freeze-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp004-english-freeze-audit.mjs

      - name: Run inherited CP-004 approved English freeze audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp004-english-freeze-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp004-english-freeze-audit.log

      - name: Bundle localisation foundation audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp004-localization-foundation-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp004-localization-foundation-audit.mjs

      - name: Run localisation foundation audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp004-localization-foundation-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp004-localization-foundation-audit.log

      - name: Bundle localised presentation Wave 1 audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp004-localized-presentation-wave1-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp004-localized-presentation-wave1-audit.mjs

      - name: Run localised presentation Wave 1 audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp004-localized-presentation-wave1-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp004-localized-presentation-wave1-audit.log

      - name: Bundle localised presentation Wave 2 audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp004-localized-presentation-wave2-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp004-localized-presentation-wave2-audit.mjs

      - name: Run localised presentation Wave 2 audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp004-localized-presentation-wave2-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp004-localized-presentation-wave2-audit.log

      - name: Bundle localised presentation Wave 3 audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp004-localized-presentation-wave3-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp004-localized-presentation-wave3-audit.mjs

      - name: Run localised presentation Wave 3 audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp004-localized-presentation-wave3-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp004-localized-presentation-wave3-audit.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Verify localisation evidence
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          grep -q 'PASS_INT_CP004_APPROVED_ENGLISH_FREEZE' artifacts/api-server/dist/quant-v4/int-001-cp004-english-freeze-audit.log
          grep -q 'PASS_INT_CP004_LOCALIZATION_FOUNDATION' artifacts/api-server/dist/quant-v4/int-001-cp004-localization-foundation-audit.log
          grep -q 'PASS_INT_CP004_LOCALIZED_PRESENTATION_WAVE1' artifacts/api-server/dist/quant-v4/int-001-cp004-localized-presentation-wave1-audit.log
          grep -q 'PASS_INT_CP004_LOCALIZED_PRESENTATION_WAVE2' artifacts/api-server/dist/quant-v4/int-001-cp004-localized-presentation-wave2-audit.log
          grep -q 'PASS_INT_CP004_LOCALIZED_PRESENTATION_WAVE3' artifacts/api-server/dist/quant-v4/int-001-cp004-localized-presentation-wave3-audit.log
          test -f artifacts/api-server/dist/quant-v4/int-cp004-localization-foundation/int-cp004-localization-foundation-summary.json
          test -f artifacts/api-server/dist/quant-v4/int-cp004-localized-presentation-wave1/int-cp004-localized-presentation-wave1-summary.json
          test -f artifacts/api-server/dist/quant-v4/int-cp004-localized-presentation-wave2/int-cp004-localized-presentation-wave2-summary.json
          test -f artifacts/api-server/dist/quant-v4/int-cp004-localized-presentation-wave3/int-cp004-localized-presentation-wave3-summary.json
          grep -q '"qlCount": 19' artifacts/api-server/dist/quant-v4/int-cp004-localization-foundation/int-cp004-localization-foundation-summary.json
          grep -q '"cases": 1200' artifacts/api-server/dist/quant-v4/int-cp004-localized-presentation-wave1/int-cp004-localized-presentation-wave1-summary.json
          grep -q '"cases": 1200' artifacts/api-server/dist/quant-v4/int-cp004-localized-presentation-wave2/int-cp004-localized-presentation-wave2-summary.json
          grep -q '"cases": 1400' artifacts/api-server/dist/quant-v4/int-cp004-localized-presentation-wave3/int-cp004-localized-presentation-wave3-summary.json
          grep -q '"publiclyPublishable": false' artifacts/api-server/dist/quant-v4/int-cp004-localized-presentation-wave3/int-cp004-localized-presentation-wave3-summary.json

      - name: Upload CP-004 localisation evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-cp004-hi-pa-localisation-all-presentations
          path: |
            artifacts/api-server/dist/quant-v4/int-001-cp004-english-freeze-audit.log
            artifacts/api-server/dist/quant-v4/int-001-cp004-localization-foundation-audit.log
            artifacts/api-server/dist/quant-v4/int-001-cp004-localized-presentation-wave1-audit.log
            artifacts/api-server/dist/quant-v4/int-001-cp004-localized-presentation-wave2-audit.log
            artifacts/api-server/dist/quant-v4/int-001-cp004-localized-presentation-wave3-audit.log
            artifacts/api-server/dist/quant-v4/int-cp004-localization-foundation/**
            artifacts/api-server/dist/quant-v4/int-cp004-localized-presentation-wave1/**
            artifacts/api-server/dist/quant-v4/int-cp004-localized-presentation-wave2/**
            artifacts/api-server/dist/quant-v4/int-cp004-localized-presentation-wave3/**
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/INT-CP-004/INT-CP-004-HI-PA-LOCALISATION-PLAN.md
          if-no-files-found: error
          retention-days: 30
