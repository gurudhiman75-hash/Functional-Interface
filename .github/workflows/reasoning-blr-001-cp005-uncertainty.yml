name: Reasoning BLR-001 CP-005 Determinacy and Uncertainty

on:
  push:
    branches:
      - feat/blr-001-cp005-uncertainty-runtime
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-005/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-004/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/foundation/**"
      - "artifacts/examtree/src/components/blood-relations/**"
      - "artifacts/examtree/src/components/learning/LogicPlaybackRouter.tsx"
      - "artifacts/examtree/src/pages/canonical-result.tsx"
      - "artifacts/examtree/scripts/verify-family-tree-chunk.mjs"
      - ".github/workflows/reasoning-blr-001-cp005-uncertainty.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-005/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-004/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/foundation/**"
      - "artifacts/examtree/src/components/blood-relations/**"
      - "artifacts/examtree/src/components/learning/LogicPlaybackRouter.tsx"
      - "artifacts/examtree/src/pages/canonical-result.tsx"
      - "artifacts/examtree/scripts/verify-family-tree-chunk.mjs"
      - ".github/workflows/reasoning-blr-001-cp005-uncertainty.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blr-001-cp005-uncertainty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp005-uncertainty:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove CP-004 frozen source bank
        run: |
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-004/cp004-final-freeze.test.ts | tee cp004-source-freeze.log

      - name: Prove CP-005 permanent runtime and independent verifier
        run: |
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-005/cp005-runtime.test.ts | tee cp005-runtime.log

      - name: Prove CP-005 exam-grade editorial remediation
        run: |
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-005/cp005-editorial-remediation.test.ts | tee cp005-editorial-remediation.log

      - name: Prove CP-005 final source and authority freeze
        run: |
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-005/cp005-final-freeze.test.ts | tee cp005-final-freeze.log

      - name: Export CP-005 final freeze review pack
        run: |
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-005/export-cp005-final-freeze.ts cp005-final-freeze-output | tee cp005-export.log

      - name: Verify CP-005 artifact contracts
        shell: bash
        run: |
          set -euo pipefail
          OUT=cp005-final-freeze-output
          test -f "$OUT/blr-cp005-final-freeze-summary.json"
          test -f "$OUT/blr-cp005-permanent-contracts.json"
          test -f "$OUT/blr-cp005-final-freeze-records.jsonl"
          test -f "$OUT/blr-cp005-final-freeze-records.csv"
          test -f "$OUT/blr-cp005-final-freeze-review.html"
          test -f "$OUT/BLR-CP-005-FINAL-DISCOVERY-FREEZE.md"
          grep -q '"recordCount": 184' "$OUT/blr-cp005-final-freeze-summary.json"
          grep -q '"groupCount": 80' "$OUT/blr-cp005-final-freeze-summary.json"
          grep -q '"prototypeCount": 23' "$OUT/blr-cp005-final-freeze-summary.json"
          grep -q '"permanentQlCount": 8' "$OUT/blr-cp005-final-freeze-summary.json"
          grep -q '"totalEnumeratedModels": 432' "$OUT/blr-cp005-final-freeze-summary.json"
          grep -q '"permanentQlRange": "BLR-QL-018..BLR-QL-025"' "$OUT/blr-cp005-final-freeze-summary.json"
          grep -q '"nextAvailableChapterQlId": "BLR-QL-026"' "$OUT/blr-cp005-final-freeze-summary.json"
          test "$(wc -l < "$OUT/blr-cp005-final-freeze-records.jsonl")" -eq 184
          grep -q '@media(max-width:640px)' "$OUT/blr-cp005-final-freeze-review.html"
          grep -q '432 valid family models rendered' "$OUT/blr-cp005-final-freeze-review.html"
          grep -q '\[CORRECT_COMPLETE_MODEL_MATCH\]' "$OUT/blr-cp005-final-freeze-records.jsonl"
          if grep -Eiq 'gender of .* is not stated|whose gender is not stated|nothing states whether|no other family relation is given|available clues do not identify|available information does not identify|no clue distinguishes|exact number of additional children is not stated' "$OUT/blr-cp005-final-freeze-records.jsonl"; then
            echo "Forbidden learner-facing meta phrase found in CP-005 export."
            exit 1
          fi

      - name: Install locked workspace dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Typecheck ExamTree integration
        run: corepack pnpm --filter @workspace/examtree typecheck | tee examtree-typecheck.log

      - name: Build ExamTree integration
        run: corepack pnpm --filter @workspace/examtree build | tee examtree-build.log

      - name: Verify lazy family-tree chunk
        run: node artifacts/examtree/scripts/verify-family-tree-chunk.mjs | tee examtree-family-tree-chunk.log

      - name: Upload CP-005 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp005-uncertainty-final-freeze-logs
          path: |
            cp004-source-freeze.log
            cp005-runtime.log
            cp005-editorial-remediation.log
            cp005-final-freeze.log
            cp005-export.log
            examtree-typecheck.log
            examtree-build.log
            examtree-family-tree-chunk.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload CP-005 final freeze pack
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp005-uncertainty-final-freeze
          path: cp005-final-freeze-output
          if-no-files-found: error
          retention-days: 30
