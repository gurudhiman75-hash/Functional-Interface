name: Quant V4 DI missing P6

on:
  push:
    branches:
      - feat/quant-v4-di-missing-p6
    paths:
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-007/**"
      - ".github/workflows/quant-v4-di-missing-p6.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  di-missing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Five-option collision scan
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-007/debug-option-collapse.ts

      - name: Missing DI deterministic proof
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-007/missing-set.test.ts

      - name: Patch hygiene
        run: git diff --check
