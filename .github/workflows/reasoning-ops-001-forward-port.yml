name: Validate OPS-001 forward-port

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/**"
      - ".github/workflows/reasoning-ops-001-forward-port.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-ops-001-forward-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Strict TypeScript check for OPS-001
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/Mathematical-Operations/OPS-001 -name '*.ts' -print)

      - name: Exact foundation proof
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/foundation/ops-foundation.test.ts

      - name: Approved teaching runtime proof
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/pilot/approved-teaching-runtime.test.ts

      - name: Permanent QL registry proof
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/registry/ops-ql-registry.test.ts

      - name: Approved localization proof
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/pilot/approved-localization.test.ts

      - name: Publication-lock proof
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/integration/ops-001-publication-lock.test.ts
