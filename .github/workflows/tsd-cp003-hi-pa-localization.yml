name: Validate TSD CP-003 Hindi Punjabi Localization

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001/cp003/**
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001/index.ts
      - .github/workflows/tsd-cp003-hi-pa-localization.yml

permissions:
  contents: read

jobs:
  validate-cp003-hi-pa-localization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce sole final public native API
        run: |
          INDEX=artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001/index.ts
          grep -q 'cp003/localization/native-final-polished-candidate' "$INDEX"
          if grep -Eq 'cp003/localization/(native-runtime|native-editorial-review|native-reviewed-candidate|native-authoritative|native-final-candidate")' "$INDEX"; then
            echo "A non-final CP-003 localization entry point is publicly exported"
            exit 1
          fi

      - name: Bundle native parity editorial pedagogy and final proofs
        run: |
          ROOT=src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001
          OUT=dist/quant-v4/tsd-001/cp003-localization
          mkdir -p artifacts/api-server/$OUT
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/index.ts" --bundle --platform=node --format=esm --outfile="dist/quant-v4/tsd-001/index.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp003/localization/native-runtime-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/native-runtime-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp003/localization/native-reviewed-final-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/native-reviewed-final-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp003/localization/native-authoritative-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/native-authoritative-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp003/localization/native-pedagogy-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/native-pedagogy-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp003/localization/native-final-candidate-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/native-final-candidate-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp003/localization/native-final-polished-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/native-final-polished-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp003/localization/native-review-export.ts" --bundle --platform=node --format=esm --outfile="$OUT/native-review-export.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp003/localization/native-final-export.ts" --bundle --platform=node --format=esm --outfile="$OUT/native-final-export.mjs"

      - name: Run parity editorial pedagogy and final proofs
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/tsd-001/cp003-localization/native-runtime-proof.mjs 2>&1 | tee dist/quant-v4/tsd-001/cp003-localization/native-runtime-proof.log
          node dist/quant-v4/tsd-001/cp003-localization/native-reviewed-final-proof.mjs 2>&1 | tee dist/quant-v4/tsd-001/cp003-localization/native-reviewed-final-proof.log
          node dist/quant-v4/tsd-001/cp003-localization/native-authoritative-proof.mjs 2>&1 | tee dist/quant-v4/tsd-001/cp003-localization/native-authoritative-proof.log
          node dist/quant-v4/tsd-001/cp003-localization/native-pedagogy-proof.mjs 2>&1 | tee dist/quant-v4/tsd-001/cp003-localization/native-pedagogy-proof.log
          node dist/quant-v4/tsd-001/cp003-localization/native-final-candidate-proof.mjs 2>&1 | tee dist/quant-v4/tsd-001/cp003-localization/native-final-candidate-proof.log
          node dist/quant-v4/tsd-001/cp003-localization/native-final-polished-proof.mjs 2>&1 | tee dist/quant-v4/tsd-001/cp003-localization/native-final-polished-proof.log
          node dist/quant-v4/tsd-001/cp003-localization/native-review-export.mjs 2>&1 | tee dist/quant-v4/tsd-001/cp003-localization/native-review-export.log
          node dist/quant-v4/tsd-001/cp003-localization/native-final-export.mjs 2>&1 | tee dist/quant-v4/tsd-001/cp003-localization/native-final-export.log

      - name: Upload localization proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsd-cp003-hi-pa-localization-proof
          path: artifacts/api-server/dist/quant-v4/tsd-001/cp003-localization/*.log
          if-no-files-found: error

      - name: Upload raw Hindi Punjabi parity evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tsd-cp003-hi-pa-raw-parity-evidence
          path: |
            artifacts/api-server/dist/quant-v4/tsd-001/cp003-localization-review/tsd-cp003-hi-pa-review.json
            artifacts/api-server/dist/quant-v4/tsd-001/cp003-localization-review/tsd-cp003-hi-pa-review.jsonl
            artifacts/api-server/dist/quant-v4/tsd-001/cp003-localization-review/tsd-cp003-hi-pa-review.html
          if-no-files-found: error

      - name: Upload final Hindi Punjabi review candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tsd-cp003-hi-pa-final-review
          path: |
            artifacts/api-server/dist/quant-v4/tsd-001/cp003-native-final-review/tsd-cp003-hi-pa-final-review.json
            artifacts/api-server/dist/quant-v4/tsd-001/cp003-native-final-review/tsd-cp003-hi-pa-final-review.jsonl
            artifacts/api-server/dist/quant-v4/tsd-001/cp003-native-final-review/tsd-cp003-hi-pa-final-review.html
          if-no-files-found: error
