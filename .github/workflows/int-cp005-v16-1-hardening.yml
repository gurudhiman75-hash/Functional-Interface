name: Validate INT-CP-005 V16.1 Hardening

on:
  pull_request:
    branches: [New-main]
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp005-variable-growth-decay-runtime-v16-1*.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp005-variable-growth-decay-v16-1*.ts"
      - ".github/workflows/int-cp005-v16-1-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: int-cp005-v16-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-int-cp005-v16-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle V16.1 diversity audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp005-variable-growth-decay-v16-1-hardening-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-cp005-v16-1-hardening-audit.mjs
      - name: Run V16.1 diversity audit
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp005-v16-1-hardening-audit.mjs 2>&1 | tee dist/quant-v4/int-cp005-v16-1-hardening-audit.log
      - name: Bundle V16.1 multilingual audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp005-variable-growth-decay-v16-1-localized-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-cp005-v16-1-localized-audit.mjs
      - name: Run V16.1 multilingual audit
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp005-v16-1-localized-audit.mjs 2>&1 | tee dist/quant-v4/int-cp005-v16-1-localized-audit.log
      - name: Bundle V16.1 review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp005-variable-growth-decay-v16-1-review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-cp005-v16-1-review-export.mjs
      - name: Export V16.1 matched review
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp005-v16-1-review-export.mjs 2>&1 | tee dist/quant-v4/int-cp005-v16-1-review-export.log
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Verify V16.1 markers
        run: |
          grep -q 'PASS_INT_CP005_V16_1_DIVERSITY_HARDENING' artifacts/api-server/dist/quant-v4/int-cp005-v16-1-hardening-audit.log
          grep -q 'PASS_INT_CP005_V16_1_MULTILINGUAL_HARDENING' artifacts/api-server/dist/quant-v4/int-cp005-v16-1-localized-audit.log
          grep -q 'PASS_INT_CP005_V16_1_REVIEW_EXPORT' artifacts/api-server/dist/quant-v4/int-cp005-v16-1-review-export.log
      - name: Upload V16.1 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-cp005-v16-1-hardening
          path: |
            artifacts/api-server/dist/quant-v4/INT-CP-005-V16.1-HARDENING-REVIEW.md
            artifacts/api-server/dist/quant-v4/int-cp005-v16-1-hardening-audit.log
            artifacts/api-server/dist/quant-v4/int-cp005-v16-1-localized-audit.log
          if-no-files-found: error
