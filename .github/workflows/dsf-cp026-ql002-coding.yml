name: Validate DSF-CP-026 QL002 Coding

on:
  pull_request:
    branches:
      - New-main
      - audit/dsf-001-cp025-ql002-seating
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-015/**
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-026/**
      - artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsf-cp026-ql002-coding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dsf-cp026:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle CP026 QL002 Coding audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-026/coding-three-statement-batch-v1.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/dsf-cp026-ql002-coding.test.mjs
      - name: Run CP026 QL002 Coding audit
        run: node artifacts/api-server/dist/reasoning-v1/dsf-cp026-ql002-coding.test.mjs
