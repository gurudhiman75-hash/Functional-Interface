name: COM-004 Discovery Gap Additions V3

on:
  push:
    branches: [feature/com004-internet-web-email-discovery-v1]
    paths:
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com004-internet-web-email-discovery.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com004-discovery-gap-additions-v3.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com004-discovery-gap-additions-v3.test.ts'
      - '.github/workflows/com004-discovery-gap-additions-v3.yml'
  pull_request:
    branches: [integration/computer-content-engine-mainline-v1]
    paths:
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com004-internet-web-email-discovery.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com004-discovery-gap-additions-v3.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com004-discovery-gap-additions-v3.test.ts'
      - '.github/workflows/com004-discovery-gap-additions-v3.yml'

permissions:
  contents: read

concurrency:
  group: com004-discovery-gap-additions-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle COM-004 V3 gap audit
        run: |
          mkdir -p artifacts/api-server/dist/com004-discovery-gap-additions-v3
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/computer-awareness/com004-discovery-gap-additions-v3.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/com004-discovery-gap-additions-v3/audit.test.mjs
      - name: Run COM-004 V3 gap audit
        run: node artifacts/api-server/dist/com004-discovery-gap-additions-v3/audit.test.mjs
