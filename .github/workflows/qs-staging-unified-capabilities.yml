name: Validate QS staging unified capabilities
on:
  pull_request:
    branches: [New-main]
    paths:
      - 'artifacts/api-server/src/routes/admin-question-studio-registry.ts'
      - 'tests/qs-staging-capabilities-unified-route.test.mjs'
      - '.github/workflows/qs-staging-unified-capabilities.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qs-staging-catalog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/qs-staging-capabilities-unified-route.test.mjs
