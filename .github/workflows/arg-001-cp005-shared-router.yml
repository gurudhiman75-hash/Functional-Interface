name: Validate ARG-001 CP005 Shared Question Studio Router

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp005-*'
      - 'artifacts/api-server/src/question-studio/shared-generation-engine-arg.ts'
      - 'artifacts/api-server/src/routes/admin-question-studio-arguments.ts'
      - 'artifacts/api-server/src/routes/admin-question-studio-registry.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arg-001-cp005-shared-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arg-cp005-shared-router:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Prove ARG shared package registry and fallback routing
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp005-shared-router-proof.test.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=dist/arg-001-cp005-shared-router-proof.mjs
          node dist/arg-001-cp005-shared-router-proof.mjs

      - name: Prove ARG review adapter
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp005-question-studio-proof.test.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=dist/arg-001-cp005-question-studio-proof.mjs
          node dist/arg-001-cp005-question-studio-proof.mjs

      - name: Preserve CP004 trilingual authority
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp004-localization-proof.test.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=dist/arg-001-cp004-localization-proof.mjs
          node dist/arg-001-cp004-localization-proof.mjs

      - name: Build production API
        working-directory: artifacts/api-server
        run: pnpm run build

      - name: Build production admin app
        working-directory: artifacts/admin-app
        run: pnpm run build

      - name: Lifecycle boundary
        run: |
          echo 'ARG-001 is registered only for Question Studio review.'
          echo 'Manual review remains required; downstream learner delivery remains locked.'
