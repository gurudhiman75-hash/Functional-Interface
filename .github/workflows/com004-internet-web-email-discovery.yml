name: Validate COM-004 Internet Web Email Discovery

on:
  pull_request:
    branches:
      - integration/computer-content-engine-mainline-v1
    paths:
      - "artifacts/api-server/src/knowledge-v1/computer-awareness/com004-source-manifest.ts"
      - "artifacts/api-server/src/knowledge-v1/computer-awareness/com004-source-manifest.test.ts"
      - "artifacts/api-server/src/knowledge-v1/computer-awareness/com004-internet-web-email-discovery.ts"
      - "artifacts/api-server/src/knowledge-v1/computer-awareness/com004-internet-web-email-discovery.test.ts"
      - "artifacts/api-server/src/knowledge-v1/computer-awareness/com004-merge-split-audit.ts"
      - "artifacts/api-server/src/knowledge-v1/computer-awareness/com004-merge-split-audit.test.ts"
      - ".github/workflows/com004-internet-web-email-discovery.yml"
  workflow_dispatch:

concurrency:
  group: com004-internet-web-email-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-com004-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle COM-004 discovery governance tests
        run: |
          mkdir -p artifacts/api-server/dist/knowledge-v1/computer-awareness/com004-discovery
          tests=(
            "src/knowledge-v1/computer-awareness/com004-source-manifest.test.ts"
            "src/knowledge-v1/computer-awareness/com004-internet-web-email-discovery.test.ts"
            "src/knowledge-v1/computer-awareness/com004-merge-split-audit.test.ts"
          )
          for test_file in "${tests[@]}"; do
            output_name="$(basename "${test_file}" .ts).mjs"
            pnpm --dir artifacts/api-server exec esbuild \
              "${test_file}" \
              --bundle --packages=external --platform=node --format=esm \
              --outfile="dist/knowledge-v1/computer-awareness/com004-discovery/${output_name}"
          done

      - name: Validate COM-004 governed source manifest
        run: node artifacts/api-server/dist/knowledge-v1/computer-awareness/com004-discovery/com004-source-manifest.test.mjs

      - name: Validate COM-004 saturated learner-task discovery
        run: node artifacts/api-server/dist/knowledge-v1/computer-awareness/com004-discovery/com004-internet-web-email-discovery.test.mjs

      - name: Validate COM-004 merge-split ownership
        run: node artifacts/api-server/dist/knowledge-v1/computer-awareness/com004-discovery/com004-merge-split-audit.test.mjs
