name: Build SYL-001 V4 final review evidence

on:
  pull_request:
    branches:
      - feat/syl-001-structured-proof-v3
      - feat/syl-001-full-runtime
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-review-v4-final.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-review-v4.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-evidence-v4.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v4-evidence.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v4-evidence-remediated.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v4-evidence-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v4-native-polish.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/generator-v4.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v4-visual-remediation.test.ts
      - .github/workflows/reasoning-syl-001-v4-final-review.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-syl-001-v4-final-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-final-review-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle record-level evidence audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v4-evidence-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-v4-evidence-audit.test.mjs

      - name: Run record-level evidence audit
        run: node artifacts/api-server/dist/reasoning-v1/syl-001-v4-evidence-audit.test.mjs

      - name: Bundle all-mode visual audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v4-visual-remediation.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-v4-visual-remediation.test.mjs

      - name: Run all-mode visual audit
        run: node artifacts/api-server/dist/reasoning-v1/syl-001-v4-visual-remediation.test.mjs

      - name: Bundle final combined review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-review-v4-final.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-export-review-v4-final.mjs

      - name: Generate final combined review pack
        env:
          SYL_REVIEW_V4_DIR: artifacts/api-server/dist/reasoning-v1/syl-001-review-v4-final
        run: node artifacts/api-server/dist/reasoning-v1/syl-001-export-review-v4-final.mjs

      - name: Upload final combined review evidence
        uses: actions/upload-artifact@v4
        with:
          name: syl-001-v4-final-review-evidence
          path: artifacts/api-server/dist/reasoning-v1/syl-001-review-v4-final/**
          if-no-files-found: error
          retention-days: 30
