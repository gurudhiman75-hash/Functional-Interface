name: MEN-002 Wave03 Control Character Patch

on:
  pull_request:
    branches:
      - feat/men-002-cp007-gap-wave-02
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-002-wave03-control-character-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Correct MathJax escape and add control-character gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-03")
          runtime = root / "runtime.ts"
          lines = runtime.read_text().splitlines()

          shortcut_matches = [index for index, line in enumerate(lines) if "shortcut: `Use $P=" in line and "TSA-2A_{base}" in line]
          if len(shortcut_matches) != 1:
            raise SystemExit(f"Expected one prism shortcut, found {len(shortcut_matches)}")
          lines[shortcut_matches[0]] = r'    shortcut: `Use $P=\\frac{TSA-2A_{base}}{h}$.`,'

          mathjax_matches = [index for index, line in enumerate(lines) if '{ name: "MathJax cleanliness"' in line]
          if len(mathjax_matches) != 1:
            raise SystemExit(f"Expected one runtime MathJax gate, found {len(mathjax_matches)}")
          lines.insert(
            mathjax_matches[0] + 1,
            r'    { name: "control characters", passed: !/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/.test(learnerText), message: "Learner text must not contain hidden control characters." },',
          )
          runtime.write_text("\n".join(lines) + "\n")

          test = root / "runtime.test.ts"
          lines = test.read_text().splitlines()
          mathjax_matches = [index for index, line in enumerate(lines) if 'contains raw slash division in display maths' in line]
          if len(mathjax_matches) != 1:
            raise SystemExit(f"Expected one test MathJax assertion, found {len(mathjax_matches)}")
          lines.insert(
            mathjax_matches[0] + 1,
            r'    assert.equal(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/.test(learnerText), false, `${prototypeId} contains a hidden control character.`);',
          )
          test.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-03/runtime.ts artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-03/runtime.test.ts
          git commit -m "fix(mensuration): reject hidden Wave-03 control characters"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
