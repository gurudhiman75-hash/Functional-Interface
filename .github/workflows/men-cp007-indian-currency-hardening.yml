name: MEN-CP-007 Indian Currency Hardening

on:
  pull_request:
    branches:
      - feat/men-002-cp007-gap-wave-03
    types: [opened, reopened, synchronize]
    paths:
      - .github/scripts/men_cp007_indian_currency_hardening.py
      - .github/workflows/men-cp007-indian-currency-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply Indian currency and editorial hardening
        run: python .github/scripts/men_cp007_indian_currency_hardening.py

      - name: Commit hardened content
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002
          git commit -m "fix(mensuration): harden MEN-CP-007 for Indian exam currency"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
