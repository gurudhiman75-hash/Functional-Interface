name: Validate PNC-002 editorial quality upgrade

on:
  push:
    branches:
      - feat/pnc-002-editorial-quality-upgrade
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/**
      - .github/workflows/pnc-002-editorial-quality.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/**
      - .github/workflows/pnc-002-editorial-quality.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-pnc-002-editorial-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pnc-002-editorial-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout editorial branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnc-002-editorial-quality-upgrade
      - name: Apply exact proof repairs once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002')

          presentation = root / 'foundation/student-presentation.ts'
          presentation_lines = presentation.read_text().splitlines()
          presentation_changed = False
          for index, line in enumerate(presentation_lines):
              if 'if (!steps.some((line) => line.includes(source.solver.mathJax))) steps.push(displayEquation);' in line:
                  presentation_lines[index] = '  if (!steps.some((line) => line.includes(`$$${source.solver.mathJax}$$`))) steps.push(displayEquation);'
                  presentation_changed = True
                  break
          if not presentation_changed and not any('line.includes(`$$${source.solver.mathJax}$$`)' in line for line in presentation_lines):
              raise SystemExit('display-equation guard not found')
          presentation.write_text('\n'.join(presentation_lines) + '\n')

          proof = root / 'pnc-002-editorial-quality.test.ts'
          proof_lines = proof.read_text().splitlines()
          proof_changed = False
          for index, line in enumerate(proof_lines):
              if line.startswith('const unresolvedPlaceholder = '):
                  replacement = 'const unresolvedPlaceholder = /\\{[A-Za-z][A-Za-z0-9_]{1,}\\}/;'
                  if line != replacement:
                      proof_lines[index] = replacement
                      proof_changed = True
                  break
          else:
              raise SystemExit('placeholder-regex declaration not found')
          proof.write_text('\n'.join(proof_lines) + '\n')
          PY
          if ! git diff --quiet -- \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/student-presentation.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-editorial-quality.test.ts; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add \
              artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/student-presentation.ts \
              artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-editorial-quality.test.ts
            git commit -m "fix(pnc): enforce display formula and TeX-safe placeholders"
            git push origin HEAD:feat/pnc-002-editorial-quality-upgrade
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        run: |
          cd artifacts/api-server
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --resolveJsonModule \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/student-presentation.ts \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-editorial-quality.test.ts
      - name: Bundle editorial quality proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-editorial-quality.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/pnc-002-editorial-quality-proof.mjs
      - name: Run editorial quality proof
        working-directory: artifacts/api-server
        shell: bash
        run: |
          mkdir -p dist/quant-v4/pnc-002-editorial-quality-diagnostics
          set +e
          node dist/quant-v4/pnc-002-editorial-quality-proof.mjs 2>&1 | tee dist/quant-v4/pnc-002-editorial-quality-diagnostics/runtime.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Publish complete editorial review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnc-002-complete-editorial-quality-review
          path: artifacts/api-server/dist/quant-v4/pnc-002-editorial-quality-review/
          if-no-files-found: error
          retention-days: 14
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnc-002-editorial-quality-diagnostics
          path: artifacts/api-server/dist/quant-v4/pnc-002-editorial-quality-diagnostics/
          if-no-files-found: error
          retention-days: 3
