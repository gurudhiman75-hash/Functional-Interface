name: Validate PNC-002 editorial quality upgrade

on:
  push:
    branches:
      - feat/pnc-002-editorial-quality-upgrade
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/**
      - .github/workflows/pnc-002-editorial-quality.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/**
      - .github/workflows/pnc-002-editorial-quality.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-pnc-002-editorial-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pnc-002-editorial-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout editorial branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnc-002-editorial-quality-upgrade
      - name: Switch proof to final presentation once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-editorial-quality-reviewed.test.ts')
          text = path.read_text()
          old_import = '''import {
            buildPnc002ReviewedStudentPresentation,
          } from "./foundation/student-presentation-reviewed";'''
          new_import = '''import {
            buildPnc002FinalStudentPresentation,
          } from "./foundation/student-presentation-final";'''
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('reviewed presentation import not found')
          old_call = 'const presentation = buildPnc002ReviewedStudentPresentation(source);'
          new_call = 'const presentation = buildPnc002FinalStudentPresentation(source);'
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit('reviewed presentation call not found')
          path.write_text(text)
          PY
          if ! git diff --quiet -- artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-editorial-quality-reviewed.test.ts; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-editorial-quality-reviewed.test.ts
            git commit -m "test(pnc): use final student presentation in editorial proof"
            git push origin HEAD:feat/pnc-002-editorial-quality-upgrade
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        run: |
          cd artifacts/api-server
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --resolveJsonModule \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/student-presentation.ts \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/student-presentation-reviewed.ts \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/student-presentation-final.ts \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-editorial-quality-reviewed.test.ts
      - name: Bundle final editorial quality proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-editorial-quality-reviewed.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/pnc-002-editorial-quality-reviewed-proof.mjs
      - name: Run final editorial quality proof
        working-directory: artifacts/api-server
        shell: bash
        run: |
          mkdir -p dist/quant-v4/pnc-002-editorial-quality-diagnostics
          set +e
          node dist/quant-v4/pnc-002-editorial-quality-reviewed-proof.mjs 2>&1 | tee dist/quant-v4/pnc-002-editorial-quality-diagnostics/runtime.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Publish complete final editorial file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnc-002-complete-editorial-quality-final
          path: artifacts/api-server/dist/quant-v4/pnc-002-editorial-quality-reviewed/
          if-no-files-found: error
          retention-days: 14
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnc-002-editorial-quality-diagnostics
          path: artifacts/api-server/dist/quant-v4/pnc-002-editorial-quality-diagnostics/
          if-no-files-found: error
          retention-days: 3
