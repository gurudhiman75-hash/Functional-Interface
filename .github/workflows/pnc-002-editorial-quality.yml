name: Validate PNC-002 editorial quality upgrade

on:
  push:
    branches:
      - feat/pnc-002-editorial-quality-upgrade
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/**
      - .github/workflows/pnc-002-editorial-quality.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/**
      - .github/workflows/pnc-002-editorial-quality.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-pnc-002-editorial-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pnc-002-editorial-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout editorial branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnc-002-editorial-quality-upgrade
      - name: Repair fallback display math once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/student-presentation-reviewed.ts')
          text = path.read_text()
          old = 'return `does not satisfy the required calculation $${source.solver.mathJax}$$ and represents an incomplete count or arithmetic distractor`;'
          new = 'return `does not satisfy the required calculation $$${source.solver.mathJax}$$ and represents an incomplete count or arithmetic distractor`;'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('fallback display-math interpolation not found')
          PY
          if ! git diff --quiet -- artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/student-presentation-reviewed.ts; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/student-presentation-reviewed.ts
            git commit -m "fix(pnc): render fallback trap formula as display MathJax"
            git push origin HEAD:feat/pnc-002-editorial-quality-upgrade
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        run: |
          cd artifacts/api-server
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --resolveJsonModule \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/student-presentation.ts \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/student-presentation-reviewed.ts \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-editorial-quality-reviewed.test.ts
      - name: Bundle reviewed editorial quality proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-editorial-quality-reviewed.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/pnc-002-editorial-quality-reviewed-proof.mjs
      - name: Run reviewed editorial quality proof
        working-directory: artifacts/api-server
        shell: bash
        run: |
          mkdir -p dist/quant-v4/pnc-002-editorial-quality-diagnostics
          set +e
          node dist/quant-v4/pnc-002-editorial-quality-reviewed-proof.mjs 2>&1 | tee dist/quant-v4/pnc-002-editorial-quality-diagnostics/runtime.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Publish complete reviewed editorial file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnc-002-complete-editorial-quality-reviewed
          path: artifacts/api-server/dist/quant-v4/pnc-002-editorial-quality-reviewed/
          if-no-files-found: error
          retention-days: 14
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnc-002-editorial-quality-diagnostics
          path: artifacts/api-server/dist/quant-v4/pnc-002-editorial-quality-diagnostics/
          if-no-files-found: error
          retention-days: 3
