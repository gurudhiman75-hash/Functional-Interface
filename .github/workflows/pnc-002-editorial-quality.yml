name: Validate PNC-002 editorial quality upgrade

on:
  push:
    branches:
      - feat/pnc-002-editorial-quality-upgrade
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/**
      - .github/workflows/pnc-002-editorial-quality.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/**
      - .github/workflows/pnc-002-editorial-quality.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-pnc-002-editorial-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pnc-002-editorial-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout editorial branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnc-002-editorial-quality-upgrade
      - name: Apply final editorial consistency fixes once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002')
          presentation = root / 'foundation/student-presentation-final.ts'
          text = presentation.read_text()

          spacing_anchor = '    .replace(/\\b(Thus|Hence|Therefore)\\$(?!\\$)/g, "$1 $")\n'
          spacing_addition = (
              '    .replace(/\\bspecified\\b/gi, "particular")\n'
              '    .replace(/\\bunnamed\\b/gi, "unlabelled")\n'
              '    .replace(/\\bdistinct\\b/gi, "different")\n'
          )
          if spacing_addition not in text:
              if spacing_anchor not in text:
                  raise SystemExit('spacing polish anchor not found')
              text = text.replace(spacing_anchor, spacing_anchor + spacing_addition, 1)

          old_derangement = '''  if (mode.includes("derangement") || mode.includes("fixedpoint")) {
            stem = stem.replace(/different objects/gi, "numbered cards");
          }
'''
          new_derangement = '''  if (mode.includes("derangement") || mode.includes("fixedpoint")) {
            stem = stem
              .replace(/different objects/gi, "numbered cards")
              .replace(/\\bobjects\\b/gi, "cards")
              .replace(/\\bobject\\b/gi, "card");
          }
'''
          if old_derangement in text:
              text = text.replace(old_derangement, new_derangement, 1)
          elif new_derangement not in text:
              raise SystemExit('derangement noun block not found')

          trainee_block = '''
          if (/trainees?/.test(original)) {
            stem = stem.replace(
              /^A sports club is forming teams for a tournament\\./,
              "A training centre is forming project teams.",
            );
          }

'''
          if trainee_block not in text:
              return_anchor = '  return stem;\n}\n\nconst directReasons:'
              if return_anchor not in text:
                  raise SystemExit('final stem return anchor not found')
              text = text.replace(return_anchor, trainee_block + return_anchor, 1)

          inverse_guard = '''  if (source.solveMode.toLowerCase().includes("recover")) {
            return "does not reproduce the stated target count when checked within the permitted candidate range";
          }
'''
          if inverse_guard not in text:
              trap_anchor = 'function finalTrapReason(source: PncStudentSourcePackage, option: number): string {\n'
              if trap_anchor not in text:
                  raise SystemExit('final trap function anchor not found')
              text = text.replace(trap_anchor, trap_anchor + inverse_guard, 1)

          presentation.write_text(text)

          proof = root / 'pnc-002-editorial-quality-reviewed.test.ts'
          proof_text = proof.read_text()
          assertion_anchor = 'assert.ok(byQl.get("PNC-QL-269")?.upgradedStem.startsWith("A sports club has"));\n'
          assertions = '''assert.ok(byQl.get("PNC-QL-239")?.commonTrapWarning.every((line) => line.includes("target count") && line.includes("candidate range")));
          assert.ok(byQl.get("PNC-QL-253")?.upgradedStem.includes("card"));
          assert.ok(!byQl.get("PNC-QL-253")?.upgradedStem.includes("object"));
          assert.ok(byQl.get("PNC-QL-209")?.upgradedStem.startsWith("A training centre is forming project teams."));
'''
          if assertions not in proof_text:
              if assertion_anchor not in proof_text:
                  raise SystemExit('review assertion anchor not found')
              proof_text = proof_text.replace(assertion_anchor, assertion_anchor + assertions, 1)
          proof.write_text(proof_text)
          PY
          if ! git diff --quiet -- \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/student-presentation-final.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-editorial-quality-reviewed.test.ts; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add \
              artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/student-presentation-final.ts \
              artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-editorial-quality-reviewed.test.ts
            git commit -m "fix(pnc): finalise inverse traps and learner terminology"
            git push origin HEAD:feat/pnc-002-editorial-quality-upgrade
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        run: |
          cd artifacts/api-server
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --resolveJsonModule \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/student-presentation.ts \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/student-presentation-reviewed.ts \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/student-presentation-final.ts \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-editorial-quality-reviewed.test.ts
      - name: Bundle final editorial quality proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-editorial-quality-reviewed.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/pnc-002-editorial-quality-reviewed-proof.mjs
      - name: Run final editorial quality proof
        working-directory: artifacts/api-server
        shell: bash
        run: |
          mkdir -p dist/quant-v4/pnc-002-editorial-quality-diagnostics
          set +e
          node dist/quant-v4/pnc-002-editorial-quality-reviewed-proof.mjs 2>&1 | tee dist/quant-v4/pnc-002-editorial-quality-diagnostics/runtime.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Publish complete final editorial file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnc-002-complete-editorial-quality-final
          path: artifacts/api-server/dist/quant-v4/pnc-002-editorial-quality-reviewed/
          if-no-files-found: error
          retention-days: 14
      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnc-002-editorial-quality-diagnostics
          path: artifacts/api-server/dist/quant-v4/pnc-002-editorial-quality-diagnostics/
          if-no-files-found: error
          retention-days: 3
