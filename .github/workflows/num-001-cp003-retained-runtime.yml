name: Validate NUM-CP-003 retained runtime

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-003/**
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/foundation/**
      - .github/workflows/num-001-cp003-retained-runtime.yml
      - .github/workflows/num-001-cp003-retained-registry.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp003-retained-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp003-retained-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle retained registry regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-003/retained/template-registry.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp003-retained-registry-for-runtime.mjs
      - name: Run retained registry regression
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp003-retained-registry-for-runtime.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp003-retained-registry-for-runtime.log
      - name: Bundle consolidated deterministic proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-003/retained/runtime.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp003-retained-runtime.test.mjs
      - name: Run consolidated deterministic proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp003-retained-runtime.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp003-retained-runtime-proof.log
      - name: Bundle consolidated structural audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-003/retained/runtime-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp003-retained-runtime-audit.mjs
      - name: Run consolidated structural audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp003-retained-runtime-audit.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp003-retained-runtime-audit.log
      - name: Bundle retained review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-003/retained/review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp003-retained-review-export.mjs
      - name: Generate retained review pack
        working-directory: artifacts/api-server
        run: node dist/quant-v4/num-001-cp003-retained-review-export.mjs
      - name: Upload retained runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: num-001-cp003-retained-runtime
          path: |
            artifacts/api-server/dist/quant-v4/num-001-cp003-retained-registry-for-runtime.log
            artifacts/api-server/dist/quant-v4/num-001-cp003-retained-runtime-proof.log
            artifacts/api-server/dist/quant-v4/num-001-cp003-retained-runtime-audit.log
            artifacts/api-server/dist/quant-v4/num-001-cp003-retained-review.json
            artifacts/api-server/dist/quant-v4/num-001-cp003-retained-review.md
          if-no-files-found: error
          retention-days: 7
