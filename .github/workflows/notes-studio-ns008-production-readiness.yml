name: Validate Notes Studio NS-008 Production Readiness

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - build-api.sh
      - artifacts/api-server/migrations/20260829_notes_studio_source_pack*.sql
      - artifacts/api-server/migrations/20260830_notes_studio_source_pack*.sql
      - artifacts/api-server/migrations/20260831_notes_studio*.sql
      - artifacts/api-server/notes-studio-migrate.ts
      - artifacts/api-server/src/notes-studio/**
      - artifacts/api-server/src/routes/admin-notes-studio*.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/admin-app/src/pages/content/NotesStudio*.tsx

permissions:
  contents: read

concurrency:
  group: notes-studio-ns008-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-notes-studio-production-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notes_studio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notes_studio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/notes_studio_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cumulative Notes Studio deterministic contracts
        run: |
          set -euo pipefail
          for test_file in \
            source-pack \
            source-pack-policy \
            evidence-map \
            section-synthesis \
            quality-gates \
            quality-grounding \
            approval-versioning \
            release-lineage \
            research-restart \
            production-readiness
          do
            pnpm --dir artifacts/api-server exec esbuild "src/notes-studio/${test_file}.test.ts" --bundle --packages=external --platform=node --format=esm --outfile="dist/notes-studio-${test_file}.test.mjs"
            node "artifacts/api-server/dist/notes-studio-${test_file}.test.mjs"
          done

      - name: Bootstrap isolated canonical dependencies
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/api-server/src/notes-studio/production-readiness-bootstrap.sql

      - name: Apply ordered Notes Studio migrations transactionally
        run: |
          pnpm --dir artifacts/api-server exec esbuild notes-studio-migrate.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-migrate.mjs
          (cd artifacts/api-server && node dist/notes-studio-migrate.mjs)
          (cd artifacts/api-server && node dist/notes-studio-migrate.mjs)

      - name: Reconcile unledgered partial Notes Studio schema
        env:
          PARTIAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/notes_studio_partial_ci
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE notes_studio_partial_ci'
          psql "$PARTIAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/api-server/src/notes-studio/production-readiness-bootstrap.sql
          for migration in \
            20260829_notes_studio_source_pack.sql \
            20260829_notes_studio_source_pack_ns003_evidence_coverage.sql \
            20260829_notes_studio_source_pack_ns004_section_synthesis.sql \
            20260829_notes_studio_source_pack_ns004_section_synthesis_hardening.sql \
            20260830_notes_studio_source_pack_ns005_quality_gates.sql \
            20260830_notes_studio_source_pack_ns006_approval_localization.sql \
            20260830_notes_studio_source_pack_ns007_release_lineage.sql \
            20260830_notes_studio_source_pack_ns009_planning.sql \
            20260830_notes_studio_source_pack_ns011_source_policy.sql \
            20260831_notes_studio_ns017_source_pack_freeze.sql \
            20260831_notes_studio_ns018_research_restart.sql
          do
            psql "$PARTIAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f "artifacts/api-server/migrations/$migration"
          done
          (cd artifacts/api-server && DATABASE_URL="$PARTIAL_DATABASE_URL" node dist/notes-studio-migrate.mjs)
          test "$(psql "$PARTIAL_DATABASE_URL" -Atc 'SELECT count(*) FROM platform.notes_studio_schema_migrations')" = "12"
          test "$(psql "$PARTIAL_DATABASE_URL" -Atc \"SELECT COALESCE(to_regclass('content.note_authoring_jobs')::text, '')\")" = "content.note_authoring_jobs"

      - name: Run seeded PostgreSQL lifecycle
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/api-server/src/notes-studio/production-readiness-smoke.sql

      - name: Run reference-evidence PostgreSQL lifecycle
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/api-server/src/notes-studio/reference-evidence-production-smoke.sql

      - name: Verify production-readiness boundaries
        run: |
          grep -F 'pg_advisory_xact_lock' artifacts/api-server/notes-studio-migrate.ts
          grep -F 'notes_studio_schema_migrations' artifacts/api-server/notes-studio-migrate.ts
          grep -F 'reconciling unledgered partial schema' artifacts/api-server/notes-studio-migrate.ts
          grep -F 'automaticProductionMigration: true' artifacts/api-server/src/routes/admin-notes-studio-operations.ts
          grep -F '[render-build] verify Notes Studio schema' build-api.sh
          grep -F 'notes-studio-migrate.ts' build-api.sh
          grep -F 'rawSourceBodiesSentToSectionWriter: false' artifacts/api-server/src/routes/admin-notes-studio-operations.ts
          grep -F 'rawResearchSourcesSentToLocalization: false' artifacts/api-server/src/routes/admin-notes-studio-operations.ts
          grep -F 'handoffPublishesResource: false' artifacts/api-server/src/routes/admin-notes-studio-operations.ts
          grep -F 'automaticPublicationEnabled: false' artifacts/api-server/src/routes/admin-notes-studio-operations.ts
          grep -F 'Production readiness' artifacts/admin-app/src/pages/content/NotesStudioHubPage.tsx
          grep -F 'Production Readiness' artifacts/admin-app/src/pages/content/NotesStudioOperationsPage.tsx

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Typecheck admin app
        run: pnpm --dir artifacts/admin-app typecheck
