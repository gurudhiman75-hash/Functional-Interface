name: Validate Notes Studio NS-008 Production Readiness

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/migrations/20260829_notes_studio_source_pack*.sql
      - artifacts/api-server/migrations/20260830_notes_studio_source_pack*.sql
      - artifacts/api-server/notes-studio-migrate.ts
      - artifacts/api-server/src/notes-studio/**
      - artifacts/api-server/src/routes/admin-notes-studio*.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/admin-app/src/pages/content/NotesStudio*.tsx

permissions:
  contents: read

concurrency:
  group: notes-studio-ns008-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-notes-studio-production-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notes_studio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notes_studio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/notes_studio_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cumulative Notes Studio deterministic contracts
        run: |
          set -euo pipefail
          for test_file in \
            source-pack \
            source-pack-policy \
            evidence-map \
            section-synthesis \
            quality-gates \
            quality-grounding \
            approval-versioning \
            release-lineage \
            production-readiness
          do
            pnpm --dir artifacts/api-server exec esbuild "src/notes-studio/${test_file}.test.ts" --bundle --packages=external --platform=node --format=esm --outfile="dist/notes-studio-${test_file}.test.mjs"
            node "artifacts/api-server/dist/notes-studio-${test_file}.test.mjs"
          done

      - name: Bootstrap isolated canonical dependencies
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/api-server/src/notes-studio/production-readiness-bootstrap.sql

      - name: Apply ordered Notes Studio migrations transactionally
        run: |
          pnpm --dir artifacts/api-server exec esbuild notes-studio-migrate.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-migrate.mjs
          (cd artifacts/api-server && node dist/notes-studio-migrate.mjs)

      - name: Run seeded PostgreSQL lifecycle
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/api-server/src/notes-studio/production-readiness-smoke.sql

      - name: Verify production-readiness boundaries
        run: |
          grep -F 'pg_advisory_xact_lock' artifacts/api-server/notes-studio-migrate.ts
          grep -F 'automaticProductionMigration: false' artifacts/api-server/src/routes/admin-notes-studio-operations.ts
          grep -F 'rawSourceBodiesSentToSectionWriter: false' artifacts/api-server/src/routes/admin-notes-studio-operations.ts
          grep -F 'rawResearchSourcesSentToLocalization: false' artifacts/api-server/src/routes/admin-notes-studio-operations.ts
          grep -F 'handoffPublishesResource: false' artifacts/api-server/src/routes/admin-notes-studio-operations.ts
          grep -F 'automaticPublicationEnabled: false' artifacts/api-server/src/routes/admin-notes-studio-operations.ts
          grep -F 'Production readiness' artifacts/admin-app/src/pages/content/NotesStudioHubPage.tsx
          grep -F 'Production Readiness' artifacts/admin-app/src/pages/content/NotesStudioOperationsPage.tsx

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Typecheck admin app
        run: pnpm --dir artifacts/admin-app typecheck
