name: ARG-001 CP015 simple explanations repair

on:
  push:
    branches:
      - feature/arg-001-cp012-editorial-remediation
    paths:
      - .github/workflows/arg-001-cp015-v8-simple-explanations.yml
      - scripts/arg-cp015-simple-explanations-repair.py
      - scripts/arg-cp015-generic-fallback-routing-repair.py
      - scripts/arg-cp015-ql004-localized-routing-hotfix.py
      - scripts/arg-cp015-localized-routing-hotfix-v2.py
      - scripts/arg-cp015-localized-routing-hotfix-v3.py
      - scripts/arg-cp015-semantic-alignment-hotfix.py
      - scripts/arg-cp015-punjabi-naturalness-hotfix.py
      - scripts/arg-cp015-hindi-naturalness-hotfix.py
      - scripts/arg-cp015-final-editorial-integration-repair.py
      - artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-perceived-diversity-expansion.ts
      - artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-semantic-alignment-proof.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-punjabi-naturalness-proof.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-hindi-naturalness-proof.test.ts

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arg-001-cp012-editorial-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply plain-language and runtime-integration repair
        run: |
          python scripts/arg-cp015-simple-explanations-repair.py
          python scripts/arg-cp015-generic-fallback-routing-repair.py
          python scripts/arg-cp015-ql004-localized-routing-hotfix.py
          python scripts/arg-cp015-localized-routing-hotfix-v2.py
          python scripts/arg-cp015-localized-routing-hotfix-v3.py
          python scripts/arg-cp015-semantic-alignment-hotfix.py
          python scripts/arg-cp015-punjabi-naturalness-hotfix.py
          python scripts/arg-cp015-hindi-naturalness-hotfix.py
          python scripts/arg-cp015-final-editorial-integration-repair.py
      - name: Strict TypeScript
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc --noEmit --target es2022 --module esnext --moduleResolution bundler --allowImportingTsExtensions --strictNullChecks --noImplicitAny --noImplicitReturns --noFallthroughCasesInSwitch --skipLibCheck --types node src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-perceived-diversity-expansion.ts src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-perceived-diversity-proof.test.ts src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-anti-gaming-grammar-proof.test.ts src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-semantic-alignment-proof.test.ts src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-punjabi-naturalness-proof.test.ts src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-hindi-naturalness-proof.test.ts src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-human-review-export.ts src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-human-review-global-uniqueness-proof.ts
      - name: Prove grammar and plain-language surface
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-anti-gaming-grammar-proof.test.ts --bundle --platform=node --format=esm --outfile=dist/arg-cp015-anti-gaming-grammar-proof.mjs
          set +e
          node dist/arg-cp015-anti-gaming-grammar-proof.mjs > /tmp/arg-cp015-grammar.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            mkdir -p ../../docs/review
            {
              echo "ARG-001 CP015 grammar/plain-language proof failure"
              echo "head: $GITHUB_SHA"
              echo "run: $GITHUB_RUN_ID"
              echo
              cat /tmp/arg-cp015-grammar.log
            } > ../../docs/review/ARG-001-CP015-LAST-GRAMMAR-FAILURE.txt
            git -C ../.. config user.name "github-actions[bot]"
            git -C ../.. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C ../.. add docs/review/ARG-001-CP015-LAST-GRAMMAR-FAILURE.txt
            git -C ../.. commit -m "chore(arg-cp015): capture grammar proof failure" || true
            git -C ../.. push origin HEAD:feature/arg-001-cp012-editorial-remediation
            cat /tmp/arg-cp015-grammar.log
            exit "$status"
          fi
          cat /tmp/arg-cp015-grammar.log
      - name: Prove explanation semantic alignment
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-semantic-alignment-proof.test.ts --bundle --platform=node --format=esm --outfile=dist/arg-cp015-semantic-alignment-proof.mjs
          node dist/arg-cp015-semantic-alignment-proof.mjs
      - name: Prove Punjabi naturalness families
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-punjabi-naturalness-proof.test.ts --bundle --platform=node --format=esm --outfile=dist/arg-cp015-punjabi-naturalness-proof.mjs
          set +e
          node dist/arg-cp015-punjabi-naturalness-proof.mjs > /tmp/arg-cp015-punjabi-naturalness.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            mkdir -p ../../docs/review
            {
              echo "ARG-001 CP015 Punjabi naturalness proof failure"
              echo "head: $GITHUB_SHA"
              echo "run: $GITHUB_RUN_ID"
              echo
              cat /tmp/arg-cp015-punjabi-naturalness.log
            } > ../../docs/review/ARG-001-CP015-LAST-PUNJABI-NATURALNESS-FAILURE.txt
            git -C ../.. config user.name "github-actions[bot]"
            git -C ../.. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C ../.. add docs/review/ARG-001-CP015-LAST-PUNJABI-NATURALNESS-FAILURE.txt
            git -C ../.. commit -m "chore(arg-cp015): capture Punjabi naturalness failure" || true
            git -C ../.. push origin HEAD:feature/arg-001-cp012-editorial-remediation
            cat /tmp/arg-cp015-punjabi-naturalness.log
            exit "$status"
          fi
          cat /tmp/arg-cp015-punjabi-naturalness.log
      - name: Prove Hindi naturalness families
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-hindi-naturalness-proof.test.ts --bundle --platform=node --format=esm --outfile=dist/arg-cp015-hindi-naturalness-proof.mjs
          node dist/arg-cp015-hindi-naturalness-proof.mjs
      - name: Prove diversity and human-review uniqueness
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-perceived-diversity-proof.test.ts --bundle --platform=node --format=esm --outfile=dist/arg-cp015-perceived-diversity-proof.mjs
          node dist/arg-cp015-perceived-diversity-proof.mjs
          pnpm exec esbuild src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-human-review-export.ts --bundle --platform=node --format=esm --outfile=dist/arg-cp015-human-review-export.mjs
          node dist/arg-cp015-human-review-export.mjs
          pnpm exec esbuild src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-human-review-global-uniqueness-proof.ts --bundle --platform=node --format=esm --outfile=dist/arg-cp015-human-review-global-proof.mjs
          node dist/arg-cp015-human-review-global-proof.mjs
      - name: Persist certified human-review corpus
        run: |
          mkdir -p docs/review
          cp artifacts/api-server/dist/arg-001-cp015-human-review/arg-cp015-human-review.md docs/review/ARG-001-CP015-HUMAN-REVIEW-EN.md
          cp artifacts/api-server/dist/arg-001-cp015-human-review/arg-cp015-human-review-hi.md docs/review/ARG-001-CP015-HUMAN-REVIEW-HI.md
          cp artifacts/api-server/dist/arg-001-cp015-human-review/arg-cp015-human-review-pa.md docs/review/ARG-001-CP015-HUMAN-REVIEW-PA.md
      - name: Preserve CP014 and CP013
        working-directory: artifacts/api-server
        run: |
          for file in cp014-manual-editorial-approval-proof.test.ts cp013-final-editorial-surface-proof.test.ts; do
            pnpm exec esbuild src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/$file --bundle --platform=node --format=esm --outfile=dist/${file%.ts}.mjs
            node dist/${file%.ts}.mjs
          done
      - name: Preserve exact CP006 and CP008 freezes
        run: |
          for file in cp006-byte-freeze-proof.test.ts cp008-byte-freeze-proof.test.ts; do
            pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/$file --bundle --platform=node --format=esm --outfile=dist/${file%.ts}.mjs
            node artifacts/api-server/dist/${file%.ts}.mjs
          done
      - name: Build production API and admin
        run: |
          pnpm --dir artifacts/api-server build
          pnpm --dir artifacts/admin-app build
      - name: Commit proven V8 repair and certified review corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-final-editorial-quality.ts artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-anti-gaming-grammar-proof.test.ts artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-perceived-diversity-expansion.ts docs/review/ARG-001-CP015-HUMAN-REVIEW-EN.md docs/review/ARG-001-CP015-HUMAN-REVIEW-HI.md docs/review/ARG-001-CP015-HUMAN-REVIEW-PA.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(arg-cp015): persist certified trilingual review corpus"
          git push origin HEAD:feature/arg-001-cp012-editorial-remediation
