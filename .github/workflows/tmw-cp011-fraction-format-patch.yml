name: Patch TMW-CP-011 fraction formatting

on:
  pull_request:
    branches:
      - design/tmw-001-blueprint
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/tmw-cp011-fraction-format-patch.yml
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp011-engine.ts
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp011-options.ts
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp011-runtime.ts
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp011-audit.ts

permissions:
  contents: write

concurrency:
  group: patch-tmw-cp011-fractions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.head_ref == 'feat/tmw-cp011'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/tmw-cp011
      - name: Apply guarded source correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001')
          changed = False

          for relative in ['foundation/cp011-engine.ts', 'foundation/cp011-options.ts']:
              path = root / relative
              text = path.read_text()
              old = r'`\(${toLatex(magnitude)}\)`'
              new = r'`\\(${toLatex(magnitude)}\\)`'
              if old in text:
                  text = text.replace(old, new)
                  changed = True
              path.write_text(text)

          runtime = root / 'foundation/cp011-runtime.ts'
          text = runtime.read_text()
          guard = 'raw LaTeX fraction outside MathJax'
          if guard not in text:
              lines = text.splitlines()
              for index, line in enumerate(lines):
                  if 'unbalanced MathJax' in line:
                      lines.insert(index + 1, r' const outsideMath=text.replace(/\\\([\s\S]*?\\\)/g,"");if(/\\frac/.test(outsideMath))errors.push("raw LaTeX fraction outside MathJax");')
                      changed = True
                      break
              else:
                  raise SystemExit('runtime insertion point not found')
              runtime.write_text('\n'.join(lines) + '\n')

          audit = root / 'tmw-001-cp011-audit.ts'
          text = audit.read_text()
          if guard not in text:
              lines = text.splitlines()
              for index, line in enumerate(lines):
                  if 'awkward signed expression' in line:
                      lines[index + 1:index + 1] = [
                          r'    const outsideMath = learnerText.replace(/\\\([\s\S]*?\\\)/g, "");',
                          r'    if (/\\frac/.test(outsideMath)) failures.push(`${entry.qlId}:${index}:raw LaTeX fraction outside MathJax`);',
                      ]
                      changed = True
                      break
              else:
                  raise SystemExit('audit insertion point not found')
              audit.write_text('\n'.join(lines) + '\n')

          if not changed:
              Path('/tmp/cp011-noop').write_text('already patched')
          PY
      - name: Install locked workspace dependencies
        if: hashFiles('/tmp/cp011-noop') == ''
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Validate corrected runtime and audit
        if: hashFiles('/tmp/cp011-noop') == ''
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp011.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/tmw-001-cp011.patch-test.mjs
          node artifacts/api-server/dist/quant-v4/tmw-001-cp011.patch-test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp011-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/tmw-001-cp011.patch-audit.mjs
          node artifacts/api-server/dist/quant-v4/tmw-001-cp011.patch-audit.mjs
      - name: Commit corrected source
        if: hashFiles('/tmp/cp011-noop') == ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp011-engine.ts
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp011-options.ts
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp011-runtime.ts
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp011-audit.ts
          git commit -m "fix(tmw): render CP-011 fractional rate changes in MathJax"
          git push origin HEAD:feat/tmw-cp011
