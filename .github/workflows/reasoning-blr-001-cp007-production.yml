name: Reasoning BLR-001 CP-007 Production

on:
  push:
    branches:
      - feat/blr-001-cp007-production
    paths:
      - "artifacts/api-server/src/reasoning-v1/**"
      - "artifacts/api-server/src/question-studio-review-registry.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-reasoning.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - "artifacts/admin-app/src/features/question-studio/reasoning-review-api.ts"
      - "artifacts/admin-app/src/pages/content/QuestionStudioReasoningReviewPanel.tsx"
      - "artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx"
      - ".github/workflows/reasoning-blr-001-cp007-production.yml"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/**"
      - "artifacts/api-server/src/question-studio-review-registry.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-reasoning.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - "artifacts/admin-app/src/features/question-studio/reasoning-review-api.ts"
      - "artifacts/admin-app/src/pages/content/QuestionStudioReasoningReviewPanel.tsx"
      - "artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx"
      - ".github/workflows/reasoning-blr-001-cp007-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blr-001-cp007-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove frozen English corpus
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-english-frozen.test.ts | tee english-freeze.log

      - name: Prove multilingual freeze
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-multilingual-frozen.test.ts | tee multilingual-freeze.log

      - name: Prove Question Studio adapter
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/question-studio-review-adapter.test.ts | tee studio-adapter.log

      - name: Prove production lifecycle
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/question-studio-production.test.ts | tee production-lifecycle.log

      - name: Typecheck admin application
        run: pnpm --dir artifacts/admin-app typecheck

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Export production evidence
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/export-question-studio-production.ts blr-cp007-production-output | tee production-export.log

      - name: Verify production evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=blr-cp007-production-output
          SUMMARY="$OUT/blr-cp007-production-summary.json"
          test -f "$SUMMARY"
          test -f "$OUT/BLR-CP-007-PRODUCTION-LIFECYCLE.md"
          test -f "$OUT/blr-cp007-production-review.html"
          test -f "$OUT/blr-cp007-production-samples.json"
          grep -q '"verdict": "BLR_CP007_PRODUCTION_LIFECYCLE_PROVED"' "$SUMMARY"
          grep -q '"multilingualRecordCount": 504' "$SUMMARY"
          grep -q '"englishCount": 168' "$SUMMARY"
          grep -q '"hindiCount": 168' "$SUMMARY"
          grep -q '"punjabiCount": 168' "$SUMMARY"
          grep -q '"uniqueQuestionLanguageIdCount": 504' "$SUMMARY"
          grep -q '"validRecordCount": 504' "$SUMMARY"
          grep -q '"generationPersistenceEnabled": true' "$SUMMARY"
          grep -q '"idempotentFullCorpusSyncEnabled": true' "$SUMMARY"
          grep -q '"approvalGatePreserved": true' "$SUMMARY"
          grep -q '"questionBankConversionEligibleAfterApproval": true' "$SUMMARY"
          grep -q '"mockTestEligibleAfterApproval": true' "$SUMMARY"
          grep -q '"publicationWorkflowEligibleAfterApproval": true' "$SUMMARY"
          grep -q '"automaticStudentPublication": false' "$SUMMARY"

      - name: Upload production logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp007-production-logs
          path: |
            english-freeze.log
            multilingual-freeze.log
            studio-adapter.log
            production-lifecycle.log
            production-export.log
          retention-days: 14

      - name: Upload production evidence pack
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp007-production
          path: blr-cp007-production-output
          retention-days: 30
