name: Frontend production quality

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/examtree/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/frontend-production-quality.yml
  push:
    branches: [New-main]
    paths:
      - artifacts/examtree/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/frontend-production-quality.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  student-frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run student frontend production gate
        run: pnpm --dir artifacts/examtree quality
