name: Validate Geometry Phase 4 circle executable discovery

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/quant-v4/shared/geometry/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/**
      - .github/workflows/geometry-phase4.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geometry-phase4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-geometry-phase4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Run retained Geometry Phase 0 proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/run-phase0.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-phase0-retained-for-phase4.test.mjs
          node artifacts/api-server/dist/quant-v4/geometry-phase0-retained-for-phase4.test.mjs
      - name: Run retained Geometry Phase 1 proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/run-phase1.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-phase1-retained-for-phase4.test.mjs
          node artifacts/api-server/dist/quant-v4/geometry-phase1-retained-for-phase4.test.mjs
      - name: Run retained Geometry Phase 2 proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/run-phase2.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-phase2-retained-for-phase4.test.mjs
          node artifacts/api-server/dist/quant-v4/geometry-phase2-retained-for-phase4.test.mjs
      - name: Run retained Geometry Phase 3 proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/run-phase3.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-phase3-retained-for-phase4.test.mjs
          node artifacts/api-server/dist/quant-v4/geometry-phase3-retained-for-phase4.test.mjs
      - name: Run Geometry Phase 4 proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/run-phase4.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-phase4.test.mjs
          node artifacts/api-server/dist/quant-v4/geometry-phase4.test.mjs
      - name: Export Geometry Phase 4 review evidence
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/GEO-002/discovery/phase4-review-export.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-phase4-review-export.mjs
          (cd artifacts/api-server && node dist/quant-v4/geometry-phase4-review-export.mjs)
      - name: Upload Geometry Phase 4 review evidence
        uses: actions/upload-artifact@v4
        with:
          name: geometry-phase4-circle-temporary-prototype-review
          path: artifacts/api-server/dist/quant-v4/geometry-phase4-review
          if-no-files-found: error
          retention-days: 30
