name: Temporary PRT-001 E10 English editorial validation

on:
  pull_request:
    branches:
      - audit/prt-001-rap003-ownership-e9
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/**'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-003/**'
      - '.github/workflows/prt-001-e10-validation.yml'

permissions:
  contents: read

jobs:
  validate-prt-001-e10:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck PRT-001 package
        run: |
          cat > artifacts/api-server/tsconfig.prt001-e10.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": { "noEmit": true },
            "include": [
              "src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/foundation/**/*.ts",
              "src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/index.ts",
              "src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/prt-001.test.ts",
              "src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/prt-001-freeze-audit.ts",
              "src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/prt-001-rap003-ownership-audit.ts"
            ],
            "exclude": []
          }
          EOF
          pnpm --dir artifacts/api-server exec tsc -p tsconfig.prt001-e10.json --noEmit

      - name: Run full PRT-001 seeded corpus
        run: pnpm --dir artifacts/api-server run test:prt-001

      - name: Re-run E9 ownership gate
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/prt-001-rap003-ownership-audit.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/quant-v4/prt-001-rap003-ownership-audit.mjs
          node artifacts/api-server/dist/quant-v4/prt-001-rap003-ownership-audit.mjs

      - name: Run full PRT-001 freeze audit with E10 editorial gate
        run: pnpm --dir artifacts/api-server run audit:prt-001
