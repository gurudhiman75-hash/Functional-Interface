name: Verify TRG-002 Exam Readiness V4

on:
  push:
    branches:
      - feat/trg-002-localization-hi-pa-v1
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/**
      - .github/workflows/trg-002-exam-readiness-v4.yml
  pull_request:
    branches:
      - feat/trg-002-mvp48-freeze
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/**
      - .github/workflows/trg-002-exam-readiness-v4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Targeted Trigonometry TypeScript compile
        run: |
          cat > artifacts/api-server/tsconfig.trg002-v4.json <<'JSON'
          {"extends":"./tsconfig.json","compilerOptions":{"noEmit":true},"include":["src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/**/*.ts"],"exclude":["src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/question-studio-storage.test.ts"],"references":[]}
          JSON
          pnpm exec tsc -p artifacts/api-server/tsconfig.trg002-v4.json --pretty false
      - name: Protect historical frozen English 96 authority
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/production-freeze-96.test.ts
      - name: Verify V4 scenario catalog and live blocker audit
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/exam-readiness-v4-audit.test.ts
      - name: Verify QL013 exact-math repair
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/exam-readiness-v4-candidate.test.ts
      - name: Verify canonical V4 redesigns
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/exam-readiness-v4-canonical.test.ts
      - name: Verify Wave1 physical scenario text
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/exam-readiness-v4-wave1-surface.test.ts
      - name: Verify V4 stem variety and repeated-setup guard
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/exam-readiness-v4-stem-variety.test.ts
      - name: Verify rooftop and bridge physical-support diagrams
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/exam-readiness-v4-physical-support.test.ts
      - name: Verify river-platform state, math and diagrams
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/exam-readiness-v4-river.test.ts
      - name: Verify Wave2 natural physical measurements
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/exam-readiness-v4-natural-measurements.test.ts
      - name: Verify Wave3 structural scenarios
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/exam-readiness-v4-scenario-wave3.test.ts
      - name: Verify Wave4 structural scenarios
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/exam-readiness-v4-scenario-wave4.test.ts
      - name: Verify 2304 V4 candidate cases
        run: |
          pnpm dlx tsx -e '
            import { generateTrg002V4CandidateQuestion } from "./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/exam-readiness-v4-candidate.ts";
            let total=0;
            for(let n=1;n<=96;n++){
              const id=`TRG-002-QL-${String(n).padStart(3,"0")}`;
              for(const locale of ["hi-IN","pa-IN"]){
                for(let s=1;s<=12;s++){
                  const q=generateTrg002V4CandidateQuestion(id,`trg002-v4-${s}`,locale);
                  const text=[q.stem,q.explanation.keyRule,...q.explanation.steps.map((x:any)=>x.body),q.explanation.shortcut,...q.explanation.traps].join(" ");
                  if(/√\d+\.\d+/.test(text)) throw new Error(`${id}:${locale}: decimal radicand remains`);
                  if(q.activationAuthorized!==false||q.freezeStatus!=="NOT_FROZEN") throw new Error(`${id}:${locale}: lifecycle lock regression`);
                  total++;
                }
              }
            }
            if(total!==2304) throw new Error(`Expected 2304 V4 candidate cases, got ${total}`);
            console.log(`TRG002_V4_CANDIDATE_PASS total=${total}`);
          '
      - name: Export tri-language visual review pack
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/export-exam-readiness-v4-review.ts
      - name: Verify V4 review artifact
        run: |
          JSON=artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/review-artifacts/exam-readiness-v4/TRG-002-V4-EXAM-READINESS-REVIEW.json
          HTML=artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/review-artifacts/exam-readiness-v4/TRG-002-V4-EXAM-READINESS-REVIEW.html
          test -s "$JSON" && test -s "$HTML"
          node - "$JSON" <<'NODE'
          const fs=require('fs');
          const pack=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(pack.records.length!==96) throw new Error(`Expected 96 tri-language records, got ${pack.records.length}`);
          if(pack.records.filter((r)=>r.v4CanonicalOverride).length!==6) throw new Error('Expected 6 pre-Wave2 V4 canonical overrides');
          if(pack.records.filter((r)=>r.v4NaturalMeasurementOverride).length!==19) throw new Error('Expected 19 Wave2 natural-measurement overrides');
          if(pack.records.filter((r)=>r.v4PhysicalSupportMigrated).length!==3) throw new Error('Expected 3 runtime support-state migrations after QL016/017 become natively supported Wave2 canonicals');
          if(pack.audit.blockers.surdPhysicalGivenQlIds.length!==0) throw new Error(`Expected zero V4 surd physical givens, got ${pack.audit.blockers.surdPhysicalGivenQlIds.length}`);
          if(pack.audit.blockers.shallowHardSolutionQlIds.length!==0) throw new Error(`Expected zero shallow Hard solutions, got ${pack.audit.blockers.shallowHardSolutionQlIds.length}`);
          if(pack.audit.scenarioCatalog.shells<38) throw new Error(`Expected at least 38 V4 structural scenario shells, got ${pack.audit.scenarioCatalog.shells}`);
          const q21=pack.records.find((r)=>r.qlId==='TRG-002-QL-021');
          if(!q21||!q21.english.stem.includes('pedestrian overbridge')) throw new Error('QL021 English V4 review surface must use the pedestrian-overbridge scenario');
          if(!q21.solutionDiagram.segments.some((s)=>s.id==='v4-bridge-deck')) throw new Error('QL021 review diagram must include the bridge deck segment');
          const q53=pack.records.find((r)=>r.qlId==='TRG-002-QL-053');
          if(!q53||q53.solutionDiagram.strategy!=='TOWER_EXTENSION') throw new Error('QL053 review diagram must use the tower-extension strategy');
          for(const row of pack.records){
            if(!('solutionDiagram' in row)) throw new Error(`${row.qlId}: missing solutionDiagram`);
            if(!('diagramEvidence' in row)) throw new Error(`${row.qlId}: missing diagramEvidence`);
            if(row.v4NaturalMeasurementOverride && (row.english.stem.includes('√')||row.hindi.stem.includes('√')||row.punjabi.stem.includes('√'))) throw new Error(`${row.qlId}: Wave2 review stem still exposes a surd physical measurement`);
            if(row.lifecycle.multilingualFreezeGranted!==false||row.lifecycle.activationAuthorized!==false) throw new Error(`${row.qlId}: V4 lifecycle lock regression`);
          }
          console.log(`TRG002_V4_TRI_LANGUAGE_VISUAL_PACK_PASS qls=${pack.records.length} catalog=${pack.audit.scenarioCatalog.shells} canonicalOverrides=6 naturalMeasurementOverrides=19 physicalSupportMigrations=3 wave1=11/11 surdPhysicalGivens=0 shallowHardSolutions=0`);
          NODE
      - name: Upload V4 audit and review pack
        uses: actions/upload-artifact@v4
        with:
          name: trg-002-exam-readiness-v4
          path: artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/review-artifacts/exam-readiness-v4/
          if-no-files-found: error
          retention-days: 14
