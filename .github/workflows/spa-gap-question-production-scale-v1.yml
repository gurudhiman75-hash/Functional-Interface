name: Validate SPA-FND-001 Gap Question Production Scale V1

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/foundation/spatial/**"
      - "artifacts/api-server/src/reasoning-v1/tests/spatial-gap-question-production-scale-v1.test.ts"
      - ".github/workflows/spa-gap-question-production-scale-v1.yml"
  workflow_dispatch:

jobs:
  validate-gap-question-production-scale-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Revalidate production authority
        run: node artifacts/api-server/src/reasoning-v1/foundation/spatial/validate-production-authority-v1.mjs
      - name: Revalidate source saturation audit
        run: node artifacts/api-server/src/reasoning-v1/foundation/spatial/validate-source-saturation-audit-v1.mjs
      - name: Bundle learner synthesis regression
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-gap-question-synthesis-editorial-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-gap-question-synthesis-editorial-v1.test.mjs
      - name: Revalidate 760-question learner synthesis
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-gap-question-synthesis-editorial-v1.test.mjs
      - name: Bundle production scale proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-gap-question-production-scale-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-gap-question-production-scale-v1.test.mjs
      - name: Run 3800-question material production scale proof
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-gap-question-production-scale-v1.test.mjs
      - name: Upload learner production scale evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-gap-question-production-scale-v1-review
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/spa-gap-question-production-scale-v1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-gap-question-production-scale-v1-review.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-gap-question-production-scale-v1-review.html
          if-no-files-found: error
