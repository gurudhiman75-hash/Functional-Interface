name: Validate SYL-001 Banking possibility V4 complete diagrams

on:
  pull_request:
    branches:
      - audit/syl-001-source-profile-freeze
      - feat/syl-001-learner-v4
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-four-term-venn-v4.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-four-term-accessibility-v4-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-review-question-v4.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-complete-diagram-v4-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-banking-possibility-review-v4.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-review-question-v3.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-combined-diagram-v3.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-supplemental-venn-v3.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-shell-v1.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/scenarios.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/term-assignment.ts
      - .github/workflows/reasoning-syl-001-bank-possibility-v4-complete-diagrams.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-syl-001-bank-possibility-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-v4-complete-diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle V4 complete-diagram audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-complete-diagram-v4-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-bank-possibility-complete-diagram-v4-audit.test.mjs

      - name: Run V4 complete-diagram audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-complete-diagram-v4-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-complete-diagram-v4-audit.log

      - name: Bundle four-term accessibility audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-four-term-accessibility-v4-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-bank-possibility-four-term-accessibility-v4-audit.test.mjs

      - name: Run four-term accessibility audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-four-term-accessibility-v4-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-four-term-accessibility-v4-audit.log

      - name: Bundle V4 human-review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-banking-possibility-review-v4.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/export-syl-001-bank-possibility-review-v4.mjs

      - name: Generate V4 complete multilingual review pack
        run: node artifacts/api-server/dist/reasoning-v1/export-syl-001-bank-possibility-review-v4.mjs

      - name: Upload V4 audit and review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syl-001-bank-possibility-v4-complete-diagrams
          path: |
            artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-complete-diagram-v4-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-four-term-accessibility-v4-audit.log
            dist/reasoning-v1/syl-001-bank-possibility-review-v4/**
          if-no-files-found: error
          retention-days: 30
