name: Validate HIS-001 CP020 Review

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/indian-history/medieval-economy-society/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: history-his-cp020-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-his-cp020:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run HIS-CP-020 qualification gate
        run: |
          mkdir -p artifacts/api-server/dist/history
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/indian-history/medieval-economy-society/his-cp020-review-v1.test.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/history/his-cp020-review-v1.test.mjs
          node artifacts/api-server/dist/history/his-cp020-review-v1.test.mjs
      - name: Materialize HIS-CP-020 review artifact
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/indian-history/medieval-economy-society/his-cp020-export-review-v1.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/history/his-cp020-export-review-v1.mjs
          cd artifacts/api-server
          node dist/history/his-cp020-export-review-v1.mjs
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: HIS-001-CP020-REVIEW-BATCH-V1
          path: artifacts/api-server/dist/history-review/HIS-001-CP020-V1/
          if-no-files-found: error
          retention-days: 30
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
