name: Validate MEN-CP-007 prototype foundation

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/**
      - .github/workflows/men-002-cp007-prototype-foundation.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-002-cp007-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-men-cp007:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle MEN-CP-007 prototype proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/foundation/runtime.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/men-002-cp007-foundation.test.mjs

      - name: Run MEN-CP-007 prototype proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/men-002-cp007-foundation.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/men-002-cp007-foundation.log

      - name: Bundle MEN-CP-007 review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/foundation/review-export.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/men-002-cp007-review-export.mjs

      - name: Generate MEN-CP-007 review export
        working-directory: artifacts/api-server
        run: node dist/quant-v4/men-002-cp007-review-export.mjs

      - name: Upload MEN-CP-007 proof and review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-002-cp007-prototype-foundation
          path: |
            artifacts/api-server/dist/quant-v4/men-002-cp007-foundation.log
            artifacts/api-server/dist/quant-v4/men-002-cp007-review/**
          if-no-files-found: error
          retention-days: 7
