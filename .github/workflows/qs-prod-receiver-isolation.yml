name: Validate isolated QS production receiver
on:
  pull_request:
    branches: [New-main]
    paths:
      - 'artifacts/api-server/src/async-task-receiver-prod-standalone.ts'
      - 'artifacts/api-server/src/question-studio/prod-one-run-canary-guard.mjs'
      - 'artifacts/api-server/src/question-studio/async-task-lease-claim.ts'
      - 'artifacts/api-server/build-qs-prod-task-receiver.mjs'
      - 'Dockerfile.examtree-qs-prod-task-receiver'
      - 'cloudbuild.examtree-qs-prod-task-receiver.yaml'
      - 'tests/qs-prod-receiver-isolation.test.mjs'
      - 'tests/qs-prod-one-run-canary-guard.test.mjs'
      - 'tests/qs-prod-receiver-disabled-boot.test.mjs'
permissions:
  contents: read
concurrency:
  group: qs-prod-receiver-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: node --test tests/qs-prod-receiver-isolation.test.mjs
      - run: node --test tests/qs-prod-one-run-canary-guard.test.mjs
      - run: pnpm install --frozen-lockfile --filter @workspace/api-server...
      - name: Compile production-only receiver
        run: node artifacts/api-server/build-qs-prod-task-receiver.mjs
      - name: Confirm disabled receiver boots without DATABASE_URL and returns task 503
        run: node --test tests/qs-prod-receiver-disabled-boot.test.mjs
