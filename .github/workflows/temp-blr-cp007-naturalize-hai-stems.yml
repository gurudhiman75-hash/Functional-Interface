name: Temporary BLR-CP-007 Hai Stem Naturalizer

on:
  push:
    branches:
      - localize/blr-001-cp007-hi-pa-v1
    paths:
      - .github/workflows/temp-blr-cp007-naturalize-hai-stems.yml

permissions:
  contents: write

jobs:
  patch-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Check out localisation branch
        uses: actions/checkout@v4
        with:
          ref: localize/blr-001-cp007-hi-pa-v1
          fetch-depth: 0

      - name: Naturalize finite hai clauses
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/localization/cp007-localizer.ts")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "`सही कूटित विकल्प चुनिए, जिससे ${clause}।`": "`सही कूटित विकल्प चुनिए, जिससे यह सिद्ध होता है कि ${clause}।`",
              "`ਸਹੀ ਕੋਡਿਤ ਵਿਕਲਪ ਚੁਣੋ, ਜਿਸ ਨਾਲ ${clause}।`": "`ਸਹੀ ਕੋਡਿਤ ਵਿਕਲਪ ਚੁਣੋ, ਜਿਸ ਨਾਲ ਇਹ ਸਾਬਤ ਹੁੰਦਾ ਹੈ ਕਿ ${clause}।`",
              "`? की जगह कौन-सा संकेत आएगा, ताकि ${clause}?`": "`? की जगह कौन-सा संकेत आएगा, जिससे यह सिद्ध होता है कि ${clause}?`",
              "`? ਦੀ ਥਾਂ ਕਿਹੜਾ ਸੰਕੇਤ ਆਵੇਗਾ, ਤਾਂ ਜੋ ${clause}?`": "`? ਦੀ ਥਾਂ ਕਿਹੜਾ ਸੰਕੇਤ ਆਵੇਗਾ, ਜਿਸ ਨਾਲ ਇਹ ਸਾਬਤ ਹੁੰਦਾ ਹੈ ਕਿ ${clause}?`",
              "`रिक्त स्थानों के क्रम में दो संकेत चुनिए, ताकि ${clause}।`": "`रिक्त स्थानों के क्रम में दो संकेत चुनिए, जिससे यह सिद्ध होता है कि ${clause}।`",
              "`ਖਾਲੀ ਥਾਵਾਂ ਦੇ ਕ੍ਰਮ ਵਿੱਚ ਦੋ ਸੰਕੇਤ ਚੁਣੋ, ਤਾਂ ਜੋ ${clause}।`": "`ਖਾਲੀ ਥਾਵਾਂ ਦੇ ਕ੍ਰਮ ਵਿੱਚ ਦੋ ਸੰਕੇਤ ਚੁਣੋ, ਜਿਸ ਨਾਲ ਇਹ ਸਾਬਤ ਹੁੰਦਾ ਹੈ ਕਿ ${clause}।`",
              "`? की जगह कौन-सा व्यक्ति आएगा, ताकि ${clause}?\\nउम्मीदवार: ${candidates}`": "`? की जगह कौन-सा व्यक्ति आएगा, जिससे यह सिद्ध होता है कि ${clause}?\\nउम्मीदवार: ${candidates}`",
              "`? ਦੀ ਥਾਂ ਕਿਹੜਾ ਵਿਅਕਤੀ ਆਵੇਗਾ, ਤਾਂ ਜੋ ${clause}?\\nਉਮੀਦਵਾਰ: ${candidates}`": "`? ਦੀ ਥਾਂ ਕਿਹੜਾ ਵਿਅਕਤੀ ਆਵੇਗਾ, ਜਿਸ ਨਾਲ ਇਹ ਸਾਬਤ ਹੁੰਦਾ ਹੈ ਕਿ ${clause}?\\nਉਮੀਦਵਾਰ: ${candidates}`",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence, found {count}: {old}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/temp-blr-cp007-naturalize-hai-stems.yml").unlink()
          PY

      - name: Commit natural wording
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/localization/cp007-localizer.ts
          git add -u .github/workflows/temp-blr-cp007-naturalize-hai-stems.yml
          git commit -m "fix(reasoning): naturalize BLR-CP-007 finite hai stems"
          git push origin HEAD:localize/blr-001-cp007-hi-pa-v1
