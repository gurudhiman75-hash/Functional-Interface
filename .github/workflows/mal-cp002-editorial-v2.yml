name: Validate MAL-CP-002 editorial pedagogy V2

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp002-authoring-v2*.ts
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp002-editorial-v2*.ts
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp002-prototype-runtime.ts
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-cp002-editorial-v2-audit.ts
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/question-studio-adapter.ts
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/MAL-CP-002/MAL-CP-002-EDITORIAL-PEDAGOGY-V2.md
      - .github/workflows/mal-cp002-editorial-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-mal-cp002-editorial-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-mal-cp002-editorial-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle MAL-CP-002 editorial V2 audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-cp002-editorial-v2-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/mal-001-cp002-editorial-v2-audit.mjs
      - name: Run MAL-CP-002 editorial V2 audit
        shell: bash
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/mal-001-cp002-editorial-v2-audit.mjs 2>&1 | tee dist/quant-v4/mal-001-cp002-editorial-v2-audit.log
      - name: Upload MAL-CP-002 editorial V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mal-cp002-editorial-v2-evidence
          path: |
            artifacts/api-server/dist/quant-v4/mal-001-cp002-editorial-v2-audit.log
            artifacts/api-server/dist/quant-v4/mal-cp002-editorial-v2-review.json
            artifacts/api-server/dist/quant-v4/mal-cp002-editorial-v2-review.md
          if-no-files-found: error
          retention-days: 14
