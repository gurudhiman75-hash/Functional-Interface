name: Validate INT-CP-003 Hindi Punjabi localisation

on:
  pull_request:
    branches:
      - fix/int-cp003-authority-consolidation
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp003-localization-*.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp003-localized-*.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp003-localization-*.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp003-localized-*.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp003-english-*.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp003-english-freeze-audit.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/INT-CP-003/**"
      - ".github/workflows/int-cp003-hi-pa-localisation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-int-cp003-hi-pa-localisation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle inherited English freeze audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp003-english-freeze-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp003-english-freeze-audit.mjs

      - name: Run inherited English freeze audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp003-english-freeze-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp003-english-freeze-audit.log

      - name: Bundle localisation foundation audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp003-localization-foundation-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp003-localization-foundation-audit.mjs

      - name: Run localisation foundation audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp003-localization-foundation-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp003-localization-foundation-audit.log

      - name: Bundle localized presentation Wave 1 audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp003-localized-presentation-wave1-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp003-localized-presentation-wave1-audit.mjs

      - name: Run localized presentation Wave 1 audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp003-localized-presentation-wave1-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp003-localized-presentation-wave1-audit.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Verify localisation evidence
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          freeze=artifacts/api-server/dist/quant-v4/int-cp003-approved-english-freeze/int-cp003-approved-english-freeze-summary.json
          foundation=artifacts/api-server/dist/quant-v4/int-cp003-localization-foundation/int-cp003-localization-foundation-summary.json
          wave1=artifacts/api-server/dist/quant-v4/int-cp003-localized-presentation-wave1/int-cp003-localized-presentation-wave1-summary.json
          grep -q 'PASS_INT_CP003_APPROVED_ENGLISH_FREEZE' artifacts/api-server/dist/quant-v4/int-001-cp003-english-freeze-audit.log
          grep -q 'PASS_INT_CP003_LOCALIZATION_FOUNDATION' artifacts/api-server/dist/quant-v4/int-001-cp003-localization-foundation-audit.log
          grep -q 'PASS_INT_CP003_LOCALIZED_PRESENTATION_WAVE1' artifacts/api-server/dist/quant-v4/int-001-cp003-localized-presentation-wave1-audit.log
          test -f "$freeze"
          test -f "$foundation"
          test -f "$wave1"
          grep -q '"status": "LOCALISATION_FOUNDATION_READY"' "$foundation"
          grep -q '"localizationVersion": "INT-CP-003-HI-PA-LOCALISATION-v1"' "$foundation"
          grep -q '"canonicalFreezeId": "INT-CP-003-EN-v1-frozen"' "$foundation"
          grep -q '"termChecks": 36' "$foundation"
          grep -q '"phraseChecks": 32' "$foundation"
          grep -q '"placeholderGuardChecks": 8' "$foundation"
          grep -q '"status": "PRESENTATION_WAVE1_READY"' "$wave1"
          grep -q '"qlRange": "INT-QL-053..INT-QL-058"' "$wave1"
          grep -q '"qlCount": 6' "$wave1"
          grep -q '"questions": 1200' "$wave1"
          grep -q '"representationCoverage": 6' "$wave1"
          grep -q '"mathematicalGivensPreserved": true' "$wave1"
          grep -q '"representationPreserved": true' "$wave1"
          grep -q '"stemFamilyPreserved": true' "$wave1"
          grep -q '"unknownOwnershipPreserved": true' "$wave1"
          grep -q '"enabled": false' "$wave1"
          grep -q '"registrationStatus": "NOT_REGISTERED"' "$wave1"
          grep -q '"publiclyPublishable": false' "$wave1"

      - name: Upload localisation Wave 1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-cp003-hi-pa-localisation-wave1
          path: |
            artifacts/api-server/dist/quant-v4/int-001-cp003-english-freeze-audit.log
            artifacts/api-server/dist/quant-v4/int-001-cp003-localization-foundation-audit.log
            artifacts/api-server/dist/quant-v4/int-001-cp003-localized-presentation-wave1-audit.log
            artifacts/api-server/dist/quant-v4/int-cp003-approved-english-freeze/**
            artifacts/api-server/dist/quant-v4/int-cp003-localization-foundation/**
            artifacts/api-server/dist/quant-v4/int-cp003-localized-presentation-wave1/**
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/INT-CP-003/INT-CP-003-HI-PA-LOCALISATION-PLAN.md
          if-no-files-found: error
          retention-days: 30
