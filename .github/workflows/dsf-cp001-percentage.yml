name: Validate DSF-CP-001 Percentage production

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-001/cp001-percentage-*.ts
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-001-MANIFEST-AMENDMENT-CP001-WAVE3.md
      - .github/workflows/dsf-cp001-percentage.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsf-cp001-percentage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dsf-cp001-percentage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle Percentage production proof and review exporter
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/dsf
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-001/cp001-percentage-runtime.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp001-percentage-runtime.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-001/cp001-percentage-review-export.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp001-percentage-review-export.mjs
      - name: Run Percentage production proof
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/dsf/dsf-cp001-percentage-runtime.test.mjs
      - name: Build Percentage review export
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/dsf/dsf-cp001-percentage-review-export.mjs
      - name: Upload Percentage review pack
        uses: actions/upload-artifact@v4
        with:
          name: dsf-cp001-percentage-review
          path: |
            artifacts/api-server/dist/reasoning-v1/dsf/dsf-cp001-percentage-review.html
            artifacts/api-server/dist/reasoning-v1/dsf/dsf-cp001-percentage-review.json
          if-no-files-found: error
