name: Validate INT-001 Wave04 English Authority V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/**'

concurrency:
  group: int-001-wave04-english-authority-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-int-001-wave04-english-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Wave04 English learner-authority audit
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-wave04-english-authority-v1-audit.ts | tee int-001-wave04-english-authority-v1.log
          grep -q 'PASS_INT_001_WAVE04_ENGLISH_AUTHORITY_V1_AUDIT' int-001-wave04-english-authority-v1.log

      - name: Export English human-review pack
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-wave04-english-review-export.ts | tee int-001-wave04-english-review-export.log
          grep -q 'PASS_INT_001_WAVE04_ENGLISH_REVIEW_EXPORT' int-001-wave04-english-review-export.log
          test -f int-001-wave04-english-review/INT-001-WAVE04-ENGLISH-REVIEW.md
          test -f int-001-wave04-english-review/INT-001-WAVE04-ENGLISH-REVIEW.json

      - name: Preserve exact-head Wave03 permanent allocation
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-wave03-permanent-allocation-v1-audit.ts | tee int-001-wave04-wave03-regression.log
          grep -q 'PASS_INT_001_WAVE03_PERMANENT_ALLOCATION_V1_AUDIT' int-001-wave04-wave03-regression.log

      - name: Preserve Wave02 allocation readiness
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-comprehensive-gap-wave02-allocation-readiness-audit.ts | tee int-001-wave04-wave02-regression.log
          grep -q 'PASS_INT_001_COMPREHENSIVE_GAP_WAVE02_ALLOCATION_READINESS_AUDIT' int-001-wave04-wave02-regression.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Record exact validation head
        shell: bash
        run: |
          echo "validated_head=$(git rev-parse HEAD)" | tee int-001-wave04-english-authority-v1-head.log
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Upload evidence and review pack
        uses: actions/upload-artifact@v4
        with:
          name: int-001-wave04-english-authority-v1
          path: |
            int-001-wave04-english-authority-v1.log
            int-001-wave04-english-review-export.log
            int-001-wave04-wave03-regression.log
            int-001-wave04-wave02-regression.log
            int-001-wave04-english-authority-v1-head.log
            int-001-wave04-english-review/**
          retention-days: 30
