name: Validate QS staging dispatcher entrypoint
on:
  pull_request:
    branches: [New-main]
    paths:
      - 'artifacts/api-server/src/question-studio/async-cloud-tasks-dispatch-once.ts'
      - 'artifacts/api-server/src/question-studio/async-cloud-tasks-dispatcher.ts'
      - 'artifacts/api-server/src/question-studio/async-cloud-tasks-transport.ts'
      - 'artifacts/api-server/build-qs-staging-dispatcher.mjs'
      - 'Dockerfile.examtree-qs-staging-dispatcher'
      - 'cloudbuild.examtree-qs-staging-dispatcher.yaml'
      - 'docs/examtree-qs-staging-dispatcher-deployment.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qs-staging-dispatch-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build standalone one-shot staging dispatcher
        run: node artifacts/api-server/build-qs-staging-dispatcher.mjs
      - name: Verify isolated executable and fail-closed staging gates
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {readFileSync,statSync} from "node:fs";
          const file="artifacts/api-server/dist/qs-staging-dispatch-once.mjs";
          assert.ok(statSync(file).size>1000,"one-shot dispatcher output exists");
          const compiled=readFileSync(file,"utf8");
          const src=readFileSync("artifacts/api-server/src/question-studio/async-cloud-tasks-dispatch-once.ts","utf8");
          for(const gate of [
            "EXAMTREE_API_STAGING",
            "EXAMTREE_QUESTION_STUDIO_STAGING_TASK_ACCEPTANCE_APPROVED",
            "EXAMTREE_QUESTION_STUDIO_TASK_DISPATCH_ENABLED",
            "EXAMTREE_QUESTION_STUDIO_TASK_RECEIVER_VERIFIED"
          ])assert.ok(src.includes(gate),gate+" missing");
          assert.ok(src.includes("examtree-qs-staging"),"isolated queue guard missing");
          assert.ok(src.includes("STAGING_OUTBOX_EMPTY"),"empty queue exits cleanly");
          assert.ok(compiled.includes("STAGING_DISPATCH_FAILED"),"failure path absent");
          console.log("PASS: dedicated one-shot staging job builds and remains gated");
          NODE
