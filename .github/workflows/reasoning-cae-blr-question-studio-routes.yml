name: Validate CAE BLR Question Studio routes

on:
  pull_request:
    branches: [New-main]
    paths:
      - "artifacts/api-server/src/question-studio/engines/reasoning-v1-adapter.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Cause-and-Effect/CAE-001/question-studio-integration.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/question-studio-chapter-integration.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/question-studio-standard-integration.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/question-studio-post-closure-proof.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/blr-001-post-closure-audit-20261004.test.ts"
      - "artifacts/api-server/src/reasoning-v1/tests/reasoning-cae-blr-question-studio-routes-20261002.test.ts"
  workflow_dispatch:

concurrency:
  group: reasoning-cae-blr-routes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/tests/reasoning-cae-blr-question-studio-routes-20261002.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/reasoning-cae-blr-question-studio-routes-20261002.test.mjs
      - run: node artifacts/api-server/dist/reasoning-v1/reasoning-cae-blr-question-studio-routes-20261002.test.mjs
      - run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Blood-Relations/BLR-001/blr-001-post-closure-audit-20261004.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/blr-001-post-closure-audit-20261004.test.mjs
      - run: node artifacts/api-server/dist/reasoning-v1/blr-001-post-closure-audit-20261004.test.mjs
      - run: pnpm --dir artifacts/api-server build
