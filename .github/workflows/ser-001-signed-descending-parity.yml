name: Validate SER-001 signed descending parity

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-NUMERIC-SIGNED-PARITY/**
      - .github/workflows/ser-001-signed-descending-parity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-signed-descending-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-signed-descending-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/signed-descending-parity

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Run signed-descending parity audit
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-NUMERIC-SIGNED-PARITY
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/signed-descending-parity
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/ser-signed-descending-parity.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-signed-descending-parity.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-signed-descending-parity.test.mjs") \
            | tee "$EVIDENCE/parity-audit.json"

      - name: Run post-parity chapter gap audit
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-NUMERIC-SIGNED-PARITY
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/signed-descending-parity
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/ser-post-parity-gap-audit.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-post-parity-gap-audit.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-post-parity-gap-audit.test.mjs") \
            | tee "$EVIDENCE/post-parity-gap-audit.json"
          cp "artifacts/api-server/$ROOT/ser-signed-descending-parity-report.md" \
            "$EVIDENCE/ser-signed-descending-parity-report.md"

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-signed-descending-parity
          path: artifacts/api-server/dist/reasoning-v1/ser-001/signed-descending-parity
          if-no-files-found: error
          retention-days: 30
