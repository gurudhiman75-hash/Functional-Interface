name: Validate NUM-CP-014 Hindi Punjabi localization

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-014/**"
  workflow_dispatch:

concurrency:
  group: num-cp014-localization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-num-cp014-localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle localization audits
        shell: bash
        run: |
          set -euo pipefail
          root="src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-014/localization"
          pnpm --dir artifacts/api-server exec esbuild "$root/runtime-parity.test.ts" --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp014-localization-parity.mjs
          pnpm --dir artifacts/api-server exec esbuild "$root/runtime-human-quality.test.ts" --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp014-localization-human-quality.mjs
      - name: Run semantic parity audit
        run: node artifacts/api-server/dist/quant-v4/num-cp014-localization-parity.mjs
      - name: Run human-quality audit
        run: node artifacts/api-server/dist/quant-v4/num-cp014-localization-human-quality.mjs
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
