name: Validate SYL-001 V5 exam-readiness remediation

on:
  pull_request:
    branches:
      - feat/syl-001-learner-v4
      - feat/syl-001-structured-proof-v3
      - feat/syl-001-full-runtime
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/options.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/ql-registry.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-types.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-dead-option-remediation.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-diagram-completion.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-exact-venn.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-exact-venn-safety.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-editorial-polish.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-model-target-remediation.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-review-status.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-viewport-contract.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/generator-v5.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-single-answer-venn-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-dead-option-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-editorial-polish.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-model-target-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-review-status-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-viewport-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-review-v5.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-viewport-review-v5.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/SYL-001-V5-EXAM-READINESS-REMEDIATION.md
      - .github/workflows/reasoning-syl-001-v5-remediation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-syl-001-v5-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-v5-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle V5 remediation audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-v5-audit.test.mjs

      - name: Run exhaustive V5 remediation audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-v5-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-v5-audit.log

      - name: Bundle exact-topology Venn audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-single-answer-venn-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-v5-single-answer-venn-audit.test.mjs

      - name: Run exhaustive exact-topology Venn audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-v5-single-answer-venn-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-v5-single-answer-venn-audit.log

      - name: Bundle V5 editorial polish audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-editorial-polish.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-v5-editorial-polish.test.mjs

      - name: Run exhaustive V5 editorial polish audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-v5-editorial-polish.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-v5-editorial-polish.log

      - name: Bundle V5 model-target audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-model-target-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-v5-model-target-audit.test.mjs

      - name: Run exhaustive V5 model-target audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-v5-model-target-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-v5-model-target-audit.log

      - name: Bundle V5 dead-option audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-dead-option-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-v5-dead-option-audit.test.mjs

      - name: Run exhaustive V5 dead-option audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-v5-dead-option-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-v5-dead-option-audit.log

      - name: Bundle V5 approval-status audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-review-status-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-v5-review-status-audit.test.mjs

      - name: Run exhaustive V5 approval-status audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-v5-review-status-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-v5-review-status-audit.log

      - name: Bundle V5 viewport audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-viewport-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-v5-viewport-audit.test.mjs

      - name: Run exhaustive V5 viewport audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-v5-viewport-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-v5-viewport-audit.log

      - name: Bundle V5 review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-review-v5.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-export-review-v5.mjs

      - name: Generate V5 human-review pack
        env:
          SYL_REVIEW_V5_DIR: artifacts/api-server/dist/reasoning-v1/syl-001-review-v5
        run: node artifacts/api-server/dist/reasoning-v1/syl-001-export-review-v5.mjs

      - name: Bundle V5 viewport exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-viewport-review-v5.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-export-viewport-v5.mjs

      - name: Generate V5 viewport-review pack
        env:
          SYL_VIEWPORT_V5_DIR: artifacts/api-server/dist/reasoning-v1/syl-001-viewport-v5
        run: node artifacts/api-server/dist/reasoning-v1/syl-001-export-viewport-v5.mjs

      - name: Upload V5 remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syl-001-v5-exam-readiness-remediation
          path: |
            artifacts/api-server/dist/reasoning-v1/syl-001-v5-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-v5-single-answer-venn-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-v5-editorial-polish.log
            artifacts/api-server/dist/reasoning-v1/syl-001-v5-model-target-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-v5-dead-option-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-v5-review-status-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-v5-viewport-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-review-v5/**
            artifacts/api-server/dist/reasoning-v1/syl-001-viewport-v5/**
          if-no-files-found: error
          retention-days: 30
