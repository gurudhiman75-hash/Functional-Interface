name: Stage PNL-001 Canonical Production Payload

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/export-canonical-production-payload.ts
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/stage-canonical-production-payload.ts
      - .github/workflows/pnl-001-export-production-payload.yml

permissions:
  contents: read

jobs:
  stage-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle payload exporter
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/export-canonical-production-payload.ts \
            --bundle --platform=node --format=esm \
            --outfile=/tmp/pnl-001-export-production-payload.mjs

      - name: Generate and validate 558 canonical payloads
        env:
          PNL_PRODUCTION_PAYLOAD_PATH: /tmp/pnl-001-canonical-production-payload.json
        run: node /tmp/pnl-001-export-production-payload.mjs

      - name: Bundle restricted payload stager
        run: |
          mkdir -p artifacts/api-server/dist
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/stage-canonical-production-payload.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/pnl-001-stage-canonical-production-payload.mjs

      - name: Stage payloads in restricted production table
        run: |
          CONNECTION_PASSWORD='42d8c5f1a9e374b60c7d2f8e5a1b9634'
          echo "::add-mask::$CONNECTION_PASSWORD"
          export DATABASE_URL="postgresql://pnl_payload_stager:${CONNECTION_PASSWORD}@ep-polished-king-atj47i5y-pooler.c-9.us-east-1.aws.neon.tech/neondb?channel_binding=require&sslmode=require"
          export PNL_PRODUCTION_PAYLOAD_PATH=/tmp/pnl-001-canonical-production-payload.json
          node artifacts/api-server/dist/pnl-001-stage-canonical-production-payload.mjs

      - name: Upload canonical payload evidence
        uses: actions/upload-artifact@v4
        with:
          name: pnl-001-canonical-production-payload
          path: /tmp/pnl-001-canonical-production-payload.json
          retention-days: 1
          if-no-files-found: error
