name: Validate PNL-001 Canonical Production Import

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/export-canonical-production-payload.ts
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/import-canonical-question-bank.ts
      - .github/workflows/pnl-001-export-production-payload.yml

permissions:
  contents: read

jobs:
  validate-import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle payload exporter
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/export-canonical-production-payload.ts \
            --bundle --platform=node --format=esm \
            --outfile=/tmp/pnl-001-export-production-payload.mjs

      - name: Generate and validate 558 canonical payloads
        env:
          PNL_PRODUCTION_PAYLOAD_PATH: /tmp/pnl-001-canonical-production-payload.json
        run: node /tmp/pnl-001-export-production-payload.mjs

      - name: Bundle application importer
        run: |
          mkdir -p artifacts/api-server/dist
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/import-canonical-question-bank.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/pnl-001-import-canonical-question-bank.mjs

      - name: Import through ExamTree conversion transactions on validation branch
        run: |
          CONNECTION_PASSWORD='7b8f5f3d6a0c4e1b9d2a7c6f8e3b1a4d'
          echo "::add-mask::$CONNECTION_PASSWORD"
          export DATABASE_URL="postgresql://pnl_import_validator:${CONNECTION_PASSWORD}@ep-steep-sunset-at1p6oaz-pooler.c-9.us-east-1.aws.neon.tech/neondb?channel_binding=require&sslmode=require"
          node artifacts/api-server/dist/pnl-001-import-canonical-question-bank.mjs

      - name: Upload canonical payload evidence
        uses: actions/upload-artifact@v4
        with:
          name: pnl-001-canonical-production-payload
          path: /tmp/pnl-001-canonical-production-payload.json
          retention-days: 1
          if-no-files-found: error
