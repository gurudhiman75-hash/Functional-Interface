name: Quant V4 Algebra CP011 distinctiveness P4

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/ALG-002/ALG-CP-011/**"
      - ".github/workflows/quant-v4-algebra-cp011-distinctiveness-p4.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-v4-algebra-cp011-distinctiveness-p4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cp011-distinctiveness-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle CP011 distinctiveness review proof
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/algebra
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/ALG-002/ALG-CP-011/distinctiveness-review-v4.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/quant-v4/algebra/cp011-distinctiveness-review-v4.test.mjs
      - name: Run CP011 distinctiveness review proof
        run: |
          cd artifacts/api-server
          node dist/quant-v4/algebra/cp011-distinctiveness-review-v4.test.mjs
      - name: Patch hygiene
        run: git diff --check
