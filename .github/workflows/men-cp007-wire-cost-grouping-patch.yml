name: MEN-CP-007 Wire Cost Grouping Patch

on:
  pull_request:
    branches:
      - feat/men-002-cp007-gap-wave-03
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-cp007-wire-cost-grouping-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Group all wire-cost rupee amounts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-03/runtime.ts")
          lines = path.read_text(encoding="utf8").splitlines()
          step = [i for i, line in enumerate(lines) if 'title: "Apply the Wire Rate"' in line]
          shortcut = [i for i, line in enumerate(lines) if 'shortcut: `Here $4(l+b+h)' in line]
          if len(step) != 1 or len(shortcut) != 1:
            raise SystemExit(f"Unexpected matches: step={len(step)}, shortcut={len(shortcut)}")
          lines[step[0]] = '      { title: "Apply the Wire Rate", body: `Multiply by $\\\\text{₹}${formatIndianInteger(state.rate)}$ for each metre.`, equation: `$$Cost=${edgeLength}\\\\times\\\\text{₹}${formatIndianInteger(state.rate)}=\\\\text{₹}${formatIndianInteger(cost)}$$` },'
          lines[shortcut[0]] = '    shortcut: `Here $4(l+b+h)=${edgeLength}\\\\text{ m}$, so the wire costs $${edgeLength}\\\\times\\\\text{₹}${formatIndianInteger(state.rate)}=\\\\text{₹}${formatIndianInteger(cost)}$.`,'
          path.write_text("\n".join(lines) + "\n", encoding="utf8")
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-03/runtime.ts
          git commit -m "fix(mensuration): group wire-cost rupee amounts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
