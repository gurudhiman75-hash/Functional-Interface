name: Apply validated DIR-CP-007 source

on:
  pull_request:
    branches:
      - feat/reasoning-dir-001-design
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/.cp007-staging/**
      - .github/workflows/dir-cp-007-apply.yml

permissions:
  contents: write

concurrency:
  group: apply-dir-cp-007-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct audited source
        shell: bash
        run: |
          set -euo pipefail
          staging='artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/.cp007-staging'
          cat "$staging"/part-* | base64 --decode > /tmp/dir-cp-007-payload.tar.gz
          echo 'c8a89d9b2ba6619529cd516a35889bfa04a155a78278ba6d4dafbd5e66beadd8  /tmp/dir-cp-007-payload.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/dir-cp-007-payload.tar.gz
          cp007='artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/DIR-CP-007'
          find "$cp007" -name '*.ts' -print0 | xargs -0 perl -pi -e 's/\bDIRECTION_LABELS\b/SUN_SHADOW_DIRECTION_LABELS/g'
          mv dir-cp-007-runtime-proof.yml .github/workflows/dir-cp-007-runtime-proof.yml
          rm -rf "$staging" .github/workflows/dir-cp-007-apply.yml

      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Strict typecheck
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set +e
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/Direction-Sense/DIR-001 -name '*.ts' -print) \
            > ../../dir-cp-007-apply-typecheck.log 2>&1
          status="$?"
          echo "$status" > ../../dir-cp-007-apply-typecheck-exit.txt
          cat ../../dir-cp-007-apply-typecheck.log
          exit 0

      - name: Publish apply typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dir-cp-007-apply-typecheck-diagnostics
          path: |
            dir-cp-007-apply-typecheck.log
            dir-cp-007-apply-typecheck-exit.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce strict typecheck
        run: test "$(cat dir-cp-007-apply-typecheck-exit.txt)" = "0"

      - name: Bundle and run CP-007 proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Direction-Sense/DIR-001/DIR-CP-007/dir-cp-007.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dir-cp-007.test.mjs
          node artifacts/api-server/dist/reasoning-v1/dir-cp-007.test.mjs

      - name: Generate CP-007 review artifact
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Direction-Sense/DIR-001/DIR-CP-007/dir-cp-007-generate-review-export.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dir-cp-007-generate-review-export.mjs
          (cd artifacts/api-server && node dist/reasoning-v1/dir-cp-007-generate-review-export.mjs)
          test -f artifacts/api-server/dist/reasoning-v1/dir-cp-007-review-export/DIR-CP-007-QUESTION-REVIEW.html
          test -f artifacts/api-server/dist/reasoning-v1/dir-cp-007-review-export/DIR-CP-007-QUESTION-REVIEW.jsonl

      - name: Commit and push validated source
        shell: bash
        run: |
          set +e
          : > dir-cp-007-handoff.log
          final_status=0
          {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            echo '--- staged status ---'
            git status --short
            echo '--- diff check ---'
            git diff --cached --check
            check_status="$?"
            echo "diff_check_status=$check_status"
            if [ "$check_status" -ne 0 ]; then
              final_status="$check_status"
            else
              echo '--- commit ---'
              git commit -m 'feat(reasoning): implement DIR-CP-007 sun-shadow runtime'
              commit_status="$?"
              echo "commit_status=$commit_status"
              if [ "$commit_status" -ne 0 ]; then
                final_status="$commit_status"
              else
                echo '--- push ---'
                git push origin HEAD:${{ github.event.pull_request.head.ref }}
                push_status="$?"
                echo "push_status=$push_status"
                final_status="$push_status"
              fi
            fi
            echo "final_status=$final_status"
          } > dir-cp-007-handoff.log 2>&1
          echo "$final_status" > dir-cp-007-handoff-exit.txt
          cat dir-cp-007-handoff.log
          exit 0

      - name: Publish source handoff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dir-cp-007-source-handoff-diagnostics
          path: |
            dir-cp-007-handoff.log
            dir-cp-007-handoff-exit.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce source handoff
        run: test "$(cat dir-cp-007-handoff-exit.txt)" = "0"
