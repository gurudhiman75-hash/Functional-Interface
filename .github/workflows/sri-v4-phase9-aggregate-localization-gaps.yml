name: SRI Phase 9 aggregate localization gaps

on:
  push:
    branches:
      - feature/sri-v4-phase9-localization-v1
    paths:
      - .github/workflows/sri-v4-phase9-aggregate-localization-gaps.yml

permissions:
  contents: write

jobs:
  patch-audit-reporting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sri-v4-phase9-localization-v1
      - name: Aggregate quality failures without weakening assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/tests/permanent-localization-v1.test.ts')
          text = path.read_text(encoding='utf-8')
          old1 = 'const residualFailures: string[] = [];\nconst sourceCandidatesSeen = new Set<string>();'
          new1 = 'const nativeScriptFailures: string[] = [];\nconst residualFailures: string[] = [];\nconst sourceCandidatesSeen = new Set<string>();'
          old2 = '''      for (const text of [q.stem, q.explanation.asked, q.explanation.method]) {\n        assert.match(text, NATIVE_SCRIPT[locale], `${allocation.qlId}/${q.candidateId}/${locale}: expected native script in ${text}`);\n        nativeScriptChecks += 1;\n      }'''
          new2 = '''      for (const text of [q.stem, q.explanation.asked, q.explanation.method]) {\n        if (!NATIVE_SCRIPT[locale].test(text) && nativeScriptFailures.length < 80) {\n          nativeScriptFailures.push(`${allocation.qlId}/${q.candidateId}/${locale}: expected native script :: ${text}`);\n        }\n        nativeScriptChecks += 1;\n      }'''
          old3 = '''assert.equal(generated, EXPECTED_QLS * SEEDS_PER_QL * LOCALES.length);\nassert.deepEqual(residualFailures, [], `Localized learner text still contains English instructional residue:\\n${residualFailures.join("\\n")}`);'''
          new3 = '''assert.equal(generated, EXPECTED_QLS * SEEDS_PER_QL * LOCALES.length);\nconst localizationQualityFailures = [...nativeScriptFailures, ...residualFailures];\nassert.deepEqual(localizationQualityFailures, [], `Localized learner text failed language-quality gates:\\n${localizationQualityFailures.join("\\n")}`);'''
          for old, new, label in ((old1,new1,'declaration'),(old2,new2,'native loop'),(old3,new3,'final assertion')):
              if text.count(old) != 1:
                  raise SystemExit(f'Expected unique {label} block, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit stronger diagnostic audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/tests/permanent-localization-v1.test.ts
          git diff --cached --check
          git commit -m "SRI Phase 9: aggregate localization quality failures"
          git push origin HEAD:feature/sri-v4-phase9-localization-v1
