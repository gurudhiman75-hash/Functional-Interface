name: QS production reviewed enqueue transaction
on:
  pull_request:
    branches: [New-main]
    paths:
      - 'artifacts/api-server/src/question-studio/prod-reviewed-enqueue-transaction.ts'
      - 'tests/qs-prod-reviewed-enqueue-transaction.test.mjs'
  workflow_dispatch:
concurrency:
  group: qs-prod-review-tx-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/qs-prod-reviewed-enqueue-transaction.test.mjs tests/qs-prod-review-enqueue-preflight.test.mjs
