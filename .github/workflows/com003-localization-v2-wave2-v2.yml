name: COM-003 Localization V2 Wave 2 Candidate 2

on:
  push:
    branches:
      - feature/com003-office-productivity-discovery-v1
    paths:
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-wave2.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-wave2-v2.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-wave2-v2.test.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-wave2-v2-review-file.ts'
      - '.github/workflows/com003-localization-v2-wave2-v2.yml'
  pull_request:
    branches:
      - integration/computer-content-engine-mainline-v1
    paths:
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-wave2.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-wave2-v2.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-wave2-v2.test.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-wave2-v2-review-file.ts'
      - '.github/workflows/com003-localization-v2-wave2-v2.yml'

permissions:
  contents: read
concurrency:
  group: com003-localization-v2-wave2-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle Candidate 2 audit and review
        run: |
          mkdir -p artifacts/api-server/dist/com003-localization-v2-wave2-v2
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/computer-awareness/com003-localization-v2-wave2-v2.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/com003-localization-v2-wave2-v2/audit.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/computer-awareness/com003-localization-v2-wave2-v2-review-file.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/com003-localization-v2-wave2-v2/com003-localization-v2-wave2-v2-review-file.mjs
      - name: Run Candidate 2 audit
        run: node artifacts/api-server/dist/com003-localization-v2-wave2-v2/audit.test.mjs
      - name: Generate Candidate 2 review
        run: cd artifacts/api-server && node dist/com003-localization-v2-wave2-v2/com003-localization-v2-wave2-v2-review-file.mjs
      - name: Verify Candidate 2 review
        run: |
          FILE=artifacts/api-server/dist/com003-localization-v2-wave2-v2-review/COM-003-Localization-V2-Wave2-Candidate2-Review.html
          test -s "$FILE"
          grep -q 'Candidate 2' "$FILE"
          grep -q '60 Hindi questions' "$FILE"
          grep -q '60 Punjabi questions' "$FILE"
          grep -q '120 localized outputs' "$FILE"
          grep -q 'COM-003-QL-009' "$FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: com003-localization-v2-wave2-candidate2-review
          path: artifacts/api-server/dist/com003-localization-v2-wave2-v2-review/COM-003-Localization-V2-Wave2-Candidate2-Review.html
          if-no-files-found: error
