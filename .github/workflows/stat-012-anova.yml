name: Quant V4 Statistics STAT-012 Analysis of Variance

on:
  push:
    branches:
      - feature/statistics-anova-jso-v1
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Statistics/STAT-012/**"
      - "artifacts/api-server/src/quant-v4/topics/Statistics/shared/native-final*"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Statistics/STAT-012/**"
      - "artifacts/api-server/src/quant-v4/topics/Statistics/shared/native-final*"
  workflow_dispatch:

concurrency:
  group: stat012-anova-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  statistics-anova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Package namespace and lifecycle guard
        run: |
          test -d artifacts/api-server/src/quant-v4/topics/Statistics/STAT-012
          ! grep -R 'questionBankWritable: true\|testEligibility: "ELIGIBLE"\|testEligible: true\|mockTestEligible: true\|publiclyPublishable: true\|automaticStudentPublication: true\|productionReleaseAuthorized: true' artifacts/api-server/src/quant-v4/topics/Statistics/STAT-012
      - name: Deterministic ANOVA proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Statistics/STAT-012/anova.test.ts
      - name: Question Studio Quant V4 integration
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Statistics/STAT-012/question-studio-integration.test.ts
      - name: Final five-package native parity
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Statistics/shared/native-final-v1.test.ts
      - name: Final five-package native Question Studio routing
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Statistics/shared/native-final-studio-v1.test.ts
      - name: Patch hygiene
        run: git diff --check
