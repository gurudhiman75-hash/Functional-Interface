name: Validate TMW-001 remediation R4 exam readiness

on:
  push:
    branches:
      - fix/tmw-001-remediation-r4-exam-readiness
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/**
      - .github/workflows/tmw-r4-exam-readiness.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-tmw-r4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: >-
          pnpm exec tsc
          --noEmit
          --target es2022
          --module esnext
          --moduleResolution bundler
          --strictNullChecks
          --noImplicitAny
          --noImplicitReturns
          --noFallthroughCasesInSwitch
          --skipLibCheck
          --types node
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/learner-explanation-r4-exam-readiness.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/chapter-localized-runtime.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp012-coverage-closure-runtime.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp013-data-sufficiency-runtime.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-r4-exam-readiness.test.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-r4-cp001-cp006-source-regression.test.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-r4-cp007-cp011-source-regression.test.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-r4-stem-readiness.test.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp012-coverage-closure.test.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp013-data-sufficiency.test.ts
      - name: Bundle R4 full-chapter proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-r4-exam-readiness.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-r4-exam-readiness.test.mjs
      - name: Run R4 full-chapter proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/tmw-001-r4-exam-readiness.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/tmw-001-r4-exam-readiness.log
      - name: Bundle R1 critical regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-critical-remediation-r1.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-r1-r4-regression.test.mjs
      - name: Run R1 critical regression
        run: node artifacts/api-server/dist/quant-v4/tmw-001-r1-r4-regression.test.mjs
      - name: Bundle CP001-CP006 source regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-r4-cp001-cp006-source-regression.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-r4-cp001-cp006-source-regression.test.mjs
      - name: Run CP001-CP006 source regression
        run: node artifacts/api-server/dist/quant-v4/tmw-001-r4-cp001-cp006-source-regression.test.mjs
      - name: Bundle CP007-CP011 source regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-r4-cp007-cp011-source-regression.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-r4-cp007-cp011-source-regression.test.mjs
      - name: Run CP007-CP011 source regression
        run: node artifacts/api-server/dist/quant-v4/tmw-001-r4-cp007-cp011-source-regression.test.mjs
      - name: Bundle CP010 stem-readiness proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-r4-stem-readiness.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-r4-stem-readiness.test.mjs
      - name: Run CP010 stem-readiness proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/tmw-001-r4-stem-readiness.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/tmw-001-r4-stem-readiness.log
      - name: Bundle multilingual parity regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-multilingual-chapter-parity.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-multilingual-r4-regression.test.mjs
      - name: Run multilingual parity regression
        run: node artifacts/api-server/dist/quant-v4/tmw-001-multilingual-r4-regression.test.mjs
      - name: Bundle CP012 coverage-closure proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp012-coverage-closure.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-cp012-coverage-closure.test.mjs
      - name: Run CP012 coverage-closure proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/tmw-001-cp012-coverage-closure.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/tmw-001-cp012-coverage-closure.log
      - name: Bundle CP013 data-sufficiency proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp013-data-sufficiency.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-cp013-data-sufficiency.test.mjs
      - name: Run CP013 data-sufficiency proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/tmw-001-cp013-data-sufficiency.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/tmw-001-cp013-data-sufficiency.log
      - name: Upload R4 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmw-001-remediation-r4-exam-readiness
          path: |
            artifacts/api-server/dist/quant-v4/tmw-001-r4-exam-readiness.log
            artifacts/api-server/dist/quant-v4/tmw-001-r4-stem-readiness.log
            artifacts/api-server/dist/quant-v4/tmw-001-cp012-coverage-closure.log
            artifacts/api-server/dist/quant-v4/tmw-001-cp013-data-sufficiency.log
          if-no-files-found: warn
          retention-days: 14
