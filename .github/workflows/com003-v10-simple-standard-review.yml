name: COM-003 V10 Simple Standard Review

on:
  push:
    branches:
      - feature/com003-office-productivity-discovery-v1
    paths:
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-review-synthesis-v10.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-review-synthesis-v10.test.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-question-review-md-v10.ts'
      - '.github/workflows/com003-v10-simple-standard-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate V10 simple standard exam language
        run: |
          mkdir -p artifacts/api-server/dist/com003-review-v10
          pnpm --dir artifacts/api-server exec esbuild src/knowledge-v1/computer-awareness/com003-review-synthesis-v10.test.ts --bundle --platform=node --format=esm --outfile=dist/com003-review-v10/com003-review-synthesis-v10.test.mjs
          set +e
          node artifacts/api-server/dist/com003-review-v10/com003-review-synthesis-v10.test.mjs 2>&1 | tee artifacts/api-server/dist/com003-review-v10/validation.log
          STATUS=${PIPESTATUS[0]}
          set -e
          exit $STATUS
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: com003-v10-validation-log
          path: artifacts/api-server/dist/com003-review-v10/validation.log
          if-no-files-found: warn
      - name: Generate V10 Markdown review file
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/knowledge-v1/computer-awareness/com003-question-review-md-v10.ts --bundle --platform=node --format=esm --outfile=dist/com003-review-v10/com003-question-review-md-v10.mjs
          cd artifacts/api-server && node dist/com003-review-v10/com003-question-review-md-v10.mjs
      - name: Verify Markdown review file
        run: |
          FILE=artifacts/api-server/dist/com003-review-v10/COM-003-Office-Productivity-English-Question-Review-V10.md
          test -s "$FILE"
          grep -q 'English V10 · Simple Standard Exam Language Review Candidate' "$FILE"
          grep -q '228 questions' "$FILE"
          grep -q 'COM-003-QL-019' "$FILE"
          ! grep -Eiq '\b(appropriate|which action|practical effect|correct choice|correctly represents|example or description|requirement|invoke|distinguish|quickest keyboard|key combination)\b' "$FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: com003-office-productivity-english-question-review-v10
          path: artifacts/api-server/dist/com003-review-v10/COM-003-Office-Productivity-English-Question-Review-V10.md
          if-no-files-found: error
