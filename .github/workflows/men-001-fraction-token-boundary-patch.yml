name: MEN-001 Fraction Token Boundary Patch

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-001-fraction-token-boundary-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Protect LaTeX command names from fraction matching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-math-latex.ts")
          text = path.read_text()
          old = r'''const LATEX_ATOM = String.raw`(?:${LATEX_NAMED_ATOM}|\\sqrt\{[^{}]+\}|\\(?:pi|theta)|[A-Za-z0-9]+(?:_\{[^{}]+\})?(?:\^\{[^{}]+\})?)`;'''
          new = r'''const LATEX_ATOM = String.raw`(?:${LATEX_NAMED_ATOM}|\\sqrt\{[^{}]+\}|\\(?:pi|theta)|(?<!\\\\)[A-Za-z0-9]+(?:_\{[^{}]+\})?(?:\^\{[^{}]+\})?)`;'''
          if old not in text:
              raise SystemExit("LATEX_ATOM declaration not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-math-latex.ts
          git commit -m "fix(mensuration): protect latex command token boundaries"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
