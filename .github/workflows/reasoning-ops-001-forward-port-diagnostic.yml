name: Diagnose OPS-001 forward-port

on:
  pull_request:
    branches: [New-main]
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/**"
      - ".github/workflows/reasoning-ops-001-forward-port-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Capture strict TypeScript diagnostics
        working-directory: artifacts/api-server
        run: |
          set +e
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/Mathematical-Operations/OPS-001 -name '*.ts' -print) \
            > /tmp/ops-tsc.log 2>&1
          status=$?
          cat /tmp/ops-tsc.log
          echo "$status" > /tmp/ops-tsc-status.txt
          exit $status
      - name: Upload TypeScript diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ops-001-forward-port-tsc-diagnostic
          path: |
            /tmp/ops-tsc.log
            /tmp/ops-tsc-status.txt
          if-no-files-found: error
          retention-days: 3
