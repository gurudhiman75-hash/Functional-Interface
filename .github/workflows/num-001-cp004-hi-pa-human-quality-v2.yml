name: Validate NUM-CP-004 Hindi Punjabi Human Quality V2

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/**
      - .github/workflows/num-001-cp004-hi-pa-human-quality-v2.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp004-hi-pa-human-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-human-quality-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle human-quality V2 audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-004/localization/runtime-human-quality.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp004-hi-pa-human-quality-v2.mjs

      - name: Run human-quality V2 audit
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/num-cp004-hi-pa-human-quality-v2.mjs \
            2>&1 | tee dist/quant-v4/num-cp004-hi-pa-human-quality-v2.log

      - name: Upload human-quality V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: num-001-cp004-hi-pa-human-quality-v2
          path: artifacts/api-server/dist/quant-v4/num-cp004-hi-pa-human-quality-v2.log
          if-no-files-found: warn
          retention-days: 30
