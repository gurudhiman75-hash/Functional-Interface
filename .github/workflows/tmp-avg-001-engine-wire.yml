name: Temporary AVG-001 engine wire

on:
  push:
    branches:
      - feat/avg-001-question-studio-integration
    paths:
      - .github/workflows/tmp-avg-001-engine-wire.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/avg-001-question-studio-integration
          fetch-depth: 0
      - name: Patch Quant V4 engine
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('artifacts/api-server/src/quant-v4/generation-engine.ts')
          text = path.read_text()

          import_anchor = '''import {
            getRap003ActiveCanonicalProblemIds,
            runRap003Pipeline,
            type Rap003CanonicalProblemId,
          } from "./topics/Arithmetic/subtopics/RatioAndProportion/RAP-003";
          '''
          avg_import = import_anchor + '''import {
            AVG_001_QUESTION_STUDIO_CP_IDS,
            runAvg001QuestionStudioPipeline,
            type Avg001QuestionStudioCpId,
          } from "./topics/Arithmetic/subtopics/Average/AVG-001/question-studio-adapter";
          '''
          if 'runAvg001QuestionStudioPipeline' not in text:
              text = text.replace(import_anchor, avg_import)

          type_anchor = '  | "RAP-003";'
          if '| "AVG-001"' not in text:
              text = text.replace(type_anchor, '  | "RAP-003"\n  | "AVG-001";')

          runtime_anchor = '''  {
            packageId: "RAP-001",
            topic: "Arithmetic",
            subtopic: "Ratio & Proportion",
          '''
          avg_runtime = '''  {
            packageId: "AVG-001",
            topic: "Arithmetic",
            subtopic: "Average",
            label: "Average",
            cpIds: AVG_001_QUESTION_STUDIO_CP_IDS,
            supportedLanguages: ENGLISH_ONLY_PREVIEW_LANGUAGES,
            run: (cpId, input) =>
              runAvg001QuestionStudioPipeline(cpId as Avg001QuestionStudioCpId, {
                difficulty: input.difficulty,
                language: input.language,
                questionLanguageId: input.questionLanguageId,
                seed: input.seed,
              }),
          },
          ''' + runtime_anchor
          if 'packageId: "AVG-001"' not in text:
              text = text.replace(runtime_anchor, avg_runtime)

          for needle in ['runAvg001QuestionStudioPipeline', '| "AVG-001";', 'packageId: "AVG-001"']:
              if needle not in text:
                  raise SystemExit(f'missing engine patch: {needle}')

          path.write_text(text)
          Path('.github/workflows/tmp-avg-001-engine-wire.yml').unlink()
          PY
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/api-server/src/quant-v4/generation-engine.ts .github/workflows/tmp-avg-001-engine-wire.yml
          git commit -m "feat(avg): wire AVG-001 into Quant V4 generation engine"
          git push origin HEAD:feat/avg-001-question-studio-integration
