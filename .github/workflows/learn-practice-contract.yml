name: Validate Learn practice contract

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/routes/learn-practice.ts
      - artifacts/api-server/src/routes/learn-practice.test.ts
      - artifacts/api-server/src/question-studio/engines/knowledge-v1-pol001-adapter-v1.ts
      - artifacts/api-server/src/question-studio/engines/language-v1-eng004-adapter-v1.ts
      - artifacts/api-server/src/question-studio/engines/language-v1-eng005-adapter-v1.ts
      - artifacts/api-server/src/question-studio/engines/language-v1-eng006-adapter-v1.ts
      - .github/workflows/learn-practice-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learn-practice-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run Learn practice contract
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/routes/learn-practice.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/learn-practice.test.mjs
          node artifacts/api-server/dist/learn-practice.test.mjs
      - name: Build API
        run: pnpm --dir artifacts/api-server build
