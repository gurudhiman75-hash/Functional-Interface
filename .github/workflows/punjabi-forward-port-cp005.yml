name: Validate Punjabi Forward Port CP005

on:
  push:
    branches: [feature/punjabi-forward-port-cp005-v1]
  pull_request:
    paths:
      - 'artifacts/api-server/src/punjabi-v1/**'
      - '.github/workflows/punjabi-forward-port-cp005.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: CP005 semantic gates
        run: npx tsx artifacts/api-server/src/punjabi-v1/packages/PUN-001/checkpoints/CP005/CP005.test.ts
      - name: API build
        run: npm run build --workspace=artifacts/api-server
