name: SRI Phase 9 fix zero wording

on:
  push:
    branches:
      - feature/sri-v4-phase9-localization-v1
    paths:
      - .github/workflows/sri-v4-phase9-fix-zero-wording.yml

permissions:
  contents: write

jobs:
  patch-zero-wording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sri-v4-phase9-localization-v1
      - name: Preserve math skeleton in zero-exponent prose
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/permanent-localization-v1.ts')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '"Every non-zero base raised to zero equals 1.": "प्रत्येक शून्येतर आधार की 0 घात 1 होती है।"':
              '"Every non-zero base raised to zero equals 1.": "प्रत्येक शून्येतर आधार की शून्य घात 1 होती है।"',
              '"Every non-zero base raised to zero equals 1.": "ਹਰੇਕ ਸਿਫ਼ਰ ਤੋਂ ਵੱਖ ਅਧਾਰ ਦੀ 0 ਘਾਤ 1 ਹੁੰਦੀ ਹੈ।"':
              '"Every non-zero base raised to zero equals 1.": "ਹਰੇਕ ਸਿਫ਼ਰ ਤੋਂ ਵੱਖ ਅਧਾਰ ਦੀ ਸਿਫ਼ਰ ਘਾਤ 1 ਹੁੰਦੀ ਹੈ।"',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match for: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
      - name: Commit durable localization fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/permanent-localization-v1.ts
          git diff --cached --check
          git commit -m "SRI Phase 9: preserve zero-exponent math skeleton"
          git push origin HEAD:feature/sri-v4-phase9-localization-v1
