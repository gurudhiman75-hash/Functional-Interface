name: SCI Chemistry Localization V1

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/science/chemistry-localization-v1/**"
  workflow_dispatch:

concurrency:
  group: sci-chemistry-localization-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chemistry-localization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Wave 1 localization audit
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/knowledge-v1/science/chemistry-localization-v1/sci-chemistry-localization-wave1-audit-v1.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/sci-chemistry-localization-wave1-audit-v1.mjs

      - name: Run Wave 1 localization audit
        working-directory: artifacts/api-server
        run: node dist/sci-chemistry-localization-wave1-audit-v1.mjs

      - name: Bundle Wave 2 localization audit
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/knowledge-v1/science/chemistry-localization-v1/sci-chemistry-localization-wave2-audit-v1.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/sci-chemistry-localization-wave2-audit-v1.mjs

      - name: Run Wave 2 localization audit
        working-directory: artifacts/api-server
        run: node dist/sci-chemistry-localization-wave2-audit-v1.mjs

      - name: Bundle Wave 3 localization audit
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/knowledge-v1/science/chemistry-localization-v1/sci-chemistry-localization-wave3-audit-v1.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/sci-chemistry-localization-wave3-audit-v1.mjs

      - name: Run Wave 3 localization audit
        working-directory: artifacts/api-server
        run: node dist/sci-chemistry-localization-wave3-audit-v1.mjs
