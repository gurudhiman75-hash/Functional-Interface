name: Temporary BLR-CP-007 Studio Contract Hardening

on:
  push:
    branches:
      - integrate/blr-001-cp007-question-studio-review
    paths:
      - ".github/workflows/temp-blr-cp007-studio-contract-hardening.yml"

permissions:
  contents: write

jobs:
  patch-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: integrate/blr-001-cp007-question-studio-review

      - name: Normalize Studio difficulty and harden pipelines
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          adapter = Path("artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/question-studio-review-adapter.ts")
          text = adapter.read_text()
          authority = '''function recordAuthority(question: FrozenQuestion) {
            return question.locale === "en-IN"
              ? BLR_CP007_ENGLISH_FREEZE_AUTHORITY
              : BLR_CP007_MULTILINGUAL_FREEZE_AUTHORITY;
          }

          '''
          normalized = '''function recordAuthority(question: FrozenQuestion) {
            return question.locale === "en-IN"
              ? BLR_CP007_ENGLISH_FREEZE_AUTHORITY
              : BLR_CP007_MULTILINGUAL_FREEZE_AUTHORITY;
          }

          function studioDifficulty(question: FrozenQuestion): BlrCp007QuestionStudioDifficulty {
            const value = String(question.metadata.difficulty).toUpperCase();
            if (value === "EASY") return "Easy";
            if (value === "HARD") return "Hard";
            return "Medium";
          }

          '''
          if authority not in text:
            raise SystemExit("recordAuthority insertion point not found")
          text = text.replace(authority, normalized, 1)
          text = text.replace(
            "request.difficulty && forced.metadata.difficulty !== request.difficulty",
            "request.difficulty && studioDifficulty(forced) !== request.difficulty",
          )
          text = text.replace(
            "`${forced.itemId} is ${forced.metadata.difficulty}, not ${request.difficulty}.`,",
            "`${forced.itemId} is ${studioDifficulty(forced)}, not ${request.difficulty}.`,",
          )
          text = text.replace(
            "(!request.difficulty || question.metadata.difficulty === request.difficulty),",
            "(!request.difficulty || studioDifficulty(question) === request.difficulty),",
          )
          text = text.replace(
            "difficultyBand: question.metadata.difficulty,",
            "difficultyBand: studioDifficulty(question),",
          )
          adapter.write_text(text)

          workflow = Path(".github/workflows/reasoning-blr-001-cp007-question-studio-review.yml")
          workflow_text = workflow.read_text()
          workflow_text = workflow_text.replace(
            "        run: |\n          npx --yes tsx@4.20.6",
            "        run: |\n          set -o pipefail\n          npx --yes tsx@4.20.6",
          )
          workflow.write_text(workflow_text)
          PY
          rm .github/workflows/temp-blr-cp007-studio-contract-hardening.yml

      - name: Commit hardened contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/question-studio-review-adapter.ts
          git add .github/workflows/reasoning-blr-001-cp007-question-studio-review.yml
          git add .github/workflows/temp-blr-cp007-studio-contract-hardening.yml
          git commit -m "fix(reasoning): normalize BLR-CP-007 Studio difficulty contract"
          git push origin HEAD:integrate/blr-001-cp007-question-studio-review
