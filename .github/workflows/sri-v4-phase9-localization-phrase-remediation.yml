name: SRI Phase 9 localization phrase remediation

on:
  push:
    branches:
      - feature/sri-v4-phase9-localization-v1
    paths:
      - .github/workflows/sri-v4-phase9-localization-phrase-remediation.yml

permissions:
  contents: write

