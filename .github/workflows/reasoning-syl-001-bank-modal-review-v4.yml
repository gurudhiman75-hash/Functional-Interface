name: Validate SYL-001 Banking modal review V4
on:
  pull_request:
    branches:
      - prototype/syl-001-bank-possibility-shell
      - audit/syl-001-source-profile-freeze
      - feat/syl-001-learner-v4
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-can-never-be-editorial-v6.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-can-never-be-editorial-v6-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-banking-can-never-be-editorial-v6.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-modal-candidate-review-overlay-v4.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-modal-candidate-review-overlay-v4-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-banking-modal-candidate-review-v4.ts
      - .github/workflows/reasoning-syl-001-bank-modal-review-v4.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-syl-001-bank-modal-review-v4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-modal-review-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Bundle can-never Editorial V6 audit
        run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-can-never-be-editorial-v6-audit.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/syl-001-bank-can-never-be-editorial-v6-audit.test.mjs
      - name: Run can-never Editorial V6 audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-bank-can-never-be-editorial-v6-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-bank-can-never-be-editorial-v6-audit.log

      - name: Bundle modal review overlay V4 audit
        run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-modal-candidate-review-overlay-v4-audit.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/syl-001-bank-modal-review-overlay-v4-audit.test.mjs
      - name: Run modal review overlay V4 audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-bank-modal-review-overlay-v4-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-bank-modal-review-overlay-v4-audit.log

      - name: Bundle can-never Editorial V6 exporter
        run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-banking-can-never-be-editorial-v6.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/export-syl-001-bank-can-never-be-editorial-v6.mjs
      - name: Generate can-never Editorial V6 review pack
        run: node artifacts/api-server/dist/reasoning-v1/export-syl-001-bank-can-never-be-editorial-v6.mjs

      - name: Bundle modal human-review V4 exporter
        run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-banking-modal-candidate-review-v4.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/export-syl-001-bank-modal-review-v4.mjs
      - name: Generate modal human-review V4 pack
        run: node artifacts/api-server/dist/reasoning-v1/export-syl-001-bank-modal-review-v4.mjs

      - name: Upload modal review V4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syl-001-bank-modal-review-v4
          path: |
            artifacts/api-server/dist/reasoning-v1/syl-001-bank-can-never-be-editorial-v6-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-bank-modal-review-overlay-v4-audit.log
            dist/reasoning-v1/syl-001-bank-can-never-be-editorial-v6/**
            dist/reasoning-v1/syl-001-bank-modal-candidate-review-v4/**
          if-no-files-found: error
          retention-days: 30
