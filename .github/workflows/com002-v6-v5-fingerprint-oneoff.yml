name: COM-002 V6 V5 Freeze Verification One-Off

on:
  push:
    branches:
      - feature/content-engine-foundation-v1
    paths:
      - .github/workflows/com002-v6-v5-fingerprint-oneoff.yml

permissions:
  contents: read

concurrency:
  group: com002-v6-v5-freeze-verification-oneoff
  cancel-in-progress: true

# Narrow verification only; intentionally avoids restoring broad branch-push CI fanout.
jobs:
  verify-approved-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle approved V6 V5 fingerprint exporter
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/computer-awareness/com002-v6-v5-approved-fingerprint-export.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/content-engine-foundation/com002-v6-v5-approved-fingerprint-export.mjs
      - name: Regenerate approved V6 V5 fingerprint manifest
        run: |
          cd artifacts/api-server
          node dist/content-engine-foundation/com002-v6-v5-approved-fingerprint-export.mjs
      - name: Verify approved freeze candidate
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/computer-awareness/com002-v6-v5-approved-freeze-candidate.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/content-engine-foundation/com002-v6-v5-approved-freeze-candidate.test.mjs
          node artifacts/api-server/dist/content-engine-foundation/com002-v6-v5-approved-freeze-candidate.test.mjs
      - name: Verify operational freeze
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/computer-awareness/com002-v6-v5-operational-freeze.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/content-engine-foundation/com002-v6-v5-operational-freeze.test.mjs
          node artifacts/api-server/dist/content-engine-foundation/com002-v6-v5-operational-freeze.test.mjs
      - name: Audit standard review-only adapter
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/question-studio/engines/knowledge-v1-com002-adapter-v3.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/content-engine-foundation/knowledge-v1-com002-adapter-v3.test.mjs
          node artifacts/api-server/dist/content-engine-foundation/knowledge-v1-com002-adapter-v3.test.mjs
      - name: Print approved fingerprint manifest
        run: cat artifacts/api-server/dist/review-artifacts/COM002-V6-V5-Approved-Fingerprint-Manifest.json
