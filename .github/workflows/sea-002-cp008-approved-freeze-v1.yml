name: Validate SEA-002 CP008 approved freeze V1

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/**"
      - "artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp006/question-bank-acceptance.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp006/question-studio-integration.test.ts"
      - ".github/workflows/sea-002-cp008-approved-freeze-v1.yml"
  workflow_dispatch:

concurrency:
  group: sea-002-cp008-approved-freeze-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-sea-002-cp008-approved-freeze-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Re-prove source saturation
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/source-saturation-v3.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-approved-source.log

      - name: Re-prove permanent inactive allocation
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/permanent/allocation.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-approved-allocation.log

      - name: Re-prove V3 learner graphs and human English
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/english-review-v2.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-approved-english.log

      - name: Re-prove Hindi Punjabi parity
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/localization-v2.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-approved-localization.log

      - name: Verify certified review evidence
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/review/certified-evidence-v2.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-approved-certified-evidence.log

      - name: Re-prove approval-to-freeze contract
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/review/freeze-contract-v2.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-approved-freeze-contract.log

      - name: Prove explicit product approval and frozen authority
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/review/approved-freeze-v1.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-approved-freeze-v1.log

      - name: Prove live Question Studio adapter-only activation
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/question-studio-integration-v1.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-question-studio-live-v1.log

      - name: Prove shared Question Studio product routing
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/question-studio-shared-route-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/sea-002-cp008-shared-route-v1.mjs
          node artifacts/api-server/dist/reasoning-v1/sea-002-cp008-shared-route-v1.mjs \
            2>&1 | tee /tmp/sea-002-cp008-shared-route-v1.log

      - name: Re-prove CP007 boundary
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp007/review/prefreeze-authority-v1.test.ts \
            2>&1 | tee /tmp/sea-002-cp007-boundary-after-cp008-approval.log

      - name: Upload approved freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: sea-002-cp008-approved-freeze-v1
          path: |
            /tmp/sea-002-cp008-approved-source.log
            /tmp/sea-002-cp008-approved-allocation.log
            /tmp/sea-002-cp008-approved-english.log
            /tmp/sea-002-cp008-approved-localization.log
            /tmp/sea-002-cp008-approved-certified-evidence.log
            /tmp/sea-002-cp008-approved-freeze-contract.log
            /tmp/sea-002-cp008-approved-freeze-v1.log
            /tmp/sea-002-cp008-question-studio-live-v1.log
            /tmp/sea-002-cp008-shared-route-v1.log
            /tmp/sea-002-cp007-boundary-after-cp008-approval.log
          if-no-files-found: error
          retention-days: 30
