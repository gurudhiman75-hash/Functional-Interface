name: Validate TSD CP009 allocation and English review candidate

on:
  push:
    branches:
      - feat/tsd-cp009-executable-discovery-v1
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-002/cp009/**
      - .github/workflows/tsd-cp009-discovery-review.yml
  pull_request:
    branches:
      - feat/tsd-cp008-executable-discovery-v1
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-002/cp009/**
      - .github/workflows/tsd-cp009-discovery-review.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-tsd-cp009-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  allocation-and-english-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check for CP009 package
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowImportingTsExtensions \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-002/cp009 -name '*.ts' -print)
      - name: Prove CP009 source saturation
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-002/cp009/source-saturation-proof.test.ts
      - name: Prove CP009 representation saturation
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-002/cp009/final-ownership-proof.test.ts
      - name: Prove CP009 executable feasibility and independent verification
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-002/cp009/executable-proof.test.ts
      - name: Prove CP009 permanent QL allocation
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-002/cp009/allocation-proof.test.ts
      - name: Prove CP009 English authoring and rendered review
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-002/cp009/english-authoring-proof.test.ts
      - name: Generate one questions-only English review
        env:
          TSD_CP009_ENGLISH_REVIEW_OUTPUT_DIR: /tmp/tsd-cp009-english-review
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-002/cp009/english-rendered-review-export.ts
      - name: Upload CP009 English questions-only review
        uses: actions/upload-artifact@v4
        with:
          name: tsd-cp009-english-question-review
          path: /tmp/tsd-cp009-english-review/TSD-CP009-ENGLISH-QUESTIONS.md
          if-no-files-found: error
          retention-days: 14
