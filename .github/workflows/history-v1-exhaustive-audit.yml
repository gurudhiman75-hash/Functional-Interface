name: History V1 Exhaustive Audit

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/indian-history/history-v1-exhaustive-audit-v1.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: history-v1-exhaustive-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build exhaustive History audit
        run: |
          mkdir -p artifacts/api-server/dist/history-audit
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/indian-history/history-v1-exhaustive-audit-v1.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/history-audit/history-v1-exhaustive-audit-v1.mjs
      - name: Run exhaustive History audit
        run: |
          cd artifacts/api-server
          node dist/history-audit/history-v1-exhaustive-audit-v1.mjs
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: HIS-001-V1-EXHAUSTIVE-AUDIT
          path: artifacts/api-server/dist/history-audit/HIS-001-V1-EXHAUSTIVE-AUDIT/
          if-no-files-found: error
          retention-days: 30
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
