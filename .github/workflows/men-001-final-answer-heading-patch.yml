name: MEN-001 Final Heading Patch

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-001-final-answer-heading-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Patch final-answer heading checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001")

          trap = root / "structured-common-traps.ts"
          text = trap.read_text().replace(
              "as the final answer before the calculation is complete",
              "as the answer before the calculation is complete",
              1,
          )
          trap.write_text(text)

          validator = root / "validator.final.ts"
          text = validator.read_text().replace(
              "explanationLines.every((line) => !/Final Answer/i.test(line)) &&",
              "explanationLines.every((line) => !/^###\\s+.*Final Answer/im.test(line)) &&",
              1,
          )
          validator.write_text(text)

          assertion = root / "structured-explanation-display-assertion.ts"
          text = assertion.read_text().replace(
              "if (explanation.lines.some((line) => /Final Answer/i.test(line))) {",
              "if (explanation.lines.some((line) => /^###\\s+.*Final Answer/im.test(line))) {",
              1,
          )
          assertion.write_text(text)

          audit = root / "four-tier-explanation.test.ts"
          text = audit.read_text().replace(
              "question.explanation.lines.every((line) => !/Final Answer/i.test(line))",
              "question.explanation.lines.every((line) => !/^###\\s+.*Final Answer/im.test(line))",
              1,
          )
          audit.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001
          git commit -m "fix(mensuration): distinguish final heading from prose"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
