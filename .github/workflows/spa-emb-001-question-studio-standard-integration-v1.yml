name: Validate SPA EMB-001 Standard Question Studio Integration V1

on:
  push:
    branches:
      - feat/spa-emb-001-question-studio-standard-v1
    paths:
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/embedded-figure-question-studio-product-owner-approval-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-question-studio-integration-v3.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-question-studio-production-v3.ts
      - artifacts/api-server/src/reasoning-v1/tests/spatial-embedded-figure-question-studio-standard-integration-v1.test.ts
      - .github/workflows/spa-emb-001-question-studio-standard-integration-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-emb-standard-question-studio-integration-v1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle EMB-001 standard Question Studio integration proof
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-embedded-figure-question-studio-standard-integration-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-embedded-figure-question-studio-standard-integration-v1.test.mjs

      - name: Validate EMB-001 standard Question Studio integration
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-embedded-figure-question-studio-standard-integration-v1.test.mjs \
            | tee dist/reasoning-v1/spatial/spa-emb-001-standard-question-studio-integration-v1-evidence.json

      - name: Upload EMB-001 standard Question Studio integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-emb-001-standard-question-studio-integration-v1
          path: artifacts/api-server/dist/reasoning-v1/spatial/spa-emb-001-standard-question-studio-integration-v1-evidence.json
          if-no-files-found: error
