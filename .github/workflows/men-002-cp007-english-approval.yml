name: Validate MEN-CP-007 English approval

on:
  pull_request:
    branches:
      - fix/men-002-cp007-english-editorial-v2
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/foundation/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-01/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-02/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-03/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/source-gap-wave-04/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-007/**
      - .github/workflows/men-002-cp007-english-approval.yml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-002-cp007-english-approval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-english-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle English candidate and approval proofs
        shell: bash
        run: |
          set -euo pipefail
          base=src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002
          out=dist/quant-v4
          pnpm --dir artifacts/api-server exec esbuild "$base/MEN-CP-007/permanent/runtime.test.ts" --bundle --platform=node --format=esm --outfile="$out/men-cp007-editorial-v2.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$base/MEN-CP-007/approved/english.test.ts" --bundle --platform=node --format=esm --outfile="$out/men-cp007-english-approval.test.mjs"

      - name: Run English candidate and approval gates
        shell: bash
        run: |
          set -o pipefail
          out=artifacts/api-server/dist/quant-v4
          node "$out/men-cp007-editorial-v2.test.mjs" 2>&1 | tee "$out/men-cp007-editorial-v2.log"
          node "$out/men-cp007-english-approval.test.mjs" 2>&1 | tee "$out/men-cp007-english-approval.log"

      - name: Run exact Render production build
        id: render_build
        shell: bash
        run: |
          set +e
          bash build-api.sh > artifacts/api-server/dist/quant-v4/men-cp007-english-approval-render-build.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enforce Render production build
        shell: bash
        run: |
          cat artifacts/api-server/dist/quant-v4/men-cp007-english-approval-render-build.log
          test "${{ steps.render_build.outputs.exit_code }}" = "0"
          test -f artifacts/api-server/dist/index.mjs
          test -f artifacts/examtree/dist/public/index.html
          test -f artifacts/examtree/dist/public/admin/index.html

      - name: Upload English approval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-002-cp007-english-approval
          path: |
            artifacts/api-server/dist/quant-v4/men-cp007-editorial-v2.log
            artifacts/api-server/dist/quant-v4/men-cp007-english-approval.log
            artifacts/api-server/dist/quant-v4/men-cp007-english-approval-render-build.log
          if-no-files-found: error
          retention-days: 14
