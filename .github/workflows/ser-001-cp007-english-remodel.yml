name: Validate SER-001 CP-007 adaptive English V1

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-B/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-C/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-D/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-E/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL/**
      - .github/workflows/ser-001-cp007-english-remodel.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-cp007-english-remodel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-adaptive-english-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-remodel-v1

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Validate adaptive English candidate V1
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-remodel-v1
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/adaptive-review.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-adaptive-review.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-adaptive-review.test.mjs") \
            | tee "$EVIDENCE/adaptive-review-audit.json"
          grep -q 'PASS_SER_CP007_ADAPTIVE_ENGLISH_CANDIDATE_V1' \
            "$EVIDENCE/adaptive-review-audit.json"

      - name: Export adaptive English review pack
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-remodel-v1
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/export-adaptive-review.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/export-ser-cp007-adaptive-review.mjs"
          (cd artifacts/api-server && node "$OUT/export-ser-cp007-adaptive-review.mjs") \
            > "$EVIDENCE/ser-cp-007-adaptive-English-V1-review.md"
          grep -q '# SER-CP-007 adaptive English candidate V1' \
            "$EVIDENCE/ser-cp-007-adaptive-English-V1-review.md"

      - name: Collect candidate report
        run: |
          set -euo pipefail
          ROOT=artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-remodel-v1
          cp "$ROOT/ser-cp-007-adaptive-review-report.md" \
            "$EVIDENCE/ser-cp-007-adaptive-review-report.md"

      - name: Upload adaptive English evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-cp007-adaptive-english-v1
          path: artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-remodel-v1
          if-no-files-found: error
          retention-days: 30
