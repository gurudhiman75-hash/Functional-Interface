name: Validate SER-001 CP-007 adaptive English V2

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-B/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-C/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-D/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-E/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL/**
      - .github/workflows/ser-001-cp007-english-remodel.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-cp007-english-remodel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-adaptive-english-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-remodel-v2

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Re-run Candidate V1 regression gates
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-remodel-v2
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/adaptive-review.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-adaptive-review-v1-regression.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-adaptive-review-v1-regression.test.mjs") \
            | tee "$EVIDENCE/adaptive-review-v1-regression.json"
          grep -q 'PASS_SER_CP007_ADAPTIVE_ENGLISH_CANDIDATE_V1' \
            "$EVIDENCE/adaptive-review-v1-regression.json"

      - name: Validate Candidate V2 proof sufficiency
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-remodel-v2
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/adaptive-review-v2.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-adaptive-review-v2.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-adaptive-review-v2.test.mjs") \
            | tee "$EVIDENCE/adaptive-review-v2-audit.json"
          grep -q 'PASS_SER_CP007_ADAPTIVE_ENGLISH_CANDIDATE_V2' \
            "$EVIDENCE/adaptive-review-v2-audit.json"

      - name: Export adaptive English V2 review pack
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-remodel-v2
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/export-adaptive-review-v2.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/export-ser-cp007-adaptive-review-v2.mjs"
          (cd artifacts/api-server && node "$OUT/export-ser-cp007-adaptive-review-v2.mjs") \
            > "$EVIDENCE/ser-cp-007-adaptive-English-V2-review.md"
          grep -q '# SER-CP-007 adaptive English candidate V2' \
            "$EVIDENCE/ser-cp-007-adaptive-English-V2-review.md"

      - name: Export authority and task manual review pack
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-remodel-v2
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/export-adaptive-review-v2-by-authority.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/export-ser-cp007-adaptive-review-v2-by-authority.mjs"
          (cd artifacts/api-server && node "$OUT/export-ser-cp007-adaptive-review-v2-by-authority.mjs") \
            > "$EVIDENCE/ser-cp-007-adaptive-English-V2-by-authority-review.md"
          grep -q '# SER-CP-007 adaptive English V2 — authority/task manual review pack' \
            "$EVIDENCE/ser-cp-007-adaptive-English-V2-by-authority-review.md"
          grep -q 'Authorities reviewed: 17' \
            "$EVIDENCE/ser-cp-007-adaptive-English-V2-by-authority-review.md"
          grep -q 'Templates reviewed:   140' \
            "$EVIDENCE/ser-cp-007-adaptive-English-V2-by-authority-review.md"

      - name: Export authority decision matrix
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-remodel-v2
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/export-adaptive-review-v2-authority-matrix.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/export-ser-cp007-adaptive-review-v2-authority-matrix.mjs"
          (cd artifacts/api-server && node "$OUT/export-ser-cp007-adaptive-review-v2-authority-matrix.mjs") \
            > "$EVIDENCE/ser-cp-007-adaptive-English-V2-authority-matrix.md"
          grep -q '# SER-CP-007 adaptive English V2 — authority matrix' \
            "$EVIDENCE/ser-cp-007-adaptive-English-V2-authority-matrix.md"
          grep -q 'Authorities: 17' \
            "$EVIDENCE/ser-cp-007-adaptive-English-V2-authority-matrix.md"
          grep -q 'Templates:   140' \
            "$EVIDENCE/ser-cp-007-adaptive-English-V2-authority-matrix.md"

      - name: Collect candidate reports
        run: |
          set -euo pipefail
          ROOT=artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-remodel-v2
          cp "$ROOT/ser-cp-007-adaptive-review-report.md" \
            "$EVIDENCE/ser-cp-007-adaptive-review-v1-report.md"
          cp "$ROOT/ser-cp-007-adaptive-review-v2-report.md" \
            "$EVIDENCE/ser-cp-007-adaptive-review-v2-report.md"

      - name: Upload adaptive English V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-cp007-adaptive-english-v2
          path: artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-remodel-v2
          if-no-files-found: error
          retention-days: 30
