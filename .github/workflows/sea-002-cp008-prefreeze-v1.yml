name: Validate SEA-002 CP008 prefreeze V1

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/**"
      - ".github/workflows/sea-002-cp008-prefreeze-v1.yml"
  workflow_dispatch:

concurrency:
  group: sea-002-cp008-prefreeze-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-sea-002-cp008-prefreeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Re-prove production source saturation
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/source-saturation-v3.test.ts

      - name: Re-prove permanent inactive allocation
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/permanent/allocation.test.ts

      - name: Re-prove English review set
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/english-review-v1.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-english-review-v1.log

      - name: Re-prove Hindi Punjabi localization
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/localization-v1.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-localization-v1.log

      - name: Prove prefreeze authority
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/review/prefreeze-authority-v1.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-prefreeze-authority-v1.log

      - name: Prove approval-to-freeze contract
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/review/freeze-contract-v1.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-freeze-contract-v1.log

      - name: Prove blocked Question Studio preview adapter
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/question-studio-preintegration-v1.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-question-studio-preintegration-v1.log

      - name: Export English review set
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/english-review-export-v1.ts
          > /tmp/sea-002-cp008-english-review-v1.json

      - name: Export localized review set
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/localization-export-v1.ts
          > /tmp/sea-002-cp008-localization-v1.json

      - name: Re-prove CP007 approval boundary
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp007/review/prefreeze-authority-v1.test.ts

      - name: Upload CP008 prefreeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: sea-002-cp008-prefreeze-v1
          path: |
            /tmp/sea-002-cp008-english-review-v1.log
            /tmp/sea-002-cp008-localization-v1.log
            /tmp/sea-002-cp008-prefreeze-authority-v1.log
            /tmp/sea-002-cp008-freeze-contract-v1.log
            /tmp/sea-002-cp008-question-studio-preintegration-v1.log
            /tmp/sea-002-cp008-english-review-v1.json
            /tmp/sea-002-cp008-localization-v1.json
          if-no-files-found: error
          retention-days: 30
