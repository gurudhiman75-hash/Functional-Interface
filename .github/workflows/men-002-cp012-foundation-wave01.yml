name: Validate MEN-CP-012 foundation wave 01

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp012-foundation/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-012/**
      - .github/workflows/men-002-cp012-foundation-wave01.yml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-002-cp012-foundation-wave01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp012-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove MEN-CP-012 Wave 01 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/api-server/dist/quant-v4
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp012-foundation/runtime.test.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/quant-v4/men-cp012-foundation-wave01.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp012-foundation-wave01.test.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/men-cp012-foundation-wave01.test.log
      - name: Export 64-question review evidence
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp012-foundation/review-export.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/quant-v4/men-cp012-foundation-wave01-review.mjs
          cd artifacts/api-server
          node dist/quant-v4/men-cp012-foundation-wave01-review.mjs \
            2>&1 | tee dist/quant-v4/men-cp012-foundation-wave01-review.log
          test -s dist/quant-v4/men-cp012-foundation-wave01.json
          test -s dist/quant-v4/men-cp012-foundation-wave01.md
      - name: Build production API bundle
        run: bash build-api.sh
      - name: Upload MEN-CP-012 Wave 01 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-cp012-foundation-wave01
          path: |
            artifacts/api-server/dist/quant-v4/men-cp012-foundation-wave01.test.log
            artifacts/api-server/dist/quant-v4/men-cp012-foundation-wave01-review.log
            artifacts/api-server/dist/quant-v4/men-cp012-foundation-wave01.json
            artifacts/api-server/dist/quant-v4/men-cp012-foundation-wave01.md
          if-no-files-found: error
          retention-days: 14
