name: Validate Notes Studio NS-002 Source Pack

on:
  pull_request:
    branches:
      - New-main
    paths:
      - 'artifacts/api-server/src/notes-studio/**'
      - 'artifacts/api-server/src/routes/admin-notes-studio.ts'
      - 'artifacts/api-server/src/routes/index.ts'
      - 'artifacts/api-server/migrations/20260829_notes_studio_source_pack.sql'
      - 'artifacts/admin-app/src/pages/content/NotesStudio**'
      - 'artifacts/admin-app/src/App.tsx'
      - 'artifacts/admin-app/src/types/es2021-string.d.ts'
  workflow_dispatch:

concurrency:
  group: notes-studio-ns002-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-notes-studio-source-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run source-pack contract tests
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/source-pack.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-source-pack.test.mjs
          node artifacts/api-server/dist/notes-studio-source-pack.test.mjs
      - name: Verify migration safety boundaries
        run: |
          grep -F "CREATE TABLE IF NOT EXISTS content.source_documents" artifacts/api-server/migrations/20260829_notes_studio_source_pack.sql
          grep -F "reference_only" artifacts/api-server/migrations/20260829_notes_studio_source_pack.sql
          grep -F "retention_mode = 'metadata_only' AND extracted_text IS NULL" artifacts/api-server/migrations/20260829_notes_studio_source_pack.sql
          grep -F "target_resource_id UUID REFERENCES content.learning_resources" artifacts/api-server/migrations/20260829_notes_studio_source_pack.sql
      - name: Verify API route and publication locks
        run: |
          grep -F 'adminNotesStudioRouter' artifacts/api-server/src/routes/index.ts
          grep -F 'automaticGenerationEnabled: false' artifacts/api-server/src/routes/admin-notes-studio.ts
          grep -F 'automaticPublicationEnabled: false' artifacts/api-server/src/routes/admin-notes-studio.ts
          grep -F 'rawFilePersisted: false' artifacts/api-server/src/routes/admin-notes-studio.ts
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Typecheck admin app
        run: pnpm --dir artifacts/admin-app typecheck
