name: Validate NUM-CP-014 cumulative landing

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-014/**"
      - "artifacts/api-server/src/question-studio/shared-generation-engine-cp014.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-cp014.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-registry.ts"
      - ".github/workflows/num-cp014-cumulative-landing-v1.yml"
  workflow_dispatch:

concurrency:
  group: num-cp014-cumulative-landing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-num-cp014-cumulative-landing:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle CP014 landing audits
        shell: bash
        run: |
          set -euo pipefail
          root="src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-014"
          for spec in \
            "wave05/freeze-readiness-projection.test.ts:freeze-readiness" \
            "permanent-allocation.test.ts:allocation" \
            "permanent-runtime.test.ts:english" \
            "localization/runtime-parity.test.ts:localization-parity" \
            "localization/runtime-human-quality.test.ts:localization-quality" \
            "question-studio-integration.test.ts:question-studio" \
            "cumulative-landing.test.ts:cumulative"; do
            file="${spec%%:*}"; name="${spec##*:}"
            pnpm --dir artifacts/api-server exec esbuild "$root/$file" --bundle --platform=node --format=esm --outfile="dist/quant-v4/num-cp014-$name.mjs"
          done
      - name: Run CP014 landing audits
        shell: bash
        run: |
          set -euo pipefail
          for name in freeze-readiness allocation english localization-parity localization-quality question-studio cumulative; do
            node "artifacts/api-server/dist/quant-v4/num-cp014-$name.mjs"
          done
      - name: Bundle CP014 admin route and shared facade
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/routes/admin-question-studio-cp014.ts --bundle --platform=node --format=esm --outfile=dist/routes/admin-question-studio-cp014.mjs
          pnpm --dir artifacts/api-server exec esbuild src/question-studio/shared-generation-engine-cp014.ts --bundle --platform=node --format=esm --outfile=dist/question-studio/shared-generation-engine-cp014.mjs
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
