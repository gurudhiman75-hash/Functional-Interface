name: Validate SPA PFC TPF Question Studio Operator Review V1.3

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pfc-tpf-question-studio-operator-review-v1-3:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle PFC TPF Studio V1.2 regression and V1.3 remediation gates
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-paper-folding-question-studio-operator-review-v1-2.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-paper-folding-question-studio-operator-review-v1-2.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-paper-folding-question-studio-visual-direction-remediation-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-paper-folding-question-studio-visual-direction-remediation-v1.test.mjs
      - name: Re-run complete V1.2 operator-review regression
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-question-studio-operator-review-v1-2.test.mjs
      - name: Validate V1.3 transparent fold-direction remediation
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-question-studio-visual-direction-remediation-v1.test.mjs
      - name: Upload PFC TPF Studio operator review V1.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: spa-pfc-tpf-question-studio-operator-review-v1-3
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-question-studio-operator-review-v1-3.html
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-question-studio-operator-review-v1-3-evidence.json
          if-no-files-found: error
