name: Validate canonical Student Administration

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/lib/admin-student-administration.ts
      - artifacts/api-server/src/lib/admin-student-administration.test.ts
      - artifacts/api-server/src/middlewares/auth.ts
      - artifacts/api-server/src/routes/admin-student-actions.ts
      - artifacts/api-server/src/routes/admin-student-account-lifecycle.ts
      - artifacts/api-server/src/routes/admin-student-operations.ts
      - artifacts/api-server/src/routes/admin-students.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/examtree/src/lib/auth.ts
      - artifacts/admin-app/src/features/students/**
      - artifacts/admin-app/src/pages/users/StudentsPage.tsx
      - artifacts/admin-app/src/pages/users/StudentDetailPage.tsx
      - artifacts/admin-app/src/pages/users/StudentsWorkspacePage.tsx
      - artifacts/admin-app/src/pages/users/StudentProfileWorkspacePage.tsx
      - artifacts/admin-app/src/App.tsx
      - artifacts/admin-app/src/app/nav/navigation.ts
      - artifacts/admin-app/src/test/admin-navigation.test.ts
      - docs/student-administration-foundation.md
      - docs/frontend-truth-audit.md
      - .github/workflows/student-administration.yml
  push:
    branches: [New-main]
    paths:
      - artifacts/api-server/src/lib/admin-student-administration.ts
      - artifacts/api-server/src/lib/admin-student-administration.test.ts
      - artifacts/api-server/src/middlewares/auth.ts
      - artifacts/api-server/src/routes/admin-student-actions.ts
      - artifacts/api-server/src/routes/admin-student-account-lifecycle.ts
      - artifacts/api-server/src/routes/admin-student-operations.ts
      - artifacts/api-server/src/routes/admin-students.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/examtree/src/lib/auth.ts
      - artifacts/admin-app/src/features/students/**
      - artifacts/admin-app/src/pages/users/StudentsPage.tsx
      - artifacts/admin-app/src/pages/users/StudentDetailPage.tsx
      - artifacts/admin-app/src/pages/users/StudentsWorkspacePage.tsx
      - artifacts/admin-app/src/pages/users/StudentProfileWorkspacePage.tsx
      - artifacts/admin-app/src/App.tsx
      - artifacts/admin-app/src/app/nav/navigation.ts
      - artifacts/admin-app/src/test/admin-navigation.test.ts
      - docs/student-administration-foundation.md
      - docs/frontend-truth-audit.md
      - .github/workflows/student-administration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-student-administration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-student-administration:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce canonical RBAC and lifecycle boundaries
        run: |
          grep -F 'router.use("/admin/students", adminStudentAccountLifecycleRouter)' artifacts/api-server/src/routes/index.ts
          grep -F 'router.use("/admin/students", adminStudentActionsRouter)' artifacts/api-server/src/routes/index.ts
          grep -F 'router.use("/admin/students", adminStudentOperationsRouter)' artifacts/api-server/src/routes/index.ts
          grep -F 'router.use("/admin/students", adminStudentsRouter)' artifacts/api-server/src/routes/index.ts
          grep -F "requireAdminPermission('users.students.read')" artifacts/api-server/src/routes/admin-students.ts
          grep -F "requireAdminPermission('users.students.manage')" artifacts/api-server/src/routes/admin-student-actions.ts
          grep -F "requireAdminPermission('users.students.manage')" artifacts/api-server/src/routes/admin-student-account-lifecycle.ts
          grep -F "requireAdminPermission('users.students.manage')" artifacts/api-server/src/routes/admin-student-operations.ts
          grep -F 'FOR UPDATE OF u' artifacts/api-server/src/routes/admin-student-actions.ts
          grep -F 'FOR UPDATE OF u' artifacts/api-server/src/routes/admin-student-account-lifecycle.ts
          grep -F 'platform.audit_events' artifacts/api-server/src/routes/admin-student-actions.ts
          grep -F 'platform.audit_events' artifacts/api-server/src/routes/admin-student-account-lifecycle.ts
          grep -F 'platform.audit_events' artifacts/api-server/src/routes/admin-student-operations.ts
          grep -F 'revokeRefreshTokens' artifacts/api-server/src/routes/admin-student-actions.ts
          grep -F 'revokeRefreshTokens' artifacts/api-server/src/routes/admin-student-account-lifecycle.ts
          grep -F 'revokeRefreshTokens' artifacts/api-server/src/routes/admin-student-operations.ts
          grep -F 'verifyIdToken(token, true)' artifacts/api-server/src/middlewares/auth.ts
          grep -F 'ACCOUNT_SUSPENDED' artifacts/api-server/src/middlewares/auth.ts
          grep -F 'ACCOUNT_UNAVAILABLE' artifacts/api-server/src/middlewares/auth.ts
          grep -F 'SESSION_REVOKED' artifacts/api-server/src/middlewares/auth.ts
          grep -F 'STUDENT_ACTION_REASON_REQUIRED' artifacts/api-server/src/lib/admin-student-administration.ts
          grep -F 'STUDENT_STATE_CHANGED' artifacts/api-server/src/lib/admin-student-administration.ts
          grep -F "'disable'" artifacts/api-server/src/lib/admin-student-administration.ts
          grep -F "'enable'" artifacts/api-server/src/lib/admin-student-administration.ts
          grep -F 'account-suspended' artifacts/examtree/src/lib/auth.ts
          grep -F 'account-unavailable' artifacts/examtree/src/lib/auth.ts
          grep -F 'session-revoked' artifacts/examtree/src/lib/auth.ts
          ! grep -F 'usePrototypeStore' artifacts/admin-app/src/pages/users/StudentsWorkspacePage.tsx
          ! grep -F 'usePrototypeStore' artifacts/admin-app/src/pages/users/StudentProfileWorkspacePage.tsx
          grep -F "permission: 'users.students.read'" artifacts/admin-app/src/app/nav/navigation.ts
          grep -F "path: '/users/students/:id'" artifacts/admin-app/src/App.tsx

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Verify Student Administration route bundle
        run: |
          grep -R 'STUDENT_NOT_FOUND' artifacts/api-server/dist >/dev/null
          grep -R 'users.students.read' artifacts/api-server/dist >/dev/null
          grep -R 'users.students.manage' artifacts/api-server/dist >/dev/null
          grep -R 'student.account.suspended' artifacts/api-server/dist >/dev/null
          grep -R 'student.account.reactivated' artifacts/api-server/dist >/dev/null
          grep -R 'student.account.disabled' artifacts/api-server/dist >/dev/null
          grep -R 'student.account.enabled' artifacts/api-server/dist >/dev/null
          grep -R 'student.sessions.revoked' artifacts/api-server/dist >/dev/null
          grep -R 'revokeRefreshTokens' artifacts/api-server/dist >/dev/null
          grep -R 'SESSION_REVOKED' artifacts/api-server/dist >/dev/null

      - name: Test Student Administration lifecycle contracts
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/lib/admin-student-administration.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-student-administration.test.mjs
          node artifacts/api-server/dist/admin-student-administration.test.mjs

      - name: Typecheck admin application
        run: pnpm run typecheck:admin

      - name: Test admin application
        run: pnpm run test:admin

      - name: Build admin application
        run: pnpm run build:admin
