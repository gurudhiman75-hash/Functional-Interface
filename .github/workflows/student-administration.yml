name: Validate canonical Student Administration

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/lib/admin-student-administration.ts
      - artifacts/api-server/src/lib/admin-student-administration.test.ts
      - artifacts/api-server/src/middlewares/auth.ts
      - artifacts/api-server/src/routes/student-account-recovery.ts
      - artifacts/api-server/src/routes/admin-student-actions.ts
      - artifacts/api-server/src/routes/admin-student-account-recovery.ts
      - artifacts/api-server/src/routes/admin-student-recovery-requests.ts
      - artifacts/api-server/src/routes/admin-student-disable-actions.ts
      - artifacts/api-server/src/routes/admin-student-lifecycle-consistency.ts
      - artifacts/api-server/src/routes/admin-student-operations.ts
      - artifacts/api-server/src/routes/admin-students.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/examtree/src/lib/auth.ts
      - artifacts/examtree/src/lib/account-recovery-contract.ts
      - artifacts/examtree/src/lib/account-recovery-contract.test.ts
      - artifacts/examtree/src/pages/account-recovery.tsx
      - artifacts/examtree/src/pages/login.tsx
      - artifacts/examtree/src/App.tsx
      - artifacts/admin-app/src/features/students/**
      - artifacts/admin-app/src/pages/users/StudentsPage.tsx
      - artifacts/admin-app/src/pages/users/StudentDetailPage.tsx
      - artifacts/admin-app/src/pages/users/RecoveryRequestsPage.tsx
      - artifacts/admin-app/src/pages/users/StudentsWorkspacePage.tsx
      - artifacts/admin-app/src/pages/users/StudentProfileWorkspacePage.tsx
      - artifacts/admin-app/src/App.tsx
      - artifacts/admin-app/src/app/nav/navigation.ts
      - artifacts/admin-app/src/test/admin-navigation.test.ts
      - docs/student-administration-foundation.md
      - docs/frontend-truth-audit.md
      - .github/workflows/student-administration.yml
  push:
    branches: [New-main]
    paths:
      - artifacts/api-server/src/lib/admin-student-administration.ts
      - artifacts/api-server/src/lib/admin-student-administration.test.ts
      - artifacts/api-server/src/middlewares/auth.ts
      - artifacts/api-server/src/routes/student-account-recovery.ts
      - artifacts/api-server/src/routes/admin-student-actions.ts
      - artifacts/api-server/src/routes/admin-student-account-recovery.ts
      - artifacts/api-server/src/routes/admin-student-recovery-requests.ts
      - artifacts/api-server/src/routes/admin-student-disable-actions.ts
      - artifacts/api-server/src/routes/admin-student-lifecycle-consistency.ts
      - artifacts/api-server/src/routes/admin-student-operations.ts
      - artifacts/api-server/src/routes/admin-students.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/examtree/src/lib/auth.ts
      - artifacts/examtree/src/lib/account-recovery-contract.ts
      - artifacts/examtree/src/lib/account-recovery-contract.test.ts
      - artifacts/examtree/src/pages/account-recovery.tsx
      - artifacts/examtree/src/pages/login.tsx
      - artifacts/examtree/src/App.tsx
      - artifacts/admin-app/src/features/students/**
      - artifacts/admin-app/src/pages/users/StudentsPage.tsx
      - artifacts/admin-app/src/pages/users/StudentDetailPage.tsx
      - artifacts/admin-app/src/pages/users/RecoveryRequestsPage.tsx
      - artifacts/admin-app/src/pages/users/StudentsWorkspacePage.tsx
      - artifacts/admin-app/src/pages/users/StudentProfileWorkspacePage.tsx
      - artifacts/admin-app/src/App.tsx
      - artifacts/admin-app/src/app/nav/navigation.ts
      - artifacts/admin-app/src/test/admin-navigation.test.ts
      - docs/student-administration-foundation.md
      - docs/frontend-truth-audit.md
      - .github/workflows/student-administration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-student-administration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-student-administration:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce canonical RBAC, lifecycle and recovery safeguards
        run: |
          grep -F 'router.use("/account-recovery", studentAccountRecoveryRouter)' artifacts/api-server/src/routes/index.ts
          grep -F 'router.use("/admin/students", adminStudentAccountRecoveryRouter)' artifacts/api-server/src/routes/index.ts
          grep -F 'router.use("/admin/students", adminStudentRecoveryRequestsRouter)' artifacts/api-server/src/routes/index.ts
          grep -F 'router.use("/admin/students", adminStudentLifecycleConsistencyRouter)' artifacts/api-server/src/routes/index.ts
          test "$(grep -n 'adminStudentAccountRecoveryRouter)' artifacts/api-server/src/routes/index.ts | cut -d: -f1)" -lt "$(grep -n 'adminStudentLifecycleConsistencyRouter)' artifacts/api-server/src/routes/index.ts | cut -d: -f1)"
          grep -F "requireAdminPermission('users.students.manage')" artifacts/api-server/src/routes/admin-student-account-recovery.ts
          grep -F "requireAdminPermission('users.students.manage')" artifacts/api-server/src/routes/admin-student-recovery-requests.ts
          grep -F 'RECOVERY_RESOLUTION_REQUIRES_RELINK' artifacts/api-server/src/routes/admin-student-recovery-requests.ts
          grep -F 'RECOVERY_REQUEST_NOT_UNDER_REVIEW' artifacts/api-server/src/routes/admin-student-account-recovery.ts
          grep -F 'RECOVERY_REQUEST_ALREADY_USED' artifacts/api-server/src/routes/admin-student-account-recovery.ts
          grep -F 'operationAuditEventId' artifacts/api-server/src/routes/admin-student-account-recovery.ts
          grep -F 'recoveryRequestId' artifacts/api-server/src/routes/admin-student-account-recovery.ts
          grep -F 'emailVerified' artifacts/api-server/src/routes/admin-student-account-recovery.ts
          grep -F 'FIREBASE_RECOVERY_IDENTITY_CONFLICT' artifacts/api-server/src/routes/admin-student-account-recovery.ts
          grep -F 'revokeRefreshTokens' artifacts/api-server/src/routes/admin-student-account-recovery.ts
          grep -F "priorStatus === 'disabled' ? 'disabled' : 'suspended'" artifacts/api-server/src/routes/admin-student-account-recovery.ts
          grep -F 'oldIdentityFingerprint' artifacts/api-server/src/routes/admin-student-account-recovery.ts
          grep -F 'newIdentityFingerprint' artifacts/api-server/src/routes/admin-student-account-recovery.ts
          grep -F 'CLOSED_REQUEST_COOLDOWN_HOURS' artifacts/api-server/src/routes/student-account-recovery.ts
          grep -F "previousState === 'pending' || previousState === 'under_review'" artifacts/api-server/src/routes/student-account-recovery.ts
          grep -F "metadata ->> 'resolvedAt'" artifacts/api-server/src/routes/student-account-recovery.ts
          grep -F "metadata ->> 'reviewedAt'" artifacts/api-server/src/routes/student-account-recovery.ts
          grep -F 'FOR UPDATE' artifacts/api-server/src/routes/student-account-recovery.ts
          grep -F 'isActiveDuplicate' artifacts/api-server/src/routes/student-account-recovery.ts
          grep -F 'isClosedCooldown' artifacts/api-server/src/routes/student-account-recovery.ts
          grep -F 'ACCOUNT_RECOVERY_COMPLETED' artifacts/api-server/src/middlewares/auth.ts
          grep -F 'later_lifecycle.occurred_at > recovery.occurred_at' artifacts/api-server/src/middlewares/auth.ts
          grep -F "later_lifecycle.action_key LIKE 'student.account.%'" artifacts/api-server/src/middlewares/auth.ts
          grep -F 'verifyIdToken(token, true)' artifacts/api-server/src/middlewares/auth.ts
          grep -F 'SESSION_REVOKED' artifacts/api-server/src/middlewares/auth.ts
          grep -F 'ACCOUNT_RECOVERY_COMPLETED' artifacts/examtree/src/lib/auth.ts
          grep -F 'account-recovery-completed' artifacts/examtree/src/lib/auth.ts
          grep -F 'Can’t access your account?' artifacts/examtree/src/App.tsx
          grep -F '/account-recovery' artifacts/examtree/src/App.tsx
          grep -F 'sendPasswordResetEmail' artifacts/examtree/src/pages/account-recovery.tsx
          grep -F '/account-recovery/request' artifacts/examtree/src/pages/account-recovery.tsx
          grep -F 'PASSWORD_RESET_ACCEPTED_MESSAGE' artifacts/examtree/src/lib/account-recovery-contract.ts
          grep -F 'recoverStudentFirebaseIdentity' artifacts/admin-app/src/features/students/api.ts
          grep -F 'recoveryRequestId' artifacts/admin-app/src/features/students/api.ts
          grep -F 'Open verified recovery' artifacts/admin-app/src/pages/users/RecoveryRequestsPage.tsx
          ! grep -F "review(entry.id, 'resolved')" artifacts/admin-app/src/pages/users/RecoveryRequestsPage.tsx
          grep -F 'Relink verified Firebase identity' artifacts/admin-app/src/pages/users/StudentDetailPage.tsx

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Verify Student Administration route bundle
        run: |
          grep -R 'student.account.firebase_identity_relinked' artifacts/api-server/dist >/dev/null
          grep -R 'RECOVERY_RESOLUTION_REQUIRES_RELINK' artifacts/api-server/dist >/dev/null
          grep -R 'RECOVERY_REQUEST_NOT_UNDER_REVIEW' artifacts/api-server/dist >/dev/null
          grep -R 'RECOVERY_REQUEST_ALREADY_USED' artifacts/api-server/dist >/dev/null
          grep -R 'FIREBASE_RECOVERY_EMAIL_NOT_VERIFIED' artifacts/api-server/dist >/dev/null
          grep -R 'FIREBASE_RECOVERY_IDENTITY_CONFLICT' artifacts/api-server/dist >/dev/null
          grep -R 'ACCOUNT_RECOVERY_COMPLETED' artifacts/api-server/dist >/dev/null
          grep -R 'CLOSED_REQUEST_COOLDOWN_HOURS' artifacts/api-server/dist >/dev/null
          grep -R 'student-account-recovery' artifacts/api-server/dist >/dev/null
          grep -R 'revokeRefreshTokens' artifacts/api-server/dist >/dev/null
          grep -R 'SESSION_REVOKED' artifacts/api-server/dist >/dev/null

      - name: Test Student Administration lifecycle contracts
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/lib/admin-student-administration.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/admin-student-administration.test.mjs
          node artifacts/api-server/dist/admin-student-administration.test.mjs

      - name: Test web account recovery contracts
        run: |
          pnpm --dir artifacts/api-server exec esbuild ../examtree/src/lib/account-recovery-contract.test.ts --bundle --packages=external --platform=node --format=esm --outfile=../examtree/dist/account-recovery-contract.test.mjs
          node artifacts/examtree/dist/account-recovery-contract.test.mjs

      - name: Typecheck admin application
        run: pnpm run typecheck:admin

      - name: Test admin application
        run: pnpm run test:admin

      - name: Build admin application
        run: pnpm run build:admin

      - name: Build student application
        run: pnpm run build:web
