name: Validate English CP012 V1

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/english-v1/chapters/**/ENG-001/CP012/**
      - artifacts/api-server/src/english-v1/**/eng-001-cp012*
      - artifacts/api-server/src/english-v1/**/ENG-001-CP012*
      - artifacts/api-server/src/question-studio/engines/*eng001-cp012*
  push:
    branches:
      - New-main
    paths:
      - artifacts/api-server/src/english-v1/chapters/**/ENG-001/CP012/**
      - artifacts/api-server/src/english-v1/**/eng-001-cp012*
      - artifacts/api-server/src/english-v1/**/ENG-001-CP012*
      - artifacts/api-server/src/question-studio/engines/*eng001-cp012*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-cp012-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp012-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile CP012 V1 stress test
        run: |
          mkdir -p artifacts/api-server/dist/english-v1
          pnpm --dir artifacts/api-server exec esbuild src/english-v1/tests/eng-001-cp012-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-001-cp012-v1.test.mjs
      - name: Run CP012 V1 generation and validation matrix
        run: node artifacts/api-server/dist/english-v1/eng-001-cp012-v1.test.mjs
      - name: Compile approved CP012 V1 review exporter test
        run: pnpm --dir artifacts/api-server exec esbuild src/english-v1/tests/eng-001-cp012-v1-review.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-001-cp012-v1-review.test.mjs
      - name: Regenerate approved CP012 V1 review artifact
        run: node artifacts/api-server/dist/english-v1/eng-001-cp012-v1-review.test.mjs
      - name: Verify exact approved CP012 V1 review SHA-256
        run: |
          echo "afaedd78c49c31c08d480c00845d5a80f83406d3c0962695dcdebf6d4a01528d  dist/english-v1/ENG-001-CP012-REVIEW-V1.md" | sha256sum --check --strict
      - name: Upload approved CP012 V1 review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENG-001-CP012-REVIEW-V1
          path: dist/english-v1/ENG-001-CP012-REVIEW-V1.md
          if-no-files-found: error
      - name: Compile CP012 Question Studio integration test
        run: pnpm --dir artifacts/api-server exec esbuild src/question-studio/engines/language-v1-eng001-cp012-adapter-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/language-v1-eng001-cp012-adapter-v1.test.mjs
      - name: Run CP012 Question Studio review-only integration test
        run: node artifacts/api-server/dist/english-v1/language-v1-eng001-cp012-adapter-v1.test.mjs
      - name: Compile CP011 Question Studio regression
        run: pnpm --dir artifacts/api-server exec esbuild src/question-studio/engines/language-v1-eng001-cp011-adapter-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/language-v1-eng001-cp011-adapter-v1-regression.test.mjs
      - name: Run CP011 Question Studio regression
        run: node artifacts/api-server/dist/english-v1/language-v1-eng001-cp011-adapter-v1-regression.test.mjs
      - name: Compile CP011 generator regression
        run: pnpm --dir artifacts/api-server exec esbuild src/english-v1/tests/eng-001-cp011-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-001-cp011-v1-regression.test.mjs
      - name: Re-run approved CP011 generator regression
        run: node artifacts/api-server/dist/english-v1/eng-001-cp011-v1-regression.test.mjs
      - name: Compile shared Question Studio engine-registry test
        run: pnpm --dir artifacts/api-server exec esbuild src/question-studio/engine-registry.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/engine-registry.test.mjs
      - name: Run shared Question Studio engine-registry test
        run: node artifacts/api-server/dist/english-v1/engine-registry.test.mjs
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Typecheck admin app
        run: pnpm --dir artifacts/admin-app exec tsc -p tsconfig.json --noEmit
