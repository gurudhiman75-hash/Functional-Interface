name: Measure SEA-001 final realness gate

on:
  push:
    branches:
      - feat/sea-001-realness-final-gate
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/**
      - .github/workflows/sea-001-final-realness-measurement.yml
  pull_request:
    branches:
      - feat/sea-001-wave5-saturation-audits
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/**
      - .github/workflows/sea-001-final-realness-measurement.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  final-realness-measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sea-001-realness-final-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove technical source saturation and fail-closed family boundary
        run: |
          node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/sea-001-source-audit-proof.test.ts
          node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/sea-001-exam-profile-evidence-proof.test.ts
          node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/sea-001-final-realness-readiness-proof.test.ts
      - name: Measure source saturation, distribution, structural novelty and multilingual template realness
        id: measure
        shell: bash
        run: |
          set +e
          node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/sea-001-final-realness-measurement.test.ts > /tmp/sea001-realness.txt 2>&1
          code=$?
          echo "" >> /tmp/sea001-realness.txt
          echo "exit_code=$code" >> /tmp/sea001-realness.txt
          echo "workflow_head=${GITHUB_SHA}" >> /tmp/sea001-realness.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/sea001-realness.txt
          exit 0
      - name: Attach measurement evidence to audit PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### SEA-001 final realness measurement'
            echo
            echo '```text'
            cat /tmp/sea001-realness.txt
            echo '```'
          } > /tmp/sea001-comment.md
          gh pr comment 925 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/sea001-comment.md
      - name: Enforce measurement process success
        if: steps.measure.outputs.exit_code != '0'
        run: exit 1
