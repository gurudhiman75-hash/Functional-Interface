name: Apply admin integration finalization

on:
  push:
    branches:
      - replace-admin-with-new-panel
    paths:
      - scripts/finalize-admin-integration.mjs
      - .github/workflows/apply-admin-finalization.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replace-admin-with-new-panel
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic source corrections
        run: node scripts/finalize-admin-integration.mjs
      - name: Commit corrected source and remove one-time tooling
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/finalize-admin-integration.mjs
          rm .github/workflows/apply-admin-finalization.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/admin-app/src/pages/content/QuestionStudioLivePage.tsx scripts .github/workflows
          git commit -m 'Polish live Question Studio integration'
          git push origin HEAD:replace-admin-with-new-panel
