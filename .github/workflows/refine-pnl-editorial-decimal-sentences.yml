name: Refine PNL Editorial Decimal Sentences

on:
  pull_request:
    paths:
      - ".github/workflows/refine-pnl-editorial-decimal-sentences.yml"

permissions:
  contents: write

jobs:
  refine-editorial-decimal-sentences:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature source
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-cp005-explanation-diversity

      - name: Protect decimal points during sentence splitting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-001-english-editorial-audit.ts")
          source = path.read_text()
          old = '''  const last = paragraphs.at(-1) ?? "";
            const sentences =
              last
                .match(/[^.!?]+[.!?]?/g)
                ?.map((item) => item.trim())
                .filter(Boolean) ?? [];
            return sentences.at(-1) ?? last;'''
          new = '''  const last = paragraphs.at(-1) ?? "";
            const decimalToken = "<DECIMAL_POINT>";
            const protectedLast = last.replace(/(\\d)\\.(\\d)/g, `$1${decimalToken}$2`);
            const sentences =
              protectedLast
                .match(/[^.!?]+[.!?]?/g)
                ?.map((item) => item.replaceAll(decimalToken, ".").trim())
                .filter(Boolean) ?? [];
            return sentences.at(-1) ?? last;'''
          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source)
          elif "<DECIMAL_POINT>" not in source:
              start = source.index("function lastEditorialSentence(")
              end = source.index("function csvCell(", start)
              block = source[start:end]
              if "const last = paragraphs.at(-1)" not in block:
                  raise SystemExit("Editorial sentence block not found")
              block = block.replace(
                  '  const last = paragraphs.at(-1) ?? "";\n',
                  '  const last = paragraphs.at(-1) ?? "";\n  const decimalToken = "<DECIMAL_POINT>";\n  const protectedLast = last.replace(/(\\d)\\.(\\d)/g, `$1${decimalToken}$2`);\n',
                  1,
              ).replace("    last\n      .match", "    protectedLast\n      .match", 1).replace(
                  ".map((item) => item.trim())",
                  '.map((item) => item.replaceAll(decimalToken, ".").trim())',
                  1,
              )
              source = source[:start] + block + source[end:]
              path.write_text(source)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Format audit source
        run: pnpm exec prettier --write artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-001-english-editorial-audit.ts

      - name: Run CP-005 and chapter proofs
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/cp005-dynamic-runtime.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/.cp005-dynamic-runtime.test.mjs \
            2>&1 | tee pnl-editorial-decimal-sentences.log
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/.cp005-dynamic-runtime.test.mjs \
            2>&1 | tee -a pnl-editorial-decimal-sentences.log
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-001-english-editorial-audit.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.pnl-001-english-editorial-audit.mjs \
            2>&1 | tee -a pnl-editorial-decimal-sentences.log
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.pnl-001-english-editorial-audit.mjs \
            2>&1 | tee -a pnl-editorial-decimal-sentences.log

      - name: Commit proven audit correction
        run: |
          if git diff --quiet -- artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-001-english-editorial-audit.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-001-english-editorial-audit.ts
          git commit -m "fix(pnl): preserve decimals in editorial sentence audit"
          git push origin HEAD:feat/pnl-001-cp005-explanation-diversity

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnl-editorial-decimal-sentence-refinement
          path: |
            pnl-editorial-decimal-sentences.log
            dist/quant-v4/pnl-001-english-editorial-audit
          if-no-files-found: error
          retention-days: 14
