name: MEN-CP-007 Wave02 Escape Patch

on:
  pull_request:
    branches:
      - feat/men-002-cp007-gap-wave-03
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-cp007-wave02-escape-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Correct Wave-02 rupee MathJax escapes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-02/runtime.ts")
          lines = path.read_text(encoding="utf8").splitlines()
          painting = [i for i, line in enumerate(lines) if 'shortcut: `For this box, $Rate=' in line]
          material = [i for i, line in enumerate(lines) if 'shortcut: `Here $V=' in line and 'Cost=' in line]
          material_step = [i for i, line in enumerate(lines) if 'title: "Apply the Cubic-Metre Rate"' in line]
          if len(painting) != 1 or len(material) != 1 or len(material_step) != 1:
            raise SystemExit(f"Unexpected matches: painting={len(painting)}, material={len(material)}, step={len(material_step)}")
          lines[painting[0]] = '    shortcut: `For this box, $Rate=\\\\frac{\\\\text{₹}${formatIndianInteger(cost)}}{${tsa}\\\\text{ m}^{2}}=\\\\frac{\\\\text{₹}${formatIndianInteger(rate)}}{\\\\text{m}^{2}}$.`,'
          lines[material[0]] = '    shortcut: `Here $V=${volume}\\\\text{ m}^{3}$, so $Cost=${volume}\\\\times\\\\text{₹}${formatIndianInteger(rate)}=\\\\text{₹}${formatIndianInteger(cost)}$.`,'
          lines[material_step[0]] = '      { title: "Apply the Cubic-Metre Rate", body: `Multiply by $\\\\text{₹}${formatIndianInteger(rate)}$ for each cubic metre.`, equation: `$$Cost=${volume}\\\\times\\\\text{₹}${formatIndianInteger(rate)}=\\\\text{₹}${formatIndianInteger(cost)}$$` },'
          path.write_text("\n".join(lines) + "\n", encoding="utf8")
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-02/runtime.ts
          git commit -m "fix(mensuration): preserve Wave-02 rupee MathJax"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
