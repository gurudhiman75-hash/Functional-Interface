name: Validate Notes Studio NS-018 Research Restart

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/migrations/20260831_notes_studio_ns018_research_restart.sql
      - artifacts/api-server/src/notes-studio/research-restart.ts
      - artifacts/api-server/src/notes-studio/research-restart.test.ts
      - artifacts/api-server/src/notes-studio/production-readiness.ts
      - artifacts/api-server/src/notes-studio/production-readiness.test.ts
      - artifacts/api-server/src/routes/admin-notes-studio-research-restart.ts
      - artifacts/api-server/src/routes/admin-notes-studio-source-policy.ts
      - artifacts/admin-app/src/pages/content/NotesStudioGapSourceRecommendationsPage.tsx
      - docs/notes-studio-ns018-research-restart.md

permissions:
  contents: read

concurrency:
  group: notes-studio-ns018-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-notes-studio-research-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run NS-018 deterministic contracts
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/research-restart.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-research-restart.test.mjs
          node artifacts/api-server/dist/notes-studio-research-restart.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/production-readiness.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-production-readiness.test.mjs
          node artifacts/api-server/dist/notes-studio-production-readiness.test.mjs

      - name: Verify restart safety boundaries
        run: |
          grep -F "APPROVED_JOB_REQUIRES_SUCCESSOR" artifacts/api-server/src/routes/admin-notes-studio-research-restart.ts
          grep -F "recommendedSourceAttachedAutomatically: false" artifacts/api-server/src/routes/admin-notes-studio-research-restart.ts
          grep -F "coveragePlanPreserved: true" artifacts/api-server/src/routes/admin-notes-studio-research-restart.ts
          grep -F "sourcePackPreserved: true" artifacts/api-server/src/routes/admin-notes-studio-research-restart.ts
          grep -F "DELETE FROM content.note_source_evidence_blocks" artifacts/api-server/src/routes/admin-notes-studio-research-restart.ts
          grep -F "DELETE FROM content.note_source_claims" artifacts/api-server/src/routes/admin-notes-studio-research-restart.ts
          grep -F "DELETE FROM content.note_sections" artifacts/api-server/src/routes/admin-notes-studio-research-restart.ts
          if grep -F "INSERT INTO content.note_authoring_sources" artifacts/api-server/src/routes/admin-notes-studio-research-restart.ts; then exit 1; fi
          if grep -F "fetch(" artifacts/api-server/src/routes/admin-notes-studio-research-restart.ts; then exit 1; fi
          grep -F "note_research_restarts_immutable" artifacts/api-server/migrations/20260831_notes_studio_ns018_research_restart.sql
          grep -F "adminNotesStudioResearchRestartRouter" artifacts/api-server/src/routes/admin-notes-studio-source-policy.ts
          grep -F "Restart with source intent" artifacts/admin-app/src/pages/content/NotesStudioGapSourceRecommendationsPage.tsx

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Typecheck admin app
        run: pnpm --dir artifacts/admin-app typecheck
