name: Validate Algebra permanent English adapter

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/quant-v4/shared/algebra/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/ALG-001/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/ALG-002/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/permanent/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/permanent-english-adapter.test.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/permanent-english-review-v2.test.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/permanent-english-review-v3.test.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/permanent-english-editorial-audit.test.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/permanent-english-review-export.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/permanent-english-freeze.test.ts
      - .github/workflows/alg-permanent-english-adapter.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alg-permanent-english-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-permanent-english-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle permanent English adapter test
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/algebra
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/permanent-english-adapter.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/quant-v4/algebra/permanent-english-adapter.test.mjs
      - name: Run permanent English adapter test
        run: |
          cd artifacts/api-server
          node dist/quant-v4/algebra/permanent-english-adapter.test.mjs
      - name: Bundle English V3 editorial proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/permanent-english-review-v3.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/quant-v4/algebra/permanent-english-review-v3.test.mjs
      - name: Run English V3 editorial proof
        run: |
          cd artifacts/api-server
          node dist/quant-v4/algebra/permanent-english-review-v3.test.mjs
      - name: Bundle permanent English editorial audit
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/permanent-english-editorial-audit.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/quant-v4/algebra/permanent-english-editorial-audit.test.mjs
      - name: Run permanent English editorial audit
        run: |
          cd artifacts/api-server
          node dist/quant-v4/algebra/permanent-english-editorial-audit.test.mjs
      - name: Bundle permanent English review exporter
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/permanent-english-review-export.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/quant-v4/algebra/permanent-english-review-export.mjs
      - name: Build English V3 human-review pack
        run: |
          cd artifacts/api-server
          node dist/quant-v4/algebra/permanent-english-review-export.mjs
      - name: Upload English V3 human-review pack
        uses: actions/upload-artifact@v4
        with:
          name: algebra-permanent-english-review-v3-109q
          path: |
            artifacts/api-server/dist/quant-v4/algebra/algebra-permanent-english-review-v3-109q.html
            artifacts/api-server/dist/quant-v4/algebra/algebra-permanent-english-review-v3-109q.json
          if-no-files-found: error
      - name: Bundle historical English V1 freeze proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/permanent-english-freeze.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/quant-v4/algebra/permanent-english-freeze.test.mjs
      - name: Run historical English V1 freeze proof
        run: |
          cd artifacts/api-server
          node dist/quant-v4/algebra/permanent-english-freeze.test.mjs
