name: Probability comprehensive Markdown

on:
  push:
    branches:
      - feat/prb-probability-end-to-end
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Probability/generate-comprehensive-questions.ts"
      - "artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/human-review-en.csv"
      - "artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/human-review-en.csv"
      - ".github/workflows/prb-comprehensive-markdown.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-comprehensive-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate comprehensive question file
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/generate-comprehensive-questions.ts

      - name: Verify Markdown coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-COMPREHENSIVE-QUESTIONS-AND-EXPLANATIONS.md")
          if not path.exists():
              raise SystemExit("Comprehensive Markdown file was not generated.")

          text = path.read_text()
          checks = {
              "questions": text.count("\n#### Question "),
              "answers": text.count("\n**Correct answer:**"),
              "explanations": text.count("\n**Explanation:**"),
          }
          if checks != {"questions": 135, "answers": 135, "explanations": 135}:
              raise SystemExit(f"Markdown coverage mismatch: {checks}")
          if "| PRB-001 | SSC CGL/CHSL | 75 | 4 |" not in text:
              raise SystemExit("PRB-001 summary is missing.")
          if "| PRB-002 | Banking Mains | 60 | 5 |" not in text:
              raise SystemExit("PRB-002 summary is missing.")
          PY
          git diff --check

      - name: Commit generated Markdown
        if: success()
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-COMPREHENSIVE-QUESTIONS-AND-EXPLANATIONS.md
          git commit -m "docs(probability): add 135 comprehensive questions and explanations [skip ci]"
          git push
