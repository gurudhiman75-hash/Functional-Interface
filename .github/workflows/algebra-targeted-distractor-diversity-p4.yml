name: Validate Algebra targeted distractor diversity P4

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/algebra-question-studio-runtime-v4.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/targeted-distractor-diversity-p4.test.ts
      - .github/workflows/algebra-targeted-distractor-diversity-p4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-targeted-distractor-diversity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle targeted distractor proof
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/algebra
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/targeted-distractor-diversity-p4.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/quant-v4/algebra/targeted-distractor-diversity-p4.test.mjs
      - name: Run targeted distractor proof
        run: |
          cd artifacts/api-server
          node dist/quant-v4/algebra/targeted-distractor-diversity-p4.test.mjs
