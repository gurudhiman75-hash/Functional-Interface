name: SRI Phase 9 dedupe localization diagnostics

on:
  push:
    branches:
      - feature/sri-v4-phase9-localization-v1
    paths:
      - .github/workflows/sri-v4-phase9-dedupe-localization-diagnostics.yml

permissions:
  contents: write

jobs:
  patch-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sri-v4-phase9-localization-v1
      - name: Deduplicate language-quality failures
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/tests/permanent-localization-v1.test.ts')
          text = path.read_text(encoding='utf-8')
          replacements = {
            'const nativeScriptFailures: string[] = [];': 'const nativeScriptFailures = new Set<string>();',
            'const residualFailures: string[] = [];': 'const residualFailures = new Set<string>();',
            'if (!NATIVE_SCRIPT[locale].test(text) && nativeScriptFailures.length < 80) {': 'if (!NATIVE_SCRIPT[locale].test(text) && nativeScriptFailures.size < 160) {',
            'nativeScriptFailures.push(`${allocation.qlId}/${q.candidateId}/${locale}: expected native script :: ${text}`);': 'nativeScriptFailures.add(`${allocation.qlId}/${q.candidateId}/${locale}: expected native script :: ${text}`);',
            'if (residues.length > 0 && residualFailures.length < 80) {': 'if (residues.length > 0 && residualFailures.size < 160) {',
            'residualFailures.push(`${allocation.qlId}/${q.candidateId}/${locale}: ${[...new Set(residues)].join(", ")} :: ${learnerText.replaceAll("\\n", " | ")}`);': 'residualFailures.add(`${allocation.qlId}/${q.candidateId}/${locale}: ${[...new Set(residues)].join(", ")} :: ${learnerText.replaceAll("\\n", " | ")}`);',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'Missing expected diagnostic pattern: {old}')
            text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit stronger diagnostic reporting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/tests/permanent-localization-v1.test.ts
          git diff --cached --check
          git commit -m "SRI Phase 9: deduplicate localization audit diagnostics"
          git push origin HEAD:feature/sri-v4-phase9-localization-v1
