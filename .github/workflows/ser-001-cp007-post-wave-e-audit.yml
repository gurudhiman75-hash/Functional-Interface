name: Audit SER-001 CP-007 post-Wave-E

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-B/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-C/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-D/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-E/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-POST-WAVE-E-AUDIT/**
      - .github/workflows/ser-001-cp007-post-wave-e-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-cp007-post-wave-e-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-post-wave-e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/cp007-post-wave-e-audit

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Run 17-authority collision matrix
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-POST-WAVE-E-AUDIT
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-post-wave-e-audit
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/ser-cp-007-authority-collision-matrix.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-authority-collision-matrix.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-authority-collision-matrix.test.mjs") \
            | tee "$EVIDENCE/authority-collision-matrix.json"
          grep -q 'PASS_SER_CP007_POST_WAVE_E_17_AUTHORITY_COLLISION_MATRIX' \
            "$EVIDENCE/authority-collision-matrix.json"

      - name: Collect audit report
        run: |
          set -euo pipefail
          ROOT=artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-POST-WAVE-E-AUDIT
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-post-wave-e-audit
          cp "$ROOT/ser-cp-007-authority-collision-matrix-report.md" \
            "$EVIDENCE/ser-cp-007-authority-collision-matrix-report.md"

      - name: Upload post-Wave-E audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-cp007-post-wave-e-audit
          path: artifacts/api-server/dist/reasoning-v1/ser-001/cp007-post-wave-e-audit
          if-no-files-found: error
          retention-days: 30
