name: Validate Geometry Gap Remediation Wave 3

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/quant-v4/shared/geometry/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/**
      - .github/workflows/geometry-gap-remediation-wave3.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geometry-gap-remediation-wave3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-geometry-gap-remediation-wave3:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Validate retained Geometry Source Saturation Audit V1
        run: node artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/source-audit/validate-source-saturation-audit-v1.mjs
      - name: Run retained Geometry Phases 0 through 5
        run: |
          set -euo pipefail
          for phase in 0 1 2 3 4 5; do
            pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/run-phase${phase}.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-phase${phase}-retained-for-gap-wave3.test.mjs
            node artifacts/api-server/dist/quant-v4/geometry-phase${phase}-retained-for-gap-wave3.test.mjs
          done
      - name: Run retained Geometry Gap Remediation Wave 1 proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/gap-remediation-wave1.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-gap-remediation-wave1-retained-for-wave3.test.mjs
          node artifacts/api-server/dist/quant-v4/geometry-gap-remediation-wave1-retained-for-wave3.test.mjs
      - name: Run retained Geometry Gap Remediation Wave 2 proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/gap-remediation-wave2.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-gap-remediation-wave2-retained-for-wave3.test.mjs
          node artifacts/api-server/dist/quant-v4/geometry-gap-remediation-wave2-retained-for-wave3.test.mjs
      - name: Run Geometry Gap Remediation Wave 3 proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/gap-remediation-wave3.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-gap-remediation-wave3.test.mjs
          node artifacts/api-server/dist/quant-v4/geometry-gap-remediation-wave3.test.mjs
      - name: Export Geometry Gap Remediation Wave 3 review
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/source-remediation/wave3-review-export.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-gap-remediation-wave3-review-export.mjs
          (cd artifacts/api-server && node dist/quant-v4/geometry-gap-remediation-wave3-review-export.mjs)
      - name: Upload Geometry Gap Remediation Wave 3 review
        uses: actions/upload-artifact@v4
        with:
          name: geometry-gap-remediation-wave3-review
          path: artifacts/api-server/dist/quant-v4/geometry-gap-remediation-wave3-review
          if-no-files-found: error
          retention-days: 30
