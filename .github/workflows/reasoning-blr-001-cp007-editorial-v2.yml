name: Reasoning BLR-001 CP-007 Editorial V2

on:
  push:
    branches:
      - feat/blr-001-cp007-editorial-v2
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-006/**"
      - ".github/workflows/reasoning-blr-001-cp007-editorial-v2.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-006/**"
      - ".github/workflows/reasoning-blr-001-cp007-editorial-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blr-001-cp007-editorial-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp007-editorial-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove CP-006 source runtime
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-006/cp006-runtime.test.ts | tee cp006-source.log

      - name: Prove CP-007 V1 solver baseline
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-runtime.test.ts | tee cp007-v1-baseline.log

      - name: Prove CP-007 hardened V2 contracts
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-editorial-v2-review.test.ts | tee cp007-editorial-v2-foundation.log

      - name: Prove CP-007 final human-review surface
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-editorial-v2-final-review.test.ts | tee cp007-editorial-v2-final.log

      - name: Prove CP-007 graph-valid distractor bank
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-editorial-v2-exam-review.test.ts | tee cp007-editorial-v2-exam.log

      - name: Export CP-007 V2 exam-review pack
        shell: bash
        run: |
          set -euo pipefail
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/export-cp007-editorial-v2-exam-review.ts cp007-editorial-v2-exam-review-output | tee cp007-editorial-v2-export.log

      - name: Verify CP-007 V2 artifact contracts
        shell: bash
        run: |
          set -euo pipefail
          OUT=cp007-editorial-v2-exam-review-output
          test -f "$OUT/blr-cp007-editorial-v2-exam-summary.json"
          test -f "$OUT/blr-cp007-editorial-v2-exam-records.jsonl"
          test -f "$OUT/blr-cp007-editorial-v2-exam-records.csv"
          test -f "$OUT/blr-cp007-editorial-v2-exam-review.html"
          test -f "$OUT/BLR-CP-007-EDITORIAL-V2-EXAM-REVIEW.md"
          test "$(wc -l < "$OUT/blr-cp007-editorial-v2-exam-records.jsonl")" -eq 168
          grep -q '"recordCount": 168' "$OUT/blr-cp007-editorial-v2-exam-summary.json"
          grep -q '"prototypeCount": 21' "$OUT/blr-cp007-editorial-v2-exam-summary.json"
          grep -q '"authorityCount": 5' "$OUT/blr-cp007-editorial-v2-exam-summary.json"
          grep -q '"optionAnalysisCount": 672' "$OUT/blr-cp007-editorial-v2-exam-summary.json"
          grep -q '"invalidStatementQuestionCount": 16' "$OUT/blr-cp007-editorial-v2-exam-summary.json"
          grep -q '"semicolonCorrectCount": 56' "$OUT/blr-cp007-editorial-v2-exam-summary.json"
          grep -q '"invalidGraphOptions": 0' "$OUT/blr-cp007-editorial-v2-exam-summary.json"
          grep -q '"validWrongGraphOptions": 504' "$OUT/blr-cp007-editorial-v2-exam-summary.json"
          grep -q '"humanReviewRequired": true' "$OUT/blr-cp007-editorial-v2-exam-summary.json"
          grep -q 'Candidates: P, Q, R, S' "$OUT/blr-cp007-editorial-v2-exam-review.html"
          grep -q 'All four options now form valid family graphs' "$OUT/blr-cp007-editorial-v2-exam-review.html"
          grep -q 'Human review required' "$OUT/blr-cp007-editorial-v2-exam-review.html"
          grep -q 'Administrator review proof' "$OUT/blr-cp007-editorial-v2-exam-review.html"
          grep -q 'marker-end=' "$OUT/blr-cp007-editorial-v2-exam-review.html"
          grep -q 'Solid edge: directly coded' "$OUT/blr-cp007-editorial-v2-exam-review.html"
          grep -q 'Dashed edge: inferred' "$OUT/blr-cp007-editorial-v2-exam-review.html"
          grep -q 'HUMAN_REVIEW_REQUIRED' "$OUT/blr-cp007-editorial-v2-exam-review.html"
          ! grep -q 'GENDER_CONTRADICTION' "$OUT/blr-cp007-editorial-v2-exam-records.jsonl"
          ! grep -q 'INVALID_FAMILY_GRAPH' "$OUT/blr-cp007-editorial-v2-exam-records.jsonl"
          grep -q 'V1 final-freeze review superseded' "$OUT/BLR-CP-007-EDITORIAL-V2-EXAM-REVIEW.md"

      - name: Upload CP-007 V2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp007-editorial-v2-logs
          path: |
            cp006-source.log
            cp007-v1-baseline.log
            cp007-editorial-v2-foundation.log
            cp007-editorial-v2-final.log
            cp007-editorial-v2-exam.log
            cp007-editorial-v2-export.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload CP-007 editorial V2 exam-review pack
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp007-editorial-v2-exam-review
          path: cp007-editorial-v2-exam-review-output
          if-no-files-found: error
          retention-days: 30
