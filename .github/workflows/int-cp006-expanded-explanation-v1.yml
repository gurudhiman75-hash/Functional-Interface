name: Validate INT-CP-006 Expanded Explanation Review V1

on:
  pull_request:
    branches: [New-main]
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp006-expanded-explanation-v1.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp006-expanded-explanation-v2.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp006-expanded-explanation-v3.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp006-expanded-explanation-v4.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp006-english-explanation-amendment-v1.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp006-si-ci-relations-localized-v4.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp006-si-ci-relations-localized-v5.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp006-si-ci-relations-localized-v6.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp006-expanded-explanation-v1-audit.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp006-expanded-explanation-v1-review-export.ts"
      - ".github/workflows/int-cp006-expanded-explanation-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-int-cp006-expanded-explanations:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle expanded explanation audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp006-expanded-explanation-v1-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-cp006-expanded-explanation-v1-audit.mjs
      - name: Run expanded explanation audit
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp006-expanded-explanation-v1-audit.mjs 2>&1 | tee dist/quant-v4/int-cp006-expanded-explanation-v1-audit.log
      - name: Bundle explanation review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp006-expanded-explanation-v1-review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-cp006-expanded-explanation-v1-review-export.mjs
      - name: Export expanded explanation review
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp006-expanded-explanation-v1-review-export.mjs 2>&1 | tee dist/quant-v4/int-cp006-expanded-explanation-v1-review-export.log
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Verify explanation markers
        run: |
          grep -q 'PASS_INT_CP006_EXPANDED_EXPLANATION_V1_AUDIT' artifacts/api-server/dist/quant-v4/int-cp006-expanded-explanation-v1-audit.log
          grep -q 'PASS_INT_CP006_EXPANDED_EXPLANATION_V1_REVIEW_EXPORT' artifacts/api-server/dist/quant-v4/int-cp006-expanded-explanation-v1-review-export.log
      - name: Upload expanded explanation review evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-cp006-expanded-explanation-v1-review
          path: |
            artifacts/api-server/dist/quant-v4/INT-CP-006-EXPANDED-EXPLANATION-MATCHED-REVIEW.md
            artifacts/api-server/dist/quant-v4/int-cp006-expanded-explanation-v1-audit.log
            artifacts/api-server/dist/quant-v4/int-cp006-expanded-explanation-v1-review-export.log
          if-no-files-found: error
