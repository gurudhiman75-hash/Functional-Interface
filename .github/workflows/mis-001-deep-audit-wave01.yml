name: Validate MIS-001 deep audit wave01

on:
  pull_request:
    branches: [New-main]
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Missing-Number/MIS-001/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mis-001-deep-audit-wave01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Prove chapter Question Studio integration
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Missing-Number/MIS-001/question-studio-integration.test.ts

      - name: Prove deep audit wave01 reconciliation
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Missing-Number/MIS-001/mis-001-deep-audit-wave01-v1.test.ts
