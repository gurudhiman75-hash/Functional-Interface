name: Validate Question Studio run progress contract
on:
  pull_request:
    branches: [New-main]
    paths:
      - 'artifacts/api-server/src/routes/admin-question-studio-run-status.ts'
      - 'artifacts/api-server/src/routes/admin-question-studio-registry.ts'
      - 'artifacts/admin-app/src/features/question-studio/api.ts'
      - 'tests/qs-generation-status-contract.test.mjs'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: question-studio-run-progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  progress:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm progress endpoint authorization, schema and routing contract
        run: node --test tests/qs-generation-status-contract.test.mjs
      - name: Verify no patch whitespace issues
        run: git diff --check
