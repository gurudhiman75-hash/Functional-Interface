name: Validate DSF-CP-018 Reasoning Localization

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-017/**
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-018/**
      - .github/workflows/dsf-cp018-reasoning-localization.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsf-cp018-reasoning-localization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dsf-cp018:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle CP018 localization audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-018/reasoning-localization-v1.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/dsf-cp018-reasoning-localization.test.mjs

      - name: Run CP018 localization audit
        run: node artifacts/api-server/dist/reasoning-v1/dsf-cp018-reasoning-localization.test.mjs
