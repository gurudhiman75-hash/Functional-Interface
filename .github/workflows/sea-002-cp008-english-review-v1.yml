name: Validate SEA-002 CP008 English review V3

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/**"
      - ".github/workflows/sea-002-cp008-english-review-v1.yml"
  workflow_dispatch:

concurrency:
  group: sea-002-cp008-english-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-sea-002-cp008-english:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-prove permanent allocation
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/permanent/allocation.test.ts
      - name: Prove learner-facing graph uniqueness and difficulty
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/production-review-v3.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-production-review-v3.log
      - name: Audit final English editorial set
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/english-review-v2.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-english-review-v2.log
      - name: Export canonical English review set
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/english-review-export-v2.ts
          > /tmp/sea-002-cp008-english-review-v2.json
      - name: Re-prove Wave04 ALT12 authority
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/discovery-alt12-v1.test.ts
      - name: Re-prove CP007 approval boundary
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp007/review/prefreeze-authority-v1.test.ts
      - name: Upload English review evidence
        uses: actions/upload-artifact@v4
        with:
          name: sea-002-cp008-english-review-v3
          path: |
            /tmp/sea-002-cp008-production-review-v3.log
            /tmp/sea-002-cp008-english-review-v2.log
            /tmp/sea-002-cp008-english-review-v2.json
          if-no-files-found: error
          retention-days: 30
