name: ARG-001 final merge conflict diagnostic

on:
  push:
    branches:
      - feature/arg-001-cp012-editorial-remediation
    paths:
      - .github/workflows/arg-001-final-merge-conflict-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arg-001-cp012-editorial-remediation
          fetch-depth: 0
      - name: Diagnose merge conflicts against New-main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin New-main
          set +e
          git merge --no-commit --no-ff origin/New-main
          rc=$?
          if [ "$rc" -eq 0 ]; then
            printf '%s\n' 'NO_CONFLICTS' > /tmp/arg-conflicts.txt
            git merge --abort || true
          else
            git diff --name-only --diff-filter=U > /tmp/arg-conflicts.txt
            git merge --abort || true
          fi
          mkdir -p docs/review
          cp /tmp/arg-conflicts.txt docs/review/ARG-001-FINAL-MERGE-CONFLICTS.txt
          git add docs/review/ARG-001-FINAL-MERGE-CONFLICTS.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(arg-001): record final merge conflicts"
          git push origin HEAD:feature/arg-001-cp012-editorial-remediation
