name: Validate TMW-001 CP014 multilingual editorial review
on:
  push:
    branches: [fix/tmw-001-cp014-multilingual-editorial-review]
  pull_request:
    branches: [fix/tmw-001-cp013-multilingual-editorial-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: TypeScript check
        working-directory: artifacts/api-server
        run: >-
          pnpm exec tsc --noEmit --target es2022 --module esnext --moduleResolution bundler --strictNullChecks --noImplicitAny --noImplicitReturns --skipLibCheck --types node
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp014-presentation-runtime.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp014-multilingual-editorial-finalizer.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp014-explanation-depth-finalizer.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/final-extension-presentation-polish.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/chapter-localized-runtime.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp014-multilingual-editorial-review.test.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-final-228ql-audit.test.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-multilingual-chapter-parity.test.ts
      - name: Run 480-case CP014 learner audit
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp014-multilingual-editorial-review.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/cp014-editorial.mjs && node artifacts/api-server/dist/quant-v4/cp014-editorial.mjs
      - name: Run final 228-QL multilingual audit
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-final-228ql-audit.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/tmw-final.mjs && node artifacts/api-server/dist/quant-v4/tmw-final.mjs
      - name: Run chapter multilingual parity
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-multilingual-chapter-parity.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/tmw-parity.mjs && node artifacts/api-server/dist/quant-v4/tmw-parity.mjs
