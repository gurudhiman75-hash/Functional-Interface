name: Align PNL Prose Wave Multilingual Sources

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/**"
      - ".github/workflows/validate-pnl-editorial-v2.yml"

permissions:
  contents: write

jobs:
  align-multilingual-sources:
    if: github.head_ref == 'feat/pnl-001-english-prose-cluster-diversity'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-english-prose-cluster-diversity
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Align QL-092 native target authority
        run: |
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-ql092-native-target-fix.mjs
          pnpm exec prettier --write \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/foundation/editorial-v2-multilingual-normalizer.ts

      - name: Prepare legacy editorial bundle paths
        run: |
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          ln -s ../CP-001 "$root/foundation/CP-001"
          ln -s ../CP-002 "$root/foundation/CP-002"
          ln -s ../CP-003 "$root/foundation/CP-003"

      - name: Regenerate Hindi and Punjabi committed sources
        run: |
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/editorial-v2-multilingual-export.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-multilingual-export.mjs
          node "$root/.editorial-v2-multilingual-export.mjs"
          for cp in CP-001 CP-003; do
            for language in hi pa; do
              cp \
                "$root/.editorial-v2-multilingual-generated/$cp.editorial-content.$language.json" \
                "$root/$cp/editorial-content.$language.json"
            done
          done

      - name: Prove multilingual audit, rendering and parity
        run: |
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          for source in \
            editorial-v2-multilingual-audit.ts \
            editorial-v2-multilingual-render.test.ts \
            editorial-v2-multilingual-source-parity.ts; do
            name="${source%.ts}"
            pnpm --dir artifacts/api-server exec esbuild \
              "src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/$source" \
              --bundle --platform=node --format=esm \
              --outfile="src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.$name.mjs"
            node "$root/.$name.mjs"
          done

      - name: Re-run freeze readiness audit
        run: |
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-001-freeze-readiness-audit.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.pnl-001-freeze-readiness-audit.mjs
          node "$root/.pnl-001-freeze-readiness-audit.mjs"

      - name: Commit validated multilingual alignment
        run: |
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          rm -f "$root/foundation/CP-001" "$root/foundation/CP-002" "$root/foundation/CP-003"
          rm -rf "$root/.editorial-v2-multilingual-generated"
          rm -f \
            "$root/.editorial-v2-multilingual-export.mjs" \
            "$root/.editorial-v2-multilingual-audit.mjs" \
            "$root/.editorial-v2-multilingual-render.test.mjs" \
            "$root/.editorial-v2-multilingual-source-parity.mjs" \
            "$root/.pnl-001-freeze-readiness-audit.mjs" \
            "$root/pnl-ql092-native-target-fix.mjs"
          git fetch origin New-main
          git checkout origin/New-main -- .github/workflows/validate-pnl-editorial-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(pnl): align prose wave multilingual sources"
          git push origin HEAD:feat/pnl-001-english-prose-cluster-diversity
