name: Validate PNL Editorial V2

on:
  push:
    branches:
      - feat/pnl-001-editorial-structured-review
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/**"
      - ".github/workflows/validate-pnl-editorial-v2.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/**"
      - ".github/workflows/validate-pnl-editorial-v2.yml"

permissions:
  contents: write

jobs:
  validate-pnl-editorial-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare legacy editorial bundle paths
        run: |
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          ln -s ../CP-001 "$root/foundation/CP-001"
          ln -s ../CP-002 "$root/foundation/CP-002"
          ln -s ../CP-003 "$root/foundation/CP-003"

      - name: Bundle and run CP-004 to CP-006 editorial audit
        id: editorial_audit
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/editorial-v2-audit.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-audit.mjs \
            2>&1 | tee editorial-v2-audit.log
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-audit.mjs \
            2>&1 | tee -a editorial-v2-audit.log

      - name: Bundle and run CP-004 to CP-006 renderer proof
        id: editorial_renderer
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/editorial-v2-render.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-render.test.mjs \
            2>&1 | tee editorial-v2-render.log
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-render.test.mjs \
            2>&1 | tee -a editorial-v2-render.log

      - name: Bundle and run CP-001 to CP-003 editorial audit
        id: legacy_editorial_audit
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/editorial-v2-cp001-cp003-audit.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/foundation/.editorial-v2-cp001-cp003-audit.mjs \
            2>&1 | tee editorial-v2-cp001-cp003-audit.log
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/foundation/.editorial-v2-cp001-cp003-audit.mjs \
            2>&1 | tee -a editorial-v2-cp001-cp003-audit.log

      - name: Bundle and run CP-001 to CP-003 renderer proof
        id: legacy_editorial_renderer
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/editorial-v2-cp001-cp003-render.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/foundation/.editorial-v2-cp001-cp003-render.test.mjs \
            2>&1 | tee editorial-v2-cp001-cp003-render.log
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/foundation/.editorial-v2-cp001-cp003-render.test.mjs \
            2>&1 | tee -a editorial-v2-cp001-cp003-render.log

      - name: Export CP-001 to CP-003 review sources
        id: legacy_editorial_export
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/editorial-v2-cp001-cp003-export.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/foundation/.editorial-v2-cp001-cp003-export.mjs \
            2>&1 | tee editorial-v2-cp001-cp003-export.log
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/foundation/.editorial-v2-cp001-cp003-export.mjs \
            2>&1 | tee -a editorial-v2-cp001-cp003-export.log

      - name: Bundle and run multilingual editorial audit
        id: multilingual_editorial_audit
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/editorial-v2-multilingual-audit.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-multilingual-audit.mjs \
            2>&1 | tee editorial-v2-multilingual-audit.log
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-multilingual-audit.mjs \
            2>&1 | tee -a editorial-v2-multilingual-audit.log

      - name: Bundle and run multilingual renderer proof
        id: multilingual_editorial_renderer
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/editorial-v2-multilingual-render.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-multilingual-render.test.mjs \
            2>&1 | tee editorial-v2-multilingual-render.log
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-multilingual-render.test.mjs \
            2>&1 | tee -a editorial-v2-multilingual-render.log

      - name: Export multilingual review sources
        id: multilingual_editorial_export
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/editorial-v2-multilingual-export.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-multilingual-export.mjs \
            2>&1 | tee editorial-v2-multilingual-export.log
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-multilingual-export.mjs \
            2>&1 | tee -a editorial-v2-multilingual-export.log

      - name: Upload editorial diagnostics and review sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnl-editorial-v2-diagnostics
          path: |
            editorial-v2-audit.log
            editorial-v2-render.log
            editorial-v2-cp001-cp003-audit.log
            editorial-v2-cp001-cp003-render.log
            editorial-v2-cp001-cp003-export.log
            editorial-v2-multilingual-audit.log
            editorial-v2-multilingual-render.log
            editorial-v2-multilingual-export.log
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/foundation/.editorial-v2-generated/*.json
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.editorial-v2-multilingual-generated/*.json
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-001/editorial-content.en.json
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-002/editorial-content.en.json
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/editorial-content.en.json
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-004/editorial-content.en.json
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/editorial-content.en.json
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-006/editorial-content.en.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Enforce editorial validation result
        if: always()
        run: |
          test "${{ steps.editorial_audit.outcome }}" = "success"
          test "${{ steps.editorial_renderer.outcome }}" = "success"
          test "${{ steps.legacy_editorial_audit.outcome }}" = "success"
          test "${{ steps.legacy_editorial_renderer.outcome }}" = "success"
          test "${{ steps.legacy_editorial_export.outcome }}" = "success"
          test "${{ steps.multilingual_editorial_audit.outcome }}" = "success"
          test "${{ steps.multilingual_editorial_renderer.outcome }}" = "success"
          test "${{ steps.multilingual_editorial_export.outcome }}" = "success"

      - name: Persist validated multilingual sources
        if: github.event_name == 'push' && success()
        run: |
          root="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          generated="$root/.editorial-v2-multilingual-generated"
          for cp in CP-001 CP-002 CP-003 CP-004 CP-005 CP-006; do
            cp "$generated/$cp.editorial-content.hi.json" "$root/$cp/editorial-content.hi.json"
            cp "$generated/$cp.editorial-content.pa.json" "$root/$cp/editorial-content.pa.json"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$root"/CP-*/editorial-content.hi.json "$root"/CP-*/editorial-content.pa.json
          if git diff --cached --quiet; then
            echo "Validated multilingual sources are already current."
            exit 0
          fi
          git commit -m "Persist validated Hindi and Punjabi Editorial V2 sources"
          git push
