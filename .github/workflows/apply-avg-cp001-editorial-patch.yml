name: Apply AVG CP-001 editorial patch

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/editorial-patch.cp001.json
      - .github/workflows/apply-avg-cp001-editorial-patch.yml

permissions:
  contents: write

concurrency:
  group: apply-avg-cp001-editorial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/avg-001-cp001-runtime-proof
          fetch-depth: 0

      - name: Apply stem and explanation-strategy edits
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001")
          patch = json.loads((root / "editorial-patch.cp001.json").read_text(encoding="utf-8"))
          by_id = {entry["qlId"]: entry for entry in patch["entries"]}

          for filename in ["question-language.en.json", "task-registry.library.json"]:
              path = root / filename
              data = json.loads(path.read_text(encoding="utf-8"))
              seen = set()
              for entry in data["entries"]:
                  update = by_id.get(entry["qlId"])
                  if not update:
                      continue
                  entry["explanationStrategyId"] = update["explanationStrategyId"]
                  if filename == "question-language.en.json":
                      entry["template"] = update["template"]
                  seen.add(entry["qlId"])
              missing = sorted(set(by_id) - seen)
              if missing:
                  raise SystemExit(f"Missing QLs in {filename}: {missing}")
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit editorial source updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/question-language.en.json
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/task-registry.library.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(avg): simplify CP-001 stems and vary explanations"
          git push origin HEAD:feat/avg-001-cp001-runtime-proof
