name: Final audit SER-001 CP-007

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-B/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-C/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-D/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-E/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUDIT/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-POST-WAVE-E-AUDIT/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-FINAL-AUDIT/**
      - .github/workflows/ser-001-cp007-final-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-cp007-final-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-audit-cp007:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/cp007-final-audit

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Re-run Waves A-C chapter audit
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-final-audit
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/SER-CP-007-AUDIT/ser-cp-007-chapter-audit.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-abc-audit.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-abc-audit.test.mjs") \
            | tee "$EVIDENCE/waves-a-c-audit.json"
          grep -q 'PASS_SER_CP007_CHAPTER_WIDE_GAP_AUDIT_FREEZE_BLOCKED' \
            "$EVIDENCE/waves-a-c-audit.json"

      - name: Re-run Wave D structural audit
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-final-audit
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/SER-CP-007-WAVE-D/ser-cp-007-wave-d.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-wave-d.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-wave-d.test.mjs") \
            | tee "$EVIDENCE/wave-d-audit.json"
          grep -q 'PASS_SER_CP007_WAVE_D_PERMUTATION_COMPLEMENT_INSERTION_K_ROW_SATURATION' \
            "$EVIDENCE/wave-d-audit.json"

      - name: Run Wave E discovery audit
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-final-audit
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/SER-CP-007-WAVE-E/ser-cp-007-wave-e.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-wave-e.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-wave-e.test.mjs") \
            | tee "$EVIDENCE/wave-e-audit.json"
          grep -q 'PASS_SER_CP007_WAVE_E_MARKER_AND_POSITIONAL_SUBSTITUTION_DISCOVERY' \
            "$EVIDENCE/wave-e-audit.json"

      - name: Run post-Wave-E authority collision matrix
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-final-audit
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/SER-CP-007-POST-WAVE-E-AUDIT/ser-cp-007-authority-collision-matrix.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-authority-collision-matrix.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-authority-collision-matrix.test.mjs") \
            | tee "$EVIDENCE/authority-collision-matrix.json"
          grep -q 'PASS_SER_CP007_POST_WAVE_E_17_AUTHORITY_COLLISION_MATRIX' \
            "$EVIDENCE/authority-collision-matrix.json"

      - name: Validate five-wave manifest and base source ledger
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-final-audit
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/SER-CP-007-FINAL-AUDIT/ser-cp-007-post-wave-e-manifest.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-post-wave-e-manifest.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-post-wave-e-manifest.test.mjs") \
            | tee "$EVIDENCE/final-manifest-audit.json"
          grep -q 'PASS_SER_CP007_POST_WAVE_E_MANIFEST_COLLISION_COMPLETE_LEDGER_PENDING' \
            "$EVIDENCE/final-manifest-audit.json"

      - name: Validate closed source ledger
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-final-audit
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/SER-CP-007-FINAL-AUDIT/ser-cp-007-source-ledger-completion.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-source-ledger-completion.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-source-ledger-completion.test.mjs") \
            | tee "$EVIDENCE/source-ledger-completion.json"
          grep -q 'PASS_SER_CP007_SOURCE_LEDGER_CLOSED_36_COVERED_ONE_REJECTED' \
            "$EVIDENCE/source-ledger-completion.json"

      - name: Validate Wave-D source-ancestry decision
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-final-audit
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/SER-CP-007-FINAL-AUDIT/ser-cp-007-wave-d-source-ancestry-decision.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-wave-d-source-ancestry-decision.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-wave-d-source-ancestry-decision.test.mjs") \
            | tee "$EVIDENCE/wave-d-source-ancestry-decision.json"
          grep -q 'PASS_SER_CP007_WAVE_D_FINAL_SATURATION_ONLY_ANCESTRY_DECISIONS' \
            "$EVIDENCE/wave-d-source-ancestry-decision.json"

      - name: Validate item-195 rejection and source close
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-final-audit
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/SER-CP-007-FINAL-AUDIT/ser-cp-007-item-195-resolution.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-item-195-resolution.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-item-195-resolution.test.mjs") \
            | tee "$EVIDENCE/item-195-resolution.json"
          grep -q 'PASS_SER_CP007_ITEM_195_REJECTED_SOURCE_DEFECT_AND_LEDGER_CLOSED' \
            "$EVIDENCE/item-195-resolution.json"

      - name: Collect final audit documents
        run: |
          set -euo pipefail
          ROOT=artifacts/api-server/src/reasoning-v1/topics/Series/SER-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-final-audit
          cp "$ROOT/SER-CP-007-FINAL-AUDIT/ser-cp-007-source-ledger-scaffold.md" \
            "$EVIDENCE/ser-cp-007-source-ledger-scaffold.md"
          cp "$ROOT/SER-CP-007-FINAL-AUDIT/ser-cp-007-source-ledger-completion-tranche.md" \
            "$EVIDENCE/ser-cp-007-source-ledger-completion-tranche.md"
          cp "$ROOT/SER-CP-007-FINAL-AUDIT/ser-cp-007-wave-d-source-ancestry-decision.md" \
            "$EVIDENCE/ser-cp-007-wave-d-source-ancestry-decision.md"
          cp "$ROOT/SER-CP-007-FINAL-AUDIT/ser-cp-007-item-195-resolution.md" \
            "$EVIDENCE/ser-cp-007-item-195-resolution.md"
          cp "$ROOT/SER-CP-007-FINAL-AUDIT/ser-cp-007-post-wave-d-report.md" \
            "$EVIDENCE/ser-cp-007-post-wave-d-report.md"
          cp "$ROOT/SER-CP-007-FINAL-AUDIT/ser-cp-007-post-wave-e-report.md" \
            "$EVIDENCE/ser-cp-007-post-wave-e-report.md"
          cp "$ROOT/SER-CP-007-WAVE-E/ser-cp-007-wave-e-plan.md" \
            "$EVIDENCE/ser-cp-007-wave-e-plan.md"
          cp "$ROOT/SER-CP-007-WAVE-E/ser-cp-007-wave-e-report.md" \
            "$EVIDENCE/ser-cp-007-wave-e-report.md"
          cp "$ROOT/SER-CP-007-POST-WAVE-E-AUDIT/ser-cp-007-authority-collision-matrix-report.md" \
            "$EVIDENCE/ser-cp-007-authority-collision-matrix-report.md"
          cp "$ROOT/SER-CP-007-AUDIT/ser-cp-007-chapter-gap-audit.md" \
            "$EVIDENCE/ser-cp-007-pre-wave-d-gap-audit.md"
          cp "$ROOT/SER-CP-007-WAVE-D/ser-cp-007-wave-d-report.md" \
            "$EVIDENCE/ser-cp-007-wave-d-report.md"

      - name: Upload final CP-007 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-cp007-final-audit
          path: artifacts/api-server/dist/reasoning-v1/ser-001/cp007-final-audit
          if-no-files-found: error
          retention-days: 30
