name: Validate RNK-001 CP-005 Permanent Runtime Freeze Review

on:
  push:
    branches:
      - feat/rnk-001-cp005-permanent-runtime-candidate
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/**
      - artifacts/api-server/src/reasoning-v1/question-studio-registry.ts
      - artifacts/api-server/src/reasoning-v1/question-studio-registry.test.ts
      - .github/workflows/reasoning-rnk-001-cp005-permanent-runtime-freeze-review.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rnk-cp005-permanent-runtime-freeze-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-freeze-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate pinned 576-question freeze-review candidate
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-005/cp005-permanent-runtime-freeze-review-gates.test.ts \
            | tee rnk-cp005-permanent-runtime-freeze-review.log

      - name: Generate final 36-question manual freeze-review pack
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-005/cp005-permanent-runtime-candidate-review-export.ts \
            | tee rnk-cp005-freeze-review-export.log

      - name: Validate CP-005 V3 release semantics remain intact
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-005/cp005-partial-order-editorial-v3-release.test.ts \
            | tee rnk-cp005-v3-release.log

      - name: Validate QL-034 ownership boundary remains intact
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-005/rnk-cp005-ql034-ownership-audit.test.ts \
            | tee rnk-cp005-ql034-ownership.log

      - name: Validate frozen CP-004 permanent projection
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-permanent-runtime-v1-gates.test.ts \
            | tee rnk-cp004-permanent-runtime.log

      - name: Validate discovery-only Question Studio registry
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/question-studio-registry.test.ts \
            | tee rnk-question-studio-registry.log

      - name: Build API server
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server build \
            | tee rnk-cp005-freeze-review-api-build.log

      - name: Upload freeze-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnk-001-cp005-permanent-runtime-freeze-review-evidence
          path: |
            rnk-cp005-permanent-runtime-freeze-review.log
            rnk-cp005-freeze-review-export.log
            rnk-cp005-v3-release.log
            rnk-cp005-ql034-ownership.log
            rnk-cp004-permanent-runtime.log
            rnk-question-studio-registry.log
            rnk-cp005-freeze-review-api-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload final 36-question freeze-review pack
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rnk-001-cp005-permanent-runtime-candidate-review-36q
          path: artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-005/generated/RNK-CP-005-PERMANENT-RUNTIME-CANDIDATE-REVIEW-36Q.md
          if-no-files-found: error
          retention-days: 14
