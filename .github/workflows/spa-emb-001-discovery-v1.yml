name: Validate SPA EMB-001 Executable Discovery V1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-emb-001-executable-discovery-v1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle EMB-001 discovery gate
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-embedded-figures-discovery-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-embedded-figures-discovery-v1.test.mjs
      - name: Validate EMB-001 executable discovery
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-embedded-figures-discovery-v1.test.mjs
      - name: Upload EMB-001 discovery review evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-emb-001-discovery-v1-review
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/spa-emb-001-discovery-v1-review.html
            artifacts/api-server/dist/reasoning-v1/spatial/spa-emb-001-discovery-v1-review.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-emb-001-discovery-v1-evidence.json
          if-no-files-found: error
