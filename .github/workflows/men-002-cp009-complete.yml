name: Validate MEN-CP-009 complete implementation

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-009/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/mensuration-completion-audit*.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MENSURATION-13-CP-COMPLETION-AUDIT-V1.md
      - .github/workflows/men-002-cp009-complete.yml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-002-cp009-complete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp009:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove all MEN-CP-009 QLs
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-009/permanent/runtime.test.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/men-cp009-complete.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp009-complete.test.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/men-cp009-complete.test.log

      - name: Export review evidence
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-009/permanent/review-export.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/men-cp009-review-export.mjs
          cd artifacts/api-server
          node dist/quant-v4/men-cp009-review-export.mjs \
            2>&1 | tee dist/quant-v4/men-cp009-review-export.log

      - name: Re-prove Mensuration completion matrix
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/mensuration-completion-audit.test.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/mensuration-completion-audit.test.mjs
          node artifacts/api-server/dist/quant-v4/mensuration-completion-audit.test.mjs

      - name: Build production API bundle
        shell: bash
        run: bash build-api.sh

      - name: Upload MEN-CP-009 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-cp009-complete-v1
          path: |
            artifacts/api-server/dist/quant-v4/men-cp009-complete.test.log
            artifacts/api-server/dist/quant-v4/men-cp009-review-export.log
            artifacts/api-server/dist/quant-v4/men-cp009-complete-v1.json
            artifacts/api-server/dist/quant-v4/men-cp009-complete-v1.md
          if-no-files-found: error
          retention-days: 14
