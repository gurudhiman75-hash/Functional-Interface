name: MEN-002 Wave02 Cost Shortcut Patch

on:
  pull_request:
    branches:
      - feat/men-002-cp007-gap-wave-01
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-002-wave02-cost-shortcut-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Correct material-cost shortcut
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-02/runtime.ts")
          lines = path.read_text().splitlines()
          matches = [index for index, line in enumerate(lines) if "shortcut: `Volume first" in line]
          if len(matches) != 1:
            raise SystemExit(f"Expected one material-cost shortcut, found {len(matches)}")
          lines[matches[0]] = "    shortcut: `Volume first, then multiply once by the £ per cubic metre rate.`,"
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-02/runtime.ts
          git commit -m "fix(mensuration): humanise Wave-02 cubic-rate shortcut"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
