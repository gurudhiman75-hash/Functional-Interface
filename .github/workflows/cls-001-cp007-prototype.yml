name: Validate CLS-001 CP-007 Letter-Cluster Classification

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Classification/CLS-001/CLS-CP-007/**
      - artifacts/api-server/src/reasoning-v1/topics/Classification/CLS-001/README.md

permissions:
  contents: read

concurrency:
  group: cls-001-cp007-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-letter-cluster-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle CLS-CP-007 audits and exporters
        run: |
          ROOT=src/reasoning-v1/topics/Classification/CLS-001/CLS-CP-007
          OUT=dist/reasoning-v1/cls-001/cp007
          mkdir -p artifacts/api-server/$OUT
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/prototype.test.ts" --bundle --platform=node --format=esm --outfile="$OUT/prototype.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/quality.test.ts" --bundle --platform=node --format=esm --outfile="$OUT/quality.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cluster-pair.test.ts" --bundle --platform=node --format=esm --outfile="$OUT/cluster-pair.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/presentation.test.ts" --bundle --platform=node --format=esm --outfile="$OUT/presentation.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp007-english-runtime.test.ts" --bundle --platform=node --format=esm --outfile="$OUT/cp007-english-runtime.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp007-localized-runtime.test.ts" --bundle --platform=node --format=esm --outfile="$OUT/cp007-localized-runtime.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp007-localized-runtime-v2.test.ts" --bundle --platform=node --format=esm --outfile="$OUT/cp007-localized-runtime-v2.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp007-localized-runtime-v3.test.ts" --bundle --platform=node --format=esm --outfile="$OUT/cp007-localized-runtime-v3.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/export-review.ts" --bundle --platform=node --format=esm --outfile="$OUT/export-review.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/export-cluster-pair-review.ts" --bundle --platform=node --format=esm --outfile="$OUT/export-cluster-pair-review.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/export-cp007-permanent-review.ts" --bundle --platform=node --format=esm --outfile="$OUT/export-cp007-permanent-review.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/export-cp007-localized-review-v3.ts" --bundle --platform=node --format=esm --outfile="$OUT/export-cp007-localized-review-v3.mjs"

      - name: Run CLS-CP-007 English and native runtime audits
        id: cp007_audit
        run: |
          set +e
          OUT=artifacts/api-server/dist/reasoning-v1/cls-001/cp007
          DIAG=$OUT/diagnostics
          mkdir -p "$DIAG"
          STATUS=0
          for TEST in prototype.test quality.test cluster-pair.test presentation.test cp007-english-runtime.test cp007-localized-runtime.test cp007-localized-runtime-v2.test cp007-localized-runtime-v3.test; do
            (cd artifacts/api-server && node "dist/reasoning-v1/cls-001/cp007/$TEST.mjs") >"$DIAG/$TEST.log" 2>&1
            CODE=$?
            if [ "$CODE" -ne 0 ]; then STATUS=$CODE; break; fi
          done
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload CLS-CP-007 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cls-001-cp007-audit-diagnostics
          path: artifacts/api-server/dist/reasoning-v1/cls-001/cp007/diagnostics
          if-no-files-found: error

      - name: Enforce CLS-CP-007 runtime audits
        if: steps.cp007_audit.outputs.exit_code != '0'
        run: |
          cat artifacts/api-server/dist/reasoning-v1/cls-001/cp007/diagnostics/*.log
          exit 1

      - name: Generate CLS-CP-007 source-shaped single-cluster review
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/cls-001/cp007/export-review.mjs

      - name: Generate CLS-CP-007 cluster-pair review
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/cls-001/cp007/export-cluster-pair-review.mjs

      - name: Generate CLS-CP-007 permanent English review
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/cls-001/cp007/export-cp007-permanent-review.mjs

      - name: Generate CLS-CP-007 Hindi Punjabi V3 review
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/cls-001/cp007/export-cp007-localized-review-v3.mjs

      - name: Upload CLS-CP-007 single-cluster review
        uses: actions/upload-artifact@v4
        with:
          name: cls-001-cp007-letter-cluster-discovery-review
          path: artifacts/api-server/dist/reasoning-v1/cls-001/cp007-review
          if-no-files-found: error

      - name: Upload CLS-CP-007 cluster-pair review
        uses: actions/upload-artifact@v4
        with:
          name: cls-001-cp007-cluster-pair-discovery-review
          path: artifacts/api-server/dist/reasoning-v1/cls-001/cp007-cluster-pair-review
          if-no-files-found: error

      - name: Upload CLS-CP-007 permanent English review
        uses: actions/upload-artifact@v4
        with:
          name: cls-001-cp007-permanent-english-review
          path: artifacts/api-server/dist/reasoning-v1/cls-001/cp007-permanent-review
          if-no-files-found: error

      - name: Upload CLS-CP-007 Hindi Punjabi V3 review
        uses: actions/upload-artifact@v4
        with:
          name: cls-001-cp007-hi-pa-review-v3
          path: artifacts/api-server/dist/reasoning-v1/cls-001/cp007-localized-review-v3
          if-no-files-found: error
