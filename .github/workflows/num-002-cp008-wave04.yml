name: Validate NUM-CP-008 Wave 04 focused source gaps

on:
  pull_request:
    paths:
      - ".github/workflows/num-002-cp008-wave04.yml"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-008/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp008-wave04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp008-wave04:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle retained Wave 03 mathematical authority
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-008/wave03/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-002-cp008-wave03-authority-regression.mjs

      - name: Run retained Wave 03 mathematical authority
        run: node artifacts/api-server/dist/quant-v4/num-002-cp008-wave03-authority-regression.mjs

      - name: Bundle retained Wave 03 final learner review
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-008/wave03/runtime-review-final.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-002-cp008-wave03-review-final-regression.mjs

      - name: Run retained Wave 03 final learner review
        run: node artifacts/api-server/dist/quant-v4/num-002-cp008-wave03-review-final-regression.mjs

      - name: Bundle Wave 04 runtime authority
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-008/wave04/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-002-cp008-wave04-runtime-authority.mjs

      - name: Run Wave 04 runtime authority
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-002-cp008-wave04-runtime-authority.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-002-cp008-wave04-runtime-authority.log

      - name: Bundle Wave 04 structural and learner audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-008/wave04/runtime-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-002-cp008-wave04-runtime-audit.mjs

      - name: Run Wave 04 structural and learner audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-002-cp008-wave04-runtime-audit.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-002-cp008-wave04-runtime-audit.log

      - name: Bundle Wave 04 review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-008/wave04/review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-002-cp008-wave04-review-export.mjs

      - name: Generate Wave 04 review pack
        working-directory: artifacts/api-server
        run: node dist/quant-v4/num-002-cp008-wave04-review-export.mjs

      - name: Upload Wave 04 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: num-cp008-wave04-focused-source-gaps
          retention-days: 14
          path: |
            artifacts/api-server/dist/quant-v4/num-002-cp008-wave04-runtime-authority.log
            artifacts/api-server/dist/quant-v4/num-002-cp008-wave04-runtime-audit.log
            artifacts/api-server/dist/quant-v4/num-002-cp008-wave04-review.json
            artifacts/api-server/dist/quant-v4/num-002-cp008-wave04-review.md
          if-no-files-found: warn
