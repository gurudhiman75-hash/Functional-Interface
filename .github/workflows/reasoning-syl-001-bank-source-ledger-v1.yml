name: Validate SYL-001 Banking source ledger V1
on:
  pull_request:
    branches:
      - prototype/syl-001-bank-possibility-shell
      - audit/syl-001-source-profile-freeze
      - feat/syl-001-learner-v4
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/source-authority/banking-source-question-ledger-v1.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/source-authority/banking-source-weight-policy-v1.ts
      - .github/workflows/reasoning-syl-001-bank-source-ledger-v1.yml
permissions:
  contents: read
jobs:
  validate-banking-source-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle source ledger and weighting policy
        run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Syllogism/SYL-001/source-authority/banking-source-weight-policy-v1.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/syl-001-banking-source-weight-policy-v1.mjs
      - name: Audit source diversity and coverage without freezing percentages
        shell: bash
        run: |
          set -o pipefail
          node --input-type=module <<'NODE' 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-banking-source-ledger-v1-audit.log
          import assert from 'node:assert/strict';
          const m = await import('./artifacts/api-server/dist/reasoning-v1/syl-001-banking-source-weight-policy-v1.mjs');
          const p = m.SYL_BANKING_SOURCE_WEIGHT_POLICY_V1;
          assert.ok(p.questionCount >= 25);
          assert.ok(p.examSeriesCount >= 8);
          assert.equal(p.status, 'COVERAGE_PROVEN_PERCENTAGES_UNFROZEN');
          assert.equal(p.preserveCurrentProvisionalFamilyMix, true);
          assert.equal(p.systematicPaperCensusComplete, false);
          assert.equal(p.productionPercentagesFrozen, false);
          assert.equal(p.activationPermitted, false);
          assert.deepEqual(p.requiredCoverage, ['ORDINARY_POSSIBILITY','CAN_NEVER_BE','EITHER_OR','ONLY_A_FEW','ONLY','MULTI_CONCLUSION_ADVANCED']);
          console.log(JSON.stringify({
            status: 'PASS_SYL_001_BANKING_SOURCE_LEDGER_V1',
            questionCount: p.questionCount,
            examSeriesCount: p.examSeriesCount,
            requiredCoverage: p.requiredCoverage,
            systematicPaperCensusComplete: p.systematicPaperCensusComplete,
            productionPercentagesFrozen: p.productionPercentagesFrozen,
            activationPermitted: p.activationPermitted,
          }, null, 2));
          NODE
      - name: Upload source-ledger evidence
        uses: actions/upload-artifact@v4
        with:
          name: syl-001-banking-source-ledger-v1
          path: artifacts/api-server/dist/reasoning-v1/syl-001-banking-source-ledger-v1-audit.log
          if-no-files-found: error
          retention-days: 30
