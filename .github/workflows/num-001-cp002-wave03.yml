name: Validate NUM-CP-002 Wave 03 saturation candidate

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-002/**
      - .github/workflows/num-001-cp002-wave01.yml
      - .github/workflows/num-001-cp002-wave02.yml
      - .github/workflows/num-001-cp002-wave03.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp002-wave03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp002-wave03:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Wave01 regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-002/wave01/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp002-wave03-wave01.test.mjs
      - name: Run Wave01 regression
        working-directory: artifacts/api-server
        run: node dist/quant-v4/num-cp002-wave03-wave01.test.mjs

      - name: Bundle Wave02 regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-002/wave02/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp002-wave03-wave02.test.mjs
      - name: Run Wave02 regression
        working-directory: artifacts/api-server
        run: node dist/quant-v4/num-cp002-wave03-wave02.test.mjs

      - name: Bundle Wave03 authority
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-002/wave03/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp002-wave03-authority.test.mjs
      - name: Run Wave03 authority
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/num-cp002-wave03-authority.test.mjs 2>&1 | tee dist/quant-v4/num-cp002-wave03-authority.log

      - name: Upload Wave03 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: num-001-cp002-wave03-saturation-candidate
          path: |
            artifacts/api-server/dist/quant-v4/num-cp002-wave03-authority.log
            artifacts/api-server/dist/quant-v4/num-cp002-wave03/num-cp002-wave03-review.json
            artifacts/api-server/dist/quant-v4/num-cp002-wave03/num-cp002-wave03-review.md
          if-no-files-found: warn
          retention-days: 14
