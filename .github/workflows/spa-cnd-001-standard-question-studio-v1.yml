name: Validate SPA CND-001 Standard Question Studio V1

on:
  push:
    branches:
      - feat/spa-cnd-001-standard-question-studio-v1
    paths:
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/cubes-dice-question-studio-product-owner-approval-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/cubes-dice-question-studio-seeded-runtime-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-question-studio-integration-v4.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-question-studio-integration-v5.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-question-studio-production-v4.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-question-studio-production-v5.ts
      - artifacts/api-server/src/lib/admin-question-conversion.ts
      - artifacts/api-server/src/reasoning-v1/tests/spatial-cubes-dice-question-studio-standard-integration-v1.test.ts
      - artifacts/api-server/src/reasoning-v1/tests/spatial-cubes-dice-question-studio-admin-conversion-v1.test.ts
      - .github/workflows/spa-cnd-001-standard-question-studio-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cnd-standard-question-studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build current API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle CND standard Question Studio proof
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-cubes-dice-question-studio-standard-integration-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-cubes-dice-question-studio-standard-integration-v1.test.mjs

      - name: Validate CND standard Question Studio integration
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-cubes-dice-question-studio-standard-integration-v1.test.mjs \
            | tee dist/reasoning-v1/spatial/spa-cnd-001-standard-question-studio-integration-v1-run.log

      - name: Bundle CND admin scalar conversion proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-cubes-dice-question-studio-admin-conversion-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-cubes-dice-question-studio-admin-conversion-v1.test.mjs

      - name: Validate CND admin scalar conversion
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-cubes-dice-question-studio-admin-conversion-v1.test.mjs \
            | tee dist/reasoning-v1/spatial/spa-cnd-001-admin-scalar-option-conversion-v1-run.log

      - name: Upload CND standard Question Studio evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-cnd-001-standard-question-studio-v1
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/spa-cnd-001-standard-question-studio-integration-v1-run.log
            artifacts/api-server/dist/reasoning-v1/spatial/spa-cnd-001-standard-question-studio-integration-v1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-cnd-001-admin-scalar-option-conversion-v1-run.log
            artifacts/api-server/dist/reasoning-v1/spatial/spa-cnd-001-admin-scalar-option-conversion-v1-evidence.json
          if-no-files-found: error
