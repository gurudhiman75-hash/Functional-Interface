name: Reasoning COD-001 CP-009 Possible Set

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-009/**"
      - ".github/workflows/reasoning-cod-001-cp009-possible-set.yml"
  workflow_dispatch:

jobs:
  cp009-possible-set:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run possible set audit
        id: possible_set_audit
        shell: bash
        run: |
          set +e
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-009/possible-set-prototype.test.ts > cod-cp009-possible-set.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload possible set diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod-001-cp009-possible-set-audit
          path: cod-cp009-possible-set.log
          retention-days: 7

      - name: Enforce possible set result
        shell: bash
        run: |
          cat cod-cp009-possible-set.log
          test "${{ steps.possible_set_audit.outputs.exit_code }}" = "0"

      - name: Export possible set review pack
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-009/export-possible-set-review.ts cod-cp009-possible-set-review-output

      - name: Upload possible set review pack
        uses: actions/upload-artifact@v4
        with:
          name: cod-001-cp009-possible-set-review
          path: cod-cp009-possible-set-review-output
          retention-days: 7
