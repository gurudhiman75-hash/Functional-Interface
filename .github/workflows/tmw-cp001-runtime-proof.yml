name: Validate TMW-001 CP-001 runtime proof

on:
  pull_request:
    branches:
      - New-main
      - feat/tmw-001-cp001-runtime-proof
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/**
      - .github/workflows/tmw-cp001-runtime-proof.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-tmw-cp001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tmw-cp001:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle TMW-CP-001 runtime proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp001-runtime-proof.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/tmw-cp001.test.mjs

      - name: Run TMW-CP-001 runtime proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/tmw-cp001.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/tmw-cp001-runtime-proof.log

      - name: Upload runtime proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmw-cp001-runtime-proof-log
          path: artifacts/api-server/dist/quant-v4/tmw-cp001-runtime-proof.log
          if-no-files-found: error
          retention-days: 7
