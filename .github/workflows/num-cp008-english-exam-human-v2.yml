name: Validate NUM-CP-008 English Exam-Human V2

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-008/**"
      - ".github/workflows/num-cp008-english-exam-human-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp008-english-exam-human-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp008-english-exam-human-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle English exam-human audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-008/english-exam-human-v2.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp008-english-exam-human-v2.test.mjs

      - name: Run English exam-human audit
        run: node artifacts/api-server/dist/quant-v4/num-cp008-english-exam-human-v2.test.mjs

      - name: Bundle learner review export
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-008/english-exam-human-v2-review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp008-english-exam-human-v2-review-export.mjs

      - name: Generate learner review markdown
        working-directory: artifacts/api-server
        run: node dist/quant-v4/num-cp008-english-exam-human-v2-review-export.mjs

      - name: Upload learner review markdown
        uses: actions/upload-artifact@v4
        with:
          name: num-cp008-english-exam-human-v2-review
          if-no-files-found: error
          retention-days: 14
          path: artifacts/api-server/dist/quant-v4/num-cp008-english-exam-human-v2-review.md
