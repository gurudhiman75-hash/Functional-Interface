name: Validate SPA-FND-001 Proposed QL Incomplete Slice Scale V1

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/foundation/spatial/**"
      - "artifacts/api-server/src/reasoning-v1/proofs/**"
      - "artifacts/api-server/src/reasoning-v1/tests/spatial-proposed-ql-incomplete-slice-scale-v1.test.ts"
      - ".github/workflows/spa-proposed-ql-incomplete-slice-scale-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-proposed-ql-incomplete-slice-scale-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Revalidate 30-PQL review coverage
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-proposed-ql-coverage-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-proposed-ql-coverage-v1.test.mjs
          cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-proposed-ql-coverage-v1.test.mjs
      - name: Bundle incomplete-slice scale proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-proposed-ql-incomplete-slice-scale-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-proposed-ql-incomplete-slice-scale-v1.test.mjs
      - name: Run 2400-question perceptual scale completion
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-proposed-ql-incomplete-slice-scale-v1.test.mjs
      - name: Upload incomplete-slice scale evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-proposed-ql-incomplete-slice-scale-v1-evidence
          path: artifacts/api-server/dist/reasoning-v1/spatial/spa-proposed-ql-incomplete-slice-scale-v1-evidence.json
          if-no-files-found: error
