name: Validate MIS-CP-001 review runtime

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-001/**
      - artifacts/api-server/src/question-studio/engines/reasoning-v1-adapter.ts
      - .github/workflows/mis-cp001-review-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mis-cp001-review-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-mis-cp001:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle MIS-CP-001 proofs
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/mis-001
          for file in             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-001/mis-cp-001.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-001/question-studio-integration.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-001/export-review.ts
          do
            name="$(basename "$file" .ts)"
            pnpm --dir artifacts/api-server exec esbuild "$file"               --bundle --platform=node --format=esm               --outfile="dist/reasoning-v1/mis-001/${name}.mjs"
          done
      - name: Run MIS-CP-001 generator audit
        run: node artifacts/api-server/dist/reasoning-v1/mis-001/mis-cp-001.test.mjs
      - name: Run MIS-CP-001 Question Studio audit
        run: node artifacts/api-server/dist/reasoning-v1/mis-001/question-studio-integration.test.mjs
      - name: Generate MIS-CP-001 review pack
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/mis-001/export-review.mjs
      - name: Upload MIS-CP-001 review pack
        uses: actions/upload-artifact@v4
        with:
          name: MIS-CP-001-REVIEW
          path: artifacts/api-server/dist/reasoning-v1/mis-001/MIS-CP-001-REVIEW.md
