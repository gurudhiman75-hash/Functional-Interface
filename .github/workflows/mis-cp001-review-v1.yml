name: Validate MIS-001 review runtime

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Missing-Number/MIS-001/**
      - artifacts/api-server/src/question-studio/engines/reasoning-v1-adapter.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mis-001-review-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-mis-001:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle MIS-001 proofs
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/mis-001
          for file in             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-001/mis-cp-001.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-001/question-studio-integration.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-002/mis-cp-002.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-003/mis-cp-003.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-004/mis-cp-004.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-005/mis-cp-005.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-006/mis-cp-006.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-007/mis-cp-007.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-008/mis-cp-008.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-009/mis-cp-009.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-010/mis-cp-010.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-011/mis-cp-011.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-012/mis-cp-012.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-013/mis-cp-013.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-014/mis-cp-014.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-015/mis-cp-015.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-016/mis-cp-016.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-017/mis-cp-017.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-018/mis-cp-018.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-019/mis-cp-019.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-020/mis-cp-020.test.ts             src/reasoning-v1/topics/Missing-Number/MIS-001/MIS-CP-021/mis-cp-021.test.ts    