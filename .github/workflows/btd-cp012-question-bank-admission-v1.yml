name: Validate BTD-001 CP012 Question Bank Admission V1

on:
  push:
    branches:
      - feature/btd-cp012-question-bank-admission-v1
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-012/**'
      - 'artifacts/api-server/src/question-studio/shared-generation-engine-btd.ts'
      - 'artifacts/api-server/src/routes/admin-question-studio-btd.ts'
      - 'artifacts/api-server/src/routes/admin-question-studio-bulk-hardening.ts'
      - 'artifacts/api-server/src/lib/admin-question-conversion-bank-dedup.ts'
  pull_request:
    branches:
      - feature/btd-cp011-question-bank-readiness-v1
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-012/**'
      - 'artifacts/api-server/src/question-studio/shared-generation-engine-btd.ts'
      - 'artifacts/api-server/src/routes/admin-question-studio-btd.ts'
      - 'artifacts/api-server/src/routes/admin-question-studio-bulk-hardening.ts'
      - 'artifacts/api-server/src/lib/admin-question-conversion-bank-dedup.ts'

permissions:
  contents: read

concurrency:
  group: btd-cp012-question-bank-admission-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-btd-cp012-question-bank-admission-v1:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'
          run_install: false

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-prove CP011 Question Bank readiness authority
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-011/btd-cp011-question-bank-readiness-v1-audit.ts | tee btd-cp012-upstream-cp011.log
          grep -q 'PASS_BTD_001_CP011_QUESTION_BANK_READINESS_AUDIT_V1' btd-cp012-upstream-cp011.log

      - name: Audit CP012 bank-only Question Bank admission
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-012/btd-cp012-question-bank-admission-v1-audit.ts | tee btd-cp012-question-bank-admission-v1.log
          grep -q 'PASS_BTD_001_CP012_QUESTION_BANK_ADMISSION_AUDIT_V1' btd-cp012-question-bank-admission-v1.log

      - name: Verify admission routing and dedup boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'generateBtdCp012QuestionBankAdmissionBatchV1' artifacts/api-server/src/question-studio/shared-generation-engine-btd.ts
          grep -q 'isBtdCp012QuestionStudioRequest' artifacts/api-server/src/routes/admin-question-studio-btd.ts
          grep -q 'questionBankAcceptanceMode !== "BANK_ONLY"' artifacts/api-server/src/routes/admin-question-studio-btd.ts
          grep -q 'manualApprovalRequired !== true' artifacts/api-server/src/routes/admin-question-studio-btd.ts
          grep -q 'convertApprovedGenerationItemDedupSafe' artifacts/api-server/src/routes/admin-question-studio-bulk-hardening.ts
          grep -q 'pg_advisory_xact_lock' artifacts/api-server/src/lib/admin-question-conversion-bank-dedup.ts
          grep -q 'providerQuestionId' artifacts/api-server/src/lib/admin-question-conversion-bank-dedup.ts
          grep -q 'reused_from_generation_dedup' artifacts/api-server/src/lib/admin-question-conversion-bank-dedup.ts
          grep -q 'testEligible: false' artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-012/btd-cp012-question-bank-admission-v1.ts
          grep -q 'mockTestEligible: false' artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-012/btd-cp012-question-bank-admission-v1.ts
          grep -q 'publiclyPublishable: false' artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-012/btd-cp012-question-bank-admission-v1.ts

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Record exact validation head
        shell: bash
        run: |
          echo "validated_head=$(git rev-parse HEAD)" | tee btd-cp012-question-bank-admission-v1-head.log
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Upload CP012 evidence
        uses: actions/upload-artifact@v4
        with:
          name: btd-cp012-question-bank-admission-v1
          path: |
            btd-cp012-upstream-cp011.log
            btd-cp012-question-bank-admission-v1.log
            btd-cp012-question-bank-admission-v1-head.log
          retention-days: 30
