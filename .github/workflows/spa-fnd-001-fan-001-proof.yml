name: Validate SPA-FND-001 FAN-001 proof

on:
  pull_request:
    branches:
      - feat/spa-fnd-001-wave03-perceptual-remediation
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/**
      - artifacts/api-server/src/reasoning-v1/proofs/spa-fnd-001-fan-001-corpus.ts
      - artifacts/api-server/src/reasoning-v1/tests/spatial-foundation.test.ts
      - artifacts/api-server/src/reasoning-v1/tests/spatial-mirror-water-proof.test.ts
      - artifacts/api-server/src/reasoning-v1/tests/spatial-glyph-digit-clock-proof.test.ts
      - artifacts/api-server/src/reasoning-v1/tests/spatial-figure-analogy-proof.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Non-Verbal-Reasoning/Figure-Analogy/**
      - .github/workflows/spa-fnd-001-fan-001-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spa-fnd-001-fan-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-fan-001:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle spatial proof tests
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-foundation.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-foundation.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-mirror-water-proof.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-mirror-water-proof.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-glyph-digit-clock-proof.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-glyph-digit-clock-proof.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-figure-analogy-proof.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-figure-analogy-proof.test.mjs
      - name: Run foundation regression proof
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-foundation.test.mjs
      - name: Run Wave 02 regression corpus
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-mirror-water-proof.test.mjs
      - name: Run remediated Wave 03 regression corpus
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-glyph-digit-clock-proof.test.mjs
      - name: Run FAN-001 proof corpus
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-figure-analogy-proof.test.mjs
      - name: Upload FAN-001 editorial review
        uses: actions/upload-artifact@v4
        with:
          name: spa-fan-001-editorial-review
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/spa-fan-001-editorial-review.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-fan-001-editorial-review.html
          if-no-files-found: error
