name: Validate AVG-001 English V2 release

on:
  push:
    branches:
      - release/avg-001-en-v2
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/**
      - artifacts/api-server/src/quant-v4/question-studio-generation-engine.ts
      - .github/workflows/avg-001-en-v2-release.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/**
      - artifacts/api-server/src/quant-v4/question-studio-generation-engine.ts
      - .github/workflows/avg-001-en-v2-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avg-001-en-v2-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-avg-001-en-v2-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle complete V2 release audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-editorial-v2-release-audit.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/avg-001-editorial-v2-release-audit.mjs
      - name: Run complete V2 release audit
        shell: bash
        run: |
          set -o pipefail
          (cd artifacts/api-server && node dist/quant-v4/avg-001-editorial-v2-release-audit.mjs) \
            | tee artifacts/api-server/avg-001-en-v2-release-diagnostics.log
      - name: Bundle Question Studio integration audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-question-studio-integration-audit.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/avg-001-question-studio-integration-audit.mjs
      - name: Run Question Studio integration audit
        shell: bash
        run: |
          set -o pipefail
          (cd artifacts/api-server && node dist/quant-v4/avg-001-question-studio-integration-audit.mjs) \
            | tee artifacts/api-server/avg-001-en-v2-question-studio-diagnostics.log
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avg-001-en-v2-release-evidence
          path: |
            artifacts/api-server/avg-001-en-v2-release-diagnostics.log
            artifacts/api-server/avg-001-en-v2-question-studio-diagnostics.log
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/AVG-001-EN-V2-FREEZE-RECORD.md
          if-no-files-found: error
          retention-days: 30
