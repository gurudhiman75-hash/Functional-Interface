name: Validate SER-001 CP-006

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-006/**
      - .github/workflows/ser-001-cp006.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-cp006-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp006:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/cp006-review

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Run SER-CP-006 executable audit
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-006
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp006-review
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/ser-cp-006.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-006.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-006.test.mjs") \
            | tee "$EVIDENCE/audit.json"

      - name: Generate exact English review pack
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-006
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp006-review
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/export-review.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/export-cp006-review.mjs"
          (cd artifacts/api-server && node "$OUT/export-cp006-review.mjs") \
            > "$EVIDENCE/ser-cp-006-en-IN-review.md"
          cp "artifacts/api-server/$ROOT/ser-cp-006-report.md" \
            "$EVIDENCE/ser-cp-006-report.md"

      - name: Upload CP-006 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-cp006-review
          path: artifacts/api-server/dist/reasoning-v1/ser-001/cp006-review
          if-no-files-found: error
          retention-days: 30
