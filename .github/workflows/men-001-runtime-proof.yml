name: Validate MEN-001 runtime proof

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/**
      - artifacts/api-server/src/quant-v4/shared/answers/**
      - .github/workflows/men-001-runtime-proof.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-men-001:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle MEN-001 runtime proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/men-001.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/men-001.test.mjs

      - name: Run MEN-001 runtime proof
        run: node artifacts/api-server/dist/quant-v4/men-001.test.mjs
