name: Validate MEN-001 runtime proof

on:
  pull_request:
    branches:
      - New-main
      - feat/men-001-cp001-runtime-proof
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/**
      - artifacts/api-server/src/quant-v4/shared/answers/**
      - .github/workflows/men-001-runtime-proof.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-men-001:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle MEN-001 runtime proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/men-001-natural-runtime.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/men-001.test.mjs

      - name: Run MEN-001 runtime proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/men-001.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/men-001-runtime-proof.log

      - name: Bundle natural explanation authorship audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/natural-explanation-authorship.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/men-001-natural-explanation-authorship.test.mjs

      - name: Run natural explanation authorship audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/men-001-natural-explanation-authorship.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/men-001-natural-explanation-authorship.log

      - name: Upload MEN-001 runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-001-runtime-log
          path: |
            artifacts/api-server/dist/quant-v4/men-001-runtime-proof.log
            artifacts/api-server/dist/quant-v4/men-001-natural-explanation-authorship.log
          if-no-files-found: error
          retention-days: 7

      - name: Bundle MEN-001 human review export
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/human-review-export.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/men-001-human-review-export.mjs

      - name: Generate MEN-001 human review export
        run: node artifacts/api-server/dist/quant-v4/men-001-human-review-export.mjs

      - name: Upload MEN-001 human review export
        uses: actions/upload-artifact@v4
        with:
          name: men-001-human-review
          path: |
            artifacts/api-server/dist/quant-v4/men-001-human-review.csv
            artifacts/api-server/dist/quant-v4/men-001-human-review.md
          if-no-files-found: error
          retention-days: 7
