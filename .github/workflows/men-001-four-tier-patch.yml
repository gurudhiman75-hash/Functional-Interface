name: MEN-001 Four-Tier Explanation Patch

on:
  push:
    branches:
      - feat/men-001-four-tier-explanations
    paths:
      - .github/workflows/men-001-four-tier-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/men-001-four-tier-explanations

      - name: Apply four-tier structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {count}")
              return text.replace(old, new, 1)

          # Structured section contract.
          path = root / "structured-explanation.ts"
          text = path.read_text(encoding="utf-8")
          text = replace_once(text, 'title: "Key Rule";', 'title: "Key Rule & Formula";', "key-rule type title")
          text = replace_once(
              text,
              '''  | {
                  kind: "FINAL_ANSWER";
                  title: "Final Answer";
                  paragraphs: string[];
                  equations: string[];
                };''',
              '''  | {
                  kind: "EXAM_SHORTCUT";
                  title: "Exam Speed Shortcut";
                  paragraphs: string[];
                  equations: string[];
                }
              | {
                  kind: "COMMON_TRAPS";
                  title: "Common Traps";
                  paragraphs: string[];
                  equations: string[];
                }
              | {
                  kind: "FINAL_ANSWER";
                  title: "Final Answer";
                  paragraphs: string[];
                  equations: string[];
                };''',
              "section union",
          )
          text = text.replace('"KEY_RULE_STEPS_FINAL_ANSWER"', '"FOUR_TIER_COMPETITIVE_EXPLANATION"')
          text = replace_once(text, 'title: "Key Rule",', 'title: "Key Rule & Formula",', "key-rule instance title")

          flatten_start = text.index("export function flattenMen001StructuredExplanation(")
          assert_start = text.index("export function assertMen001StructuredExplanation(", flatten_start)
          flatten = '''export function flattenMen001StructuredExplanation(
            sections: readonly Men001ExplanationSection[],
          ) {
            const lines: string[] = [];
            let wroteSolutionHeading = false;
            for (const section of sections) {
              if (section.kind === "STEP" && !wroteSolutionHeading) {
                lines.push("Step-by-Step Solution");
                wroteSolutionHeading = true;
              }
              const heading = section.kind === "STEP"
                ? `Step ${section.stepNumber}: ${section.title}`
                : section.title;
              lines.push(
                heading,
                ...section.paragraphs,
                ...section.equations.map((equation) => `$$${equation}$$`),
              );
            }
            return lines;
          }

          '''
          text = text[:flatten_start] + flatten + text[assert_start:]
          assert_start = text.index("export function assertMen001StructuredExplanation(")
          assertion = '''export function assertMen001StructuredExplanation(
            explanation: Men001Explanation,
            answer: string,
          ) {
            if (explanation.displayFormat !== "FOUR_TIER_COMPETITIVE_EXPLANATION") {
              throw new Error("MEN-001 explanation must use the four-tier competitive format.");
            }
            const first = explanation.sections[0];
            const last = explanation.sections.at(-1);
            if (!first || first.kind !== "KEY_RULE" || first.title !== "Key Rule & Formula" || first.equations.length === 0) {
              throw new Error("MEN-001 explanation must begin with Key Rule & Formula.");
            }
            if (!last || last.kind !== "FINAL_ANSWER" || !last.equations.includes(stripMathDelimiters(answer))) {
              throw new Error("MEN-001 explanation must end with the canonical final answer.");
            }
            const steps = explanation.sections.filter((section) => section.kind === "STEP");
            if (steps.length === 0) throw new Error("MEN-001 explanation must contain a step-by-step solution.");
            steps.forEach((step, index) => {
              if (step.stepNumber !== index + 1 || !step.title.trim()) {
                throw new Error("MEN-001 explanation steps must be sequential and titled.");
              }
              if (step.paragraphs.length === 0 && step.equations.length === 0) {
                throw new Error("MEN-001 explanation steps cannot be empty.");
              }
              if (index > 0 && step.title === steps[index - 1]!.title) {
                throw new Error("MEN-001 adjacent explanation steps must use distinct titles.");
              }
            });
            const shortcuts = explanation.sections.filter((section) => section.kind === "EXAM_SHORTCUT");
            const traps = explanation.sections.filter((section) => section.kind === "COMMON_TRAPS");
            if (shortcuts.length !== 1 || shortcuts[0]!.paragraphs.length + shortcuts[0]!.equations.length === 0) {
              throw new Error("MEN-001 explanation must contain one non-empty Exam Speed Shortcut block.");
            }
            if (traps.length !== 1 || traps[0]!.paragraphs.length !== 3) {
              throw new Error("MEN-001 explanation must explain all three wrong options in one Common Traps block.");
            }
            const firstStepIndex = explanation.sections.findIndex((section) => section.kind === "STEP");
            const shortcutIndex = explanation.sections.findIndex((section) => section.kind === "EXAM_SHORTCUT");
            const trapIndex = explanation.sections.findIndex((section) => section.kind === "COMMON_TRAPS");
            const finalIndex = explanation.sections.findIndex((section) => section.kind === "FINAL_ANSWER");
            if (!(firstStepIndex > 0 && shortcutIndex > firstStepIndex && trapIndex > shortcutIndex && finalIndex > trapIndex)) {
              throw new Error("MEN-001 explanation blocks are not in the required four-tier order.");
            }
          }
          '''
          text = text[:assert_start] + assertion
          path.write_text(text, encoding="utf-8")

          # Runtime display assertion.
          path = root / "structured-explanation-display-assertion.ts"
          path.write_text('''import {
            isMen001LatexEquation,
            toMen001LatexEquation,
          } from "./structured-math-latex";
          import type { Men001Explanation } from "./types";

          export function assertMen001StructuredExplanation(
            explanation: Men001Explanation,
            answer: string,
          ) {
            if (explanation.displayFormat !== "FOUR_TIER_COMPETITIVE_EXPLANATION") {
              throw new Error("MEN-001 explanation must use the four-tier competitive format.");
            }
            const first = explanation.sections[0];
            const last = explanation.sections.at(-1);
            if (!first || first.kind !== "KEY_RULE" || first.title !== "Key Rule & Formula" || first.equations.length === 0) {
              throw new Error("MEN-001 explanation must begin with Key Rule & Formula.");
            }
            if (
              !last ||
              last.kind !== "FINAL_ANSWER" ||
              !last.equations.includes(toMen001LatexEquation(answer))
            ) {
              throw new Error("MEN-001 explanation must end with the canonical LaTeX final answer.");
            }

            for (const section of explanation.sections) {
              if (!section.equations.every(isMen001LatexEquation)) {
                throw new Error(`MEN-001 ${section.kind} equations must be MathJax-ready LaTeX.`);
              }
            }

            const steps = explanation.sections.filter((section) => section.kind === "STEP");
            if (steps.length === 0) {
              throw new Error("MEN-001 explanation must contain a step-by-step solution.");
            }
            steps.forEach((step, index) => {
              if (step.stepNumber !== index + 1 || !step.title.trim()) {
                throw new Error("MEN-001 explanation steps must be sequential and titled.");
              }
              if (step.paragraphs.length === 0 && step.equations.length === 0) {
                throw new Error("MEN-001 explanation steps cannot be empty.");
              }
              if (index > 0 && step.title === steps[index - 1]!.title) {
                throw new Error("MEN-001 adjacent explanation steps must use distinct titles.");
              }
            });

            const shortcuts = explanation.sections.filter((section) => section.kind === "EXAM_SHORTCUT");
            const traps = explanation.sections.filter((section) => section.kind === "COMMON_TRAPS");
            if (shortcuts.length !== 1 || shortcuts[0]!.paragraphs.length + shortcuts[0]!.equations.length === 0) {
              throw new Error("MEN-001 explanation must contain one non-empty Exam Speed Shortcut block.");
            }
            if (traps.length !== 1 || traps[0]!.paragraphs.length !== 3) {
              throw new Error("MEN-001 explanation must contain one Common Traps block covering all wrong options.");
            }
            const firstStepIndex = explanation.sections.findIndex((section) => section.kind === "STEP");
            const shortcutIndex = explanation.sections.findIndex((section) => section.kind === "EXAM_SHORTCUT");
            const trapIndex = explanation.sections.findIndex((section) => section.kind === "COMMON_TRAPS");
            const finalIndex = explanation.sections.findIndex((section) => section.kind === "FINAL_ANSWER");
            if (!(firstStepIndex > 0 && shortcutIndex > firstStepIndex && trapIndex > shortcutIndex && finalIndex > trapIndex)) {
              throw new Error("MEN-001 explanation blocks are not in the required four-tier order.");
            }
          }
          ''', encoding="utf-8")

          # Existing focused shortcut test now understands a semantic shortcut block.
          path = root / "exam-strategy-polish.test.ts"
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '''  return question.explanation.sections.find(
                  (section) => section.kind === "STEP" && section.title === "Exam Shortcut",
                );''',
              '''  return question.explanation.sections.find(
                  (section) => section.kind === "EXAM_SHORTCUT",
                );''',
              "shortcut helper",
          )
          text = replace_once(
              text,
              '''assert(!shortcut(ratioNonTriplet), "QL-020 must not claim a triplet shortcut for a non-right triangle.");''',
              '''assert(shortcut(ratioNonTriplet), "QL-020 must still expose a safe exam-speed block for a non-right triangle.");
          assert(
            shortcut(ratioNonTriplet)!.paragraphs.every((paragraph) => !/Pythagorean triplet/.test(paragraph)),
            "QL-020 must not claim a triplet shortcut for a non-right triangle.",
          );''',
              "non-triplet shortcut assertion",
          )
          path.write_text(text, encoding="utf-8")

          # Structured review rendering groups worked steps and gives shortcuts/traps their own visual blocks.
          path = root / "structured-human-review-export.ts"
          text = path.read_text(encoding="utf-8")
          render_start = text.index("function renderSection(")
          markdown_start = text.index("function markdownSection(", render_start)
          render_functions = '''function sectionClass(section: Men001ExplanationSection) {
            if (section.kind === "KEY_RULE") return "key-rule";
            if (section.kind === "EXAM_SHORTCUT") return "exam-shortcut";
            if (section.kind === "COMMON_TRAPS") return "common-traps";
            if (section.kind === "FINAL_ANSWER") return "final-answer";
            return "worked-step";
          }

          function renderSection(section: Men001ExplanationSection) {
            const heading = section.kind === "STEP"
              ? `Step ${section.stepNumber}: ${section.title}`
              : section.title;
            const prose = section.kind === "COMMON_TRAPS"
              ? `<ul class="trap-list">${section.paragraphs.map((paragraph) => `<li>${escapeHtml(paragraph)}</li>`).join("\n")}</ul>`
              : section.paragraphs.map((paragraph) => `<p>${escapeHtml(paragraph)}</p>`).join("\n");
            return `<section class="explanation-block ${sectionClass(section)}">
              <h4>${escapeHtml(heading)}</h4>
              ${prose}
              ${section.equations.map(renderEquation).join("\n")}
            </section>`;
          }

          function renderExplanation(sections: readonly Men001ExplanationSection[]) {
            const keyRule = sections.find((section) => section.kind === "KEY_RULE");
            const steps = sections.filter((section) => section.kind === "STEP");
            const examShortcut = sections.find((section) => section.kind === "EXAM_SHORTCUT");
            const commonTraps = sections.find((section) => section.kind === "COMMON_TRAPS");
            const finalAnswer = sections.find((section) => section.kind === "FINAL_ANSWER");
            return [
              keyRule ? renderSection(keyRule) : "",
              `<section class="worked-solution-tier"><h4>Step-by-Step Solution</h4>${steps.map(renderSection).join("\n")}</section>`,
              examShortcut ? renderSection(examShortcut) : "",
              commonTraps ? renderSection(commonTraps) : "",
              finalAnswer ? renderSection(finalAnswer) : "",
            ].join("\n");
          }

          '''
          text = text[:render_start] + render_functions + text[markdown_start:]
          markdown_start = text.index("function markdownSection(")
          cards_start = text.index("const cards:", markdown_start)
          markdown_functions = '''function markdownSection(section: Men001ExplanationSection, level = "###") {
            const heading = section.kind === "STEP"
              ? `${level} Step ${section.stepNumber}: ${section.title}`
              : `${level} ${section.title}`;
            const prose = section.kind === "COMMON_TRAPS"
              ? section.paragraphs.flatMap((paragraph) => [`- ${paragraph}`, ""])
              : section.paragraphs.flatMap((paragraph) => [paragraph, ""]);
            return [
              heading,
              "",
              ...prose,
              ...section.equations.flatMap((equation) => [`$$${equation}$$`, ""]),
            ];
          }

          function markdownExplanation(sections: readonly Men001ExplanationSection[]) {
            const keyRule = sections.find((section) => section.kind === "KEY_RULE");
            const steps = sections.filter((section) => section.kind === "STEP");
            const examShortcut = sections.find((section) => section.kind === "EXAM_SHORTCUT");
            const commonTraps = sections.find((section) => section.kind === "COMMON_TRAPS");
            const finalAnswer = sections.find((section) => section.kind === "FINAL_ANSWER");
            return [
              ...(keyRule ? markdownSection(keyRule) : []),
              "### Step-by-Step Solution",
              "",
              ...steps.flatMap((step) => markdownSection(step, "####")),
              ...(examShortcut ? markdownSection(examShortcut) : []),
              ...(commonTraps ? markdownSection(commonTraps) : []),
              ...(finalAnswer ? markdownSection(finalAnswer) : []),
            ];
          }

          '''
          text = text[:markdown_start] + markdown_functions + text[cards_start:]
          text = replace_once(
              text,
              '"Each explanation follows Key Rule → named worked steps → Final Answer. Equations are stored as MathJax-ready LaTeX, and the number of steps is determined by the mathematics.",',
              '"Each explanation follows Key Rule & Formula → Step-by-Step Solution → Exam Speed Shortcut → Common Traps → Final Answer. Equations are stored as MathJax-ready LaTeX.",',
              "markdown intro",
          )
          text = replace_once(
              text,
              '${question.explanation.sections.map(renderSection).join("\\n")}',
              '${renderExplanation(question.explanation.sections)}',
              "html explanation rendering",
          )
          text = replace_once(
              text,
              '...question.explanation.sections.flatMap(markdownSection),',
              '...markdownExplanation(question.explanation.sections),',
              "markdown explanation rendering",
          )
          text = replace_once(
              text,
              '.worked-step { border-left: 5px solid #b7791f; }',
              '''.worked-solution-tier { margin: 14px 0; padding: 16px 18px; border-radius: 12px; border: 1px solid #dbe3ee; background: #fffaf0; }
          .worked-solution-tier > h4 { margin: 0 0 12px; font-size: 18px; }
          .worked-step { border-left: 5px solid #b7791f; }
          .exam-shortcut { border-left: 5px solid #7c3aed; background: #f7f2ff; }
          .common-traps { border-left: 5px solid #c2410c; background: #fff7ed; }
          .trap-list { margin: 8px 0 0; padding-left: 22px; }
          .trap-list li { margin: 8px 0; line-height: 1.55; }''',
              "four-tier css",
          )
          text = replace_once(
              text,
              '.final-answer { background: #143322; }',
              '''.final-answer { background: #143322; }
            .worked-solution-tier { background: #2a2418; border-color: #5b4a2f; }
            .exam-shortcut { background: #251b3a; }
            .common-traps { background: #3a2118; }''',
              "dark mode css",
          )
          text = replace_once(
              text,
              '<p>Every solution follows Key Rule → named calculation steps → Final Answer, with MathJax-rendered LaTeX equations.</p>',
              '<p>Every solution follows the competitive four-tier layout: Key Rule & Formula → Step-by-Step Solution → Exam Speed Shortcut → Common Traps, followed by the Final Answer.</p>',
              "html intro",
          )
          path.write_text(text, encoding="utf-8")

          # Dedicated CI proof for the complete four-tier contract.
          path = Path(".github/workflows/men-001-runtime-proof.yml")
          text = path.read_text(encoding="utf-8")
          anchor = '''      - name: Build API production bundle
                run: node artifacts/api-server/build.mjs'''
          addition = '''      - name: Bundle four-tier explanation audit
                run: >-
                  pnpm --dir artifacts/api-server exec esbuild
                  src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/four-tier-explanation.test.ts
                  --bundle
                  --platform=node
                  --format=esm
                  --outfile=dist/quant-v4/men-001-four-tier-explanation.test.mjs

              - name: Run four-tier explanation audit
                shell: bash
                run: |
                  set -o pipefail
                  node artifacts/api-server/dist/quant-v4/men-001-four-tier-explanation.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/men-001-four-tier-explanation.log

              - name: Build API production bundle
                run: node artifacts/api-server/build.mjs'''
          text = replace_once(text, anchor, addition, "workflow test insertion")
          text = replace_once(
              text,
              '            artifacts/api-server/dist/quant-v4/men-001-exam-strategy-polish.log',
              '            artifacts/api-server/dist/quant-v4/men-001-exam-strategy-polish.log\n            artifacts/api-server/dist/quant-v4/men-001-four-tier-explanation.log',
              "workflow log upload",
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit four-tier structure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001 .github/workflows/men-001-runtime-proof.yml
          git commit -m "feat(mensuration): enforce four-tier competitive explanations"
          git push origin HEAD:feat/men-001-four-tier-explanations
