name: Validate MAL-CP-004 equivalence closure Wave 03

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp004-**
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/MAL-CP-004/**
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-cp004-**
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Percentage/PCT-007/foundation/solver.ts
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Percentage/PCT-007/foundation/types.ts
      - .github/workflows/mal-cp004-equivalence-wave03.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-mal-cp004-equivalence-wave03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-mal-cp004-equivalence-wave03:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle MAL-CP-004 equivalence audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-cp004-equivalence-wave03-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/mal-001-cp004-equivalence-wave03-audit.mjs
      - name: Run MAL-CP-004 equivalence audit
        shell: bash
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/mal-001-cp004-equivalence-wave03-audit.mjs 2>&1 | tee dist/quant-v4/mal-001-cp004-equivalence-wave03-audit.log
      - name: Upload MAL-CP-004 Wave 03 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mal-cp004-wave03-equivalence-closure
          path: |
            artifacts/api-server/dist/quant-v4/mal-001-cp004-equivalence-wave03-audit.log
            artifacts/api-server/dist/quant-v4/mal-cp004-wave03-equivalence-closure.json
            artifacts/api-server/dist/quant-v4/mal-cp004-wave03-equivalence-closure.md
          if-no-files-found: error
          retention-days: 14
