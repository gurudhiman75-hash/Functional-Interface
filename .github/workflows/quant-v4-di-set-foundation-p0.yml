name: Quant V4 DI set foundation P0

on:
  push:
    branches:
      - feat/quant-v4-di-set-foundation-p0
    paths:
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/**"
      - ".github/workflows/quant-v4-di-set-foundation-p0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  di-set-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Linked Table DI deterministic proof
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-001/table-set.test.ts

      - name: Patch hygiene
        run: git diff --check
