name: One-shot PNL CP-002 runtime proof

on:
  push:
    branches:
      - feat/pnl-001-cp002-dynamic-runtime
    paths:
      - ".github/workflows/tmp-pnl-cp002-runtime-proof.yml"

permissions:
  contents: write

jobs:
  patch-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-cp002-dynamic-runtime

      - name: Repair type-only imports
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-002/cp002-dynamic-runtime.ts")
          source = path.read_text()
          source = source.replace(
              '''import {
            rational,
            rationalToNumber,
            type Rational,
          } from "../foundation/rational";
          import {
            moneyFromPaise,
            moneyFromRupees,
            type Money,
          } from "../foundation/money";''',
              '''import {
            rational,
            rationalToNumber,
          } from "../foundation/rational";
          import {
            moneyFromPaise,
            moneyFromRupees,
          } from "../foundation/money";
          import type { Money, Rational } from "../foundation/types";''',
          )
          path.write_text(source)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle and run complete proof
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-002/cp002-dynamic-runtime.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-002/.cp002-dynamic-runtime.test.mjs \
            2>&1 | tee pnl-cp002-one-shot-proof.log
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-002/.cp002-dynamic-runtime.test.mjs \
            2>&1 | tee -a pnl-cp002-one-shot-proof.log

      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pnl-cp002-runtime-proof.yml
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-002/cp002-dynamic-runtime.ts
          git commit -m "fix(pnl): prove CP-002 dynamic runtime"
          git push origin HEAD:feat/pnl-001-cp002-dynamic-runtime

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnl-cp002-one-shot-proof
          path: pnl-cp002-one-shot-proof.log
          if-no-files-found: warn
          retention-days: 2
