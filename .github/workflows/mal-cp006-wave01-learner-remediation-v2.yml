name: Validate MAL-CP-006 Wave 01 learner remediation V2

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp006-wave01-learner-remediation-v2.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp006-wave01-learner-remediation-v2-final.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp006-wave01-equal-exchange-v2-final.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp006-wave01-learner-polish-final.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp006-wave01-learner-authority-final.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp006-types.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-cp006-wave01-learner-authority-final-audit.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/MAL-CP-006/**"
      - ".github/workflows/mal-cp006-wave01-learner-remediation-v2.yml"
  workflow_dispatch:

jobs:
  validate-mal-cp006-wave01-v2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Wave 01 V1 regression audit
        run: >
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-cp006-wave01-executable-discovery-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/mal-001-cp006-wave01-v1-regression.mjs

      - name: Run Wave 01 V1 regression audit
        shell: bash
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/mal-001-cp006-wave01-v1-regression.mjs 2>&1 | tee dist/quant-v4/mal-001-cp006-wave01-v1-regression.log

      - name: Bundle final Wave 01 learner-authority audit
        run: >
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-cp006-wave01-learner-authority-final-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/mal-001-cp006-wave01-final-learner-authority-audit.mjs

      - name: Run final Wave 01 learner-authority audit
        shell: bash
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/mal-001-cp006-wave01-final-learner-authority-audit.mjs 2>&1 | tee dist/quant-v4/mal-001-cp006-wave01-final-learner-authority-audit.log

      - name: Upload final Wave 01 learner-authority evidence
        uses: actions/upload-artifact@v4
        with:
          name: mal-cp006-wave01-final-learner-authority
          path: |
            artifacts/api-server/dist/quant-v4/mal-001-cp006-wave01-v1-regression.log
            artifacts/api-server/dist/quant-v4/mal-001-cp006-wave01-final-learner-authority-audit.log
            artifacts/api-server/dist/quant-v4/mal-cp006-wave01-final-learner-authority.json
            artifacts/api-server/dist/quant-v4/MAL-CP-006-WAVE-01-FINAL-LEARNER-AUTHORITY-25Q-REVIEW.md
          if-no-files-found: error
          retention-days: 14
