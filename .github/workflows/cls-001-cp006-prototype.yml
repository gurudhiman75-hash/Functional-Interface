name: Validate CLS-001 CP-006 Alphabet Classification English Runtime

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Classification/CLS-001/CLS-CP-006/**
      - artifacts/api-server/src/reasoning-v1/topics/Classification/CLS-001/README.md
      - .github/workflows/cls-001-cp006-prototype.yml

permissions:
  contents: read

jobs:
  validate-alphabet-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle CLS-CP-006 audits and exporters
        run: |
          ROOT=src/reasoning-v1/topics/Classification/CLS-001/CLS-CP-006
          OUT=dist/reasoning-v1/cls-001/cp006
          mkdir -p artifacts/api-server/$OUT
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/prototype.test.ts" --bundle --platform=node --format=esm --outfile="$OUT/prototype.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/source-gap.test.ts" --bundle --platform=node --format=esm --outfile="$OUT/source-gap.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/editorial.test.ts" --bundle --platform=node --format=esm --outfile="$OUT/editorial.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp006-english-runtime.test.ts" --bundle --platform=node --format=esm --outfile="$OUT/cp006-english-runtime.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/export-review.ts" --bundle --platform=node --format=esm --outfile="$OUT/export-review.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/export-cp006-permanent-review.ts" --bundle --platform=node --format=esm --outfile="$OUT/export-cp006-permanent-review.mjs"

      - name: Run CLS-CP-006 English runtime audits
        id: cp006_audit
        run: |
          set +e
          OUT=artifacts/api-server/dist/reasoning-v1/cls-001/cp006
          DIAG=$OUT/diagnostics
          mkdir -p "$DIAG"
          (cd artifacts/api-server && node "dist/reasoning-v1/cls-001/cp006/prototype.test.mjs") >"$DIAG/prototype-audit.log" 2>&1
          PROTOTYPE_STATUS=$?
          (cd artifacts/api-server && node "dist/reasoning-v1/cls-001/cp006/source-gap.test.mjs") >"$DIAG/source-gap-audit.log" 2>&1
          SOURCE_GAP_STATUS=$?
          (cd artifacts/api-server && node "dist/reasoning-v1/cls-001/cp006/editorial.test.mjs") >"$DIAG/editorial-audit.log" 2>&1
          EDITORIAL_STATUS=$?
          (cd artifacts/api-server && node "dist/reasoning-v1/cls-001/cp006/cp006-english-runtime.test.mjs") >"$DIAG/permanent-english-runtime-audit.log" 2>&1
          PERMANENT_STATUS=$?
          if [ "$PROTOTYPE_STATUS" -ne 0 ] || [ "$SOURCE_GAP_STATUS" -ne 0 ] || [ "$EDITORIAL_STATUS" -ne 0 ] || [ "$PERMANENT_STATUS" -ne 0 ]; then
            STATUS=1
          else
            STATUS=0
          fi
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload CLS-CP-006 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cls-001-cp006-audit-diagnostics
          path: artifacts/api-server/dist/reasoning-v1/cls-001/cp006/diagnostics
          if-no-files-found: error

      - name: Enforce CLS-CP-006 English runtime audits
        if: steps.cp006_audit.outputs.exit_code != '0'
        run: |
          cat artifacts/api-server/dist/reasoning-v1/cls-001/cp006/diagnostics/prototype-audit.log
          cat artifacts/api-server/dist/reasoning-v1/cls-001/cp006/diagnostics/source-gap-audit.log
          cat artifacts/api-server/dist/reasoning-v1/cls-001/cp006/diagnostics/editorial-audit.log
          cat artifacts/api-server/dist/reasoning-v1/cls-001/cp006/diagnostics/permanent-english-runtime-audit.log
          exit 1

      - name: Generate CLS-CP-006 discovery review
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/cls-001/cp006/export-review.mjs

      - name: Generate CLS-CP-006 permanent English review
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/cls-001/cp006/export-cp006-permanent-review.mjs

      - name: Upload CLS-CP-006 discovery review
        uses: actions/upload-artifact@v4
        with:
          name: cls-001-cp006-alphabet-discovery-review
          path: artifacts/api-server/dist/reasoning-v1/cls-001/cp006-review
          if-no-files-found: error

      - name: Upload CLS-CP-006 permanent English review
        uses: actions/upload-artifact@v4
        with:
          name: cls-001-cp006-permanent-english-review
          path: artifacts/api-server/dist/reasoning-v1/cls-001/cp006-permanent-review
          if-no-files-found: error
