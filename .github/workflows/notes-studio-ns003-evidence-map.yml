name: Validate Notes Studio NS-003 Evidence Map

on:
  pull_request:
    branches:
      - New-main
      - feature/notes-studio-v1
    paths:
      - 'artifacts/api-server/src/notes-studio/evidence-map.ts'
      - 'artifacts/api-server/src/notes-studio/evidence-map.test.ts'
      - 'artifacts/api-server/src/routes/admin-notes-studio-evidence.ts'
      - 'artifacts/api-server/src/routes/index.ts'
      - 'artifacts/api-server/migrations/20260829_notes_studio_evidence_map.sql'
      - 'artifacts/admin-app/src/pages/content/NotesStudioEvidencePage.tsx'
      - 'artifacts/admin-app/src/pages/content/NotesStudioHubPage.tsx'
  workflow_dispatch:

concurrency:
  group: notes-studio-ns003-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-notes-studio-evidence-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run evidence-map contract tests
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/evidence-map.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-evidence-map.test.mjs
          node artifacts/api-server/dist/notes-studio-evidence-map.test.mjs
      - name: Verify evidence schema and safety boundaries
        run: |
          grep -F 'CREATE TABLE IF NOT EXISTS content.note_evidence_runs' artifacts/api-server/migrations/20260829_notes_studio_evidence_map.sql
          grep -F 'CREATE TABLE IF NOT EXISTS content.note_evidence_support' artifacts/api-server/migrations/20260829_notes_studio_evidence_map.sql
          grep -F 'char_length(evidence_excerpt) BETWEEN 1 AND 600' artifacts/api-server/migrations/20260829_notes_studio_evidence_map.sql
          grep -F "evidence_state IN ('candidate', 'accepted', 'rejected')" artifacts/api-server/migrations/20260829_notes_studio_evidence_map.sql
          grep -F 'force_note_evidence_candidate_on_insert' artifacts/api-server/migrations/20260829_notes_studio_evidence_map.sql
          grep -F "NEW.evidence_state := 'candidate'" artifacts/api-server/migrations/20260829_notes_studio_evidence_map.sql
      - name: Verify evidence route and learner-publication separation
        run: |
          grep -F 'adminNotesStudioEvidenceRouter' artifacts/api-server/src/routes/index.ts
          grep -F "'notes_studio.evidence.extracted'" artifacts/api-server/src/routes/admin-notes-studio-evidence.ts
          ! grep -F '/publish' artifacts/api-server/src/routes/admin-notes-studio-evidence.ts
          ! grep -F 'learning_resources' artifacts/api-server/src/routes/admin-notes-studio-evidence.ts
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Typecheck admin app
        run: pnpm --dir artifacts/admin-app typecheck
