name: Validate SPA FMT-001 Discovery V1

on:
  pull_request:
    branches:
      - New-main
    paths:
      - 'artifacts/api-server/src/reasoning-v1/foundation/spatial/figure-matrix-*.ts'
      - 'artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-permanent-ql-allocation-v12.ts'
      - 'artifacts/api-server/src/reasoning-v1/tests/figure-matrix-fmt-001-discovery-v1.test.ts'
  workflow_dispatch:

concurrency:
  group: spa-fmt-001-discovery-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle FMT-001 discovery proof
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/figure-matrix-fmt-001-discovery-v1.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/reasoning-v1/spatial/figure-matrix-fmt-001-discovery-v1.test.mjs

      - name: Run FMT-001 discovery proof
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/figure-matrix-fmt-001-discovery-v1.test.mjs 2>&1 \
            | tee dist/reasoning-v1/spatial/fmt-001-discovery-v1-run.log

      - name: Upload FMT-001 discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-fmt-001-discovery-v1
          path: artifacts/api-server/dist/reasoning-v1/spatial/fmt-001-discovery-v1-run.log
          if-no-files-found: error
