name: Validate Question Analytics

on:
  pull_request:
    branches: [New-main]
    paths:
      - artifacts/api-server/src/routes/admin-question-analytics.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/admin-app/src/pages/analytics/QuestionAnalyticsPage.tsx
      - artifacts/admin-app/src/App.tsx
      - artifacts/admin-app/src/app/nav/navigation.ts
      - .github/workflows/question-analytics.yml
  push:
    branches: [New-main]
    paths:
      - artifacts/api-server/src/routes/admin-question-analytics.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/admin-app/src/pages/analytics/QuestionAnalyticsPage.tsx
      - artifacts/admin-app/src/App.tsx
      - artifacts/admin-app/src/app/nav/navigation.ts
      - .github/workflows/question-analytics.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: question-analytics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Enforce canonical Question Analytics contracts
        run: |
          grep -F 'router.use("/admin/analytics", adminQuestionAnalyticsRouter)' artifacts/api-server/src/routes/index.ts
          grep -F "router.get('/questions'" artifacts/api-server/src/routes/admin-question-analytics.ts
          grep -F "requireAdminPermission('users.students.read')" artifacts/api-server/src/routes/admin-question-analytics.ts
          grep -F 'FROM learning.attempts' artifacts/api-server/src/routes/admin-question-analytics.ts
          grep -F 'a.result_snapshot AS "resultSnapshot"' artifacts/api-server/src/routes/admin-question-analytics.ts
          grep -F 'JOIN assessment.test_publications' artifacts/api-server/src/routes/admin-question-analytics.ts
          grep -F 'JOIN content.question_versions' artifacts/api-server/src/routes/admin-question-analytics.ts
          grep -F 'stableQuestionId' artifacts/api-server/src/routes/admin-question-analytics.ts
          grep -F 'unmatchedReviewItems' artifacts/api-server/src/routes/admin-question-analytics.ts
          grep -F 'optionSelection: true' artifacts/api-server/src/routes/admin-question-analytics.ts
          grep -F 'questionTiming: false' artifacts/api-server/src/routes/admin-question-analytics.ts
          grep -F 'discrimination: false' artifacts/api-server/src/routes/admin-question-analytics.ts
          grep -F 'readOnly: true' artifacts/api-server/src/routes/admin-question-analytics.ts
          ! grep -E 'INSERT INTO|UPDATE |DELETE FROM' artifacts/api-server/src/routes/admin-question-analytics.ts
          grep -F "path: '/analytics/questions'" artifacts/admin-app/src/App.tsx
          grep -F "label: 'Question Analytics'" artifacts/admin-app/src/app/nav/navigation.ts
          grep -F "status: 'live'" artifacts/admin-app/src/app/nav/navigation.ts
          grep -F 'Question linkage requires review' artifacts/admin-app/src/pages/analytics/QuestionAnalyticsPage.tsx
          grep -F 'Declared scope boundary' artifacts/admin-app/src/pages/analytics/QuestionAnalyticsPage.tsx
          ! grep -F '@/data/questions' artifacts/admin-app/src/pages/analytics/QuestionAnalyticsPage.tsx
          ! grep -F '@/data/analytics' artifacts/admin-app/src/pages/analytics/QuestionAnalyticsPage.tsx
          ! grep -F 'demonstration data' artifacts/admin-app/src/pages/analytics/QuestionAnalyticsPage.tsx
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Typecheck admin application
        run: pnpm run typecheck:admin
      - name: Test admin application
        run: pnpm run test:admin
      - name: Build admin application
        run: pnpm run build:admin
