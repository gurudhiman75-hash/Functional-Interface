name: Validate Question Analytics

on:
  pull_request:
    branches: [New-main]
    paths:
      - artifacts/api-server/src/routes/published-test-runner.ts
      - artifacts/api-server/src/routes/admin-question-analytics-quality.ts
      - artifacts/api-server/src/routes/admin-question-analytics-detail.ts
      - artifacts/api-server/src/routes/admin-question-analytics.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/admin-app/src/pages/analytics/QuestionAnalyticsQualityPage.tsx
      - artifacts/admin-app/src/pages/analytics/QuestionAnalyticsPage.tsx
      - artifacts/admin-app/src/App.tsx
      - artifacts/admin-app/src/app/nav/navigation.ts
      - .github/scripts/validate-question-analytics.mjs
      - .github/workflows/question-analytics.yml
      - docs/question-analytics-freeze-readiness.md
  push:
    branches: [New-main]
    paths:
      - artifacts/api-server/src/routes/published-test-runner.ts
      - artifacts/api-server/src/routes/admin-question-analytics-quality.ts
      - artifacts/api-server/src/routes/admin-question-analytics-detail.ts
      - artifacts/api-server/src/routes/admin-question-analytics.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/admin-app/src/pages/analytics/QuestionAnalyticsQualityPage.tsx
      - artifacts/admin-app/src/pages/analytics/QuestionAnalyticsPage.tsx
      - artifacts/admin-app/src/App.tsx
      - artifacts/admin-app/src/app/nav/navigation.ts
      - .github/scripts/validate-question-analytics.mjs
      - .github/workflows/question-analytics.yml
      - docs/question-analytics-freeze-readiness.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: question-analytics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate Question Analytics freeze contracts
        run: node .github/scripts/validate-question-analytics.mjs
      - name: Enforce route and scope boundaries
        run: |
          grep -F 'router.use("/admin/analytics", adminQuestionAnalyticsQualityRouter)' artifacts/api-server/src/routes/index.ts
          grep -F 'router.use("/admin/analytics", adminQuestionAnalyticsDetailRouter)' artifacts/api-server/src/routes/index.ts
          grep -F 'router.use("/admin/analytics", adminQuestionAnalyticsRouter)' artifacts/api-server/src/routes/index.ts
          grep -F "router.get('/questions/quality'" artifacts/api-server/src/routes/admin-question-analytics-quality.ts
          grep -F "router.get('/questions/:questionVersionId'" artifacts/api-server/src/routes/admin-question-analytics-detail.ts
          grep -F "router.get('/questions'" artifacts/api-server/src/routes/admin-question-analytics.ts
          grep -F 'snapshotVersion: 2' artifacts/api-server/src/routes/published-test-runner.ts
          grep -F 'linkageContract: "direct_question_version_v2"' artifacts/api-server/src/routes/published-test-runner.ts
          grep -F 'questionVersionId: String(row.questionVersionId)' artifacts/api-server/src/routes/published-test-runner.ts
          grep -F 'testQuestionId: String(row.testQuestionId)' artifacts/api-server/src/routes/published-test-runner.ts
          grep -F 'selectedOptionKey:' artifacts/api-server/src/routes/published-test-runner.ts
          grep -F 'timeTakenSeconds:' artifacts/api-server/src/routes/published-test-runner.ts
          grep -F 'stableIdCollisions' artifacts/api-server/src/routes/admin-question-analytics-quality.ts
          grep -F 'answerKeyMismatches' artifacts/api-server/src/routes/admin-question-analytics-quality.ts
          grep -F 'missingQuestionItems' artifacts/api-server/src/routes/admin-question-analytics-quality.ts
          grep -F 'questionTiming: timedResponses > 0' artifacts/api-server/src/routes/admin-question-analytics.ts
          grep -F 'discrimination: false' artifacts/api-server/src/routes/admin-question-analytics-detail.ts
          grep -F "path: '/analytics/questions/quality'" artifacts/admin-app/src/App.tsx
          grep -F "path: '/analytics/questions/:questionVersionId'" artifacts/admin-app/src/App.tsx
          grep -F "label: 'Question Analytics Quality'" artifacts/admin-app/src/app/nav/navigation.ts
          grep -F 'Never repair analytics by editing aggregate outputs' artifacts/admin-app/src/pages/analytics/QuestionAnalyticsQualityPage.tsx
          ! grep -E 'INSERT INTO|UPDATE |DELETE FROM' artifacts/api-server/src/routes/admin-question-analytics-quality.ts
          ! grep -E 'INSERT INTO|UPDATE |DELETE FROM' artifacts/api-server/src/routes/admin-question-analytics-detail.ts
          ! grep -E 'INSERT INTO|UPDATE |DELETE FROM' artifacts/api-server/src/routes/admin-question-analytics.ts
          ! grep -E '@/data/questions|@/data/analytics|demonstration data' artifacts/admin-app/src/pages/analytics/QuestionAnalyticsPage.tsx
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Typecheck admin application
        run: pnpm run typecheck:admin
      - name: Test admin application
        run: pnpm run test:admin
      - name: Build admin application
        run: pnpm run build:admin
