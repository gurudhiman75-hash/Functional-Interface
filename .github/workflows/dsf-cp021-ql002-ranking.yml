name: Validate DSF-CP-021 QL002 Ranking

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-015/**
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-021/**
      - artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsf-cp021-ql002-ranking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dsf-cp021:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle CP021 QL002 Ranking audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-021/ranking-three-statement-batch-v1.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/dsf-cp021-ql002-ranking.test.mjs

      - name: Run CP021 QL002 Ranking audit
        run: node artifacts/api-server/dist/reasoning-v1/dsf-cp021-ql002-ranking.test.mjs
