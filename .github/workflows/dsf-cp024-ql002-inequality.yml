name: Validate DSF-CP-024 QL002 Inequality

on:
  pull_request:
    branches:
      - New-main
      - audit/dsf-001-cp023-ql002-blood-relations
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-015/**
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-024/**
      - artifacts/api-server/src/lib/reasoning/inequality-foundation.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsf-cp024-ql002-inequality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dsf-cp024:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle CP024 QL002 Inequality audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-024/inequality-three-statement-batch-v1.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/dsf-cp024-ql002-inequality.test.mjs
      - name: Run CP024 QL002 Inequality audit
        run: node artifacts/api-server/dist/reasoning-v1/dsf-cp024-ql002-inequality.test.mjs
