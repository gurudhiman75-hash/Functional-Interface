name: Export SEA-001 structural hardening English review

on:
  push:
    branches:
      - feat/sea-001-structural-realness-hardening
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/review/structural-hardening-english-review.ts
      - artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/cp003/**
      - artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/cp004/**
      - artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/generation/**
      - .github/workflows/sea-001-structural-hardening-review.yml
  pull_request:
    branches:
      - feat/sea-001-realness-final-gate
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  english-review-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic learner review corpus
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/review/structural-hardening-english-review.ts /tmp/sea001-review
      - name: Re-run pinned machine-realness gate before publishing review artifact
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/sea-001-structural-hardening-proof.test.ts
      - name: Upload English review candidate
        uses: actions/upload-artifact@v4
        with:
          name: sea-001-structural-hardening-english-review
          path: /tmp/sea001-review
          if-no-files-found: error
          retention-days: 30
