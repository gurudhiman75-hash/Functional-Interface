name: Apply PNC QL-118 localization fix

on:
  push:
    branches:
      - feat/pnc-002-hi-pa-localization
    paths:
      - .github/workflows/pnc-002-localization-ql118-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pnc-002-hi-pa-localization
      - name: Align QL-118 with word-number source contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/localization-cp007.ts")
          text = path.read_text(encoding="utf-8")
          old = '''    case "PNC-QL-118": {
      const n = requiredToken(t, 0, qlId);
      const target = requiredToken(t, 1, qlId);
      const low = requiredToken(t, 2, qlId);
      const high = requiredToken(t, 3, qlId);
      return hi
        ? `${n} अलग-अलग किताबें एक पंक्ति में रखी जाती हैं। यदि $k$ निश्चित किताबों को साथ रखने पर ${target} व्यवस्थाएँ बनती हैं, तो $k$ ज्ञात कीजिए, जहाँ $${low} \\\\le k \\\\le ${high}$.`
        : `${n} ਵੱਖ-ਵੱਖ ਕਿਤਾਬਾਂ ਇੱਕ ਕਤਾਰ ਵਿੱਚ ਲਗਾਈਆਂ ਜਾਂਦੀਆਂ ਹਨ। ਜੇ $k$ ਖਾਸ ਕਿਤਾਬਾਂ ਨੂੰ ਇਕੱਠਾ ਰੱਖਣ ਉੱਤੇ ${target} ਤਰੀਕੇ ਬਣਦੇ ਹਨ, ਤਾਂ $k$ ਪਤਾ ਕਰੋ, ਜਿੱਥੇ $${low} \\\\le k \\\\le ${high}$.`;
    }
'''
          new = '''    case "PNC-QL-118": {
      const target = requiredToken(t, 0, qlId);
      const low = requiredToken(t, 1, qlId);
      const high = requiredToken(t, 2, qlId);
      return hi
        ? `आठ अलग-अलग किताबें एक पंक्ति में रखी जाती हैं। यदि $k$ निश्चित किताबों को साथ रखने पर ${target} व्यवस्थाएँ बनती हैं, तो $k$ ज्ञात कीजिए, जहाँ $${low} \\\\le k \\\\le ${high}$.`
        : `ਅੱਠ ਵੱਖ-ਵੱਖ ਕਿਤਾਬਾਂ ਇੱਕ ਕਤਾਰ ਵਿੱਚ ਲਗਾਈਆਂ ਜਾਂਦੀਆਂ ਹਨ। ਜੇ $k$ ਖਾਸ ਕਿਤਾਬਾਂ ਨੂੰ ਇਕੱਠਾ ਰੱਖਣ ਉੱਤੇ ${target} ਤਰੀਕੇ ਬਣਦੇ ਹਨ, ਤਾਂ $k$ ਪਤਾ ਕਰੋ, ਜਿੱਥੇ $${low} \\\\le k \\\\le ${high}$.`;
    }
'''
          if old not in text:
              raise SystemExit("QL-118 localization anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/localization-cp007.ts
          git commit -m "fix(pnc): align QL-118 localized stem contract"
          git push origin HEAD:feat/pnc-002-hi-pa-localization
