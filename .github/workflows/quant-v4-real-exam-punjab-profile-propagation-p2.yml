name: Quant V4 real exam Punjab profile boundary P2

on:
  push:
    branches:
      - audit/quant-v4-punjab-profile-propagation-p2
    paths:
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-real-exam-punjab-profile-propagation-p2.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-real-exam-punjab-profile-propagation-p2.test.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-real-exam-advanced-math-integration-p2.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-real-exam-simulation-p2.ts"
      - "artifacts/api-server/src/quant-v4/common/exam-profile.ts"
      - "artifacts/api-server/src/quant-v4/generation-engine-core.ts"
      - "artifacts/api-server/src/quant-v4/generation-engine-legacy.ts"
      - "artifacts/api-server/src/quant-v4/question-studio-generation-engine.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/question-studio-adapter.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/question-studio-adapter.ts"
      - "artifacts/api-server/src/quant-v4/topics/Probability/shared/types.ts"
      - "artifacts/api-server/src/quant-v4/topics/Probability/shared/exam-profile.ts"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-009/question-studio-runtime.ts"
      - ".github/workflows/quant-v4-real-exam-punjab-profile-propagation-p2.yml"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-real-exam-punjab-profile-propagation-p2.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-real-exam-punjab-profile-propagation-p2.test.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-real-exam-advanced-math-integration-p2.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-real-exam-simulation-p2.ts"
      - "artifacts/api-server/src/quant-v4/common/exam-profile.ts"
      - "artifacts/api-server/src/quant-v4/generation-engine-core.ts"
      - "artifacts/api-server/src/quant-v4/generation-engine-legacy.ts"
      - "artifacts/api-server/src/quant-v4/question-studio-generation-engine.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/question-studio-adapter.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/question-studio-adapter.ts"
      - "artifacts/api-server/src/quant-v4/topics/Probability/shared/types.ts"
      - "artifacts/api-server/src/quant-v4/topics/Probability/shared/exam-profile.ts"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-009/question-studio-runtime.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-v4-real-exam-punjab-profile-propagation-p2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  punjab-profile-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server and compile boundary guards
        run: pnpm --dir artifacts/api-server build

      - name: Bundle Punjab profile boundary audit
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/real-exam-simulation
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/quality/quant-v4-real-exam-punjab-profile-propagation-p2.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/quant-v4/real-exam-simulation/quant-v4-real-exam-punjab-profile-propagation-p2.test.mjs

      - name: Run Punjab profile boundary audit
        working-directory: artifacts/api-server
        run: node dist/quant-v4/real-exam-simulation/quant-v4-real-exam-punjab-profile-propagation-p2.test.mjs

      - name: Bundle Advanced Mathematics integration regression
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/quality/quant-v4-real-exam-advanced-math-integration-p2.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/quant-v4/real-exam-simulation/quant-v4-real-exam-advanced-math-integration-p2.test.mjs

      - name: Run Advanced Mathematics integration regression
        working-directory: artifacts/api-server
        run: node dist/quant-v4/real-exam-simulation/quant-v4-real-exam-advanced-math-integration-p2.test.mjs

      - name: Patch hygiene
        run: git diff --check
