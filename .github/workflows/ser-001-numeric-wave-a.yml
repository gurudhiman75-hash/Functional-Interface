name: Validate SER-001 numeric Wave A

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-NUMERIC-WAVE-A/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-NUMERIC-AUDIT/**
      - .github/workflows/ser-001-numeric-wave-a.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-numeric-wave-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-numeric-wave-a:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/numeric-wave-a

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Run Wave A exact-rational edge-domain audit
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-NUMERIC-WAVE-A
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/numeric-wave-a
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/ser-numeric-wave-a.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-numeric-wave-a.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-numeric-wave-a.test.mjs") \
            | tee "$EVIDENCE/wave-a-audit.json"

      - name: Run post-Wave-A chapter gap audit
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-NUMERIC-WAVE-A
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/numeric-wave-a
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/ser-numeric-wave-a-gap-audit.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-numeric-wave-a-gap-audit.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-numeric-wave-a-gap-audit.test.mjs") \
            | tee "$EVIDENCE/post-wave-a-gap-audit.json"

      - name: Generate exact English review pack
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-NUMERIC-WAVE-A
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/numeric-wave-a
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/export-review.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/export-numeric-wave-a-review.mjs"
          (cd artifacts/api-server && node "$OUT/export-numeric-wave-a-review.mjs") \
            > "$EVIDENCE/ser-numeric-wave-a-en-IN-review.md"
          cp "artifacts/api-server/$ROOT/ser-numeric-wave-a-implementation-plan.md" \
            "$EVIDENCE/ser-numeric-wave-a-implementation-plan.md"
          cp "artifacts/api-server/$ROOT/ser-numeric-wave-a-gap-report.md" \
            "$EVIDENCE/ser-numeric-wave-a-gap-report.md"

      - name: Upload Wave A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-numeric-wave-a-edge-domain
          path: artifacts/api-server/dist/reasoning-v1/ser-001/numeric-wave-a
          if-no-files-found: error
          retention-days: 30
