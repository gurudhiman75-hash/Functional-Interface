name: Validate DSF-CP-001 Number System production

on:
  pull_request:
    branches:
      - New-main
      - feature/dsf-cp000-foundation-v1
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-001/**
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-001-MANIFEST-AMENDMENT-CP001.md
      - .github/workflows/dsf-cp001-number-system.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsf-cp001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dsf-cp001-number-system:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle CP-001 production proof
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/dsf
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-001/cp001-number-system-runtime.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp001-number-system-runtime.test.mjs
      - name: Run CP-001 production stress proof
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/dsf/dsf-cp001-number-system-runtime.test.mjs
