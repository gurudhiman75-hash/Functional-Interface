name: Validate STA-001 exam realness and exhaustive formats

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/**
      - .github/workflows/sta-001-exam-realness.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-sta-001-exam-realness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exam-realness-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Strict TypeScript check for complete STA package
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowImportingTsExtensions \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/Statement-and-Assumption/STA-001 -name '*.ts' -print)

      - name: Replay immutable English V2 freeze
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/english-freeze-proof.test.ts

      - name: Replay immutable QL001 Hindi/Punjabi freeze
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql001-freeze-proof.test.ts

      - name: Replay immutable QL002 Hindi/Punjabi freeze
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql002-freeze-proof.test.ts

      - name: Replay immutable QL003 Hindi/Punjabi freeze
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql003-freeze-proof.test.ts

      - name: Re-prove QL004 V2 semantic and native-editorial identity
        env:
          STA_QL004_LOCALIZATION_V2_CASES_PER_LOCALE: 1024
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql004-editorial-v2-proof.test.ts

      - name: Prove QL004 V3 exam-realness overlay across 8192 questions
        env:
          STA_QL004_EXAM_REALNESS_CASES_PER_LOCALE: 4096
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql004-editorial-v3-proof.test.ts

      - name: Prove 2/3/4-assumption and 4/5-option exam-format matrix
        env:
          STA_EXAM_FORMAT_CASES_PER_PROFILE_LOCALE: 512
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/exam-format-extension-proof.test.ts

      - name: Prove chapter-wide learner realness across 32768 localized questions
        env:
          STA_CHAPTER_EXAM_REALNESS_CASES_PER_QL_LOCALE: 4096
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/exam-realness-chapter-proof.test.ts

      - name: Generate QL004 Hindi/Punjabi V3 exam-realness review pack
        env:
          STA_QL004_LOCALIZATION_V3_REVIEW_OUTPUT_DIR: /tmp/sta-001-ql004-hi-pa-review-v3
          STA_QL004_LOCALIZATION_V3_EXAMPLES_PER_AUTHORITY: 2
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql004-editorial-v3-review-export.ts

      - name: Build production API
        working-directory: artifacts/api-server
        run: pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: sta-001-ql004-hi-pa-exam-realness-review-v3
          path: /tmp/sta-001-ql004-hi-pa-review-v3/**
          if-no-files-found: error
          retention-days: 14
