name: Validate English ENG-002 CP007 CP008 Approval V1

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/english-v1/chapters/sentence-improvement/ENG-002/CP007/**
      - artifacts/api-server/src/english-v1/chapters/sentence-improvement/ENG-002/CP008/**
      - artifacts/api-server/src/question-studio/engines/language-v1-adapter.ts
      - artifacts/api-server/src/question-studio/engines/language-v1-eng002-cp007-cp008-adapter-v1.ts
      - artifacts/api-server/src/question-studio/engines/language-v1-eng002-cp007-cp008-adapter-v1.test.ts
      - .github/workflows/english-eng002-cp007-cp008-approval-v1.yml
  push:
    branches: [New-main]
    paths:
      - artifacts/api-server/src/english-v1/chapters/sentence-improvement/ENG-002/CP007/**
      - artifacts/api-server/src/english-v1/chapters/sentence-improvement/ENG-002/CP008/**
      - artifacts/api-server/src/question-studio/engines/language-v1-adapter.ts
      - artifacts/api-server/src/question-studio/engines/language-v1-eng002-cp007-cp008-adapter-v1.ts
      - artifacts/api-server/src/question-studio/engines/language-v1-eng002-cp007-cp008-adapter-v1.test.ts
      - .github/workflows/english-eng002-cp007-cp008-approval-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-eng002-cp007-cp008-approval-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-eng002-cp007-cp008-approval-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile ENG-002 CP007 generator test
        run: |
          mkdir -p artifacts/api-server/dist/english-v1
          pnpm --dir artifacts/api-server exec esbuild src/english-v1/tests/eng-002-cp007-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-002-cp007-v1.test.mjs
      - name: Run ENG-002 CP007 generator test
        run: node artifacts/api-server/dist/english-v1/eng-002-cp007-v1.test.mjs
      - name: Compile ENG-002 CP008 generator test
        run: pnpm --dir artifacts/api-server exec esbuild src/english-v1/tests/eng-002-cp008-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-002-cp008-v1.test.mjs
      - name: Run ENG-002 CP008 generator test
        run: node artifacts/api-server/dist/english-v1/eng-002-cp008-v1.test.mjs
      - name: Compile Question Studio approval adapter test
        run: pnpm --dir artifacts/api-server exec esbuild src/question-studio/engines/language-v1-eng002-cp007-cp008-adapter-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/language-v1-eng002-cp007-cp008-adapter-v1.test.mjs
      - name: Run Question Studio approval adapter test
        run: node artifacts/api-server/dist/english-v1/language-v1-eng002-cp007-cp008-adapter-v1.test.mjs
      - name: Build API server
        run: pnpm --dir artifacts/api-server run build
