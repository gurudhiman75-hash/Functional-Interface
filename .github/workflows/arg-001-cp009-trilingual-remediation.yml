name: Validate ARG-001 CP009 Trilingual Editorial Remediation

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp009-*'
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp006-*'
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp008-*'
      - '.github/workflows/arg-001-cp009-trilingual-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arg-001-cp009-trilingual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arg-cp009-trilingual-remediation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Strict TypeScript check for CP009 trilingual remediation
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowImportingTsExtensions \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/types.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp009-english-remediated-templates.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp009-english-generator.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp009-localized-remediated-templates.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp009-localized-remediated-templates-v2.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp009-localized-generator-v2.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp009-trilingual-remediation-proof.test.ts

      - name: Preserve exhaustive English CP009 remediation
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp009-english-remediation-proof.test.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=dist/arg-001-cp009-english-proof.mjs
          node dist/arg-001-cp009-english-proof.mjs

      - name: Exhaustively prove all 24,576 HI PA surfaces
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp009-trilingual-remediation-proof.test.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=dist/arg-001-cp009-trilingual-proof.mjs
          node dist/arg-001-cp009-trilingual-proof.mjs

      - name: Preserve exact CP006 historical core freeze
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp006-byte-freeze-proof.test.ts

      - name: Preserve exact CP008 historical real-paper freeze
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp008-byte-freeze-proof.test.ts

      - name: Build production API
        working-directory: artifacts/api-server
        run: pnpm run build

      - name: Build production admin app
        working-directory: artifacts/admin-app
        run: pnpm run build

      - name: Lifecycle boundary
        run: |
          echo 'ARG-001 CP009 remediates English, Hindi and Punjabi review surfaces under new authorities.'
          echo 'Historical CP006/CP008 freezes remain byte-identical.'
          echo 'Question Bank/test/mock/public/automatic learner publication remain locked.'
