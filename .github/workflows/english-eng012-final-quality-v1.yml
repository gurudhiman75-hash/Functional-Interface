name: Validate ENG-012 Final Quality V1

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/english-v1/chapters/word-swap/ENG-012/**
      - artifacts/api-server/src/english-v1/tests/eng-012-v2.test.ts
      - artifacts/api-server/src/question-studio/engines/language-v1-eng012-adapter-v1.ts
      - artifacts/api-server/src/question-studio/engines/language-v1-eng012-adapter-v1.test.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eng012-final-quality-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-eng012:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile
      - name: Compile ENG-012 production audit
        run: pnpm --dir artifacts/api-server exec esbuild src/english-v1/tests/eng-012-v2.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-012-final-quality-v1.test.mjs
      - name: Run 450-authority and 20,000-seed audit
        run: node artifacts/api-server/dist/english-v1/eng-012-final-quality-v1.test.mjs
      - name: Compile ENG-012 Question Studio integration audit
        run: pnpm --dir artifacts/api-server exec esbuild src/question-studio/engines/language-v1-eng012-adapter-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-012-question-studio-v1.test.mjs
      - name: Run ENG-012 Question Studio integration audit
        run: node artifacts/api-server/dist/english-v1/eng-012-question-studio-v1.test.mjs
