name: Validate SAP E1 E2 Exhaustiveness

on:
  pull_request:
    branches:
      - audit/sap-exhaustiveness-2026-08
      - feat/sap-e1-r2-exam-remodel
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle CP004 E1 authority
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-004/e1-authority-v2.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/sap-e1-cp004.mjs
      - name: Run CP004 E1 authority
        run: node artifacts/api-server/dist/quant-v4/sap-e1-cp004.mjs
      - name: Bundle CP005 E1 authority
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-005/e1-authority.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/sap-e1-cp005.mjs
      - name: Run CP005 E1 authority
        run: node artifacts/api-server/dist/quant-v4/sap-e1-cp005.mjs
      - name: Bundle CP007 E1 authority
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-007/e1-authority.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/sap-e1-cp007.mjs
      - name: Run CP007 E1 authority
        run: node artifacts/api-server/dist/quant-v4/sap-e1-cp007.mjs
      - name: Bundle CP010 E1 authority
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-002/SAP-CP-010/e1-authority.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/sap-e1-cp010.mjs
      - name: Run CP010 E1 authority
        run: node artifacts/api-server/dist/quant-v4/sap-e1-cp010.mjs
      - name: Bundle E1 R2 exam authority
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-E1-R2-AUTHORITY-v2.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/sap-e1-r2.mjs
      - name: Run E1 R2 exam authority
        run: node artifacts/api-server/dist/quant-v4/sap-e1-r2.mjs
      - name: Bundle E1 R2 bank presentation authority V4
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-E1-R2-PRESENTATION-AUTHORITY.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/sap-e1-r2-presentation.mjs
      - name: Run E1 R2 bank presentation authority V4
        run: node artifacts/api-server/dist/quant-v4/sap-e1-r2-presentation.mjs
      - name: Bundle E1 R2 release calibration authority V4
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-E1-R2-RELEASE-CALIBRATION-V4.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/sap-e1-r2-release-calibration.mjs
      - name: Run E1 R2 release calibration authority V4
        run: node artifacts/api-server/dist/quant-v4/sap-e1-r2-release-calibration.mjs
      - name: Bundle E2 CP011 CP012 authority
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-E2-AUTHORITY.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/sap-e2.mjs
      - name: Run E2 CP011 CP012 authority
        run: node artifacts/api-server/dist/quant-v4/sap-e2.mjs
      - name: Bundle E2 CP012 release-realism authority
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-E2-RELEASE-AUTHORITY.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/sap-e2-release.mjs
      - name: Run E2 CP012 release-realism authority
        run: node artifacts/api-server/dist/quant-v4/sap-e2-release.mjs
      - name: Bundle E2 R3 exam-depth authority
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-E2-R3-EXAM-DEPTH-AUTHORITY.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/sap-e2-r3-depth.mjs
      - name: Run E2 R3 exam-depth authority
        run: node artifacts/api-server/dist/quant-v4/sap-e2-r3-depth.mjs

# E1/E2 remain review-only; no lifecycle changes are performed by this workflow.
