name: Refine PNL CP-006 Final Audit

on:
  pull_request:
    paths:
      - ".github/workflows/refine-pnl-cp006-final-audit.yml"

permissions:
  contents: write

jobs:
  refine-cp006-final-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout feature source
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-cp006-explanation-diversity

      - name: Refine CP-006 conclusions and resolved-issue metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-006/cp006-dynamic-runtime.ts")
          runtime = runtime_path.read_text()

          old_manufacturing = '''      return `${prefix} ${purpose}, raw material ${cp006FormatMoney(request.rawMaterialCost)} plus labour ${cp006FormatMoney(request.labourCost)} gives prime cost ${prime}; factory overhead is ${overhead}. Add packaging ${cp006FormatMoney(request.packagingCost)}, deduct scrap ${cp006FormatMoney(request.scrapRecovery)}, and net cost is ${net} for ${request.outputQuantity} units. The requested result is ${answer}.`;'''
          new_manufacturing = '''      const conclusion =
                qlId === "PNL-QL-167"
                  ? `Net production cost is ${answer}.`
                  : qlId === "PNL-QL-168"
                    ? `Manufacturing cost per finished unit is ${answer}.`
                    : `The manufacturing table therefore gives unit cost ${answer}.`;
              return `${prefix} ${purpose}, raw material ${cp006FormatMoney(request.rawMaterialCost)} plus labour ${cp006FormatMoney(request.labourCost)} gives prime cost ${prime}; factory overhead is ${overhead}. Add packaging ${cp006FormatMoney(request.packagingCost)}, deduct scrap ${cp006FormatMoney(request.scrapRecovery)}, and net cost is ${net} for ${request.outputQuantity} units. ${conclusion}`;'''
          if old_manufacturing in runtime:
              runtime = runtime.replace(old_manufacturing, new_manufacturing, 1)
          elif "Manufacturing cost per finished unit" not in runtime:
              raise SystemExit("CP-006 manufacturing conclusion anchor not found")

          old_margin = '''      return `${prefix} ${purpose} starts with actual revenue ${cp006FormatMoney(request.actualRevenue)} minus break-even revenue ${cp006FormatMoney(request.breakEvenRevenue)} = ${amount}. The requested result is ${answer}.`;'''
          new_margin = '''      const conclusion =
                qlId === "PNL-QL-176"
                  ? `The money surplus above break-even is ${answer}.`
                  : `Relative to actual revenue, the margin of safety is ${answer}.`;
              return `${prefix} ${purpose} starts with actual revenue ${cp006FormatMoney(request.actualRevenue)} minus break-even revenue ${cp006FormatMoney(request.breakEvenRevenue)} = ${amount}. ${conclusion}`;'''
          if old_margin in runtime:
              runtime = runtime.replace(old_margin, new_margin, 1)
          elif "The money surplus above break-even" not in runtime:
              raise SystemExit("CP-006 margin conclusion anchor not found")

          runtime_path.write_text(runtime)

          audit_path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-001-english-editorial-audit.ts")
          audit = audit_path.read_text()
          old_issue = '''  knownOpenIssue: {
                issueNumber: 262,
                qlId: "PNL-QL-070",
                code: "KNOWN-DS-LEAD-LEAKAGE",
              },'''
          new_issue = '''  resolvedIssueRegression: {
                issueNumber: 262,
                qlId: "PNL-QL-070",
                code: "DS-LEAD-LEAKAGE",
                status: "RESOLVED_AND_MONITORED",
              },'''
          if old_issue in audit:
              audit = audit.replace(old_issue, new_issue, 1)
          elif "resolvedIssueRegression" not in audit:
              raise SystemExit("Resolved issue metadata anchor not found")
          audit_path.write_text(audit)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Format refined sources
        run: |
          pnpm exec prettier --write \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-006/cp006-dynamic-runtime.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-001-english-editorial-audit.ts

      - name: Run CP-006 and chapter proofs
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-006/cp006-dynamic-runtime.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-006/.cp006-dynamic-runtime.test.mjs \
            2>&1 | tee pnl-cp006-final-audit.log
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-006/.cp006-dynamic-runtime.test.mjs \
            2>&1 | tee -a pnl-cp006-final-audit.log
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-001-english-editorial-audit.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.pnl-001-english-editorial-audit.mjs \
            2>&1 | tee -a pnl-cp006-final-audit.log
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.pnl-001-english-editorial-audit.mjs \
            2>&1 | tee -a pnl-cp006-final-audit.log

      - name: Commit proven refinements
        run: |
          if git diff --quiet -- \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-006/cp006-dynamic-runtime.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-001-english-editorial-audit.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-006/cp006-dynamic-runtime.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/pnl-001-english-editorial-audit.ts
          git commit -m "fix(pnl): finalise CP-006 editorial audit"
          git push origin HEAD:feat/pnl-001-cp006-explanation-diversity

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnl-cp006-final-audit-refinement
          path: |
            pnl-cp006-final-audit.log
            dist/quant-v4/pnl-001-english-editorial-audit
          if-no-files-found: error
          retention-days: 14
