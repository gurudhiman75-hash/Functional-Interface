name: Validate SAP-CP-010 300-question full review

on:
  pull_request:
    branches:
      - freeze/sap-cp009-exam-standard-v3-approved
      - feat/sap-cp009-multiplicative-approximation
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-002/SAP-CP-010/**
      - .github/workflows/validate-sap-cp010-full-review.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sap-cp010-full-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle certified review authority
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-002/SAP-CP-010/full-review-certified.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/sap-cp010-full-review-authority.test.mjs
      - name: Run certified review authority
        run: node artifacts/api-server/dist/quant-v4/sap-cp010-full-review-authority.test.mjs
      - name: Bundle certified review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-002/SAP-CP-010/generate-full-review-certified.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/sap-cp010-generate-review.mjs
      - name: Generate review files
        run: node artifacts/api-server/dist/quant-v4/sap-cp010-generate-review.mjs
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: sap-cp010-300-question-full-review
          path: artifacts/api-server/dist/quant-v4/sap-cp010-review/**
          if-no-files-found: error
          retention-days: 30
