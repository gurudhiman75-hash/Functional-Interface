name: Probability contextual follow-up

on:
  push:
    branches:
      - feat/prb-probability-end-to-end
    paths:
      - ".github/workflows/prb-contextual-followup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contextual-follow-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Polish manual-review findings
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"Could not patch {label}")
              return text.replace(old, new, 1)

          explanation_path = Path("artifacts/api-server/src/quant-v4/topics/Probability/shared/explanation-renderer.ts")
          explanation = explanation_path.read_text()
          explanation = replace_once(
              explanation,
              '''    const ways = choose(tosses, heads);
              return [
                `Choose which ${heads} of the ${tosses} tosses are heads: C(${tosses},${heads}) = ${ways} ways.`,
                `There are ${2 ** tosses} H/T sequences. ${probabilityCalculation(ways, 2 ** tosses, solved.exactDisplay)}`,
              ];''',
              '''    const ways = choose(tosses, heads);
              const selectionReason = heads === 1
                ? `Choose the toss on which the head appears: C(${tosses},1) = ${ways} ways.`
                : `Choose the ${heads} tosses that show heads: C(${tosses},${heads}) = ${ways} ways.`;
              return [
                selectionReason,
                `There are ${2 ** tosses} H/T sequences. ${probabilityCalculation(ways, 2 ** tosses, solved.exactDisplay)}`,
              ];''',
              "coin head-count explanation",
          )
          explanation = replace_once(
              explanation,
              '    const range = k === 1 ? "0 or 1 head" : `0, 1, ..., ${k} heads`;',
              '    const range = k === 1 ? "0 or 1 head" : k === 2 ? "0, 1 or 2 heads" : `0 to ${k} heads`;',
              "at-most-heads range",
          )
          explanation = replace_once(
              explanation,
              '    if (mode === "findSuitProbability") reason = `A ${suit} suit contains 13 cards.`;',
              '    if (mode === "findSuitProbability") reason = `There are 13 ${suit}s in a standard deck.`;',
              "card suit explanation",
          )
          explanation_path.write_text(explanation)

          stem_path = Path("artifacts/api-server/src/quant-v4/topics/Probability/shared/student-facing-renderer.ts")
          stem = stem_path.read_text()
          stem = replace_once(
              stem,
              'const noun = (count: number, one: string, many = `${one}s`) => count === 1 ? one : many;\n',
              'const noun = (count: number, one: string, many = `${one}s`) => count === 1 ? one : many;\nconst article = (word: string) => /^[aeiou]/i.test(word) ? "an" : "a";\n',
              "indefinite article helper",
          )
          stem = replace_once(
              stem,
              '''  if (entry.solveMode === "findSuitProbability") return `a ${suit}`;
              if (entry.solveMode === "findColourProbability") return `a ${colour} card`;
              if (entry.solveMode === "findFaceCardProbability") return "a face card";
              if (entry.solveMode === "findUnionCardEventProbability") return `a ${rank} or a ${suit}`;
              if (entry.solveMode === "findComplementCardProbability") return `not a ${suit}`;
              if (entry.solveMode === "findCardPropertyIntersection") return `the ${rank} of ${suit}s`;
              return `a ${rank}`;''',
              '''  if (entry.solveMode === "findSuitProbability") return `${article(suit)} ${suit}`;
              if (entry.solveMode === "findColourProbability") return `${article(colour)} ${colour} card`;
              if (entry.solveMode === "findFaceCardProbability") return "a face card";
              if (entry.solveMode === "findUnionCardEventProbability") return `${article(rank)} ${rank} or ${article(suit)} ${suit}`;
              if (entry.solveMode === "findComplementCardProbability") return `not ${article(suit)} ${suit}`;
              if (entry.solveMode === "findCardPropertyIntersection") return `the ${rank} of ${suit}s`;
              return `${article(rank)} ${rank}`;''',
              "card article rendering",
          )
          stem = replace_once(
              stem,
              '    case "findExactlyKSuccessSmallCase": { const k = num(p, "k"); return `A fair coin is tossed ${trials} times. What is the probability of getting exactly ${k} ${noun(k, "head")}?`; }',
              '    case "findExactlyKSuccessSmallCase": { const k = num(p, "k"), count = k === 1 ? "one" : String(k); return `A fair coin is tossed ${trials} times. What is the probability of getting exactly ${count} ${noun(k, "head")}?`; }',
              "exactly-k coin stem",
          )
          stem = replace_once(
              stem,
              '    case "findAtMostKSuccessSmallCase": { const k = num(p, "k"); return `A fair coin is tossed ${trials} times. What is the probability of getting at most ${k} ${noun(k, "head")}?`; }',
              '    case "findAtMostKSuccessSmallCase": { const k = num(p, "k"), count = k === 1 ? "one" : String(k); return `A fair coin is tossed ${trials} times. What is the probability of getting at most ${count} ${noun(k, "head")}?`; }',
              "at-most-k coin stem",
          )
          stem = replace_once(
              stem,
              '    case "findCoinHeadCountProbability": { const heads = num(p, "heads"); return `A fair coin is tossed ${num(p, "tosses")} times. What is the probability of getting exactly ${heads} ${noun(heads, "head")}?`; }',
              '    case "findCoinHeadCountProbability": { const heads = num(p, "heads"), count = heads === 1 ? "one" : String(heads); return `A fair coin is tossed ${num(p, "tosses")} times. What is the probability of getting exactly ${count} ${noun(heads, "head")}?`; }',
              "coin head-count stem",
          )
          stem = replace_once(
              stem,
              '    case "findSelectionProbabilityUsingCombination": { const exact = num(p, "exactRed", 1); return `A bag contains ${red} red and ${blue} blue balls. ${draw} balls are drawn together without replacement. What is the probability that exactly ${exact} of the drawn ${noun(draw, "ball")} ${exact === 1 ? "is" : "are"} red?`; }',
              '    case "findSelectionProbabilityUsingCombination": { const exact = num(p, "exactRed", 1), count = exact === 1 ? "one" : String(exact); return `A bag contains ${red} red and ${blue} blue balls. ${draw} balls are drawn together without replacement. What is the probability that exactly ${count} of the drawn ${noun(draw, "ball")} ${exact === 1 ? "is" : "are"} red?`; }',
              "exact-composition urn stem",
          )
          stem_path.write_text(stem)

          validator_path = Path("artifacts/api-server/src/quant-v4/topics/Probability/shared/validator.ts")
          validator = validator_path.read_text()
          validator = replace_once(
              validator,
              '    /\\bit does not happen\\b/i,\n    /\\bsatisf(?:y|ies) A(?:\\s+or\\s+B|\\s+and\\s+B)?\\b/i,',
              '    /\\bit does not happen\\b/i,\n    /\\ba ace\\b/i,\n    /\\bsatisf(?:y|ies) A(?:\\s+or\\s+B|\\s+and\\s+B)?\\b/i,',
              "article validation",
          )
          validator_path.write_text(validator)
          PY

      - name: TypeScript proof
        run: >-
          npx -y -p typescript@5.6.3 tsc
          --noEmit
          --target ES2020
          --module commonjs
          --moduleResolution node
          --resolveJsonModule
          --esModuleInterop
          --skipLibCheck
          artifacts/api-server/src/quant-v4/topics/Probability/exam-readiness.test.ts

      - name: PRB-001 proof
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/package.test.ts

      - name: PRB-002 proof
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/package.test.ts

      - name: Exam-readiness proof
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/exam-readiness.test.ts

      - name: Question Studio proof
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/question-studio-profile.test.ts

      - name: Regenerate review evidence
        run: |
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/generate-exam-review.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/generate-comprehensive-questions.ts

      - name: Verify review evidence
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          rows = []
          for package_id, expected in (("PRB-001", 75), ("PRB-002", 60)):
              path = Path(f"artifacts/api-server/src/quant-v4/topics/Probability/{package_id}/human-review-en.csv")
              current = list(csv.DictReader(path.open()))
              if len(current) != expected:
                  raise SystemExit(f"{package_id}: expected {expected}, found {len(current)}")
              rows.extend(current)
          if len({(" ".join(row["stem"].lower().split()), row["answer"]) for row in rows}) != 135:
              raise SystemExit("Visible question uniqueness failed.")
          banned = ("a ace", "choose which 1", "a spade suit", "a heart suit", "a club suit", "a diamond suit")
          for row in rows:
              if row["validationValid"] != "true":
                  raise SystemExit(f"Invalid row: {row['qlId']}")
              combined = f"{row['stem']} {row['explanation']}".lower()
              if any(phrase in combined for phrase in banned):
                  raise SystemExit(f"Manual-review wording defect remains in {row['qlId']}: {combined}")
              if row["explanation"].startswith(("Favourable outcomes =", "Total outcomes =", "Total possible outcomes =")):
                  raise SystemExit(f"Generic explanation: {row['qlId']}")
          markdown = Path("artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-COMPREHENSIVE-QUESTIONS-AND-EXPLANATIONS.md").read_text()
          if markdown.count("\n#### Question ") != 135:
              raise SystemExit("Markdown does not contain 135 questions.")
          PY
          git diff --check

      - name: Upload revised Markdown
        uses: actions/upload-artifact@v4
        with:
          name: probability-contextual-questions-v4
          path: artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-COMPREHENSIVE-QUESTIONS-AND-EXPLANATIONS.md
          if-no-files-found: error
          retention-days: 7

      - name: Commit corrected source and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/quant-v4/topics/Probability/shared/explanation-renderer.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/shared/student-facing-renderer.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/shared/validator.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/human-review-en.csv \
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/human-review-en.csv \
            artifacts/api-server/src/quant-v4/topics/Probability/editorial-remediation-report.md \
            artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-COMPREHENSIVE-QUESTIONS-AND-EXPLANATIONS.md
          git diff --cached --check
          git commit -m "docs(probability): polish contextual stems and explanations [skip ci]"
          git push
