name: Quant V4 CGL whole-section frequency stability P2

on:
  push:
    branches:
      - audit/quant-v4-cgl-whole-section-frequency-stability-p2
    paths:
      - ".github/workflows/quant-v4-cgl-whole-section-frequency-stability-p2.yml"
      - "artifacts/api-server/src/quant-v4/quality/**"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/quality/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-v4-cgl-whole-section-frequency-stability-p2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  whole-section-frequency-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle stability proofs
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/quality
          for test in \
            quant-v4-whole-section-frequency-calibration-p2.test \
            quant-v4-cgl-2023-07-25-s4-full-quant-section-wave8-p2.test \
            quant-v4-whole-section-frequency-stability-p2.test
          do
            pnpm --dir artifacts/api-server exec esbuild \
              "src/quant-v4/quality/${test}.ts" \
              --bundle --platform=node --format=esm --packages=external \
              --outfile="dist/quant-v4/quality/${test}.mjs"
          done
      - name: Run evidence-floor regression
        working-directory: artifacts/api-server
        run: |
          node dist/quant-v4/quality/quant-v4-whole-section-frequency-calibration-p2.test.mjs
          node dist/quant-v4/quality/quant-v4-cgl-2023-07-25-s4-full-quant-section-wave8-p2.test.mjs
      - name: Run stability audit proof
        working-directory: artifacts/api-server
        run: node dist/quant-v4/quality/quant-v4-whole-section-frequency-stability-p2.test.mjs
      - name: Patch hygiene
        run: git diff --check
