name: One-shot PNL CP-001 100-percent distractor guard

on:
  push:
    branches:
      - feat/pnl-001-cp001-dynamic-runtime
    paths:
      - ".github/workflows/tmp-pnl-cp001-guard-100-profit.yml"

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-cp001-dynamic-runtime

      - name: Guard the subtractive-base misconception at 100 percent profit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-001/cp001-dynamic-runtime.ts")
          source = path.read_text()
          old = '''    case "PROFIT_CP_TO_MARGIN_SP": {
                if (result.mode !== request.mode) break;
                candidates.push(
                  percentCandidate(request.profitPercent, "Treats cost-price profit rate as the same margin on selling price."),
                  percentCandidate(
                    multiplyRational(
                      divideRational(request.profitPercent, subtractRational(rational(100), request.profitPercent)),
                      rational(100),
                    ),
                    "Subtracts the profit rate from 100 while changing the percentage base."),
                  percentCandidate(subtractRational(rational(100), request.profitPercent), "Reports the complement of the profit rate."),
                );
                break;
              }'''
          new = '''    case "PROFIT_CP_TO_MARGIN_SP": {
                if (result.mode !== request.mode) break;
                const subtractiveBase = subtractRational(rational(100), request.profitPercent);
                const subtractiveBaseCandidate =
                  compareRational(subtractiveBase, rational(0)) === 0
                    ? divideRational(request.profitPercent, rational(100))
                    : multiplyRational(
                        divideRational(request.profitPercent, subtractiveBase),
                        rational(100),
                      );
                candidates.push(
                  percentCandidate(request.profitPercent, "Treats cost-price profit rate as the same margin on selling price."),
                  percentCandidate(
                    subtractiveBaseCandidate,
                    compareRational(subtractiveBase, rational(0)) === 0
                      ? "Reports the decimal profit multiplier as though it were already a percentage."
                      : "Subtracts the profit rate from 100 while changing the percentage base."),
                  percentCandidate(subtractRational(rational(100), request.profitPercent), "Reports the complement of the profit rate."),
                );
                break;
              }'''
          if source.count(old) != 1:
              raise SystemExit(f"Expected one PROFIT_CP_TO_MARGIN_SP block, found {source.count(old)}")
          path.write_text(source.replace(old, new))
          PY

      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-001/cp001-dynamic-runtime.ts
          git commit -m "fix(pnl): guard 100-percent profit misconception"
          git push origin HEAD:feat/pnl-001-cp001-dynamic-runtime
