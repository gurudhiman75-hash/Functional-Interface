name: Apply admin release corrections

on:
  push:
    branches:
      - replace-admin-with-new-panel
    paths:
      - scripts/finalize-admin-release.mjs
      - .github/workflows/apply-admin-release-corrections.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replace-admin-with-new-panel
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply release corrections
        run: node scripts/finalize-admin-release.mjs
      - name: Remove temporary diagnostics and one-time tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f diagnostics/admin-ui-typecheck.txt
          rm scripts/finalize-admin-release.mjs
          rm .github/workflows/apply-admin-release-corrections.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/admin-app/src/pages/content/QuestionStudioLivePage.tsx artifacts/examtree/src/pages/login.tsx artifacts/api-server/src/routes/admin-question-studio.ts diagnostics scripts .github/workflows
          git commit -m 'Finalize admin authentication and review workflow'
          git push origin HEAD:replace-admin-with-new-panel
