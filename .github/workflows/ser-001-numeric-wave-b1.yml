name: Validate SER-001 numeric Wave B1

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-NUMERIC-WAVE-B1/**
      - .github/workflows/ser-001-numeric-wave-b1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-numeric-wave-b1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-numeric-wave-b1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/numeric-wave-b1

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Run Wave B1 higher-order and recurrence audit
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-NUMERIC-WAVE-B1
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/numeric-wave-b1
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/ser-numeric-wave-b1.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-numeric-wave-b1.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-numeric-wave-b1.test.mjs") \
            | tee "$EVIDENCE/wave-b1-audit.json"

      - name: Run post-Wave-B1 chapter gap audit
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-NUMERIC-WAVE-B1
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/numeric-wave-b1
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/ser-post-wave-b1-gap-audit.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-post-wave-b1-gap-audit.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-post-wave-b1-gap-audit.test.mjs") \
            | tee "$EVIDENCE/post-wave-b1-gap-audit.json"

      - name: Generate exact English review pack
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-NUMERIC-WAVE-B1
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/numeric-wave-b1
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/export-review.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/export-wave-b1-review.mjs"
          (cd artifacts/api-server && node "$OUT/export-wave-b1-review.mjs") \
            > "$EVIDENCE/ser-numeric-wave-b1-en-IN-review.md"
          cp "artifacts/api-server/$ROOT/ser-numeric-wave-b1-report.md" \
            "$EVIDENCE/ser-numeric-wave-b1-report.md"

      - name: Upload Wave B1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-numeric-wave-b1
          path: artifacts/api-server/dist/reasoning-v1/ser-001/numeric-wave-b1
          if-no-files-found: error
          retention-days: 30
