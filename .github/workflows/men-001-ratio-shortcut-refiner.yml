name: MEN-001 Ratio Shortcut Refiner

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-001-ratio-shortcut-refiner.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Make ratio shortcut parameter-aware
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-comprehension-refiner.ts")
          text = path.read_text()

          marker = 'function shortcutFor(mode: string) {'
          helper = '''function ratioFormsRightTriangle(parameters: Men001Parameters) {
            const ratios = [
              parameters.values.ratioA,
              parameters.values.ratioB,
              parameters.values.ratioC,
            ].filter((value): value is number => typeof value === "number");
            if (ratios.length !== 3) return false;
            const [a, b, c] = [...ratios].sort((left, right) => left - right);
            return a ** 2 + b ** 2 === c ** 2;
          }

          function shortcutFor(parameters: Men001Parameters) {
            const mode = parameters.solveMode;'''
          if marker not in text:
              raise SystemExit("shortcutFor marker not found")
          text = text.replace(marker, helper, 1)

          old = '''  if (/Heron|TriangleAreaFromSideRatio/.test(mode)) {
              return "Check whether the three actual sides form a Pythagorean Triplet. If they do, use the two shorter sides in A = 1/2 bh; otherwise complete Heron's formula.";
            }'''
          new = '''  if (/TriangleAreaFromSideRatio/.test(mode)) {
              return ratioFormsRightTriangle(parameters)
                ? "Pythagorean Triplet spotted: after scaling the ratio, use the two shorter sides directly in A = 1/2 bh."
                : "This side ratio is not right-angled, so keep the three actual sides and complete Heron's formula without using a base-height shortcut.";
            }
            if (/Heron/.test(mode)) {
              return "Test the largest side with a² + b² = c². If the triangle is not right-angled, complete Heron's formula from the three sides.";
            }'''
          if old not in text:
              raise SystemExit("Heron shortcut block not found")
          text = text.replace(old, new, 1)

          text = text.replace(
              'function refineShortcut(section: ShortcutSection, mode: string): ShortcutSection {\n  if (!section.paragraphs.some(isGenericShortcut)) return section;\n  return { ...section, paragraphs: [shortcutFor(mode)] };\n}',
              'function refineShortcut(section: ShortcutSection, parameters: Men001Parameters): ShortcutSection {\n  if (!section.paragraphs.some(isGenericShortcut)) return section;\n  return { ...section, paragraphs: [shortcutFor(parameters)] };\n}',
              1,
          )
          text = text.replace(
              'if (section.kind === "EXAM_SHORTCUT") return refineShortcut(section, parameters.solveMode);',
              'if (section.kind === "EXAM_SHORTCUT") return refineShortcut(section, parameters);',
              1,
          )
          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-comprehension-refiner.ts
          git commit -m "fix(mensuration): keep ratio shortcuts state-valid"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
