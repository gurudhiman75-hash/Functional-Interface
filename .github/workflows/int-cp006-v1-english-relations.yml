name: Validate INT-CP-006 V1 English Relations

on:
  pull_request:
    paths:
      - ".github/workflows/int-cp006-v1-english-relations.yml"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp006-si-ci-relations-runtime-v1.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp006-si-ci-relations-runtime-v2.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp006-si-ci-relations-runtime-v3-final.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp006-si-ci-relations-v1-audit.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp006-si-ci-relations-v1-review-export.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/INT-CP-006/**"
  workflow_dispatch:

jobs:
  validate-int-cp006-v1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle CP006 English audit
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp006-si-ci-relations-v1-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/int-cp006-v1-audit.mjs
      - name: Run CP006 English audit
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp006-v1-audit.mjs 2>&1 | tee dist/quant-v4/int-cp006-v1-audit.log
      - name: Bundle CP006 review exporter
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp006-si-ci-relations-v1-review-export.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/int-cp006-v1-review-export.mjs
      - name: Export CP006 English review
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp006-v1-review-export.mjs 2>&1 | tee dist/quant-v4/int-cp006-v1-review-export.log
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Verify CP006 markers
        run: |
          grep -q 'PASS_INT_CP006_V1_ENGLISH_RELATION_AUDIT' artifacts/api-server/dist/quant-v4/int-cp006-v1-audit.log
          grep -q 'PASS_INT_CP006_V1_ENGLISH_REVIEW_EXPORT' artifacts/api-server/dist/quant-v4/int-cp006-v1-review-export.log
      - name: Upload CP006 review evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-cp006-v1-english-review
          path: |
            artifacts/api-server/dist/quant-v4/INT-CP-006-V1-ENGLISH-REVIEW.md
            artifacts/api-server/dist/quant-v4/int-cp006-v1-audit.log
            artifacts/api-server/dist/quant-v4/int-cp006-v1-review-export.log
          if-no-files-found: error
