name: Validate ANA-001 multilingual completion

on:
  push:
    branches:
      - feat/ana-001-multilingual-completion
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/**
      - .github/workflows/ana-001-multilingual-completion.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/**
      - .github/workflows/ana-001-multilingual-completion.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-ana-001-multilingual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cp003-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Capture ANA-CP-003 English regression
        run: |
          mkdir -p multilingual-diagnostics
          set +e
          pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-003/ana-cp-003.test.ts > multilingual-diagnostics/ana-cp-003-english.log 2>&1
          status=$?
          set -e
          echo "$status" > multilingual-diagnostics/ana-cp-003-english.status
      - name: Upload ANA-CP-003 English diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ana-cp-003-english-diagnostic
          path: multilingual-diagnostics/
          if-no-files-found: error
      - name: Enforce ANA-CP-003 English regression
        run: test "$(cat multilingual-diagnostics/ana-cp-003-english.status)" = "0"
