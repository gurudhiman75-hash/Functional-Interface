name: Validate ANA-001 multilingual completion

on:
  push:
    branches:
      - feat/ana-001-multilingual-completion
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/**
      - .github/workflows/ana-001-multilingual-completion.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/**
      - .github/workflows/ana-001-multilingual-completion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multilingual-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Strict TypeScript check for chapter completion authority
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --skipLibCheck \
            --types node \
            src/reasoning-v1/topics/Analogy/ANA-001/ana-001-multilingual-completion.test.ts

      - name: Verify chapter multilingual coverage and Punjabi wording policy
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ana-001-multilingual-completion.test.ts

      - name: Validate ANA-CP-001 and ANA-CP-002 Hindi/Punjabi runtime
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ana-001-localized-runtime.test.ts

      - name: Capture ANA-CP-003 Hindi/Punjabi diagnostic
        run: |
          mkdir -p multilingual-diagnostics
          set +e
          pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-003/ana-cp-003-localized.test.ts > multilingual-diagnostics/ana-cp-003-localized.log 2>&1
          status=$?
          set -e
          echo "$status" > multilingual-diagnostics/ana-cp-003-localized.status

      - name: Upload ANA-CP-003 multilingual diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ana-cp-003-multilingual-diagnostic
          path: multilingual-diagnostics/
          if-no-files-found: error

      - name: Enforce ANA-CP-003 Hindi/Punjabi runtime
        run: test "$(cat multilingual-diagnostics/ana-cp-003-localized.status)" = "0"

      - name: Validate ANA-CP-004 Hindi/Punjabi runtime
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-004/ana-cp-004-localized.test.ts

      - name: Validate ANA-CP-005 Hindi/Punjabi runtime
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-005/ana-cp-005-localized.test.ts

      - name: Validate ANA-CP-006 Hindi/Punjabi runtime
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-006/ana-cp-006-localized.test.ts

      - name: Validate ANA-CP-007 Hindi/Punjabi runtime
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-007/ana-cp-007-localized.test.ts

      - name: Validate ANA-CP-008 Hindi/Punjabi runtime
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/ana-cp-008-localized.test.ts
