name: Probability context consistency v3

on:
  push:
    branches:
      - feat/prb-probability-end-to-end
    paths:
      - "scripts/prb_context_scope_fix.py"
      - ".github/workflows/prb-context-consistency-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply context-consistency source changes
        run: |
          python scripts/prb_context_consistency_patch.py
          python scripts/prb_context_scope_fix.py

      - name: Probability TypeScript integration
        run: >-
          npx -y -p typescript@5.6.3 tsc
          --noEmit
          --target ES2020
          --module commonjs
          --moduleResolution node
          --resolveJsonModule
          --esModuleInterop
          --skipLibCheck
          artifacts/api-server/src/quant-v4/topics/Probability/exam-readiness.test.ts

      - name: Complete Probability proof
        run: |
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/package.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/package.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/exam-readiness.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/question-studio-profile.test.ts

      - name: Regenerate and audit review evidence
        run: |
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/generate-exam-review.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/generate-comprehensive-questions.ts
          python artifacts/api-server/src/quant-v4/topics/Probability/exam-depth-review-audit.py
          git diff --check

      - name: Upload revised review Markdown
        uses: actions/upload-artifact@v4
        with:
          name: probability-context-consistent-review-v3
          path: |
            artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-REVIEW-QUESTIONS-AND-EXPLANATIONS.md
            artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-COMPREHENSIVE-QUESTIONS-AND-EXPLANATIONS.md
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified source and evidence
        run: |
          targets=(
            artifacts/api-server/src/quant-v4/topics/Probability/shared/exam-depth-remodeler.ts
            artifacts/api-server/src/quant-v4/topics/Probability/shared/validator.ts
            artifacts/api-server/src/quant-v4/topics/Probability/exam-depth-review-audit.py
            artifacts/api-server/src/quant-v4/topics/Probability/generate-exam-review.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/human-review-en.csv
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/human-review-en.csv
            artifacts/api-server/src/quant-v4/topics/Probability/editorial-remediation-report.md
            artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-COMPREHENSIVE-QUESTIONS-AND-EXPLANATIONS.md
            artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-REVIEW-QUESTIONS-AND-EXPLANATIONS.md
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${targets[@]}"
          git diff --cached --check
          git commit -m "fix(probability): keep stem and explanation contexts aligned"
          git push
