name: Validate NUM-CP-007 completion and multilingual freeze

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/**
      - .github/workflows/num-002-cp007-completion-freeze.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp007-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp007-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle and run CP-007 discovery regressions
        shell: bash
        run: |
          set -euo pipefail
          for wave in 01 02 03 04; do
            pnpm --dir artifacts/api-server exec esbuild \
              src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-007/wave${wave}/runtime-authority.test.ts \
              --bundle --platform=node --format=esm \
              --outfile=dist/quant-v4/num-002-cp007-wave${wave}-completion-regression.mjs
            node artifacts/api-server/dist/quant-v4/num-002-cp007-wave${wave}-completion-regression.mjs
          done

      - name: Bundle post-Wave-04 source-saturation regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-007/post-wave04-authority-proposal.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-002-cp007-completion-source-gap.mjs

      - name: Run post-Wave-04 source-saturation regression
        run: node artifacts/api-server/dist/quant-v4/num-002-cp007-completion-source-gap.mjs

      - name: Bundle permanent allocation proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-007/permanent/allocation.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-002-cp007-permanent-allocation.test.mjs

      - name: Run permanent allocation proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-002-cp007-permanent-allocation.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-002-cp007-permanent-allocation.log

      - name: Bundle chapter allocation registry proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/design/number-system-current-allocation-registry.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/number-system-current-allocation-registry.test.mjs

      - name: Run chapter allocation registry proof
        run: node artifacts/api-server/dist/quant-v4/number-system-current-allocation-registry.test.mjs

      - name: Bundle permanent runtime proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-007/permanent/runtime-proof.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-002-cp007-permanent-runtime.test.mjs

      - name: Run permanent runtime proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-002-cp007-permanent-runtime.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-002-cp007-permanent-runtime.log

      - name: Bundle English freeze regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-007/permanent/english-freeze-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-002-cp007-english-freeze-audit.mjs

      - name: Run English freeze regression
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-002-cp007-english-freeze-audit.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-002-cp007-english-freeze-audit.log

      - name: Bundle Hindi Punjabi mathematical parity proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-007/localization/runtime-parity.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-002-cp007-hi-pa-parity.test.mjs

      - name: Run Hindi Punjabi mathematical parity proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-002-cp007-hi-pa-parity.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-002-cp007-hi-pa-parity.log

      - name: Bundle Hindi Punjabi editorial audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-007/localization/editorial-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-002-cp007-hi-pa-editorial-audit.mjs

      - name: Run Hindi Punjabi editorial audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-002-cp007-hi-pa-editorial-audit.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-002-cp007-hi-pa-editorial-audit.log

      - name: Bundle permanent English review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-007/permanent/review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-002-cp007-permanent-review-export.mjs

      - name: Generate permanent English review pack
        working-directory: artifacts/api-server
        run: node dist/quant-v4/num-002-cp007-permanent-review-export.mjs

      - name: Bundle multilingual review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-007/localization/review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-002-cp007-hi-pa-review-export.mjs

      - name: Generate multilingual review pack
        working-directory: artifacts/api-server
        run: node dist/quant-v4/num-002-cp007-hi-pa-review-export.mjs

      - name: Upload CP-007 completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: num-002-cp007-completion-multilingual-freeze
          path: |
            artifacts/api-server/dist/quant-v4/num-002-cp007-permanent-allocation.log
            artifacts/api-server/dist/quant-v4/num-002-cp007-permanent-runtime.log
            artifacts/api-server/dist/quant-v4/num-002-cp007-english-freeze-audit.log
            artifacts/api-server/dist/quant-v4/num-002-cp007-hi-pa-parity.log
            artifacts/api-server/dist/quant-v4/num-002-cp007-hi-pa-editorial-audit.log
            artifacts/api-server/dist/quant-v4/num-002-cp007-permanent-english-review.json
            artifacts/api-server/dist/quant-v4/num-002-cp007-permanent-english-review.csv
            artifacts/api-server/dist/quant-v4/num-002-cp007-permanent-english-review.md
            artifacts/api-server/dist/quant-v4/num-002-cp007-hi-pa-review.json
            artifacts/api-server/dist/quant-v4/num-002-cp007-hi-pa-review.csv
            artifacts/api-server/dist/quant-v4/num-002-cp007-hi-pa-review.md
          if-no-files-found: warn
          retention-days: 14
