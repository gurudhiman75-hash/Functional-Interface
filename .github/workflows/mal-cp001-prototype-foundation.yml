name: Validate MAL-CP-001 discovery foundation

on:
  pull_request:
    branches:
      - design/mal-001-end-to-end-discovery
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/**
      - .github/workflows/mal-cp001-prototype-foundation.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-mal-cp001-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-mal-cp001-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle MAL-CP-001 15-prototype deterministic proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-cp001-discovery-proof.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/mal-001-cp001-discovery-proof.test.mjs
      - name: Run MAL-CP-001 15-prototype deterministic proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/mal-001-cp001-discovery-proof.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/mal-001-cp001-discovery-proof.log
      - name: Bundle MAL-CP-001 discovery audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-cp001-discovery-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/mal-001-cp001-discovery-audit.mjs
      - name: Run MAL-CP-001 discovery audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/mal-001-cp001-discovery-audit.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/mal-001-cp001-discovery-audit.log
      - name: Bundle MAL-CP-001 discovery review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-cp001-discovery-review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/mal-001-cp001-discovery-review-export.mjs
      - name: Generate MAL-CP-001 60-question review pack
        working-directory: artifacts/api-server
        run: node dist/quant-v4/mal-001-cp001-discovery-review-export.mjs
      - name: Upload MAL-CP-001 discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mal-cp001-discovery-foundation
          path: |
            artifacts/api-server/dist/quant-v4/mal-001-cp001-discovery-proof.log
            artifacts/api-server/dist/quant-v4/mal-001-cp001-discovery-audit.log
            artifacts/api-server/dist/quant-v4/mal-001-cp001-discovery-review.json
            artifacts/api-server/dist/quant-v4/mal-001-cp001-discovery-review.md
          if-no-files-found: error
          retention-days: 7
