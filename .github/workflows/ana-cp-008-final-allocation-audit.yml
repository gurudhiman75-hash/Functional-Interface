name: Validate ANA-CP-008 final allocation proposal

on:
  push:
    branches:
      - feat/ana-cp008-final-allocation-audit
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/**"
      - ".github/workflows/ana-cp-008-final-allocation-audit.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/**"
      - ".github/workflows/ana-cp-008-final-allocation-audit.yml"

permissions:
  contents: read

jobs:
  validate-final-allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle and run allocation proof
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/provisional-final-allocation-audit.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/.provisional-final-allocation-audit.mjs \
            2>&1 | tee ana-cp-008-final-allocation-audit.log
          node artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/.provisional-final-allocation-audit.mjs \
            2>&1 | tee -a ana-cp-008-final-allocation-audit.log

      - name: Upload allocation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ana-cp-008-final-allocation-audit
          path: ana-cp-008-final-allocation-audit.log
          if-no-files-found: error
          retention-days: 7
