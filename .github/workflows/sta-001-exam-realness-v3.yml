name: Validate STA-001 exam realness V3

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/**
      - .github/workflows/sta-001-exam-realness-v3.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-sta-001-exam-realness-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exam-realness-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Strict STA TypeScript check
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowImportingTsExtensions \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/Statement-and-Assumption/STA-001 -name '*.ts' -print)

      - name: Replay immutable English and QL001-QL003 freezes
        run: |
          node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/english-freeze-proof.test.ts
          node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql001-freeze-proof.test.ts
          node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql002-freeze-proof.test.ts
          node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql003-freeze-proof.test.ts

      - name: Prove QL004 V2 semantic/editorial baseline
        env:
          STA_QL004_LOCALIZATION_V2_CASES_PER_LOCALE: 768
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql004-editorial-v2-proof.test.ts

      - name: Prove STA exam realness V3 and four-assumption banking format
        env:
          STA_QL004_EXAM_REALNESS_CASES_PER_LOCALE: 768
          STA_FOUR_ASSUMPTION_CASES_PER_LOCALE: 320
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/exam-realness-proof-v3.test.ts

      - name: Generate STA exam-realness V3 review pack
        env:
          STA_EXAM_REALNESS_V3_REVIEW_OUTPUT_DIR: /tmp/sta-001-exam-realness-v3-review
          STA_QL004_EXAM_REALNESS_EXAMPLES_PER_AUTHORITY: 2
          STA_FOUR_ASSUMPTION_REVIEW_EXAMPLES_PER_LOCALE: 12
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/exam-realness-review-export-v3.ts

      - name: Build production API
        working-directory: artifacts/api-server
        run: pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: sta-001-exam-realness-v3-review
          path: /tmp/sta-001-exam-realness-v3-review/**
          if-no-files-found: error
          retention-days: 14
