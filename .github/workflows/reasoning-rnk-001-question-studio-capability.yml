name: Validate RNK-001 Question Studio Capability Registration

on:
  push:
    branches:
      - feat/rnk-001-question-studio-capability-registration
    paths:
      - artifacts/api-server/src/reasoning-v1/question-studio-registry.ts
      - artifacts/api-server/src/reasoning-v1/question-studio-registry.test.ts
      - artifacts/api-server/src/routes/admin-question-studio-reasoning-gate.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/**
      - .github/workflows/reasoning-rnk-001-question-studio-capability.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rnk-question-studio-capability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery-only-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove discovery-only registry and generation block
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/question-studio-registry.test.ts \
            | tee rnk-question-studio-capability-test.log

      - name: Build API server with RNK capability wiring
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server build \
            | tee rnk-question-studio-api-build.log

      - name: Reproduce frozen CP-004 permanent projection
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-permanent-runtime-v1-gates.test.ts \
            rnk-question-studio-capability-freeze-proof \
            | tee rnk-question-studio-capability-freeze-proof.log

      - name: Upload capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnk-001-question-studio-capability-evidence
          path: |
            rnk-question-studio-capability-test.log
            rnk-question-studio-api-build.log
            rnk-question-studio-capability-freeze-proof.log
            rnk-question-studio-capability-freeze-proof
          if-no-files-found: ignore
          retention-days: 14
