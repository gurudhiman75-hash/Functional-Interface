name: Validate Notes Studio NS-013 Source Pack Proposals

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/notes-studio/source-pack-proposal.ts
      - artifacts/api-server/src/notes-studio/source-pack-proposal.test.ts
      - artifacts/api-server/src/routes/admin-notes-studio-source-pack-proposals.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/admin-app/src/pages/content/NotesStudioSourcePackProposalPage.tsx
      - artifacts/admin-app/src/pages/content/NotesStudioHubPage.tsx
      - docs/notes-studio-ns013-source-pack-proposals.md

permissions:
  contents: read

concurrency:
  group: notes-studio-ns013-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-notes-studio-source-pack-proposals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run NS-013 proposal contracts
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/source-pack-proposal.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-source-pack-proposal.test.mjs
          node artifacts/api-server/dist/notes-studio-source-pack-proposal.test.mjs

      - name: Verify proposal governance boundaries
        run: |
          grep -F 'externalNetworkSearch: false' artifacts/api-server/src/routes/admin-notes-studio-source-pack-proposals.ts
          grep -F 'automaticAttachment: false' artifacts/api-server/src/routes/admin-notes-studio-source-pack-proposals.ts
          grep -F 'editorApprovedAttachment: true' artifacts/api-server/src/routes/admin-notes-studio-source-pack-proposals.ts
          grep -F 'automaticEvidenceGeneration: false' artifacts/api-server/src/routes/admin-notes-studio-source-pack-proposals.ts
          grep -F 'requiresExplicitEditorApply: true' artifacts/api-server/src/notes-studio/source-pack-proposal.ts
          grep -F 'adminNotesStudioSourcePackProposalsRouter' artifacts/api-server/src/routes/index.ts
          grep -F 'Pack proposals' artifacts/admin-app/src/pages/content/NotesStudioHubPage.tsx
          grep -F 'recomputes the proposal server-side at apply time' docs/notes-studio-ns013-source-pack-proposals.md
          if grep -F 'INSERT INTO content.source_documents' artifacts/api-server/src/routes/admin-notes-studio-source-pack-proposals.ts; then exit 1; fi
          if grep -F 'fetch(' artifacts/api-server/src/routes/admin-notes-studio-source-pack-proposals.ts; then exit 1; fi
          if grep -F 'extracted_text AS' artifacts/api-server/src/routes/admin-notes-studio-source-pack-proposals.ts; then exit 1; fi

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Typecheck admin app
        run: pnpm --dir artifacts/admin-app typecheck
