name: Validate RNK-001 CP-004 Question Studio Renderer

on:
  push:
    branches:
      - feat/rnk-001-cp004-question-studio-renderer
    paths:
      - artifacts/admin-app/src/features/question-studio/QuestionExplanationDisclosure.tsx
      - artifacts/admin-app/src/features/question-studio/QuestionExplanationDisclosure.test.tsx
      - artifacts/admin-app/src/features/question-studio/QuestionExplanationDisclosure.integration.test.ts
      - artifacts/admin-app/src/pages/content/QuestionStudioLivePage.tsx
      - artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/**
      - .github/workflows/reasoning-rnk-001-cp004-question-studio-renderer.yml
  pull_request:
    paths:
      - artifacts/admin-app/src/features/question-studio/QuestionExplanationDisclosure.tsx
      - artifacts/admin-app/src/features/question-studio/QuestionExplanationDisclosure.test.tsx
      - artifacts/admin-app/src/features/question-studio/QuestionExplanationDisclosure.integration.test.ts
      - artifacts/admin-app/src/pages/content/QuestionStudioLivePage.tsx
      - artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/**
      - .github/workflows/reasoning-rnk-001-cp004-question-studio-renderer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rnk-cp004-question-studio-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native disclosure and integration contracts
        run: |
          set -o pipefail
          pnpm --dir artifacts/admin-app exec vitest run \
            src/features/question-studio/QuestionExplanationDisclosure.test.tsx \
            src/features/question-studio/QuestionExplanationDisclosure.integration.test.ts \
            | tee rnk-cp004-renderer-tests.log

      - name: Enforce safe renderer surface
        run: |
          grep -F 'QuestionExplanationDisclosure' artifacts/admin-app/src/pages/content/QuestionStudioLivePage.tsx
          grep -F 'data-required-width-targets' artifacts/admin-app/src/features/question-studio/QuestionExplanationDisclosure.tsx
          grep -F 'aria-controls' artifacts/admin-app/src/features/question-studio/QuestionExplanationDisclosure.tsx
          grep -F 'aria-expanded' artifacts/admin-app/src/features/question-studio/QuestionExplanationDisclosure.tsx
          grep -F 'sm:ml-16' artifacts/admin-app/src/pages/content/QuestionStudioLivePage.tsx
          ! grep -F 'dangerouslySetInnerHTML' artifacts/admin-app/src/features/question-studio/QuestionExplanationDisclosure.tsx

      - name: Typecheck complete admin application
        run: |
          set -o pipefail
          pnpm run typecheck:admin | tee rnk-cp004-admin-typecheck.log

      - name: Build complete admin application
        run: |
          set -o pipefail
          pnpm run build:admin | tee rnk-cp004-admin-build.log

      - name: Reproduce frozen CP-004 permanent projection
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-permanent-runtime-v1-gates.test.ts \
            rnk-cp004-renderer-freeze-proof \
            | tee rnk-cp004-freeze-proof.log

      - name: Upload renderer validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnk-001-cp004-question-studio-renderer-evidence
          path: |
            rnk-cp004-renderer-tests.log
            rnk-cp004-admin-typecheck.log
            rnk-cp004-admin-build.log
            rnk-cp004-freeze-proof.log
            rnk-cp004-renderer-freeze-proof
          retention-days: 14
