name: Apply RNK CP-004 Question Studio renderer

on:
  push:
    branches:
      - feat/rnk-001-cp004-question-studio-renderer
    paths:
      - .github/rnk-cp004-renderer-trigger

permissions:
  contents: write

jobs:
  apply-renderer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/rnk-001-cp004-question-studio-renderer
          fetch-depth: 0

      - name: Apply narrow renderer patch
        run: node scripts/apply-rnk-cp004-question-studio-renderer.mjs

      - name: Commit renderer integration and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/admin-app/src/pages/content/QuestionStudioLivePage.tsx
          git rm .github/rnk-cp004-renderer-trigger
          git rm scripts/apply-rnk-cp004-question-studio-renderer.mjs
          git rm .github/workflows/rnk-cp004-apply-question-studio-renderer.yml
          git commit -m "feat(admin): integrate RNK CP004 explanation renderer"
          git push origin HEAD:feat/rnk-001-cp004-question-studio-renderer
