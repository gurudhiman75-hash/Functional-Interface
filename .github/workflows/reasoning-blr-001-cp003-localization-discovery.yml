name: Reasoning BLR-001 CP-003 Multilingual Candidate

on:
  push:
    branches:
      - feat/blr-001-cp003-multilingual
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/**"
      - ".github/workflows/reasoning-blr-001-cp003-localization-discovery.yml"
  workflow_dispatch:

jobs:
  prove-multilingual-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Regress CP-003 English freeze
        run: |
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-final-discovery-freeze.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-permanent-runtime.test.ts
      - name: Prove Hindi Punjabi semantic parity
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/localization/cp003-localizer.test.ts
      - name: Typecheck admin application
        run: pnpm --dir artifacts/admin-app typecheck
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
