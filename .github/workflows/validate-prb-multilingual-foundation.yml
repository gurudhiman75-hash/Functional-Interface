name: Validate Probability multilingual foundation

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Probability/**"
      - ".github/workflows/validate-prb-multilingual-foundation.yml"
  push:
    branches:
      - "feat/prb-probability-*"
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Probability/**"
      - ".github/workflows/validate-prb-multilingual-foundation.yml"

jobs:
  validate-probability-multilingual-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate fail-closed multilingual manifest
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/multilingual-foundation.test.ts
      - name: Validate ML-02 native language primitives
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-language-primitives.test.ts
      - name: Validate ML-03 PRB-001 native editorial draft
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/native-editorial.test.ts
      - name: Validate ML-04 PRB-002 native editorial draft
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/native-editorial.test.ts
      - name: Validate ML-05 multilingual runtime parity
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/multilingual-runtime.test.ts
      - name: Preserve English Probability readiness
        run: |
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/question-studio-profile.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/exam-readiness.test.ts
