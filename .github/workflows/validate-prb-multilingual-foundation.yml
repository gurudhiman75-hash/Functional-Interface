name: Validate Probability multilingual foundation

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Probability/**"
      - "artifacts/api-server/src/routes/admin-question-studio-probability.ts"
      - "artifacts/admin-app/src/features/question-studio/probability-review-api.ts"
      - "artifacts/admin-app/src/pages/content/QuestionStudioProbabilityReviewPanel.tsx"
      - "artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx"
      - ".github/workflows/validate-prb-multilingual-foundation.yml"
  push:
    branches:
      - "feat/prb-probability-*"
      - "fix/prb-native-editorial-*"
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Probability/**"
      - "artifacts/api-server/src/routes/admin-question-studio-probability.ts"
      - "artifacts/admin-app/src/features/question-studio/probability-review-api.ts"
      - "artifacts/admin-app/src/pages/content/QuestionStudioProbabilityReviewPanel.tsx"
      - "artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx"
      - ".github/workflows/validate-prb-multilingual-foundation.yml"

jobs:
  validate-probability-multilingual-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate fail-closed multilingual manifest
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/multilingual-foundation.test.ts
      - name: Validate ML-02 native language primitives
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-language-primitives.test.ts
      - name: Validate ML-03 PRB-001 native editorial draft
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/native-editorial.test.ts
      - name: Validate ML-04 PRB-002 native editorial draft
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/native-editorial.test.ts
      - name: Validate ML-05 multilingual runtime parity
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/multilingual-runtime.test.ts
      - name: Validate native math event labels
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-math-event-labels.test.ts
      - name: Reject English math event labels in native runtime
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-math-event-label-runtime.test.ts
      - name: Validate ML-06 native human-review boundary
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-review-adapter.test.ts
      - name: Validate ML-06 native editorial quality wave01
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-editorial-quality-regression.test.ts
      - name: Validate ML-06 native editorial quality wave02
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-editorial-quality-wave02.test.ts
      - name: Validate ML-06 native editorial quality wave03
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-editorial-quality-wave03.test.ts
      - name: Validate ML-06 native editorial quality wave04
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-editorial-quality-wave04.test.ts
      - name: Preserve English Probability readiness
        run: |
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/question-studio-profile.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/exam-readiness.test.ts
