name: Validate Punjabi Forward Port CP002

on:
  pull_request:
    branches:
      - feature/punjabi-v1-forward-port
    paths:
      - "artifacts/api-server/src/punjabi-v1/**"
      - ".github/workflows/punjabi-forward-port-cp002.yml"
  workflow_dispatch:

jobs:
  validate-cp002:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bundle CP002 semantic proof
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/punjabi-v1/packages/PUN-001/checkpoints/CP002/CP002.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/punjabi-forward-port-cp002.test.mjs
      - name: Run CP002 semantic proof
        working-directory: artifacts/api-server
        run: node dist/punjabi-forward-port-cp002.test.mjs
      - name: Build API server
        working-directory: artifacts/api-server
        run: pnpm run build
