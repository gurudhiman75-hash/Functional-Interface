name: Audit SER-001 CP-007 chapter

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-B/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-C/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUDIT/**
      - .github/workflows/ser-001-cp007-chapter-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-cp007-chapter-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-cp007:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/cp007-chapter-audit

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Run chapter-wide gap audit
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUDIT
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-chapter-audit
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/ser-cp-007-chapter-audit.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-chapter-audit.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-chapter-audit.test.mjs") \
            | tee "$EVIDENCE/audit.json"
          grep -q 'PASS_SER_CP007_CHAPTER_WIDE_GAP_AUDIT_FREEZE_BLOCKED' \
            "$EVIDENCE/audit.json"

      - name: Export authority matrix
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUDIT
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-chapter-audit
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/export-authority-matrix.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/export-cp007-authority-matrix.mjs"
          (cd artifacts/api-server && node "$OUT/export-cp007-authority-matrix.mjs") \
            > "$EVIDENCE/ser-cp-007-authority-matrix.md"
          cp "artifacts/api-server/$ROOT/ser-cp-007-chapter-gap-audit.md" \
            "$EVIDENCE/ser-cp-007-chapter-gap-audit.md"

      - name: Upload chapter audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-cp007-chapter-audit
          path: artifacts/api-server/dist/reasoning-v1/ser-001/cp007-chapter-audit
          if-no-files-found: error
          retention-days: 30
