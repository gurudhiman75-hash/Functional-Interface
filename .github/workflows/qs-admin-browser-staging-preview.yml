name: Validate isolated QS admin browser staging preview
on:
  pull_request:
    branches: [New-main]
    paths:
      - 'artifacts/api-server/src/app.ts'
      - 'scripts/deploy-qs-admin-api-isolated-staging.sh'
      - 'scripts/build-qs-admin-preview.sh'
      - 'tests/qs-admin-browser-staging-deploy-contract.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qs-admin-browser-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check guarded scripts and browser staging topology
        run: |
          bash -n scripts/deploy-qs-admin-api-isolated-staging.sh
          bash -n scripts/build-qs-admin-preview.sh
          node --test tests/qs-admin-browser-staging-deploy-contract.test.mjs
