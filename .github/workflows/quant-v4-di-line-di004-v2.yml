name: Quant V4 Data Interpretation line DI-004 V2

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/**"
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/visuals/line-svg.ts"
  workflow_dispatch:

concurrency:
  group: quant-v4-di004-line-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  line-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Review lifecycle guard
        run: |
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/line-v2-types.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/line-set-v2.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/independent-verifier-v2.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/permanent-ql-registry.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/permanent-question-generator.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/question-studio-adapter.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/question-studio-integration.test.ts
          grep -q 'questionStudioDiscoverable: true' artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/permanent-ql-registry.ts
          grep -q 'ENGLISH_REVIEW_APPROVED' artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/permanent-ql-registry.ts
          ! grep -R 'questionBankWritable: true\|testEligibility: "ELIGIBLE"\|testEligible: true\|mockTestEligible: true\|publiclyPublishable: true\|automaticStudentPublication: true\|productionReleaseAuthorized: true' \
            artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/line-v2-types.ts \
            artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/line-set-v2.ts \
            artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/permanent-ql-registry.ts \
            artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/question-studio-adapter.ts
      - name: DI-004 V2 deterministic diversity and independent proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/line-set-v2.test.ts
      - name: Legacy DI-004 regression
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/line-set.test.ts
      - name: Question Studio permanent controlled-review integration
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/question-studio-integration.test.ts
      - name: DI-004 visual answerability proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/visual-answerability.test.ts
      - name: Export review packs
        run: |
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/export-review-v2.ts DI-004-REVIEW-V2.md
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-004/export-review-v2-html.ts DI-004-REVIEW-V2.html
          grep -q 'data-line-chart="true"' DI-004-REVIEW-V2.html
          grep -q 'data-point-value-labels="true"' DI-004-REVIEW-V2.html
          grep -q 'data-series-a-value="0"' DI-004-REVIEW-V2.html
          grep -q 'data-series-b-value="0"' DI-004-REVIEW-V2.html
          grep -q 'DI-004 Line Graph — Visual Review' DI-004-REVIEW-V2.html
      - uses: actions/upload-artifact@v4
        with:
          name: di-004-line-review-v2
          path: |
            DI-004-REVIEW-V2.html
            DI-004-REVIEW-V2.md
          if-no-files-found: error
          retention-days: 30
      - name: API server build
        run: pnpm --filter @workspace/api-server build
      - name: Patch hygiene
        run: git diff --check
