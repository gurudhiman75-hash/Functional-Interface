name: Validate NUM-CP-014 through Wave03 saturation

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-014/**"
      - ".github/workflows/num-cp014-through-wave03-saturation-v1.yml"
  workflow_dispatch:

concurrency:
  group: num-cp014-through-wave03-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-num-cp014-through-wave03:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle CP014 discovery audits
        shell: bash
        run: |
          set -euo pipefail
          root="src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-014"
          pnpm --dir artifacts/api-server exec esbuild "$root/wave01/runtime.test.ts" --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp014-w1-runtime.mjs
          pnpm --dir artifacts/api-server exec esbuild "$root/wave01/independent-ablation.test.ts" --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp014-w1-independent.mjs
          pnpm --dir artifacts/api-server exec esbuild "$root/wave01/redundancy-rejection.test.ts" --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp014-w1-negative.mjs
          pnpm --dir artifacts/api-server exec esbuild "$root/wave02/runtime.test.ts" --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp014-w2-runtime.mjs
          pnpm --dir artifacts/api-server exec esbuild "$root/wave02/independent-answer-impact.test.ts" --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp014-w2-independent.mjs
          pnpm --dir artifacts/api-server exec esbuild "$root/wave02/solution-class-admission.test.ts" --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp014-w2-admission.mjs
          pnpm --dir artifacts/api-server exec esbuild "$root/wave03/runtime.test.ts" --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp014-w3-runtime.mjs
          pnpm --dir artifacts/api-server exec esbuild "$root/wave03/independent-saturation.test.ts" --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp014-w3-independent.mjs
          pnpm --dir artifacts/api-server exec esbuild "$root/wave03/redundancy-negative-control.test.ts" --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp014-w3-negative.mjs
          pnpm --dir artifacts/api-server exec esbuild "$root/wave03/runtime-v2.test.ts" --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp014-w3-v2-runtime.mjs
          pnpm --dir artifacts/api-server exec esbuild "$root/wave03/independent-v2.test.ts" --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp014-w3-v2-independent.mjs

      - name: Run Wave01 necessity and negative controls
        run: |
          set -euo pipefail
          node artifacts/api-server/dist/quant-v4/num-cp014-w1-runtime.mjs
          node artifacts/api-server/dist/quant-v4/num-cp014-w1-independent.mjs
          node artifacts/api-server/dist/quant-v4/num-cp014-w1-negative.mjs

      - name: Run Wave02 inverse and answer-impact audits
        run: |
          set -euo pipefail
          node artifacts/api-server/dist/quant-v4/num-cp014-w2-runtime.mjs
          node artifacts/api-server/dist/quant-v4/num-cp014-w2-independent.mjs
          node artifacts/api-server/dist/quant-v4/num-cp014-w2-admission.mjs

      - name: Run Wave03 representation and answer-semantic saturation
        run: |
          set -euo pipefail
          node artifacts/api-server/dist/quant-v4/num-cp014-w3-runtime.mjs
          node artifacts/api-server/dist/quant-v4/num-cp014-w3-independent.mjs
          node artifacts/api-server/dist/quant-v4/num-cp014-w3-negative.mjs
          node artifacts/api-server/dist/quant-v4/num-cp014-w3-v2-runtime.mjs
          node artifacts/api-server/dist/quant-v4/num-cp014-w3-v2-independent.mjs

      - name: Build API server
        run: pnpm --dir artifacts/api-server build
