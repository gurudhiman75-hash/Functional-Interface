name: One-shot PNL CP-001 rate-fraction boundary guard

on:
  push:
    branches:
      - feat/pnl-001-cp001-dynamic-runtime
    paths:
      - ".github/workflows/tmp-pnl-cp001-guard-rate-fraction.yml"

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-cp001-dynamic-runtime

      - name: Guard the opposite-base fraction misconception at 100 percent profit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-001/cp001-dynamic-runtime.ts")
          source = path.read_text()
          old = '''    case "RATE_TO_FRACTION": {
                if (result.mode !== request.mode) break;
                const costBaseFraction = divideRational(request.ratePercent, rational(100));
                candidates.push(
                  fractionCandidate(costBaseFraction, "Uses the fraction of cost price instead of selling price."),
                  fractionCandidate(rational(result.amountFraction.denominator, result.amountFraction.numerator), "Takes the reciprocal of the required fraction."),
                  fractionCandidate(
                    request.direction === "PROFIT"
                      ? divideRational(costBaseFraction, subtractRational(rational(1), costBaseFraction))
                      : divideRational(costBaseFraction, addRational(rational(1), costBaseFraction)),
                    "Uses the opposite selling-price base conversion."),
                );
                break;
              }'''
          new = '''    case "RATE_TO_FRACTION": {
                if (result.mode !== request.mode) break;
                const costBaseFraction = divideRational(request.ratePercent, rational(100));
                const oppositeBaseDenominator =
                  request.direction === "PROFIT"
                    ? subtractRational(rational(1), costBaseFraction)
                    : addRational(rational(1), costBaseFraction);
                const oppositeBaseCandidate =
                  compareRational(oppositeBaseDenominator, rational(0)) === 0
                    ? divideRational(costBaseFraction, rational(100))
                    : divideRational(costBaseFraction, oppositeBaseDenominator);
                candidates.push(
                  fractionCandidate(costBaseFraction, "Uses the fraction of cost price instead of selling price."),
                  fractionCandidate(rational(result.amountFraction.denominator, result.amountFraction.numerator), "Takes the reciprocal of the required fraction."),
                  fractionCandidate(
                    oppositeBaseCandidate,
                    compareRational(oppositeBaseDenominator, rational(0)) === 0
                      ? "Divides the decimal rate by 100 a second time."
                      : "Uses the opposite selling-price base conversion."),
                );
                break;
              }'''
          if source.count(old) != 1:
              raise SystemExit(f"Expected one RATE_TO_FRACTION block, found {source.count(old)}")
          path.write_text(source.replace(old, new))
          PY

      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-001/cp001-dynamic-runtime.ts
          git commit -m "fix(pnl): guard 100-percent rate-to-fraction distractor"
          git push origin HEAD:feat/pnl-001-cp001-dynamic-runtime
