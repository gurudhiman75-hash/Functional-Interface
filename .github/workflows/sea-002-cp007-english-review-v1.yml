name: Validate SEA-002 CP007 English review candidate V1

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp007/**"
      - ".github/workflows/sea-002-cp007-english-review-v1.yml"
  workflow_dispatch:

concurrency:
  group: sea-002-cp007-english-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-sea-002-cp007-english-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle production uniqueness regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp007/production-caselet-v1.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/sea-002-cp007-production-regression.mjs

      - name: Run production uniqueness regression
        run: node artifacts/api-server/dist/reasoning-v1/sea-002-cp007-production-regression.mjs

      - name: Bundle exam-natural stem audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp007/exam-real-stem-v2.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/sea-002-cp007-exam-real-stem-v2.mjs

      - name: Run exam-natural stem audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/sea-002-cp007-exam-real-stem-v2.mjs \
            2>&1 | tee artifacts/api-server/dist/reasoning-v1/sea-002-cp007-exam-real-stem-v2.log

      - name: Bundle English surface audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp007/english-review-v1.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/sea-002-cp007-english-surface-v1.mjs

      - name: Run English surface audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/sea-002-cp007-english-surface-v1.mjs \
            2>&1 | tee artifacts/api-server/dist/reasoning-v1/sea-002-cp007-english-surface-v1.log

      - name: Bundle English review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp007/english-review-export-v1.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/sea-002-cp007-english-review-export-v1.mjs

      - name: Generate English learner review
        run: node artifacts/api-server/dist/reasoning-v1/sea-002-cp007-english-review-export-v1.mjs

      - name: Re-prove CP006 completion authority
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp006/cp006-completion-authority.test.ts

      - name: Upload CP007 English review evidence
        uses: actions/upload-artifact@v4
        with:
          name: sea-002-cp007-english-review-v1
          path: |
            artifacts/api-server/dist/reasoning-v1/sea-002-cp007-exam-real-stem-v2.log
            artifacts/api-server/dist/reasoning-v1/sea-002-cp007-english-surface-v1.log
            artifacts/api-server/dist/reasoning-v1/sea-002-cp007-english-review-v1.md
          if-no-files-found: error
          retention-days: 30
