name: Validate SEA-001 multilingual freeze

on:
  push:
    branches:
      - feat/sea-001-wave5-saturation-audits
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/**
      - .github/workflows/sea-001-multilingual-freeze.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/**
      - .github/workflows/sea-001-multilingual-freeze.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-sea-001-multilingual-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multilingual-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-prove approved Hindi/Punjabi explanation-parity candidate
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/sea-001-localized-review-candidate-proof.test.ts
      - name: Prove SEA-001 multilingual freeze and delivery locks
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/sea-001-multilingual-freeze-proof.test.ts
      - name: Re-prove permanent QL and English freeze
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/sea-001-permanent-allocation-freeze-proof.test.ts

  strict-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowImportingTsExtensions \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/shared/constraint-core src/reasoning-v1/topics/SeatingArrangement/SEA-001 -name '*.ts' -print)
