name: QS four-engine review-only policy
on:
  pull_request:
    branches: [New-main]
    paths:
      - 'artifacts/api-server/src/question-studio/review-only-rollout-policy.mjs'
      - 'tests/qs-review-only-rollout-policy.test.mjs'
  workflow_dispatch:
concurrency:
  group: qs-four-engine-rollout-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline-policy-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deny-by-default policy (no cloud credentials)
        run: node --test tests/qs-review-only-rollout-policy.test.mjs
