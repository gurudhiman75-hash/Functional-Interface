name: Validate GEO-RIV-001 CP009 Review

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp009-*"
      - "artifacts/api-server/src/knowledge-v1/indian-geography/rivers-drainage/GEO-RIV-001-CP009-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geo-riv-001-cp009-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp009:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run CP009 qualification gates
        run: |
          mkdir -p artifacts/api-server/dist/geography
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp009-validator.test.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/geography/geo-riv-001-cp009-validator.test.mjs
          node artifacts/api-server/dist/geography/geo-riv-001-cp009-validator.test.mjs
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
