name: Validate Question Studio Cloud Tasks receiver identity
on:
  pull_request:
    branches: [New-main]
    paths:
      - 'artifacts/api-server/src/question-studio/async-cloud-tasks-oidc.ts'
      - 'artifacts/api-server/src/question-studio/async-cloud-tasks-oidc.test.ts'
      - 'tests/qs-cloud-tasks-oidc-contract.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qs-task-oidc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure identity verification is strict and unmounted
        run: node --test tests/qs-cloud-tasks-oidc-contract.test.mjs
      - name: Install locked API dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile --filter @workspace/api-server...
      - name: Run fake-key signature and token rejection tests
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/question-studio/async-cloud-tasks-oidc.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=dist/question-studio/async-cloud-tasks-oidc.test.mjs
          node artifacts/api-server/dist/question-studio/async-cloud-tasks-oidc.test.mjs
      - name: Patch hygiene
        run: git diff --check
