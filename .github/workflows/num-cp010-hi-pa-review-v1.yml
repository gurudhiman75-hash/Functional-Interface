name: Validate NUM-CP-010 Hindi Punjabi review candidate

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-010/**"
      - ".github/workflows/num-cp010-hi-pa-review-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: num-cp010-hi-pa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp010-hi-pa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle permanent English regression
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-010/permanent-runtime.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp010-permanent-regression.mjs
      - name: Run permanent English regression
        run: node artifacts/api-server/dist/quant-v4/num-cp010-permanent-regression.mjs
      - name: Bundle localization parity proof
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-010/localization/runtime-parity.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp010-hi-pa-parity.mjs
      - name: Run localization parity proof
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-cp010-hi-pa-parity.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-cp010-hi-pa-parity.log
      - name: Bundle multilingual review export
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-010/localization/review-export.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/num-cp010-hi-pa-review-export.mjs
      - name: Generate multilingual review
        working-directory: artifacts/api-server
        run: node dist/quant-v4/num-cp010-hi-pa-review-export.mjs
      - name: Upload review evidence
        uses: actions/upload-artifact@v4
        with:
          name: num-cp010-hi-pa-review-v1
          path: |
            artifacts/api-server/dist/quant-v4/num-cp010-hi-pa-parity.log
            artifacts/api-server/dist/quant-v4/num-cp010-hi-pa-review/audit.json
            artifacts/api-server/dist/quant-v4/num-cp010-hi-pa-review/leakage.json
            artifacts/api-server/dist/quant-v4/num-cp010-hi-pa-review/review.json
            artifacts/api-server/dist/quant-v4/num-cp010-hi-pa-review/review.md
          if-no-files-found: error
          retention-days: 14
