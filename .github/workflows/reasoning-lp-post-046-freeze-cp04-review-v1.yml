name: Reasoning Logic Puzzles Post-046 Freeze and CP04 Review V1

on:
  pull_request:
    branches: [New-main]
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-post-046-localization-freeze-v1.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-post-046-localization-freeze-v1.test.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/question-studio-v6.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-cp04-counterfactual-v2.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-cp04-counterfactual-v2.test.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-cp04-review-export-v1.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reasoning-lp-post-046-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove-freeze-and-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove localization freeze authorities and Question Studio V6
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-post-046-localization-freeze-v1.test.ts
      - name: Prove CP04 V2 structural difficulty and semantics
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-cp04-counterfactual-v2.test.ts
      - name: Export CP04 V2 human review pack
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-cp04-review-export-v1.ts lp-cp04-human-review-v2 9 lp-cp04-counterfactual-review-v2.md > /dev/null
      - name: Upload CP04 V2 review pack
        uses: actions/upload-artifact@v4
        with:
          name: lp-cp04-counterfactual-review-v2
          path: lp-cp04-counterfactual-review-v2.md
