name: Validate English CP011 V1

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/english-v1/**
      - artifacts/admin-app/src/pages/content/QuestionStudioEnglishReviewPanel.tsx
  push:
    branches:
      - New-main
    paths:
      - artifacts/api-server/src/english-v1/**
      - artifacts/admin-app/src/pages/content/QuestionStudioEnglishReviewPanel.tsx
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-cp011-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp011-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile CP011 V1 stress test
        run: |
          mkdir -p artifacts/api-server/dist/english-v1
          pnpm --dir artifacts/api-server exec esbuild src/english-v1/tests/eng-001-cp011-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-001-cp011-v1.test.mjs
      - name: Run CP011 V1 generation and validation matrix
        run: node artifacts/api-server/dist/english-v1/eng-001-cp011-v1.test.mjs
      - name: Compile approved CP011 V1 review exporter test
        run: pnpm --dir artifacts/api-server exec esbuild src/english-v1/tests/eng-001-cp011-v1-review.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-001-cp011-v1-review.test.mjs
      - name: Regenerate approved CP011 V1 review artifact
        run: node artifacts/api-server/dist/english-v1/eng-001-cp011-v1-review.test.mjs
      - name: Verify exact approved CP011 V1 review SHA-256
        run: |
          echo "0dbaaaa1228f1cdd96f58031c70c6ca3115e7839722f80da83fe2a7bc22f399f  dist/english-v1/ENG-001-CP011-REVIEW-V1.md" | sha256sum --check --strict
      - name: Upload approved CP011 V1 review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENG-001-CP011-REVIEW-V1
          path: dist/english-v1/ENG-001-CP011-REVIEW-V1.md
          if-no-files-found: error
      - name: Compile CP011 Question Studio integration test
        run: pnpm --dir artifacts/api-server exec esbuild src/question-studio/engines/language-v1-eng001-cp011-adapter-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/language-v1-eng001-cp011-adapter-v1.test.mjs
      - name: Run CP011 Question Studio review-only integration test
        run: node artifacts/api-server/dist/english-v1/language-v1-eng001-cp011-adapter-v1.test.mjs
      - name: Compile CP010 Question Studio regression
        run: pnpm --dir artifacts/api-server exec esbuild src/question-studio/engines/language-v1-eng001-cp010-adapter-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/language-v1-eng001-cp010-adapter-v1-regression.test.mjs
      - name: Run CP010 Question Studio regression
        run: node artifacts/api-server/dist/english-v1/language-v1-eng001-cp010-adapter-v1-regression.test.mjs
      - name: Compile CP010 generator regression
        run: pnpm --dir artifacts/api-server exec esbuild src/english-v1/tests/eng-001-cp010-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-001-cp010-v1-regression.test.mjs
      - name: Re-run approved CP010 generator regression
        run: node artifacts/api-server/dist/english-v1/eng-001-cp010-v1-regression.test.mjs
      - name: Compile shared Question Studio engine-registry test
        run: pnpm --dir artifacts/api-server exec esbuild src/question-studio/engine-registry.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/engine-registry.test.mjs
      - name: Run shared Question Studio engine-registry test
        run: node artifacts/api-server/dist/english-v1/engine-registry.test.mjs
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Typecheck admin app
        run: pnpm --dir artifacts/admin-app exec tsc -p tsconfig.json --noEmit
