name: Validate BTD-001 CP002 Source Saturation V2

on:
  push:
    branches:
      - feature/btd-cp002-source-saturation-v2
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-002/**'
  pull_request:
    branches:
      - discovery/btd-001-source-bound-foundation-v1
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-002/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btd-cp002-source-saturation-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-btd-cp002-source-saturation-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run BTD CP002 source-saturation audit v2
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-002/btd-cp002-source-saturation-v2-audit.ts | tee btd-cp002-source-saturation-v2.log
          grep -q 'PASS_BTD_CP002_SOURCE_SATURATION_AUDIT_V2' btd-cp002-source-saturation-v2.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Record exact validation head
        shell: bash
        run: |
          echo "validated_head=$(git rev-parse HEAD)" | tee btd-cp002-source-saturation-v2-head.log
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: btd-cp002-source-saturation-v2
          path: |
            btd-cp002-source-saturation-v2.log
            btd-cp002-source-saturation-v2-head.log
          retention-days: 30
