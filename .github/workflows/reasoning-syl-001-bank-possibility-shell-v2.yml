name: Validate SYL-001 Banking possibility shell V2
on:
  pull_request:
    branches: [audit/syl-001-source-profile-freeze, feat/syl-001-learner-v4, New-main]
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-shell-v2.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-shell-v2-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/SYL-001-BANKING-POSSIBILITY-SOURCE-CORRECTION-V2.md
      - .github/workflows/reasoning-syl-001-bank-possibility-shell-v2.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-syl-001-bank-possibility-shell-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-bank-possibility-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle V2 semantic audit
        run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-shell-v2-audit.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/syl-001-bank-possibility-shell-v2-audit.test.mjs
      - name: Run V2 semantic audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-shell-v2-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-shell-v2-audit.log
      - name: Upload V2 semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syl-001-bank-possibility-shell-v2
          path: artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-shell-v2-audit.log
          if-no-files-found: error
          retention-days: 30
