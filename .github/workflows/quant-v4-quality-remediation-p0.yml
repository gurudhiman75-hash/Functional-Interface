name: Quant V4 learner-surface remediation P0

on:
  push:
    branches:
      - audit/quant-v4-quality-remediation-p0
      - audit/quant-v4-semantic-explanation-quality-p1
    paths:
      - "artifacts/api-server/src/quant-v4/**"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-v4-quality-p0-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  learner-surface-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probability PRB-001 deterministic proof
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/package.test.ts

      - name: Probability PRB-002 deterministic proof
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/package.test.ts

      - name: Probability Question Studio profile proof
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/question-studio-profile.test.ts

      - name: Quant V4 learner-surface regression
        run: npx -y tsx artifacts/api-server/src/quant-v4/quality/quant-v4-learner-surface-regression.test.ts

      - name: Quant V4 semantic explanation quality P1
        run: npx -y tsx artifacts/api-server/src/quant-v4/quality/quant-v4-semantic-explanation-quality-p1.test.ts

      - name: Patch hygiene
        run: git diff --check
