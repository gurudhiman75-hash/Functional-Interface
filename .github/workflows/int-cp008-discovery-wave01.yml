name: Validate INT-CP-008 Wave 01 Instalment Discovery

on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp008-instalment-discovery-v1.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp008-discovery-wave01-audit.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp008-discovery-wave01-review-export.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/INT-CP-008/**'
      - '.github/workflows/int-cp008-discovery-wave01.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: int-cp008-discovery-wave01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-int-cp008-discovery-wave01:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run CP008 Wave 01 executable discovery audit
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp008-discovery-wave01-audit.ts | tee int-cp008-discovery-wave01.log
      - name: Verify CP008 Wave 01 audit marker
        run: grep -q 'PASS_INT_CP008_DISCOVERY_WAVE01_AUDIT' int-cp008-discovery-wave01.log
      - name: Export CP008 Wave 01 learner review
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp008-discovery-wave01-review-export.ts > INT-CP-008-WAVE01-DISCOVERY-REVIEW.md
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Record exact validation head
        run: |
          echo "validated_head=$(git rev-parse HEAD)" | tee int-cp008-discovery-wave01-head.log
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Upload CP008 Wave 01 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-cp008-discovery-wave01
          path: |
            int-cp008-discovery-wave01.log
            int-cp008-discovery-wave01-head.log
            INT-CP-008-WAVE01-DISCOVERY-REVIEW.md
          retention-days: 30
