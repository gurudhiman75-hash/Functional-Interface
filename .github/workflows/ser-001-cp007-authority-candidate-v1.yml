name: Validate SER-001 CP-007 authority candidate V1

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-B/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-C/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-D/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-E/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL/adaptive-review.ts
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUTHORITY-FREEZE-CANDIDATE/authority-compression-contract.ts
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUTHORITY-FREEZE-CANDIDATE/authority-candidate-v1.ts
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUTHORITY-FREEZE-CANDIDATE/authority-candidate-v1.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUTHORITY-FREEZE-CANDIDATE/authority-candidate-v1-report.md
      - .github/workflows/ser-001-cp007-authority-candidate-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-cp007-authority-candidate-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-authority-candidate-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/cp007-authority-candidate-v1

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Validate candidate registry and handoffs
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUTHORITY-FREEZE-CANDIDATE
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-authority-candidate-v1
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/authority-candidate-v1.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/authority-candidate-v1.test.mjs"
          (cd artifacts/api-server && node "$OUT/authority-candidate-v1.test.mjs") \
            | tee "$EVIDENCE/authority-candidate-v1.json"
          grep -q 'PASS_SER_CP007_AUTHORITY_CANDIDATE_V1_METADATA_REGISTRY' \
            "$EVIDENCE/authority-candidate-v1.json"

      - name: Collect registry report
        run: |
          set -euo pipefail
          ROOT=artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUTHORITY-FREEZE-CANDIDATE
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-authority-candidate-v1
          cp "$ROOT/authority-candidate-v1-report.md" \
            "$EVIDENCE/authority-candidate-v1-report.md"
          cp "$ROOT/authority-policy-decision.md" \
            "$EVIDENCE/authority-policy-decision.md"

      - name: Upload authority candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-cp007-authority-candidate-v1
          path: artifacts/api-server/dist/reasoning-v1/ser-001/cp007-authority-candidate-v1
          if-no-files-found: error
          retention-days: 30
