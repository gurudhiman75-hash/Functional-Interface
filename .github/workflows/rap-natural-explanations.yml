name: Validate RAP natural explanations

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/**
      - .github/workflows/rap-natural-explanations.yml

permissions:
  contents: write

concurrency:
  group: validate-rap-natural-explanations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-rap:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Run RAP validation suite
        run: |
          mkdir -p validation-logs/review-csv
          status=0

          run_case() {
            name="$1"
            source="$2"
            output="$3"
            log="validation-logs/${name}.log"
            echo "Bundling ${source}" > "$log"
            if pnpm --dir artifacts/api-server exec esbuild "$source" --bundle --platform=node --format=esm --outfile="$output" >> "$log" 2>&1; then
              if ! (cd artifacts/api-server && node "$output") >> "$log" 2>&1; then
                status=1
              fi
            else
              status=1
            fi
          }

          run_case rap-001-package-test src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-001/rap-001.test.ts dist/quant-v4/rap-001.test.mjs
          run_case rap-001-localization-audit src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-001/rap-001-localization-audit.ts dist/quant-v4/rap-001-localization-audit.mjs
          run_case rap-002-package-test src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-002/rap-002.test.ts dist/quant-v4/rap-002.test.mjs
          run_case rap-002-localization-audit src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-002/rap-002-localization-audit.ts dist/quant-v4/rap-002-localization-audit.mjs
          run_case rap-003-package-test src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-003/rap-003.test.ts dist/quant-v4/rap-003.test.mjs
          run_case rap-003-localization-audit src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-003/rap-003-localization-audit.ts dist/quant-v4/rap-003-localization-audit.mjs
          run_case rap-001-explanation-audit src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-001/rap-001-explanation-quality-audit.ts dist/quant-v4/rap-001-explanation-quality-audit.mjs
          run_case rap-002-explanation-audit src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-002/rap-002-explanation-quality-audit.ts dist/quant-v4/rap-002-explanation-quality-audit.mjs
          run_case rap-003-explanation-audit src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-003/rap-003-explanation-quality-audit.ts dist/quant-v4/rap-003-explanation-quality-audit.mjs
          run_case rap-answer-consistency src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/rap-answer-consistency-audit.ts dist/quant-v4/rap-answer-consistency-audit.mjs
          run_case rap-human-review-export src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/rap-review-export.ts dist/quant-v4/rap-review-export.mjs
          run_case rap-localization-review-export src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/rap-localization-review-export.ts dist/quant-v4/rap-localization-review-export.mjs

          find artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion -name '*explanation-quality-report.md' -exec cp {} validation-logs/ \;
          find artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion -name 'rap-answer-consistency-audit-report.md' -exec cp {} validation-logs/ \;
          find artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion -name 'rap-*-human-review-*.csv' -exec cp {} validation-logs/review-csv/ \;
          find artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion -name 'rap-all-human-review-*.csv' -exec cp {} validation-logs/review-csv/ \;
          find artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion -name 'rap-*-same-ql-diversity-en.csv' -exec cp {} validation-logs/review-csv/ \;

          echo "$status" > validation-logs/status.txt
          for log in validation-logs/*.log; do
            echo "===== ${log} ====="
            tail -n 40 "$log"
          done

      - name: Upload RAP validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rap-natural-explanation-validation
          path: validation-logs
          if-no-files-found: error
          retention-days: 7

      - name: Enforce RAP validation result
        run: |
          test "$(cat validation-logs/status.txt)" = "0"

  finalize-approved-localization:
    needs: validate-rap
    if: github.head_ref == 'feat/rap-hi-pa-localization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout localization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect freeze marker
        id: marker
        run: |
          if test -f .github/workflows/rap-localization-freeze-finalize.yml; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply approved freeze state
        if: steps.marker.outputs.present == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          engine_path = Path("artifacts/api-server/src/quant-v4/generation-engine.ts")
          engine = engine_path.read_text(encoding="utf-8")
          for package_id in ("RAP-001", "RAP-002", "RAP-003"):
              marker = f'packageId: "{package_id}"'
              start = engine.index(marker)
              end = engine.index("\n  },", start)
              block = engine[start:end]
              old = "supportedLanguages: ENGLISH_ONLY_PREVIEW_LANGUAGES"
              if block.count(old) != 1:
                  raise RuntimeError(f"Expected one English-only language declaration in {package_id}")
              block = block.replace(old, "supportedLanguages: MULTILINGUAL_PREVIEW_LANGUAGES", 1)
              engine = engine[:start] + block + engine[end:]
          if engine.count("supportedLanguages: MULTILINGUAL_PREVIEW_LANGUAGES") != 3:
              raise RuntimeError("Expected exactly three multilingual RAP declarations")
          if engine.count("supportedLanguages: ENGLISH_ONLY_PREVIEW_LANGUAGES") < 7:
              raise RuntimeError("Percentage language declarations changed unexpectedly")
          engine_path.write_text(engine, encoding="utf-8")

          exporter_path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/rap-localization-review-export.ts")
          exporter = exporter_path.read_text(encoding="utf-8")
          if exporter.count('        "PENDING",') != 1:
              raise RuntimeError("Expected one localization review status marker")
          exporter_path.write_text(exporter.replace('        "PENDING",', '        "APPROVED",', 1), encoding="utf-8")

          report_path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/rap-localization-freeze-report.md")
          report_path.write_text("""# RAP Hindi and Punjabi Localization Freeze Report

Date: 2026-07-20
Branch: `feat/rap-hi-pa-localization`
Base: `New-main`
Human review decision: **APPROVED / PASS**
Freeze status: **FREEZE READY**

## Scope

| Package | Active QLs | Hindi | Punjabi |
|---|---:|---:|---:|
| RAP-001 | 67 | Approved | Approved |
| RAP-002 | 102 | Approved | Approved |
| RAP-003 | 222 | Approved | Approved |
| **Total** | **391** | **391 approved rows** | **391 approved rows** |

## Publication state

- English remains approved and unchanged.
- Hindi and Punjabi use human-authored, simple, teacher-style stems and explanations.
- Hindi and Punjabi are enabled for RAP-001, RAP-002, and RAP-003 in Question Studio.
- Localization review exports record `APPROVED` rather than `PENDING`.
- The chapter is frozen against unreviewed editorial expansion; future changes require a new review cycle.

## Validation contract

The required RAP workflow enforces package tests, Hindi/Punjabi localization audits, English explanation audits, answer consistency, and review CSV exports. The integrated admin workflow enforces API, Question Studio, typecheck, test, build, and hosting integration.

## Human approval

The product owner reviewed the generated RAP Hindi and Punjabi review CSVs and reported: `Pass. Freeze ready.`
""", encoding="utf-8")

          Path(".github/workflows/rap-localization-freeze-finalize.yml").unlink()
          PY

      - name: Commit freeze state
        if: steps.marker.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(rap): freeze approved Hindi and Punjabi localization"
          git push origin HEAD:${{ github.head_ref }}
