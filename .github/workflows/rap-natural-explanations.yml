name: Validate RAP natural explanations

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/**
      - .github/workflows/rap-natural-explanations.yml

permissions:
  contents: read

concurrency:
  group: validate-rap-natural-explanations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-rap:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Run RAP validation suite
        run: |
          mkdir -p validation-logs/review-csv
          status=0

          run_case() {
            name="$1"
            source="$2"
            output="$3"
            log="validation-logs/${name}.log"
            echo "Bundling ${source}" > "$log"
            if pnpm --dir artifacts/api-server exec esbuild "$source" --bundle --platform=node --format=esm --outfile="$output" >> "$log" 2>&1; then
              if ! (cd artifacts/api-server && node "$output") >> "$log" 2>&1; then
                status=1
              fi
            else
              status=1
            fi
          }

          run_case rap-001-package-test src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-001/rap-001.test.ts dist/quant-v4/rap-001.test.mjs
          run_case rap-001-localization-audit src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-001/rap-001-localization-audit.ts dist/quant-v4/rap-001-localization-audit.mjs
          run_case rap-002-package-test src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-002/rap-002.test.ts dist/quant-v4/rap-002.test.mjs
          run_case rap-002-localization-audit src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-002/rap-002-localization-audit.ts dist/quant-v4/rap-002-localization-audit.mjs
          run_case rap-003-package-test src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-003/rap-003.test.ts dist/quant-v4/rap-003.test.mjs
          run_case rap-003-localization-audit src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-003/rap-003-localization-audit.ts dist/quant-v4/rap-003-localization-audit.mjs
          run_case rap-001-explanation-audit src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-001/rap-001-explanation-quality-audit.ts dist/quant-v4/rap-001-explanation-quality-audit.mjs
          run_case rap-002-explanation-audit src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-002/rap-002-explanation-quality-audit.ts dist/quant-v4/rap-002-explanation-quality-audit.mjs
          run_case rap-003-explanation-audit src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-003/rap-003-explanation-quality-audit.ts dist/quant-v4/rap-003-explanation-quality-audit.mjs
          run_case rap-answer-consistency src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/rap-answer-consistency-audit.ts dist/quant-v4/rap-answer-consistency-audit.mjs
          run_case rap-human-review-export src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/rap-review-export.ts dist/quant-v4/rap-review-export.mjs

          find artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion -name '*explanation-quality-report.md' -exec cp {} validation-logs/ \;
          find artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion -name 'rap-answer-consistency-audit-report.md' -exec cp {} validation-logs/ \;
          find artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion -name 'rap-*-human-review-en.csv' -exec cp {} validation-logs/review-csv/ \;
          find artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion -name 'rap-*-same-ql-diversity-en.csv' -exec cp {} validation-logs/review-csv/ \;

          echo "$status" > validation-logs/status.txt
          for log in validation-logs/*.log; do
            echo "===== ${log} ====="
            tail -n 40 "$log"
          done

      - name: Upload RAP validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rap-natural-explanation-validation
          path: validation-logs
          if-no-files-found: error
          retention-days: 7

      - name: Enforce RAP validation result
        run: |
          test "$(cat validation-logs/status.txt)" = "0"
