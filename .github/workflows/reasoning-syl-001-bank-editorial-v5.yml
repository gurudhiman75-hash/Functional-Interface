name: Validate SYL-001 Banking Editorial V5
on:
  pull_request:
    branches:
      - prototype/syl-001-bank-possibility-shell
      - audit/syl-001-source-profile-freeze
      - feat/syl-001-learner-v4
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-can-never-be-editorial-v4.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-can-never-be-editorial-v5.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-can-never-be-editorial-v5-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-banking-can-never-be-editorial-v5.ts
      - .github/workflows/reasoning-syl-001-bank-editorial-v5.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-syl-001-bank-editorial-v5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-editorial-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Bundle Editorial V5 audit
        run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-can-never-be-editorial-v5-audit.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/syl-001-bank-can-never-be-editorial-v5-audit.test.mjs
      - name: Run Editorial V5 audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-bank-can-never-be-editorial-v5-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-bank-can-never-be-editorial-v5-audit.log

      - name: Bundle Editorial V5 review exporter
        run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Syllogism/SYL-001/runtime/export-banking-can-never-be-editorial-v5.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/export-syl-001-bank-can-never-be-editorial-v5.mjs
      - name: Generate Editorial V5 human review pack
        run: node artifacts/api-server/dist/reasoning-v1/export-syl-001-bank-can-never-be-editorial-v5.mjs

      - name: Upload Editorial V5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syl-001-bank-can-never-be-editorial-v5
          path: |
            artifacts/api-server/dist/reasoning-v1/syl-001-bank-can-never-be-editorial-v5-audit.log
            dist/reasoning-v1/syl-001-bank-can-never-be-editorial-v5/**
          if-no-files-found: error
          retention-days: 30
