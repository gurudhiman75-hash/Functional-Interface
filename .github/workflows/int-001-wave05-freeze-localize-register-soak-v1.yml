name: Validate INT-001 Wave05 Freeze Localization Registration Soak V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/**'
      - 'artifacts/api-server/src/routes/admin-question-studio-interest.ts'
      - 'artifacts/admin-app/src/features/question-studio/interest-review-api.ts'
      - '.github/workflows/int-001-wave05-freeze-localize-register-soak-v1.yml'

concurrency:
  group: int-001-wave05-freeze-localize-register-soak-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-int-001-wave05:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Freeze Wave05 English learner content
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-wave05-english-freeze-v1-audit.ts | tee int-001-wave05-english-freeze-v1.log
          grep -q 'PASS_INT_001_WAVE05_ENGLISH_FREEZE_V1_AUDIT' int-001-wave05-english-freeze-v1.log

      - name: Validate Wave05 Hindi Punjabi semantic parity
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-wave05-localization-v1-audit.ts | tee int-001-wave05-localization-v1.log
          grep -q 'PASS_INT_001_WAVE05_LOCALIZATION_V1_AUDIT' int-001-wave05-localization-v1.log

      - name: Validate Wave05 Question Studio registration
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-wave05-question-studio-registration-v1-audit.ts | tee int-001-wave05-question-studio-registration-v1.log
          grep -q 'PASS_INT_001_WAVE05_QUESTION_STUDIO_REGISTRATION_V1_AUDIT' int-001-wave05-question-studio-registration-v1.log

      - name: Run complete 133 QL chapter soak and collision gate
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-wave05-chapter-soak-collision-v1.ts | tee int-001-wave05-chapter-soak-collision-v1.log
          grep -q 'PASS_INT_001_WAVE05_CHAPTER_SOAK_COLLISION_V1' int-001-wave05-chapter-soak-collision-v1.log
          grep -q '"resultingPermanentQls": 133' int-001-wave05-chapter-soak-collision-v1.log
          grep -q '"crossQlExactStemCollisions": 0' int-001-wave05-chapter-soak-collision-v1.log

      - name: Preserve chapter-wide direct calculation gate
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-chapter-wide-explanation-style-discovery-v1.ts | tee int-001-wave05-direct-calculation-regression.log
          grep -q 'PASS_INT_001_CHAPTER_WIDE_EXPLANATION_STYLE_DISCOVERY_V1' int-001-wave05-direct-calculation-regression.log
          grep -q '"abstractNarrationHits": 0' int-001-wave05-direct-calculation-regression.log

      - name: Preserve Wave03 permanent allocation
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-wave03-permanent-allocation-v1-audit.ts | tee int-001-wave05-wave03-regression.log
          grep -q 'PASS_INT_001_WAVE03_PERMANENT_ALLOCATION_V1_AUDIT' int-001-wave05-wave03-regression.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Build admin app
        run: pnpm --dir artifacts/admin-app build

      - name: Record exact validation head
        shell: bash
        run: |
          echo "validated_head=$(git rev-parse HEAD)" | tee int-001-wave05-head.log
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Upload Wave05 validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-001-wave05-freeze-localize-register-soak-v1
          path: |
            int-001-wave05-english-freeze-v1.log
            int-001-wave05-localization-v1.log
            int-001-wave05-question-studio-registration-v1.log
            int-001-wave05-chapter-soak-collision-v1.log
            int-001-wave05-direct-calculation-regression.log
            int-001-wave05-wave03-regression.log
            int-001-wave05-head.log
          retention-days: 30
