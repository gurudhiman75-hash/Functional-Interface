name: MEN-001 Wire Stem Audit Patch

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-001-wire-stem-audit-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Expand bare wire stem regression pattern
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/comprehension-quality.test.ts")
          text = path.read_text()
          old = r'''const BARE_WIRE_STEM = /^(?:A circular wire|A wire rectangle|A wire forming|A square wire frame|An equilateral triangular wire frame)\b/i;'''
          new = r'''const BARE_WIRE_STEM = /^(?:A circular wire|A wire rectangle|A wire forming|A wire square|A square wire frame|An equilateral triangular wire frame|A wire boundary)\b/i;'''
          if old not in text:
              raise SystemExit("Bare wire stem pattern not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/comprehension-quality.test.ts
          git commit -m "test(mensuration): cover all bare wire stem variants"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
