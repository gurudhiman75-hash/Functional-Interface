name: Validate GEO-LOC-001 CP012 Review

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/indian-geography/location-extent-neighbours/geo-loc-001-cp012-*"
      - "artifacts/api-server/src/knowledge-v1/indian-geography/location-extent-neighbours/GEO-LOC-001-CP012-*"
      - ".github/workflows/geography-loc-cp012-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geo-loc-001-cp012-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp012:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Qualify CP012
        run: |
          mkdir -p artifacts/api-server/dist/geography
          pnpm --dir artifacts/api-server exec esbuild "src/knowledge-v1/indian-geography/location-extent-neighbours/geo-loc-001-cp012-review-batch-v1.test.ts" --bundle --packages=external --platform=node --format=esm --outfile="dist/geography/geo-loc-001-cp012-review-batch-v1.test.mjs"
          node "artifacts/api-server/dist/geography/geo-loc-001-cp012-review-batch-v1.test.mjs"
      - name: Materialize CP012 review files
        run: |
          mkdir -p artifacts/api-server/dist/geography
          pnpm --dir artifacts/api-server exec esbuild "src/knowledge-v1/indian-geography/location-extent-neighbours/geo-loc-001-cp012-export-review-v1.ts" --bundle --packages=external --platform=node --format=esm --outfile="dist/geography/geo-loc-001-cp012-export-review-v1.mjs"
          (cd artifacts/api-server && node "dist/geography/geo-loc-001-cp012-export-review-v1.mjs")
      - uses: actions/upload-artifact@v4
        with:
          name: GEO-LOC-001-CP012-REVIEW
          path: artifacts/api-server/dist/geography-review/GEO-LOC-001-CP012-V1/
          if-no-files-found: error
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
