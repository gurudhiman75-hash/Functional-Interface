name: STA-001 Historical Four-QL Freeze Regression

on:
  pull_request:
    branches:
      - New-main
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/foundation-*'
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/permanent-*'
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/english-*'
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/ambiguity-proof.test.ts'
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/exam-readiness-proof.test.ts'
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql001-*'
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql002-*'
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql003-*'
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql004-*'
      - '.github/workflows/sta-001-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sta-001-historical-four-ql-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-four-ql-freeze-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Replay historical executable core proof
        env:
          STA_DISCOVERY_CASES_PER_QL: 120
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/foundation-proof.test.ts

      - name: Replay historical permanent four-QL semantic authority
        run: node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/permanent-ql-proof.test.ts

      - name: Replay immutable English V2 corpus and ambiguity proofs
        env:
          STA_ENGLISH_CORPUS_CASES_PER_QL: 320
        run: |
          node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/english-corpus-proof.test.ts
          node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/ambiguity-proof.test.ts
          node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/exam-readiness-proof.test.ts
          node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/english-freeze-proof.test.ts

      - name: Replay immutable QL001-QL004 localization freezes
        run: |
          node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql001-freeze-proof.test.ts
          node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql002-freeze-proof.test.ts
          node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql003-freeze-proof.test.ts
          node --experimental-strip-types artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/localization-ql004-freeze-proof.test.ts

      - name: Historical-authority boundary
        run: |
          echo 'The former QL001-QL004 product freeze remains preserved as immutable historical evidence.'
          echo 'This workflow does not assert that the current V4.1 review candidate has only four QLs.'
          echo 'It does not grant V4.1 freeze or delivery approval.'
