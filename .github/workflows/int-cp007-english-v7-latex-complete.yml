name: Validate INT-CP-007 English Review V7 Complete LaTeX

on:
  pull_request:
    branches: [New-main]
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp007-scheme-equivalence-english-v6.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp007-scheme-equivalence-english-v7.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp007-english-v7-latex-complete-audit.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp007-english-v7-review-export.ts"
      - ".github/workflows/int-cp007-english-v7-latex-complete.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-int-cp007-english-v7-latex-complete:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle CP007 English V7 complete LaTeX audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp007-english-v7-latex-complete-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-cp007-english-v7-latex-complete-audit.mjs
      - name: Run CP007 English V7 complete LaTeX audit
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp007-english-v7-latex-complete-audit.mjs 2>&1 | tee dist/quant-v4/int-cp007-english-v7-latex-complete-audit.log
      - name: Bundle CP007 English V7 review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp007-english-v7-review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-cp007-english-v7-review-export.mjs
      - name: Export CP007 English V7 review
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp007-english-v7-review-export.mjs 2>&1 | tee dist/quant-v4/int-cp007-english-v7-review-export.log
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Verify CP007 English V7 markers
        run: |
          grep -q 'PASS_INT_CP007_ENGLISH_V7_LATEX_COMPLETE_AUDIT' artifacts/api-server/dist/quant-v4/int-cp007-english-v7-latex-complete-audit.log
          grep -q 'PASS_INT_CP007_ENGLISH_V7_LATEX_COMPLETE_REVIEW_EXPORT' artifacts/api-server/dist/quant-v4/int-cp007-english-v7-review-export.log
      - name: Upload CP007 English V7 review evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-cp007-english-v7-latex-complete-review
          path: |
            artifacts/api-server/dist/quant-v4/INT-CP-007-ENGLISH-V7-LATEX-COMPLETE-REVIEW.md
            artifacts/api-server/dist/quant-v4/int-cp007-english-v7-latex-complete-audit.log
            artifacts/api-server/dist/quant-v4/int-cp007-english-v7-review-export.log
          if-no-files-found: error
