name: Validate SEA-002 Final Deep Audit

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/**"
      - "artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/**"
      - "artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-FAMILY-CURRENT-CLOSURE-20261003.md"
      - "artifacts/api-server/src/reasoning-v1/SEA-FAMILY-D-MANIFEST-AMENDMENT.md"
      - "artifacts/api-server/src/question-studio/engines/reasoning-v1-adapter.ts"
      - "artifacts/api-server/src/reasoning-v1/shared/reasoning-novelty-inventory-v1.ts"
      - "artifacts/api-server/src/reasoning-v1/shared/reasoning-v1-global-final-audit-reconciliation-20261003.ts"
      - "artifacts/api-server/src/reasoning-v1/tests/reasoning-v1-global-final-audit-reconciliation-20261003.test.ts"
      - "artifacts/api-server/src/reasoning-v1/REASONING-V1-CURRENT-IMPLEMENTED-GLOBAL-AUDIT-RECONCILIATION-20261003.md"
  workflow_dispatch:

concurrency:
  group: sea-002-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run SEA-002 final deep-audit proof
        working-directory: artifacts/api-server
        run: pnpm dlx tsx src/reasoning-v1/topics/SeatingArrangement/SEA-002/sea-002-final-deep-audit.test.ts
      - name: Run Reasoning novelty inventory proof
        working-directory: artifacts/api-server
        run: pnpm dlx tsx src/reasoning-v1/tests/reasoning-novelty-inventory-v1.test.ts
      - name: Run cross-chapter novelty current-head proof
        working-directory: artifacts/api-server
        run: pnpm dlx tsx src/reasoning-v1/tests/reasoning-cross-chapter-novelty-current-head-20261002.test.ts
      - name: Run global Reasoning reconciliation proof
        working-directory: artifacts/api-server
        run: pnpm dlx tsx src/reasoning-v1/tests/reasoning-v1-global-final-audit-reconciliation-20261003.test.ts
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
