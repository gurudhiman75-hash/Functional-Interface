name: MEN-001 Final Trap Specificity

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-001-final-trap-specificity.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Refine remaining trap explanations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-common-traps.ts")
          lines = path.read_text().splitlines()

          report_marker = '    case "retain": {'
          try:
              report_index = lines.index(report_marker)
          except ValueError:
              raise SystemExit("report/retain marker not found")
          report_line = '      if (as) return `stopping at ${withArticle(as[0])} and treating it as ${withArticle(as[1])}`;'
          if report_line not in lines[report_index + 1:report_index + 4]:
              lines.insert(report_index + 1, report_line)

          rhombus_marker = '  if (/Rhombus|Kite|Diagonal/.test(mode)) {'
          try:
              rhombus_index = lines.index(rhombus_marker)
          except ValueError:
              raise SystemExit("rhombus correction marker not found")
          rhombus_block = [
              '  if (/RhombusPerimeterFromDiagonals/.test(mode)) {',
              '    return "Halve both diagonals, use Pythagoras to find one rhombus side, then multiply that side by 4 for the perimeter.";',
              '  }',
          ]
          if rhombus_block[0] not in lines:
              lines[rhombus_index:rhombus_index] = rhombus_block

          path_marker = '  if (/Path|Border|Shaded|Remaining|Uncovered|Annulus/.test(mode)) {'
          try:
              path_index = lines.index(path_marker)
          except ValueError:
              raise SystemExit("path correction marker not found")
          path_block = [
              '  if (/(?:Path|Border).*Cost|Cost.*(?:Path|Border)/.test(mode)) {',
              '    return "Find path or border area = outer area − inner area, then multiply that area by the stated rate to obtain the total cost.";',
              '  }',
          ]
          if path_block[0] not in lines:
              lines[path_index:path_index] = path_block

          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-common-traps.ts
          git commit -m "fix(mensuration): refine remaining trap methods"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
