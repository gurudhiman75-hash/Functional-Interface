name: Validate DSF-CP-001 pre-freeze audit

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/foundation/**
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/tests/dsf-cp000-freeze-allocation.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-001/cp001-source-dependencies.ts
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-001/cp001-cross-wave-production-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-001-PRE-FREEZE-AUDIT.md
      - .github/workflows/dsf-cp001-pre-freeze.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsf-cp001-pre-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dsf-cp001-pre-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle lifecycle and cross-wave proofs
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/dsf
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/tests/dsf-cp000-freeze-allocation.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp000-freeze-allocation.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-001/cp001-cross-wave-production-audit.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp001-cross-wave-production-audit.test.mjs
      - name: Run CP-000 lifecycle compatibility proof
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/dsf/dsf-cp000-freeze-allocation.test.mjs
      - name: Run CP-001 cross-wave pre-freeze proof
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/dsf/dsf-cp001-cross-wave-production-audit.test.mjs
