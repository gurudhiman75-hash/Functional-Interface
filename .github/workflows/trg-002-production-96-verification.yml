name: Verify TRG-002 Production 96

on:
  push:
    branches:
      - feat/trg-002-production-96
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/**
      - .github/workflows/trg-002-production-96-verification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trg-002-production-96-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Targeted TRG-002 TypeScript compile
        run: |
          cat > artifacts/api-server/tsconfig.trg002-production96.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": { "noEmit": true },
            "include": [
              "src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/**/*.ts"
            ],
            "exclude": [
              "src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/question-studio-storage.test.ts"
            ],
            "references": []
          }
          EOF
          pnpm exec tsc -p artifacts/api-server/tsconfig.trg002-production96.json --pretty false

      - name: Re-verify frozen 48 approval fingerprint
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/mvp-human-approved.test.ts

      - name: Execute 96-QL production gate
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/production-runtime-96-diagnostic.ts

      - name: Execute Phase 8 editorial gate
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/production-final-editorial-diagnostic.ts

      - name: Export Phase 8 editorial review pack
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/export-production-expansion-editorial-review.ts

      - name: Verify Phase 8 editorial review pack
        run: |
          JSON=artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/review-artifacts/production-expansion-48/TRG-002-PHASE8-48-EDITORIAL-REVIEW.json
          HTML=artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/review-artifacts/production-expansion-48/TRG-002-PHASE8-48-EDITORIAL-REVIEW.html
          test -s "$JSON" && test -s "$HTML"
          node - "$JSON" <<'NODE'
          const fs = require('fs');
          const p = process.argv[2];
          const rows = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (rows.length !== 48) throw new Error(`Expected 48 editorial review rows, found ${rows.length}`);
          for (const row of rows) {
            if (row.reviewStatus !== 'AI_REVIEWED' || row.aiEditorialStatus !== 'PASS') throw new Error(`${row.qlId}: AI editorial PASS missing`);
            if (row.humanReviewStatus !== 'PENDING') throw new Error(`${row.qlId}: human review must remain PENDING`);
            if (row.freezeStatus !== 'NOT_FROZEN') throw new Error(`${row.qlId}: expansion must remain NOT_FROZEN`);
            if (row.finalEditorialReview?.status !== 'PASS') throw new Error(`${row.qlId}: final editorial status missing`);
            if (row.finalEditorialReview?.runtimeSpecVisualInspection !== 'NOT_ASSERTED_PER_INSTANCE') throw new Error(`${row.qlId}: per-instance visual claim is invalid`);
            if (row.finalEditorialReview?.appUiRenderedInspection !== 'PENDING' || row.finalEditorialReview?.renderedVisualInspection !== 'PENDING') throw new Error(`${row.qlId}: rendered visual/app inspection must remain PENDING`);
            if (row.finalEditorialReview?.humanReviewSubstituted !== false) throw new Error(`${row.qlId}: AI review must not substitute for human review`);
            if (row.validation?.valid !== true) throw new Error(`${row.qlId}: validation is not PASS`);
          }
          console.log(`TRG002_PHASE8_EDITORIAL_PACK_PASS count=${rows.length} ai=PASS human=PENDING visual=PENDING freeze=NOT_FROZEN`);
          NODE

      - name: Create Phase 8 execution evidence
        if: success()
        run: |
          mkdir -p trg-002-production96-evidence
          cat > trg-002-production96-evidence/TRG-002-PHASE8-EXECUTION-EVIDENCE.md <<EOF
          # TRG-002 Phase 8 Production-96 Execution Evidence

          - Source head: \`${GITHUB_SHA}\`
          - Workflow run: \`${GITHUB_RUN_ID}\`
          - Permanent English QLs: **96**
          - Frozen approved baseline: **48 unchanged**
          - New Phase-8 expansion QLs: **48**
          - Per CP: **24**
          - Targeted TypeScript compile: **PASS**
          - Frozen 48 approval fingerprint gate: **PASS**
          - 96-QL production runtime gate: **PASS**
          - Production sweep cases: **1152**
          - Phase-8 AI/editorial gate: **PASS**
          - Phase-8 editorial cases: **576**
          - Phase-8 editorial review pack: **48 designated runtime records**
          - New expansion human review: **PENDING**
          - Rendered visual/app UI inspection: **PENDING**
          - New expansion freeze status: **NOT FROZEN**
          - Question Studio/Test Builder/storage/publication: **OFF**
          EOF

      - name: Upload Phase 8 evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trg-002-production96-execution-evidence
          path: trg-002-production96-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Phase 8 editorial review pack
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trg-002-production48-editorial-review
          path: artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-002/review-artifacts/production-expansion-48/
          if-no-files-found: error
          retention-days: 14
