name: Reasoning BLR-001 CP-003 Runtime

on:
  push:
    branches:
      - feat/blr-001-cp003-shared-family-runtime
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/**"
      - "artifacts/examtree/src/components/blood-relations/**"
      - "artifacts/examtree/src/components/learning/LogicPlaybackRouter.tsx"
      - "artifacts/examtree/tsconfig.json"
      - "artifacts/examtree/vite.config.ts"
      - ".github/workflows/reasoning-blr-001-cp003-prototype.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/**"
      - "artifacts/examtree/src/components/blood-relations/**"
      - "artifacts/examtree/src/components/learning/LogicPlaybackRouter.tsx"
      - "artifacts/examtree/tsconfig.json"
      - "artifacts/examtree/vite.config.ts"
      - ".github/workflows/reasoning-blr-001-cp003-prototype.yml"
  workflow_dispatch:

jobs:
  cp003-shared-family-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run CP-003 grouped family runtime proof
        id: cp003_runtime
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-prototype.test.ts > cp003-runtime.log 2>&1

      - name: Run CP-003 extended shared-passage proof
        id: cp003_extended
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-extended.test.ts > cp003-extended.log 2>&1

      - name: Run CP-003 explicit marital-status proof
        id: cp003_marital
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-marital.test.ts > cp003-marital.log 2>&1

      - name: Run CP-003 lineage saturation proof
        id: cp003_lineage
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-lineage.test.ts > cp003-lineage.log 2>&1

      - name: Run CP-003 second source-gap proof
        id: cp003_source_gap
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-source-gap.test.ts > cp003-source-gap.log 2>&1

      - name: Run CP-003 English editorial review gate
        id: cp003_editorial
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-editorial-review.test.ts > cp003-editorial.log 2>&1

      - name: Run CP-003 visual teacher-style remediation gate
        id: cp003_teacher_editorial
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-teacher-editorial.test.ts > cp003-teacher-editorial.log 2>&1

      - name: Run CP-003 competitive-exam derived-only gate
        id: cp003_competitive
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-competitive-review-v4.test.ts > cp003-competitive.log 2>&1

      - name: Run CP-003 native SVG family tree gate
        id: cp003_svg
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-competitive-svg-review.test.ts > cp003-svg.log 2>&1

      - name: Run CP-003 merge and split audit
        id: cp003_merge_split
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-merge-split-audit.test.ts > cp003-merge-split.log 2>&1

      - name: Run CP-003 inverse-contract audit
        id: cp003_inverse
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-inverse-audit.test.ts > cp003-inverse.log 2>&1

      - name: Export CP-003 native SVG competitive review pack V5
        id: cp003_export_v5
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/export-cp003-review-v5-svg.ts cp003-review-v5-output > cp003-export-v5.log 2>&1

      - name: Typecheck ExamTree SVG integration
        id: examtree_typecheck
        continue-on-error: true
        run: corepack pnpm --filter @workspace/examtree typecheck > examtree-svg-typecheck.log 2>&1

      - name: Build ExamTree SVG integration
        id: examtree_build
        continue-on-error: true
        run: corepack pnpm --filter @workspace/examtree build > examtree-svg-build.log 2>&1

      - name: Upload CP-003 runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp003-runtime-logs
          path: |
            cp003-runtime.log
            cp003-extended.log
            cp003-marital.log
            cp003-lineage.log
            cp003-source-gap.log
            cp003-editorial.log
            cp003-teacher-editorial.log
            cp003-competitive.log
            cp003-svg.log
            cp003-merge-split.log
            cp003-inverse.log
            cp003-export-v5.log
            examtree-svg-typecheck.log
            examtree-svg-build.log
          if-no-files-found: error
          retention-days: 3

      - name: Upload CP-003 native SVG competitive review pack V5
        if: steps.cp003_export_v5.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp003-competitive-svg-review-v5
          path: cp003-review-v5-output
          if-no-files-found: error
          retention-days: 14

      - name: Enforce CP-003 grouped runtime result
        if: steps.cp003_runtime.outcome == 'failure'
        run: |
          cat cp003-runtime.log
          exit 1

      - name: Enforce CP-003 extended runtime result
        if: steps.cp003_extended.outcome == 'failure'
        run: |
          cat cp003-extended.log
          exit 1

      - name: Enforce CP-003 marital runtime result
        if: steps.cp003_marital.outcome == 'failure'
        run: |
          cat cp003-marital.log
          exit 1

      - name: Enforce CP-003 lineage runtime result
        if: steps.cp003_lineage.outcome == 'failure'
        run: |
          cat cp003-lineage.log
          exit 1

      - name: Enforce CP-003 source-gap result
        if: steps.cp003_source_gap.outcome == 'failure'
        run: |
          cat cp003-source-gap.log
          exit 1

      - name: Enforce CP-003 editorial result
        if: steps.cp003_editorial.outcome == 'failure'
        run: |
          cat cp003-editorial.log
          exit 1

      - name: Enforce CP-003 visual teacher-style result
        if: steps.cp003_teacher_editorial.outcome == 'failure'
        run: |
          cat cp003-teacher-editorial.log
          exit 1

      - name: Enforce CP-003 competitive-exam result
        if: steps.cp003_competitive.outcome == 'failure'
        run: |
          cat cp003-competitive.log
          exit 1

      - name: Enforce CP-003 native SVG result
        if: steps.cp003_svg.outcome == 'failure'
        run: |
          cat cp003-svg.log
          exit 1

      - name: Enforce CP-003 merge and split result
        if: steps.cp003_merge_split.outcome == 'failure'
        run: |
          cat cp003-merge-split.log
          exit 1

      - name: Enforce CP-003 inverse result
        if: steps.cp003_inverse.outcome == 'failure'
        run: |
          cat cp003-inverse.log
          exit 1

      - name: Enforce CP-003 native SVG export result
        if: steps.cp003_export_v5.outcome == 'failure'
        run: |
          cat cp003-export-v5.log
          exit 1

      - name: Enforce ExamTree SVG typecheck result
        if: steps.examtree_typecheck.outcome == 'failure'
        run: |
          cat examtree-svg-typecheck.log
          exit 1

      - name: Enforce ExamTree SVG build result
        if: steps.examtree_build.outcome == 'failure'
        run: |
          cat examtree-svg-build.log
          exit 1
