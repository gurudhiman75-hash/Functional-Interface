name: Validate Neon backup encryption safety

on:
  pull_request:
    branches: [New-main]
    paths:
      - scripts/backup-examtree-neon.sh
      - scripts/verify-examtree-neon-backup.sh
      - tests/neon-backup-encryption.test.sh
      - docs/neon-backup-and-recovery-runbook.md
      - ops/neon-daily-backup/**
      - ops/neon-backup-freshness/**
      - tests/neon-backup-freshness.test.py
      - tests/neon-daily-backup.test.sh
      - tests/neon-backup-bucket-security.test.sh
      - tests/neon-backup-serviceaccount.test.sh

permissions:
  contents: read

concurrency:
  group: examtree-neon-backup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encryption-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate backup Bash syntax
        run: |
          bash -n scripts/backup-examtree-neon.sh
          bash -n scripts/verify-examtree-neon-backup.sh
          bash -n tests/neon-backup-encryption.test.sh
          bash -n tests/neon-daily-backup.test.sh
          bash -n tests/neon-backup-bucket-security.test.sh
          bash -n tests/neon-backup-serviceaccount.test.sh
          for script in ops/neon-daily-backup/*.sh ops/neon-backup-freshness/*.sh; do bash -n "$script"; done
          python3 -m py_compile ops/neon-backup-freshness/check_freshness.py tests/neon-backup-freshness.test.py
      - name: Simulate backup and checksum failure with fake PostgreSQL I/O
        run: bash tests/neon-backup-encryption.test.sh
      - name: Simulate daily Cloud Run backup and GCS failure modes
        run: bash tests/neon-daily-backup.test.sh
      - name: Check secure GCS preflight supports Cloud SDK and raw metadata
        run: bash tests/neon-backup-bucket-security.test.sh
      - name: Simulate IAM service-account visibility and binding propagation
        run: bash tests/neon-backup-serviceaccount.test.sh
      - name: Validate independent missing-backup watchdog date boundaries and failure modes
        run: python3 tests/neon-backup-freshness.test.py
