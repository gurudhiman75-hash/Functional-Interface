name: Probability concrete outcomes v2

on:
  push:
    branches:
      - feat/prb-probability-end-to-end
    paths:
      - ".github/workflows/prb-concrete-outcomes-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  concrete-outcome-remediation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply source remediation
        run: python scripts/prb_concrete_outcome_patch.py

      - name: Run complete Probability proof
        run: |
          npx -y -p typescript@5.6.3 tsc --noEmit --target ES2020 --module commonjs --moduleResolution node --resolveJsonModule --esModuleInterop --skipLibCheck artifacts/api-server/src/quant-v4/topics/Probability/exam-readiness.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/package.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/package.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/exam-readiness.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/question-studio-profile.test.ts

      - name: Regenerate review evidence
        run: |
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/generate-exam-review.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/generate-comprehensive-questions.ts

      - name: Verify concrete editorial output
        run: |
          python - <<'PY'
          import csv, re
          from pathlib import Path

          root = Path("artifacts/api-server/src/quant-v4/topics/Probability")
          rows = []
          for package_id, expected in (("PRB-001", 75), ("PRB-002", 60)):
              current = list(csv.DictReader((root / package_id / "human-review-en.csv").open()))
              if len(current) != expected:
                  raise SystemExit(f"{package_id}: expected {expected}, found {len(current)}")
              rows.extend(current)

          forbidden = re.compile(r"\b(?:tokens?|counters?|selected files?)\b", re.I)
          coin_modes = {
              "findAtLeastOneUsingComplement", "findNoneProbability", "findExactlyOneSuccess", "findExactlyKSuccessSmallCase",
              "findAtMostKSuccessSmallCase", "findAllSuccessOrNotAll", "findCoinPatternProbability", "findCoinHeadCountProbability",
          }
          dice_modes = {"findTwoDiceSumProbability", "findTwoDiceProductOrParityProbability"}
          for row in rows:
              if row["validationValid"] != "true":
                  raise SystemExit(f"Invalid row: {row['qlId']}")
              if forbidden.search(row["stem"]):
                  raise SystemExit(f"Artificial noun remains: {row['qlId']} / {row['stem']}")
              if row["solveMode"] in coin_modes and not re.search(r"\b[HT]{2,5}\b", row["explanation"]):
                  raise SystemExit(f"Coin sequence missing: {row['qlId']}")
              if row["solveMode"] in dice_modes and not (re.search(r"\(\d,\d\)", row["explanation"]) or "Odd faces are 1, 3, 5" in row["explanation"]):
                  raise SystemExit(f"Dice outcomes missing: {row['qlId']}")

          if len({(" ".join(row["stem"].lower().split()), row["answer"]) for row in rows}) != 135:
              raise SystemExit("Visible question uniqueness failed")

          markdown = (root / "PROBABILITY-COMPREHENSIVE-QUESTIONS-AND-EXPLANATIONS.md").read_text()
          if markdown.count("\n#### Question ") != 135:
              raise SystemExit("Markdown does not contain 135 questions")
          PY
          git diff --check

      - name: Upload revised Markdown
        uses: actions/upload-artifact@v4
        with:
          name: probability-concrete-outcomes-v4
          path: artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-COMPREHENSIVE-QUESTIONS-AND-EXPLANATIONS.md
          if-no-files-found: error
          retention-days: 7

      - name: Commit source and regenerated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/quant-v4/topics/Probability/shared/parameter-generation.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/shared/student-facing-renderer.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/shared/explanation-renderer.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/shared/validator.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/shared/pipeline.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/human-review-en.csv \
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/human-review-en.csv \
            artifacts/api-server/src/quant-v4/topics/Probability/editorial-remediation-report.md \
            artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-COMPREHENSIVE-QUESTIONS-AND-EXPLANATIONS.md
          git diff --cached --check
          git commit -m "feat(probability): show concrete outcomes and use exam-style contexts [skip ci]"
          git push
