name: Reasoning COD-001 Multilingual Closure

on:
  pull_request:
    branches:
      - New-main
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cod-001-multilingual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cod-multilingual-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run whole-chapter multilingual closure audit
        id: audit
        shell: bash
        run: |
          set +e
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/review/cod-001-multilingual-closure.test.ts > cod-001-multilingual-closure.log 2>&1
          chapter_status=$?
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/review/cod-001-source-gap-localization.test.ts > cod-001-source-gap-localization.log 2>&1
          source_gap_status=$?
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/review/cod-001-source-gap-editorial.test.ts > cod-001-source-gap-editorial.log 2>&1
          editorial_status=$?
          if [ "$chapter_status" -eq 0 ] && [ "$source_gap_status" -eq 0 ] && [ "$editorial_status" -eq 0 ]; then
            status=0
          else
            status=1
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Export final multilingual review corpus
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/review/export-cod-multilingual-review.ts cod-multilingual-review-output
      - name: Upload multilingual diagnostics and review corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod-001-multilingual-closure
          path: |
            cod-001-multilingual-closure.log
            cod-001-source-gap-localization.log
            cod-001-source-gap-editorial.log
            cod-multilingual-review-output
          retention-days: 14
      - name: Enforce multilingual closure result
        run: |
          echo "=== COD-QL-001..203 whole-chapter closure ==="
          cat cod-001-multilingual-closure.log
          echo "=== COD-QL-200..203 focused Hindi/Punjabi localization ==="
          cat cod-001-source-gap-localization.log
          echo "=== COD-QL-200..203 native editorial quality ==="
          cat cod-001-source-gap-editorial.log
          test "${{ steps.audit.outputs.exit_code }}" = "0"
