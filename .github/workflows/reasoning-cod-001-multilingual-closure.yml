name: Reasoning COD-001 Multilingual Closure
on:
  pull_request:
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/**
      - .github/workflows/reasoning-cod-001-multilingual-closure.yml
  workflow_dispatch:
jobs:
  cod-multilingual-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run whole-chapter multilingual closure audit
        id: audit
        shell: bash
        run: |
          set +e
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/review/cod-001-multilingual-closure.test.ts > cod-001-multilingual-closure.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Export final multilingual review corpus
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/review/export-cod-multilingual-review.ts cod-multilingual-review-output
      - name: Upload multilingual diagnostics and review corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod-001-multilingual-closure
          path: |
            cod-001-multilingual-closure.log
            cod-multilingual-review-output
          retention-days: 14
      - name: Enforce multilingual closure result
        run: |
          cat cod-001-multilingual-closure.log
          test "${{ steps.audit.outputs.exit_code }}" = "0"
