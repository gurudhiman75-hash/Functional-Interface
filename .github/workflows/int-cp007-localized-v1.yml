name: Validate INT-CP-007 Hindi Punjabi Review V1

on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp007-scheme-equivalence-localized-v1.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp007-localized-v1-audit.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp007-localized-v1-review-export.ts'
      - '.github/workflows/int-cp007-localized-v1.yml'
  workflow_dispatch:

jobs:
  validate-int-cp007-localized-v1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle CP007 localized V1 audit
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp007-localized-v1-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/int-cp007-localized-v1-audit.mjs
      - name: Run CP007 localized V1 audit
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp007-localized-v1-audit.mjs 2>&1 | tee dist/quant-v4/int-cp007-localized-v1-audit.log
      - name: Bundle CP007 localized V1 review exporter
        run: pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp007-localized-v1-review-export.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/int-cp007-localized-v1-review-export.mjs
      - name: Export CP007 localized V1 review
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp007-localized-v1-review-export.mjs 2>&1 | tee dist/quant-v4/int-cp007-localized-v1-review-export.log
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Verify CP007 localized V1 markers
        run: |
          grep -q 'PASS_INT_CP007_LOCALIZED_V1_AUDIT' artifacts/api-server/dist/quant-v4/int-cp007-localized-v1-audit.log
          grep -q 'PASS_INT_CP007_LOCALIZED_V1_REVIEW_EXPORT' artifacts/api-server/dist/quant-v4/int-cp007-localized-v1-review-export.log
      - name: Upload CP007 localized V1 review evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-cp007-hi-pa-v1-native-review
          path: |
            artifacts/api-server/dist/quant-v4/INT-CP-007-HI-PA-V1-NATIVE-REVIEW.md
            artifacts/api-server/dist/quant-v4/int-cp007-localized-v1-audit.log
            artifacts/api-server/dist/quant-v4/int-cp007-localized-v1-review-export.log
          if-no-files-found: error
