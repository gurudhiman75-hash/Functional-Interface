name: Validate AVG-001 multilingual stem quality

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/**
      - .github/workflows/avg-001-multilingual-stem-quality.yml

permissions:
  contents: write

concurrency:
  group: avg-001-multilingual-stem-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-avg-001-multilingual-stems:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply one-time Indic punctuation correction
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/foundation")
          files = [
              base / "cp001-localization-pilot-runtime.ts",
              base / "cp002-localization-pilot-runtime.ts",
              base / "cp003-localization-review-runtime.ts",
          ]
          old_expected = 'const expected = language === "hi" ? /[\\u0900-\\u097F]/ : /[\\u0A00-\\u0A7F]/;'
          old_wrong = 'const wrong = language === "hi" ? /[\\u0A00-\\u0A7F]/ : /[\\u0900-\\u097F]/;'
          new_expected = 'const expected = language === "hi" ? /[\\u0900-\\u0963\\u0970-\\u097F]/ : /[\\u0A01-\\u0A74]/;'
          new_wrong = 'const wrong = language === "hi" ? /[\\u0A01-\\u0A74]/ : /[\\u0900-\\u0963\\u0970-\\u097F]/;'
          changed = 0
          for path in files:
              text = path.read_text(encoding="utf-8")
              updated = text.replace(old_expected, new_expected).replace(old_wrong, new_wrong)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed += 1
          print(f"corrected {changed} localization runtime files")
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/foundation/cp001-localization-pilot-runtime.ts \
                    artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/foundation/cp002-localization-pilot-runtime.ts \
                    artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/foundation/cp003-localization-review-runtime.ts
            git commit -m "fix(avg): treat Indic danda as shared punctuation"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Run multilingual stem audit and regenerate review sheets
        run: |
          set -euo pipefail
          : > avg-multilingual-stem-quality.log
          run_case() {
            name="$1"
            source="$2"
            output="dist/quant-v4/${name}.mjs"
            echo "===== $name =====" | tee -a avg-multilingual-stem-quality.log
            pnpm --dir artifacts/api-server exec esbuild "$source" --bundle --platform=node --format=esm --outfile="$output" 2>&1 | tee -a avg-multilingual-stem-quality.log
            (cd artifacts/api-server && node "$output") 2>&1 | tee -a avg-multilingual-stem-quality.log
          }
          run_case avg-001-multilingual-stem-quality src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-multilingual-stem-quality-audit.ts
          run_case avg-001-cp001-multilingual-review src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp001-multilingual-review-export.ts
          run_case avg-001-cp002-multilingual-review src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp002-multilingual-review-export.ts
          run_case avg-001-cp003-multilingual-review src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp003-multilingual-review-export.ts
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avg-001-multilingual-stem-quality-diagnostics
          path: avg-multilingual-stem-quality.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload regenerated Hindi and Punjabi review sheets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: avg-001-cp001-cp003-multilingual-stem-review
          path: |
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp001-human-review-hi.csv
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp001-human-review-pa.csv
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp002-human-review-hi.csv
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp002-human-review-pa.csv
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp003-human-review-hi.csv
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001/avg-001-cp003-human-review-pa.csv
          if-no-files-found: error
          retention-days: 14
