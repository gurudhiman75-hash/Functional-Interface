name: Refresh VEN-001 review artifacts

on:
  pull_request:
    branches: [New-main]
    paths:
      - ".github/workflows/reasoning-ven-001-refresh-artifacts.yml"
      - "artifacts/api-server/src/reasoning-v1/topics/Venn-Diagrams/VEN-001/**"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build shape review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Venn-Diagrams/VEN-001/export-shape-regions-review.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/export-shape-review.mjs
      - name: Regenerate shape review pack
        run: node artifacts/api-server/dist/reasoning-v1/export-shape-review.mjs
      - name: Build numerical review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Venn-Diagrams/VEN-001/export-numerical-review.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/export-numerical-review.mjs
      - name: Regenerate numerical review pack
        run: node artifacts/api-server/dist/reasoning-v1/export-numerical-review.mjs
      - name: Commit regenerated review files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/reasoning-v1/topics/Venn-Diagrams/VEN-001/VEN-001-SHAPE-REGIONS-REVIEW-V1.html \
            artifacts/api-server/src/reasoning-v1/topics/Venn-Diagrams/VEN-001/VEN-001-SHAPE-REGIONS-REVIEW-V1.json \
            artifacts/api-server/src/reasoning-v1/topics/Venn-Diagrams/VEN-001/VEN-001-SHAPE-REGIONS-REVIEW-V2.html \
            artifacts/api-server/src/reasoning-v1/topics/Venn-Diagrams/VEN-001/VEN-001-SHAPE-REGIONS-REVIEW-V2.json \
            artifacts/api-server/src/reasoning-v1/topics/Venn-Diagrams/VEN-001/VEN-001-NUMERICAL-REVIEW-V2.html \
            artifacts/api-server/src/reasoning-v1/topics/Venn-Diagrams/VEN-001/VEN-001-NUMERICAL-REVIEW-V2.json
          if git diff --cached --quiet; then
            echo "Review artifacts already current."
          else
            git commit -m "Refresh VEN-001 review artifacts"
            git push origin HEAD:${{ github.head_ref }}
          fi
