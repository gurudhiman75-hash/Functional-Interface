name: Validate INT-CP-009 Exam Readiness V2

on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp009-dated-cash-flow-exam-ready-v2.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp009-exam-readiness-v2-audit.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp009-exam-readiness-v2-review-export.ts'
      - '.github/workflows/int-cp009-exam-readiness-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: int-cp009-exam-readiness-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-int-cp009-exam-readiness-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Rerun CP009 source saturation audit
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp009-post-wave01-source-gap-audit.ts | tee int-cp009-source-gap-regression.log
      - name: Verify source saturation marker
        run: grep -q 'PASS_INT_CP009_POST_WAVE01_SOURCE_GAP_AUDIT' int-cp009-source-gap-regression.log
      - name: Rerun CP009 authority proposal audit
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp009-authority-proposal-v1-audit.ts | tee int-cp009-authority-proposal-regression.log
      - name: Verify authority proposal marker
        run: grep -q 'PASS_INT_CP009_AUTHORITY_PROPOSAL_V1_AUDIT' int-cp009-authority-proposal-regression.log
      - name: Run CP009 exam-readiness V2 audit
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp009-exam-readiness-v2-audit.ts | tee int-cp009-exam-readiness-v2.log
      - name: Verify exam-readiness marker
        run: grep -q 'PASS_INT_CP009_EXAM_READINESS_V2_AUDIT' int-cp009-exam-readiness-v2.log
      - name: Export CP009 exam-readiness review pack
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp009-exam-readiness-v2-review-export.ts > INT-CP-009-EXAM-READINESS-V2-REVIEW.md
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Record exact validation head
        run: |
          echo "validated_head=$(git rev-parse HEAD)" | tee int-cp009-exam-readiness-v2-head.log
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Upload CP009 exam-readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-cp009-exam-readiness-v2
          path: |
            int-cp009-source-gap-regression.log
            int-cp009-authority-proposal-regression.log
            int-cp009-exam-readiness-v2.log
            int-cp009-exam-readiness-v2-head.log
            INT-CP-009-EXAM-READINESS-V2-REVIEW.md
          retention-days: 30
          if-no-files-found: warn
