name: Validate PNC-002 CP-007 runtime proof

on:
  push:
    branches:
      - feat/pnc-002-cp007-runtime-proof
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/**
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/pnc-family-current-state-amendment-cp007-2026-07-25.md
      - .github/workflows/pnc-002-cp007-runtime.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/**
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/pnc-family-current-state-amendment-cp007-2026-07-25.md
      - .github/workflows/pnc-002-cp007-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pnc-002-cp007-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pnc-002-cp007:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict TypeScript check
        run: |
          cd artifacts/api-server
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --resolveJsonModule \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002 -name '*.ts' -print)

      - name: Bundle runtime proof
        shell: bash
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/pnc-002-cp007-diagnostics
          set +e
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002.test.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/pnc-002-cp007-proof.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/pnc-002-cp007-diagnostics/esbuild.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Run runtime proof and generate review export
        working-directory: artifacts/api-server
        run: node dist/quant-v4/pnc-002-cp007-proof.mjs

      - name: Publish CP-007 review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnc-002-cp007-question-explanation-review
          path: artifacts/api-server/dist/quant-v4/pnc-002-cp007-review/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish CP-007 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnc-002-cp007-diagnostics
          path: artifacts/api-server/dist/quant-v4/pnc-002-cp007-diagnostics/
          if-no-files-found: error
          retention-days: 3
