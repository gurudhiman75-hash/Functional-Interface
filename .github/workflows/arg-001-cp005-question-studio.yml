name: Validate ARG-001 CP005 Question Studio Integration

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/question-studio-*'
      - 'artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp004-*'
      - 'artifacts/api-server/src/reasoning-v1/question-studio-review-registry.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arg-001-cp005-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arg-cp005-question-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Strict TypeScript check for ARG CP005 adapter
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowImportingTsExtensions \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/types.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp003-saturation-types.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp003-saturation-helpers.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp003-ql001-templates.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp003-ql002-templates.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp003-ql003-templates.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp003-ql004-templates.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp003-ql005-templates.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp003-ql006-templates.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp003-templates.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp003-generator.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp004-localization-types.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp004-localization-helpers.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp004-ql001-localized.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp004-ql002-localized.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp004-ql003-localized.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp004-ql004-localized.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp004-ql005-localized.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp004-ql006-localized.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp004-localized-templates.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp004-generator.ts \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/question-studio-review.ts

      - name: Prove shared Question Studio routing and release locks
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/question-studio-integration.test.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=dist/arg-001-cp005-question-studio-proof.mjs
          node dist/arg-001-cp005-question-studio-proof.mjs

      - name: Preserve full CP004 trilingual parity
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp004-localization-proof.test.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=dist/arg-001-cp004-localization-proof.mjs
          node dist/arg-001-cp004-localization-proof.mjs

      - name: Build production API
        working-directory: artifacts/api-server
        run: pnpm run build

      - name: Build production admin app
        working-directory: artifacts/admin-app
        run: pnpm run build

      - name: Lifecycle boundary
        run: |
          echo 'ARG-001 CP005: registered in shared Question Studio as generation-ready review-only.'
          echo 'Question Bank/test/mock/public/automatic learner publication remain locked pending separate explicit release approval.'
