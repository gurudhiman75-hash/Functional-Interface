name: Validate English ENG-008 CP001 V1

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/english-v1/chapters/reading-comprehension/ENG-008/**
      - artifacts/api-server/src/english-v1/tests/eng-008-cp001-v1.test.ts
      - .github/workflows/english-eng008-cp001-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-eng008-cp001-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir artifacts/api-server exec esbuild src/english-v1/tests/eng-008-cp001-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/eng008-cp001.test.mjs
      - run: node artifacts/api-server/dist/eng008-cp001.test.mjs
      - run: pnpm --dir artifacts/api-server exec esbuild src/english-v1/chapters/reading-comprehension/ENG-008/CP001/eng-008-cp001-review-v1-export.ts --bundle --platform=node --format=esm --outfile=dist/eng008-cp001-review.mjs
      - run: cd artifacts/api-server && node dist/eng008-cp001-review.mjs
      - run: pnpm --dir artifacts/api-server build
      - uses: actions/upload-artifact@v4
        with:
          name: ENG-008-CP001-REVIEW-V1
          path: artifacts/api-server/ENG-008-CP001-REVIEW-V1.md
          if-no-files-found: error
