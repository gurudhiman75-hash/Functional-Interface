name: Validate English ENG-008 CP001 V1

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/english-v1/chapters/reading-comprehension/ENG-008/**
      - artifacts/api-server/src/english-v1/tests/eng-008-cp001-v1.test.ts
      - .github/workflows/english-eng008-cp001-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-eng008-cp001-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-eng008-cp001-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install workspace dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile
      - name: Compile ENG-008 CP001 tests
        run: pnpm --dir artifacts/api-server exec esbuild src/english-v1/tests/eng-008-cp001-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-008-cp001-v1.test.mjs
      - name: Run ENG-008 CP001 tests
        run: node artifacts/api-server/dist/english-v1/eng-008-cp001-v1.test.mjs
      - name: Compile ENG-008 CP001 review exporter
        run: pnpm --dir artifacts/api-server exec esbuild src/english-v1/chapters/reading-comprehension/ENG-008/CP001/eng-008-cp001-review-v1-export.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-008-cp001-review-v1-export.mjs
      - name: Generate ENG-008 CP001 review file
        run: node artifacts/api-server/dist/english-v1/eng-008-cp001-review-v1-export.mjs
      - name: Upload ENG-008 CP001 review file
        uses: actions/upload-artifact@v4
        with:
          name: ENG-008-CP001-REVIEW-V1
          path: artifacts/api-server/dist/english-v1/ENG-008-CP001-REVIEW-V1.md
          if-no-files-found: error
          retention-days: 30
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
