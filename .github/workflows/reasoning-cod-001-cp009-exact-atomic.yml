name: Reasoning COD-001 CP-009 Exact Atomic

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-009/**"
      - ".github/workflows/reasoning-cod-001-cp009-exact-atomic.yml"
  workflow_dispatch:

jobs:
  cp009-exact-atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run exact atomic prototype audit
        id: prototype_audit
        shell: bash
        run: |
          set +e
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-009/exact-atomic-prototype.test.ts > cod-cp009-exact-atomic.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact atomic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod-001-cp009-exact-atomic-audit
          path: cod-cp009-exact-atomic.log
          retention-days: 7

      - name: Enforce exact atomic prototype result
        shell: bash
        run: |
          cat cod-cp009-exact-atomic.log
          test "${{ steps.prototype_audit.outputs.exit_code }}" = "0"

      - name: Export exact atomic review pack
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-009/export-exact-atomic-review.ts cod-cp009-exact-atomic-review-output

      - name: Upload exact atomic review pack
        uses: actions/upload-artifact@v4
        with:
          name: cod-001-cp009-exact-atomic-review
          path: cod-cp009-exact-atomic-review-output
          retention-days: 7
