name: Validate NUM-CP-009 post-Wave02 saturation audit

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-009/**"
      - ".github/workflows/num-cp009-post-wave02-saturation-audit.yml"
  workflow_dispatch:

jobs:
  validate-num-cp009-post-wave02:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Wave 01 regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-009/wave01/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp009-wave01-regression.mjs

      - name: Run Wave 01 regression
        run: node artifacts/api-server/dist/quant-v4/num-cp009-wave01-regression.mjs

      - name: Bundle Wave 02 regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-009/wave02/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp009-wave02-regression.mjs

      - name: Run Wave 02 regression
        run: node artifacts/api-server/dist/quant-v4/num-cp009-wave02-regression.mjs

      - name: Bundle post-Wave02 saturation audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-009/post-wave02/source-gap-saturation-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp009-post-wave02-saturation-audit.mjs

      - name: Run post-Wave02 saturation audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-cp009-post-wave02-saturation-audit.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/num-cp009-post-wave02-saturation-audit.log

      - name: Upload post-Wave02 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: num-cp009-post-wave02-saturation-audit
          path: artifacts/api-server/dist/quant-v4/num-cp009-post-wave02-saturation-audit.log
          retention-days: 30
