name: Validate MEN-CP-010 source saturation wave 03

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp010-foundation/saturation-v3*
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-010/MEN-CP-010-SOURCE-SATURATION-WAVE-03.md
      - .github/workflows/men-002-cp010-source-saturation-wave03.yml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-002-cp010-source-saturation-wave03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp010-saturation-wave03:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove MEN-CP-010 Wave 03 saturation
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp010-foundation/saturation-v3.test.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/quant-v4/men-cp010-source-saturation-wave03.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp010-source-saturation-wave03.test.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/men-cp010-source-saturation-wave03.test.log
      - name: Export Wave 03 review evidence
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp010-foundation/saturation-v3-export.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/quant-v4/men-cp010-source-saturation-wave03-review.mjs
          cd artifacts/api-server
          node dist/quant-v4/men-cp010-source-saturation-wave03-review.mjs \
            2>&1 | tee dist/quant-v4/men-cp010-source-saturation-wave03-review.log
      - name: Build production API bundle
        run: bash build-api.sh
      - name: Upload MEN-CP-010 Wave 03 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-cp010-source-saturation-wave03
          path: |
            artifacts/api-server/dist/quant-v4/men-cp010-source-saturation-wave03.test.log
            artifacts/api-server/dist/quant-v4/men-cp010-source-saturation-wave03-review.log
            artifacts/api-server/dist/quant-v4/men-cp010-source-saturation-wave03.json
            artifacts/api-server/dist/quant-v4/men-cp010-source-saturation-wave03.md
          if-no-files-found: error
          retention-days: 14
