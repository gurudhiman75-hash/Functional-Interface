name: Reasoning COD-001 CP-009 Discovery Freeze

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-009/**"
      - ".github/workflows/reasoning-cod-001-cp009-discovery-freeze.yml"
  workflow_dispatch:

jobs:
  cp009-discovery-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run CP-009 executable discovery audit
        id: discovery_audit
        shell: bash
        run: |
          set +e
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-009/discovery-freeze.test.ts > cod-cp009-discovery-freeze.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload CP-009 discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod-001-cp009-discovery-freeze
          path: cod-cp009-discovery-freeze.log
          retention-days: 14

      - name: Enforce CP-009 discovery result
        shell: bash
        run: |
          cat cod-cp009-discovery-freeze.log
          test "${{ steps.discovery_audit.outputs.exit_code }}" = "0"
