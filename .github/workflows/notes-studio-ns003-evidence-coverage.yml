name: Validate Notes Studio NS-003 Evidence Coverage

on:
  pull_request:
    branches:
      - New-main
    paths:
      - 'artifacts/api-server/src/notes-studio/**'
      - 'artifacts/api-server/src/routes/admin-notes-studio*.ts'
      - 'artifacts/api-server/src/routes/index.ts'
      - 'artifacts/api-server/migrations/20260829_notes_studio_source_pack.sql'
      - 'artifacts/api-server/migrations/20260829_notes_studio_source_pack_ns003_evidence_coverage.sql'
      - 'artifacts/admin-app/src/pages/content/NotesStudio**'
      - 'artifacts/admin-app/src/App.tsx'
  workflow_dispatch:

concurrency:
  group: notes-studio-ns003-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-notes-studio-evidence-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Notes Studio source and evidence contracts
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/source-pack.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-source-pack.test.mjs
          node artifacts/api-server/dist/notes-studio-source-pack.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/evidence-map.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-evidence-map.test.mjs
          node artifacts/api-server/dist/notes-studio-evidence-map.test.mjs
      - name: Verify evidence provenance schema and migration order
        run: |
          source_pack='artifacts/api-server/migrations/20260829_notes_studio_source_pack.sql'
          evidence='artifacts/api-server/migrations/20260829_notes_studio_source_pack_ns003_evidence_coverage.sql'
          test "$(printf '%s\n%s\n' "$source_pack" "$evidence" | sort | head -n 1)" = "$source_pack"
          grep -F 'CREATE TABLE IF NOT EXISTS content.note_source_evidence_blocks' "$evidence"
          grep -F 'REFERENCES content.note_authoring_sources(job_id, source_document_id)' "$evidence"
          grep -F "state IN ('candidate', 'accepted', 'rejected', 'conflict')" "$evidence"
          grep -F 'CREATE TABLE IF NOT EXISTS content.note_coverage_plan_items' "$evidence"
      - name: Verify evidence and publication boundaries
        run: |
          grep -F "document.retention_mode = 'extracted_text'" artifacts/api-server/src/routes/admin-notes-studio-evidence.ts
          grep -F "mapping.relation = 'supports'" artifacts/api-server/src/notes-studio/readiness.ts
          grep -F "claim.state = 'conflict'" artifacts/api-server/src/notes-studio/readiness.ts
          grep -F 'adminNotesStudioEvidenceRouter' artifacts/api-server/src/routes/index.ts
          grep -F 'automaticPublicationEnabled: false' artifacts/api-server/src/routes/admin-notes-studio.ts
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Typecheck admin app
        run: pnpm --dir artifacts/admin-app typecheck
