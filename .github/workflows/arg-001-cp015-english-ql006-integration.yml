name: ARG-001 CP015 English QL006 integration

on:
  push:
    branches:
      - feature/arg-001-cp012-editorial-remediation
    paths:
      - .github/workflows/arg-001-cp015-english-ql006-integration.yml

permissions:
  contents: write

jobs:
  integrate-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arg-001-cp012-editorial-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical CP015 repair stack plus English QL006 hotfix
        run: |
          python scripts/arg-cp015-simple-explanations-repair.py
          python scripts/arg-cp015-generic-fallback-routing-repair.py
          python scripts/arg-cp015-ql004-localized-routing-hotfix.py
          python scripts/arg-cp015-localized-routing-hotfix-v2.py
          python scripts/arg-cp015-localized-routing-hotfix-v3.py
          python scripts/arg-cp015-semantic-alignment-hotfix.py
          python scripts/arg-cp015-punjabi-naturalness-hotfix.py
          python scripts/arg-cp015-hindi-naturalness-hotfix.py
          python scripts/arg-cp015-final-editorial-integration-repair.py
          python scripts/arg-cp015-english-ql006-hotfix.py
      - name: Strict TypeScript
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc --noEmit --target es2022 --module esnext --moduleResolution bundler --allowImportingTsExtensions --strictNullChecks --noImplicitAny --noImplicitReturns --noFallthroughCasesInSwitch --skipLibCheck --types node src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-perceived-diversity-expansion.ts src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-anti-gaming-grammar-proof.test.ts src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-semantic-alignment-proof.test.ts
      - name: Prove grammar and semantic alignment
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-anti-gaming-grammar-proof.test.ts --bundle --platform=node --format=esm --outfile=dist/arg-cp015-grammar.mjs
          node dist/arg-cp015-grammar.mjs
          pnpm exec esbuild src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-semantic-alignment-proof.test.ts --bundle --platform=node --format=esm --outfile=dist/arg-cp015-semantic.mjs
          node dist/arg-cp015-semantic.mjs
      - name: Commit proven runtime repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-final-editorial-quality.ts artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-anti-gaming-grammar-polish.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(arg-cp015): integrate English QL006 contextual runtime repair"
          git push origin HEAD:feature/arg-001-cp012-editorial-remediation
