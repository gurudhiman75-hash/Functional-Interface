name: Validate SER-001 CP-007 V6 remediation

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-B/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-C/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-D/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUTHORITY-FREEZE-CANDIDATE/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL/**
      - .github/workflows/ser-001-cp007-v6-remediation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-cp007-v6-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-export-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare V6 evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/cp007-v6-remediation

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Run V6 validity and explanation proof
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-v6-remediation
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/adaptive-review-v6.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/adaptive-review-v6.test.mjs"
          (cd artifacts/api-server && node "$OUT/adaptive-review-v6.test.mjs") \
            | tee "$EVIDENCE/SER-CP-007-V6-Remediation-Proof.json"
          grep -q 'PASS_SER_CP007_V6_TARGETED_REMEDIATION' \
            "$EVIDENCE/SER-CP-007-V6-Remediation-Proof.json"
          grep -q '"structuralFailures": 0' \
            "$EVIDENCE/SER-CP-007-V6-Remediation-Proof.json"
          grep -q '"visibleAnswerOccurrences": 0' \
            "$EVIDENCE/SER-CP-007-V6-Remediation-Proof.json"
          grep -q '"misleadingVisibleChecks": 0' \
            "$EVIDENCE/SER-CP-007-V6-Remediation-Proof.json"

      - name: Export V6 400-question review corpus
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-v6-remediation
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/export-adaptive-review-v6-400-questions.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/export-adaptive-review-v6-400-questions.mjs"
          (cd artifacts/api-server && node "$OUT/export-adaptive-review-v6-400-questions.mjs") \
            > "$EVIDENCE/SER-CP-007-V6-400-Validity-Remediated-Questions-and-Explanations.md"

      - name: Validate V6 review corpus
        run: |
          set -euo pipefail
          FILE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-v6-remediation/SER-CP-007-V6-400-Validity-Remediated-Questions-and-Explanations.md
          grep -q '# SER-CP-007 V6 — 400 Validity-Remediated Questions and Explanations' "$FILE"
          grep -q 'Structural failures:                0' "$FILE"
          grep -q 'Visible complete-answer occurrences:0' "$FILE"
          grep -q 'Independent release pools:' "$FILE"
          grep -q 'Inserted-letter sequence:' "$FILE"
          grep -q 'New left-edge letters:' "$FILE"
          grep -q 'wraps to' "$FILE"
          grep -q 'Moving backward, skip E and D' "$FILE"
          grep -q 'rearranged, not changed alphabetically' "$FILE"
          QUESTION_COUNT=$(grep -c '^## Question [0-9][0-9][0-9]$' "$FILE")
          ANSWER_COUNT=$(grep -c '^\*\*Answer:\*\*' "$FILE")
          EXPLANATION_COUNT=$(grep -c '^### Explanation$' "$FILE")
          STRUCTURAL_PASS_COUNT=$(grep -c '^\- \*\*Structural validity:\*\* \*\*PASS\*\*$' "$FILE")
          PRIMARY_COUNT=$(grep -c '^\- \*\*Pool status:\*\* \*\*PRIMARY\*\*$' "$FILE")
          test "$QUESTION_COUNT" -eq 400
          test "$ANSWER_COUNT" -eq 400
          test "$EXPLANATION_COUNT" -eq 400
          test "$STRUCTURAL_PASS_COUNT" -eq 400
          test "$PRIMARY_COUNT" -ge 120
          ! grep -q 'move the first 1 letter' "$FILE"
          ! grep -q 'although the positions follow different movements' "$FILE"
          ! grep -q '^\*\*Check:\*\*' "$FILE"
          echo "PASS_SER_CP007_V6_400_REVIEW_CORPUS primary=$PRIMARY_COUNT"

      - name: Upload V6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-cp007-v6-remediation
          path: artifacts/api-server/dist/reasoning-v1/ser-001/cp007-v6-remediation/
          if-no-files-found: error
          retention-days: 30
