name: Validate IOP-001 multilingual freeze

on:
  push:
    branches:
      - feat/iop-001-localization-hi-pa-v1
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/**
      - .github/workflows/iop-001-localization-freeze.yml
  pull_request:
    branches:
      - feat/iop-001-foundation-cp001-cp004
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/**
      - .github/workflows/iop-001-localization-freeze.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-iop-001-multilingual-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeze-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowImportingTsExtensions \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/InputOutput/IOP-001 -name '*.ts' -print)

      - name: Re-prove frozen English learner content
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/english-freeze-authority.test.ts

      - name: Re-audit Hindi Punjabi semantic parity and language quality
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/localization-final.test.ts

      - name: Prove content-addressed Hindi Punjabi freeze
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/InputOutput/IOP-001/localization-freeze-authority.test.ts

      - name: Build production API
        working-directory: artifacts/api-server
        run: pnpm run build
