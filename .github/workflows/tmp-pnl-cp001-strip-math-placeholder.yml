name: One-shot PNL CP-001 math-aware placeholder patch

on:
  push:
    branches:
      - feat/pnl-001-cp001-dynamic-runtime
    paths:
      - ".github/workflows/tmp-pnl-cp001-strip-math-placeholder.yml"

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-cp001-dynamic-runtime

      - name: Exclude rendered math from prose-placeholder audit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-001/cp001-dynamic-runtime.ts")
          source = path.read_text()
          old_declaration = '  const unresolvedPlaceholder = /\\{[a-z][A-Za-z0-9_]*\\}/;'
          new_declaration = '''  const containsUnresolvedProsePlaceholder = (value: string) => {
            const proseOnly = value
              .replace(/\\\\\\[[\\s\\S]*?\\\\\\]/g, "")
              .replace(/\\\\\\([\\s\\S]*?\\\\\\)/g, "");
            return /\\{[a-z][A-Za-z0-9_]*\\}/.test(proseOnly);
          };'''
          old_usage = '''        !unresolvedPlaceholder.test(stem) &&
                  !unresolvedPlaceholder.test(explanationText),'''
          new_usage = '''        !containsUnresolvedProsePlaceholder(stem) &&
                  !containsUnresolvedProsePlaceholder(explanationText),'''
          if source.count(old_declaration) != 1:
              raise SystemExit(f"Expected one placeholder declaration, found {source.count(old_declaration)}")
          if source.count(old_usage) != 1:
              raise SystemExit(f"Expected one placeholder usage, found {source.count(old_usage)}")
          source = source.replace(old_declaration, new_declaration).replace(old_usage, new_usage)
          path.write_text(source)
          PY

      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-001/cp001-dynamic-runtime.ts
          git commit -m "fix(pnl): ignore rendered math in placeholder validation"
          git push origin HEAD:feat/pnl-001-cp001-dynamic-runtime
