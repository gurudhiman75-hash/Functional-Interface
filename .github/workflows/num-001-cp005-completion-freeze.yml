name: Validate NUM-CP-005 completion and English freeze

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/**
      - .github/workflows/num-001-cp005-completion-freeze.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp005-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp005-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle and run CP-005 discovery regressions
        shell: bash
        run: |
          set -euo pipefail
          for wave in 01 02 03 04; do
            pnpm --dir artifacts/api-server exec esbuild \
              src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-005/wave${wave}/runtime-authority.test.ts \
              --bundle --platform=node --format=esm \
              --outfile=dist/quant-v4/num-001-cp005-wave${wave}-completion-regression.mjs
            node artifacts/api-server/dist/quant-v4/num-001-cp005-wave${wave}-completion-regression.mjs
          done

      - name: Bundle source-gap and merge-split regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-005/audit/merge-split-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp005-completion-source-gap.mjs

      - name: Run source-gap and merge-split regression
        run: node artifacts/api-server/dist/quant-v4/num-001-cp005-completion-source-gap.mjs

      - name: Bundle permanent allocation proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-005/permanent/allocation.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp005-permanent-allocation.test.mjs

      - name: Run permanent allocation proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp005-permanent-allocation.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp005-permanent-allocation.log

      - name: Bundle chapter allocation registry proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/design/number-system-current-allocation-registry.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/number-system-current-allocation-registry.test.mjs

      - name: Run chapter allocation registry proof
        run: node artifacts/api-server/dist/quant-v4/number-system-current-allocation-registry.test.mjs

      - name: Bundle permanent runtime proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-005/permanent/runtime-proof.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp005-permanent-runtime.test.mjs

      - name: Run permanent runtime proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp005-permanent-runtime.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp005-permanent-runtime.log

      - name: Bundle English freeze audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-005/permanent/english-freeze-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp005-english-freeze-audit.mjs

      - name: Run English freeze audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp005-english-freeze-audit.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp005-english-freeze-audit.log

      - name: Bundle external release-review audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-005/permanent/release-review-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp005-release-review-audit.mjs

      - name: Run external release-review audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp005-release-review-audit.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp005-release-review-audit.log

      - name: Bundle permanent review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-005/permanent/review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp005-permanent-review-export.mjs

      - name: Generate expanded permanent English review pack
        working-directory: artifacts/api-server
        run: node dist/quant-v4/num-001-cp005-permanent-review-export.mjs

      - name: Upload CP-005 completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: num-001-cp005-completion-english-freeze
          path: |
            artifacts/api-server/dist/quant-v4/num-001-cp005-permanent-allocation.log
            artifacts/api-server/dist/quant-v4/num-001-cp005-permanent-runtime.log
            artifacts/api-server/dist/quant-v4/num-001-cp005-english-freeze-audit.log
            artifacts/api-server/dist/quant-v4/num-001-cp005-release-review-audit.log
            artifacts/api-server/dist/quant-v4/num-001-cp005-permanent-english-review.json
            artifacts/api-server/dist/quant-v4/num-001-cp005-permanent-english-review.csv
            artifacts/api-server/dist/quant-v4/num-001-cp005-permanent-english-review.md
          if-no-files-found: warn
          retention-days: 14
