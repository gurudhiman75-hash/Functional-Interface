name: Validate SPA FCT-001 Standard Question Studio Integration V1

on:
  push:
    branches:
      - feat/spa-fct-001-question-studio-standard-v1
    paths:
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/counting-figures-question-studio-product-owner-approval-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-question-studio-integration-v4.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-question-studio-production-v4.ts
      - artifacts/api-server/src/reasoning-v1/tests/spatial-counting-figures-question-studio-standard-integration-v1.test.ts
      - .github/workflows/spa-fct-001-question-studio-standard-integration-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-fct-standard-question-studio-integration-v1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build current API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle FCT-001 standard integration proof
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-counting-figures-question-studio-standard-integration-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-counting-figures-question-studio-standard-integration-v1.test.mjs
      - name: Validate FCT-001 standard Question Studio integration
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-counting-figures-question-studio-standard-integration-v1.test.mjs \
            | tee dist/reasoning-v1/spatial/spa-fct-001-standard-question-studio-integration-v1-run.log
      - name: Upload FCT-001 standard integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-fct-001-standard-question-studio-integration-v1
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/spa-fct-001-standard-question-studio-integration-v1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-fct-001-standard-question-studio-integration-v1-run.log
          if-no-files-found: error
