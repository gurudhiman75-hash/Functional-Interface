name: Reasoning COD-001 CP-009 Adapted Locales
on:
  pull_request:
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/**
      - .github/workflows/reasoning-cod-001-cp009-adapted-locales.yml
  workflow_dispatch:
jobs:
  cp009-adapted-locales:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run CP-009 Hindi and Punjabi audit
        id: audit
        shell: bash
        run: |
          set +e
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/review/cod-cp009-adapted-locales.test.ts > cod-cp009-adapted-locales.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload CP-009 locale diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod-cp009-adapted-locales
          path: cod-cp009-adapted-locales.log
          retention-days: 14
      - name: Enforce CP-009 locale audit
        run: |
          cat cod-cp009-adapted-locales.log
          test "${{ steps.audit.outputs.exit_code }}" = "0"
