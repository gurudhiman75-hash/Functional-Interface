name: Validate MEN-CP-007 gap wave 03

on:
  pull_request:
    branches:
      - feat/men-002-cp007-gap-wave-02
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/foundation/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-01/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-02/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-03/**
      - .github/workflows/men-002-cp007-gap-wave-03.yml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-002-cp007-wave03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-men-cp007-wave03:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle foundation regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/foundation/runtime.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/men-002-cp007-foundation-regression.test.mjs

      - name: Run foundation regression
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/men-002-cp007-foundation-regression.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/men-002-cp007-foundation-regression.log

      - name: Bundle Wave-01 regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-01/runtime.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/men-002-cp007-gap-wave-01-regression.test.mjs

      - name: Run Wave-01 regression
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/men-002-cp007-gap-wave-01-regression.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/men-002-cp007-gap-wave-01-regression.log

      - name: Bundle Wave-02 regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-02/runtime.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/men-002-cp007-gap-wave-02-regression.test.mjs

      - name: Run Wave-02 regression
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/men-002-cp007-gap-wave-02-regression.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/men-002-cp007-gap-wave-02-regression.log

      - name: Bundle Wave-03 proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-03/runtime.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/men-002-cp007-gap-wave-03.test.mjs

      - name: Run Wave-03 proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/men-002-cp007-gap-wave-03.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/men-002-cp007-gap-wave-03.log

      - name: Bundle Wave-03 review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-03/review-export.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/men-002-cp007-gap-wave-03-review-export.mjs

      - name: Generate Wave-03 review export
        working-directory: artifacts/api-server
        run: node dist/quant-v4/men-002-cp007-gap-wave-03-review-export.mjs

      - name: Run exact Render production build
        id: render_build
        shell: bash
        run: |
          set +e
          bash build-api.sh > artifacts/api-server/dist/quant-v4/men-002-cp007-wave-03-render-build.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enforce Render production build
        shell: bash
        run: |
          cat artifacts/api-server/dist/quant-v4/men-002-cp007-wave-03-render-build.log
          test "${{ steps.render_build.outputs.exit_code }}" = "0"
          test -f artifacts/api-server/dist/index.mjs
          test -f artifacts/examtree/dist/public/index.html
          test -f artifacts/examtree/dist/public/admin/index.html

      - name: Upload proof, review and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-002-cp007-gap-wave-03
          path: |
            artifacts/api-server/dist/quant-v4/men-002-cp007-foundation-regression.log
            artifacts/api-server/dist/quant-v4/men-002-cp007-gap-wave-01-regression.log
            artifacts/api-server/dist/quant-v4/men-002-cp007-gap-wave-02-regression.log
            artifacts/api-server/dist/quant-v4/men-002-cp007-gap-wave-03.log
            artifacts/api-server/dist/quant-v4/men-002-cp007-wave-03-render-build.log
            artifacts/api-server/dist/quant-v4/men-002-cp007-gap-wave-03-review/**
          if-no-files-found: error
          retention-days: 7
