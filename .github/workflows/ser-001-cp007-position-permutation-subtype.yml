name: Validate SER-001 CP-007 permutation subtype preservation

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-C/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-D/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-E/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUTHORITY-FREEZE-CANDIDATE/ser-cp-007-position-permutation-subtype-preservation.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUTHORITY-FREEZE-CANDIDATE/ser-cp-007-position-permutation-subtype-preservation-report.md
      - .github/workflows/ser-001-cp007-position-permutation-subtype.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-cp007-position-permutation-subtype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-position-permutation-subtype:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/cp007-position-permutation-subtype

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Validate subtype and provenance preservation
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUTHORITY-FREEZE-CANDIDATE
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-position-permutation-subtype
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/ser-cp-007-position-permutation-subtype-preservation.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-position-permutation-subtype-preservation.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-position-permutation-subtype-preservation.test.mjs") \
            | tee "$EVIDENCE/position-permutation-subtype-preservation.json"
          grep -q 'PASS_SER_CP007_POSITION_PERMUTATION_SUBTYPE_METADATA_PRESERVATION' \
            "$EVIDENCE/position-permutation-subtype-preservation.json"

      - name: Collect subtype report
        run: |
          set -euo pipefail
          ROOT=artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUTHORITY-FREEZE-CANDIDATE
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-position-permutation-subtype
          cp "$ROOT/ser-cp-007-position-permutation-subtype-preservation-report.md" \
            "$EVIDENCE/ser-cp-007-position-permutation-subtype-preservation-report.md"

      - name: Upload subtype evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-cp007-position-permutation-subtype
          path: artifacts/api-server/dist/reasoning-v1/ser-001/cp007-position-permutation-subtype
          if-no-files-found: error
          retention-days: 30
