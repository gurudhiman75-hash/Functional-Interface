name: SRI Phase 9 wire C008 C009 localization
on:
  push:
    branches: [feature/sri-v4-phase9-localization-v1]
    paths: [.github/workflows/sri-v4-phase9-wire-c008-c009-localization.yml]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sri-v4-phase9-localization-v1
      - name: Wire finalized localization module
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/permanent-localization-v1.ts')
          text = path.read_text(encoding='utf-8')
          import_line = 'import { localizeSriC008C009FinalizedSurfaceV1 } from "./permanent-localization-c008-c009-v1";\n'
          if import_line not in text:
              marker = 'export type {\n'
              if text.count(marker) != 1:
                  raise SystemExit('Unexpected export-type marker count')
              text = text.replace(marker, import_line + '\n' + marker, 1)
          fallback = '  return localizeSriLearnerTextNaturalV1(text, locale);\n'
          call = '  const finalizedC008C009 = localizeSriC008C009FinalizedSurfaceV1(text, locale);\n  if (finalizedC008C009) return finalizedC008C009;\n\n'
          if call not in text:
              if text.count(fallback) != 1:
                  raise SystemExit('Unexpected natural fallback count')
              text = text.replace(fallback, call + fallback, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/permanent-localization-v1.ts
          git diff --cached --check
          git commit -m "SRI Phase 9: wire finalized C008 C009 localization"
          git push origin HEAD:feature/sri-v4-phase9-localization-v1
