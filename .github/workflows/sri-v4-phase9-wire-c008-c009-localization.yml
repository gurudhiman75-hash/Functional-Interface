name: SRI Phase 9 finalize C008 C009 localization wiring

on:
  push:
    branches:
      - feature/sri-v4-phase9-localization-v1
    paths:
      - .github/workflows/sri-v4-phase9-wire-c008-c009-localization.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sri-v4-phase9-localization-v1
      - name: Finalize C008 C009 localization authority
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices')
          module_path = root / 'permanent-localization-c008-c009-v1.ts'
          target_path = root / 'permanent-localization-v1.ts'

          module = module_path.read_text(encoding='utf-8')
          sentinel = '// RUN46_C008_C009_FINALIZED_COMPLETION_V1'
          if sentinel not in module:
              insertion = '  return undefined;\n}'
              if module.count(insertion) != 1:
                  raise SystemExit(f'Unexpected module return marker count: {module.count(insertion)}')
              extra = r'''  // RUN46_C008_C009_FINALIZED_COMPLETION_V1
  match = text.match(/^Simplify (.+) into simplest surd form\.$/u);
  if (match) return locale === "hi-IN"
    ? `${match[1]} को सरलतम करणी रूप में लिखिए।`
    : `${match[1]} ਨੂੰ ਸਭ ਤੋਂ ਸਰਲ ਕਰਣੀ ਰੂਪ ਵਿੱਚ ਲਿਖੋ।`;

  match = text.match(/^Rationalise with (?:the )?conjugate, then read the rational and surd coefficients from (?:canonical|standard) form\.$/u);
  if (match) return locale === "hi-IN"
    ? "संयुग्मी से परिमेयकरण कीजिए, फिर मानक रूप से परिमेय और करणी गुणांक पढ़िए।"
    : "ਸੰਯੁਗਮੀ ਨਾਲ ਪਰਿਮੇਯਕਰਨ ਕਰੋ, ਫਿਰ ਮਿਆਰੀ ਰੂਪ ਤੋਂ ਪਰਿਮੇਯ ਅਤੇ ਕਰਣੀ ਗੁਣਾਂਕ ਪੜ੍ਹੋ।";

  match = text.match(/^The value used for x is (.+)\.$/u);
  if (match) return locale === "hi-IN"
    ? `x के लिए प्रयुक्त मान ${match[1]} है।`
    : `x ਲਈ ਵਰਤਿਆ ਮੁੱਲ ${match[1]} ਹੈ।`;

  if (text === "The conjugate has product 1 with x, so it is exactly 1/x; adding the pair cancels the surd.") {
    return locale === "hi-IN"
      ? "संयुग्मी का x के साथ गुणनफल 1 है, इसलिए वह ठीक 1/x है; दोनों को जोड़ने पर करणी पद कट जाते हैं।"
      : "ਸੰਯੁਗਮੀ ਦਾ x ਨਾਲ ਗੁਣਨਫਲ 1 ਹੈ, ਇਸ ਲਈ ਉਹ ਠੀਕ 1/x ਹੈ; ਦੋਵਾਂ ਨੂੰ ਜੋੜਣ ਤੇ ਕਰਣੀ ਪਦ ਕੱਟ ਜਾਂਦੇ ਹਨ।";
  }

  if (text === "Use the reciprocal-conjugate relation to evaluate the target.") {
    return locale === "hi-IN"
      ? "पूछे गए मान के लिए व्युत्क्रम-संयुग्मी संबंध का उपयोग कीजिए।"
      : "ਪੁੱਛੇ ਗਏ ਮੁੱਲ ਲਈ ਵਿਉਤਕ੍ਰਮ-ਸੰਯੁਗਮੀ ਸੰਬੰਧ ਦੀ ਵਰਤੋਂ ਕਰੋ।";
  }

'''
              module = module.replace(insertion, extra + insertion, 1)

          old_norm = '  if (match) return locale === "hi-IN" ? `हर का नॉर्म = ${match[1]}` : `ਹਰ ਦਾ ਨਾਰਮ = ${match[1]}`;'
          new_norm = '  if (match) return locale === "hi-IN" ? `हर का मान = ${match[1]}` : `ਹਰ ਦਾ ਮੁੱਲ = ${match[1]}`;'
          if old_norm in module:
              module = module.replace(old_norm, new_norm, 1)
          module_path.write_text(module, encoding='utf-8')

          target = target_path.read_text(encoding='utf-8')
          import_line = 'import { localizeSriC008C009FinalizedSurfaceV1 } from "./permanent-localization-c008-c009-v1";\n'
          if import_line not in target:
              export_marker = 'export type {\n'
              if target.count(export_marker) != 1:
                  raise SystemExit('Unexpected export-type marker count')
              target = target.replace(export_marker, import_line + '\n' + export_marker, 1)

          call = '  const finalizedC008C009 = localizeSriC008C009FinalizedSurfaceV1(text, locale);\n  if (finalizedC008C009) return finalizedC008C009;\n'
          target = target.replace('\n' + call + '\n  return localizeSriLearnerTextNaturalV1(text, locale);\n', '\n  return localizeSriLearnerTextNaturalV1(text, locale);\n', 1)
          exact_marker = '  const exact = EXACT_SENTENCES[locale][text];\n  if (exact) return exact;\n'
          if target.count(exact_marker) != 1:
              raise SystemExit(f'Unexpected exact-sentence marker count: {target.count(exact_marker)}')
          early_block = exact_marker + '\n' + call
          if early_block not in target:
              target = target.replace(exact_marker, early_block, 1)
          target_path.write_text(target, encoding='utf-8')

          Path('.github/workflows/sri-v4-phase9-wire-c008-c009-localization.yml').unlink(missing_ok=True)
          Path('.github/workflows/sri-v4-phase9-remediate-run40.yml').unlink(missing_ok=True)
          PY
          git diff --check
          grep -n "localizeSriC008C009FinalizedSurfaceV1" artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/permanent-localization-v1.ts
          grep -n "RUN46_C008_C009_FINALIZED_COMPLETION_V1" artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/permanent-localization-c008-c009-v1.ts
      - name: Commit durable precedence fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "SRI Phase 9: finalize C008 C009 localization precedence"
          git push origin HEAD:feature/sri-v4-phase9-localization-v1