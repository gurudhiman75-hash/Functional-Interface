name: Validate SPA FCT-001 Exam Renderer Review V1

on:
  push:
    branches:
      - feat/spa-fct-001-current-main-integration-v1
    paths:
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/counting-figures-exam-renderer-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/counting-figures-permanent-english-runtime-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/counting-figures-question-studio-seeded-runtime-v1.ts
      - artifacts/api-server/src/reasoning-v1/tests/spatial-counting-figures-exam-renderer-v1.test.ts
      - artifacts/api-server/src/reasoning-v1/tests/spatial-counting-figures-exam-renderer-review-v1.ts
      - .github/workflows/spa-fct-001-exam-renderer-review-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-review:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build current API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle FCT exam-renderer proof
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-counting-figures-exam-renderer-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-counting-figures-exam-renderer-v1.test.mjs

      - name: Validate exam-standard geometry and display fingerprinting
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-counting-figures-exam-renderer-v1.test.mjs \
            | tee dist/reasoning-v1/spatial/spa-fct-001-exam-renderer-v1-run.log

      - name: Bundle fresh FCT review generator
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-counting-figures-exam-renderer-review-v1.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-counting-figures-exam-renderer-review-v1.mjs

      - name: Generate fresh runtime review pack
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-counting-figures-exam-renderer-review-v1.mjs \
            | tee dist/reasoning-v1/spatial/spa-fct-001-exam-renderer-review-v1-run.log

      - name: Upload FCT exam-renderer review evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-fct-001-exam-renderer-review-v1
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/spa-fct-001-exam-renderer-v1-run.log
            artifacts/api-server/dist/reasoning-v1/spatial/spa-fct-001-exam-renderer-v1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-fct-001-exam-renderer-review-v1-run.log
            artifacts/api-server/dist/reasoning-v1/spatial/spa-fct-001-exam-renderer-review-v1.html
            artifacts/api-server/dist/reasoning-v1/spatial/spa-fct-001-exam-renderer-review-v1.json
          if-no-files-found: error
