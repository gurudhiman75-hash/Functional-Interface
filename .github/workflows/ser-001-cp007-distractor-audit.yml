name: Validate SER-001 CP-007 distractor audit

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-B/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-C/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-D/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-E/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL/adaptive-review.ts
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-DISTRACTOR-AUDIT/**
      - .github/workflows/ser-001-cp007-distractor-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-cp007-distractor-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-distractor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/cp007-distractor-audit

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Run distractor quality baseline audit
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-DISTRACTOR-AUDIT
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-distractor-audit
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/ser-cp-007-distractor-quality-audit.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-distractor-quality-audit.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-distractor-quality-audit.test.mjs") \
            | tee "$EVIDENCE/distractor-quality-audit.json"
          grep -q 'PASS_SER_CP007_DISTRACTOR_AUDIT_REMODEL_REQUIRED' \
            "$EVIDENCE/distractor-quality-audit.json"

      - name: Collect audit report
        run: |
          set -euo pipefail
          ROOT=artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-DISTRACTOR-AUDIT
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-distractor-audit
          cp "$ROOT/ser-cp-007-distractor-quality-audit-report.md" \
            "$EVIDENCE/ser-cp-007-distractor-quality-audit-report.md"

      - name: Upload distractor audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-cp007-distractor-audit
          path: artifacts/api-server/dist/reasoning-v1/ser-001/cp007-distractor-audit
          if-no-files-found: error
          retention-days: 30
