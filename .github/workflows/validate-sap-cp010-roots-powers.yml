name: Validate SAP-CP-010 roots powers reciprocals

on:
  pull_request:
    branches:
      - freeze/sap-cp009-exam-standard-v3-approved
      - feat/sap-cp009-multiplicative-approximation
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-002/SAP-CP-010/**
      - .github/workflows/validate-sap-cp010-roots-powers.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sap-cp010:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle CP010 authority
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-002/SAP-CP-010/authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/sap-cp010-authority.test.mjs
      - name: Run CP010 authority
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/sap-cp010-authority.test.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/sap-cp010-authority.log
      - name: Upload CP010 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sap-cp010-roots-powers-authority
          path: artifacts/api-server/dist/quant-v4/sap-cp010-authority.log
          if-no-files-found: error
          retention-days: 30
