name: Validate TSD CP007 Question Studio route integration

on:
  push:
    branches:
      - feat/tsd-cp007-executable-discovery-v1
    paths:
      - artifacts/api-server/src/routes/admin-question-studio-time-speed-distance.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-002/cp007/**
      - .github/workflows/tsd-cp007-question-studio-route.yml
  pull_request:
    branches:
      - feat/tsd-cp006-question-studio-review-v1
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/routes/admin-question-studio-time-speed-distance.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-002/cp007/**
      - .github/workflows/tsd-cp007-question-studio-route.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-tsd-cp007-studio-route-${{ github.ref }}
  cancel-in-progress: true

jobs:
  question-studio-route:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check for TSD CP007 Studio route
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            src/routes/admin-question-studio-time-speed-distance.ts
      - name: Prove frozen Question Studio adapter
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-002/cp007/question-studio-review-proof.test.ts
      - name: Prove route registration and lifecycle locks
        run: pnpm dlx tsx ./artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-002/cp007/question-studio-route-registration-proof.test.ts
