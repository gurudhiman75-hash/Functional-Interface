name: Validate CLS-001 final chapter closure

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/question-studio/engines/reasoning-v1-adapter.ts
      - artifacts/api-server/src/question-studio/engines/reasoning-v1-cls001-adapter-v1.ts
      - artifacts/api-server/src/question-studio/engines/reasoning-v1-cls001-adapter-v1.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Classification/CLS-001/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-cls-001-final-chapter-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle and run CLS-001 Question Studio closure proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/question-studio/engines/reasoning-v1-cls001-adapter-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1-cls001-adapter-v1.test.mjs
          node artifacts/api-server/dist/reasoning-v1-cls001-adapter-v1.test.mjs
      - name: Build current API server
        run: pnpm --dir artifacts/api-server build
