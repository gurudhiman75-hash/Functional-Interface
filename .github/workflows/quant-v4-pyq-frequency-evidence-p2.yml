name: Quant V4 PYQ frequency evidence P2

on:
  push:
    branches:
      - audit/quant-v4-pyq-frequency-evidence-p2
    paths:
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-pyq-frequency-evidence-p2.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-pyq-frequency-evidence-p2.test.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-pyq-observations-*.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-pyq-observations-*.test.ts"
      - "artifacts/api-server/src/quant-v4/quality/QUANT-V4-PYQ-FREQUENCY-EVIDENCE-P2.md"
      - ".github/workflows/quant-v4-pyq-frequency-evidence-p2.yml"
  pull_request:
    branches:
      - audit/quant-v4-real-exam-simulation-p2
    paths:
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-pyq-frequency-evidence-p2.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-pyq-frequency-evidence-p2.test.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-pyq-observations-*.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-pyq-observations-*.test.ts"
      - "artifacts/api-server/src/quant-v4/quality/QUANT-V4-PYQ-FREQUENCY-EVIDENCE-P2.md"
      - ".github/workflows/quant-v4-pyq-frequency-evidence-p2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-v4-pyq-frequency-evidence-p2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pyq-frequency-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle PYQ frequency evidence proof
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/pyq-frequency
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/quality/quant-v4-pyq-frequency-evidence-p2.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/quant-v4/pyq-frequency/quant-v4-pyq-frequency-evidence-p2.test.mjs

      - name: Run PYQ frequency evidence proof
        working-directory: artifacts/api-server
        run: node dist/quant-v4/pyq-frequency/quant-v4-pyq-frequency-evidence-p2.test.mjs

      - name: Bundle Algebra Wave 1 PYQ migration proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/quality/quant-v4-pyq-observations-algebra-wave1-p2.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/quant-v4/pyq-frequency/quant-v4-pyq-observations-algebra-wave1-p2.test.mjs

      - name: Run Algebra Wave 1 PYQ migration proof
        working-directory: artifacts/api-server
        run: node dist/quant-v4/pyq-frequency/quant-v4-pyq-observations-algebra-wave1-p2.test.mjs

      - name: Patch hygiene
        run: git diff --check
