name: Reasoning BLR-001 CP-003 V9 Topology Gap Wave 01 Reviewed

on:
  push:
    branches:
      - feat/blr-001-cp003-shared-family-runtime
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v9-topology-gap-wave-01-foundation.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v9-topology-gap-wave-01.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v9-topology-gap-wave-01.test.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v9-topology-gap-wave-01-independent-verifier.test.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v9-topology-gap-wave-01-reviewed.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v9-topology-gap-wave-01-reviewed.test.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/export-cp003-v9-topology-gap-wave-01-reviewed.ts"
      - ".github/workflows/reasoning-blr-001-cp003-v9-topology-gap-wave-01-reviewed.yml"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v9-topology-gap-wave-01-foundation.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v9-topology-gap-wave-01.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v9-topology-gap-wave-01.test.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v9-topology-gap-wave-01-independent-verifier.test.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v9-topology-gap-wave-01-reviewed.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v9-topology-gap-wave-01-reviewed.test.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/export-cp003-v9-topology-gap-wave-01-reviewed.ts"
      - ".github/workflows/reasoning-blr-001-cp003-v9-topology-gap-wave-01-reviewed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blr-001-cp003-v9-topology-gap-wave-01-reviewed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-v9-topology-gap-wave-01-reviewed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run V9 base topology proof
        id: v9_base
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v9-topology-gap-wave-01.test.ts > cp003-v9-base.log 2>&1

      - name: Run independent V9 graph-closure verifier
        id: v9_independent
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v9-topology-gap-wave-01-independent-verifier.test.ts > cp003-v9-independent.log 2>&1

      - name: Run V9 reviewed passage-evidence proof
        id: v9_reviewed
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-v9-topology-gap-wave-01-reviewed.test.ts > cp003-v9-reviewed.log 2>&1

      - name: Export reviewed V9 wave pack
        id: v9_export
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/export-cp003-v9-topology-gap-wave-01-reviewed.ts cp003-v9-reviewed-output > cp003-v9-reviewed-export.log 2>&1

      - name: Verify reviewed V9 artifact contracts
        id: artifact_contract
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUT=cp003-v9-reviewed-output
          test -f "$OUT/blr-cp003-v9-wave01-reviewed-summary.json"
          test -f "$OUT/blr-cp003-v9-wave01-reviewed-candidates.jsonl"
          test -f "$OUT/blr-cp003-v9-wave01-reviewed-candidates.csv"
          test -f "$OUT/blr-cp003-v9-wave01-reviewed-candidates.md"
          test -f "$OUT/blr-cp003-v9-wave01-reviewed-candidates.html"
          test -f "$OUT/blr-cp003-v9-wave01-reviewed-coverage.md"
          grep -q '"candidateRecords": 96' "$OUT/blr-cp003-v9-wave01-reviewed-summary.json"
          grep -q '"remediatedRecords": 42' "$OUT/blr-cp003-v9-wave01-reviewed-summary.json"
          grep -q '"remediatedPassageGroups": 14' "$OUT/blr-cp003-v9-wave01-reviewed-summary.json"
          grep -q '"independentlySolvedEvidencePaths": 176' "$OUT/blr-cp003-v9-wave01-reviewed-summary.json"
          grep -q '"records": 226' "$OUT/blr-cp003-v9-wave01-reviewed-summary.json"
          grep -q '"finalDiscoveryFreezeAllowed": false' "$OUT/blr-cp003-v9-wave01-reviewed-summary.json"
          grep -q 'min-width:0' "$OUT/blr-cp003-v9-wave01-reviewed-candidates.html"
          grep -q '@media(max-width:640px)' "$OUT/blr-cp003-v9-wave01-reviewed-candidates.html"
          if grep -q 'min-width:720px' "$OUT/blr-cp003-v9-wave01-reviewed-candidates.html"; then
            echo "Legacy fixed SVG width remains in reviewed V9 HTML."
            exit 1
          fi

      - name: Re-run historical final-freeze boundary
        id: freeze_boundary
        continue-on-error: true
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-final-freeze-readiness.test.ts > cp003-v9-reviewed-freeze.log 2>&1

      - name: Upload reviewed V9 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp003-v9-topology-gap-wave-01-reviewed-logs
          path: |
            cp003-v9-base.log
            cp003-v9-independent.log
            cp003-v9-reviewed.log
            cp003-v9-reviewed-export.log
            cp003-v9-reviewed-freeze.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload reviewed V9 candidate pack
        if: steps.v9_export.outcome == 'success' && steps.artifact_contract.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp003-v9-topology-gap-wave-01-reviewed
          path: cp003-v9-reviewed-output
          if-no-files-found: error
          retention-days: 21

      - name: Enforce V9 base result
        if: steps.v9_base.outcome == 'failure'
        run: |
          cat cp003-v9-base.log
          exit 1

      - name: Enforce independent V9 result
        if: steps.v9_independent.outcome == 'failure'
        run: |
          cat cp003-v9-independent.log
          exit 1

      - name: Enforce V9 reviewed result
        if: steps.v9_reviewed.outcome == 'failure'
        run: |
          cat cp003-v9-reviewed.log
          exit 1

      - name: Enforce reviewed V9 export
        if: steps.v9_export.outcome == 'failure'
        run: |
          cat cp003-v9-reviewed-export.log
          exit 1

      - name: Enforce reviewed artifact contract
        if: steps.artifact_contract.outcome == 'failure'
        run: exit 1

      - name: Enforce freeze-boundary regression
        if: steps.freeze_boundary.outcome == 'failure'
        run: |
          cat cp003-v9-reviewed-freeze.log
          exit 1
