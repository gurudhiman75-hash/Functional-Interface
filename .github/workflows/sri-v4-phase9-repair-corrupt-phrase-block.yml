name: SRI Phase 9 safe source recovery

on:
  push:
    branches:
      - feature/sri-v4-phase9-localization-v1
    paths:
      - .github/workflows/sri-v4-phase9-repair-corrupt-phrase-block.yml

permissions:
  contents: write

jobs:
  recover-localization-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 9 branch with history
        uses: actions/checkout@v4
        with:
          ref: feature/sri-v4-phase9-localization-v1
          fetch-depth: 0
      - name: Restore localization source from pre-bot parent
        run: |
          SOURCE='artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/permanent-localization-v1.ts'
          git checkout 97ab14027211abdef97919dd9bed2619fbcf02c5 -- "$SOURCE"
          git diff --check
          git diff -- "$SOURCE"
      - name: Commit recovered source only
        run: |
          SOURCE='artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/permanent-localization-v1.ts'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SOURCE"
          git commit -m "SRI Phase 9: restore localization source before phrase remediation"
          git push origin HEAD:feature/sri-v4-phase9-localization-v1
