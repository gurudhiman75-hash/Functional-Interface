name: Validate ANA-CP-008 English language prototypes

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/**
      - .github/workflows/ana-cp-008-language-prototypes.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-ana-cp-008-language-prototypes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  english-prototype-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008 -name '*.ts' -print) \
            src/reasoning-v1/topics/Analogy/ANA-001/foundation/alphabet.ts
      - name: Verify English language prototypes
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/provisional-language-templates.en.test.ts
