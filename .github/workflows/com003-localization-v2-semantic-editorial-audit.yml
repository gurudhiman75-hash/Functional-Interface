name: COM-003 Localization V2 Semantic Editorial Audit

on:
  push:
    branches: [feature/com003-office-productivity-discovery-v1]
    paths:
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-review-synthesis-v16-2.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-english-freeze-v2.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-wave1.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-wave2.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-wave3.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-wave4.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-explanation-diversity.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-chapter.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-semantic-editorial-audit.test.ts'
      - '.github/workflows/com003-localization-v2-semantic-editorial-audit.yml'
  pull_request:
    branches: [integration/computer-content-engine-mainline-v1]
    paths:
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-review-synthesis-v16-2.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-english-freeze-v2.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-wave1.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-wave2.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-wave3.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-wave4.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-explanation-diversity.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-chapter.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-localization-v2-semantic-editorial-audit.test.ts'
      - '.github/workflows/com003-localization-v2-semantic-editorial-audit.yml'

permissions:
  contents: read

concurrency:
  group: com003-localization-v2-semantic-editorial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle semantic editorial audit
        run: |
          mkdir -p artifacts/api-server/dist/com003-localization-v2-semantic-editorial
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/computer-awareness/com003-localization-v2-semantic-editorial-audit.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/com003-localization-v2-semantic-editorial/audit.test.mjs
      - name: Run semantic editorial audit
        run: node artifacts/api-server/dist/com003-localization-v2-semantic-editorial/audit.test.mjs
