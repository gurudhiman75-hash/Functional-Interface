name: Validate DSF-CP-022 QL002 Direction

on:
  pull_request:
    branches:
      - New-main
      - audit/dsf-001-cp021-ql002-ranking-batch
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-015/**
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-022/**
      - artifacts/api-server/src/lib/reasoning/spatial-reasoning.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsf-cp022-ql002-direction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dsf-cp022:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle CP022 QL002 Direction audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-022/direction-three-statement-batch-v1.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/dsf-cp022-ql002-direction.test.mjs
      - name: Run CP022 QL002 Direction audit
        run: node artifacts/api-server/dist/reasoning-v1/dsf-cp022-ql002-direction.test.mjs
