name: Validate universal Question Studio generation worker
on:
  pull_request:
    branches: [New-main]
    paths:
      - 'artifacts/api-server/src/question-studio/universal-executor.ts'
      - 'artifacts/api-server/src/question-studio/universal-generation-worker.ts'
      - 'artifacts/api-server/src/question-studio/remote-universal-studio-client.ts'
      - 'artifacts/api-server/universal-question-studio-worker-service.mjs'
      - 'artifacts/api-server/src/routes/admin-question-studio-engine-v1.ts'
      - 'artifacts/api-server/build-universal-worker.mjs'
      - 'Dockerfile.question-studio-universal'
      - 'cloudbuild.question-studio-universal.yaml'
      - 'tests/question-studio-universal-dispatcher.test.mjs'
      - 'scripts/smoke-question-studio-universal-local.mjs'
      - 'scripts/deploy-question-studio-universal-staging-fix-candidate.sh'
      - 'scripts/deploy-question-studio-universal-staging-num-contract-candidate.sh'
      - 'scripts/deploy-question-studio-universal-197-candidate.sh'
      - 'tests/qs-universal-197-candidate-deploy-contract.test.mjs'
      - 'tests/examtree-universal-staging-num-contract.test.mjs'
      - 'artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/multilingual-human-review-pack.ts'
      - 'artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-004/localization/cp004-localized-review-runtime.ts'
      - 'artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-005/localization/cp005-localized-review-runtime.ts'
      - 'artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-006/localization/cp006-localized-review-runtime.ts'
      - 'artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/dir-001-final-audit-review-pack.ts'
      - 'scripts/deploy-question-studio-universal-staging.sh'
      - 'scripts/verify-question-studio-universal-staging.sh'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  universal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify endpoint auth and canonical persistence contract
        run: node --test tests/question-studio-universal-dispatcher.test.mjs
      - name: Install locked API dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile --filter @workspace/api-server...
      - name: Build all four deterministic generation adapters in dedicated bundle
        run: node artifacts/api-server/build-universal-worker.mjs
      - name: Smoke generate with Quant Reasoning English Static GK
        run: node scripts/smoke-question-studio-universal-local.mjs
      - name: Verify manual staging scripts parse
        run: |
          bash -n scripts/deploy-question-studio-universal-staging.sh
          bash -n scripts/verify-question-studio-universal-staging.sh
          bash -n scripts/deploy-question-studio-universal-staging-fix-candidate.sh
      - name: Verify NUM-contract zero-traffic script and acceptance guards
        run: |
          bash -n scripts/deploy-question-studio-universal-staging-num-contract-candidate.sh
          bash -n scripts/verify-question-studio-universal-staging.sh
          node --test tests/examtree-universal-staging-num-contract.test.mjs
      - name: Verify 197 candidate isolation guards (no deployment)
        run: |
          bash -n scripts/deploy-question-studio-universal-197-candidate.sh
          node --test tests/qs-universal-197-candidate-deploy-contract.test.mjs
      - name: Ensure patch hygiene
        run: git diff --check
