name: Reasoning V1 Novelty Governance

on:
  pull_request:
    branches: [New-main]
    paths:
      - artifacts/api-server/src/reasoning-v1/shared/reasoning-novelty-governance-v1.ts
      - artifacts/api-server/src/reasoning-v1/tests/reasoning-novelty-governance-v1.test.ts
      - artifacts/api-server/src/reasoning-v1/tests/reasoning-novelty-inventory-v1.test.ts
      - artifacts/api-server/src/reasoning-v1/tests/reasoning-novelty-provider-registry-v1.test.ts
      - artifacts/api-server/src/reasoning-v1/tests/reasoning-novelty-review-runtime-v1.test.ts
      - artifacts/api-server/src/reasoning-v1/tests/reasoning-novelty-review-pack-v1.test.ts
      - artifacts/api-server/src/reasoning-v1/shared/reasoning-novelty-review-pack-v1.ts
      - artifacts/api-server/src/reasoning-v1/shared/reasoning-novelty-review-runtime-v1.ts
      - artifacts/api-server/src/reasoning-v1/shared/reasoning-novelty-provider-registry-v1.ts
      - artifacts/api-server/src/reasoning-v1/shared/reasoning-novelty-inventory-v1.ts
      - artifacts/api-server/src/reasoning-v1/shared/reasoning-final-audit-standard-v1.ts
      - artifacts/api-server/src/reasoning-v1/tests/reasoning-final-audit-standard-v1.test.ts
      - artifacts/api-server/src/reasoning-v1/tests/rnk-001-controlled-novelty-discovery-v1.test.ts
      - artifacts/api-server/src/reasoning-v1/tests/clk-001-controlled-novelty-discovery-v1.test.ts
      - artifacts/api-server/src/reasoning-v1/tests/dir-001-controlled-novelty-discovery-v1.test.ts
      - artifacts/api-server/src/reasoning-v1/tests/blr-001-controlled-novelty-discovery-v1.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/blr-001-controlled-novelty-discovery-v1.ts
      - artifacts/api-server/src/reasoning-v1/topics/Direction-Sense/DIR-001/dir-001-controlled-novelty-discovery-v1.ts
      - artifacts/api-server/src/reasoning-v1/tests/cae-001-controlled-novelty-discovery-v1.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Cause-and-Effect/CAE-001/cae-001-controlled-novelty-discovery-v1.ts
      - artifacts/api-server/src/reasoning-v1/tests/sif-001-novelty-gate-semantics-v1.test.ts
      - artifacts/api-server/src/reasoning-v1/tests/sif-001-cp011-row-shape-regression-v1.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Statement-and-Inference/SIF-001/validators.ts
      - artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/rnk-001-controlled-novelty-discovery-v1.ts
      - artifacts/api-server/src/reasoning-v1/topics/Clocks/CLK-001/clk-001-controlled-novelty-discovery-v1.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reasoning-v1-novelty-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-reasoning-novelty-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Prove controlled-novel governance
        working-directory: artifacts/api-server
        run: |
          mkdir -p dist/reasoning-v1/novelty
          pnpm exec esbuild             src/reasoning-v1/tests/reasoning-novelty-governance-v1.test.ts             --bundle --platform=node --format=esm             --outfile=dist/reasoning-v1/novelty/reasoning-novelty-governance-v1.test.mjs
          node --test dist/reasoning-v1/novelty/reasoning-novelty-governance-v1.test.mjs

          pnpm exec esbuild \
            src/reasoning-v1/tests/reasoning-novelty-inventory-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/novelty/reasoning-novelty-inventory-v1.test.mjs
          node --test dist/reasoning-v1/novelty/reasoning-novelty-inventory-v1.test.mjs

          pnpm exec esbuild \
            src/reasoning-v1/tests/reasoning-novelty-provider-registry-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/novelty/reasoning-novelty-provider-registry-v1.test.mjs
          node --test dist/reasoning-v1/novelty/reasoning-novelty-provider-registry-v1.test.mjs

          pnpm exec esbuild \
            src/reasoning-v1/tests/reasoning-novelty-review-runtime-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/novelty/reasoning-novelty-review-runtime-v1.test.mjs
          node --test dist/reasoning-v1/novelty/reasoning-novelty-review-runtime-v1.test.mjs

          pnpm exec esbuild \
            src/reasoning-v1/tests/reasoning-novelty-review-pack-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/novelty/reasoning-novelty-review-pack-v1.test.mjs
          node --test dist/reasoning-v1/novelty/reasoning-novelty-review-pack-v1.test.mjs

          pnpm exec esbuild \
            src/reasoning-v1/tests/reasoning-final-audit-standard-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/novelty/reasoning-final-audit-standard-v1.test.mjs
          node --test dist/reasoning-v1/novelty/reasoning-final-audit-standard-v1.test.mjs

          pnpm exec esbuild \
            src/reasoning-v1/tests/rnk-001-controlled-novelty-discovery-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/novelty/rnk-001-controlled-novelty-discovery-v1.test.mjs
          node --test dist/reasoning-v1/novelty/rnk-001-controlled-novelty-discovery-v1.test.mjs

          pnpm exec esbuild \
            src/reasoning-v1/tests/clk-001-controlled-novelty-discovery-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/novelty/clk-001-controlled-novelty-discovery-v1.test.mjs
          node --test dist/reasoning-v1/novelty/clk-001-controlled-novelty-discovery-v1.test.mjs

          pnpm exec esbuild \
            src/reasoning-v1/tests/dir-001-controlled-novelty-discovery-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/novelty/dir-001-controlled-novelty-discovery-v1.test.mjs
          node --test dist/reasoning-v1/novelty/dir-001-controlled-novelty-discovery-v1.test.mjs

          pnpm exec esbuild \
            src/reasoning-v1/tests/blr-001-controlled-novelty-discovery-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/novelty/blr-001-controlled-novelty-discovery-v1.test.mjs
          node --test dist/reasoning-v1/novelty/blr-001-controlled-novelty-discovery-v1.test.mjs

          pnpm exec esbuild \
            src/reasoning-v1/tests/cae-001-controlled-novelty-discovery-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/novelty/cae-001-controlled-novelty-discovery-v1.test.mjs
          node --test dist/reasoning-v1/novelty/cae-001-controlled-novelty-discovery-v1.test.mjs

          pnpm exec esbuild \
            src/reasoning-v1/tests/sif-001-novelty-gate-semantics-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/novelty/sif-001-novelty-gate-semantics-v1.test.mjs
          node --test dist/reasoning-v1/novelty/sif-001-novelty-gate-semantics-v1.test.mjs

          pnpm exec esbuild \
            src/reasoning-v1/tests/sif-001-cp011-row-shape-regression-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/novelty/sif-001-cp011-row-shape-regression-v1.test.mjs
          node --test dist/reasoning-v1/novelty/sif-001-cp011-row-shape-regression-v1.test.mjs
