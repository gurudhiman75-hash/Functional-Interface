name: Reasoning V1 Novelty Governance

on:
  pull_request:
    paths:
      - artifacts/api-server/src/reasoning-v1/shared/reasoning-novelty-governance-v1.ts
      - artifacts/api-server/src/reasoning-v1/tests/reasoning-novelty-governance-v1.test.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-reasoning-novelty-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Prove controlled-novel governance
        working-directory: artifacts/api-server
        run: |
          mkdir -p dist/reasoning-v1/novelty
          pnpm exec esbuild             src/reasoning-v1/tests/reasoning-novelty-governance-v1.test.ts             --bundle --platform=node --format=esm             --outfile=dist/reasoning-v1/novelty/reasoning-novelty-governance-v1.test.mjs
          node --test dist/reasoning-v1/novelty/reasoning-novelty-governance-v1.test.mjs
