name: Validate NUM-CP-002 Wave 01 foundation

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-002/**
      - .github/workflows/num-001-cp002-wave01.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp002-wave01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp002-wave01:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle CP002 Wave01 authority
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-002/wave01/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp002-wave01-authority.test.mjs

      - name: Run CP002 Wave01 authority
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/num-cp002-wave01-authority.test.mjs 2>&1 | tee dist/quant-v4/num-cp002-wave01-authority.log

      - name: Bundle CP001 permanent runtime regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/permanent/runtime-proof.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp002-wave01-cp001-regression.test.mjs

      - name: Run CP001 permanent runtime regression
        run: node artifacts/api-server/dist/quant-v4/num-cp002-wave01-cp001-regression.test.mjs

      - name: Upload CP002 Wave01 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: num-001-cp002-wave01-foundation
          path: |
            artifacts/api-server/dist/quant-v4/num-cp002-wave01-authority.log
            artifacts/api-server/dist/quant-v4/num-cp002-wave01/num-cp002-wave01-review.json
            artifacts/api-server/dist/quant-v4/num-cp002-wave01/num-cp002-wave01-review.md
          if-no-files-found: warn
          retention-days: 14
