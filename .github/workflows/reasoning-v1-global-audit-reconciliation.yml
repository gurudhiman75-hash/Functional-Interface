name: Validate Reasoning V1 global audit reconciliation

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/**"
      - ".github/workflows/reasoning-v1-global-audit-reconciliation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run current implemented Reasoning global audit reconciliation
        working-directory: artifacts/api-server
        run: pnpm exec tsx src/reasoning-v1/tests/reasoning-v1-global-final-audit-reconciliation-20261003.test.ts
