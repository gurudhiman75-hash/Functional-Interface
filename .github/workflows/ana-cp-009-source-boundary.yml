name: Validate ANA-CP-009 source boundary

on:
  push:
    branches:
      - feat/ana-cp009-source-boundary
      - feat/ana-cp009-coupled-invariant-proof
      - feat/ana-cp009-legacy-allocation-audit
      - feat/ana-cp009-conditional-admission-gate
      - feat/ana-cp009-changing-vector-canonicalization
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-009/**
      - .github/workflows/ana-cp-009-source-boundary.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-009/**
      - .github/workflows/ana-cp-009-source-boundary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-009 -name '*.ts' -print)
      - name: Run source ownership audit
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-009/provisional-source-boundary.test.ts
      - name: Run coupled-invariant ambiguity proof
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-009/provisional-coupled-invariant-pilot.test.ts
      - name: Run legacy allocation boundary audit
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-009/legacy-allocation-boundary.test.ts
      - name: Run conditional-branch admission gate
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-009/conditional-branch-admission.test.ts
      - name: Run changing-vector canonicalization audit
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-009/provisional-changing-vector-canonicalization.test.ts
