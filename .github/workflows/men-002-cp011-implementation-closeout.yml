name: Validate MEN-CP-011 implementation closeout

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/implementation-closeout*.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/source-normalisation-readiness-v5.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/*.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-011/MEN-CP-011-IMPLEMENTATION-CLOSEOUT-V1.md
      - .github/workflows/men-002-cp011-implementation-closeout.yml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-002-cp011-implementation-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-implementation-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove implementation completion and activation locks
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/implementation-closeout.test.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/men-cp011-implementation-closeout.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp011-implementation-closeout.test.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/men-cp011-implementation-closeout.test.log

      - name: Export final implementation evidence
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/implementation-closeout-export.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/men-cp011-implementation-closeout-export.mjs
          cd artifacts/api-server
          node dist/quant-v4/men-cp011-implementation-closeout-export.mjs \
            2>&1 | tee dist/quant-v4/men-cp011-implementation-closeout-export.log

      - name: Build production API bundle
        shell: bash
        run: bash build-api.sh

      - name: Upload implementation closeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-cp011-implementation-closeout-v1
          path: |
            artifacts/api-server/dist/quant-v4/men-cp011-implementation-closeout.test.log
            artifacts/api-server/dist/quant-v4/men-cp011-implementation-closeout-export.log
            artifacts/api-server/dist/quant-v4/men-cp011-implementation-closeout-v1.json
            artifacts/api-server/dist/quant-v4/men-cp011-implementation-closeout-v1.md
          if-no-files-found: error
          retention-days: 14
