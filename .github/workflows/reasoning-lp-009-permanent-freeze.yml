name: Reasoning LP-009 Permanent English Freeze

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-009*"
      - "artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/LP-009-*"
      - "artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/README.md"
      - ".github/workflows/reasoning-lp-009-permanent-freeze.yml"
  workflow_dispatch:

jobs:
  lp009-permanent-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run LP-009 source and solver proof
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-009.test.ts

      - name: Enforce approved English V2 explanation contract
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-009-explanation-quality-v2.test.ts

      - name: Enforce permanent QL allocation and English Freeze V1
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-009-permanent-freeze.test.ts

      - name: Verify LP-009 Question Studio review-only boundary
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-009-question-studio.test.ts

      - name: Run Logic Puzzle difficulty calibration regression
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/difficulty-calibration.test.ts
