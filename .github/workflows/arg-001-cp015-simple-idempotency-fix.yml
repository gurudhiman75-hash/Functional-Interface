name: ARG-001 CP015 simple repair idempotency fix

on:
  push:
    branches:
      - feature/arg-001-cp012-editorial-remediation
    paths:
      - .github/workflows/arg-001-cp015-simple-idempotency-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arg-001-cp012-editorial-remediation
          fetch-depth: 0
      - name: Make Hindi permanence reroute idempotent
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/arg-cp015-hindi-naturalness-hotfix.py')
          text = path.read_text(encoding='utf-8')
          old = '''if new_finalizer not in source:
              count = source.count(old_finalizer)
              if count != 1:
                  raise SystemExit(f"Hindi QL003 forced permanence reroute: expected one finalizer anchor, found {count}")
              source = source.replace(old_finalizer, new_finalizer, 1)
          '''
          new = '''if 'const forceHindiTimeSlotPermanence = language === "hi"' not in source:
              count = source.count(old_finalizer)
              if count != 1:
                  raise SystemExit(f"Hindi QL003 forced permanence reroute: expected one finalizer anchor, found {count}")
              source = source.replace(old_finalizer, new_finalizer, 1)
          '''
          if new in text:
              raise SystemExit('Hindi permanence idempotency guard already present')
          if text.count(old) != 1:
              raise SystemExit(f'expected one Hindi permanence block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/arg-cp015-hindi-naturalness-hotfix.py
          git commit -m "fix(arg-cp015): make Hindi permanence repair idempotent"
          git push origin HEAD:feature/arg-001-cp012-editorial-remediation
