name: Validate MEN-CP-007 Indian editorial production

on:
  pull_request:
    branches:
      - feat/men-002-cp007-gap-wave-03
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/**
      - artifacts/api-server/src/quant-v4/EXAMTREE-MOCK-TEST-CONTENT-QUALITY-AUTHORITY.md
      - .github/workflows/men-cp007-indian-editorial-production.yml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-cp007-indian-editorial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle all CP-007 regression tests
        shell: bash
        run: |
          set -euo pipefail
          base=src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002
          out=dist/quant-v4
          pnpm --dir artifacts/api-server exec esbuild "$base/foundation/runtime.test.ts" --bundle --platform=node --format=esm --outfile="$out/men-cp007-foundation.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$base/gap-wave-01/runtime.test.ts" --bundle --platform=node --format=esm --outfile="$out/men-cp007-wave01.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$base/gap-wave-02/runtime.test.ts" --bundle --platform=node --format=esm --outfile="$out/men-cp007-wave02.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$base/gap-wave-03/runtime.test.ts" --bundle --platform=node --format=esm --outfile="$out/men-cp007-wave03.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$base/MEN-CP-007/men-cp-007-production-audit.ts" --bundle --platform=node --format=esm --outfile="$out/men-cp007-production-audit.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$base/MEN-CP-007/men-cp-007-production-review-export.ts" --bundle --platform=node --format=esm --outfile="$out/men-cp007-production-review-export.mjs"

      - name: Run all CP-007 regression and editorial gates
        shell: bash
        run: |
          set -o pipefail
          out=artifacts/api-server/dist/quant-v4
          node "$out/men-cp007-foundation.test.mjs" 2>&1 | tee "$out/men-cp007-foundation.log"
          node "$out/men-cp007-wave01.test.mjs" 2>&1 | tee "$out/men-cp007-wave01.log"
          node "$out/men-cp007-wave02.test.mjs" 2>&1 | tee "$out/men-cp007-wave02.log"
          node "$out/men-cp007-wave03.test.mjs" 2>&1 | tee "$out/men-cp007-wave03.log"
          node "$out/men-cp007-production-audit.mjs" 2>&1 | tee "$out/men-cp007-production-audit.log"

      - name: Generate complete hardened review pack
        working-directory: artifacts/api-server
        run: node dist/quant-v4/men-cp007-production-review-export.mjs

      - name: Run exact Render production build
        id: render_build
        shell: bash
        run: |
          set +e
          bash build-api.sh > artifacts/api-server/dist/quant-v4/men-cp007-indian-editorial-render-build.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enforce Render production build
        shell: bash
        run: |
          cat artifacts/api-server/dist/quant-v4/men-cp007-indian-editorial-render-build.log
          test "${{ steps.render_build.outputs.exit_code }}" = "0"
          test -f artifacts/api-server/dist/index.mjs
          test -f artifacts/examtree/dist/public/index.html
          test -f artifacts/examtree/dist/public/admin/index.html

      - name: Upload hardened review and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-cp007-indian-editorial-production-review
          path: |
            artifacts/api-server/dist/quant-v4/men-cp007-foundation.log
            artifacts/api-server/dist/quant-v4/men-cp007-wave01.log
            artifacts/api-server/dist/quant-v4/men-cp007-wave02.log
            artifacts/api-server/dist/quant-v4/men-cp007-wave03.log
            artifacts/api-server/dist/quant-v4/men-cp007-production-audit.log
            artifacts/api-server/dist/quant-v4/men-cp007-indian-editorial-render-build.log
            artifacts/api-server/dist/quant-v4/men-002-cp007-production-review/**
          if-no-files-found: error
          retention-days: 14
