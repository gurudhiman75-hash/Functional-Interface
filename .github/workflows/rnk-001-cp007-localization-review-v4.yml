name: Validate RNK-001 CP007 Native Editorial V4 + Percentage Adapter V2

on:
  push:
    branches:
      - fix/rnk-cp007-native-editorial-v2
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/**'
      - '.github/workflows/rnk-001-cp007-localization-review-v4.yml'
  pull_request:
    branches:
      - New-main
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/**'
      - '.github/workflows/rnk-001-cp007-localization-review-v4.yml'
  workflow_dispatch:

concurrency:
  group: rnk-001-cp007-native-editorial-v4-percentage-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-rnk-cp007-native-editorial-v4-percentage-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Prove V4 native batch-genitive repair and semantic invariance
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-007/cp007-localization-review-v4.test.ts

      - name: Re-prove V3 feminine count agreement baseline
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-007/cp007-localization-review-v3.test.ts

      - name: Re-prove V2 native grammar baseline
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-007/cp007-localization-review-v2.test.ts

      - name: Re-prove QL042 percentage semantic adapter V1
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-007/cp007-percentage-presentation-adapter-v1.test.ts

      - name: Prove QL042 percentage native grammar V2
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-007/cp007-percentage-presentation-adapter-v2.test.ts

      - name: Generate V4 human-review pack
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-007/cp007-localization-review-export-v4.ts /tmp/RNK-CP-007-HI-PA-LOCALIZATION-REVIEW-V4-64Q.md

      - name: Retain V4 human-review pack
        uses: actions/upload-artifact@v4
        with:
          name: rnk-cp007-hi-pa-native-editorial-v4-64q
          path: /tmp/RNK-CP-007-HI-PA-LOCALIZATION-REVIEW-V4-64Q.md
          if-no-files-found: error

      - name: Generate percentage-adapter V2 learner-review pack
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-007/cp007-percentage-presentation-export-v2.ts /tmp/RNK-CP-007-PERCENTAGE-PRESENTATION-ADAPTER-V2.md

      - name: Retain percentage-adapter V2 learner-review pack
        uses: actions/upload-artifact@v4
        with:
          name: rnk-cp007-percentage-presentation-adapter-v2
          path: /tmp/RNK-CP-007-PERCENTAGE-PRESENTATION-ADAPTER-V2.md
          if-no-files-found: error

      - name: Re-prove V1 semantic-parity baseline
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-007/cp007-localization-review-v1.test.ts

      - name: Re-prove CP007 frozen English runtime
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-007/cp007-permanent-runtime-v1-freeze.test.ts

      - name: Re-prove chapter-wide English closure
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/rnk-001-chapter-wide-english-content-freeze-v1.test.ts

      - name: Re-prove Ranking Object Pool V2
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/foundation/rnk-object-pool-v2.test.ts

      - name: Re-prove derived Ranking Object Pool V2
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/foundation/rnk-derived-object-pool-v2.test.ts

      - name: Build API server
        run: pnpm --dir artifacts/api-server build
