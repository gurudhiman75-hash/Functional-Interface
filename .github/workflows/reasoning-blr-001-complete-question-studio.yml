name: Reasoning BLR-001 Complete Question Studio

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/**"
      - "artifacts/api-server/src/routes/admin-question-studio-reasoning-blr-chapter.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-reasoning-cp006.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-reasoning.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - ".github/workflows/reasoning-blr-001-complete-question-studio.yml"
  push:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/**"
      - "artifacts/api-server/src/routes/admin-question-studio-reasoning-blr-chapter.ts"
      - "artifacts/api-server/src/routes/index.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-complete-chapter:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove complete BLR Question Studio adapter
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/question-studio-chapter-adapter.test.ts
      - name: Regress CP-001 runtime
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-001/cp001-runtime.test.ts
      - name: Regress CP-002 runtime
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-002/cp002-runtime.test.ts
      - name: Regress CP-003 frozen runtime
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-final-discovery-freeze.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-permanent-runtime.test.ts
      - name: Regress CP-004 runtime
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-004/cp004-runtime.test.ts
      - name: Regress CP-005 runtime
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-005/cp005-runtime.test.ts
      - name: Regress CP-006 runtime
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-006/cp006-runtime.test.ts
      - name: Regress CP-007 production adapter
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/question-studio-review-adapter.test.ts
      - name: Typecheck admin application
        run: pnpm --dir artifacts/admin-app typecheck
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
