name: Validate PNL CP-003 dynamic candidate runtime

on:
  push:
    branches:
      - feat/pnl-001-cp003-dynamic-runtime
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-*.ts"
      - ".github/workflows/validate-pnl-cp003-dynamic-runtime.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-*.ts"
      - ".github/workflows/validate-pnl-cp003-dynamic-runtime.yml"

permissions:
  contents: write

jobs:
  validate-cp003-dynamic-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature source
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-cp003-dynamic-runtime

      - name: Keep damaged-stock unit recovery exact
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-cases.ts")
          source = path.read_text()
          old = '{ total: 100n, damaged: 25n, cost: 120, recovery: 40, target: 10 },'
          new = '{ total: 100n, damaged: 25n, cost: 120, recovery: 120, target: 10 },'
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit("damaged-stock preset was not found")
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle dynamic runtime proof
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-runtime.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/.cp003-dynamic-runtime.test.mjs \
            2>&1 | tee pnl-cp003-dynamic-runtime.log

      - name: Run 24-QL seed-sweep proof
        run: |
          set -o pipefail
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/.cp003-dynamic-runtime.test.mjs \
            2>&1 | tee -a pnl-cp003-dynamic-runtime.log

      - name: Commit proven correction
        run: |
          if git diff --quiet -- artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-cases.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-cases.ts
          git commit -m "fix(pnl): keep CP-003 damaged-stock pricing exact"
          git push origin HEAD:feat/pnl-001-cp003-dynamic-runtime

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnl-cp003-dynamic-runtime-proof
          path: pnl-cp003-dynamic-runtime.log
          if-no-files-found: error
          retention-days: 7
