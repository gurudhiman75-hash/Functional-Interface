name: Validate PNL CP-003 dynamic candidate runtime

on:
  push:
    branches:
      - feat/pnl-001-cp003-dynamic-runtime
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-*.ts"
      - ".github/workflows/validate-pnl-cp003-dynamic-runtime.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-*.ts"
      - ".github/workflows/validate-pnl-cp003-dynamic-runtime.yml"

permissions:
  contents: write

jobs:
  validate-cp003-dynamic-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature source
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-cp003-dynamic-runtime

      - name: Enforce exact inverse generation domains
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-cases.ts")
          source = path.read_text()

          old = '{ total: 100n, damaged: 25n, cost: 120, recovery: 40, target: 10 },'
          new = '{ total: 100n, damaged: 25n, cost: 120, recovery: 120, target: 10 },'
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit("damaged-stock preset was not found")

          start = source.index('case "PNL-QL-079":')
          end = source.index('case "PNL-QL-080":', start)
          current = source[start:end]
          if "quantityPreset" not in current:
              replacement = '''case "PNL-QL-079": {
                const quantityPreset = pickSeeded(
                  random,
                  [
                    { fixedQuantity: 10n, fixedRate: 10, unknownQuantity: 20n, unknownRate: 40 },
                    { fixedQuantity: 20n, fixedRate: 40, unknownQuantity: 10n, unknownRate: 10 },
                    { fixedQuantity: 10n, fixedRate: 20, unknownQuantity: 40n, unknownRate: 40 },
                  ] as const,
                );
                const commonUnitCost = rupees(pickSeeded(random, [100, 200] as const));
                const fixedGroups = [
                  {
                    quantity: quantityPreset.fixedQuantity,
                    unitCostPrice: commonUnitCost,
                    direction: "PROFIT" as const,
                    ratePercent: rational(quantityPreset.fixedRate),
                  },
                ];
                const unknownQuantity = quantityPreset.unknownQuantity;
                const unknownUnitCostPrice = commonUnitCost;
                const unknownDirection = "PROFIT" as const;
                const unknownRatePercent = rational(quantityPreset.unknownRate);
                const complete = solveInventoryAdvanced({
                  mode: "GROUP_RATES_TO_OVERALL_RESULT",
                  groups: [
                    ...fixedGroups,
                    {
                      quantity: unknownQuantity,
                      unitCostPrice: unknownUnitCostPrice,
                      direction: unknownDirection,
                      ratePercent: unknownRatePercent,
                    },
                  ],
                });
                const target = overallTargetFromGroupResult(complete);
                return {
                  qlId,
                  registry,
                  seed: seedValue,
                  request: {
                    mode: "UNKNOWN_GROUP_QUANTITY_FOR_TARGET",
                    fixedGroups,
                    unknownUnitCostPrice,
                    unknownDirection,
                    unknownRatePercent,
                    targetDirection: target.direction,
                    targetRatePercent: target.ratePercent,
                  },
                  context: {
                    fixedGroups: fixedGroups.map((group, index) =>
                      groupRow(
                        `Fixed group ${index + 1}`,
                        group.quantity,
                        group.unitCostPrice,
                        group.direction,
                        group.ratePercent,
                      ),
                    ),
                    unknownUnitCostPrice: cp003PlainMoney(unknownUnitCostPrice),
                    unknownDirection: unknownDirection.toLowerCase(),
                    unknownRatePercent: cp003FormatRational(unknownRatePercent),
                    targetDirection: target.direction.toLowerCase(),
                    targetRatePercent: cp003FormatRational(target.ratePercent),
                  },
                };
              }

              '''
              source = source[:start] + replacement + source[end:]

          start = source.index('case "PNL-QL-084":')
          end = source.index('case "PNL-QL-085":', start)
          current = source[start:end]
          if "equalRatePercent" not in current:
              replacement = '''case "PNL-QL-084": {
                const equalRatePercent = rational(pickSeeded(random, [20, 25] as const));
                const knownDirection = pickSeeded(random, ["PROFIT", "LOSS"] as const);
                const unknownDirection = knownDirection === "PROFIT" ? "LOSS" : "PROFIT";
                const knownRatePercent = equalRatePercent;
                const unknownRatePercent = equalRatePercent;
                const forward = solveInventory({
                  mode: "EQUAL_SP_TWO_ARTICLES_TO_OVERALL_RATE",
                  commonSellingPrice: rupees(1200),
                  firstDirection: knownDirection,
                  firstRatePercent: knownRatePercent,
                  secondDirection: unknownDirection,
                  secondRatePercent: unknownRatePercent,
                });
                if (forward.direction === "NO_CHANGE") {
                  throw new Error(`${qlId}: generated equal-SP inverse has no overall direction.`);
                }
                return {
                  qlId,
                  registry,
                  seed: seedValue,
                  request: {
                    mode: "EQUAL_SP_ONE_RATE_FROM_OVERALL",
                    knownDirection,
                    knownRatePercent,
                    unknownDirection,
                    targetDirection: forward.direction,
                    targetRatePercent: forward.ratePercent,
                  },
                  context: {
                    knownDirection: knownDirection.toLowerCase(),
                    knownRatePercent: cp003FormatRational(knownRatePercent),
                    unknownDirection: unknownDirection.toLowerCase(),
                    targetDirection: forward.direction.toLowerCase(),
                    targetRatePercent: cp003FormatRational(forward.ratePercent),
                  },
                  expectedDirection: unknownDirection,
                };
              }

              '''
              source = source[:start] + replacement + source[end:]

          path.write_text(source)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize CP-003 runtime sources
        run: |
          pnpm exec prettier --write \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-cases.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-runtime.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-runtime.test.ts

      - name: Bundle dynamic runtime proof
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-runtime.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/.cp003-dynamic-runtime.test.mjs \
            2>&1 | tee pnl-cp003-dynamic-runtime.log

      - name: Run 24-QL seed-sweep proof
        run: |
          set -o pipefail
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/.cp003-dynamic-runtime.test.mjs \
            2>&1 | tee -a pnl-cp003-dynamic-runtime.log

      - name: Commit proven corrections
        run: |
          if git diff --quiet -- \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-cases.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-runtime.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-runtime.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-cases.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-runtime.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-runtime.test.ts
          git commit -m "fix(pnl): enforce CP-003 exact inverse domains"
          git push origin HEAD:feat/pnl-001-cp003-dynamic-runtime

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnl-cp003-dynamic-runtime-proof
          path: pnl-cp003-dynamic-runtime.log
          if-no-files-found: error
          retention-days: 7
