name: Validate PNL CP-003 dynamic candidate runtime

on:
  push:
    branches:
      - feat/pnl-001-cp003-dynamic-runtime
    paths:
      - ".github/workflows/validate-pnl-cp003-dynamic-runtime.yml"

permissions:
  contents: write

jobs:
  apply-proven-corrections:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature source
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-cp003-dynamic-runtime

      - name: Apply exact and uniquely recoverable domains
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          cases_path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-cases.ts")
          source = cases_path.read_text()
          source = source.replace(
              '{ total: 100n, damaged: 25n, cost: 120, recovery: 40, target: 10 },',
              '{ total: 100n, damaged: 25n, cost: 120, recovery: 120, target: 10 },',
              1,
          )

          start = source.index('case "PNL-QL-079":')
          end = source.index('case "PNL-QL-080":', start)
          block = source[start:end]
          if "quantityPreset" not in block:
              pattern = r'''const fixedGroups = \[makeGroups\(random\)\[0\]!\];\s*const unknownQuantity = pickSeeded\(random, \[10n, 20n, 40n\] as const\);\s*const unknownUnitCostPrice = rupees\(pickNumber\(random, UNIT_COSTS\)\);\s*const unknownDirection = pickDirection\(random\);\s*const unknownRatePercent = rational\(pickNumber\(random, \[10, 20, 25\] as const\)\);'''
              replacement = '''const quantityPreset = pickSeeded(
                random,
                [
                  { fixedQuantity: 10n, fixedRate: 10, unknownQuantity: 20n, unknownRate: 40 },
                  { fixedQuantity: 20n, fixedRate: 40, unknownQuantity: 10n, unknownRate: 10 },
                  { fixedQuantity: 10n, fixedRate: 20, unknownQuantity: 40n, unknownRate: 40 },
                ] as const,
              );
              const commonUnitCost = rupees(pickSeeded(random, [100, 200] as const));
              const fixedGroups = [
                {
                  quantity: quantityPreset.fixedQuantity,
                  unitCostPrice: commonUnitCost,
                  direction: "PROFIT" as const,
                  ratePercent: rational(quantityPreset.fixedRate),
                },
              ];
              const unknownQuantity = quantityPreset.unknownQuantity;
              const unknownUnitCostPrice = commonUnitCost;
              const unknownDirection = "PROFIT" as const;
              const unknownRatePercent = rational(quantityPreset.unknownRate);'''
              block, count = re.subn(pattern, replacement, block, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit("QL-079 generation block was not found")
              source = source[:start] + block + source[end:]

          start = source.index('case "PNL-QL-084":')
          end = source.index('case "PNL-QL-085":', start)
          block = source[start:end]
          if "equalRatePercent" not in block:
              pattern = r'''const knownDirection = pickDirection\(random\);\s*const unknownDirection = pickDirection\(random\);\s*const knownRatePercent = rational\(pickSeeded\(random, \[10, 20, 25\] as const\)\);\s*const unknownRatePercent = rational\(pickSeeded\(random, \[10, 20, 25\] as const\)\);'''
              replacement = '''const equalRatePercent = rational(pickSeeded(random, [20, 25] as const));
              const knownDirection = pickSeeded(random, ["PROFIT", "LOSS"] as const);
              const unknownDirection = knownDirection === "PROFIT" ? "LOSS" : "PROFIT";
              const knownRatePercent = equalRatePercent;
              const unknownRatePercent = equalRatePercent;'''
              block, count = re.subn(pattern, replacement, block, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit("QL-084 generation block was not found")
              source = source[:start] + block + source[end:]

          cases_path.write_text(source)

          runtime_path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-runtime.ts")
          runtime = runtime_path.read_text()
          start = runtime.index('case "EQUAL_SP_ONE_RATE_FROM_OVERALL":')
          end = runtime.index('case "TOTAL_SP_AND_OVERALL_RATE_TO_TOTAL_CP":', start)
          block = runtime[start:end]
          if "knownRatePercent)) < 0.01" not in block:
              replacement = '''case "EQUAL_SP_ONE_RATE_FROM_OVERALL": {
                if (!("unknownRatePercent" in result) || !generated.expectedDirection) return false;
                return (
                  Math.abs(
                    rationalToNumber(result.unknownRatePercent) -
                      rationalToNumber(request.knownRatePercent),
                  ) < 0.01
                );
              }

              '''
              runtime = runtime[:start] + replacement + runtime[end:]
          runtime_path.write_text(runtime)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies and format
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-cases.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-runtime.ts

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-cases.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-003/cp003-dynamic-runtime.ts
          git commit -m "fix(pnl): enforce CP-003 exact inverse domains"
          git push origin HEAD:feat/pnl-001-cp003-dynamic-runtime
