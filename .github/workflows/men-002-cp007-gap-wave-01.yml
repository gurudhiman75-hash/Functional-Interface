name: Validate MEN-CP-007 gap wave 01

on:
  pull_request:
    branches:
      - design/men-002-end-to-end-discovery
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-01/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/foundation/**
      - .github/workflows/men-002-cp007-gap-wave-01.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-002-cp007-wave01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-men-cp007-wave01:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle foundation regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/foundation/runtime.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/men-002-cp007-foundation-regression.test.mjs

      - name: Run foundation regression
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/men-002-cp007-foundation-regression.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/men-002-cp007-foundation-regression.log

      - name: Bundle gap-wave proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-01/runtime.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/men-002-cp007-gap-wave-01.test.mjs

      - name: Run gap-wave proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/men-002-cp007-gap-wave-01.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/men-002-cp007-gap-wave-01.log

      - name: Bundle review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-01/review-export.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/men-002-cp007-gap-wave-01-review-export.mjs

      - name: Generate review export
        working-directory: artifacts/api-server
        run: node dist/quant-v4/men-002-cp007-gap-wave-01-review-export.mjs

      - name: Upload proof and review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-002-cp007-gap-wave-01
          path: |
            artifacts/api-server/dist/quant-v4/men-002-cp007-foundation-regression.log
            artifacts/api-server/dist/quant-v4/men-002-cp007-gap-wave-01.log
            artifacts/api-server/dist/quant-v4/men-002-cp007-gap-wave-01-review/**
          if-no-files-found: error
          retention-days: 7
