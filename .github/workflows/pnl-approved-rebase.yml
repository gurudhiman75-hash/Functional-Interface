name: Rebase approved PNL integration

on:
  pull_request:
    paths:
      - ".github/workflows/pnl-approved-rebase.yml"

permissions:
  contents: write

jobs:
  rebase:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-standalone-multilingual-dynamic-completion
          fetch-depth: 0

      - name: Merge latest New-main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin New-main
          git merge --no-edit origin/New-main
          git push origin HEAD:feat/pnl-001-standalone-multilingual-dynamic-completion
