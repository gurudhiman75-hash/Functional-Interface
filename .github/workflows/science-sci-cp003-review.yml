name: Validate SCI-CP-003 Review

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/science/work-energy-power/**"
      - ".github/workflows/science-sci-cp003-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sci-cp003-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp003:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run SCI-CP-003 qualification gate
        run: |
          mkdir -p artifacts/api-server/dist/science
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/science/work-energy-power/sci-cp003-review-v1.test.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/science/sci-cp003-review-v1.test.mjs
          node artifacts/api-server/dist/science/sci-cp003-review-v1.test.mjs
      - name: Materialize SCI-CP-003 review artifact
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/science/work-energy-power/sci-cp003-export-review-v1.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/science/sci-cp003-export-review-v1.mjs
          cd artifacts/api-server
          node dist/science/sci-cp003-export-review-v1.mjs
      - name: Upload SCI-CP-003 review artifact
        uses: actions/upload-artifact@v4
        with:
          name: SCI-CP-003-REVIEW-V1
          path: artifacts/api-server/dist/science-review/SCI-CP-003-V1/
          if-no-files-found: error
          retention-days: 30
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
