name: Validate MAL-CP-004 permanent English Wave 06

on:
  pull_request:
    branches:
      - New-main
    paths:
      - ".github/workflows/mal-cp004-permanent-english-wave06.yml"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mal-cp004-permanent-english-wave06:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle MAL-CP-004 Wave 06 audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-cp004-permanent-english-wave06-audit.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/quant-v4/mal-001-cp004-permanent-english-wave06-audit.mjs

      - name: Run MAL-CP-004 Wave 06 audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/mal-001-cp004-permanent-english-wave06-audit.mjs 2>&1 | tee dist/quant-v4/mal-001-cp004-permanent-english-wave06-audit.log

      - name: Upload MAL-CP-004 Wave 06 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mal-cp004-wave06-permanent-english
          path: |
            artifacts/api-server/dist/quant-v4/mal-001-cp004-permanent-english-wave06-audit.log
            artifacts/api-server/dist/quant-v4/mal-cp004-wave06-permanent-english.json
            artifacts/api-server/dist/quant-v4/mal-cp004-wave06-permanent-english.md
          if-no-files-found: error
          retention-days: 14
