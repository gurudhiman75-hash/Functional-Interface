name: ARG-001 CP015 English naturalness final pass

on:
  push:
    branches:
      - feature/arg-001-cp012-editorial-remediation
    paths:
      - .github/workflows/arg-001-cp015-english-naturalness-final-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arg-001-cp012-editorial-remediation
          fetch-depth: 0
      - name: Add final English naturalness repairs and guards
        run: |
          python - <<'PY'
          from pathlib import Path

          repair_path = Path('scripts/arg-cp015-final-editorial-integration-repair.py')
          text = repair_path.read_text(encoding='utf-8')
          old_pair = '''english_naturalness_repairs = [
              ('.replace(/\\\\bin school closing time\\\\b/gi, "during school closing time")', 'school-closing-time preposition'),
              ('.replace(/\\\\bon the first week of each month\\\\b/gi, "in the first week of each month")', 'first-week preposition'),
          ]'''
          new_trio = '''english_naturalness_repairs = [
              ('.replace(/\\\\bin school closing time\\\\b/gi, "during school closing time")', 'school-closing-time preposition'),
              ('.replace(/\\\\bon the first week of each month\\\\b/gi, "in the first week of each month")', 'first-week preposition'),
              ('.replace(/\\\\bcitizens reaching near closing time\\\\b/gi, "citizens arriving near closing time")', 'closing-time arrival wording'),
          ]'''
          if 'closing-time arrival wording' not in text:
              if text.count(old_pair) != 1:
                  raise SystemExit(f'expected one English naturalness repair list, found {text.count(old_pair)}')
              text = text.replace(old_pair, new_trio, 1)
              repair_path.write_text(text, encoding='utf-8')

          proof_path = Path('artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-anti-gaming-grammar-proof.test.ts')
          proof = proof_path.read_text(encoding='utf-8')
          anchor = '    /\\bon the first week of each month\\b/i,\n'
          guard = '    /\\bcitizens reaching near closing time\\b/i,\n'
          if guard.strip() not in proof:
              if proof.count(anchor) != 1:
                  raise SystemExit(f'expected one English first-week guard, found {proof.count(anchor)}')
              proof = proof.replace(anchor, anchor + guard, 1)
              proof_path.write_text(proof, encoding='utf-8')
          PY
      - name: Commit final English naturalness guards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/arg-cp015-final-editorial-integration-repair.py artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-anti-gaming-grammar-proof.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(arg-cp015): extend final English naturalness hardening"
          git push origin HEAD:feature/arg-001-cp012-editorial-remediation
