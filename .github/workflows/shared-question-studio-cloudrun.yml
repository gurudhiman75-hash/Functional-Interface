name: Validate shared Question Studio Cloud Run compute
on:
  pull_request:
    branches: [New-main]
    paths:
      - "artifacts/api-server/src/question-studio/num001-generation-worker.ts"
      - "artifacts/api-server/build-shared-worker.mjs"
      - "artifacts/api-server/shared-question-studio-worker-service.mjs"
      - "artifacts/api-server/src/routes/admin-question-studio-num001-remote.ts"
      - "artifacts/api-server/src/question-studio/remote-shared-studio-client.ts"
      - "Dockerfile.question-studio-shared"
      - "scripts/deploy-shared-question-studio-staging.sh"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Question Studio graph
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile --filter @workspace/api-server...
      - name: Validate service protocol and source route contracts
        run: |
          node --test artifacts/api-server/tests/shared-question-studio-worker-service.test.mjs
          node --test tests/shared-studio-architecture.test.mjs
      - name: Bundle TRG-002 and NUM-001 worker authorities
        run: node artifacts/api-server/build-shared-worker.mjs
      - name: Smoke generate NUM-001 and TRG-002 one-question batches
        env:
          QUESTION_STUDIO_WORKER_TOKEN: test-only-not-a-real-production-secret-123456789012
        run: |
          # Match Docker's /dist layout exactly: worker bundles are adjacent
          # to the service entrypoint when deployed.
          cp artifacts/api-server/shared-question-studio-worker-service.mjs artifacts/api-server/dist/shared-question-studio-worker-service.mjs
          node artifacts/api-server/dist/shared-question-studio-worker-service.mjs > /tmp/shared-studio-worker.log 2>&1 &
          PID=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "Shared worker failed. Response:"; cat /tmp/shared-batch.json 2>/dev/null || true; echo "Worker log:"; tail -n 55 /tmp/shared-studio-worker.log; fi; kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl --silent --fail http://localhost:8080/health >/dev/null; then break; fi
            sleep 1
          done
          for PKG in TRG-002 NUM-001; do
            if [ "$PKG" = TRG-002 ]; then
              CP=TRG-CP-007
              SUBTOPIC="Trigonometry — Heights & Distances"
              TOPIC="Advanced Mathematics"
              MODE=RELEASED
              DIFF=Medium
            else
              CP=NUM-CP-001
              TOPIC="Arithmetic"
              SUBTOPIC="Number System"
              MODE=QUESTION_STUDIO_ACTIVE
              DIFF=Mixed
            fi
            PAYLOAD="$(PKG="$PKG" CP="$CP" SUBTOPIC="$SUBTOPIC" TOPIC="$TOPIC" MODE="$MODE" DIFF="$DIFF" node -e 'console.log(JSON.stringify({request:{engineId:"quant-v4",packageId:process.env.PKG,count:1,exam:"SSC CGL Tier 1",subject:"Quantitative Aptitude",topic:process.env.TOPIC,subtopic:process.env.SUBTOPIC,language:"en",difficulty:process.env.DIFF,runtimeMode:process.env.MODE,seed:"ci-shared-"+process.env.PKG},selectedCpIds:[process.env.CP],count:1}))')"
            curl --fail-with-body --silent --show-error --max-time 155 \
              -H "Content-Type: application/json" \
              -H "X-Examtree-Worker-Token: $QUESTION_STUDIO_WORKER_TOKEN" \
              -d "$PAYLOAD" http://localhost:8080/internal/question-studio/generate > /tmp/shared-batch.json
            node -e 'const o=JSON.parse(require("fs").readFileSync("/tmp/shared-batch.json","utf8"));if(!o.ok||o.batch?.questions?.length!==1)process.exit(2);console.log("PASS: "+o.batch.questions.length+" questions")'
          done
          # Reproduce Cloud Run's exact NUM-001 1/3-question staging seeds.
          # The earlier one-question-only CI used a different seed, so it
          # could not detect a seed-specific NUM-001 generator defect.
          for COUNT in 1 3; do
            PAYLOAD="$(COUNT="$COUNT" node -e 'const n=Number(process.env.COUNT); console.log(JSON.stringify({request:{engineId:"quant-v4",packageId:"NUM-001",count:n,exam:"SSC CGL Tier 1",subject:"Quantitative Aptitude",topic:"Arithmetic",subtopic:"Number System",language:"en",difficulty:"Mixed",runtimeMode:"QUESTION_STUDIO_ACTIVE",seed:"shared-worker-smoke-NUM-001-"+n},selectedCpIds:["NUM-CP-001"],count:n}))')"
            if ! curl --fail-with-body --silent --show-error --max-time 155 \
              -H "Content-Type: application/json" \
              -H "X-Examtree-Worker-Token: $QUESTION_STUDIO_WORKER_TOKEN" \
              -d "$PAYLOAD" http://localhost:8080/internal/question-studio/generate > /tmp/shared-batch.json; then
              node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/shared-batch.json","utf8"));console.error(JSON.stringify({kind:"staging-parity-error",count:Number(process.env.COUNT),code:x.code,error:x.error}))'
              exit 1
            fi
            COUNT="$COUNT" node -e 'const n=Number(process.env.COUNT);const x=JSON.parse(require("fs").readFileSync("/tmp/shared-batch.json","utf8"));if(!x.ok||x.batch?.questions?.length!==n)process.exit(2);console.log("PASS: NUM-001 staging-parity "+n+" questions")'
          done
          # CI normally runs from the repository checkout, which contains
          # source JSON libraries. Cloud Run runs from /app with only the
          # final image assets. Re-test from an empty cwd to find accidentally
          # undeclared runtime dependencies on source files.
          kill "$PID"
          wait "$PID" 2>/dev/null || true
          # Mirror Dockerfile.question-studio-shared: only frozen JSON
          # authority data is present under the production /app-like cwd.
          ISOLATED_ROOT="$(mktemp -d)"
          PNL_SRC="$GITHUB_WORKSPACE/artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          PNL_DST="$ISOLATED_ROOT/artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"
          for CP in CP-001 CP-002 CP-003 CP-004 CP-005 CP-006; do
            mkdir -p "$PNL_DST/$CP"
            cp "$PNL_SRC/$CP/"*.json "$PNL_DST/$CP/"
          done
          (cd "$ISOLATED_ROOT" && PORT=8081 node "$GITHUB_WORKSPACE/artifacts/api-server/dist/shared-question-studio-worker-service.mjs" > /tmp/shared-isolated-worker.log 2>&1) &
          ISOLATED_PID=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "Isolated worker error:"; cat /tmp/isolated-response.json 2>/dev/null || true; tail -n 30 /tmp/shared-isolated-worker.log; fi; kill "$ISOLATED_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:8081/health >/dev/null; then break; fi
            sleep 1
          done
          PAYLOAD="$(node -e 'console.log(JSON.stringify({request:{engineId:"quant-v4",packageId:"NUM-001",count:1,exam:"SSC CGL Tier 1",subject:"Quantitative Aptitude",topic:"Arithmetic",subtopic:"Number System",language:"en",difficulty:"Mixed",runtimeMode:"QUESTION_STUDIO_ACTIVE",seed:"shared-worker-smoke-NUM-001-1"},selectedCpIds:["NUM-CP-001"],count:1}))')"
          if ! curl --fail-with-body --silent --show-error --max-time 155 \
            -H "Content-Type: application/json" \
            -H "X-Examtree-Worker-Token: $QUESTION_STUDIO_WORKER_TOKEN" \
            -d "$PAYLOAD" http://localhost:8081/internal/question-studio/generate > /tmp/isolated-response.json; then
            node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/isolated-response.json","utf8"));console.error(JSON.stringify({kind:"isolated-cwd-num001",code:d.code,error:d.error}))'
            exit 1
          fi
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/isolated-response.json","utf8"));if(!d.ok||d.batch?.questions?.length!==1)process.exit(2);console.log("PASS: isolated cwd NUM-001 question")'

      - name: Build actual Cloud Run final Docker image
        run: |
          # Equivalent excluded files to the gcloud build submission context.
          cp Dockerfile.question-studio-worker.dockerignore .dockerignore
          docker build --file Dockerfile.question-studio-shared --tag examtree-shared-docker-ci .
      - name: Generate NUM-001 inside final image without repository files
        env:
          QUESTION_STUDIO_WORKER_TOKEN: test-only-not-a-real-production-secret-123456789012
        run: |
          set -euo pipefail
          docker run --detach --name examtree-shared-ci \
            --env QUESTION_STUDIO_WORKER_TOKEN \
            --publish 127.0.0.1:18080:8080 \
            examtree-shared-docker-ci
          trap 's=$?; if [ "$s" -ne 0 ]; then echo "Worker failure diagnostic:"; docker logs examtree-shared-ci 2>&1 | tail -n 35; fi; docker rm --force examtree-shared-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/health
          for COUNT in 1 3; do
            PAYLOAD="$(COUNT="$COUNT" node -e 'const n=+process.env.COUNT;console.log(JSON.stringify({request:{engineId:"quant-v4",packageId:"NUM-001",count:n,exam:"SSC CGL Tier 1",subject:"Quantitative Aptitude",topic:"Arithmetic",subtopic:"Number System",language:"en",difficulty:"Mixed",runtimeMode:"QUESTION_STUDIO_ACTIVE",seed:"shared-worker-smoke-NUM-001-"+n},selectedCpIds:["NUM-CP-001"],count:n}))')"
            STATUS="$(curl --silent --show-error --max-time 165 \
              --header 'Content-Type: application/json' \
              --header "X-Examtree-Worker-Token: $QUESTION_STUDIO_WORKER_TOKEN" \
              --data "$PAYLOAD" \
              --output /tmp/shared-docker-response.json \
              --write-out '%{http_code}' \
              http://127.0.0.1:18080/internal/question-studio/generate)"
            if [ "$STATUS" != "200" ]; then
              STATUS="$STATUS" COUNT="$COUNT" node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/shared-docker-response.json","utf8")); console.error(JSON.stringify({kind:"docker-runtime-num001",httpStatus:process.env.STATUS,count:Number(process.env.COUNT),code:d.code||"UNKNOWN",error:d.error||"no message"}))'
              exit 1
            fi
            COUNT="$COUNT" node -e 'const n=Number(process.env.COUNT),d=JSON.parse(require("fs").readFileSync("/tmp/shared-docker-response.json","utf8")); if(!d.ok||d.batch?.questions?.length!==n)process.exit(2);console.log("PASS: Docker image NUM-001 generated "+n+" questions")'
          done
