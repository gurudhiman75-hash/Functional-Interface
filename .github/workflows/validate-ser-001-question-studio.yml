name: Validate SER-001 Question Studio integration

on:
  push:
    branches:
      - salvage/ser-001-clean-integration
    paths:
      - "artifacts/api-server/src/reasoning-v1/**"
      - "artifacts/api-server/src/routes/admin-question-studio-series.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-series-http-contract.test.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-bulk-hardening.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-dashboard-lifecycle.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - "artifacts/api-server/src/lib/admin-question-studio-approval-policy.ts"
      - "artifacts/api-server/src/lib/admin-question-studio-approval-policy.test.ts"
      - "artifacts/admin-app/src/features/question-studio/api.ts"
      - "artifacts/admin-app/src/pages/content/QuestionStudioLivePage.tsx"
      - ".github/workflows/validate-ser-001-question-studio.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/**"
      - "artifacts/api-server/src/routes/admin-question-studio-series.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-series-http-contract.test.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-bulk-hardening.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-dashboard-lifecycle.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - "artifacts/api-server/src/lib/admin-question-studio-approval-policy.ts"
      - "artifacts/api-server/src/lib/admin-question-studio-approval-policy.test.ts"
      - "artifacts/admin-app/src/features/question-studio/api.ts"
      - "artifacts/admin-app/src/pages/content/QuestionStudioLivePage.tsx"
      - ".github/workflows/validate-ser-001-question-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-series-review-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API TypeScript contracts
        id: api_build
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server build 2>&1 | tee api-build.log

      - name: Typecheck admin Question Studio contracts
        id: admin_typecheck
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --dir artifacts/admin-app typecheck 2>&1 | tee admin-typecheck.log

      - name: Prove explicit review-only approval boundary
        id: approval_policy
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          cd artifacts/api-server
          pnpm exec esbuild \
            src/lib/admin-question-studio-approval-policy.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/lib/.admin-question-studio-approval-policy.test.mjs \
            2>&1 | tee "$GITHUB_WORKSPACE/ser-approval-policy.log"
          node src/lib/.admin-question-studio-approval-policy.test.mjs \
            2>&1 | tee -a "$GITHUB_WORKSPACE/ser-approval-policy.log"

      - name: Exercise HTTP auth and multi-domain dispatch
        id: http_contract
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          cd artifacts/api-server
          pnpm exec esbuild \
            src/routes/admin-question-studio-series-http-contract.test.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=src/routes/.admin-question-studio-series-http-contract.test.mjs \
            2>&1 | tee "$GITHUB_WORKSPACE/ser-http-contract.log"
          node src/routes/.admin-question-studio-series-http-contract.test.mjs \
            2>&1 | tee -a "$GITHUB_WORKSPACE/ser-http-contract.log"

      - name: Run 420-payload multilingual Series proof
        id: series_proof
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          cd artifacts/api-server
          pnpm exec esbuild \
            src/reasoning-v1/topics/Series/SER-001/SER-CP-007-QUESTION-STUDIO-INTEGRATION/ser-cp-007-question-studio-integration.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-QUESTION-STUDIO-INTEGRATION/.ser-cp-007-question-studio-integration.test.mjs \
            2>&1 | tee "$GITHUB_WORKSPACE/ser-question-studio-integration.log"
          node src/reasoning-v1/topics/Series/SER-001/SER-CP-007-QUESTION-STUDIO-INTEGRATION/.ser-cp-007-question-studio-integration.test.mjs \
            2>&1 | tee -a "$GITHUB_WORKSPACE/ser-question-studio-integration.log"

      - name: Run PNL canonical-review regression proof
        id: pnl_regression
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          cd artifacts/api-server
          pnpm exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/question-studio-review-runtime.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.question-studio-review-runtime.ser-regression.test.mjs \
            2>&1 | tee "$GITHUB_WORKSPACE/pnl-series-regression.log"
          node src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.question-studio-review-runtime.ser-regression.test.mjs \
            2>&1 | tee -a "$GITHUB_WORKSPACE/pnl-series-regression.log"
          pnpm exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/question-studio-integration.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.question-studio-integration.ser-regression.test.mjs \
            2>&1 | tee -a "$GITHUB_WORKSPACE/pnl-series-regression.log"
          node src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.question-studio-integration.ser-regression.test.mjs \
            2>&1 | tee -a "$GITHUB_WORKSPACE/pnl-series-regression.log"

      - name: Upload merge-gate proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-question-studio-merge-gate
          path: |
            api-build.log
            admin-typecheck.log
            ser-approval-policy.log
            ser-http-contract.log
            ser-question-studio-integration.log
            pnl-series-regression.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce complete merge gate
        if: always()
        env:
          API_BUILD_OUTCOME: ${{ steps.api_build.outcome }}
          ADMIN_TYPECHECK_OUTCOME: ${{ steps.admin_typecheck.outcome }}
          APPROVAL_POLICY_OUTCOME: ${{ steps.approval_policy.outcome }}
          HTTP_CONTRACT_OUTCOME: ${{ steps.http_contract.outcome }}
          SERIES_PROOF_OUTCOME: ${{ steps.series_proof.outcome }}
          PNL_REGRESSION_OUTCOME: ${{ steps.pnl_regression.outcome }}
        run: |
          report_failure() {
            local title="$1"
            local outcome="$2"
            local file="$3"
            if [ "$outcome" = "success" ]; then
              return
            fi
            local message="${title} ended with outcome ${outcome}."
            if [ -f "$file" ]; then
              message="$(tail -n 80 "$file")"
            fi
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=${title}::${message}"
          }

          report_failure "API build failed" "$API_BUILD_OUTCOME" api-build.log
          report_failure "Admin typecheck failed" "$ADMIN_TYPECHECK_OUTCOME" admin-typecheck.log
          report_failure "Review-only approval proof failed" "$APPROVAL_POLICY_OUTCOME" ser-approval-policy.log
          report_failure "HTTP auth and dispatch proof failed" "$HTTP_CONTRACT_OUTCOME" ser-http-contract.log
          report_failure "Series 420-payload proof failed" "$SERIES_PROOF_OUTCOME" ser-question-studio-integration.log
          report_failure "PNL canonical regression failed" "$PNL_REGRESSION_OUTCOME" pnl-series-regression.log

          if [ "$API_BUILD_OUTCOME" != "success" ] \
            || [ "$ADMIN_TYPECHECK_OUTCOME" != "success" ] \
            || [ "$APPROVAL_POLICY_OUTCOME" != "success" ] \
            || [ "$HTTP_CONTRACT_OUTCOME" != "success" ] \
            || [ "$SERIES_PROOF_OUTCOME" != "success" ] \
            || [ "$PNL_REGRESSION_OUTCOME" != "success" ]; then
            exit 1
          fi
