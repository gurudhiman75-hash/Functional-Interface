name: Export MEN-CP-008 HTML review pack

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/**
      - .github/workflows/men-002-cp008-html-review-export.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-men-002-cp008-html-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle review exporter
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-008/review/export-html.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/men-cp008-review-export.mjs

      - name: Generate offline HTML review pack
        shell: bash
        run: |
          set -euo pipefail
          node artifacts/api-server/dist/quant-v4/men-cp008-review-export.mjs
          test -s artifacts/api-server/dist/review/MEN-CP-008-English-Review.html
          grep -q "MEN-CP-008 English Review Pack" artifacts/api-server/dist/review/MEN-CP-008-English-Review.html
          grep -q "MEN-002-QL-044" artifacts/api-server/dist/review/MEN-CP-008-English-Review.html
          grep -q "MEN-002-QL-095" artifacts/api-server/dist/review/MEN-CP-008-English-Review.html

      - name: Upload HTML review pack
        uses: actions/upload-artifact@v4
        with:
          name: MEN-CP-008-English-Review
          path: artifacts/api-server/dist/review/MEN-CP-008-English-Review.html
          if-no-files-found: error
          retention-days: 14
