name: Validate SAP CP-002 Complete

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/**"
      - ".github/workflows/validate-sap-cp002-complete.yml"
  workflow_dispatch:

jobs:
  validate-sap-cp002-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle completion authority
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-002/completion/runtime-authority.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/sap-cp002-completion-authority.test.mjs

      - name: Run completion authority
        working-directory: artifacts/api-server
        run: node dist/sap-cp002-completion-authority.test.mjs

      - name: Bundle final freeze and allocation authority
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-002/SAP-CP-002-FINAL-FREEZE-ALLOCATION-AUTHORITY.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/sap-cp002-final-freeze-allocation.test.mjs

      - name: Run final freeze and allocation authority
        working-directory: artifacts/api-server
        run: node dist/sap-cp002-final-freeze-allocation.test.mjs
