name: Validate BTD-001 CP003 Permanent Generator V1

on:
  push:
    branches:
      - feature/btd-cp003-production-generator-v1
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-003/**'
  pull_request:
    branches:
      - feature/btd-cp002-source-saturation-v2
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-003/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btd-cp003-permanent-generator-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-btd-cp003-permanent-generator-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run BTD CP003 permanent-generator audit
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-003/btd-cp003-permanent-generator-v1-audit.ts | tee btd-cp003-permanent-generator-v1.log
          grep -q 'PASS_BTD_001_CP003_PERMANENT_GENERATOR_AUDIT_V1' btd-cp003-permanent-generator-v1.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Record exact validation head
        shell: bash
        run: |
          echo "validated_head=$(git rev-parse HEAD)" | tee btd-cp003-permanent-generator-v1-head.log
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: btd-cp003-permanent-generator-v1
          path: |
            btd-cp003-permanent-generator-v1.log
            btd-cp003-permanent-generator-v1-head.log
          retention-days: 30
