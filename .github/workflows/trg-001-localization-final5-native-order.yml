name: Validate TRG-001 Final5 native-order review

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/localization-native-v5-pedagogic-review-final5.ts"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/localization-native-v5-pedagogic-review-final5.test.ts"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/export-localization-native-v5-pedagogic-review-final5.ts"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/FINAL5-NATIVE-ORDER-STATUS.md"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/localization-native-v5-pedagogic-review-final4.ts"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/localization-native-v5-pedagogic-review-final4-5seed.test.ts"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/localization-v1.ts"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/localization-v1.test.ts"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/production-human-approved-runtime.ts"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/production-authority-runtime.ts"
  workflow_dispatch:

concurrency:
  group: trg-001-final5-native-order-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-final5-native-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle frozen English authority audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/production-human-approved.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/trg-001-human-approved-audit.mjs

      - name: Run frozen English authority audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/trg-001-human-approved-audit.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/trg-001-human-approved-audit.log

      - name: Bundle Final4 five-seed guard
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/localization-native-v5-pedagogic-review-final4-5seed.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/trg-001-final4-five-seed-audit.mjs

      - name: Run Final4 five-seed guard
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/trg-001-final4-five-seed-audit.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/trg-001-final4-five-seed-audit.log

      - name: Bundle Final5 native-order audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/localization-native-v5-pedagogic-review-final5.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/trg-001-final5-native-order-audit.mjs

      - name: Run Final5 144 x 2 x 5-seed audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/trg-001-final5-native-order-audit.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/trg-001-final5-native-order-audit.log

      - name: Bundle Final5 review-pack exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/export-localization-native-v5-pedagogic-review-final5.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/trg-001-final5-review-exporter.mjs

      - name: Generate Final5 review pack
        run: node artifacts/api-server/dist/quant-v4/trg-001-final5-review-exporter.mjs

      - name: Upload Final5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: trg-001-final5-native-order-review
          path: |
            artifacts/api-server/dist/quant-v4/trg-001-human-approved-audit.log
            artifacts/api-server/dist/quant-v4/trg-001-final4-five-seed-audit.log
            artifacts/api-server/dist/quant-v4/trg-001-final5-native-order-audit.log
            artifacts/api-server/dist/quant-v4/trg-001-localization-native-review-final5.json
          if-no-files-found: error
          retention-days: 30
