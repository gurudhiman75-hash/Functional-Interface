name: Validate Punjabi Forward Port CP001

on:
  pull_request:
    branches:
      - "New-main"
    paths:
      - "artifacts/api-server/src/punjabi-v1/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp001:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bundle CP001 semantic proof
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/punjabi-v1/packages/PUN-001/checkpoints/CP001/CP001.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/punjabi-forward-port-cp001.test.mjs
      - name: Run CP001 semantic proof
        working-directory: artifacts/api-server
        run: node dist/punjabi-forward-port-cp001.test.mjs
      - name: Bundle CP001 review exporter
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/punjabi-v1/packages/PUN-001/checkpoints/CP001/export-review.ts
          --bundle --platform=node --format=esm
          --outfile=dist/punjabi-forward-port-cp001-review.mjs
      - name: Generate 240-question CP001 review pack
        working-directory: artifacts/api-server
        run: node dist/punjabi-forward-port-cp001-review.mjs
      - name: Upload CP001 review pack
        uses: actions/upload-artifact@v4
        with:
          name: PUN-001-CP001-FORWARD-PORT-REVIEW-240
          path: artifacts/api-server/review-output/PUN-001-CP001-FORWARD-PORT-REVIEW-240.md
          if-no-files-found: error
      - name: Build API server
        working-directory: artifacts/api-server
        run: pnpm run build
