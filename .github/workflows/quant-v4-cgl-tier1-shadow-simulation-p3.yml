name: Quant V4 CGL Tier-I shadow simulation P3

on:
  push:
    branches:
      - audit/quant-v4-cgl-tier1-shadow-advanced-math-remediation-p3
    paths:
      - ".github/workflows/quant-v4-cgl-tier1-shadow-simulation-p3.yml"
      - "artifacts/api-server/src/quant-v4/quality/**"
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/**"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/question-studio-standard-integration.ts"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/question-studio-runtime.ts"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/mensuration-question-studio-runtime-v2.ts"
      - "artifacts/api-server/src/quant-v4/generation-engine-core.ts"
      - "artifacts/api-server/src/quant-v4/generation-engine-legacy.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Percentage/PCT-002/**"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-001/**"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/quality/**"
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/**"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/question-studio-standard-integration.ts"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/question-studio-runtime.ts"
      - "artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/mensuration-question-studio-runtime-v2.ts"
      - "artifacts/api-server/src/quant-v4/generation-engine-core.ts"
      - "artifacts/api-server/src/quant-v4/generation-engine-legacy.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Percentage/PCT-002/**"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-001/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-v4-cgl-tier1-shadow-simulation-p3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cgl-tier1-shadow-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle shadow and regression proofs
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/quality
          for test in \
            quant-v4-cgl-tier1-shadow-simulation-p3.test \
            quant-v4-cgl-tier1-shadow-defect-localization-p3.test \
            quant-v4-cgl-tier1-shadow-di-sampling-proof-p3.test \
            quant-v4-cgl-tier1-di-public-export-compatibility-p3.test \
            quant-v4-cgl-tier1-shadow-men002-localization-p3.test \
            quant-v4-single-question-cp-distribution-p3.test \
            quant-v4-trg001-single-question-ql-distribution-p3.test \
            quant-v4-geo001-single-question-ql-distribution-p3.test \
            quant-v4-pct002-single-question-ql-distribution-p3.test \
            quant-v4-di-stem-variety-mixed-hash-p3.test \
            quant-v4-cgl-tier1-shadow-frequency-governance-p3.test \
            quant-v4-whole-section-frequency-stability-p2.test \
            quant-v4-real-exam-simulation-p2.test \
            quant-v4-real-exam-advanced-math-adapters-p2.test \
            quant-v4-real-exam-advanced-math-integration-p2.test
          do
            pnpm --dir artifacts/api-server exec esbuild \
              "src/quant-v4/quality/${test}.ts" \
              --bundle --platform=node --format=esm --packages=external \
              --outfile="dist/quant-v4/quality/${test}.mjs"
          done
      - name: Run empirical shadow simulation
        continue-on-error: true
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/quality/quant-v4-cgl-tier1-shadow-simulation-p3.test.mjs 2>&1 | tee quant-v4-cgl-tier1-shadow-simulation-p3.log
      - name: Run shadow defect localization
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/quality/quant-v4-cgl-tier1-shadow-defect-localization-p3.test.mjs 2>&1 | tee quant-v4-cgl-tier1-shadow-defect-localization-p3.log
      - name: Run DI sampling proof
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/quality/quant-v4-cgl-tier1-shadow-di-sampling-proof-p3.test.mjs 2>&1 | tee quant-v4-cgl-tier1-shadow-di-sampling-proof-p3.log
      - name: Run DI public export compatibility proof
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/quality/quant-v4-cgl-tier1-di-public-export-compatibility-p3.test.mjs 2>&1 | tee quant-v4-cgl-tier1-di-public-export-compatibility-p3.log
      - name: Run MEN-002 repetition localization
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/quality/quant-v4-cgl-tier1-shadow-men002-localization-p3.test.mjs 2>&1 | tee quant-v4-cgl-tier1-shadow-men002-localization-p3.log
      - name: Run single-question CP distribution proof
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/quality/quant-v4-single-question-cp-distribution-p3.test.mjs 2>&1 | tee quant-v4-single-question-cp-distribution-p3.log
      - name: Run TRG-001 single-question QL diversity proof
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/quality/quant-v4-trg001-single-question-ql-distribution-p3.test.mjs 2>&1 | tee quant-v4-trg001-single-question-ql-distribution-p3.log
      - name: Run GEO-001 single-question QL coverage proof
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/quality/quant-v4-geo001-single-question-ql-distribution-p3.test.mjs 2>&1 | tee quant-v4-geo001-single-question-ql-distribution-p3.log
      - name: Run PCT-002 single-question QL diversity proof
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/quality/quant-v4-pct002-single-question-ql-distribution-p3.test.mjs 2>&1 | tee quant-v4-pct002-single-question-ql-distribution-p3.log
      - name: Run DI mixed stem-variety hash proof
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/quality/quant-v4-di-stem-variety-mixed-hash-p3.test.mjs 2>&1 | tee quant-v4-di-stem-variety-mixed-hash-p3.log
      - name: Upload empirical shadow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quant-v4-cgl-tier1-shadow-simulation-p3-diagnostic
          path: |
            artifacts/api-server/quant-v4-cgl-tier1-shadow-simulation-p3.log
            artifacts/api-server/quant-v4-cgl-tier1-shadow-defect-localization-p3.log
            artifacts/api-server/quant-v4-cgl-tier1-shadow-di-sampling-proof-p3.log
            artifacts/api-server/quant-v4-cgl-tier1-di-public-export-compatibility-p3.log
            artifacts/api-server/quant-v4-cgl-tier1-shadow-men002-localization-p3.log
            artifacts/api-server/quant-v4-single-question-cp-distribution-p3.log
            artifacts/api-server/quant-v4-trg001-single-question-ql-distribution-p3.log
            artifacts/api-server/quant-v4-geo001-single-question-ql-distribution-p3.log
            artifacts/api-server/quant-v4-pct002-single-question-ql-distribution-p3.log
            artifacts/api-server/quant-v4-di-stem-variety-mixed-hash-p3.log
          if-no-files-found: warn
          retention-days: 7
      - name: Run shadow governance regression
        working-directory: artifacts/api-server
        run: node dist/quant-v4/quality/quant-v4-cgl-tier1-shadow-frequency-governance-p3.test.mjs
      - name: Run Advanced Mathematics adapter lifecycle regressions
        working-directory: artifacts/api-server
        run: |
          node dist/quant-v4/quality/quant-v4-real-exam-advanced-math-adapters-p2.test.mjs
          node dist/quant-v4/quality/quant-v4-real-exam-advanced-math-integration-p2.test.mjs
      - name: Run whole-section stability regression
        working-directory: artifacts/api-server
        run: node dist/quant-v4/quality/quant-v4-whole-section-frequency-stability-p2.test.mjs
      - name: Run current base real-exam simulation regression
        working-directory: artifacts/api-server
        run: node dist/quant-v4/quality/quant-v4-real-exam-simulation-p2.test.mjs
      - name: Patch hygiene
        run: git diff --check
