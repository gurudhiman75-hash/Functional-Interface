name: Apply platform LaTeX rendering

on:
  push:
    branches:
      - feat/platform-latex-rendering-pnc001
    paths:
      - scripts/apply-platform-latex-rendering.mjs
      - artifacts/admin-app/package.json
      - .github/workflows/apply-platform-latex-rendering.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-platform-latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/platform-latex-rendering-pnc001
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Apply deterministic source migration
        run: node scripts/apply-platform-latex-rendering.mjs

      - name: Refresh frozen lockfile
        run: pnpm install --lockfile-only

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/admin-app/src/pages/content/QuestionStudioCockpitPage.tsx \
                  artifacts/admin-app/src/pages/content/QuestionDetailPage.tsx \
                  artifacts/admin-app/src/pages/content/QuestionBankWorkspacePage.tsx \
                  pnpm-lock.yaml
          git commit -m "feat(platform): render question formulas with LaTeX"
          git push origin HEAD:feat/platform-latex-rendering-pnc001
