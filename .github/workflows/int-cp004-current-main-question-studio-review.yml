name: INT-CP-004 Current-Main Question Studio Review

on:
  push:
    branches:
      - New-main
      - feat/int-cp004-current-main-question-studio-review
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/**"
      - "artifacts/api-server/src/routes/admin-question-studio-interest.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - "artifacts/api-server/src/lib/admin-question-studio-approval-policy.ts"
      - "artifacts/api-server/src/lib/admin-question-studio-approval-policy.test.ts"
      - "artifacts/admin-app/src/features/question-studio/interest-review-api.ts"
      - "artifacts/admin-app/src/pages/content/QuestionStudioInterestReviewPanel.tsx"
      - "artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx"
      - ".github/workflows/int-cp004-current-main-question-studio-review.yml"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/**"
      - "artifacts/api-server/src/routes/admin-question-studio-interest.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - "artifacts/api-server/src/lib/admin-question-studio-approval-policy.ts"
      - "artifacts/api-server/src/lib/admin-question-studio-approval-policy.test.ts"
      - "artifacts/admin-app/src/features/question-studio/interest-review-api.ts"
      - "artifacts/admin-app/src/pages/content/QuestionStudioInterestReviewPanel.tsx"
      - "artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx"
      - ".github/workflows/int-cp004-current-main-question-studio-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: int-cp004-current-main-question-studio-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-review-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove CP-004 frozen review adapter and lifecycle locks
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp004-question-studio-review-adapter.test.ts | tee int-cp004-review-adapter.log

      - name: Prove narrow review-only approval policy
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/lib/admin-question-studio-approval-policy.test.ts | tee int-cp004-approval-policy.log

      - name: Typecheck admin application
        run: pnpm --dir artifacts/admin-app typecheck

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Upload INT-CP-004 validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-cp004-current-main-question-studio-review-logs
          path: |
            int-cp004-review-adapter.log
            int-cp004-approval-policy.log
          retention-days: 14
