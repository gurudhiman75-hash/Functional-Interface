name: ARG-001 CP015 explanation alignment final pass

on:
  push:
    branches:
      - feature/arg-001-cp012-editorial-remediation
    paths:
      - .github/workflows/arg-001-cp015-explanation-alignment-final-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arg-001-cp012-editorial-remediation
          fetch-depth: 0
      - name: Add permanent stale-explanation guard
        run: |
          python - <<'PY'
          from pathlib import Path
          proof_path = Path('artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-anti-gaming-grammar-proof.test.ts')
          proof = proof_path.read_text(encoding='utf-8')
          anchor = '    /\\bcitizens reaching near closing time\\b/i,\n'
          guard = '    /temporary safeguards and evidence review preserve due process/i,\n'
          if guard.strip() not in proof:
              if proof.count(anchor) != 1:
                  raise SystemExit(f'expected one closing-time guard anchor, found {proof.count(anchor)}')
              proof = proof.replace(anchor, anchor + guard, 1)
              proof_path.write_text(proof, encoding='utf-8')
          PY
      - name: Commit explanation alignment proof guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-anti-gaming-grammar-proof.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "test(arg-cp015): reject stale due-process explanation"
          git push origin HEAD:feature/arg-001-cp012-editorial-remediation
