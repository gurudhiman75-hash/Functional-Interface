name: CP02 surgical runner fullscreen patch

on:
  push:
    branches:
      - feature/frontend-production-cp02-runner-zoom-contrast

permissions:
  contents: write

jobs:
  patch-runner:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/frontend-production-cp02-runner-zoom-contrast
          fetch-depth: 0

      - name: Remove only automatic REAL-test fullscreen entry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('artifacts/examtree/src/pages/test.tsx')
          source = path.read_text()
          old = '''              onClick={() => {
                if (selectedMode === "REAL") {
                  document.documentElement.requestFullscreen?.().catch(() => {});
                }
                setStarted(true);
              }}'''
          new = '''              onClick={() => {
                setStarted(true);
              }}'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one automatic fullscreen block, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Remove temporary patch workflow
        run: rm .github/workflows/cp02-surgical-runner-fullscreen-patch.yml

      - name: Verify surgical diff
        run: |
          git diff --check
          python - <<'PY'
          import subprocess

          diff = subprocess.check_output([
              'git', 'diff', '--unified=0', '--',
              'artifacts/examtree/src/pages/test.tsx',
              '.github/workflows/cp02-surgical-runner-fullscreen-patch.yml',
          ], text=True)
          if 'requestFullscreen' not in diff:
              raise SystemExit('Expected fullscreen removal is missing from diff')
          if 'setStarted(true)' not in diff:
              raise SystemExit('Start-test behavior is missing from diff')
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          expected = {
              'artifacts/examtree/src/pages/test.tsx',
              '.github/workflows/cp02-surgical-runner-fullscreen-patch.yml',
          }
          if set(changed) != expected:
              raise SystemExit(f'Unexpected changed files: {changed}')
          print(diff)
          PY

      - name: Commit surgical patch and self-delete
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/examtree/src/pages/test.tsx .github/workflows/cp02-surgical-runner-fullscreen-patch.yml
          git commit -m "fix(frontend): keep real test runner browser-zoomable"
          git push origin HEAD:feature/frontend-production-cp02-runner-zoom-contrast
