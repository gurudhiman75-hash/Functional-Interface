name: Quant V4 empirical difficulty calibration P2

on:
  push:
    branches:
      - audit/quant-v4-empirical-difficulty-calibration-p2
    paths:
      - "artifacts/api-server/src/quant-v4/quality/QUANT-V4-EMPIRICAL-DIFFICULTY-CALIBRATION-P2.md"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-empirical-difficulty-calibration-p2.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-empirical-difficulty-calibration-p2.test.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-empirical-difficulty-telemetry-p2.test.ts"
      - "artifacts/api-server/src/routes/published-test-runner.ts"
      - ".github/workflows/quant-v4-empirical-difficulty-calibration-p2.yml"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/quality/QUANT-V4-EMPIRICAL-DIFFICULTY-CALIBRATION-P2.md"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-empirical-difficulty-calibration-p2.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-empirical-difficulty-calibration-p2.test.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-empirical-difficulty-telemetry-p2.test.ts"
      - "artifacts/api-server/src/routes/published-test-runner.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-v4-empirical-difficulty-p2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  empirical-difficulty-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle empirical difficulty P2 tests
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/difficulty-p2
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/quality/quant-v4-empirical-difficulty-calibration-p2.test.ts --bundle --platform=node --format=esm --packages=external --outfile=dist/quant-v4/difficulty-p2/calibration.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/quality/quant-v4-empirical-difficulty-telemetry-p2.test.ts --bundle --platform=node --format=esm --packages=external --outfile=dist/quant-v4/difficulty-p2/telemetry.test.mjs

      - name: Prove empirical calibration mechanism
        working-directory: artifacts/api-server
        run: node dist/quant-v4/difficulty-p2/calibration.test.mjs

      - name: Guard canonical attempt telemetry
        working-directory: artifacts/api-server
        run: node dist/quant-v4/difficulty-p2/telemetry.test.mjs

      - name: Patch hygiene
        run: git diff --check
