name: Validate English ENG-008 CP004 V1
on:
  pull_request:
    branches: [New-main]
    types: [opened,reopened,synchronize,ready_for_review]
    paths:
      - artifacts/api-server/src/english-v1/chapters/reading-comprehension/ENG-008/CP004/**
      - artifacts/api-server/src/english-v1/tests/eng-008-cp004-v1.test.ts
      - .github/workflows/english-eng008-cp004-v1.yml
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir artifacts/api-server exec esbuild src/english-v1/tests/eng-008-cp004-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-008-cp004-v1.test.mjs
      - run: node artifacts/api-server/dist/english-v1/eng-008-cp004-v1.test.mjs
      - run: pnpm --dir artifacts/api-server exec esbuild src/english-v1/chapters/reading-comprehension/ENG-008/CP004/eng-008-cp004-review-v1-export.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-008-cp004-review-v1-export.mjs
      - run: node artifacts/api-server/dist/english-v1/eng-008-cp004-review-v1-export.mjs
      - uses: actions/upload-artifact@v4
        with: { name: ENG-008-CP004-REVIEW-V1, path: dist/english-v1/ENG-008-CP004-REVIEW-V1.md, retention-days: 30 }
      - run: pnpm --dir artifacts/api-server build
