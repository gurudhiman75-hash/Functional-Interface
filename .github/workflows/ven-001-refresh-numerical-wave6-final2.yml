name: VEN-001 final numerical refresh Wave 6b

on:
  push:
    branches:
      - feature/ven-localization-wave6

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ven-localization-wave6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate numerical review pack
        run: |
          cd artifacts/api-server/src/reasoning-v1/topics/Venn-Diagrams/VEN-001
          node export-numerical-review.ts
      - name: Commit refreshed artifacts and remove temporary workflow
        run: |
          rm .github/workflows/ven-001-refresh-numerical-wave6-final2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/reasoning-v1/topics/Venn-Diagrams/VEN-001/VEN-001-NUMERICAL-REVIEW-V2.html
          git add artifacts/api-server/src/reasoning-v1/topics/Venn-Diagrams/VEN-001/VEN-001-NUMERICAL-REVIEW-V2.json
          git add .github/workflows/ven-001-refresh-numerical-wave6-final2.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "VEN-001 Wave 6: refresh final numerical review pack"
          git push origin HEAD:feature/ven-localization-wave6
