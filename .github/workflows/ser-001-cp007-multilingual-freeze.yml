name: Validate SER-001 CP-007 multilingual manual freeze

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/**"
      - ".github/workflows/ser-001-cp007-multilingual-freeze.yml"

permissions:
  contents: read

concurrency:
  group: ser-001-cp007-multilingual-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-multilingual-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare multilingual freeze evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/cp007-multilingual-freeze

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Run multilingual manual-freeze proof
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-LOCALIZATION
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-multilingual-freeze
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/ser-cp-007-multilingual-freeze.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-multilingual-freeze.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-multilingual-freeze.test.mjs") \
            | tee "$EVIDENCE/SER-CP-007-Multilingual-Manual-Freeze-Proof.json"
          grep -q 'PASS_SER_CP007_MULTILINGUAL_MANUAL_FREEZE' \
            "$EVIDENCE/SER-CP-007-Multilingual-Manual-Freeze-Proof.json"
          grep -q '"frozenPackages": 840' \
            "$EVIDENCE/SER-CP-007-Multilingual-Manual-Freeze-Proof.json"
          grep -q '"permanentQlsReached": 13' \
            "$EVIDENCE/SER-CP-007-Multilingual-Manual-Freeze-Proof.json"
          grep -q '"reviewTriplets": 104' \
            "$EVIDENCE/SER-CP-007-Multilingual-Manual-Freeze-Proof.json"

      - name: Upload multilingual freeze evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-cp007-multilingual-manual-freeze
          path: artifacts/api-server/dist/reasoning-v1/ser-001/cp007-multilingual-freeze/
          if-no-files-found: error
          retention-days: 30
