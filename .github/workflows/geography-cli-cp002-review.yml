name: Validate GEO-CLI-001 CP002 Review

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/indian-geography/climate/**"
      - ".github/workflows/geography-cli-cp002-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geo-cli-001-cp002-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp002:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run GEO-CLI-001 CP002 V5 qualification gate
        run: |
          mkdir -p artifacts/api-server/dist/geography
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/indian-geography/climate/geo-cli-001-cp002-review-batch-v5.test.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/geography/geo-cli-001-cp002-review-batch-v5.test.mjs
          node artifacts/api-server/dist/geography/geo-cli-001-cp002-review-batch-v5.test.mjs

      - name: Materialize V5 review artifact
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/indian-geography/climate/geo-cli-001-cp002-export-review-v5.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/geography/geo-cli-001-cp002-export-review-v5.mjs
          cd artifacts/api-server
          node dist/geography/geo-cli-001-cp002-export-review-v5.mjs

      - name: Upload V5 review artifact
        uses: actions/upload-artifact@v4
        with:
          name: GEO-CLI-001-CP002-REVIEW-BATCH-V5
          path: artifacts/api-server/dist/geography-review/GEO-CLI-001-CP002-V5/
          if-no-files-found: error
          retention-days: 30

      - name: Build API server
        run: pnpm --dir artifacts/api-server build
