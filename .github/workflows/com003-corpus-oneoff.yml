name: COM-003 Corpus One-Off

on:
  push:
    branches:
      - feature/com003-office-productivity-discovery-v1
    paths:
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-*.ts'

permissions:
  contents: read

concurrency:
  group: com003-corpus-oneoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle COM-003 audits
        run: |
          mkdir -p artifacts/api-server/dist/com003-oneoff
          for test in \
            com003-source-authority-extension.test \
            com003-candidate-fact-corpus.test \
            com003-corpus-saturation-audit.test; do
            pnpm --dir artifacts/api-server exec esbuild \
              src/knowledge-v1/computer-awareness/${test}.ts \
              --bundle --platform=node --format=esm \
              --outfile=dist/com003-oneoff/${test}.mjs
          done
      - name: Run COM-003 audits
        run: |
          node artifacts/api-server/dist/com003-oneoff/com003-source-authority-extension.test.mjs
          node artifacts/api-server/dist/com003-oneoff/com003-candidate-fact-corpus.test.mjs
          node artifacts/api-server/dist/com003-oneoff/com003-corpus-saturation-audit.test.mjs
