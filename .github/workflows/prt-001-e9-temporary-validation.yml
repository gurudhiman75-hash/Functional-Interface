name: Temporary PRT-001 E9 ownership validation

on:
  pull_request:
    branches:
      - audit/prt-001-source-saturation-e8
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/**
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-003/**
      - .github/workflows/prt-001-e9-temporary-validation.yml

permissions:
  contents: read

concurrency:
  group: prt-001-e9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-prt-001-e9:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run RAP-003 legacy regression tests
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-003/rap-003.test.ts --bundle --platform=node --format=esm --outfile=dist/rap-003-e9-test.mjs
          node artifacts/api-server/dist/rap-003-e9-test.mjs
      - name: Run RAP-003 Question Studio smoke
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/RatioAndProportion/RAP-003/rap-003-question-studio-smoke.ts --bundle --platform=node --format=esm --outfile=dist/rap-003-e9-studio.mjs
          node artifacts/api-server/dist/rap-003-e9-studio.mjs
      - name: Run PRT-001 E9 ownership audit
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/Partnership/PRT-001/prt-001-rap003-ownership-audit.ts --bundle --platform=node --format=esm --outfile=dist/prt-001-e9-ownership.mjs
          node artifacts/api-server/dist/prt-001-e9-ownership.mjs
      - name: Run PRT-001 seeded corpus
        run: pnpm --dir artifacts/api-server run test:prt-001
      - name: Run PRT-001 freeze audit
        run: pnpm --dir artifacts/api-server run audit:prt-001
