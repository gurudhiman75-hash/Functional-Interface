name: MEN-002 Foundation One-Shot Patch

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-002-foundation-one-shot-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Correct exact currency placement and scaling distractor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          exact_path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/foundation/exact.ts")
          exact = exact_path.read_text()
          old = '''export function formatWithUnit(value: ExactValue, unit: Men002Unit) {
            const maths = formatExactMath(value);
            const unitMath = unit === "%"
              ? "\\\\%"
              : unit === "£"
                ? "\\\\text{£}"
                : `\\\\text{ ${unit}}`;
            return `$${maths}${unitMath}$`;
          }'''.replace("          ", "")
          new = '''export function formatWithUnit(value: ExactValue, unit: Men002Unit) {
            const maths = formatExactMath(value);
            if (unit === "£") return `$\\\\text{£}${maths}$`;
            const unitMath = unit === "%" ? "\\\\%" : `\\\\text{ ${unit}}`;
            return `$${maths}${unitMath}$`;
          }'''.replace("          ", "")
          if old not in exact:
            raise SystemExit("formatWithUnit block not found")
          exact_path.write_text(exact.replace(old, new, 1))

          runtime_path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/foundation/runtime.ts")
          runtime = runtime_path.read_text()
          old_runtime = '''{ value: q(3n * factor), misconceptionId: "ADDED_THREE_FACTORS", explanation: "adding three copies of the scale factor instead of multiplying them" },'''
          new_runtime = '''{ value: q(factor + 3n), misconceptionId: "ADDED_POWER_TO_FACTOR", explanation: "adding the exponent $3$ to the scale factor instead of cubing the factor" },'''
          if old_runtime not in runtime:
            raise SystemExit("scaling distractor block not found")
          runtime_path.write_text(runtime.replace(old_runtime, new_runtime, 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/foundation/exact.ts artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/foundation/runtime.ts
          git commit -m "fix(mensuration): remove MEN-002 option collision and format pounds"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
