name: Validate TSD Canonical Review and Diversity Batches

on:
  pull_request:
    branches:
      - New-main
      - feat/tsd-authority-audit-implementation
      - feat/tsd-canonical-review-schema
      - feat/tsd-p1-diversity-batch-01
      - feat/tsd-p1-diversity-batch-02
      - feat/tsd-p1-diversity-batch-03
      - feat/tsd-p1-diversity-batch-04-verified
      - feat/tsd-p2-diversity-batch-01
      - feat/tsd-p2-diversity-batch-02
      - feat/tsd-p2-diversity-batch-03
      - fix/tsd-proportion-explanation-integrity
      - fix/tsd-distractor-explanation-integrity
      - fix/tsd-context-plausibility
      - fix/tsd-direct-option-feedback
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/**
      - .github/workflows/tsd-canonical-review-proof.yml

permissions:
  contents: read

jobs:
  validate-canonical-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle canonical schema and diversity proofs
        run: |
          ROOT=src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001
          OUT=dist/quant-v4/tsd-001/canonical-review
          mkdir -p artifacts/api-server/$OUT
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/index.ts" --bundle --platform=node --format=esm --outfile="dist/quant-v4/tsd-001/index.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/canonical-review-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/canonical-review-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/p1-diversity-batch-01-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/p1-diversity-batch-01-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/p1-diversity-batch-02-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/p1-diversity-batch-02-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/p1-diversity-batch-03-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/p1-diversity-batch-03-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/p1-diversity-batch-04-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/p1-diversity-batch-04-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/p2-diversity-batch-01-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/p2-diversity-batch-01-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/p2-diversity-batch-02-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/p2-diversity-batch-02-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/p2-diversity-batch-03-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/p2-diversity-batch-03-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/proportion-explanation-integrity-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/proportion-explanation-integrity-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/distractor-explanation-integrity-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/distractor-explanation-integrity-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/context-plausibility-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/context-plausibility-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/direct-option-feedback-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/direct-option-feedback-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/proportion-option-label-integrity-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/proportion-option-label-integrity-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/canonical-review-export.ts" --bundle --platform=node --format=esm --outfile="$OUT/canonical-review-export.mjs"

      - name: Run canonical schema and diversity proofs
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/tsd-001/canonical-review/canonical-review-proof.mjs | tee dist/quant-v4/tsd-001/canonical-review/canonical-review-proof.log
          node dist/quant-v4/tsd-001/canonical-review/p1-diversity-batch-01-proof.mjs | tee dist/quant-v4/tsd-001/canonical-review/p1-diversity-batch-01-proof.log
          node dist/quant-v4/tsd-001/canonical-review/p1-diversity-batch-02-proof.mjs | tee dist/quant-v4/tsd-001/canonical-review/p1-diversity-batch-02-proof.log
          node dist/quant-v4/tsd-001/canonical-review/p1-diversity-batch-03-proof.mjs | tee dist/quant-v4/tsd-001/canonical-review/p1-diversity-batch-03-proof.log
          node dist/quant-v4/tsd-001/canonical-review/p1-diversity-batch-04-proof.mjs | tee dist/quant-v4/tsd-001/canonical-review/p1-diversity-batch-04-proof.log
          node dist/quant-v4/tsd-001/canonical-review/p2-diversity-batch-01-proof.mjs | tee dist/quant-v4/tsd-001/canonical-review/p2-diversity-batch-01-proof.log
          node dist/quant-v4/tsd-001/canonical-review/p2-diversity-batch-02-proof.mjs | tee dist/quant-v4/tsd-001/canonical-review/p2-diversity-batch-02-proof.log
          node dist/quant-v4/tsd-001/canonical-review/p2-diversity-batch-03-proof.mjs | tee dist/quant-v4/tsd-001/canonical-review/p2-diversity-batch-03-proof.log
          node dist/quant-v4/tsd-001/canonical-review/proportion-explanation-integrity-proof.mjs | tee dist/quant-v4/tsd-001/canonical-review/proportion-explanation-integrity-proof.log
          node dist/quant-v4/tsd-001/canonical-review/distractor-explanation-integrity-proof.mjs | tee dist/quant-v4/tsd-001/canonical-review/distractor-explanation-integrity-proof.log
          node dist/quant-v4/tsd-001/canonical-review/context-plausibility-proof.mjs | tee dist/quant-v4/tsd-001/canonical-review/context-plausibility-proof.log
          node dist/quant-v4/tsd-001/canonical-review/direct-option-feedback-proof.mjs | tee dist/quant-v4/tsd-001/canonical-review/direct-option-feedback-proof.log
          node dist/quant-v4/tsd-001/canonical-review/proportion-option-label-integrity-proof.mjs | tee dist/quant-v4/tsd-001/canonical-review/proportion-option-label-integrity-proof.log
          node dist/quant-v4/tsd-001/canonical-review/canonical-review-export.mjs | tee dist/quant-v4/tsd-001/canonical-review/canonical-review-export.log

      - name: Upload canonical and diversity proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsd-proportion-option-label-integrity-proof
          path: |
            artifacts/api-server/dist/quant-v4/tsd-001/canonical-review/canonical-review-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/canonical-review/p1-diversity-batch-01-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/canonical-review/p1-diversity-batch-02-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/canonical-review/p1-diversity-batch-03-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/canonical-review/p1-diversity-batch-04-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/canonical-review/p2-diversity-batch-01-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/canonical-review/p2-diversity-batch-02-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/canonical-review/p2-diversity-batch-03-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/canonical-review/proportion-explanation-integrity-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/canonical-review/distractor-explanation-integrity-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/canonical-review/context-plausibility-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/canonical-review/direct-option-feedback-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/canonical-review/proportion-option-label-integrity-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/canonical-review/canonical-review-export.log
          if-no-files-found: error

      - name: Upload corrected canonical review package
        uses: actions/upload-artifact@v4
        with:
          name: tsd-proportion-option-label-integrity-review
          path: artifacts/api-server/dist/quant-v4/tsd-001/canonical-review
          if-no-files-found: error
