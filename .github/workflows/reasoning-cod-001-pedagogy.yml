name: Reasoning COD-001 Pedagogical Quality
on:
  pull_request:
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/**
      - .github/workflows/reasoning-cod-001-pedagogy.yml
  workflow_dispatch:
jobs:
  cod-pedagogy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run all-QL pedagogical audit
        id: audit
        shell: bash
        run: |
          set +e
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/review/cod-001-pedagogy-audit.test.ts > cod-001-pedagogy.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Export upgraded multilingual review corpus
        id: export
        shell: bash
        run: |
          set +e
          rm -rf cod-001-pedagogy-review
          npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/review/export-cod-multilingual-review.ts cod-001-pedagogy-review > cod-001-pedagogy-export.log 2>&1
          status=$?
          if [ "$status" = "0" ]; then
            ! grep -R -E '\*\*Explanation:\*\*[[:space:]]*\{|"(ruleStatement|quickMethod|sourceDemonstration|targetApplication)"[[:space:]]*:' cod-001-pedagogy-review/*.md
            status=$?
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload pedagogy diagnostics and review corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod-001-pedagogical-review
          path: |
            cod-001-pedagogy.log
            cod-001-pedagogy-export.log
            cod-001-pedagogy-review
          retention-days: 14
      - name: Enforce pedagogical quality
        run: |
          cat cod-001-pedagogy.log
          cat cod-001-pedagogy-export.log
          test "${{ steps.audit.outputs.exit_code }}" = "0"
          test "${{ steps.export.outputs.exit_code }}" = "0"
