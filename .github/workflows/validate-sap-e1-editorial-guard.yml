name: Validate SAP E1 Editorial Guard

on:
  pull_request:
    branches: [audit/sap-exhaustiveness-2026-08]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle E1 candidate guards
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-005/e1-runtime.ts --bundle --platform=node --format=esm --outfile=dist/e1-cp005-guard.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-002/SAP-CP-010/e1-runtime.ts --bundle --platform=node --format=esm --outfile=dist/e1-cp010-guard.mjs
      - name: Reject generic learner options
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import path from 'node:path';
          const root = process.cwd();
          const cp005 = await import(path.join(root, 'artifacts/api-server/dist/e1-cp005-guard.mjs'));
          const cp010 = await import(path.join(root, 'artifacts/api-server/dist/e1-cp010-guard.mjs'));
          for (let seed = 1; seed <= 100; seed++) {
            for (const q of [cp005.generateSapCp005E1Telescoping(seed), cp010.generateSapCp010E1SuppliedRootScaling(seed)]) {
              assert.equal(q.validation.ok, true, `${q.candidateId}:${seed}: ${q.validation.errors.join('; ')}`);
              const learner = `${q.stem} ${q.options.map(o => `${o.value} ${o.analysis}`).join(' ')}`;
              assert.doesNotMatch(learner, /Alternative\s+\d+/i, `${q.candidateId}:${seed}: generic fallback option`);
              assert.equal(new Set(q.options.map(o => o.value)).size, 4);
            }
          }
          console.log('SAP E1 editorial guard passed: 200 candidate states, no generic fallback options.');
          NODE
