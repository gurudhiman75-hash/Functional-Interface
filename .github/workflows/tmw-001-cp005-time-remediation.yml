name: Remediate TMW CP-005 fractional time typography

on:
  pull_request:
    branches:
      - design/tmw-001-blueprint
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/tmw-001-cp005-time-remediation.yml

permissions:
  contents: write

concurrency:
  group: remediate-tmw-cp005-time
  cancel-in-progress: true

jobs:
  remediate-cp005-time:
    if: github.head_ref == 'audit/tmw-001-english-gap-freeze'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audit/tmw-001-english-gap-freeze
      - name: Route CP-005 time text through shared MathJax formatter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation')

          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f'{label} anchor not found')

          presentation = root / 'cp005-presentation.ts'
          text = presentation.read_text()
          text = replace_once(text,
            'import { formatRational } from "./rational";',
            'import { formatRational, formatTimeText } from "./rational";',
            'CP-005 presentation rational import')
          text = replace_once(text,
            'function soloText(actor:string,time:Rational,unit:string):string{return `${actor} can complete the work alone in ${formatRational(time)} ${unit}${formatRational(time)==="1"?"":"s"}`;}',
            'function timeText(value:Rational,unit:string):string{return formatTimeText(value,unit,`${unit}s`);}\nfunction soloText(actor:string,time:Rational,unit:string):string{return `${actor} can complete the work alone in ${timeText(time,unit)}`;}',
            'CP-005 solo-time renderer')
          text = replace_once(text,
            'function durationPhrase(value:string,unit:string):string{return `${value} ${unit}${value==="1"?"":"s"}`;}',
            'function durationPhrase(value:Rational,unit:string):string{return timeText(value,unit);}',
            'CP-005 duration renderer')

          fields = ['timeA', 'timeB', 'timeC', 'knownCompletionTime', 'deadline']
          for field in fields:
              bare = '${formatRational(required(p.' + field + ',"' + field + '"))}'
              text = text.replace(bare + ' ${u}s', '${timeText(required(p.' + field + ',"' + field + '"),u)}')
              text = text.replace(bare + ' hours', '${timeText(required(p.' + field + ',"' + field + '"),"hour")}')
              text = text.replace(bare, '${timeText(required(p.' + field + ',"' + field + '"),u)}')

          text = text.replace('durationPhrase(formatRational(p.cycle[0].duration),"hour")', 'durationPhrase(p.cycle[0].duration,"hour")')
          text = text.replace('durationPhrase(formatRational(p.cycle[1].duration),"hour")', 'durationPhrase(p.cycle[1].duration,"hour")')
          if any(f'formatRational(required(p.{field}' in text for field in fields):
              raise SystemExit('CP-005 presentation still contains a legacy time renderer')
          presentation.write_text(text)

          solver = root / 'cp005-solver.ts'
          text = solver.read_text()
          text = replace_once(text,
            'import { add, divide, equals, formatRational, multiply, rational, reciprocal, subtract, toLatex } from "./rational";',
            'import { add, divide, equals, formatRational, formatTimeText, multiply, rational, reciprocal, subtract, toLatex } from "./rational";',
            'CP-005 solver rational import')
          text = replace_once(text,
            'import { required, timeUnitLabel } from "./cp001-helpers";',
            'import { required } from "./cp001-helpers";',
            'CP-005 solver helper import')
          text = replace_once(text,
            ' if(entry.answerType==="TIME")return `${value} ${timeUnitLabel(p.timeUnit,answer)}`;',
            ' if(entry.answerType==="TIME")return formatTimeText(answer,p.timeUnit,`${p.timeUnit}s`);',
            'CP-005 solution time renderer')
          solver.write_text(text)

          options = root / 'cp005-options.ts'
          text = options.read_text()
          text = replace_once(text,
            'import { add, compare, divide, equals, formatRational, multiply, rational, reciprocal, subtract } from "./rational";',
            'import { add, compare, divide, equals, formatRational, formatTimeText, multiply, rational, reciprocal, subtract } from "./rational";',
            'CP-005 options rational import')
          text = replace_once(text,
            'import { seedNumber, timeUnitLabel } from "./cp001-helpers";',
            'import { seedNumber } from "./cp001-helpers";',
            'CP-005 options helper import')
          text = replace_once(text,
            ' if(entry.answerType==="TIME")return `${formatted} ${timeUnitLabel(p.timeUnit,value)}`;',
            ' if(entry.answerType==="TIME")return formatTimeText(value,p.timeUnit,`${p.timeUnit}s`);',
            'CP-005 option time renderer')
          options.write_text(text)
          PY
      - name: Install locked workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Validate CP-005 and chapter audit
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp005.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/tmw-001-cp005.time.mjs
          node artifacts/api-server/dist/quant-v4/tmw-001-cp005.time.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-english-gap-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/tmw-001-english-gap-audit.cp005-time.mjs
          (cd artifacts/api-server && node dist/quant-v4/tmw-001-english-gap-audit.cp005-time.mjs || true)
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('artifacts/api-server/dist/quant-v4/tmw-001-english-gap-audit.json', 'utf8'));
          if (report.summary.hardFailures !== 0) throw new Error(`chapter audit has ${report.summary.hardFailures} hard failures`);
          const hits = report.findings.filter((finding) => finding.code === 'ASCII_FRACTIONAL_TIME' && finding.cpId === 'TMW-CP-005');
          if (hits.length !== 0) throw new Error(`CP-005 ASCII fractional-time findings remain: ${hits.length}`);
          NODE
      - name: Commit CP-005 time typography
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp005-presentation.ts artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp005-solver.ts artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp005-options.ts; then
            echo 'CP-005 time typography is already migrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp005-presentation.ts artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp005-solver.ts artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp005-options.ts
          git commit -m 'fix(tmw): render CP-005 fractional times in MathJax'
          git push origin HEAD:audit/tmw-001-english-gap-freeze
