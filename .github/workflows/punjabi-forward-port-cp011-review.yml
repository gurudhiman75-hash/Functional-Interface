name: Export Punjabi Retrofit CP011 Review

on:
  push:
    branches:
      - "New-main"
    paths:
      - "artifacts/api-server/src/punjabi-v1/**"
  pull_request:
    branches:
      - "New-main"
    paths:
      - "artifacts/api-server/src/punjabi-v1/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-cp011-retrofit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Bundle CP011 retrofit review exporter
        working-directory: artifacts/api-server
        run: pnpm exec esbuild src/punjabi-v1/packages/PUN-001/checkpoints/CP011/export-review.ts --bundle --platform=node --format=esm --outfile=dist/punjabi-retrofit-cp011-review.mjs
      - name: Generate CP011 retrofit review pack
        working-directory: artifacts/api-server
        run: node dist/punjabi-retrofit-cp011-review.mjs
      - name: Upload CP011 retrofit review pack
        uses: actions/upload-artifact@v4
        with:
          name: PUN-001-CP011-RETROFIT-REVIEW-120
          path: artifacts/api-server/PUN-001-CP011-RETROFIT-REVIEW.md
          if-no-files-found: error
