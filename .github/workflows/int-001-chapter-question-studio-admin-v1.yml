name: Validate INT-001 Chapter Question Studio Admin V1

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/**"
      - "artifacts/api-server/src/routes/admin-question-studio-interest-chapter.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-registry.ts"
      - "artifacts/admin-app/src/features/question-studio/interest-review-api.ts"
      - "artifacts/admin-app/src/pages/content/QuestionStudioInterestReviewPanel.tsx"
  workflow_dispatch:

concurrency:
  group: int-001-chapter-question-studio-admin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-int-001-chapter-question-studio-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit all 399 chapter-admin surfaces
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-chapter-question-studio-admin-v1-audit.ts | tee int-001-chapter-question-studio-admin-v1.log
          grep -q 'PASS_INT_001_CHAPTER_ADMIN_QUESTION_STUDIO_V1_AUDIT' int-001-chapter-question-studio-admin-v1.log
          grep -q '"checkpointCount": 10' int-001-chapter-question-studio-admin-v1.log
          grep -q '"permanentQlCount": 133' int-001-chapter-question-studio-admin-v1.log
          grep -q '"qlLanguageSurfaceCount": 399' int-001-chapter-question-studio-admin-v1.log
          grep -q '"generated": 399' int-001-chapter-question-studio-admin-v1.log
          grep -q '"questionIdCollisions": 0' int-001-chapter-question-studio-admin-v1.log
          grep -q '"questionBankWritable": false' int-001-chapter-question-studio-admin-v1.log
      - name: Preserve 399-surface Question Studio closure
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-399-surface-question-studio-soak-v2-audit.ts | tee int-001-399-surface-regression.log
          grep -q 'PASS_INT_001_399_SURFACE_QUESTION_STUDIO_SOAK_V2_AUDIT' int-001-399-surface-regression.log
          grep -q '"generated": 2394' int-001-399-surface-regression.log
          grep -q '"legacyImplicitOwnershipCases": 0' int-001-399-surface-regression.log
          grep -q '"exactCrossQlStemCollisions": 0' int-001-399-surface-regression.log
          grep -q '"questionIdCollisions": 0' int-001-399-surface-regression.log
      - name: Typecheck admin app
        run: pnpm --dir artifacts/admin-app typecheck
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Record exact validation head
        shell: bash
        run: |
          echo "validated_head=$(git rev-parse HEAD)" | tee int-001-chapter-question-studio-admin-head.log
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-001-chapter-question-studio-admin-v1
          path: |
            int-001-chapter-question-studio-admin-v1.log
            int-001-399-surface-regression.log
            int-001-chapter-question-studio-admin-head.log
          retention-days: 30
