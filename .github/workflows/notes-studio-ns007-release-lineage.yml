name: Validate Notes Studio NS-007 Release Lineage

on:
  pull_request:
    branches:
      - New-main
    paths:
      - 'artifacts/api-server/src/notes-studio/**'
      - 'artifacts/api-server/src/routes/admin-notes-studio*.ts'
      - 'artifacts/api-server/src/routes/index.ts'
      - 'artifacts/api-server/migrations/20260829_notes_studio_source_pack*.sql'
      - 'artifacts/api-server/migrations/20260830_notes_studio_source_pack*.sql'
      - 'artifacts/admin-app/src/pages/content/NotesStudio**'
  workflow_dispatch:

concurrency:
  group: notes-studio-ns007-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-notes-studio-release-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run cumulative Notes Studio contracts
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/source-pack.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-source-pack.test.mjs
          node artifacts/api-server/dist/notes-studio-source-pack.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/evidence-map.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-evidence-map.test.mjs
          node artifacts/api-server/dist/notes-studio-evidence-map.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/section-synthesis.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-section-synthesis.test.mjs
          node artifacts/api-server/dist/notes-studio-section-synthesis.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/quality-gates.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-quality-gates.test.mjs
          node artifacts/api-server/dist/notes-studio-quality-gates.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/quality-grounding.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-quality-grounding.test.mjs
          node artifacts/api-server/dist/notes-studio-quality-grounding.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/approval-versioning.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-approval-versioning.test.mjs
          node artifacts/api-server/dist/notes-studio-approval-versioning.test.mjs
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/release-lineage.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-release-lineage.test.mjs
          node artifacts/api-server/dist/notes-studio-release-lineage.test.mjs
      - name: Verify immutable replacement lineage schema
        run: |
          ns007='artifacts/api-server/migrations/20260830_notes_studio_source_pack_ns007_release_lineage.sql'
          grep -F 'predecessor_approved_version_id' "$ns007"
          grep -F 'lineage_root_approved_version_id' "$ns007"
          grep -F 'guard_note_authoring_lineage' "$ns007"
          grep -F 'apply_note_approved_version_revision_number' "$ns007"
          grep -F 'CREATE TABLE IF NOT EXISTS content.note_publish_handoffs' "$ns007"
          grep -F 'prevent_materialized_note_resource_content_mutation' "$ns007"
          grep -F 'prevent_materialized_note_exam_target_mutation' "$ns007"
      - name: Verify successor reset and publish handoff boundary
        run: |
          route='artifacts/api-server/src/routes/admin-notes-studio-release.ts'
          grep -F "router.post('/approved-versions/:versionId/revise'" "$route"
          grep -F 'copiedSourcePackReferences: true' "$route"
          grep -F 'copiedEvidence: false' "$route"
          grep -F 'copiedSections: false' "$route"
          grep -F 'copiedQualityRuns: false' "$route"
          grep -F "router.post('/approved-versions/:versionId/handoff/:variantKey'" "$route"
          grep -F "requireAdminPermission('content.questions.publish')" "$route"
          grep -F 'integrityMatchesFrozenVersion' "$route"
          grep -F 'publishActionPerformed: false' "$route"
          grep -F 'handoffPublishesResource: false' "$route"
          grep -F 'adminNotesStudioReleaseRouter' artifacts/api-server/src/routes/index.ts
          ! grep -F '/publish' "$route"
      - name: Verify learner release admin surface
        run: |
          page='artifacts/admin-app/src/pages/content/NotesStudioReleaseRevisionPage.tsx'
          hub='artifacts/admin-app/src/pages/content/NotesStudioHubPage.tsx'
          grep -F 'Release & Revisions' "$page"
          grep -F 'Frozen match' "$page"
          grep -F 'Create successor' "$page"
          grep -F 'Hand off for publish' "$page"
          grep -F 'Open Learning Resources' "$page"
          ! grep -F '/publish' "$page"
          grep -F 'NotesStudioReleaseRevisionPage' "$hub"
      - name: Verify Guided Final Review release surface
        run: |
          page='artifacts/admin-app/src/pages/content/NotesStudioFinalReviewPage.tsx'
          guided='artifacts/admin-app/src/pages/content/NotesStudioGuidedPage.tsx'
          grep -F 'Release ready drafts' "$page"
          grep -F '/handoff/${variant.key}' "$page"
          grep -F 'No learner resource was published automatically.' "$page"
          grep -F 'Open Learning Resources' "$page"
          grep -F "['review_ready', 'approved', 'materialized']" "$guided"
          ! grep -F '/publish' "$page"
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Typecheck admin app
        run: pnpm --dir artifacts/admin-app typecheck
