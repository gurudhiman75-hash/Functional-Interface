name: Bootstrap TMW-CP-011 source package

on:
  push:
    branches:
      - feat/tmw-cp011
    paths:
      - .github/cp011v2-*
      - .github/workflows/tmw-cp011-bootstrap.yml
  pull_request:
    branches:
      - design/tmw-001-blueprint
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: bootstrap-tmw-cp011-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'push' || github.head_ref == 'feat/tmw-cp011'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Verify and decode reviewed CP-011 package
        shell: bash
        run: |
          set -euo pipefail
          target="artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001"
          work="$(mktemp -d)"
          cat .github/cp011v2-* > "$work/cp011.b64"
          echo "c043689426c68eb1d66d2ae51352c8ed0f63dc2e22599543e5e01832f7279a54  $work/cp011.b64" | sha256sum --check --strict
          base64 --decode "$work/cp011.b64" > "$work/cp011.tar.gz"
          echo "6ca90b61b997f580c0e5e8a6070b974c6543eba62c8ba9b3e8d0eed76bc4afea  $work/cp011.tar.gz" | sha256sum --check --strict
          mkdir -p "$work/extracted" "$target/foundation"
          tar -xzf "$work/cp011.tar.gz" -C "$work/extracted"

          cp "$work"/extracted/foundation/cp011-*.ts "$target/foundation/"
          cp "$work"/extracted/tmw-001-cp011*.ts "$target/"
          cp "$work"/extracted/TMW-CP-011-*.md "$target/"
          cp "$work/extracted/tmw-cp011-runtime-proof.yml" .github/workflows/tmw-cp011-runtime-proof.yml

          if ! grep -q 'foundation/cp011-types' "$target/index.ts"; then
            cat >> "$target/index.ts" <<'EXPORTS'
          export * from "./foundation/cp011-types";
          export * from "./foundation/cp011-registry";
          export * from "./foundation/cp011-engine";
          export * from "./foundation/cp011-presentation";
          export * from "./foundation/cp011-options";
          export * from "./foundation/cp011-runtime";
          export * from "./foundation/cp011-review";
          EXPORTS
          fi

          rm -f .github/cp011v2-*
          rm -f .github/cp011-payload-*
          rm -f .github/workflows/tmw-cp011-bootstrap.yml

      - name: Commit materialised package
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(tmw): materialise CP-011 variable-productivity runtime proof"
          git push origin "HEAD:${branch}"
