name: Temporary base AVG-001 engine wire

on:
  pull_request_target:
    branches:
      - feat/avg-001-cp001-runtime-proof
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/avg-001-question-studio-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/avg-001-question-studio-integration
          fetch-depth: 0
      - name: Patch and commit Quant V4 engine
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/quant-v4/generation-engine.ts')
          text = path.read_text()
          if 'runAvg001QuestionStudioPipeline' not in text:
              anchor = 'import {\n  existsSync,'
              addition = '''import {
  AVG_001_QUESTION_STUDIO_CP_IDS,
  runAvg001QuestionStudioPipeline,
  type Avg001QuestionStudioCpId,
} from "./topics/Arithmetic/subtopics/Average/AVG-001/question-studio-adapter";
'''
              assert anchor in text
              text = text.replace(anchor, addition + anchor, 1)
          if '| "AVG-001"' not in text:
              anchor = '  | "RAP-003";'
              assert anchor in text
              text = text.replace(anchor, '  | "RAP-003"\n  | "AVG-001";', 1)
          if 'packageId: "AVG-001"' not in text:
              anchor = '  {\n    packageId: "RAP-001",'
              addition = '''  {
    packageId: "AVG-001",
    topic: "Arithmetic",
    subtopic: "Average",
    label: "Average",
    cpIds: AVG_001_QUESTION_STUDIO_CP_IDS,
    supportedLanguages: ENGLISH_ONLY_PREVIEW_LANGUAGES,
    run: (cpId, input) =>
      runAvg001QuestionStudioPipeline(cpId as Avg001QuestionStudioCpId, {
        difficulty: input.difficulty,
        language: input.language,
        questionLanguageId: input.questionLanguageId,
        seed: input.seed,
      }),
  },
'''
              assert anchor in text
              text = text.replace(anchor, addition + anchor, 1)
          path.write_text(text)
          for workflow in [
              '.github/workflows/tmp-avg-001-engine-wire.yml',
              '.github/workflows/tmp2-avg-001-engine-wire.yml',
              '.github/workflows/tmp3-avg-001-engine-wire.yml',
          ]:
              candidate = Path(workflow)
              if candidate.exists(): candidate.unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/api-server/src/quant-v4/generation-engine.ts .github/workflows/
          git commit -m "feat(avg): wire AVG-001 into Quant V4 generation engine"
          git push origin HEAD:feat/avg-001-question-studio-integration
