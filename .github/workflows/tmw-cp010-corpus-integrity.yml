name: Validate TMW-001 CP010 corpus integrity

on:
  push:
    branches:
      - fix/tmw-001-cp010-multilingual-editorial-review
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/**
      - .github/workflows/tmw-cp010-corpus-integrity.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-tmw-cp010-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: >-
          pnpm exec tsc --noEmit --target es2022 --module esnext --moduleResolution bundler
          --strictNullChecks --noImplicitAny --noImplicitReturns --noFallthroughCasesInSwitch
          --skipLibCheck --types node
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp010-corpus-semantic-working.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/cp010-corpus-cleanup-finalizer.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/chapter-localized-runtime.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp010-corpus-integrity.test.ts
      - name: Bundle corpus integrity proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-cp010-corpus-integrity.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-cp010-corpus-integrity.test.mjs
      - name: Run 864 corpus-integrity cases
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/tmw-001-cp010-corpus-integrity.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/tmw-001-cp010-corpus-integrity.log
      - name: Upload corpus-integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmw-001-cp010-corpus-integrity
          path: artifacts/api-server/dist/quant-v4/tmw-001-cp010-corpus-integrity.log
          if-no-files-found: warn
          retention-days: 14
