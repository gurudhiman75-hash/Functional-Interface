name: MEN-001 Export Hardening Patch

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-001-export-hardening-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Harden review HTML exports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001")
          files = [root / "human-review-export.ts", root / "structured-human-review-export.ts"]

          old_escape = '''function escapeHtml(value: unknown) {
            return String(value)
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&#39;");
          }'''
          new_escape = '''function escapeHtml(value: unknown) {
            return String(value)
              .replaceAll("&#39;", "'")
              .replaceAll("&apos;", "'")
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;");
          }

          function assertCleanUtf8Html(html: string, filename: string) {
            if (/&(?:amp;)?#39;|&apos;/.test(html)) {
              throw new Error(`${filename} contains an encoded apostrophe entity instead of a clean UTF-8 apostrophe.`);
            }
          }'''

          for path in files:
              text = path.read_text()
              if old_escape not in text:
                  raise SystemExit(f"escapeHtml block not found in {path.name}")
              path.write_text(text.replace(old_escape, new_escape, 1))

          human = root / "human-review-export.ts"
          text = human.read_text()
          title = '<title>MEN-001 Visual Human Review</title>'
          mathjax = '''<title>MEN-001 Visual Human Review</title>
          <script>
          window.MathJax = { tex: { inlineMath: [["\\\\(", "\\\\)"]], displayMath: [["$$", "$$"], ["\\\\[", "\\\\]"]] } };
          </script>
          <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>'''
          if mathjax not in text:
              if title not in text:
                  raise SystemExit("human review title not found")
              text = text.replace(title, mathjax, 1)
          css = '.options li, .explanation li { padding: 4px 7px; }'
          css_new = '.options li, .explanation li { padding: 4px 7px; }\n.explanation li { white-space: pre-wrap; }'
          if css_new not in text:
              if css not in text:
                  raise SystemExit("human review explanation CSS not found")
              text = text.replace(css, css_new, 1)
          write = 'fs.writeFileSync(path.join(outputDir, "men-001-human-review.html"), html, "utf8");'
          write_new = 'assertCleanUtf8Html(html, "men-001-human-review.html");\n' + write
          if write_new not in text:
              if write not in text:
                  raise SystemExit("human review write call not found")
              text = text.replace(write, write_new, 1)
          human.write_text(text)

          structured = root / "structured-human-review-export.ts"
          text = structured.read_text()
          marker = '''fs.writeFileSync(
            path.join(outputDir, "men-001-structured-review.html"),'''
          replacement = '''assertCleanUtf8Html(html, "men-001-structured-review.html");
          fs.writeFileSync(
            path.join(outputDir, "men-001-structured-review.html"),'''
          if replacement not in text:
              if marker not in text:
                  raise SystemExit("structured review write call not found")
              text = text.replace(marker, replacement, 1)
          structured.write_text(text)
          PY

      - name: Commit export fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/human-review-export.ts
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-human-review-export.ts
          git commit -m "fix(mensuration): emit clean UTF-8 review HTML"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
