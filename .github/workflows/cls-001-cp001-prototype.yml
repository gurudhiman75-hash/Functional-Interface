name: Validate CLS-001 CP-001 Semantic Prototypes

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Classification/CLS-001/**
      - .github/workflows/cls-001-cp001-prototype.yml

permissions:
  contents: read

jobs:
  validate-semantic-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle CLS-CP-001 audits
        run: |
          ROOT=src/reasoning-v1/topics/Classification/CLS-001/CLS-CP-001
          OUT=dist/reasoning-v1/cls-001
          mkdir -p artifacts/api-server/$OUT
          for TEST in prototype hierarchy-ambiguity editorial-difficulty cp001-coherent-group-runtime cp001-permanent-runtime cp001-multilingual-runtime; do
            pnpm --dir artifacts/api-server exec esbuild "$ROOT/$TEST.test.ts" --bundle --platform=node --format=esm --outfile="$OUT/$TEST.test.mjs"
          done

      - name: Run CLS-CP-001 audits
        run: |
          for TEST in prototype hierarchy-ambiguity editorial-difficulty cp001-coherent-group-runtime cp001-permanent-runtime cp001-multilingual-runtime; do
            (cd artifacts/api-server && node "dist/reasoning-v1/cls-001/$TEST.test.mjs")
          done

      - name: Generate discovery review export
        run: |
          ROOT=src/reasoning-v1/topics/Classification/CLS-001/CLS-CP-001
          OUT=dist/reasoning-v1/cls-001
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/export-review.ts" --bundle --platform=node --format=esm --outfile="$OUT/export-review.mjs"
          (cd artifacts/api-server && node "$OUT/export-review.mjs")

      - name: Generate permanent multilingual review export
        run: |
          ROOT=src/reasoning-v1/topics/Classification/CLS-001/CLS-CP-001
          OUT=dist/reasoning-v1/cls-001
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/export-cp001-permanent-review.ts" --bundle --platform=node --format=esm --outfile="$OUT/export-cp001-permanent-review.mjs"
          (cd artifacts/api-server && node "$OUT/export-cp001-permanent-review.mjs")

      - name: Upload semantic discovery review
        uses: actions/upload-artifact@v4
        with:
          name: cls-001-cp001-semantic-prototype-review
          path: artifacts/api-server/dist/reasoning-v1/cls-001/cp001-review
          if-no-files-found: error

      - name: Upload permanent multilingual review
        uses: actions/upload-artifact@v4
        with:
          name: cls-001-cp001-permanent-multilingual-review
          path: artifacts/api-server/dist/reasoning-v1/cls-001/cp001-permanent-review
          if-no-files-found: error
