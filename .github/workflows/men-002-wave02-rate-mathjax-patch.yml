name: MEN-002 Wave02 Rate MathJax Patch

on:
  pull_request:
    branches:
      - feat/men-002-cp007-gap-wave-01
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-002-wave02-rate-mathjax-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Correct rate display equation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-02/runtime.ts")
          text = path.read_text()
          old = r'equation: `$$Rate=\frac{\text{£}${cost}}{${tsa}\text{ m}^{2}}=\text{£}${rate}/\text{m}^{2}$$`'
          new = r'equation: `$$Rate=\frac{\text{£}${cost}}{${tsa}\text{ m}^{2}}=\frac{\text{£}${rate}}{\text{m}^{2}}$$`'
          if text.count(old) != 1:
            raise SystemExit(f"Expected one rate equation match, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-02/runtime.ts
          git commit -m "fix(mensuration): render Wave-02 rate as MathJax fraction"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
