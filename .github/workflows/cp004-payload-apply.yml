name: Apply NUM-CP-004 completion payload

permissions:
  contents: write

on:
  pull_request:
    paths:
      - ".cp004-upload/**"
      - ".github/workflows/cp004-payload-apply.yml"

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Validate, decode and stage payload
        shell: bash
        run: |
          set -euo pipefail
          for chunk in .cp004-upload/chunk-*; do
            echo "validating ${chunk}: $(wc -c < "${chunk}") bytes"
            base64 -d "${chunk}" > /dev/null
          done
          cat .cp004-upload/chunk-* > /tmp/cp004-payload.b64
          base64 -d /tmp/cp004-payload.b64 > /tmp/cp004-payload.tar.gz
          tar -xzf /tmp/cp004-payload.tar.gz -C .
          mv .github/workflows/num-001-cp004-completion-freeze.yml /tmp/num-001-cp004-completion-freeze.yml
          rm -rf .cp004-upload

      - name: Commit completion authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ExamTree CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(number-system): complete NUM-CP-004 English authority"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
