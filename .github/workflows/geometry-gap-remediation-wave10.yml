name: Validate Geometry Gap Remediation Wave 10
on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/quant-v4/shared/geometry/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/**
      - .github/workflows/geometry-gap-remediation-wave10.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: geometry-gap-remediation-wave10-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-geometry-gap-remediation-wave10:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir artifacts/api-server build
      - run: node artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/source-audit/validate-source-saturation-audit-v1.mjs
      - name: Retain Geometry phases
        run: |
          set -euo pipefail
          for phase in 0 1 2 3 4 5; do
            pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/run-phase${phase}.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-phase${phase}-retained-for-wave10.mjs
            node artifacts/api-server/dist/quant-v4/geometry-phase${phase}-retained-for-wave10.mjs
          done
      - name: Retain Waves 1 through 9
        run: |
          set -euo pipefail
          for wave in 1 2 3 4 5 6 7 8 9; do
            pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/gap-remediation-wave${wave}.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-wave${wave}-retained-for-wave10.mjs
            node artifacts/api-server/dist/quant-v4/geometry-wave${wave}-retained-for-wave10.mjs
          done
      - name: Wave 10 proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/gap-remediation-wave10.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-wave10.mjs
          node artifacts/api-server/dist/quant-v4/geometry-wave10.mjs
      - name: Export review
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/source-remediation/wave10-review-export.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-wave10-review-export.mjs
          (cd artifacts/api-server && node dist/quant-v4/geometry-wave10-review-export.mjs)
      - uses: actions/upload-artifact@v4
        with:
          name: geometry-gap-remediation-wave10-review
          path: artifacts/api-server/dist/quant-v4/geometry-gap-remediation-wave10-review
          if-no-files-found: error
          retention-days: 30
