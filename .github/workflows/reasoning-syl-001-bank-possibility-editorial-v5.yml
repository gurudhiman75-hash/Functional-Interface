name: Validate SYL-001 Banking possibility editorial V5

on:
  pull_request:
    branches:
      - audit/syl-001-source-profile-freeze
      - feat/syl-001-learner-v4
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-editorial-v5.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-editorial-v5-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-review-question-v4.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-four-term-venn-v4.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-shell-v1.ts
      - .github/workflows/reasoning-syl-001-bank-possibility-editorial-v5.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-syl-001-bank-possibility-editorial-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-editorial-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle editorial V5 audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-editorial-v5-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-bank-possibility-editorial-v5-audit.test.mjs

      - name: Run editorial V5 audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-editorial-v5-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-editorial-v5-audit.log

      - name: Upload editorial audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syl-001-bank-possibility-editorial-v5
          path: artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-editorial-v5-audit.log
          if-no-files-found: error
          retention-days: 30
