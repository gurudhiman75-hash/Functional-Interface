name: quant-v4-di-pie-fully-visible-di005-v1

on:
  pull_request:
    branches: [New-main]
    paths:
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-005/**"
  workflow_dispatch:

concurrency:
  group: quant-v4-di-pie-fully-visible-di005-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fully-visible-pie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fully-visible pie deterministic and visual proof
        run: npx -y tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-005/fully-visible-pie-v1.test.ts
      - name: Fully-visible pie Question Studio integration
        run: npx -y tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-005/fully-visible-question-studio-v1.test.ts
      - name: Generate learner-facing review HTML
        run: npx -y tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-005/export-fully-visible-review-v1.ts /tmp/DI-005-FULLY-VISIBLE-REVIEW-V1.html
      - name: Lifecycle locks
        run: |
          ! grep -R 'questionBankWritable: true\|testEligible: true\|mockTestEligible: true\|publiclyPublishable: true\|automaticStudentPublication: true\|productionReleaseAuthorized: true' artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-005/fully-visible-pie-v1.ts artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-005/fully-visible-question-studio-v1.test.ts
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: di-005-fully-visible-pie-review-v1
          path: /tmp/DI-005-FULLY-VISIBLE-REVIEW-V1.html
          if-no-files-found: error
      - name: Patch hygiene
        run: git diff --check
