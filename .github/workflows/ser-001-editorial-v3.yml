name: Validate SER-001 natural explanations V3

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/**
      - .github/workflows/ser-001-editorial-v3.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-editorial-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-series-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directories
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/editorial-v3

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Validate conservative legacy patcher
        run: |
          python3 artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-EDITORIAL-V3/tools/test_patch_series_explanations.py

      - name: Bundle chapter-wide V3 audit
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Series/SER-001/SER-EDITORIAL-V3/ser-v3-natural-final.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/ser-001/ser-v3-natural-final.test.mjs

      - name: Run chapter-wide V3 audit
        run: |
          set -euo pipefail
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/editorial-v3/audit.json
          (cd artifacts/api-server && node dist/reasoning-v1/ser-001/ser-v3-natural-final.test.mjs) \
            | tee "$EVIDENCE"
          test -s "$EVIDENCE"
          grep -q 'PASS_SER_V3_NATURAL_ALL_CHECKPOINTS' "$EVIDENCE"

      - name: Generate all checkpoint review packs
        run: |
          set -euo pipefail
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/editorial-v3
          for CP in 001 002 003 004 005 006; do
            ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-$CP
            pnpm --dir artifacts/api-server exec esbuild \
              "$ROOT/export-review.ts" \
              --bundle --platform=node --format=esm \
              --outfile="$OUT/export-cp$CP-v3-review.mjs"
            (cd artifacts/api-server && node "$OUT/export-cp$CP-v3-review.mjs") \
              > "$EVIDENCE/ser-cp-$CP-en-IN-v3-review.md"
            test -s "$EVIDENCE/ser-cp-$CP-en-IN-v3-review.md"
          done
          cp artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-EDITORIAL-V3/SER-V3-NATURAL-EXPLANATION-BLUEPRINT.md \
            "$EVIDENCE/SER-V3-NATURAL-EXPLANATION-BLUEPRINT.md"
          cp artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-EDITORIAL-V3/SER-V3-NATURAL-SYSTEM-PROMPT.md \
            "$EVIDENCE/SER-V3-NATURAL-SYSTEM-PROMPT.md"
          cp artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-EDITORIAL-V3/tools/patch_series_explanations.py \
            "$EVIDENCE/patch_series_explanations.py"

      - name: Upload chapter-wide V3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-natural-explanations-v3
          path: artifacts/api-server/dist/reasoning-v1/ser-001/editorial-v3
          if-no-files-found: error
          retention-days: 30
