name: Validate private QS production worker
on:
  pull_request:
    branches: [New-main]
    paths:
      - 'artifacts/api-server/src/question-studio/production-private-worker-oidc.ts'
      - 'artifacts/api-server/src/question-studio/remote-universal-studio-client.ts'
      - 'artifacts/api-server/src/async-task-receiver-prod-standalone.ts'
      - 'artifacts/api-server/prod-universal-worker-service.mjs'
      - 'artifacts/api-server/universal-question-studio-worker-service.mjs'
      - 'artifacts/api-server/production-canary-worker-scope.mjs'
      - 'artifacts/api-server/src/question-studio/prod-one-run-enqueue.ts'
      - 'tests/qs-prod-single-use-enqueue-and-worker-ttl.test.mjs'
      - 'Dockerfile.examtree-qs-prod-universal-worker'
      - 'cloudbuild.examtree-qs-prod-universal-worker.yaml'
      - 'tests/qs-prod-private-worker-iam.test.mjs'
permissions:
  contents: read
concurrency:
  group: qs-prod-private-worker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @workspace/api-server...
      - run: node --test tests/qs-prod-private-worker-iam.test.mjs
      - name: Compile production OIDC receiver with private-worker IAM
        run: node artifacts/api-server/build-qs-prod-task-receiver.mjs
      - run: node --test tests/qs-prod-single-use-enqueue-and-worker-ttl.test.mjs
      - run: node --test tests/qs-prod-receiver-disabled-boot.test.mjs
