name: Validate SEA-002 CP007 Wave01 mixed facing discovery

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp007/**"
      - ".github/workflows/sea-002-cp007-wave01-mixed-facing-v1.yml"
  workflow_dispatch:

concurrency:
  group: sea-002-cp007-wave01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-sea-002-cp007-wave01:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle SEA-002 CP007 Wave01 audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp007/wave01.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/sea-002-cp007-wave01.mjs

      - name: Run SEA-002 CP007 Wave01 audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/sea-002-cp007-wave01.mjs \
            2>&1 | tee artifacts/api-server/dist/reasoning-v1/sea-002-cp007-wave01.log

      - name: Re-prove SEA-002 CP006 completion authority
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp006/cp006-completion-authority.test.ts

      - name: Upload Wave01 evidence
        uses: actions/upload-artifact@v4
        with:
          name: sea-002-cp007-wave01-mixed-facing-v1
          path: artifacts/api-server/dist/reasoning-v1/sea-002-cp007-wave01.log
          if-no-files-found: error
          retention-days: 30
