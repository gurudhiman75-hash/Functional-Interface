name: Validate SPA-FND-001 Permanent QL Allocation V1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-permanent-ql-allocation-v1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle allocation and approved-review regressions
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          for test in \
            spatial-mirror-water-proof \
            spatial-proposed-ql-human-review-pack-v1 \
            spatial-permanent-ql-allocation-v1
          do
            pnpm --dir artifacts/api-server exec esbuild \
              src/reasoning-v1/tests/${test}.test.ts \
              --bundle --platform=node --format=esm \
              --outfile=dist/reasoning-v1/spatial/${test}.test.mjs
          done

      - name: Revalidate MIR/WAT reviewed geometry
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-mirror-water-proof.test.mjs

      - name: Rebuild approved 120-question review surface
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-proposed-ql-human-review-pack-v1.test.mjs

      - name: Validate permanent QL allocation
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-permanent-ql-allocation-v1.test.mjs

      - name: Upload permanent allocation evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-permanent-ql-allocation-v1
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/spa-permanent-ql-allocation-v1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-proposed-ql-human-review-pack-v1.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-proposed-ql-human-review-pack-v1.html
            artifacts/api-server/dist/reasoning-v1/spatial/spa-proposed-ql-human-review-pack-v1-evidence.json
          if-no-files-found: error
