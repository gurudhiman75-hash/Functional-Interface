name: Validate NUM-CP-004 English Editorial V2

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/**
      - .github/workflows/num-001-cp004-editorial-v2.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp004-editorial-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp004-editorial-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle frozen CP004 runtime regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-004/permanent/runtime-proof.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp004-editorial-v2-runtime-regression.mjs

      - name: Run frozen CP004 runtime regression
        working-directory: artifacts/api-server
        run: node dist/quant-v4/num-cp004-editorial-v2-runtime-regression.mjs

      - name: Bundle rule-first Editorial V2 audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-004/permanent/editorial-v2-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp004-editorial-v2-audit.mjs

      - name: Run rule-first Editorial V2 audit
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/num-cp004-editorial-v2-audit.mjs \
            2>&1 | tee dist/quant-v4/num-cp004-editorial-v2.log

      - name: Upload CP004 English review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: num-001-cp004-editorial-v2-rule-first-review
          path: |
            artifacts/api-server/dist/quant-v4/num-cp004-editorial-v2.log
            artifacts/api-server/dist/quant-v4/num-cp004-editorial-v2/num-cp004-editorial-v2-audit.json
            artifacts/api-server/dist/quant-v4/num-cp004-editorial-v2/num-cp004-editorial-v2-112q-review.json
            artifacts/api-server/dist/quant-v4/num-cp004-editorial-v2/num-cp004-editorial-v2-112q-review.md
          if-no-files-found: warn
          retention-days: 30
