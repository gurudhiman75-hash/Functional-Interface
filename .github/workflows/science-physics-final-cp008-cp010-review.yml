name: Validate Science Physics Exhaustive V2 and Depth V3

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/science/electricity/**"
      - "artifacts/api-server/src/knowledge-v1/science/magnetism-electromagnetism/**"
      - "artifacts/api-server/src/knowledge-v1/science/modern-physics/**"
      - "artifacts/api-server/src/knowledge-v1/science/sci-cp008-cp010-*"
      - "artifacts/api-server/src/knowledge-v1/science/physics-exhaustive-v2/**"
      - "artifacts/api-server/src/knowledge-v1/science/physics-depth-v3/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: science-physics-exhaustive-v2-depth-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run legacy CP008-CP010 qualification gate
        run: |
          mkdir -p artifacts/api-server/dist/science
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/science/sci-cp008-cp010-review-v1.test.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/science/sci-cp008-cp010-review-v1.test.mjs
          node artifacts/api-server/dist/science/sci-cp008-cp010-review-v1.test.mjs
      - name: Run Physics exhaustive V2 qualification gate
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/science/physics-exhaustive-v2/sci-physics-exhaustive-v2.test.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/science/sci-physics-exhaustive-v2.test.mjs
          node artifacts/api-server/dist/science/sci-physics-exhaustive-v2.test.mjs
      - name: Run Physics Depth V3 CP001-CP004 qualification gate
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/science/physics-depth-v3/sci-physics-depth-v3.test.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/science/sci-physics-depth-v3.test.mjs
          node artifacts/api-server/dist/science/sci-physics-depth-v3.test.mjs
      - name: Materialize Physics exhaustive V2 review artifact
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/science/physics-exhaustive-v2/sci-physics-exhaustive-export-v2.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/science/sci-physics-exhaustive-export-v2.mjs
          cd artifacts/api-server
          node dist/science/sci-physics-exhaustive-export-v2.mjs
      - name: Materialize Physics Depth V3 review artifact
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/science/physics-depth-v3/sci-physics-depth-export-v3.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/science/sci-physics-depth-export-v3.mjs
          cd artifacts/api-server
          node dist/science/sci-physics-depth-export-v3.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: SCI-PHYSICS-EXHAUSTIVE-V2
          path: artifacts/api-server/dist/science-review/SCI-PHYSICS-EXHAUSTIVE-V2/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SCI-PHYSICS-DEPTH-V3-CP001-CP004
          path: artifacts/api-server/dist/science-review/SCI-PHYSICS-DEPTH-V3/
          if-no-files-found: error
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
