name: Validate NUM-CP-001 Wave 05 merge-split audit

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/**
      - .github/workflows/num-001-cp001-wave05-merge-split-audit.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp001-wave05-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp001-wave05:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Wave 1 regression proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/wave01/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-wave05-wave01-regression.test.mjs

      - name: Run Wave 1 regression proof
        run: node artifacts/api-server/dist/quant-v4/num-001-cp001-wave05-wave01-regression.test.mjs

      - name: Bundle Wave 2 regression proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/wave02/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-wave05-wave02-regression.test.mjs

      - name: Run Wave 2 regression proof
        run: node artifacts/api-server/dist/quant-v4/num-001-cp001-wave05-wave02-regression.test.mjs

      - name: Bundle Wave 3 regression proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/wave03/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-wave05-wave03-regression.test.mjs

      - name: Run Wave 3 regression proof
        run: node artifacts/api-server/dist/quant-v4/num-001-cp001-wave05-wave03-regression.test.mjs

      - name: Bundle Wave 4 regression proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/wave04/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-wave05-wave04-regression.test.mjs

      - name: Run Wave 4 regression proof
        run: node artifacts/api-server/dist/quant-v4/num-001-cp001-wave05-wave04-regression.test.mjs

      - name: Bundle Wave 4 representation regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/wave04/representation-equivalence.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-wave05-representation-regression.test.mjs

      - name: Run Wave 4 representation regression
        run: node artifacts/api-server/dist/quant-v4/num-001-cp001-wave05-representation-regression.test.mjs

      - name: Bundle Wave 4 saturation regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/wave04/source-saturation.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-wave05-saturation-regression.test.mjs

      - name: Run Wave 4 saturation regression
        run: node artifacts/api-server/dist/quant-v4/num-001-cp001-wave05-saturation-regression.test.mjs

      - name: Bundle merge-split authority audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/audit/merge-split-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-wave05-merge-split.test.mjs

      - name: Run merge-split authority audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp001-wave05-merge-split.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp001-wave05-merge-split.log

      - name: Bundle merge compatibility proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/audit/merge-compatibility.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-wave05-merge-compatibility.test.mjs

      - name: Run merge compatibility proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp001-wave05-merge-compatibility.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp001-wave05-merge-compatibility.log

      - name: Upload Wave 5 audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: num-001-cp001-wave05-merge-split
          path: |
            artifacts/api-server/dist/quant-v4/num-001-cp001-wave05-merge-split.log
            artifacts/api-server/dist/quant-v4/num-001-cp001-wave05-merge-compatibility.log
          if-no-files-found: error
          retention-days: 14
