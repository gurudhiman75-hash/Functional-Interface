name: Apply SEA-001 semantic answer-slot balancing patch

on:
  push:
    branches:
      - feat/sea-001-structural-realness-hardening
    paths:
      - .github/workflows/sea-001-apply-option-balance-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sea-001-structural-realness-hardening
      - name: Replace name-coupled answer-position shuffle
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/generation/person-presentation.ts')
          text = path.read_text()
          old = '''    const random = new DeterministicRandom(
              `${presentationSeed}:visible-options:${child.queryContractId}:${child.answerDeterminingFactFingerprint}:Q${questionOrder}`,
            );
            const options = random.shuffle(child.options);
            const answerIndex = options.findIndex((option) => option.isCorrect);
            if (answerIndex < 0) throw new Error(`SEA-001 child ${child.queryContractId} lost its correct option`);
            return {
              ...child,
              questionOrder,
              options,
              answerIndex,
            };'''
          new = '''    const random = new DeterministicRandom(
              `${presentationSeed}:visible-distractors:${child.queryContractId}:${child.answerDeterminingFactFingerprint}:Q${questionOrder}`,
            );
            const shuffled = random.shuffle(child.options);
            const correctOption = shuffled.find((option) => option.isCorrect);
            if (!correctOption) throw new Error(`SEA-001 child ${child.queryContractId} lost its correct option`);
            const distractors = shuffled.filter((option) => !option.isCorrect);
            const answerIndex = (stableNumber(
              `${child.queryContractId}|${child.answerDeterminingFactFingerprint}|Q${questionOrder}|answer-slot-v1`,
            ) % 4) as 0 | 1 | 2 | 3;
            distractors.splice(answerIndex, 0, correctOption);
            return {
              ...child,
              questionOrder,
              options: distractors,
              answerIndex,
            };'''
          if old not in text:
              raise SystemExit('Expected SEA-001 option-shuffle block not found; refusing broad edit')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/generation/person-presentation.ts
      - name: Commit semantic answer-slot patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/generation/person-presentation.ts
          git commit -m "fix(seating): decouple answer slots from display names"
          git push origin HEAD:feat/sea-001-structural-realness-hardening
