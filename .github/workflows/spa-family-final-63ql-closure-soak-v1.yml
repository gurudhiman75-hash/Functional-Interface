name: Validate SPA 63-QL Final Unified Closure Soak V1

on:
  pull_request:
    branches:
      - New-main
    paths:
      - 'artifacts/api-server/src/reasoning-v1/tests/spatial-family-final-63ql-closure-soak-v1.test.ts'
      - 'artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-family-final-closure-audit-v2.ts'
      - 'artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-permanent-ql-allocation-v13.ts'
      - 'artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-question-studio-integration-v9.ts'
      - 'artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-question-studio-production-v9.ts'
      - 'artifacts/api-server/src/reasoning-v1/foundation/spatial/cubes-dice-test-builder-activation-v1.ts'
      - 'artifacts/api-server/src/reasoning-v1/foundation/spatial/cubes-dice-question-studio-test-builder-runtime-v1.ts'
      - 'artifacts/api-server/src/question-studio/shared-generation-engine-sri.ts'
      - 'artifacts/api-server/src/routes/admin-question-studio-registry.ts'
  workflow_dispatch:

concurrency:
  group: spa-family-final-63ql-closure-soak-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle unified 63-QL closure soak
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-family-final-63ql-closure-soak-v1.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/reasoning-v1/spatial/spatial-family-final-63ql-closure-soak-v1.test.mjs

      - name: Run unified 63-QL closure soak
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-family-final-63ql-closure-soak-v1.test.mjs 2>&1 \
            | tee dist/reasoning-v1/spatial/spa-family-final-63ql-closure-soak-v1-run.log

      - name: Upload unified 63-QL closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spa-family-final-63ql-closure-soak-v1
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/spa-family-final-63ql-closure-soak-v1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-family-final-63ql-closure-soak-v1-run.log
          if-no-files-found: error
