name: Reasoning BLR-001 CP-007 Approved English Freeze Audit

on:
  push:
    branches:
      - audit/blr-001-cp007-approved-english-freeze
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/**"
      - ".github/workflows/reasoning-blr-001-cp007-approved-english-freeze-audit.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/**"
      - ".github/workflows/reasoning-blr-001-cp007-approved-english-freeze-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blr-001-cp007-approved-english-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-approved-english-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove approved CP-007 semantic and editorial corpus
        run: |
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-editorial-v4-wave3-final.test.ts | tee cp007-approved-final.log

      - name: Prove retained chapter-wide 35-QL audit
        run: |
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/blr-001-english-gap-audit.test.ts | tee blr-001-retained-gap-audit.log

      - name: Audit approved CP-007 learner-facing English
        run: |
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/blr-001-approved-english-freeze-audit.test.ts | tee blr-001-approved-english-freeze-audit.log

      - name: Export approved English-freeze review pack
        run: |
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/export-blr-001-approved-english-freeze-audit.ts blr-001-approved-english-freeze-audit-output | tee blr-001-approved-english-freeze-export.log

      - name: Verify review-pack contracts
        shell: bash
        run: |
          set -euo pipefail
          OUT=blr-001-approved-english-freeze-audit-output
          test -f "$OUT/blr-001-approved-english-freeze-audit-summary.json"
          test -f "$OUT/blr-001-approved-english-freeze-audit-findings.json"
          test -f "$OUT/blr-001-approved-english-freeze-audit-findings.csv"
          test -f "$OUT/blr-001-approved-english-freeze-template-clusters.json"
          test -f "$OUT/blr-001-approved-english-freeze-audit-review.html"
          test -f "$OUT/BLR-001-APPROVED-ENGLISH-FREEZE-AUDIT.md"
          grep -q '"approvedCorpusQuestionCount": 168' "$OUT/blr-001-approved-english-freeze-audit-summary.json"
          grep -q '"permanentQlCount": 35' "$OUT/blr-001-approved-english-freeze-audit-summary.json"
          grep -q '"blockerCount": 0' "$OUT/blr-001-approved-english-freeze-audit-summary.json"
          grep -q '"verdict": "APPROVED_CORPUS_ENGLISH_FREEZE_REVIEW_CANDIDATE"' "$OUT/blr-001-approved-english-freeze-audit-summary.json"
          grep -q '@media(max-width:800px)' "$OUT/blr-001-approved-english-freeze-audit-review.html"

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp007-approved-english-freeze-audit-logs
          path: |
            cp007-approved-final.log
            blr-001-retained-gap-audit.log
            blr-001-approved-english-freeze-audit.log
            blr-001-approved-english-freeze-export.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload approved English-freeze review pack
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp007-approved-english-freeze-review
          path: blr-001-approved-english-freeze-audit-output
          if-no-files-found: error
          retention-days: 30
