name: Validate NUM-CP-001 permanent English freeze

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/**
      - .github/workflows/num-001-cp001-english-freeze.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp001-english-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp001-english-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Wave 05 merge-split regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/audit/merge-split-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-english-freeze-wave05.test.mjs

      - name: Run Wave 05 merge-split regression
        run: node artifacts/api-server/dist/quant-v4/num-001-cp001-english-freeze-wave05.test.mjs

      - name: Bundle permanent allocation proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/permanent/allocation.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-english-freeze-allocation.test.mjs

      - name: Run permanent allocation proof
        run: node artifacts/api-server/dist/quant-v4/num-001-cp001-english-freeze-allocation.test.mjs

      - name: Bundle permanent runtime proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/permanent/runtime-proof.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-permanent-runtime-proof.test.mjs

      - name: Run permanent runtime proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp001-permanent-runtime-proof.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp001-permanent-runtime-proof.log

      - name: Bundle English freeze audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/permanent/english-freeze-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-english-freeze-audit.mjs

      - name: Run English freeze audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp001-english-freeze-audit.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp001-english-freeze-audit.log

      - name: Bundle permanent review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-001/permanent/review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp001-permanent-review-export.mjs

      - name: Export permanent English review pack
        run: node artifacts/api-server/dist/quant-v4/num-001-cp001-permanent-review-export.mjs

      - name: Bundle chapter allocation registry proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/design/number-system-current-allocation-registry.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/number-system-current-allocation-registry.test.mjs

      - name: Run chapter allocation registry proof
        run: node artifacts/api-server/dist/quant-v4/number-system-current-allocation-registry.test.mjs

      - name: Upload CP001 English freeze evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: num-001-cp001-permanent-english-freeze
          path: |
            artifacts/api-server/dist/quant-v4/num-001-cp001-permanent-runtime-proof.log
            artifacts/api-server/dist/quant-v4/num-001-cp001-english-freeze-audit.log
            artifacts/api-server/dist/quant-v4/num-001-cp001-permanent-english-review.json
            artifacts/api-server/dist/quant-v4/num-001-cp001-permanent-english-review.md
            artifacts/api-server/dist/quant-v4/num-001-cp001-permanent-english-review.csv
          if-no-files-found: warn
          retention-days: 14
