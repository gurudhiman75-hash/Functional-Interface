name: Validate Geometry Phase 2 executable discovery

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/quant-v4/shared/geometry/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/**
      - .github/workflows/geometry-phase2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geometry-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-geometry-phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle retained Geometry Phase 0 proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/run-phase0.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/quant-v4/geometry-phase0-retained-for-phase2.test.mjs
      - name: Run retained Geometry Phase 0 proof
        run: node artifacts/api-server/dist/quant-v4/geometry-phase0-retained-for-phase2.test.mjs
      - name: Bundle retained Geometry Phase 1 proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/run-phase1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/quant-v4/geometry-phase1-retained-for-phase2.test.mjs
      - name: Run retained Geometry Phase 1 proof
        run: node artifacts/api-server/dist/quant-v4/geometry-phase1-retained-for-phase2.test.mjs
      - name: Bundle Geometry Phase 2 proof
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/run-phase2.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/quant-v4/geometry-phase2.test.mjs
      - name: Run Geometry Phase 2 proof
        run: node artifacts/api-server/dist/quant-v4/geometry-phase2.test.mjs
      - name: Export Geometry Phase 2 review evidence
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/GEO-001/discovery/phase2-review-export.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/quant-v4/geometry-phase2-review-export.mjs
          (cd artifacts/api-server && node dist/quant-v4/geometry-phase2-review-export.mjs)
      - name: Upload Geometry Phase 2 review evidence
        uses: actions/upload-artifact@v4
        with:
          name: geometry-phase2-temporary-prototype-review
          path: artifacts/api-server/dist/quant-v4/geometry-phase2-review
          if-no-files-found: error
          retention-days: 30
