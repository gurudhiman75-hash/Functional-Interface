name: Validate SYL-001 foundation

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/**
      - .github/workflows/reasoning-syl-001-foundation.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-syl-001-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-syl-001-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle foundation proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/foundation/foundation.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-foundation.test.mjs

      - name: Run foundation proof
        run: node artifacts/api-server/dist/reasoning-v1/syl-001-foundation.test.mjs
