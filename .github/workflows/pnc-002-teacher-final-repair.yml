name: Apply final PNC teacher repair

on:
  push:
    branches:
      - feat/pnc-002-editorial-quality-upgrade
    paths:
      - .github/workflows/pnc-002-teacher-final-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pnc-002-editorial-quality-upgrade
      - name: Patch final teacher arithmetic and parameter-safe assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002")
          presentation = root / "foundation/student-presentation-teacher-final.ts"
          text = presentation.read_text(encoding="utf-8")

          anchor = '''function powerProduct(base: number, exponent: number): string {
            if (exponent === 0) return "1";
            return Array.from({ length: exponent }, () => String(base)).join(" \\\\times ");
          }
          '''
          addition = anchor + '''
          function descendingProduct(start: number, terms: number): string {
            if (terms <= 0) return "1";
            return Array.from({ length: terms }, (_, index) => String(start - index)).join(" \\\\times ");
          }

          function combination(total: number, selected: number): number | undefined {
            if (!Number.isInteger(total) || !Number.isInteger(selected) || selected < 0 || selected > total || total > 30) return undefined;
            const k = Math.min(selected, total - selected);
            let result = 1;
            for (let index = 1; index <= k; index += 1) result = (result * (total - k + index)) / index;
            return Number.isInteger(result) ? result : undefined;
          }

          function permutation(total: number, selected: number): number | undefined {
            if (!Number.isInteger(total) || !Number.isInteger(selected) || selected < 0 || selected > total || total > 12) return undefined;
            let result = 1;
            for (let index = 0; index < selected; index += 1) result *= total - index;
            return result;
          }
          '''
          if anchor not in text:
            raise SystemExit("powerProduct anchor not found")
          text = text.replace(anchor, addition, 1)

          loop_anchor = '''  for (const match of math.matchAll(/(\\d+)!/g)) {
          '''
          loops = '''  for (const match of math.matchAll(/\\\\binom\\{(\\d+)\\}\\{(\\d+)\\}/g)) {
            const token = match[0];
            if (present.has(token)) continue;
            const total = Number(match[1]);
            const selected = Number(match[2]);
            const value = combination(total, selected);
            if (value === undefined) continue;
            const line = `**Evaluate the selection factor:** $${token} = \\\\frac{${descendingProduct(total, selected)}}{${factorialProduct(selected)}} = ${value}$.`;
            additions.push({ token, value, line });
            present.add(token);
          }

          for (const match of math.matchAll(/\\{\\}\\^\\{?(\\d+)\\}?P_\\{?(\\d+)\\}?/g)) {
            const token = match[0];
            if (present.has(token)) continue;
            const total = Number(match[1]);
            const selected = Number(match[2]);
            const value = permutation(total, selected);
            if (value === undefined) continue;
            const line = `**Evaluate the ordered factor:** $${token} = ${descendingProduct(total, selected)} = ${value}$.`;
            additions.push({ token, value, line });
            present.add(token);
          }

          for (const match of math.matchAll(/\\{\\}\\^\\{?(\\d+)\\}?C_\\{?(\\d+)\\}?/g)) {
            const token = match[0];
            if (present.has(token)) continue;
            const total = Number(match[1]);
            const selected = Number(match[2]);
            const value = combination(total, selected);
            if (value === undefined) continue;
            const line = `**Evaluate the selection factor:** $${token} = \\\\frac{${descendingProduct(total, selected)}}{${factorialProduct(selected)}} = ${value}$.`;
            additions.push({ token, value, line });
            present.add(token);
          }

          ''' + loop_anchor
          if loop_anchor not in text:
            raise SystemExit("arithmetic loop anchor not found")
          text = text.replace(loop_anchor, loops, 1)
          presentation.write_text(text, encoding="utf-8")

          proof = root / "pnc-002-editorial-quality-teacher-final.test.ts"
          proof_text = proof.read_text(encoding="utf-8")
          old = '''assert.match(combined("PNC-QL-269", "stepByStep"), /10\\s*\\\\times\\s*3\\s*\\\\times\\s*16\\s*=\\s*480/);
          assert.doesNotMatch(combined("PNC-QL-269", "stepByStep"), /10316/);
          '''
          new = '''const ql269 = byQl.get("PNC-QL-269");
          assert.ok(ql269);
          const ql269Steps = combined("PNC-QL-269", "stepByStep");
          const ql269Combine = ql269.stepByStep.find((line) => line.includes("**Combine the evaluated stages:**"));
          assert.ok(ql269Combine, "PNC-QL-269: evaluated factors must be combined explicitly");
          assert.ok((ql269Combine.match(/\\\\times/g) ?? []).length >= 2, "PNC-QL-269: all team and captain factors must remain visible");
          assert.ok(ql269Combine.includes(`= ${ql269.answer}`), "PNC-QL-269: combined arithmetic must reach the generated answer");
          assert.doesNotMatch(ql269Steps, /10316/);
          '''
          if old not in proof_text:
            raise SystemExit("QL-269 assertion anchor not found")
          proof.write_text(proof_text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/foundation/student-presentation-teacher-final.ts
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/PermutationAndCombination/PNC-002/pnc-002-editorial-quality-teacher-final.test.ts
          git commit -m "fix(pnc): preserve equal-valued teaching factors"
          git push origin HEAD:feat/pnc-002-editorial-quality-upgrade
