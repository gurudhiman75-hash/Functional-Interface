name: MEN-002 Editorial Calibration Patch

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/scripts/men002-runtime-calibration.py

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply review-driven runtime corrections
        run: python .github/scripts/men002-runtime-calibration.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/foundation/runtime.ts
          git commit -m "fix(mensuration): calibrate MEN-CP-007 explanations and difficulty"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
