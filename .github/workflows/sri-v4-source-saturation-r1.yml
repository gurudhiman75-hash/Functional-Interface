name: Validate SRI Quant V4 Source Saturation R1

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/quant-v4/shared/surds-indices/**
      - artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/**
      - .github/workflows/sri-v4-source-saturation-r1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sri-v4-source-saturation-r1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-sri-source-saturation-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Reject Math.random in SRI
        run: |
          if grep -R "Math\.random" artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices artifacts/api-server/src/quant-v4/shared/surds-indices --include='*.ts'; then
            echo "Math.random is forbidden in SRI V4 production/discovery code."
            exit 1
          fi
      - name: Bundle source saturation audit
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/sri
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/tests/source-saturation-r1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/quant-v4/sri/source-saturation-r1.test.mjs
      - name: Run source saturation audit
        run: |
          cd artifacts/api-server
          node dist/quant-v4/sri/source-saturation-r1.test.mjs
      - name: Bundle merge-split closure audit
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/tests/merge-split-r1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/quant-v4/sri/merge-split-r1.test.mjs
      - name: Run merge-split closure audit
        run: |
          cd artifacts/api-server
          node dist/quant-v4/sri/merge-split-r1.test.mjs
