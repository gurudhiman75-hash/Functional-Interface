name: TMP Quant V4 Average CHSL count align

on:
  push:
    branches:
      - audit/quant-v4-average-chsl-pyq-normalization-wave1-p2
    paths:
      - ".github/workflows/tmp-quant-v4-average-chsl-wave1-count-align.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/quant-v4-average-chsl-pyq-normalization-wave1-p2
          fetch-depth: 0
      - name: Align cumulative registry totals only
        run: |
          set -euo pipefail
          files=(
            artifacts/api-server/src/quant-v4/quality/quant-v4-algebra-pyq-normalization-wave2-p2.test.ts
            artifacts/api-server/src/quant-v4/quality/quant-v4-algebra-pyq-normalization-wave3-p2.test.ts
            artifacts/api-server/src/quant-v4/quality/quant-v4-number-system-ssc-pyq-normalization-wave2-p2.test.ts
          )
          for file in "${files[@]}"; do
            count=$(grep -c 'QUANT_V4_REGISTERED_PYQ_OBSERVATIONS.length, 47' "$file")
            test "$count" -eq 1
            sed -i 's/QUANT_V4_REGISTERED_PYQ_OBSERVATIONS.length, 47/QUANT_V4_REGISTERED_PYQ_OBSERVATIONS.length, 53/' "$file"
          done
          git rm .github/workflows/tmp-quant-v4-average-chsl-wave1-count-align.yml
          git diff --check
      - name: Commit narrow alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/quality/quant-v4-algebra-pyq-normalization-wave2-p2.test.ts \
                  artifacts/api-server/src/quant-v4/quality/quant-v4-algebra-pyq-normalization-wave3-p2.test.ts \
                  artifacts/api-server/src/quant-v4/quality/quant-v4-number-system-ssc-pyq-normalization-wave2-p2.test.ts \
                  .github/workflows/tmp-quant-v4-average-chsl-wave1-count-align.yml
          git commit -m "test(quant-v4): align cumulative registry totals for Average wave"
          git push origin HEAD:audit/quant-v4-average-chsl-pyq-normalization-wave1-p2
