name: Validate SEA-002 CP008 permanent QL allocation V1

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/**"
      - ".github/workflows/sea-002-cp008-permanent-allocation-v1.yml"
  workflow_dispatch:

concurrency:
  group: sea-002-cp008-permanent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-sea-002-cp008-permanent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-prove Wave04 source saturation
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/source-saturation-v3.test.ts
      - name: Re-prove Wave04 structural authority set
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/solve-signature-v4.test.ts
      - name: Prove permanent inactive allocation
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/permanent/allocation.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-permanent-allocation-v1.log
      - name: Re-prove source-backed ALT12 uniqueness
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/discovery-alt12-v1.test.ts
      - name: Re-prove CP007 boundary
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp007/review/prefreeze-authority-v1.test.ts
      - name: Upload permanent allocation evidence
        uses: actions/upload-artifact@v4
        with:
          name: sea-002-cp008-permanent-allocation-v1
          path: /tmp/sea-002-cp008-permanent-allocation-v1.log
          if-no-files-found: error
          retention-days: 30
