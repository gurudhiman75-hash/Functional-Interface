name: Validate RNK-001 CP004 Localization Review V6

on:
  push:
    branches:
      - feature/rnk-cp004-localization-review-v1
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/**'
      - '.github/workflows/rnk-001-cp004-localization-review-v1.yml'
  pull_request:
    branches:
      - New-main
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/**'
      - '.github/workflows/rnk-001-cp004-localization-review-v1.yml'
  workflow_dispatch:

concurrency:
  group: rnk-001-cp004-localization-review-v6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-rnk-cp004-localization-review-v6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Prove CP004 exhaustive Hindi Punjabi V1 semantic baseline
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-localization-v1-semantic-baseline.test.ts

      - name: Prove CP004 V3 frozen runtime distractor localization baseline
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-localization-review-v3.test.ts

      - name: Prove CP004 V4 missing-comparison pedagogy baseline
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-localization-review-v4.test.ts

      - name: Prove CP004 V5 moderate deterministic editorial diversity
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-localization-review-v5.test.ts

      - name: Prove CP004 V5 Final clue-surface baseline
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-localization-review-v5-final.test.ts

      - name: Prove CP004 V6 endpoint and position option pedagogy
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-localization-review-v6.test.ts

      - name: Prove CP004 query and misconception contract coverage
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-localization-v1-static-contract.test.ts

      - name: Generate CP004 V6 targeted learner-review pack
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-localization-review-export-v6.ts /tmp/RNK-CP-004-HI-PA-LOCALIZATION-REVIEW-V6-32Q.md

      - name: Retain CP004 V6 targeted learner-review pack
        uses: actions/upload-artifact@v4
        with:
          name: rnk-cp004-hi-pa-localization-review-v6-32q
          path: /tmp/RNK-CP-004-HI-PA-LOCALIZATION-REVIEW-V6-32Q.md
          if-no-files-found: error

      - name: Re-prove CP004 frozen English permanent runtime
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-permanent-runtime-v1-gates.test.ts

      - name: Re-prove chapter-wide English closure
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/rnk-001-chapter-wide-english-content-freeze-v1.test.ts

      - name: Re-prove Ranking Object Pool V2
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/foundation/rnk-object-pool-v2.test.ts

      - name: Build API server
        run: pnpm --dir artifacts/api-server build
