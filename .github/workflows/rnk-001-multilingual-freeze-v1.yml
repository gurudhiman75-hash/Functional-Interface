name: Validate RNK-001 Multilingual Freeze V1

on:
  push:
    branches:
      - freeze/rnk-001-multilingual-approved-v1
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/**'
      - '.github/workflows/rnk-001-multilingual-freeze-v1.yml'
  pull_request:
    branches:
      - integration/rnk-001-approved-multilingual-v2
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/**'
      - '.github/workflows/rnk-001-multilingual-freeze-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rnk-001-multilingual-freeze-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-rnk-multilingual-freeze-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Prove freeze authority and delivery locks
        run: pnpm dlx tsx artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/rnk-001-multilingual-freeze-v1.test.ts

      - name: Reconstruct exact approved multilingual identity
        run: |
          bash artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/rnk-001-materialize-approved-locales-v1.sh
          mkdir -p /tmp/rnk-001-multilingual-freeze-v1
          git diff --cached --name-status > /tmp/rnk-001-multilingual-freeze-v1/APPROVED-OVERLAY-FILES.txt
          test "$(wc -l < /tmp/rnk-001-multilingual-freeze-v1/APPROVED-OVERLAY-FILES.txt)" -eq 68
          git diff --cached --binary > /tmp/rnk-001-multilingual-freeze-v1/APPROVED-OVERLAY.patch
          sha256sum /tmp/rnk-001-multilingual-freeze-v1/APPROVED-OVERLAY.patch > /tmp/rnk-001-multilingual-freeze-v1/APPROVED-OVERLAY.patch.sha256

      - name: Prove final approved native authority files are present
        run: |
          ROOT=artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001
          test -f "$ROOT/RNK-CP-001/cp001-localization-review-v4.ts"
          test -f "$ROOT/RNK-CP-002/cp002-localization-review-v2.ts"
          test -f "$ROOT/RNK-CP-003/cp003-localization-review-v4.ts"
          test -f "$ROOT/RNK-CP-004/cp004-localization-review-v6.ts"
          test -f "$ROOT/RNK-CP-005/cp005-localization-review-v3.ts"
          test -f "$ROOT/RNK-CP-006/cp006-localization-review-v1.ts"
          test -f "$ROOT/RNK-CP-007/cp007-localization-review-v4.ts"
          test -f "$ROOT/RNK-CP-007/cp007-percentage-presentation-adapter-v2.ts"

      - name: Confirm inherited combined semantic proof identity
        run: |
          test "${{ github.event.pull_request.base.sha }}" = "07ed844d248411ddd385ec0d620d56cb2692571f"
          grep -q 'runId: 32327889203' artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/rnk-001-multilingual-freeze-v1.ts
          grep -q 'artifactId: 9392687777' artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/rnk-001-multilingual-freeze-v1.ts
          grep -q 'sha256:6c08bbbcf39dc1c2d61f587623cc653c6bb25e3724e24761c891deaf8dfd0c8e' artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/rnk-001-multilingual-freeze-v1.ts

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Build admin app
        run: pnpm --dir artifacts/admin-app build

      - name: Record freeze evidence
        run: |
          cat > /tmp/rnk-001-multilingual-freeze-v1/FREEZE-EVIDENCE.txt <<'EOF'
          RNK-001 multilingual freeze V1
          Formal Hindi/Punjabi product approval: TRUE
          Combined semantic proof PR: 938
          Combined semantic proof head: 07ed844d248411ddd385ec0d620d56cb2692571f
          Combined semantic proof run: 32327889203 SUCCESS
          Combined semantic proof artifact: 9392687777
          Combined semantic proof artifact digest: sha256:6c08bbbcf39dc1c2d61f587623cc653c6bb25e3724e24761c891deaf8dfd0c8e
          Exact approved overlay file count: 68
          Multilingual freeze: TRUE
          Question Studio multilingual enabled: FALSE
          Question Bank writable: FALSE
          Test/mock eligible: FALSE
          Public publication: FALSE
          RNK-QL-043 allocated: FALSE
          EOF

      - name: Retain multilingual freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: rnk-001-multilingual-freeze-v1
          path: /tmp/rnk-001-multilingual-freeze-v1/*
          if-no-files-found: error
