name: Validate Indian Geography Localization

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/indian-geography/indian-geo-localization-v1.ts"
      - "artifacts/api-server/src/knowledge-v1/indian-geography/indian-geo-localization-*.test.ts"
      - "artifacts/api-server/src/knowledge-v1/indian-geography/indian-geo-localization-family-audit-v2.ts"
      - "artifacts/api-server/src/question-studio/engines/knowledge-v1-geo-*-adapter-v1.ts"
      - "artifacts/api-server/package.json"
      - ".github/workflows/indian-geography-localization-qa.yml"
  workflow_dispatch:

concurrency:
  group: indian-geography-localization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  localization-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Indian Geography localization QA
        run: pnpm --dir artifacts/api-server run test:indian-geo-localization
