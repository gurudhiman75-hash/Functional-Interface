name: Validate INT-CP-008 Hindi Punjabi Review V6

on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp008-instalment-english-v6-frozen.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp008-english-v6-freeze-audit.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp008-instalment-localized-v5.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp008-instalment-localized-v6.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp008-localized-v6-audit.ts'
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp008-localized-v6-review-export.ts'
      - '.github/workflows/int-cp008-localized-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: int-cp008-localized-v6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-int-cp008-localized-v6:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Rerun CP008 permanent allocation audit
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp008-permanent-allocation-v1-audit.ts > int-cp008-permanent-allocation-regression.log
      - name: Rerun frozen English V6 authority audit
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp008-english-v6-freeze-audit.ts | tee int-cp008-english-v6-freeze-regression.log
      - name: Verify frozen English V6 marker
        run: grep -q 'PASS_INT_CP008_ENGLISH_V6_FREEZE_AUDIT' int-cp008-english-v6-freeze-regression.log
      - name: Run CP008 Hindi Punjabi V6 audit
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp008-localized-v6-audit.ts | tee int-cp008-localized-v6.log
      - name: Verify CP008 Hindi Punjabi V6 marker
        run: grep -q 'PASS_INT_CP008_LOCALIZED_V6_AUDIT' int-cp008-localized-v6.log
      - name: Export CP008 Hindi Punjabi V6 manual review pack
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp008-localized-v6-review-export.ts > INT-CP-008-HI-PA-V6-REVIEW.md
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Record exact validation head
        run: |
          echo "validated_head=$(git rev-parse HEAD)" | tee int-cp008-localized-v6-head.log
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Upload CP008 Hindi Punjabi V6 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-cp008-hi-pa-v6-final-language-review
          path: |
            int-cp008-permanent-allocation-regression.log
            int-cp008-english-v6-freeze-regression.log
            int-cp008-localized-v6.log
            int-cp008-localized-v6-head.log
            INT-CP-008-HI-PA-V6-REVIEW.md
          retention-days: 30
          if-no-files-found: warn
