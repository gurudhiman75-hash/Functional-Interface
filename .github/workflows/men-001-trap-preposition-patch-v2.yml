name: MEN-001 Trap Preposition Patch V2

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-001-trap-preposition-patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Fix preposition-led distractor grammar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-common-traps.ts")
          lines = path.read_text().splitlines()

          for index, line in enumerate(lines):
              if line.strip().startswith('if (/^(the|a|an|one|only|half|double|triple|four|all|both|its|their)'):
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[index] = indent + 'if (/^(the|a|an|one|two|three|four|five|six|seven|eight|nine|ten|only|half|double|triple|all|both|its|their|\\d)\\b/i.test(value)) return value;'
                  break
          else:
              raise SystemExit("withArticle pattern not found")

          guards = {
              '    case "divide":': '      if (afterText.startsWith("by ")) return `dividing by ${afterText.slice(3)} unnecessarily`;',
              '    case "multiply":': '      if (afterText.startsWith("by ")) return `multiplying by ${afterText.slice(3)} unnecessarily`;',
          }
          for marker, guard in guards.items():
              try:
                  index = lines.index(marker)
              except ValueError:
                  raise SystemExit(f"{marker} not found")
              if guard not in lines[index + 1:index + 4]:
                  lines.insert(index + 1, guard)

          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-common-traps.ts
          git commit -m "fix(mensuration): parse divide-by and multiply-by traps"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
