name: Reasoning COD-001 CP-009 Combined Saturation

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-009/**"
      - ".github/workflows/reasoning-cod-001-cp009-saturation.yml"
  workflow_dispatch:

jobs:
  cp009-combined-saturation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run combined CP-009 saturation suite
        id: saturation_suite
        shell: bash
        run: |
          set +e
          root="artifacts/api-server/src/reasoning-v1/topics/Coding-Decoding/COD-001/COD-CP-009"
          status=0
          : > cod-cp009-combined-saturation.log

          tests=(
            "constraint-foundation.test.ts"
            "topology-generator.test.ts"
            "english-language-data.test.ts"
            "exact-atomic-prototype.test.ts"
            "exact-set-missing-prototype.test.ts"
            "possible-impossible-prototype.test.ts"
            "possible-set-prototype.test.ts"
            "resolved-composition-prototype.test.ts"
            "complete-candidate-set-prototype.test.ts"
            "prototype-saturation-audit.ts"
          )

          for test_file in "${tests[@]}"; do
            echo "===== ${test_file} =====" | tee -a cod-cp009-combined-saturation.log
            npx --yes tsx "${root}/${test_file}" >> cod-cp009-combined-saturation.log 2>&1
            test_status=$?
            if [ "$test_status" -ne 0 ]; then
              status=1
              echo "FAILED (${test_status}): ${test_file}" | tee -a cod-cp009-combined-saturation.log
            else
              echo "PASSED: ${test_file}" | tee -a cod-cp009-combined-saturation.log
            fi
          done

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload combined saturation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cod-001-cp009-combined-saturation
          path: cod-cp009-combined-saturation.log
          retention-days: 14

      - name: Enforce combined saturation result
        shell: bash
        run: |
          cat cod-cp009-combined-saturation.log
          test "${{ steps.saturation_suite.outputs.exit_code }}" = "0"
