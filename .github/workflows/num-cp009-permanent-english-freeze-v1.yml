name: Validate NUM-CP-009 permanent allocation and English freeze

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-009/**"
      - ".github/workflows/num-cp009-permanent-english-freeze-v1.yml"
  workflow_dispatch:

jobs:
  validate-num-cp009-permanent-english:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Wave 01 regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-009/wave01/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp009-wave01-permanent-regression.mjs

      - name: Run Wave 01 regression
        run: node artifacts/api-server/dist/quant-v4/num-cp009-wave01-permanent-regression.mjs

      - name: Bundle Wave 02 regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-009/wave02/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp009-wave02-permanent-regression.mjs

      - name: Run Wave 02 regression
        run: node artifacts/api-server/dist/quant-v4/num-cp009-wave02-permanent-regression.mjs

      - name: Bundle post-Wave02 saturation regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-009/post-wave02/source-gap-saturation-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp009-post-wave02-permanent-regression.mjs

      - name: Run post-Wave02 saturation regression
        run: node artifacts/api-server/dist/quant-v4/num-cp009-post-wave02-permanent-regression.mjs

      - name: Bundle Wave 03 regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-009/wave03/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp009-wave03-permanent-regression.mjs

      - name: Run Wave 03 regression
        run: node artifacts/api-server/dist/quant-v4/num-cp009-wave03-permanent-regression.mjs

      - name: Bundle final source merge-split regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-009/final-saturation/final-source-merge-split-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp009-final-source-permanent-regression.mjs

      - name: Run final source merge-split regression
        run: node artifacts/api-server/dist/quant-v4/num-cp009-final-source-permanent-regression.mjs

      - name: Bundle permanent allocation proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-009/permanent-allocation.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp009-permanent-allocation.mjs

      - name: Run permanent allocation proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-cp009-permanent-allocation.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/num-cp009-permanent-allocation.log

      - name: Bundle permanent English runtime proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-009/permanent-runtime.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp009-permanent-english-runtime.mjs

      - name: Run permanent English runtime proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-cp009-permanent-english-runtime.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/num-cp009-permanent-english-runtime.log

      - name: Bundle permanent English review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-009/permanent-review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp009-permanent-review-export.mjs

      - name: Generate permanent English learner review
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/num-cp009-permanent-review-export.mjs \
            2>&1 | tee dist/quant-v4/num-cp009-permanent-review-export.log

      - name: Upload permanent English freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: num-cp009-permanent-english-freeze-v1
          path: |
            artifacts/api-server/dist/quant-v4/num-cp009-permanent-allocation.log
            artifacts/api-server/dist/quant-v4/num-cp009-permanent-english-runtime.log
            artifacts/api-server/dist/quant-v4/num-cp009-permanent-review-export.log
            artifacts/api-server/dist/quant-v4/num-cp009-permanent-english-review/audit.json
            artifacts/api-server/dist/quant-v4/num-cp009-permanent-english-review/review.json
            artifacts/api-server/dist/quant-v4/num-cp009-permanent-english-review/review.md
          retention-days: 30
