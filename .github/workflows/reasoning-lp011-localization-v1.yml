name: Reasoning LP-011 Localization V1

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-011-localization-v1.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-011-localization-v1.test.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/question-studio-v4.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/question-studio-v4.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reasoning-lp011-localization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove-localization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove LP-011 Hindi Punjabi semantic parity
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-011-localization-v1.test.ts
      - name: Prove Question Studio V4 multilingual review route
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/question-studio-v4.test.ts
      - name: Reprove LP-011 English authority
        run: npx --yes tsx artifacts/api-server/src/reasoning-v1/topics/Logic-Puzzles/LP-001/lp-011-stabilized-v1-3.test.ts
