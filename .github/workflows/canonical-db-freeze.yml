name: Validate canonical database freeze

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/**
      - scripts/check-canonical-db-freeze.mjs
      - docs/admin-panel-integration.md
      - render.yaml
      - .github/workflows/canonical-db-freeze.yml
  push:
    branches:
      - New-main
    paths:
      - artifacts/api-server/**
      - scripts/check-canonical-db-freeze.mjs
      - docs/admin-panel-integration.md
      - render.yaml
      - .github/workflows/canonical-db-freeze.yml

permissions:
  contents: read

concurrency:
  group: canonical-db-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-canonical-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce one-database boundary
        run: node scripts/check-canonical-db-freeze.mjs

      - name: Build canonical API
        run: pnpm --dir artifacts/api-server build

      - name: Verify bundled runtime boundary
        run: |
          grep -R "DATABASE_URL environment variable is required" artifacts/api-server/dist >/dev/null
          grep -R "question_studio.generation_run.created" artifacts/api-server/dist >/dev/null
          grep -R "assessment.test.published" artifacts/api-server/dist >/dev/null
          grep -R "ATTEMPT_SESSION_REQUIRED" artifacts/api-server/dist >/dev/null
          ! grep -R "ADMIN_DATABASE_URL" artifacts/api-server/dist
          ! grep -R "adminSqlClient\|studentSqlClient" artifacts/api-server/dist
          ! grep -R "refreshLeaderboard\|LegacyAttempt\|mock-unlock" artifacts/api-server/dist/index.mjs
