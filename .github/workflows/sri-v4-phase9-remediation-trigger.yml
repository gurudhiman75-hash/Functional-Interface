name: SRI Phase 9 remediation trigger

on:
  pull_request:
    branches:
      - New-main
    types: [synchronize]
    paths:
      - .github/workflows/sri-v4-phase9-remediation-trigger.yml

permissions:
  contents: write

jobs:
  run-stored-remediation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 9 branch
        uses: actions/checkout@v4
        with:
          ref: feature/sri-v4-phase9-localization-v1
      - name: Extract and run stored remediation
        run: |
          python - <<'PY'
          from pathlib import Path

          helper = Path('.github/workflows/sri-v4-phase9-localization-phrase-remediation.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(helper) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(helper)) if helper[i].strip() == 'PY')
          script_lines = helper[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in script_lines if line.strip())
          script = '\n'.join(line[indent:] for line in script_lines) + '\n'
          Path('/tmp/sri-phase9-remediate.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/sri-phase9-remediate.py
      - name: Verify and commit only durable SRI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/permanent-localization-v1.ts \
                  artifacts/api-server/src/quant-v4/topics/NumberSystem/subtopics/SurdsAndIndices/tests/permanent-localization-v1.test.ts
          git diff --cached --check
          git commit -m "SRI Phase 9: expand Hindi Punjabi phrase authority"
          git push origin HEAD:feature/sri-v4-phase9-localization-v1
