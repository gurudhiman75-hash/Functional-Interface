name: Validate SPA CND-001 Test Builder Activation V1

on:
  push:
    branches:
      - feat/spa-cnd-001-test-builder-activation-v1
    paths:
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/cubes-dice-test-builder-activation-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/cubes-dice-question-studio-test-builder-runtime-v1.ts
      - artifacts/api-server/src/reasoning-v1/tests/spatial-cubes-dice-test-builder-activation-v1.test.ts
      - artifacts/api-server/src/routes/admin-question-studio-cubes-dice.ts
      - artifacts/admin-app/src/features/question-studio/cubes-dice-review-api.ts
      - artifacts/admin-app/src/pages/content/QuestionStudioCubesDiceReviewPanel.tsx
      - .github/workflows/spa-cnd-001-test-builder-activation-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cnd-test-builder-activation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Typecheck admin Question Studio UI
        run: pnpm --dir artifacts/admin-app typecheck

      - name: Bundle CND Test Builder activation proof
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-cubes-dice-test-builder-activation-v1.test.ts \
            --bundle --platform=node --format=cjs \
            --outfile=dist/reasoning-v1/spatial/spatial-cubes-dice-test-builder-activation-v1.test.cjs

      - name: Validate Test Builder boundary
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/cnd_test_builder_proof
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-cubes-dice-test-builder-activation-v1.test.cjs \
            | tee dist/reasoning-v1/spatial/cnd-001-test-builder-activation-v1-run.log

      - name: Upload Test Builder activation evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-cnd-001-test-builder-activation-v1
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/cnd-001-test-builder-activation-v1-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/cnd-001-test-builder-activation-v1-run.log
          if-no-files-found: error
