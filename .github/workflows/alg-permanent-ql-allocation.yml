name: Validate Algebra permanent QL allocation

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/permanent/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/permanent-allocation.test.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/ALG-FINAL-RETAINED-CONTRACT-MATRIX.md
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/ALG-FINAL-SOURCE-FIXTURE-LEDGER.md
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/ALG-FINAL-SOURCE-GAP-AUDIT.md
      - .github/workflows/alg-permanent-ql-allocation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alg-permanent-ql-allocation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-permanent-allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle permanent allocation test
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/algebra
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Algebra/tests/permanent-allocation.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/quant-v4/algebra/permanent-allocation.test.mjs
      - name: Run permanent allocation test
        run: |
          cd artifacts/api-server
          node dist/quant-v4/algebra/permanent-allocation.test.mjs
