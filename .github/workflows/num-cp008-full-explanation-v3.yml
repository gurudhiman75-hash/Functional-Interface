name: Validate NUM-CP-008 Full Explanation V3

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-008/**
      - artifacts/api-server/src/question-studio/shared-generation-engine.ts
      - .github/workflows/num-cp008-full-explanation-v3.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp008-full-explanation-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp008-full-explanation-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle permanent runtime regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-008/permanent-runtime.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp008-v3-permanent-regression.mjs

      - name: Run permanent runtime regression
        working-directory: artifacts/api-server
        run: node dist/quant-v4/num-cp008-v3-permanent-regression.mjs

      - name: Bundle full explanation V3 audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-008/english-explanation-human-v3.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp008-full-explanation-v3.test.mjs

      - name: Run full explanation V3 audit
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/num-cp008-full-explanation-v3.test.mjs \
            2>&1 | tee dist/quant-v4/num-cp008-full-explanation-v3.log

      - name: Bundle learner review export
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-008/english-explanation-human-v3-review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp008-full-explanation-v3-review-export.mjs

      - name: Generate learner review markdown
        working-directory: artifacts/api-server
        run: node dist/quant-v4/num-cp008-full-explanation-v3-review-export.mjs

      - name: Bundle Question Studio compatibility proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-008/question-studio-integration.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp008-v3-question-studio.mjs

      - name: Run Question Studio compatibility proof
        working-directory: artifacts/api-server
        run: node dist/quant-v4/num-cp008-v3-question-studio.mjs

      - name: Upload V3 explanation review
        uses: actions/upload-artifact@v4
        with:
          name: num-cp008-full-explanation-v3-review
          path: |
            artifacts/api-server/dist/quant-v4/num-cp008-full-explanation-v3-review.md
            artifacts/api-server/dist/quant-v4/num-cp008-full-explanation-v3.log
          if-no-files-found: error
          retention-days: 14
