name: One-shot PNL CP-001 placeholder guard patch

on:
  push:
    branches:
      - feat/pnl-001-cp001-dynamic-runtime
    paths:
      - ".github/workflows/tmp-pnl-cp001-fix-placeholder.yml"

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-cp001-dynamic-runtime

      - name: Narrow unresolved-placeholder detection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-001/cp001-dynamic-runtime.ts")
          source = path.read_text()
          old = r'const unresolvedPlaceholder = /\{[A-Za-z][A-Za-z0-9_]*\}/;'
          new = r'const unresolvedPlaceholder = /\{[a-z][A-Za-z0-9_]*\}/;'
          if source.count(old) != 1:
              raise SystemExit(f"Expected exactly one placeholder guard, found {source.count(old)}")
          path.write_text(source.replace(old, new))
          PY

      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-001/cp001-dynamic-runtime.ts
          git commit -m "fix(pnl): distinguish LaTeX braces from dynamic placeholders"
          git push origin HEAD:feat/pnl-001-cp001-dynamic-runtime
