name: Validate Render production build

on:
  push:
    branches:
      - New-main
    paths:
      - render.yaml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - artifacts/admin-app/**
      - artifacts/examtree/**
      - artifacts/api-server/**
      - scripts/assemble-hosting.mjs
      - .github/workflows/render-production-build.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - render.yaml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - artifacts/admin-app/**
      - artifacts/examtree/**
      - artifacts/api-server/**
      - scripts/assemble-hosting.mjs
      - .github/workflows/render-production-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-production-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run exact Render build command
        id: render_build
        shell: bash
        run: |
          set +e
          API_PRODUCTION_ONLY=1 bash build-api.sh > render-production-build.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Render build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-production-build-diagnostics
          path: render-production-build.log
          retention-days: 7

      - name: Enforce Render build result
        shell: bash
        run: |
          cat render-production-build.log
          test "${{ steps.render_build.outputs.exit_code }}" = "0"

      - name: Verify deployment artifacts
        shell: bash
        run: |
          test -f artifacts/api-server/dist/index.mjs
          test -f artifacts/examtree/dist/public/index.html
          test -f artifacts/examtree/dist/public/admin/index.html
