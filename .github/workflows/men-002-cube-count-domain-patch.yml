name: MEN-002 Cube Count Domain Patch

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-002-cube-count-domain-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply safe cube-count arrangements
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/foundation/runtime.ts")
          text = path.read_text()

          marker = "function cubeCountDraft(prototypeId: MenCp007PrototypeId, seed: string, rng: SeededRandom, difficulty: Men002Difficulty): Draft {"
          replacement = """const SAFE_CUBE_COUNT_ARRANGEMENTS = [
            [3n, 2n, 2n],
            [4n, 3n, 2n],
            [5n, 4n, 3n],
            [6n, 5n, 4n],
            [7n, 4n, 5n],
          ] as const;

          function cubeCountDraft(prototypeId: MenCp007PrototypeId, seed: string, rng: SeededRandom, difficulty: Men002Difficulty): Draft {"""
          replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in replacement.splitlines())
          if text.count(marker) != 1:
            raise SystemExit("cubeCountDraft marker mismatch")
          text = text.replace(marker, replacement, 1)

          pattern = re.compile(
            r"  const smallSide = BigInt\(rng\.int\(2, 5\)\);\n"
            r"  const alongLength = BigInt\(rng\.int\(3, 7\)\);\n"
            r"  const alongBreadth = BigInt\(rng\.int\(2, 6\)\);\n"
            r"  const alongHeight = BigInt\(rng\.int\(2, 5\)\);"
          )
          text, count = pattern.subn(
            "  const smallSide = BigInt(rng.int(2, 5));\n"
            "  const [alongLength, alongBreadth, alongHeight] = rng.pick(SAFE_CUBE_COUNT_ARRANGEMENTS);",
            text,
          )
          if count != 1:
            raise SystemExit(f"cube-count random block: expected one match, found {count}")

          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/foundation/runtime.ts
          git commit -m "fix(mensuration): use collision-safe cube-count arrangements"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
