name: Validate SAP-CP-002 exam-readiness V3

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-002/exam-readiness-v3/**
      - .github/workflows/validate-sap-cp002-exam-readiness-v3.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-sap-cp002-exam-readiness-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-sap-cp002-exam-readiness-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle V3 authority
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-002/exam-readiness-v3/authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/sap-cp002-exam-readiness-v3-authority.test.mjs

      - name: Run V3 authority
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/sap-cp002-exam-readiness-v3-authority.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/sap-cp002-exam-readiness-v3-authority.log

      - name: Bundle V3 review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-002/exam-readiness-v3/generate-review-markdown.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/sap-cp002-exam-readiness-v3-review.mjs

      - name: Generate V3 300-question review
        run: >-
          node artifacts/api-server/dist/quant-v4/sap-cp002-exam-readiness-v3-review.mjs
          artifacts/api-server/dist/quant-v4/SAP-CP-002-300-QUESTIONS-AND-EXPLANATIONS-REVIEW-V3.md

      - name: Upload V3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sap-cp002-exam-readiness-v3-review
          path: |
            artifacts/api-server/dist/quant-v4/sap-cp002-exam-readiness-v3-authority.log
            artifacts/api-server/dist/quant-v4/SAP-CP-002-300-QUESTIONS-AND-EXPLANATIONS-REVIEW-V3.md
          if-no-files-found: error
          retention-days: 30
