name: Validate NUM-CP-011 Question Studio integration

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-011/**"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-010/question-studio-integration.test.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-009/question-studio-integration.test.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-008/question-studio-integration.test.ts"
      - "artifacts/api-server/src/question-studio/shared-generation-engine.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-average.ts"
      - ".github/workflows/num-cp011-question-studio-integration-v1.yml"
  workflow_dispatch:

concurrency:
  group: num-cp011-qs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-num-cp011-question-studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle CP011 permanent English regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-011/permanent-runtime.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp011-qs-permanent-english-regression.mjs

      - name: Run CP011 permanent English regression
        run: node artifacts/api-server/dist/quant-v4/num-cp011-qs-permanent-english-regression.mjs

      - name: Bundle CP011 final multilingual binding regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-011/localization/runtime-final.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp011-qs-multilingual-final-regression.mjs

      - name: Run CP011 final multilingual binding regression
        run: node artifacts/api-server/dist/quant-v4/num-cp011-qs-multilingual-final-regression.mjs

      - name: Bundle CP011 Question Studio integration proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-011/question-studio-integration.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp011-question-studio-integration.mjs

      - name: Run CP011 Question Studio integration proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-cp011-question-studio-integration.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/num-cp011-question-studio-integration.log

      - name: Bundle CP011 shared engine and admin route contract
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-011/question-studio-route-contract.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp011-question-studio-route-contract.mjs

      - name: Run CP011 shared engine and admin route contract
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-cp011-question-studio-route-contract.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/num-cp011-question-studio-route-contract.log

      - name: Validate CP011 admin route exposure with shell guards
        shell: bash
        run: |
          route="artifacts/api-server/src/routes/admin-question-studio-average.ts"
          grep -Fq 'patternId.includes("num cp 011")' "$route"
          grep -Fq 'checkpointId === "NUM-CP-011"' "$route"
          grep -Fq 'if (number >= 213 && number <= 225) return "NUM-CP-011";' "$route"
          grep -Fq 'requestedNumberSystemCp === "NUM-CP-011"' "$route"
          grep -Fq 'requestedNumberSystemQlCp === "NUM-CP-011"' "$route"
          grep -Fq 'targetCp !== "NUM-CP-011"' "$route"
          grep -Fq 'NUM-CP-010 and NUM-CP-011' "$route"

      - name: Bundle CP010 Question Studio regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-010/question-studio-integration.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp010-question-studio-cp011-regression.mjs

      - name: Run CP010 Question Studio regression
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-cp010-question-studio-cp011-regression.mjs \
            2>&1 | tee artifacts/api-server/dist/quant-v4/num-cp010-question-studio-cp011-regression.log

      - name: Bundle CP009 Question Studio regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-009/question-studio-integration.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp009-question-studio-cp011-regression.mjs

      - name: Run CP009 Question Studio regression
        run: node artifacts/api-server/dist/quant-v4/num-cp009-question-studio-cp011-regression.mjs

      - name: Bundle CP008 Question Studio regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-002/NUM-CP-008/question-studio-integration.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-cp008-question-studio-cp011-regression.mjs

      - name: Run CP008 Question Studio regression
        run: node artifacts/api-server/dist/quant-v4/num-cp008-question-studio-cp011-regression.mjs

      - name: Bundle admin Question Studio route
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/routes/admin-question-studio-average.ts
          --bundle --platform=node --format=esm
          --packages=external
          --outfile=dist/quant-v4/admin-question-studio-num-cp011-route.mjs

      - name: Upload CP011 Question Studio evidence
        uses: actions/upload-artifact@v4
        with:
          name: num-cp011-question-studio-integration-v1
          path: |
            artifacts/api-server/dist/quant-v4/num-cp011-question-studio-integration.log
            artifacts/api-server/dist/quant-v4/num-cp011-question-studio-route-contract.log
            artifacts/api-server/dist/quant-v4/num-cp010-question-studio-cp011-regression.log
          if-no-files-found: error
          retention-days: 30
