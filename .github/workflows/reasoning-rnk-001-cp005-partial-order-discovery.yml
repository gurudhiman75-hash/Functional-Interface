name: Validate RNK-001 CP-005 Partial-Order Discovery

on:
  push:
    branches:
      - feat/rnk-001-cp005-partial-order-discovery
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-005/**
      - artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/README.md
      - artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/rnk-001-open-ql-discovery.md
      - artifacts/api-server/src/reasoning-v1/question-studio-registry.ts
      - artifacts/api-server/src/reasoning-v1/question-studio-registry.test.ts
      - .github/workflows/reasoning-rnk-001-cp005-partial-order-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rnk-cp005-partial-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-partial-order-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate partial-order discovery
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-005/cp005-partial-order-discovery.test.ts \
            | tee rnk-cp005-partial-order-discovery.log

      - name: Validate ownership reset remains intact
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/rnk-001-book-ownership-reset.test.ts \
            | tee rnk-book-ownership-reset.log

      - name: Validate discovery-only Question Studio registry
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/question-studio-registry.test.ts \
            | tee rnk-question-studio-registry.log

      - name: Build API server
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server build \
            | tee rnk-cp005-api-build.log

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnk-001-cp005-partial-order-discovery-evidence
          path: |
            rnk-cp005-partial-order-discovery.log
            rnk-book-ownership-reset.log
            rnk-question-studio-registry.log
            rnk-cp005-api-build.log
          if-no-files-found: ignore
          retention-days: 14
