name: Validate DSF-CP-008 Hindi Punjabi Localization

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/**
      - artifacts/api-server/src/routes/admin-question-studio-data-sufficiency.ts
      - artifacts/admin-app/src/features/question-studio/data-sufficiency-review-api.ts
      - artifacts/admin-app/src/pages/content/QuestionStudioDataSufficiencyReviewPanel.tsx
      - .github/workflows/dsf-cp008-hi-pa-localization.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsf-cp008-hi-pa-localization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dsf-cp008-hi-pa-localization:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Build admin app
        run: pnpm --dir artifacts/admin-app build
      - name: Bundle DSF CP008 proofs and review pack
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/dsf
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-008/localization-review-v1.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/reasoning-v1/dsf/dsf-cp008-localization-review.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-008/localization-route-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp008-localization-route.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-008/localization-review-pack-v1.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/reasoning-v1/dsf/dsf-cp008-localization-review-pack.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-007/production-readiness-freeze-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp007-regression.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-006/mock-test-release-v1.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/reasoning-v1/dsf/dsf-cp006-regression.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-006/mock-test-release-route-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp006-route-regression.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-003/exam-answer-profiles-approval-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp003-approval-regression.test.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-001/cp001-freeze-authority.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp001-freeze-regression.test.mjs
      - name: Run CP008 localization semantic-parity proof
        run: cd artifacts/api-server && node dist/reasoning-v1/dsf/dsf-cp008-localization-review.test.mjs
      - name: Run CP008 route and UI contract proof
        run: cd artifacts/api-server && node dist/reasoning-v1/dsf/dsf-cp008-localization-route.test.mjs
      - name: Build CP008 Hindi Punjabi human review pack
        env:
          DSF_CP008_REVIEW_DIR: dist/reasoning-v1/dsf-cp008-localization-review
        run: cd artifacts/api-server && node dist/reasoning-v1/dsf/dsf-cp008-localization-review-pack.test.mjs
      - name: Re-prove CP007 English production freeze
        run: cd artifacts/api-server && node dist/reasoning-v1/dsf/dsf-cp007-regression.test.mjs
      - name: Re-prove CP006 mock eligibility
        run: cd artifacts/api-server && node dist/reasoning-v1/dsf/dsf-cp006-regression.test.mjs
      - name: Re-prove CP006 route compatibility
        run: cd artifacts/api-server && node dist/reasoning-v1/dsf/dsf-cp006-route-regression.test.mjs
      - name: Re-prove CP003 reviewed answer profiles
        run: cd artifacts/api-server && node dist/reasoning-v1/dsf/dsf-cp003-approval-regression.test.mjs
      - name: Re-prove CP001 frozen semantics
        run: cd artifacts/api-server && node dist/reasoning-v1/dsf/dsf-cp001-freeze-regression.test.mjs
      - name: Upload CP008 human review artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsf-cp008-hi-pa-localization-review
          path: artifacts/api-server/dist/reasoning-v1/dsf-cp008-localization-review/
          if-no-files-found: error
