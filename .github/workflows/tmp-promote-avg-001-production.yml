name: Temporary promote AVG-001 to production

on:
  push:
    branches:
      - New-main
    paths:
      - .github/avg-001-production-promotion.trigger

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: New-main
          fetch-depth: 0
      - name: Build focused promotion branch
        run: |
          set -euo pipefail
          git fetch origin feat/avg-001-cp001-runtime-proof
          git switch -C promote/avg-001-question-studio-production origin/New-main
          git checkout origin/feat/avg-001-cp001-runtime-proof -- \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001 \
            artifacts/api-server/src/quant-v4/question-studio-generation-engine.ts \
            artifacts/api-server/src/routes/admin-question-studio-average.ts \
            .github/workflows/avg-001-runtime-proof.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/routes/index.ts')
          text = path.read_text()
          import_line = 'import adminQuestionStudioAverageRouter from "./admin-question-studio-average";\n'
          if import_line not in text:
              anchor = 'import adminQuestionStudioQualityRouter from "./admin-question-studio-quality";\n'
              if anchor not in text:
                  raise SystemExit('Question Studio import anchor missing')
              text = text.replace(anchor, anchor + import_line, 1)
          mount_line = 'router.use("/admin/question-studio", adminQuestionStudioAverageRouter);\n'
          if mount_line not in text:
              anchor = 'router.use("/admin/question-studio", adminQuestionStudioQualityRouter);\n'
              if anchor not in text:
                  raise SystemExit('Question Studio mount anchor missing')
              text = text.replace(anchor, anchor + mount_line, 1)
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/avg-001-runtime-proof.yml artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Average/AVG-001 artifacts/api-server/src/quant-v4/question-studio-generation-engine.ts artifacts/api-server/src/routes/admin-question-studio-average.ts artifacts/api-server/src/routes/index.ts
          git commit -m "feat(avg): promote AVG-001 into production Question Studio"
          git push --force-with-lease origin HEAD:promote/avg-001-question-studio-production
