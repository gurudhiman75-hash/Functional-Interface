name: Validate SER-CP-010 permanent promotion

on:
  pull_request:
    branches: [New-main]
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-PERMANENT-QL-REGISTRY-V4.ts"
      - "artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-010-PROMOTION/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-008-AUDIT-REMEDIATION/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-009-NUMBER-SERIES-AUDIT/**"
  workflow_dispatch:

concurrency:
  group: ser-cp010-permanent-promotion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Series/SER-001/SER-CP-010-PROMOTION/ser-cp-010-permanent-promotion.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/ser-cp010-permanent-promotion.test.mjs
      - run: node artifacts/api-server/dist/reasoning-v1/ser-cp010-permanent-promotion.test.mjs
