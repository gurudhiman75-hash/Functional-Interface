name: TEMP Apply DSF CP010 Freeze Patch

on:
  push:
    branches:
      - feature/dsf-cp010-multilingual-production-freeze-v1
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-010/apply-cp010-freeze-patch.py
      - .github/workflows/_temp-dsf-cp010-apply-freeze-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dsf-cp010-multilingual-production-freeze-v1
          fetch-depth: 0
      - name: Apply CP010 freeze wiring patch
        run: python artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-010/apply-cp010-freeze-patch.py
      - name: Commit patched integration files
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/admin-question-studio-data-sufficiency.ts \
                  artifacts/admin-app/src/features/question-studio/data-sufficiency-review-api.ts \
                  artifacts/admin-app/src/pages/content/QuestionStudioDataSufficiencyReviewPanel.tsx
          git commit -m "DSF-CP-010: wire final multilingual freeze into Question Studio"
          git push origin HEAD:feature/dsf-cp010-multilingual-production-freeze-v1
