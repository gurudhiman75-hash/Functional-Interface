name: Validate WFM-001 V2 review candidate

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Word-Formation/WFM-001/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wfm-001-v2-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-word-formation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Run WFM-001 V2 adversarial review gate
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Word-Formation/WFM-001
          OUT=dist/reasoning-v1/wfm-001-v2
          mkdir -p artifacts/api-server/$OUT/review
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/wfm-001.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/wfm-001.test.mjs"
          (cd artifacts/api-server && node "$OUT/wfm-001.test.mjs") | tee artifacts/api-server/$OUT/review/test-results.json

      - name: Generate multilingual review packs
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Word-Formation/WFM-001
          OUT=dist/reasoning-v1/wfm-001-v2
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/export-review.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/export-review.mjs"
          (cd artifacts/api-server && node "$OUT/export-review.mjs" en-IN "$OUT/review/wfm-001-v2-en-IN-review.md" 2)
          (cd artifacts/api-server && node "$OUT/export-review.mjs" hi-IN "$OUT/review/wfm-001-v2-hi-IN-review.md" 1)
          (cd artifacts/api-server && node "$OUT/export-review.mjs" pa-IN "$OUT/review/wfm-001-v2-pa-IN-review.md" 1)
          cat > artifacts/api-server/$OUT/review/README.txt <<'EOF'
          WFM-001 V2 Word Formation — review-only ownership candidate

          English: 4 QLs x 3 difficulties x 2 samples = 24 questions
          Hindi:   4 QLs x 3 difficulties x 1 sample  = 12 questions
          Punjabi: 4 QLs x 3 difficulties x 1 sample  = 12 questions

          Covers direct can/cannot formation, selected-position meaningful-word count,
          and jumbled/numbered meaningful-word rearrangement. No taxonomy promotion,
          Question Studio registration, Question Bank write, test/mock eligibility,
          or public publication is enabled.
          EOF

      - name: Upload WFM-001 V2 review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wfm-001-v2-review-candidate
          path: artifacts/api-server/dist/reasoning-v1/wfm-001-v2/review
          if-no-files-found: error
          retention-days: 30
