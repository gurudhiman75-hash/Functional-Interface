name: Fix PNL CP-005 Editorial Seeds

on:
  pull_request:
    paths:
      - ".github/workflows/fix-pnl-cp005-editorial-seeds.yml"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/cp005-editorial-seed-regression.test.ts"

permissions:
  contents: write

jobs:
  fix-cp005-editorial-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature source
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-english-editorial-audit

      - name: Keep heavy-buy/light-sell cases directional
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/cp005-dynamic-cases.ts")
          source = path.read_text()
          start = source.index('case "PNL-QL-139":')
          end = source.index('case "PNL-QL-141":', start)
          block = source[start:end]
          if "const commonQuotedPrice" not in block:
              pattern = r'''const purchasePricePerNominalQuantity\s*=\s*rupees\(\s*pickSeeded\(random,\s*\[1000,\s*1200,\s*1500\]\s*as\s*const\),\s*\);\s*const sellingPricePerNominalQuantity\s*=\s*rupees\(\s*pickSeeded\(random,\s*\[1000,\s*1200,\s*1500\]\s*as\s*const\),\s*\);'''
              replacement = '''const commonQuotedPrice = rupees(
                pickSeeded(random, [1000, 1200, 1500] as const),
              );
              const purchasePricePerNominalQuantity = commonQuotedPrice;
              const sellingPricePerNominalQuantity = commonQuotedPrice;'''
              block, count = re.subn(pattern, replacement, block, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit("QL-139/140 heavy-light price block not found")
              source = source[:start] + block + source[end:]
              path.write_text(source)
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Format CP-005 source
        run: |
          pnpm exec prettier --write \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/cp005-dynamic-cases.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/cp005-editorial-seed-regression.test.ts

      - name: Bundle CP-005 editorial regression
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/cp005-editorial-seed-regression.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/.cp005-editorial-seed-regression.test.mjs \
            2>&1 | tee pnl-cp005-editorial-seeds.log

      - name: Run 522-package editorial regression
        run: |
          set -o pipefail
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/.cp005-editorial-seed-regression.test.mjs \
            2>&1 | tee -a pnl-cp005-editorial-seeds.log

      - name: Commit proven CP-005 correction
        run: |
          if git diff --quiet -- \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/cp005-dynamic-cases.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/cp005-editorial-seed-regression.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/cp005-dynamic-cases.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-005/cp005-editorial-seed-regression.test.ts
          git commit -m "fix(pnl): keep CP-005 heavy-light inverses directional"
          git push origin HEAD:feat/pnl-001-english-editorial-audit

      - name: Upload CP-005 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnl-cp005-editorial-seed-proof
          path: pnl-cp005-editorial-seeds.log
          if-no-files-found: error
          retention-days: 14
