name: Validate Commerce Entitlements

on:
  pull_request:
    branches: [New-main]
    paths:
      - artifacts/api-server/src/lib/canonical-commerce-entitlements.ts
      - artifacts/api-server/src/routes/canonical-commerce-access-guard.ts
      - artifacts/api-server/src/routes/admin-commerce-entitlements.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/admin-app/src/pages/commerce/EntitlementsWorkspacePage.tsx
      - artifacts/admin-app/src/App.tsx
      - artifacts/admin-app/src/app/nav/navigation.ts
      - .github/workflows/commerce-entitlements.yml
  push:
    branches: [New-main]
    paths:
      - artifacts/api-server/src/lib/canonical-commerce-entitlements.ts
      - artifacts/api-server/src/routes/canonical-commerce-access-guard.ts
      - artifacts/api-server/src/routes/admin-commerce-entitlements.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/admin-app/src/pages/commerce/EntitlementsWorkspacePage.tsx
      - artifacts/admin-app/src/App.tsx
      - artifacts/admin-app/src/app/nav/navigation.ts
      - .github/workflows/commerce-entitlements.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commerce-entitlements-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Enforce entitlement contracts
        run: |
          grep -F 'commerce.entitlements.read' artifacts/api-server/src/routes/admin-commerce-entitlements.ts
          grep -F 'commerce.entitlements.manage' artifacts/api-server/src/routes/admin-commerce-entitlements.ts
          grep -F 'commerce.entitlement.manual_granted' artifacts/api-server/src/routes/admin-commerce-entitlements.ts
          grep -F 'commerce.entitlement.revoked' artifacts/api-server/src/routes/admin-commerce-entitlements.ts
          grep -F 'grant_source' artifacts/api-server/src/routes/admin-commerce-entitlements.ts
          grep -F 'idempotency_key' artifacts/api-server/src/routes/admin-commerce-entitlements.ts
          grep -F 'INSERT INTO commerce.entitlement_tests' artifacts/api-server/src/routes/admin-commerce-entitlements.ts
          grep -F 'pv.sale_price_minor > 0' artifacts/api-server/src/lib/canonical-commerce-entitlements.ts
          grep -F 'TEST_ENTITLEMENT_REQUIRED' artifacts/api-server/src/lib/canonical-commerce-entitlements.ts
          grep -F 'router.post("/attempt-sessions", authenticate' artifacts/api-server/src/routes/canonical-commerce-access-guard.ts
          grep -F 'router.get("/tests/:id", authenticate' artifacts/api-server/src/routes/canonical-commerce-access-guard.ts
          grep -F 'router.use(canonicalCommerceAccessGuardRouter)' artifacts/api-server/src/routes/index.ts
          grep -F 'router.use("/admin/commerce/entitlements", adminCommerceEntitlementsRouter)' artifacts/api-server/src/routes/index.ts
          grep -E "path:[[:space:]]*'/commerce/entitlements'" artifacts/admin-app/src/App.tsx
          grep -E "permission:[[:space:]]*'commerce\.entitlements\.read'" artifacts/admin-app/src/app/nav/navigation.ts
          grep -F "Intl.DateTimeFormat('en-US'" artifacts/admin-app/src/pages/commerce/EntitlementsWorkspacePage.tsx
          ! grep -E '@/data/|prototype entitlement|demo entitlement' artifacts/admin-app/src/pages/commerce/EntitlementsWorkspacePage.tsx
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Typecheck admin application
        run: pnpm run typecheck:admin
      - name: Test admin application
        run: pnpm run test:admin
      - name: Build admin application
        run: pnpm run build:admin
