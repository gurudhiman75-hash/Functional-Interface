name: Refresh admin React lock graph

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.head_ref == 'fix/render-admin-recharts-build' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/render-admin-recharts-build
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Refresh frozen lock graph
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'fix(admin): refresh canonical React lock graph'
          git push origin HEAD:fix/render-admin-recharts-build
