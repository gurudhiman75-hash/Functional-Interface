name: Validate MEN-CP-007 source gap wave 04

on:
  pull_request:
    branches:
      - fix/men-002-cp007-indian-editorial-authority
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/foundation/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-01/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-02/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-03/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/source-gap-wave-04/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-007/**
      - .github/workflows/men-002-cp007-source-gap-wave-04.yml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-002-cp007-source-wave04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-men-cp007-source-wave04:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle CP-007 regression and source-gap proofs
        shell: bash
        run: |
          set -euo pipefail
          base=src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002
          out=dist/quant-v4
          pnpm --dir artifacts/api-server exec esbuild "$base/foundation/runtime.test.ts" --bundle --platform=node --format=esm --outfile="$out/men-cp007-foundation.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$base/gap-wave-01/runtime.test.ts" --bundle --platform=node --format=esm --outfile="$out/men-cp007-wave01.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$base/gap-wave-02/runtime.test.ts" --bundle --platform=node --format=esm --outfile="$out/men-cp007-wave02.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$base/gap-wave-03/runtime.test.ts" --bundle --platform=node --format=esm --outfile="$out/men-cp007-wave03.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$base/source-gap-wave-04/runtime.test.ts" --bundle --platform=node --format=esm --outfile="$out/men-cp007-source-wave04.test.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$base/source-gap-wave-04/review-export.ts" --bundle --platform=node --format=esm --outfile="$out/men-cp007-source-wave04-review-export.mjs"

      - name: Run all CP-007 mathematical and editorial gates
        shell: bash
        run: |
          set -o pipefail
          out=artifacts/api-server/dist/quant-v4
          node "$out/men-cp007-foundation.test.mjs" 2>&1 | tee "$out/men-cp007-foundation.log"
          node "$out/men-cp007-wave01.test.mjs" 2>&1 | tee "$out/men-cp007-wave01.log"
          node "$out/men-cp007-wave02.test.mjs" 2>&1 | tee "$out/men-cp007-wave02.log"
          node "$out/men-cp007-wave03.test.mjs" 2>&1 | tee "$out/men-cp007-wave03.log"
          node "$out/men-cp007-source-wave04.test.mjs" 2>&1 | tee "$out/men-cp007-source-wave04.log"

      - name: Generate Wave-04 human-review evidence
        working-directory: artifacts/api-server
        run: node dist/quant-v4/men-cp007-source-wave04-review-export.mjs

      - name: Run exact Render production build
        id: render_build
        shell: bash
        run: |
          set +e
          bash build-api.sh > artifacts/api-server/dist/quant-v4/men-cp007-source-wave04-render-build.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enforce Render production build
        shell: bash
        run: |
          cat artifacts/api-server/dist/quant-v4/men-cp007-source-wave04-render-build.log
          test "${{ steps.render_build.outputs.exit_code }}" = "0"
          test -f artifacts/api-server/dist/index.mjs
          test -f artifacts/examtree/dist/public/index.html
          test -f artifacts/examtree/dist/public/admin/index.html

      - name: Upload proof, review and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-002-cp007-source-gap-wave-04
          path: |
            artifacts/api-server/dist/quant-v4/men-cp007-foundation.log
            artifacts/api-server/dist/quant-v4/men-cp007-wave01.log
            artifacts/api-server/dist/quant-v4/men-cp007-wave02.log
            artifacts/api-server/dist/quant-v4/men-cp007-wave03.log
            artifacts/api-server/dist/quant-v4/men-cp007-source-wave04.log
            artifacts/api-server/dist/quant-v4/men-cp007-source-wave04-render-build.log
            artifacts/api-server/dist/quant-v4/men-002-cp007-source-gap-wave-04-review/**
          if-no-files-found: error
          retention-days: 14
