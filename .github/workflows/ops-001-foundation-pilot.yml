name: Validate OPS-001 foundation, all candidates and localization

# Pilot proof only: no permanent QL allocation or production exposure.
on:
  push:
    branches:
      - feat/ops-001-end-to-end-design
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/foundation/**
      - artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/pilot/**
      - .github/workflows/ops-001-foundation-pilot.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/foundation/**
      - artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/pilot/**
      - .github/workflows/ops-001-foundation-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-ops-001-pilots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/Mathematical-Operations/OPS-001/foundation -name '*.ts' -print) \
            $(find src/reasoning-v1/topics/Mathematical-Operations/OPS-001/pilot -name '*.ts' -print)
      - name: Run exact foundation contract proof
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/foundation/ops-foundation.test.ts
      - name: Stress 12 representative candidate pilots
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/pilot/representative-pilots.test.ts
      - name: Stress 12 supplementary CP001-CP005 pilots
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/pilot/supplementary-pilots.test.ts
      - name: Stress final 10 candidates and prove 34-candidate coverage
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/pilot/final-candidate-pilots.test.ts
      - name: Prove Hindi and Punjabi answer parity
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/pilot/localization.test.ts
