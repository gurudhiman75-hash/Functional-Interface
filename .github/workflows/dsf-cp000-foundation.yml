name: Validate DSF-CP-000 foundation

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/**
      - .github/workflows/dsf-cp000-foundation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsf-cp000-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dsf-cp000:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle DSF CP-000 proofs
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/dsf
          for test in \
            dsf-cp000-foundation.test.ts \
            dsf-cp000-number-system-discovery.test.ts \
            dsf-cp000-cross-domain-discovery.test.ts \
            dsf-cp000-source-pattern-audit.test.ts \
            dsf-cp000-ownership-ql-boundary.test.ts
          do
            output="${test%.ts}.mjs"
            pnpm --dir artifacts/api-server exec esbuild \
              "src/reasoning-v1/topics/Data-Sufficiency/DSF-001/tests/$test" \
              --bundle --platform=node --format=esm \
              --outfile="dist/reasoning-v1/dsf/$output"
          done
      - name: Run DSF CP-000 proof suite
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/dsf/dsf-cp000-foundation.test.mjs
          node dist/reasoning-v1/dsf/dsf-cp000-number-system-discovery.test.mjs
          node dist/reasoning-v1/dsf/dsf-cp000-cross-domain-discovery.test.mjs
          node dist/reasoning-v1/dsf/dsf-cp000-source-pattern-audit.test.mjs
          node dist/reasoning-v1/dsf/dsf-cp000-ownership-ql-boundary.test.mjs
