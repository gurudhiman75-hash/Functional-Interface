name: Validate GEO-RIV-001 CP013 Review

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp013-*"
      - "artifacts/api-server/src/knowledge-v1/indian-geography/rivers-drainage/GEO-RIV-001-CP013-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geo-riv-001-cp013-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp013:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run CP013 qualification gate
        run: |
          mkdir -p artifacts/api-server/dist/geography
          pnpm --dir artifacts/api-server exec esbuild src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp013-review-batch-v1.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/geography/geo-riv-001-cp013-review-batch-v1.test.mjs
          node artifacts/api-server/dist/geography/geo-riv-001-cp013-review-batch-v1.test.mjs
      - name: Materialize CP013 V1 review artifact
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp013-export-review-v1.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/geography/geo-riv-001-cp013-export-review-v1.mjs
          cd artifacts/api-server && node dist/geography/geo-riv-001-cp013-export-review-v1.mjs
      - name: Upload CP013 V1 review artifact
        uses: actions/upload-artifact@v4
        with:
          name: GEO-RIV-001-CP013-REVIEW-BATCH-V1
          path: artifacts/api-server/dist/geography-review/GEO-RIV-001-CP013-V1/
          if-no-files-found: error
          retention-days: 30
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
