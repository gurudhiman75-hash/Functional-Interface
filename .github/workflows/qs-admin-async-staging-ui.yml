name: Validate QS opt-in staging admin integration
on:
  pull_request:
    branches: [New-main]
    paths:
      - 'artifacts/admin-app/src/features/question-studio/api.ts'
      - 'artifacts/admin-app/src/pages/content/QuestionStudioCockpitPage.tsx'
      - 'artifacts/admin-app/src/features/question-studio/package-hierarchy.ts'
      - 'artifacts/admin-app/src/features/question-studio/package-hierarchy.test.ts'
      - 'artifacts/api-server/src/routes/admin-question-studio.ts'
      - 'tests/qs-admin-staging-async-review-contract.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qs-admin-staging-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Test gated async UI and legacy Review compatibility
        run: node --test tests/qs-admin-staging-async-review-contract.test.mjs
      - name: Install locked admin dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/examtree-admin...
      - name: Test all 64 Quant mappings and safe selector fallbacks
        run: pnpm --dir artifacts/admin-app exec vitest run src/features/question-studio/package-hierarchy.test.ts
      - name: Typecheck admin UI
        run: pnpm --dir artifacts/admin-app exec tsc --noEmit -p tsconfig.app.json
