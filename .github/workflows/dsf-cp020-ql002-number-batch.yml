name: Validate DSF-CP-020 QL002 Number Batch

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-015/**
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-020/**
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/foundation/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsf-cp020-ql002-number-batch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dsf-cp020:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle CP020 QL002 audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-020/number-system-three-statement-batch-v1.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/dsf-cp020-ql002-number-batch.test.mjs

      - name: Run CP020 QL002 audit
        run: node artifacts/api-server/dist/reasoning-v1/dsf-cp020-ql002-number-batch.test.mjs
