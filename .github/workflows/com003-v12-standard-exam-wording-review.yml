name: COM-003 V12 Standard Exam Wording Review

on:
  push:
    branches:
      - feature/com003-office-productivity-discovery-v1
    paths:
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-review-synthesis-v10.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-review-synthesis-v11.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-review-synthesis-v12.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-review-synthesis-v12.test.ts'
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-question-review-md-v12.ts'
      - '.github/workflows/com003-v12-standard-exam-wording-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate V12 standard exam wording
        run: |
          mkdir -p artifacts/api-server/dist/com003-review-v12
          pnpm --dir artifacts/api-server exec esbuild src/knowledge-v1/computer-awareness/com003-review-synthesis-v12.test.ts --bundle --platform=node --format=esm --outfile=dist/com003-review-v12/com003-review-synthesis-v12.test.mjs
          set +e
          node artifacts/api-server/dist/com003-review-v12/com003-review-synthesis-v12.test.mjs 2>&1 | tee artifacts/api-server/dist/com003-review-v12/validation.log
          STATUS=${PIPESTATUS[0]}
          set -e
          exit $STATUS
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: com003-v12-validation-log
          path: artifacts/api-server/dist/com003-review-v12/validation.log
          if-no-files-found: warn
      - name: Generate V12 Markdown review file
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/knowledge-v1/computer-awareness/com003-question-review-md-v12.ts --bundle --platform=node --format=esm --outfile=dist/com003-review-v12/com003-question-review-md-v12.mjs
          cd artifacts/api-server && node dist/com003-review-v12/com003-question-review-md-v12.mjs
      - name: Verify Markdown review file
        run: |
          FILE=artifacts/api-server/dist/com003-review-v12/COM-003-Office-Productivity-English-Question-Review-V12.md
          test -s "$FILE"
          grep -q 'English V12 · Standard Plain Exam Language Review Candidate' "$FILE"
          grep -q '228 questions' "$FILE"
          grep -q 'COM-003-QL-019' "$FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: com003-office-productivity-english-question-review-v12
          path: artifacts/api-server/dist/com003-review-v12/COM-003-Office-Productivity-English-Question-Review-V12.md
          if-no-files-found: error
