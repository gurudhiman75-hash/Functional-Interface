name: Temporary Quant V4 Probability Punjab simulator patch

on:
  push:
    branches:
      - audit/quant-v4-probability-punjab-simulator-direct-profile-p2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/quant-v4-probability-punjab-simulator-direct-profile-p2

      - name: Apply exact architecture cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}")
              p.write_text(text.replace(old, new))

          simulator = "artifacts/api-server/src/quant-v4/quality/quant-v4-real-exam-simulation-p2.ts"
          replace_exact(
              simulator,
              '''function probabilityProfile(profile: QuantV4RealExamProfile): string {
            if (profile.id === "SSC_CHSL") return "SSC_CGL_CHSL";
            if (profile.id === "SSC_CGL_TIER_II") return "SSC_CGL_JSO";
            if (profile.family === "BANKING") return profile.centralDeliveryProfile ?? "BANKING_PRELIMS";
            return "SSC_CGL_CHSL";
          }
          ''',
              '''export type QuantV4ProbabilitySimulationProfile =
            | "SSC_CGL_CHSL"
            | "SSC_CGL_JSO"
            | "BANKING_PRELIMS"
            | "BANKING_MAINS"
            | "PUNJAB_STATE";

          export function resolveProbabilitySimulationProfile(
            profile: QuantV4RealExamProfile,
          ): QuantV4ProbabilitySimulationProfile {
            if (profile.family === "PUNJAB_STATE") return "PUNJAB_STATE";
            if (profile.id === "SSC_CHSL") return "SSC_CGL_CHSL";
            if (profile.id === "SSC_CGL_TIER_II") return "SSC_CGL_JSO";
            if (profile.family === "BANKING") {
              return profile.centralDeliveryProfile === "BANKING_MAINS"
                ? "BANKING_MAINS"
                : "BANKING_PRELIMS";
            }
            return "SSC_CGL_CHSL";
          }
          ''',
          )
          replace_exact(
              simulator,
              'examProfile: probabilityProfile(profile) as any,',
              'examProfile: resolveProbabilitySimulationProfile(profile) as any,',
          )

          integration = "artifacts/api-server/src/quant-v4/topics/Probability/question-studio-integration.ts"
          replace_exact(
              integration,
              '''function isLegacyPunjabRealExamSimulatorFallback(
            request: ProbabilityStandardQuestionStudioRequest,
          ) {
            const profile = requestedExamProfile(request);
            if (profile !== "SSC_CGL_CHSL") return false;

            const seed = String((request as any).seed ?? "").trim().toUpperCase();
            if (!seed.startsWith("QUANT-V4-REAL-EXAM-")) return false;

            return /(?:^|:)(PSSSB|PPSC|PUNJAB_POLICE)(?::|$)/u.test(seed);
          }

          function assertPunjabProfileEvidenceGate(
            request: ProbabilityStandardQuestionStudioRequest,
          ) {
            if (
              requestedExamProfile(request) === "PUNJAB_STATE"
              || isLegacyPunjabRealExamSimulatorFallback(request)
            ) {
              throw new ProbabilityPunjabProfileEvidenceError();
            }
          }
          ''',
              '''function assertPunjabProfileEvidenceGate(
            request: ProbabilityStandardQuestionStudioRequest,
          ) {
            if (requestedExamProfile(request) === "PUNJAB_STATE") {
              throw new ProbabilityPunjabProfileEvidenceError();
            }
          }
          ''',
          )
          replace_exact(
              integration,
              '''function isExamProfile(value: string) {
            return value === "SSC_CGL_CHSL"
          ''',
              '''function isExamProfile(value: string) {
            return value === "PUNJAB_STATE"
              || value === "SSC_CGL_CHSL"
          ''',
          )

          gate_test = "artifacts/api-server/src/quant-v4/quality/quant-v4-probability-punjab-evidence-gate-p2.test.ts"
          replace_exact(
              gate_test,
              '''let legacySimulatorFallbackError: unknown;
          try {
            generateProbabilityQuestionStudioBatch({
              packageId: "PRB-001",
              canonicalProblemId: "PRB-CP-001",
              examProfile: "SSC_CGL_CHSL",
              count: 1,
              seed: "QUANT-V4-REAL-EXAM-SIMULATION-CI:PSSSB:1:PROBABILITY:19",
            });
          } catch (error) {
            legacySimulatorFallbackError = error;
          }
          assertEvidenceGate(legacySimulatorFallbackError);
          ''',
              '''const explicitSscWithPunjabLookingSeed = generateProbabilityQuestionStudioBatch({
            packageId: "PRB-001",
            canonicalProblemId: "PRB-CP-001",
            examProfile: "SSC_CGL_CHSL",
            count: 1,
            seed: "QUANT-V4-REAL-EXAM-SIMULATION-CI:PSSSB:1:PROBABILITY:19",
          });
          assert.equal(explicitSscWithPunjabLookingSeed.questions.length, 1);
          assert.equal(explicitSscWithPunjabLookingSeed.questions[0]?.examProfile, "SSC_CGL_CHSL");
          assert.equal(explicitSscWithPunjabLookingSeed.questions[0]?.options.length, 4);
          ''',
          )
          replace_exact(
              gate_test,
              '  legacySimulatorFallbackBlocked: true,',
              '  legacySimulatorSeedGuardRemoved: true,',
          )

          sim_test = "artifacts/api-server/src/quant-v4/quality/quant-v4-real-exam-simulation-p2.test.ts"
          replace_exact(
              sim_test,
              '''  generateQuantV4RealExamSection,
            runQuantV4RealExamSimulationAudit,
          ''',
              '''  generateQuantV4RealExamSection,
            resolveProbabilitySimulationProfile,
            runQuantV4RealExamSimulationAudit,
          ''',
          )
          replace_exact(
              sim_test,
              '''for (const profile of punjabProfiles) {
            assert.equal(profile.centralProfileGap, true, `${profile.id} must remain explicit about the missing central Punjab Quant profile.`);
            assert.equal(profile.centralDeliveryProfile, null, `${profile.id} must not silently masquerade as an SSC central profile.`);
          }
          ''',
              '''for (const profile of punjabProfiles) {
            assert.equal(profile.centralProfileGap, true, `${profile.id} must remain explicit about the missing central Punjab Quant profile.`);
            assert.equal(profile.centralDeliveryProfile, null, `${profile.id} must not silently masquerade as an SSC central profile.`);
            assert.equal(
              resolveProbabilitySimulationProfile(profile),
              "PUNJAB_STATE",
              `${profile.id} Probability must use the explicit Punjab evidence gate instead of an SSC fallback.`,
            );
          }
          ''',
          )
          marker = '''const audit = await runQuantV4RealExamSimulationAudit({
          '''
          insertion = '''for (const examId of ["PSSSB", "PPSC", "PUNJAB_POLICE"] as const) {
            const section = await generateQuantV4RealExamSection({
              examId,
              sectionIndex: 2,
              seed: `QUANT-V4-REAL-EXAM-PUNJAB-PROBABILITY-DIRECT-PROFILE:${examId}`,
            });
            const profile = QUANT_V4_REAL_EXAM_PROFILES.find((entry) => entry.id === examId)!;
            const expectedProbabilitySlots = profile.slotPlan.find((slot) => slot.kind === "PROBABILITY")?.count ?? 0;
            const probabilitySlots = section.questions.filter((question) => question.slotKind === "PROBABILITY");
            assert.equal(probabilitySlots.length, expectedProbabilitySlots, `${examId} Probability slot count drifted.`);
            assert.ok(expectedProbabilitySlots > 0, `${examId} must exercise at least one Probability slot.`);
            assert.ok(
              probabilitySlots.every((question) => question.sourceKind === "CAPABILITY_GAP"),
              `${examId} must not count SSC-generated Probability questions as Punjab runtime output.`,
            );
            assert.ok(
              probabilitySlots.every((question) => /PUNJAB_STATE Probability generation is evidence-gated/u.test(question.gapReason ?? "")),
              `${examId} Probability gaps must come from the explicit PUNJAB_STATE evidence gate.`,
            );
          }

          ''' + marker
          replace_exact(sim_test, marker, insertion)

          gate_doc = "artifacts/api-server/src/quant-v4/quality/QUANT-V4-PROBABILITY-PUNJAB-EVIDENCE-GATE-P2.md"
          replace_exact(
              gate_doc,
              '''## Legacy real-exam simulator compatibility guard

          The historical real-exam simulator still maps Punjab-family Probability slots to `SSC_CGL_CHSL` before calling Probability. That mapping predates the central Punjab profile and would otherwise bypass the direct `PUNJAB_STATE` gate.

          Until the simulator profile resolver itself is migrated to `PUNJAB_STATE`, the Probability integration defensively recognizes only the simulator's explicit `QUANT-V4-REAL-EXAM-*` audit seed provenance for `PSSSB`, `PPSC`, and `PUNJAB_POLICE` and rejects the disguised SSC fallback with the same evidence-required error.

          This compatibility guard is intentionally narrow. Ordinary SSC CGL/CHSL Probability requests remain valid and are covered as a positive control.

          The simulator can therefore record these Punjab Probability slots as capability gaps instead of silently counting SSC-generated questions as Punjab evidence.
          ''',
              '''## Real-exam simulator boundary

          The real-exam simulator now resolves every `PSSSB`, `PPSC`, and `PUNJAB_POLICE` Probability slot directly to `PUNJAB_STATE`.

          The previous seed-provenance compatibility guard has been removed. Seeds no longer alter exam-profile semantics: an explicit SSC request stays SSC even if its seed text happens to contain a Punjab exam name.

          Punjab simulator Probability slots therefore reach the same explicit evidence gate as any other `PUNJAB_STATE` request and are recorded as capability gaps until a native Punjab Probability contract is evidence-backed.
          ''',
          )
          replace_exact(
              gate_doc,
              '''A later simulator migration should replace its historical Punjab-to-SSC Probability resolver with the shared `PUNJAB_STATE` profile directly; at that point the narrow seed-provenance compatibility guard can be removed.
          ''',
              '''The simulator migration is complete at the routing boundary: Punjab Probability is now explicit `PUNJAB_STATE`, with no SSC fallback and no seed-based workaround. Native Punjab Probability selection remains blocked until the required evidence is normalized and approved.
          ''',
          )

          propagation = "artifacts/api-server/src/quant-v4/quality/quant-v4-real-exam-punjab-profile-propagation-p2.ts"
          replace_exact(
              propagation,
              '''  | "PROFILE_BLIND"
            | "PUNJAB_PROFILE_UNSUPPORTED"
          ''',
              '''  | "PROFILE_BLIND"
            | "EVIDENCE_GATED"
            | "PUNJAB_PROFILE_UNSUPPORTED"
          ''',
          )
          historical_block = '''  Object.freeze({
            surface: "HISTORICAL_REAL_EXAM_SIMULATOR",
            status: "STALE_SIMULATOR_METADATA" as const,
            affectedPackages: Object.freeze(["PSSSB", "PPSC", "PUNJAB_POLICE"]),
            evidence: "All three Punjab real-exam profiles still store centralDeliveryProfile=null and centralProfileGap=true.",
            remediation: "Do not consolidate the simulator to PUNJAB_STATE until its downstream chapter routes can actually consume that profile.",
          }),
          '''
          replace_exact(
              propagation,
              historical_block,
              historical_block + '''  Object.freeze({
            surface: "REAL_EXAM_PROBABILITY_RESOLVER",
            status: "SUPPORTED" as const,
            affectedPackages: Object.freeze(["PSSSB", "PPSC", "PUNJAB_POLICE"]),
            evidence: "Punjab-family Probability slots now resolve directly to PUNJAB_STATE. The Probability integration then fails closed on its evidence gate, so no SSC question is counted as Punjab output.",
            remediation: null,
          }),
          ''',
          )
          replace_exact(
              propagation,
              '''  Object.freeze({
            surface: "PROBABILITY_PROFILE_CONTRACT",
            status: "PUNJAB_PROFILE_UNSUPPORTED" as const,
            affectedPackages: Object.freeze(["PRB-001", "PRB-002"]),
            evidence: "Probability forwards an examProfile, but its ProbabilityExamProfile union/config does not define PUNJAB_STATE; Punjab simulation therefore cannot select a real Punjab Probability contract.",
            remediation: "Define and validate a PUNJAB_STATE Probability profile before replacing the simulator's SSC_CGL_CHSL fallback.",
          }),
          ''',
              '''  Object.freeze({
            surface: "PROBABILITY_PROFILE_CONTRACT",
            status: "EVIDENCE_GATED" as const,
            affectedPackages: Object.freeze(["PRB-001", "PRB-002"]),
            evidence: "Question Studio recognizes PUNJAB_STATE as an explicit Probability request and rejects it with PRB_PUNJAB_PROFILE_EVIDENCE_REQUIRED before the raw Probability profile layer, which still has no native Punjab selection contract.",
            remediation: "Normalize attributable Punjab Probability observations, approve a Punjab CP/solve-mode/difficulty contract, then add the native Probability profile without reintroducing an SSC fallback.",
          }),
          ''',
          )

          propagation_test = "artifacts/api-server/src/quant-v4/quality/quant-v4-real-exam-punjab-profile-propagation-p2.test.ts"
          replace_exact(
              propagation_test,
              '''import type { MenCp009StandardQuestionStudioRequest } from "../topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-009/question-studio-runtime";
          import {
          ''',
              '''import type { MenCp009StandardQuestionStudioRequest } from "../topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-009/question-studio-runtime";
          import {
            QUANT_V4_REAL_EXAM_PROFILES,
            resolveProbabilitySimulationProfile,
          } from "./quant-v4-real-exam-simulation-p2";
          import {
          ''',
          )
          replace_exact(
              propagation_test,
              '''  assert.equal(summary.centralDeliveryStyle, "PUNJAB_STATE_OBJECTIVE");
            assert.equal(summary.simulatorPropagationReady, false);
          }
          ''',
              '''  assert.equal(summary.centralDeliveryStyle, "PUNJAB_STATE_OBJECTIVE");
            assert.equal(summary.simulatorPropagationReady, false);
            const simulatorProfile = QUANT_V4_REAL_EXAM_PROFILES.find((profile) => profile.id === summary.examId)!;
            assert.equal(resolveProbabilitySimulationProfile(simulatorProfile), "PUNJAB_STATE");
          }
          ''',
          )
          replace_exact(
              propagation_test,
              '''assert.equal(findingBySurface.get("HISTORICAL_REAL_EXAM_SIMULATOR")?.status, "STALE_SIMULATOR_METADATA");
          assert.equal(findingBySurface.get("CORE_GENERATION_ENGINE")?.status, "PROFILE_BLIND");
          ''',
              '''assert.equal(findingBySurface.get("HISTORICAL_REAL_EXAM_SIMULATOR")?.status, "STALE_SIMULATOR_METADATA");
          assert.equal(findingBySurface.get("REAL_EXAM_PROBABILITY_RESOLVER")?.status, "SUPPORTED");
          assert.equal(findingBySurface.get("CORE_GENERATION_ENGINE")?.status, "PROFILE_BLIND");
          ''',
          )
          replace_exact(
              propagation_test,
              '''assert.equal(findingBySurface.get("PROBABILITY_PROFILE_CONTRACT")?.status, "PUNJAB_PROFILE_UNSUPPORTED");
          ''',
              '''assert.equal(findingBySurface.get("PROBABILITY_PROFILE_CONTRACT")?.status, "EVIDENCE_GATED");
          ''',
          )

          propagation_doc = "artifacts/api-server/src/quant-v4/quality/QUANT-V4-REAL-EXAM-PUNJAB-PROFILE-PROPAGATION-P2.md"
          replace_exact(
              propagation_doc,
              '''Probability is different: its runtime does accept and forward an `examProfile`, but the Probability-specific profile union/config currently defines only SSC, banking and generic-practice profiles. It does **not** define `PUNJAB_STATE`.

          Therefore the historical Punjab Probability fallback to `SSC_CGL_CHSL` cannot yet be replaced by a real Punjab Probability contract.
          ''',
              '''Probability is different: its Question Studio boundary recognizes `PUNJAB_STATE`, while the Probability-specific native profile union/config still defines only SSC, banking and generic-practice selection contracts.

          The real-exam simulator no longer hides this gap behind `SSC_CGL_CHSL`. Punjab-family Probability slots now request `PUNJAB_STATE` directly and fail closed with `PRB_PUNJAB_PROFILE_EVIDENCE_REQUIRED` until attributable Punjab Probability evidence supports a native contract.
          ''',
          )
          replace_exact(
              propagation_doc,
              '''- the Probability profile type does not accept `PUNJAB_STATE`;
          - the audit reports `simulatorPropagationReady: false` rather than treating outer-API success as profile application.
          ''',
              '''- the Probability native profile type still does not accept `PUNJAB_STATE`;
          - the real-exam Probability resolver nevertheless sends Punjab slots to the explicit `PUNJAB_STATE` evidence gate rather than SSC;
          - the audit reports `simulatorPropagationReady: false` rather than treating an evidence-gated boundary as native profile application.
          ''',
          )
          replace_exact(
              propagation_doc,
              '''4. Add a real Probability `PUNJAB_STATE` profile with chapter-level selection rules and conformance tests.
          5. Only then change the historical/composed Punjab real-exam simulator from `centralDeliveryProfile: null` to `PUNJAB_STATE` and rerun section-level simulation/calibration.
          ''',
              '''4. Normalize Punjab Probability evidence and add a native `PUNJAB_STATE` chapter selection contract; the simulator routing boundary already uses `PUNJAB_STATE` and must remain fail-closed until then.
          5. Only after the remaining downstream chapter routes support Punjab should the composed simulator metadata move from `centralDeliveryProfile: null` to a fully propagated Punjab profile and rerun section-level calibration.
          ''',
          )
          PY

      - name: Commit cleanup
        run: |
          rm .github/workflows/tmp-quant-v4-probability-punjab-simulator-direct-profile-p2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "fix(quant-v4): route Punjab Probability simulator directly P2"
          git push origin HEAD:audit/quant-v4-probability-punjab-simulator-direct-profile-p2
