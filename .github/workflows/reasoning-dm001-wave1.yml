name: Reasoning DM-001 Wave 1

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Decision-Making/DM-001/**"
      - "artifacts/api-server/src/question-studio/engines/reasoning-v1-adapter.ts"
  push:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Decision-Making/DM-001/**"
      - "artifacts/api-server/src/question-studio/engines/reasoning-v1-adapter.ts"
      - ".github/workflows/reasoning-dm001-wave1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reasoning-dm001-wave1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-wave1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Wave 1 rule engine, scenarios and explanations
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Decision-Making/DM-001/wave1.test.ts
      - name: Validate reasoning-v1 adapter routing and review-only lifecycle
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Decision-Making/DM-001/question-studio-integration.test.ts
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
