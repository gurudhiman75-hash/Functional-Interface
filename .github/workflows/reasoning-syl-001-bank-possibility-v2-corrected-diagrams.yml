name: Validate SYL-001 Banking possibility V2 corrected diagrams
on:
  pull_request:
    branches: [audit/syl-001-source-profile-freeze, feat/syl-001-learner-v4, New-main]
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-shell-v2.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-review-question-v2-corrected.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-v2-corrected-diagram-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-combined-diagram-v3.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-four-term-venn-v4.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-supplemental-venn-v3.ts
      - .github/workflows/reasoning-syl-001-bank-possibility-v2-corrected-diagrams.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-syl-001-bank-possibility-v2-corrected-diagrams-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-v2-corrected-diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle corrected V2 diagram audit
        run: pnpm --dir artifacts/api-server exec esbuild src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-v2-corrected-diagram-audit.test.ts --bundle --platform=node --format=esm --outfile=dist/reasoning-v1/syl-001-bank-possibility-v2-corrected-diagram-audit.test.mjs
      - name: Run corrected V2 diagram audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-v2-corrected-diagram-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-v2-corrected-diagram-audit.log
      - name: Upload corrected V2 diagram evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syl-001-bank-possibility-v2-corrected-diagrams
          path: artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-v2-corrected-diagram-audit.log
          if-no-files-found: error
          retention-days: 30
