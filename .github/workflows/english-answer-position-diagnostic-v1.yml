name: Audit English ENG-001 Answer Positions V1

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/english-v1/tests/eng-001-answer-position-diagnostic-v1.test.ts
      - artifacts/api-server/src/english-v1/chapters/error-spotting/ENG-001/**
  push:
    branches:
      - New-main
    paths:
      - artifacts/api-server/src/english-v1/tests/eng-001-answer-position-diagnostic-v1.test.ts
      - artifacts/api-server/src/english-v1/chapters/error-spotting/ENG-001/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-answer-position-diagnostic-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-answer-positions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile answer-position diagnostic
        run: |
          mkdir -p artifacts/api-server/dist/english-v1
          pnpm --dir artifacts/api-server exec esbuild src/english-v1/tests/eng-001-answer-position-diagnostic-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-001-answer-position-diagnostic-v1.test.mjs
      - name: Run answer-position diagnostic
        run: node artifacts/api-server/dist/english-v1/eng-001-answer-position-diagnostic-v1.test.mjs
