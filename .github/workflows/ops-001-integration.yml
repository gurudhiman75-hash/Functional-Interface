name: Validate OPS-001 internal integration

on:
  push:
    branches:
      - feat/ops-001-end-to-end-design
    paths:
      - artifacts/api-server/src/reasoning-v1/**
      - artifacts/api-server/src/routes/admin-question-studio-ops.ts
      - artifacts/api-server/src/routes/admin-question-lifecycle-hardening.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/api-server/src/lib/admin-question-conversion.ts
      - artifacts/admin-app/src/pages/content/QuestionStudioOpsStatus.tsx
      - artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx
      - .github/workflows/ops-001-integration.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/**
      - artifacts/api-server/src/routes/admin-question-studio-ops.ts
      - artifacts/api-server/src/routes/admin-question-lifecycle-hardening.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/api-server/src/lib/admin-question-conversion.ts
      - artifacts/admin-app/src/pages/content/QuestionStudioOpsStatus.tsx
      - artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx
      - .github/workflows/ops-001-integration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-ops-001-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ops-001-integration-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Strict OPS-001 integration TypeScript check
        working-directory: artifacts/api-server
        run: |
          set +e
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/Mathematical-Operations/OPS-001/foundation -name '*.ts' -print) \
            $(find src/reasoning-v1/topics/Mathematical-Operations/OPS-001/pilot -name '*.ts' -print) \
            $(find src/reasoning-v1/topics/Mathematical-Operations/OPS-001/registry -name '*.ts' -print) \
            $(find src/reasoning-v1/topics/Mathematical-Operations/OPS-001/runtime -name '*.ts' -print) \
            $(find src/reasoning-v1/topics/Mathematical-Operations/OPS-001/analytics -name '*.ts' -print) \
            $(find src/reasoning-v1/topics/Mathematical-Operations/OPS-001/integration -name '*.ts' -print) \
            src/reasoning-v1/topics/Mathematical-Operations/OPS-001/delivery-adapter.ts \
            src/reasoning-v1/topics/Mathematical-Operations/OPS-001/index.ts \
            src/reasoning-v1/generation-engine.ts \
            src/routes/admin-question-studio-ops.ts \
            src/routes/admin-question-lifecycle-hardening.ts \
            src/lib/admin-question-conversion.ts \
            > /tmp/ops-001-integration-typescript.log 2>&1
          status=$?
          cat /tmp/ops-001-integration-typescript.log
          exit $status

      - name: Upload TypeScript diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ops-001-integration-typescript-diagnostic
          path: /tmp/ops-001-integration-typescript.log
          if-no-files-found: error
          retention-days: 3

      - name: Run frozen OPS-001 integration proof
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/integration/ops-001-integration.test.ts

      - name: Build API server with OPS route registered
        working-directory: artifacts/api-server
        run: pnpm run build

      - name: Type-check admin Question Studio status integration
        working-directory: artifacts/admin-app
        run: pnpm run typecheck
