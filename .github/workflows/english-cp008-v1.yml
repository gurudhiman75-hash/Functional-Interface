name: Validate English CP008 V1

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/english-v1/**
      - artifacts/api-server/src/question-studio/**
      - artifacts/admin-app/src/pages/content/QuestionStudioEnglishReviewPanel.tsx
      - .github/workflows/english-cp008-v1.yml
  push:
    branches: [New-main]
    paths:
      - artifacts/api-server/src/english-v1/**
      - artifacts/api-server/src/question-studio/**
      - artifacts/admin-app/src/pages/content/QuestionStudioEnglishReviewPanel.tsx
      - .github/workflows/english-cp008-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: english-cp008-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp008-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile CP008 V1 stress test
        run: |
          mkdir -p artifacts/api-server/dist/english-v1
          pnpm --dir artifacts/api-server exec esbuild src/english-v1/tests/eng-001-cp008-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-001-cp008-v1.test.mjs
      - name: Run CP008 V1 generation and validation matrix
        run: node artifacts/api-server/dist/english-v1/eng-001-cp008-v1.test.mjs
      - name: Compile CP008 V1 review exporter test
        run: pnpm --dir artifacts/api-server exec esbuild src/english-v1/tests/eng-001-cp008-v1-review.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-001-cp008-v1-review.test.mjs
      - name: Generate CP008 V1 human review artifact
        run: node artifacts/api-server/dist/english-v1/eng-001-cp008-v1-review.test.mjs
      - name: Upload CP008 V1 review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENG-001-CP008-REVIEW-V1
          path: dist/english-v1/ENG-001-CP008-REVIEW-V1.md
          if-no-files-found: error
      - name: Compile CP008 Question Studio integration test
        run: pnpm --dir artifacts/api-server exec esbuild src/question-studio/engines/language-v1-eng001-cp008-adapter-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/language-v1-eng001-cp008-adapter-v1.test.mjs
      - name: Run CP008 Question Studio review-only integration test
        run: node artifacts/api-server/dist/english-v1/language-v1-eng001-cp008-adapter-v1.test.mjs
      - name: Compile CP007 Question Studio regression
        run: pnpm --dir artifacts/api-server exec esbuild src/question-studio/engines/language-v1-eng001-cp007-adapter-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/language-v1-eng001-cp007-adapter-v1-regression.test.mjs
      - name: Run CP007 Question Studio regression
        run: node artifacts/api-server/dist/english-v1/language-v1-eng001-cp007-adapter-v1-regression.test.mjs
      - name: Compile CP007 generator regression
        run: pnpm --dir artifacts/api-server exec esbuild src/english-v1/tests/eng-001-cp007-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-001-cp007-v1-regression.test.mjs
      - name: Re-run approved CP007 generator regression
        run: node artifacts/api-server/dist/english-v1/eng-001-cp007-v1-regression.test.mjs
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Typecheck admin app
        run: pnpm --dir artifacts/admin-app exec tsc -p tsconfig.json --noEmit
