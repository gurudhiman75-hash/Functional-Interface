name: One-shot PNL CP-001 dynamic review patch runner

on:
  pull_request:
    branches:
      - New-main
    paths:
      - ".github/workflows/tmp-pnl-cp001-dynamic-review-patch.yml"
      - ".github/workflows/tmp-pnl-cp001-dynamic-review-runner.yml"

permissions:
  contents: write

jobs:
  run-reviewed-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-cp001-question-studio-dynamic-review

      - name: Execute reviewed embedded patch
        id: patch
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee pnl-dynamic-review-patch.log
          from pathlib import Path

          workflow = Path(".github/workflows/tmp-pnl-cp001-dynamic-review-patch.yml").read_text().splitlines()
          start = next(index for index, line in enumerate(workflow) if "python - <<'PY'" in line) + 1
          end = next(index for index in range(start, len(workflow)) if workflow[index].strip() == "PY")
          embedded = workflow[start:end]
          first_code_line = next(line for line in embedded if line.strip())
          code_indent = len(first_code_line) - len(first_code_line.lstrip())
          indent_prefix = " " * code_indent
          code = "\n".join(
              line[code_indent:] if line.startswith(indent_prefix) else line
              for line in embedded
          )

          stale_exact_replacement = 'replace_once(engine, old_function, new_function, "runtime package generator")'
          stable_boundary_replacement = '''engine_source = engine.read_text()
          function_start = engine_source.index("async function generateWithRuntimePackage(")
          function_end_marker = "\\n}\\n\\nexport async function generateQuestion"
          function_end = engine_source.index(function_end_marker, function_start) + 2
          engine.write_text(
              engine_source[:function_start] + new_function + engine_source[function_end:]
          )'''
          if stale_exact_replacement not in code:
              raise SystemExit("Reviewed patch no longer contains the expected runtime replacement hook")
          code = code.replace(stale_exact_replacement, stable_boundary_replacement)

          exec(compile(code, "pnl-cp001-dynamic-review-patch", "exec"))
          PY

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnl-dynamic-review-patch-diagnostics
          path: pnl-dynamic-review-patch.log
          if-no-files-found: error
          retention-days: 2

      - name: Enforce patch result
        if: steps.patch.outcome != 'success'
        run: exit 1

      - name: Commit patched integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/quant-v4/generation-engine.ts \
            artifacts/api-server/src/quant-v4/generation-engine-core.ts \
            artifacts/api-server/src/routes/generator.ts \
            artifacts/api-server/src/routes/admin-question-studio.ts \
            artifacts/api-server/src/lib/admin-question-conversion.ts
          git commit -m "feat(pnl): add safe CP-001 dynamic review routing"
          git push origin HEAD:feat/pnl-001-cp001-question-studio-dynamic-review
