name: Finalize PNL CP-001 dynamic review integration

on:
  pull_request:
    branches:
      - New-main
    paths:
      - ".github/workflows/tmp-pnl-cp001-dynamic-review-runner.yml"

permissions:
  contents: write

jobs:
  finalize-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-cp001-question-studio-dynamic-review

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Normalize changed TypeScript files
        run: |
          pnpm dlx prettier@3.6.2 --write \
            artifacts/api-server/src/quant-v4/generation-engine.ts \
            artifacts/api-server/src/quant-v4/generation-engine-core.ts \
            artifacts/api-server/src/routes/generator.ts \
            artifacts/api-server/src/routes/admin-question-studio.ts \
            artifacts/api-server/src/lib/admin-question-conversion.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/question-studio-integration.test.ts

      - name: Remove temporary patch machinery
        run: |
          git rm \
            .github/workflows/tmp-pnl-cp001-dynamic-review-patch.yml \
            .github/workflows/tmp-pnl-cp001-dynamic-review-runner.yml

      - name: Commit finalized integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/quant-v4/generation-engine.ts \
            artifacts/api-server/src/quant-v4/generation-engine-core.ts \
            artifacts/api-server/src/routes/generator.ts \
            artifacts/api-server/src/routes/admin-question-studio.ts \
            artifacts/api-server/src/lib/admin-question-conversion.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/question-studio-integration.test.ts
          git commit -m "chore(pnl): finalize dynamic review integration"
          git push origin HEAD:feat/pnl-001-cp001-question-studio-dynamic-review
