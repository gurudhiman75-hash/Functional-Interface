name: Validate INT-CP-003 annual compound completion

on:
  pull_request:
    branches:
      - feat/int-001-cp002-final-saturation-freeze
      - feat/int-001-cp003-annual-compound-completion
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp003-math-authority.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp003-core.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp003-solution-trace.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp003-annual-compound-runtime.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp003-editorial-*.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp003-exam-*.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp003-grounded-*.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp003-*.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/INT-CP-003/**"
      - ".github/workflows/int-cp003-annual-compound-completion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-int-cp003-annual-compound-completion:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle inherited CP-002 English freeze audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp002-english-freeze-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp002-english-freeze-audit.mjs

      - name: Run inherited CP-002 English freeze audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp002-english-freeze-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp002-english-freeze-audit.log

      - name: Bundle CP-003 mathematical completion audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp003-completion-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp003-completion-audit.mjs

      - name: Run CP-003 mathematical completion audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp003-completion-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp003-completion-audit.log

      - name: Bundle CP-003 exam-readiness audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp003-exam-readiness-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp003-exam-readiness-audit.mjs

      - name: Run CP-003 exam-readiness audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp003-exam-readiness-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp003-exam-readiness-audit.log

      - name: Bundle CP-003 semantic solution-trace audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp003-solution-trace-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp003-solution-trace-audit.mjs

      - name: Run CP-003 semantic solution-trace audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp003-solution-trace-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp003-solution-trace-audit.log

      - name: Bundle CP-003 exam review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp003-exam-review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp003-exam-review-export.mjs

      - name: Generate CP-003 exam-readiness review pack
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp003-exam-review-export.mjs 2>&1 | tee dist/quant-v4/int-001-cp003-exam-review-export.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Verify CP-003 evidence
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          grep -q 'PASS_INT_CP002_APPROVED_ENGLISH_FREEZE' artifacts/api-server/dist/quant-v4/int-001-cp002-english-freeze-audit.log
          grep -q 'PASS_INT_CP003_ANNUAL_COMPOUND_COMPLETION' artifacts/api-server/dist/quant-v4/int-001-cp003-completion-audit.log
          grep -q 'PASS_INT_CP003_EXAM_READINESS_REMEDIATION' artifacts/api-server/dist/quant-v4/int-001-cp003-exam-readiness-audit.log
          grep -q 'PASS_INT_CP003_SEMANTIC_SOLUTION_TRACE' artifacts/api-server/dist/quant-v4/int-001-cp003-solution-trace-audit.log
          grep -q 'PASS_INT_CP003_EDITORIAL_DIVERSITY_REVIEW_EXPORT' artifacts/api-server/dist/quant-v4/int-001-cp003-exam-review-export.log
          grep -q '"authorityVersion": "INT-CP-003-MATH-AUTHORITY-v1"' artifacts/api-server/dist/quant-v4/int-001-cp003-exam-readiness-audit.log
          grep -q '"generatorVersion": "INT-CP-003-EXAM-GENERATOR-v11"' artifacts/api-server/dist/quant-v4/int-001-cp003-exam-readiness-audit.log
          grep -q '"contextCoverage": 4' artifacts/api-server/dist/quant-v4/int-001-cp003-exam-readiness-audit.log
          grep -q '"traceVersion": "INT-CP-003-SOLUTION-TRACE-v1"' artifacts/api-server/dist/quant-v4/int-001-cp003-solution-trace-audit.log
          grep -q '"questionCount": 1400' artifacts/api-server/dist/quant-v4/int-001-cp003-solution-trace-audit.log
          summary=artifacts/api-server/dist/quant-v4/int-cp003-annual-compound-completion/int-cp003-completion-summary.json
          review=artifacts/api-server/dist/quant-v4/int-cp003-exam-readiness-review-pack
          clean_review="$review/INT-CP-003-Questions-and-Explanations-Review-V3.md"
          review_summary="$review/int-cp003-exam-readiness-review-summary.json"
          test -f "$summary"
          test -f "$clean_review"
          test -f "$review/int-cp003-56-exam-readiness-data.json"
          test -f "$review_summary"
          grep -q '"qlCount": 14' "$summary"
          grep -q '"openMeaningfulOwnedGaps": 0' "$summary"
          grep -q '"questions": 56' "$review_summary"
          grep -q '"proseQuestions": 42' "$review_summary"
          grep -q '"structuredQuestions": 14' "$review_summary"
          grep -q '"prosePerQl": 3' "$review_summary"
          grep -q '"structuredPerQl": 1' "$review_summary"
          grep -q '"rateCoverage": 16' "$review_summary"
          grep -q '"representationCoverage": 6' "$review_summary"
          grep -q '"distinctMathematicalStates": 56' "$review_summary"
          grep -q '"distinctNumericFamilies": 56' "$review_summary"
          grep -Fq '### Explanation' "$clean_review"
          grep -Fq '**Answer:**' "$clean_review"
          grep -Fq '| ---' "$clean_review"
          test "$(grep -c '^## Question ' "$clean_review")" -eq 56
          test "$(grep -c '^### Explanation$' "$clean_review")" -eq 56
          ! grep -Fq 'Option diagnosis' "$clean_review"
          ! grep -Fq 'Stem family' "$clean_review"
          ! grep -Fq 'Representation:' "$clean_review"
          ! grep -R -n -P '[\x00-\x08\x09\x0B\x0C\x0E-\x1F]' "$review"/*.md
          ! grep -R -n -E 'bounded|canonical|verifier|mathematical state|generation seed' "$review"/*.md
          ! grep -R -n -E '₹[0-9]{3},[0-9]{3}([^0-9]|$)|₹[0-9]{1,3},[0-9]{3},[0-9]{3}' "$review"/*.md
          ! grep -R -n -E '₹[0-9]+/[0-9]+|[0-9]+/[0-9]+ years' "$review"/*.md

      - name: Upload CP-003 exam-readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-cp003-exam-readiness-remediation-review-candidate
          path: |
            artifacts/api-server/dist/quant-v4/int-001-cp002-english-freeze-audit.log
            artifacts/api-server/dist/quant-v4/int-001-cp003-completion-audit.log
            artifacts/api-server/dist/quant-v4/int-001-cp003-exam-readiness-audit.log
            artifacts/api-server/dist/quant-v4/int-001-cp003-solution-trace-audit.log
            artifacts/api-server/dist/quant-v4/int-001-cp003-exam-review-export.log
            artifacts/api-server/dist/quant-v4/int-cp003-annual-compound-completion/**
            artifacts/api-server/dist/quant-v4/int-cp003-exam-readiness-review-pack/**
          if-no-files-found: error
          retention-days: 14
