name: Probability editorial remediation

on:
  push:
    branches:
      - feat/prb-probability-end-to-end
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Probability/**"
      - "artifacts/api-server/src/quant-v4/generation-engine.ts"
      - ".github/workflows/prb-editorial-remediation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probability-editorial-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wire exam profiles into Question Studio
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("artifacts/api-server/src/quant-v4/generation-engine.ts")
          text = path.read_text()

          def ensure(old: str, new: str, label: str):
              global text
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Could not patch {label}")
              text = text.replace(old, new, 1)

          ensure(
              '} from "./topics/Probability/PRB-002";\n',
              '} from "./topics/Probability/PRB-002";\nimport type { ProbabilityExamProfile } from "./topics/Probability/shared";\n',
              "ProbabilityExamProfile import",
          )
          ensure(
              '  runtimeMode?: "CANONICAL_REVIEW" | "DYNAMIC_CANDIDATE";\n};',
              '  runtimeMode?: "CANONICAL_REVIEW" | "DYNAMIC_CANDIDATE";\n  examProfile?: ProbabilityExamProfile;\n};',
              "request exam profile",
          )
          ensure(
              'type RuntimeDefinition = QuantV4PackageDefinition & {\n  packageId: RuntimePackageId;\n};',
              'type RuntimeDefinition = Omit<QuantV4PackageDefinition, "run"> & {\n  packageId: RuntimePackageId;\n  run: (\n    cpId: string,\n    input: {\n      difficulty?: QuantV4Difficulty;\n      language?: QuantV4Language;\n      questionLanguageId?: string;\n      seed?: string;\n      examProfile?: ProbabilityExamProfile;\n    },\n  ) => Promise<any> | any;\n};',
              "runtime input type",
          )
          ensure(
              '''      runPrb001Pipeline(cpId as Prb001CanonicalProblemId, {\n        difficultyBand: input.difficulty,\n        language: input.language,\n        questionLanguageId: input.questionLanguageId,\n        seed: input.seed,\n      }),''',
              '''      runPrb001Pipeline(cpId as Prb001CanonicalProblemId, {\n        difficultyBand: input.difficulty,\n        language: input.language,\n        questionLanguageId: input.questionLanguageId,\n        examProfile: input.examProfile,\n        seed: input.seed,\n      }),''',
              "PRB-001 profile forwarding",
          )
          ensure(
              '''      runPrb002Pipeline(cpId as Prb002CanonicalProblemId, {\n        difficultyBand: input.difficulty,\n        language: input.language,\n        questionLanguageId: input.questionLanguageId,\n        seed: input.seed,\n      }),''',
              '''      runPrb002Pipeline(cpId as Prb002CanonicalProblemId, {\n        difficultyBand: input.difficulty,\n        language: input.language,\n        questionLanguageId: input.questionLanguageId,\n        examProfile: input.examProfile,\n        seed: input.seed,\n      }),''',
              "PRB-002 profile forwarding",
          )
          ensure(
              '''            questionLanguageId: request.questionLanguageId,\n            seed,\n          });''',
              '''            questionLanguageId: request.questionLanguageId,\n            examProfile: request.examProfile,\n            seed,\n          });''',
              "runtime profile forwarding",
          )
          ensure(
              '    supportedLanguages: [...PRB_LANGUAGES],\n    enabled: true,',
              '    supportedLanguages: [...PRB_LANGUAGES],\n    supportedExamProfiles: ["SSC_CGL_CHSL", "SSC_CGL_JSO", "BANKING_PRELIMS", "BANKING_MAINS", "GENERIC_PRACTICE"],\n    optionCountByExamProfile: { SSC_CGL_CHSL: 4, SSC_CGL_JSO: 4, BANKING_PRELIMS: 5, BANKING_MAINS: 5, GENERIC_PRACTICE: 4 },\n    enabled: true,',
              "Question Studio profile metadata",
          )
          path.write_text(text)
          PY

      - name: TypeScript integration
        run: >-
          npx -y -p typescript@5.6.3 tsc
          --noEmit
          --target ES2020
          --module commonjs
          --moduleResolution node
          --resolveJsonModule
          --esModuleInterop
          --skipLibCheck
          artifacts/api-server/src/quant-v4/generation-engine.ts
          artifacts/api-server/src/quant-v4/topics/Probability/exam-readiness.test.ts
          artifacts/api-server/src/quant-v4/topics/Probability/generate-exam-review.ts

      - name: PRB-001 deterministic package proof
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/package.test.ts

      - name: PRB-002 deterministic package proof
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/package.test.ts

      - name: SSC and banking editorial readiness proof
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/exam-readiness.test.ts

      - name: Regenerate review sheets and report
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/generate-exam-review.ts

      - name: Verify generated files
        run: |
          test "$(($(wc -l < artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/human-review-en.csv) - 1))" -eq 75
          test "$(($(wc -l < artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/human-review-en.csv) - 1))" -eq 60
          git diff --check

      - name: Commit verified remediation evidence
        if: success()
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/quant-v4/generation-engine.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/human-review-en.csv \
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/human-review-en.csv \
            artifacts/api-server/src/quant-v4/topics/Probability/editorial-remediation-report.md
          git commit -m "feat(probability): regenerate exam-ready review evidence [skip ci]"
          git push
