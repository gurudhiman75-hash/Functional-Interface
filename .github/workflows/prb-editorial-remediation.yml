name: Probability editorial remediation

on:
  push:
    branches:
      - feat/prb-probability-end-to-end
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Probability/**"
      - "artifacts/api-server/src/quant-v4/generation-engine.ts"
      - ".github/workflows/prb-editorial-remediation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probability-editorial-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probability TypeScript integration
        run: >-
          npx -y -p typescript@5.6.3 tsc
          --noEmit
          --target ES2020
          --module commonjs
          --moduleResolution node
          --resolveJsonModule
          --esModuleInterop
          --skipLibCheck
          artifacts/api-server/src/quant-v4/topics/Probability/exam-readiness.test.ts

      - name: PRB-001 deterministic package proof
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/package.test.ts

      - name: PRB-002 deterministic package proof
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/package.test.ts

      - name: SSC and banking editorial readiness proof
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/exam-readiness.test.ts

      - name: Question Studio exam-profile smoke
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/question-studio-profile.test.ts

      - name: Regenerate review sheets and report
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/generate-exam-review.ts

      - name: Generate comprehensive Markdown
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/generate-comprehensive-questions.ts

      - name: Generate standalone review HTML
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/generate-review-html.ts

      - name: Permanent exam-depth audit
        run: python artifacts/api-server/src/quant-v4/topics/Probability/exam-depth-review-audit.py

      - name: Verify detailed worked-solution evidence
        run: |
          python - <<'PY'
          import csv
          import re
          from pathlib import Path
          from statistics import mean

          root = Path("artifacts/api-server/src/quant-v4/topics/Probability")
          expected = {
              "PRB-001": (75, 4, "SSC_CGL_CHSL"),
              "PRB-002": (60, 5, "BANKING_MAINS"),
          }
          successive_modes = {
              "findSuccessiveIndependentProbability",
              "findWithReplacementProbability",
              "findSuccessiveDependentProbability",
              "findWithoutReplacementProbability",
              "findOrderedDrawSequenceProbability",
              "findSameTypeInSuccessiveDraws",
              "findDifferentTypesInSuccessiveDraws",
              "findAtLeastOneAcrossIndependentStages",
          }

          rows = []
          visible_keys = set()
          for package_id, (expected_count, option_count, profile) in expected.items():
              path = root / package_id / "human-review-en.csv"
              package_rows = list(csv.DictReader(path.open(encoding="utf-8")))
              if len(package_rows) != expected_count:
                  raise SystemExit(f"{package_id}: expected {expected_count} rows, found {len(package_rows)}")

              for row in package_rows:
                  ql_id = row["qlId"]
                  key = (" ".join(row["stem"].lower().split()), row["answer"])
                  if key in visible_keys:
                      raise SystemExit(f"Duplicate visible question at {ql_id}: {row['stem']}")
                  visible_keys.add(key)

                  if row["examProfile"] != profile:
                      raise SystemExit(f"{ql_id}: expected profile {profile}")
                  options = [row[f"option{letter}"] for letter in "ABCDE" if row[f"option{letter}"]]
                  if len(options) != option_count or len(set(options)) != option_count:
                      raise SystemExit(f"{ql_id}: invalid option set")
                  if row["validationValid"] != "true":
                      raise SystemExit(f"{ql_id}: generated row failed validation")

                  explanation = row["explanation"]
                  words = len(explanation.split())
                  minimum = 28 if row["difficulty"] == "Easy" else 45 if row["difficulty"] == "Medium" else 55
                  if not minimum <= words <= 200:
                      raise SystemExit(f"{ql_id}: explanation has {words} words; expected {minimum}-200")
                  for marker in ("Method —", "Step 1 —", "Answer —"):
                      if marker not in explanation:
                          raise SystemExit(f"{ql_id}: missing worked-solution marker {marker}")

                  banned_stem = ("equally likely items", "it does not happen", "satisfies A", "satisfies B")
                  if any(phrase.lower() in row["stem"].lower() for phrase in banned_stem):
                      raise SystemExit(f"{ql_id}: unnatural stem language")
                  banned_starts = ("Favourable outcomes =", "Total outcomes =", "Total possible outcomes =")
                  if explanation.startswith(banned_starts):
                      raise SystemExit(f"{ql_id}: generic answer-key explanation")
                  if row["solveMode"] in successive_modes and re.search(r"coin toss|H/T sequence", explanation, re.I):
                      raise SystemExit(f"{ql_id}: successive-draw solution received a coin method")
                  if re.search(r"=\s*([^ ]+)\s*=\s*\1(?:\.|\s|$)", explanation):
                      raise SystemExit(f"{ql_id}: repeated the same reduced result")
                  if re.search(r"Step \d+ — X\s*=", explanation):
                      raise SystemExit(f"{ql_id}: algebraic variable x was incorrectly capitalised")

                  rows.append(row)

          if len(visible_keys) != 135:
              raise SystemExit(f"Expected 135 unique visible questions, found {len(visible_keys)}")

          overall_average = mean(len(row["explanation"].split()) for row in rows)
          medium_hard = [row for row in rows if row["difficulty"] in {"Medium", "Hard"}]
          medium_hard_average = mean(len(row["explanation"].split()) for row in medium_hard)
          if overall_average < 50 or medium_hard_average < 62:
              raise SystemExit(
                  f"Explanation depth too low: overall={overall_average:.1f}, medium/hard={medium_hard_average:.1f}"
              )

          for markdown_name in (
              "PROBABILITY-COMPREHENSIVE-QUESTIONS-AND-EXPLANATIONS.md",
              "PROBABILITY-REVIEW-QUESTIONS-AND-EXPLANATIONS.md",
          ):
              markdown = (root / markdown_name).read_text(encoding="utf-8")
              question_blocks = markdown.split("\n#### Question ")[1:]
              if len(question_blocks) != 135:
                  raise SystemExit(f"{markdown_name}: expected 135 question blocks, found {len(question_blocks)}")
              for number, block in enumerate(question_blocks, start=1):
                  for marker in ("\n**Correct answer:**", "\n**Explanation:**", "**Method:**", "**Answer:**"):
                      if marker not in block:
                          raise SystemExit(f"{markdown_name}: question block {number} is missing {marker}")

          html_path = root / "PROBABILITY-REVIEW-QUESTIONS-AND-EXPLANATIONS.html"
          html = html_path.read_text(encoding="utf-8")
          if html.count('class="question-card"') != 135:
              raise SystemExit("Standalone HTML does not contain 135 question cards")
          for fragment in ("C(14, 4)", "14!/(4!", "C(8, 3)", "336/1001", "48/143"):
              if fragment not in html:
                  raise SystemExit(f"Standalone HTML is missing calculation fragment: {fragment}")
          if "\\(" in html or "\\)" in html or re.search(r"<script\s+src=", html, re.I):
              raise SystemExit("Standalone HTML contains an unresolved or external formula dependency")

          print({
              "questions": len(rows),
              "unique": len(visible_keys),
              "averageExplanationWords": round(overall_average, 1),
              "mediumHardAverageWords": round(medium_hard_average, 1),
              "standaloneHtml": html_path.name,
          })
          PY
          git diff --check

      - name: Upload detailed review package
        uses: actions/upload-artifact@v4
        with:
          name: probability-detailed-worked-solutions
          path: |
            artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-COMPREHENSIVE-QUESTIONS-AND-EXPLANATIONS.md
            artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-REVIEW-QUESTIONS-AND-EXPLANATIONS.md
            artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-REVIEW-QUESTIONS-AND-EXPLANATIONS.html
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified editorial evidence
        if: success()
        run: |
          targets=(
            artifacts/api-server/src/quant-v4/generation-engine.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/human-review-en.csv
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/human-review-en.csv
            artifacts/api-server/src/quant-v4/topics/Probability/editorial-remediation-report.md
            artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-COMPREHENSIVE-QUESTIONS-AND-EXPLANATIONS.md
            artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-REVIEW-QUESTIONS-AND-EXPLANATIONS.md
            artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-REVIEW-QUESTIONS-AND-EXPLANATIONS.html
          )
          if [ -z "$(git status --porcelain -- "${targets[@]}")" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${targets[@]}"
          git diff --cached --check
          git commit -m "docs(probability): regenerate detailed review evidence [skip ci]"
          git push
