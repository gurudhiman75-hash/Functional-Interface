name: Validate ENV-001 Question Studio Integration V1

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/environment-ecology/**"
      - "artifacts/api-server/src/question-studio/engine-registry.ts"
      - "artifacts/api-server/src/question-studio/engine-registry.test.ts"
      - "artifacts/api-server/src/question-studio/content-engine-foundation.test-suite.ts"
      - "artifacts/api-server/src/question-studio/engines/knowledge-v1-adapter.ts"
      - "artifacts/api-server/src/question-studio/engines/knowledge-v1-env001-adapter-v1.ts"
      - "artifacts/api-server/src/question-studio/engines/knowledge-v1-env001-adapter-v1.test.ts"
      - "artifacts/admin-app/src/pages/content/QuestionStudioEnvironmentReviewPanel.tsx"
      - "artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx"
      - ".github/workflows/environment-question-studio-integration-v1.yml"
  workflow_dispatch:

concurrency:
  group: env-question-studio-integration-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-env-question-studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ENV-001 Question Studio integration contract
        run: |
          mkdir -p artifacts/api-server/dist/environment-question-studio
          pnpm --dir artifacts/api-server exec esbuild             src/question-studio/engines/knowledge-v1-env001-adapter-v1.test.ts             --bundle --packages=external --platform=node --format=esm             --outfile=dist/environment-question-studio/knowledge-v1-env001-adapter-v1.test.mjs
          node artifacts/api-server/dist/environment-question-studio/knowledge-v1-env001-adapter-v1.test.mjs

      - name: Run global Question Studio engine registry contract
        run: |
          pnpm --dir artifacts/api-server exec esbuild             src/question-studio/engine-registry.test.ts             --bundle --packages=external --platform=node --format=esm             --outfile=dist/environment-question-studio/engine-registry.test.mjs
          node artifacts/api-server/dist/environment-question-studio/engine-registry.test.mjs

      - name: Verify Environment admin panel is mounted
        shell: bash
        run: |
          set -euo pipefail
          panel='artifacts/admin-app/src/pages/content/QuestionStudioEnvironmentReviewPanel.tsx'
          operations='artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx'
          test -s "$panel"
          grep -Fq "QuestionStudioEnvironmentReviewPanel" "$operations"
          grep -Fq "packageId: PACKAGE_ID" "$panel"
          grep -Fq "runtimeMode: RUNTIME_MODE" "$panel"
          grep -Fq "result.convertedCount !== 0 || result.reviewOnlyApprovedCount !== 1" "$panel"

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Build admin app
        run: pnpm --dir artifacts/admin-app build
