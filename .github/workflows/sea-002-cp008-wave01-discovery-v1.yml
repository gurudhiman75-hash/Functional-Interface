name: Validate SEA-002 CP008 square seating discovery V1

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/**"
      - ".github/workflows/sea-002-cp008-wave01-discovery-v1.yml"
  workflow_dispatch:

concurrency:
  group: sea-002-cp008-wave01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-sea-002-cp008-wave01:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source discovery boundary
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/source-evidence-v1.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-source-discovery-v1.log

      - name: Validate square topology primitives
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/topology-v1.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-topology-v1.log

      - name: Independently solve temporary discovery prototypes
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/discovery-v1.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-discovery-v1.log

      - name: Validate solve-signature collapse
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types \
            ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp008/solve-signature-v1.test.ts \
            2>&1 | tee /tmp/sea-002-cp008-solve-signature-v1.log

      - name: Re-prove CP007 pre-freeze boundary
        run: >-
          node --experimental-strip-types
          ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-002/cp007/review/prefreeze-authority-v1.test.ts

      - name: Upload CP008 Wave01 evidence
        uses: actions/upload-artifact@v4
        with:
          name: sea-002-cp008-wave01-discovery-v1
          path: |
            /tmp/sea-002-cp008-source-discovery-v1.log
            /tmp/sea-002-cp008-topology-v1.log
            /tmp/sea-002-cp008-discovery-v1.log
            /tmp/sea-002-cp008-solve-signature-v1.log
          if-no-files-found: error
          retention-days: 30
