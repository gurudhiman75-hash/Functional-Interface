name: Validate SAP CP-001 Wave 03

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/**"
      - ".github/workflows/validate-sap-cp001-wave03.yml"
  workflow_dispatch:

jobs:
  validate-sap-cp001-wave03:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle SAP CP-001 Wave 03 proof
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-001/wave03/runtime-authority.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/sap-cp001-wave03-runtime-authority.test.mjs

      - name: Run SAP CP-001 Wave 03 proof
        working-directory: artifacts/api-server
        run: node dist/sap-cp001-wave03-runtime-authority.test.mjs

      - name: Bundle SAP CP-001 saturation authority
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-001/SAP-CP-001-SATURATION-AUTHORITY.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/sap-cp001-saturation-authority.test.mjs

      - name: Run SAP CP-001 saturation authority
        working-directory: artifacts/api-server
        run: node dist/sap-cp001-saturation-authority.test.mjs
