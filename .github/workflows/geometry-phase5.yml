name: Validate Geometry normal Question Studio integration V1

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/quant-v4/generation-engine.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/question-studio-standard-integration.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/geometry-question-studio-standard-integration-v1.test.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/permanent-review/export-geometry-question-studio-standard-integration-v1.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geometry-question-studio-standard-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-geometry-normal-question-studio-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove Geometry normal Question Studio integration V1
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/geometry-question-studio-standard-integration-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-question-studio-standard-integration-v1.test.mjs
          node artifacts/api-server/dist/quant-v4/geometry-question-studio-standard-integration-v1.test.mjs
      - name: Export Geometry normal Question Studio integration V1 evidence
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/permanent-review/export-geometry-question-studio-standard-integration-v1.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-question-studio-standard-integration-v1-export.mjs
          (cd artifacts/api-server && node dist/quant-v4/geometry-question-studio-standard-integration-v1-export.mjs)
      - name: Upload Geometry normal Question Studio integration V1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: geometry-question-studio-standard-integration-v1
          path: artifacts/api-server/dist/quant-v4/geometry-question-studio-standard-integration-v1
          if-no-files-found: error
          retention-days: 30
