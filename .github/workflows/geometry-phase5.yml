name: Validate Geometry permanent solve-mode freeze

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/permanent-review/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/geometry-solve-mode-freeze-v1.test.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geometry-solve-mode-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-geometry-permanent-solve-mode-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove Geometry permanent 75 solve-mode freeze
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/tests/geometry-solve-mode-freeze-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-solve-mode-freeze-v1.test.mjs
          node artifacts/api-server/dist/quant-v4/geometry-solve-mode-freeze-v1.test.mjs

      - name: Export Geometry permanent solve-mode freeze evidence
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/AdvancedMathematics/subtopics/Geometry/permanent-review/export-geometry-solve-mode-freeze-v1.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/geometry-solve-mode-freeze-v1-export.mjs
          (cd artifacts/api-server && node dist/quant-v4/geometry-solve-mode-freeze-v1-export.mjs)

      - name: Upload Geometry permanent solve-mode freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: geometry-solve-mode-freeze-v1
          path: artifacts/api-server/dist/quant-v4/geometry-solve-mode-freeze-v1
          if-no-files-found: error
          retention-days: 30
