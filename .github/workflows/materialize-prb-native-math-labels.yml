name: Materialize Probability native math event labels

on:
  push:
    branches:
      - fix/prb-native-math-event-labels
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Probability/patch-native-math-event-labels.mjs"
      - "artifacts/api-server/src/quant-v4/topics/Probability/shared/native-math-event-labels.ts"
      - "artifacts/api-server/src/quant-v4/topics/Probability/native-math-event-labels.test.ts"
      - ".github/workflows/materialize-prb-native-math-labels.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prb-native-math-event-labels
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply closed event-label patch
        run: node artifacts/api-server/src/quant-v4/topics/Probability/patch-native-math-event-labels.mjs
      - name: Validate event-label round trip
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-math-event-labels.test.ts
      - name: Validate all 432 native explanation surfaces
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/multilingual-runtime.test.ts
      - name: Validate native human-review boundary
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-review-adapter.test.ts
      - name: Validate native editorial quality wave01
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/native-editorial-quality-regression.test.ts
      - name: Preserve English Probability readiness
        run: |
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/question-studio-profile.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/exam-readiness.test.ts
      - name: Commit materialized runtime source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/quant-v4/topics/Probability/shared/native-source-explanation-mirror.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/multilingual-runtime.test.ts
          if git diff --cached --quiet; then
            echo "Runtime source already materialized."
          else
            git commit -m "fix(probability): localize native math event labels"
            git push origin HEAD:fix/prb-native-math-event-labels
          fi
