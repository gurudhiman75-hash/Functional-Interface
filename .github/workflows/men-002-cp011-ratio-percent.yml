name: Validate MEN-CP-011 ratio and percentage wave

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/ratio-percent*.ts
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/bundle-with-canonical-shell.mjs
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/foundation.test.ts
      - .github/workflows/men-002-cp011-ratio-percent.yml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-men-002-cp011-ratio-percent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ratio-percent:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove ratio and percentage runtime
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/api-server
          node src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/bundle-with-canonical-shell.mjs \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/ratio-percent.test.ts \
            dist/quant-v4/men-cp011-ratio-percent-wave01.test.mjs
          node dist/quant-v4/men-cp011-ratio-percent-wave01.test.mjs

      - name: Export ratio and percentage review evidence
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/api-server
          node src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/bundle-with-canonical-shell.mjs \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/ratio-percent-review-export.ts \
            dist/quant-v4/men-cp011-ratio-percent-wave01-review.mjs
          node dist/quant-v4/men-cp011-ratio-percent-wave01-review.mjs \
            2>&1 | tee dist/quant-v4/men-cp011-ratio-percent-wave01-review.log

      - name: Build production API bundle
        shell: bash
        run: bash build-api.sh

      - name: Upload ratio and percentage review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-cp011-ratio-percent-wave01-review
          path: |
            artifacts/api-server/dist/quant-v4/men-cp011-ratio-percent-wave01-review.log
            artifacts/api-server/dist/quant-v4/men-cp011-ratio-percent-wave01-review.json
            artifacts/api-server/dist/quant-v4/men-cp011-ratio-percent-wave01-review.md
          if-no-files-found: error
          retention-days: 14
