name: Validate INT-CP-005 V16.1 Freeze

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp005-variable-growth-decay-v16-1-frozen.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp005-v16-1-freeze-audit.ts"
      - ".github/workflows/int-cp005-v16-1-freeze.yml"
  workflow_dispatch:

jobs:
  validate-int-cp005-v16-1-freeze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle V16.1 freeze audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp005-v16-1-freeze-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-cp005-v16-1-freeze-audit.mjs
      - name: Run V16.1 freeze replay
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp005-v16-1-freeze-audit.mjs 2>&1 | tee dist/quant-v4/int-cp005-v16-1-freeze-audit.log
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Verify freeze marker
        run: grep -q 'PASS_INT_CP005_V16_1_MULTILINGUAL_FREEZE' artifacts/api-server/dist/quant-v4/int-cp005-v16-1-freeze-audit.log
      - name: Upload freeze evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-cp005-v16-1-freeze
          path: artifacts/api-server/dist/quant-v4/int-cp005-v16-1-freeze-audit.log
          if-no-files-found: error
