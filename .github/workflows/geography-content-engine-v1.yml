name: Validate Geography Content Engine V1

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/knowledge-v1/indian-geography/**"
      - "artifacts/api-server/src/knowledge-v1/types.ts"
      - "artifacts/api-server/src/knowledge-v1/eligibility.ts"
      - "artifacts/api-server/src/knowledge-v1/deterministic.ts"
      - "artifacts/api-server/src/knowledge-v1/question-validation.ts"
      - "artifacts/api-server/src/question-studio/engines/knowledge-v1-geo-riv-001-adapter-v1.ts"
      - "artifacts/api-server/src/question-studio/engines/knowledge-v1-geo-riv-001-adapter-v1.test.ts"
      - "artifacts/api-server/src/question-studio/engines/knowledge-v1-geo-phy-001-adapter-v1.ts"
      - "artifacts/api-server/src/question-studio/engines/knowledge-v1-geo-phy-001-adapter-v1.test.ts"
      - "artifacts/api-server/src/question-studio/engines/knowledge-v1-geo-cli-001-adapter-v1.ts"
      - "artifacts/api-server/src/question-studio/engines/knowledge-v1-geo-cli-001-adapter-v1.test.ts"
      - "artifacts/api-server/src/question-studio/engines/knowledge-v1-geo-soi-001-adapter-v1.ts"
      - "artifacts/api-server/src/question-studio/engines/knowledge-v1-geo-soi-001-adapter-v1.test.ts"
      - "artifacts/api-server/src/question-studio/engines/knowledge-v1-adapter.ts"
  workflow_dispatch:

concurrency:
  group: geography-content-engine-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-geography-content-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run GEO-RIV-001 qualification gates
        run: |
          mkdir -p artifacts/api-server/dist/geography
          tests=(
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp001-validator.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp001-editorial-review.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp001-review-generator.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp001-review-batch.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp001-v2d.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp001-v2f.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp001-v2g.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp001-freeze-v1.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp002-validator.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp002-review-generator-v2.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp002-review-generator-v3.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp002-review-generator-v4.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp002-review-batch-v1.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp002-freeze-v1.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp003-validator.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp003-editorial-review-v1.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp003-review-generator-v1.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp003-review-generator-v2.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp003-review-batch-v1.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp003-review-batch-v2.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp003-freeze-v1.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp004-validator.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp004-review-generator-v1.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp004-review-generator-v2.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp004-review-batch-v2.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp004-freeze-v1.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp005-validator.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp005-review-generator-v2.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp005-review-batch-v4.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-cp005-freeze-v1.test.ts"
            "src/knowledge-v1/indian-geography/rivers-drainage/geo-riv-001-chapter-close-v1.test.ts"
            "src/question-studio/engines/knowledge-v1-geo-riv-001-adapter-v1.test.ts"
          )
          for test_file in "${tests[@]}"; do
            output_name="$(basename "${test_file}" .ts).mjs"
            pnpm --dir artifacts/api-server exec esbuild \
              "${test_file}" \
              --bundle --packages=external --platform=node --format=esm \
              --outfile="dist/geography/${output_name}"
            node "artifacts/api-server/dist/geography/${output_name}"
          done

