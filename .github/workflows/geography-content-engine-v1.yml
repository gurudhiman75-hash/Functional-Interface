      - name: Run GEO-CLI-001 chapter owning-authority V3 audit
        run: |
          mkdir -p artifacts/api-server/dist/geography
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/indian-geography/climate/geo-cli-001-owning-authority-v3.test.ts \
            --bundle --packages=external --platform=node --format=esm \
            --outfile=dist/geography/geo-cli-001-owning-authority-v3.test.mjs
          node artifacts/api-server/dist/geography/geo-cli-001-owning-authority-v3.test.mjs

      - name: Run GEO-VEG-001 CP001 qualification gate
        run: |
          mkdir -p artifacts/api-server/dist/geography
          pnpm --dir artifacts/api-server exec esbuild \
            src/knowledge-v1/indian-geography/natural-vegetation-wildlife/geo-veg-001-cp001-review-batch-v1.test.ts \
