name: Validate RNK-001 CP-006 Equality Ranking Discovery

on:
  push:
    branches:
      - feat/rnk-001-cp006-equality-ranking-discovery
    paths:
      - 'artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/**'
      - 'artifacts/api-server/src/reasoning-v1/question-studio-registry*'
      - '.github/workflows/reasoning-rnk-001-cp006-equality-ranking-discovery.yml'
  workflow_dispatch:

jobs:
  validate-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate CP-006 equality-aware ranking discovery
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-006/cp006-equality-ranking-discovery.test.ts \
            | tee rnk-cp006-equality-discovery.log

      - name: Validate frozen CP-005 English runtime
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-005/cp005-permanent-runtime-v1-freeze.test.ts \
            | tee rnk-cp005-frozen-regression.log

      - name: Validate frozen CP-004 permanent projection
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-004/cp004-permanent-runtime-v1-gates.test.ts \
            | tee rnk-cp004-frozen-regression.log

      - name: Validate Question Studio remains disabled
        run: |
          set -o pipefail
          pnpm dlx tsx \
            artifacts/api-server/src/reasoning-v1/question-studio-registry.test.ts \
            | tee rnk-question-studio-registry.log

      - name: Build API server
        run: |
          set -o pipefail
          pnpm --dir artifacts/api-server build \
            | tee rnk-cp006-api-build.log

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnk-001-cp006-equality-ranking-discovery-evidence
          path: |
            rnk-cp006-equality-discovery.log
            rnk-cp005-frozen-regression.log
            rnk-cp004-frozen-regression.log
            rnk-question-studio-registry.log
            rnk-cp006-api-build.log
          if-no-files-found: ignore
          retention-days: 14
