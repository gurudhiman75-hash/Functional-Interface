name: Certify STA-001 V4.1 Six-QL Freeze

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/chapter-freeze-v4-1-*
      - artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/question-studio-freeze-v4-1.ts
      - artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/question-studio-review.ts
      - artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/question-studio-payload.ts
      - artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/question-studio-v4-1-integration.test.ts
      - .github/workflows/sta-001-v4-1-freeze.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certify-sta-001-v4-1-six-ql-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immutable-v4-1-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Strict TypeScript check for frozen STA V4.1 authority
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowImportingTsExtensions \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            src/reasoning-v1/topics/Statement-and-Assumption/STA-001/exam-realness-v4-1-types.ts \
            src/reasoning-v1/topics/Statement-and-Assumption/STA-001/exam-realness-v4-1-contexts.ts \
            src/reasoning-v1/topics/Statement-and-Assumption/STA-001/exam-realness-v4-1-authorities.ts \
            src/reasoning-v1/topics/Statement-and-Assumption/STA-001/exam-realness-v4-1-runtime.ts \
            src/reasoning-v1/topics/Statement-and-Assumption/STA-001/exam-realness-v4-1-editorial-runtime.ts \
            src/reasoning-v1/topics/Statement-and-Assumption/STA-001/exam-realness-v4-1-learner-r4-runtime.ts \
            src/reasoning-v1/topics/Statement-and-Assumption/STA-001/exam-realness-v4-1-learner-r5-runtime.ts \
            src/reasoning-v1/topics/Statement-and-Assumption/STA-001/exam-realness-v4-1-learner-runtime.ts \
            src/reasoning-v1/topics/Statement-and-Assumption/STA-001/question-studio-review-v4-1.ts \
            src/reasoning-v1/topics/Statement-and-Assumption/STA-001/question-studio-freeze-v4-1.ts \
            src/reasoning-v1/topics/Statement-and-Assumption/STA-001/question-studio-review.ts \
            src/reasoning-v1/topics/Statement-and-Assumption/STA-001/question-studio-payload.ts \
            src/reasoning-v1/topics/Statement-and-Assumption/STA-001/chapter-freeze-v4-1-manifest.ts \
            src/reasoning-v1/topics/Statement-and-Assumption/STA-001/chapter-freeze-v4-1-proof.test.ts

      - name: Replay immutable six-QL V4.1 freeze locks
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/chapter-freeze-v4-1-proof.test.ts

      - name: Replay V4.1 semantic and learner authority proofs
        run: |
          node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/exam-realness-v4-1-proof.test.ts
          node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/Statement-and-Assumption/STA-001/exam-realness-v4-1-editorial-proof.test.ts

      - name: Replay frozen shared Question Studio integration
        working-directory: artifacts/api-server
        run: |
          pnpm exec esbuild \
            src/reasoning-v1/topics/Statement-and-Assumption/STA-001/question-studio-v4-1-integration.test.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=dist/sta-001-v4-1-frozen-question-studio-integration.mjs
          node dist/sta-001-v4-1-frozen-question-studio-integration.mjs

      - name: Build production API
        working-directory: artifacts/api-server
        run: pnpm run build

      - name: Build production admin app
        working-directory: artifacts/admin-app
        run: pnpm run build

      - name: Freeze boundary
        run: |
          echo 'STA-001 V4.1 is frozen with six permanent QLs in EN/HI/PA.'
          echo 'Question Studio remains review-only.'
          echo 'Question Bank, test, mock, and public-release gates remain closed.'
