name: Validate TSD CP006 Hindi Punjabi Review V2

on:
  pull_request:
    branches:
      - freeze/tsd-cp006-english-v5-approved
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001/**
      - .github/workflows/tsd-cp006-hi-pa-localization-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cp006-hi-pa-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle frozen English and native V2 evidence
        run: |
          ROOT=src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001
          OUT=dist/quant-v4/tsd-001/cp006-hi-pa-v2
          mkdir -p artifacts/api-server/$OUT
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/index.ts" --bundle --platform=node --format=esm --outfile="dist/quant-v4/tsd-001/index.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp006/english-approved-freeze-proof-v5.ts" --bundle --platform=node --format=esm --outfile="$OUT/english-freeze-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp006/localization/native-review-proof-v2.ts" --bundle --platform=node --format=esm --outfile="$OUT/native-v2-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp006/localization/native-review-export-v2.ts" --bundle --platform=node --format=esm --outfile="$OUT/native-v2-export.mjs"
      - name: Re-prove CP006 English V5 freeze
        run: |
          set -o pipefail
          cd artifacts/api-server
          OUT=dist/quant-v4/tsd-001/cp006-hi-pa-v2
          node "$OUT/english-freeze-proof.mjs" 2>&1 | tee "$OUT/english-freeze-proof.log"
      - name: Export and validate Hindi Punjabi V2
        run: |
          set -o pipefail
          cd artifacts/api-server
          OUT=dist/quant-v4/tsd-001/cp006-hi-pa-v2
          node "$OUT/native-v2-export.mjs" "$OUT/cp006-hi-pa-review-v2-156q.json" 2>&1 | tee "$OUT/native-v2-export.log"
          node "$OUT/native-v2-proof.mjs" 2>&1 | tee "$OUT/native-v2-proof.log"
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Upload CP006 Hindi Punjabi V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsd-cp006-hi-pa-review-v2-156q
          path: |
            artifacts/api-server/dist/quant-v4/tsd-001/cp006-hi-pa-v2/english-freeze-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/cp006-hi-pa-v2/native-v2-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/cp006-hi-pa-v2/native-v2-export.log
            artifacts/api-server/dist/quant-v4/tsd-001/cp006-hi-pa-v2/cp006-hi-pa-review-v2-156q.json
          if-no-files-found: error
