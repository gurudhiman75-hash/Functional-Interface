name: Validate Notes Studio NS-011 Source Coverage

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/notes-studio/source-coverage.ts
      - artifacts/api-server/src/notes-studio/source-coverage.test.ts
      - artifacts/api-server/src/routes/admin-notes-studio-source-coverage.ts
      - artifacts/api-server/src/routes/index.ts
      - artifacts/admin-app/src/pages/content/NotesStudioSourceCoveragePage.tsx
      - artifacts/admin-app/src/pages/content/NotesStudioHubPage.tsx
      - docs/notes-studio-ns011-source-coverage.md

permissions:
  contents: read

concurrency:
  group: notes-studio-ns011-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-notes-studio-source-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run NS-011 source coverage contracts
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/notes-studio/source-coverage.test.ts --bundle --packages=external --platform=node --format=esm --outfile=dist/notes-studio-source-coverage.test.mjs
          node artifacts/api-server/dist/notes-studio-source-coverage.test.mjs

      - name: Verify diagnostic boundaries
        run: |
          grep -F 'advisoryOnly: true' artifacts/api-server/src/routes/admin-notes-studio-source-coverage.ts
          grep -F 'rawSourceBodiesReturned: false' artifacts/api-server/src/routes/admin-notes-studio-source-coverage.ts
          grep -F 'automaticSourceDiscovery: false' artifacts/api-server/src/routes/admin-notes-studio-source-coverage.ts
          grep -F 'automaticSourceAttachment: false' artifacts/api-server/src/routes/admin-notes-studio-source-coverage.ts
          grep -F 'evidenceExtractionHardBlocked: false' artifacts/api-server/src/notes-studio/source-coverage.ts
          grep -F 'adminNotesStudioSourceCoverageRouter' artifacts/api-server/src/routes/index.ts
          grep -F 'Source diagnostics' artifacts/admin-app/src/pages/content/NotesStudioHubPage.tsx
          if grep -F 'fetch(' artifacts/api-server/src/routes/admin-notes-studio-source-coverage.ts; then exit 1; fi
          if grep -F 'extracted_text AS' artifacts/api-server/src/routes/admin-notes-studio-source-coverage.ts; then exit 1; fi
          if grep -F 'INSERT INTO content.source_documents' artifacts/api-server/src/routes/admin-notes-studio-source-coverage.ts; then exit 1; fi

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Typecheck admin app
        run: pnpm --dir artifacts/admin-app typecheck
