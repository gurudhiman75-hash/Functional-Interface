name: Validate OPS-001 approved teaching runtime

on:
  push:
    branches:
      - feat/ops-001-end-to-end-design
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/**
      - .github/workflows/ops-001-approved-teaching.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/**
      - .github/workflows/ops-001-approved-teaching.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-ops-001-approved-teaching-${{ github.ref }}
  cancel-in-progress: true

jobs:
  approved-teaching-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/Mathematical-Operations/OPS-001 -name '*.ts' -print)
      - name: Run approved teaching runtime proof
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/pilot/approved-teaching-runtime.test.ts
      - name: Run permanent QL registry proof
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/registry/ops-ql-registry.test.ts
      - name: Generate canonical approved review bundle
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/pilot/approved-canonical-review-export.ts ./ops-001-approved-canonical-review
      - name: Upload canonical approved review bundle
        uses: actions/upload-artifact@v4
        with:
          name: ops-001-approved-v3-review-310
          path: ops-001-approved-canonical-review
          if-no-files-found: error
          retention-days: 14
