name: Validate OPS-001 approved teaching runtime

on:
  push:
    branches:
      - feat/ops-001-end-to-end-design
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/foundation/**
      - artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/pilot/**
      - .github/workflows/ops-001-approved-teaching.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/foundation/**
      - artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/pilot/**
      - .github/workflows/ops-001-approved-teaching.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-ops-001-approved-teaching-${{ github.ref }}
  cancel-in-progress: true

jobs:
  approved-teaching-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/Mathematical-Operations/OPS-001/foundation -name '*.ts' -print) \
            $(find src/reasoning-v1/topics/Mathematical-Operations/OPS-001/pilot -name '*.ts' -print)
      - name: Run approved teaching runtime proof
        run: |
          set +e
          pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/pilot/approved-teaching-runtime.test.ts > /tmp/ops-approved-test.log 2>&1
          status=$?
          tail -n 120 /tmp/ops-approved-test.log
          exit $status
      - name: Upload failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ops-001-approved-test-diagnostic
          path: /tmp/ops-approved-test.log
          if-no-files-found: error
          retention-days: 3
      - name: Generate approved 310-question review bundle
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Mathematical-Operations/OPS-001/pilot/approved-manual-review-export.ts ./ops-001-approved-review
      - name: Upload approved review bundle
        uses: actions/upload-artifact@v4
        with:
          name: ops-001-approved-review-310
          path: ops-001-approved-review
          if-no-files-found: error
          retention-days: 14
