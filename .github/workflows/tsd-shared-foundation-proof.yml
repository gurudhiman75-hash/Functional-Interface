name: Validate TSD Foundation and Frozen CP-001

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/**
      - .github/workflows/tsd-shared-foundation-proof.yml

permissions:
  contents: read

jobs:
  validate-tsd-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle TSD foundation and CP-001
        run: |
          ROOT=src/quant-v4/topics/Arithmetic/subtopics/TimeSpeedDistance/TSD-001
          OUT=dist/quant-v4/tsd-001
          mkdir -p artifacts/api-server/$OUT/foundation artifacts/api-server/$OUT/cp001
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/index.ts" --bundle --platform=node --format=esm --outfile="$OUT/index.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/foundation/foundation-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/foundation/foundation-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp001/discovery-registry-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/cp001/discovery-registry-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp001/canonical-solver-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/cp001/canonical-solver-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp001/independent-verifier-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/cp001/independent-verifier-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp001/runtime-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/cp001/runtime-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp001/source-saturation-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/cp001/source-saturation-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp001/pedagogy-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/cp001/pedagogy-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp001/human-explanation-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/cp001/human-explanation-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp001/clock-boundary-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/cp001/clock-boundary-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp001/equivalent-speed-representation-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/cp001/equivalent-speed-representation-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp001/answer-unit-edge-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/cp001/answer-unit-edge-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp001/freeze-proof.ts" --bundle --platform=node --format=esm --outfile="$OUT/cp001/freeze-proof.mjs"
          pnpm --dir artifacts/api-server exec esbuild "$ROOT/cp001/review-export.ts" --bundle --platform=node --format=esm --outfile="$OUT/cp001/review-export.mjs"

      - name: Run exact proof suites
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/tsd-001/foundation/foundation-proof.mjs | tee dist/quant-v4/tsd-001/foundation/foundation-proof.log
          node dist/quant-v4/tsd-001/cp001/discovery-registry-proof.mjs | tee dist/quant-v4/tsd-001/cp001/discovery-registry-proof.log
          node dist/quant-v4/tsd-001/cp001/canonical-solver-proof.mjs | tee dist/quant-v4/tsd-001/cp001/canonical-solver-proof.log
          node dist/quant-v4/tsd-001/cp001/independent-verifier-proof.mjs | tee dist/quant-v4/tsd-001/cp001/independent-verifier-proof.log
          node dist/quant-v4/tsd-001/cp001/runtime-proof.mjs | tee dist/quant-v4/tsd-001/cp001/runtime-proof.log
          node dist/quant-v4/tsd-001/cp001/source-saturation-proof.mjs | tee dist/quant-v4/tsd-001/cp001/source-saturation-proof.log
          node dist/quant-v4/tsd-001/cp001/pedagogy-proof.mjs | tee dist/quant-v4/tsd-001/cp001/pedagogy-proof.log
          node dist/quant-v4/tsd-001/cp001/human-explanation-proof.mjs | tee dist/quant-v4/tsd-001/cp001/human-explanation-proof.log
          node dist/quant-v4/tsd-001/cp001/clock-boundary-proof.mjs | tee dist/quant-v4/tsd-001/cp001/clock-boundary-proof.log
          node dist/quant-v4/tsd-001/cp001/equivalent-speed-representation-proof.mjs | tee dist/quant-v4/tsd-001/cp001/equivalent-speed-representation-proof.log
          node dist/quant-v4/tsd-001/cp001/answer-unit-edge-proof.mjs | tee dist/quant-v4/tsd-001/cp001/answer-unit-edge-proof.log
          node dist/quant-v4/tsd-001/cp001/freeze-proof.mjs | tee dist/quant-v4/tsd-001/cp001/freeze-proof.log
          node dist/quant-v4/tsd-001/cp001/review-export.mjs | tee dist/quant-v4/tsd-001/cp001/review-export.log

      - name: Upload proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsd-foundation-cp001-frozen-runtime-proof
          path: |
            artifacts/api-server/dist/quant-v4/tsd-001/foundation/foundation-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/cp001/discovery-registry-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/cp001/canonical-solver-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/cp001/independent-verifier-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/cp001/runtime-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/cp001/source-saturation-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/cp001/pedagogy-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/cp001/human-explanation-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/cp001/clock-boundary-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/cp001/equivalent-speed-representation-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/cp001/answer-unit-edge-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/cp001/freeze-proof.log
            artifacts/api-server/dist/quant-v4/tsd-001/cp001/review-export.log
          if-no-files-found: error

      - name: Upload CP-001 frozen English review
        uses: actions/upload-artifact@v4
        with:
          name: tsd-cp001-frozen-english-review
          path: artifacts/api-server/dist/quant-v4/tsd-001/cp001-review
          if-no-files-found: error
