name: Quant V4 real-exam empirical frequency diagnostic P2

on:
  push:
    branches:
      - audit/quant-v4-real-exam-empirical-frequency-diagnostic-p2
    paths:
      - ".github/workflows/quant-v4-real-exam-empirical-frequency-diagnostic-p2.yml"
      - "artifacts/api-server/src/quant-v4/quality/QUANT-V4-REAL-EXAM-EMPIRICAL-FREQUENCY-DIAGNOSTIC-P2.md"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-real-exam-empirical-frequency-diagnostic-p2.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-real-exam-empirical-frequency-diagnostic-p2.test.ts"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/quality/QUANT-V4-REAL-EXAM-EMPIRICAL-FREQUENCY-DIAGNOSTIC-P2.md"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-real-exam-empirical-frequency-diagnostic-p2.ts"
      - "artifacts/api-server/src/quant-v4/quality/quant-v4-real-exam-empirical-frequency-diagnostic-p2.test.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-v4-real-exam-empirical-frequency-diagnostic-p2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  empirical-frequency-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle empirical frequency proofs
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/quality
          for test in \
            quant-v4-whole-section-frequency-calibration-p2.test \
            quant-v4-real-exam-empirical-frequency-diagnostic-p2.test
          do
            pnpm --dir artifacts/api-server exec esbuild \
              "src/quant-v4/quality/${test}.ts" \
              --bundle --platform=node --format=esm --packages=external \
              --outfile="dist/quant-v4/quality/${test}.mjs"
          done
      - name: Run whole-section calibration proof
        working-directory: artifacts/api-server
        run: node dist/quant-v4/quality/quant-v4-whole-section-frequency-calibration-p2.test.mjs
      - name: Run simulator empirical divergence diagnostic
        working-directory: artifacts/api-server
        run: node dist/quant-v4/quality/quant-v4-real-exam-empirical-frequency-diagnostic-p2.test.mjs
      - name: Patch hygiene
        run: git diff --check
