name: One-shot PNL CP-001 currency-safe distractor patch

on:
  push:
    branches:
      - feat/pnl-001-cp001-dynamic-runtime
    paths:
      - ".github/workflows/tmp-pnl-cp001-round-distractors.yml"

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-cp001-dynamic-runtime

      - name: Round misconception money to the nearest paise
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-001/cp001-dynamic-runtime.ts")
          source = path.read_text()
          anchor = '''function multiplyMoneyByRational(value: Money, factor: Rational): Money {
            return moneyFromExactRational(multiplyRational(rational(value.paise), factor));
          }'''
          replacement = '''function moneyFromRoundedRational(value: Rational): Money {
            const quotient = value.numerator / value.denominator;
            const remainder = absoluteBigInt(value.numerator % value.denominator);
            const adjustment =
              remainder * 2n >= absoluteBigInt(value.denominator)
                ? value.numerator < 0n
                  ? -1n
                  : 1n
                : 0n;
            return moneyFromPaise(quotient + adjustment);
          }

          function multiplyMoneyByRational(value: Money, factor: Rational): Money {
            return moneyFromExactRational(multiplyRational(rational(value.paise), factor));
          }'''
          if source.count(anchor) != 1:
              raise SystemExit(f"Expected one money helper anchor, found {source.count(anchor)}")
          source = source.replace(anchor, replacement)

          start = source.index("function wrongCandidates(")
          end = source.index("function shuffledOptions(", start)
          before = source[:start]
          section = source[start:end]
          after = source[end:]
          count = section.count("moneyFromExactRational(")
          if count < 1:
              raise SystemExit("Expected at least one exact-money distractor conversion")
          section = section.replace("moneyFromExactRational(", "moneyFromRoundedRational(")
          path.write_text(before + section + after)
          print(f"Converted {count} misconception money calculation(s) to paise-safe rounding")
          PY

      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/CP-001/cp001-dynamic-runtime.ts
          git commit -m "fix(pnl): round fractional-paise misconception options"
          git push origin HEAD:feat/pnl-001-cp001-dynamic-runtime
