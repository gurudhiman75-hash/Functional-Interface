name: Probability detailed solution remediation

on:
  push:
    branches:
      - feat/prb-probability-end-to-end
    paths:
      - ".github/workflows/prb-detailed-solution-remediation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply detailed worked-solution remediation
        run: |
          python scripts/prb_detailed_solution_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path("artifacts/api-server/src/quant-v4/topics/Probability/shared/validator.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace("explanation.at(-1)", "explanation[explanation.length - 1]")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Probability TypeScript integration
        run: >-
          npx -y -p typescript@5.6.3 tsc
          --noEmit
          --target ES2020
          --module commonjs
          --moduleResolution node
          --resolveJsonModule
          --esModuleInterop
          --skipLibCheck
          artifacts/api-server/src/quant-v4/topics/Probability/exam-readiness.test.ts

      - name: Complete Probability proof
        run: |
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/package.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/package.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/exam-readiness.test.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/question-studio-profile.test.ts

      - name: Regenerate detailed review evidence
        run: |
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/generate-exam-review.ts
          npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/generate-comprehensive-questions.ts
          python artifacts/api-server/src/quant-v4/topics/Probability/exam-depth-review-audit.py
          git diff --check

      - name: Verify detailed solution structure
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from statistics import mean

          root = Path("artifacts/api-server/src/quant-v4/topics/Probability")
          rows = []
          for package_id, expected in (("PRB-001", 75), ("PRB-002", 60)):
              package_rows = list(csv.DictReader((root / package_id / "human-review-en.csv").open(encoding="utf-8")))
              if len(package_rows) != expected:
                  raise SystemExit(f"{package_id}: expected {expected}, found {len(package_rows)}")
              rows.extend(package_rows)

          for row in rows:
              explanation = row["explanation"]
              words = len(explanation.split())
              minimum = 32 if row["difficulty"] == "Easy" else 48 if row["difficulty"] == "Medium" else 55
              if not minimum <= words <= 220:
                  raise SystemExit(f"{row['qlId']}: {words} words, expected {minimum}-220")
              for marker in ("Approach —", "Step 1 —", "Why this works —", "Answer —"):
                  if marker not in explanation:
                      raise SystemExit(f"{row['qlId']}: missing {marker}")
              if row["validationValid"] != "true":
                  raise SystemExit(f"{row['qlId']}: validation failed")

          avg = mean(len(row["explanation"].split()) for row in rows)
          medium_hard = [row for row in rows if row["difficulty"] in {"Medium", "Hard"}]
          mh_avg = mean(len(row["explanation"].split()) for row in medium_hard)
          if avg < 52 or mh_avg < 62:
              raise SystemExit(f"Insufficient detail: overall={avg:.1f}, medium/hard={mh_avg:.1f}")
          print({"questions": len(rows), "averageWords": round(avg, 1), "mediumHardAverageWords": round(mh_avg, 1)})
          PY

      - name: Upload detailed review Markdown
        uses: actions/upload-artifact@v4
        with:
          name: probability-detailed-worked-solutions
          path: |
            artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-COMPREHENSIVE-QUESTIONS-AND-EXPLANATIONS.md
            artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-REVIEW-QUESTIONS-AND-EXPLANATIONS.md
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified source and evidence
        if: success()
        run: |
          targets=(
            artifacts/api-server/src/quant-v4/topics/Probability/shared/exam-depth-remodeler.ts
            artifacts/api-server/src/quant-v4/topics/Probability/shared/validator.ts
            artifacts/api-server/src/quant-v4/topics/Probability/exam-depth-review-audit.py
            artifacts/api-server/src/quant-v4/topics/Probability/generate-exam-review.ts
            artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-EXAM-DEPTH-STANDARD.md
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-001/human-review-en.csv
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/human-review-en.csv
            artifacts/api-server/src/quant-v4/topics/Probability/editorial-remediation-report.md
            artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-COMPREHENSIVE-QUESTIONS-AND-EXPLANATIONS.md
            artifacts/api-server/src/quant-v4/topics/Probability/PROBABILITY-REVIEW-QUESTIONS-AND-EXPLANATIONS.md
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${targets[@]}"
          git diff --cached --check
          git commit -m "refactor(probability): expand explanations into worked solutions [skip ci]"
          git push
