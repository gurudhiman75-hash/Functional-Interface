name: Validate MAL-001 multilingual chapter readiness

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/generation-engine.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/question-studio-adapter.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/question-studio-standard-integration.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/chapter-compact-explanation-v1.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/chapter-multilingual-question-studio-v1.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/chapter-multilingual-question-studio-v2.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/chapter-multilingual-question-studio-v3.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/chapter-multilingual-question-studio-v4.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/chapter-multilingual-question-studio-v5.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp001-permanent-runtime.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp001-release.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp002-editorial-v2.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp002-chapter-closure-runtime-v4.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp003-release-editorial-v2.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp003-release-editorial-v3.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp004-chapter-closure-runtime-v8.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp004-chapter-closure-runtime-v9.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp006-permanent-review-runtime-v1.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp006-wave01-learner-authority-final.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/foundation/cp006-wave02-final-authority-v4.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-cp006-wave06-permanent-english-review-audit.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-chapter-67ql-english-readiness-audit.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-chapter-value-quality-closure-audit.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-compact-explanation-audit.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-question-studio-complete-connection-audit.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-multilingual-question-studio-audit.ts"
      - ".github/workflows/mal-001-chapter-67ql-english-readiness.yml"
  workflow_dispatch:

concurrency:
  group: mal-001-multilingual-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-mal-chapter-readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server run build
      - name: Bundle MAL chapter audits
        run: |
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-cp006-wave05-permanent-allocation-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/mal-001-cp006-wave05-permanent-allocation-audit.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-cp006-wave06-permanent-english-review-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/mal-001-cp006-wave06-permanent-english-review-audit.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-chapter-67ql-english-readiness-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/mal-001-chapter-67ql-english-readiness-audit.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-chapter-value-quality-closure-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/mal-001-chapter-value-quality-closure-audit.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-compact-explanation-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/mal-001-compact-explanation-audit.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-question-studio-complete-connection-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/mal-001-question-studio-complete-connection-audit.mjs
          pnpm --dir artifacts/api-server exec esbuild src/quant-v4/topics/Arithmetic/subtopics/MixtureAndAlligation/MAL-001/mal-001-multilingual-question-studio-audit.ts --bundle --platform=node --format=esm --outfile=dist/quant-v4/mal-001-multilingual-question-studio-audit.mjs
      - name: Run CP006 allocation regression
        run: |
          cd artifacts/api-server
          node dist/quant-v4/mal-001-cp006-wave05-permanent-allocation-audit.mjs
      - name: Run CP006 permanent English review audit
        shell: bash
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/mal-001-cp006-wave06-permanent-english-review-audit.mjs 2>&1 | tee dist/quant-v4/mal-001-cp006-wave06-permanent-english-review-audit.log
      - name: Run 67 QL English chapter readiness audit
        shell: bash
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/mal-001-chapter-67ql-english-readiness-audit.mjs 2>&1 | tee dist/quant-v4/mal-001-chapter-67ql-english-readiness-audit.log
      - name: Run exam-realistic value closure audit
        shell: bash
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/mal-001-chapter-value-quality-closure-audit.mjs 2>&1 | tee dist/quant-v4/mal-001-chapter-value-quality-closure-audit.log
      - name: Run compact explanation and alligation audit
        shell: bash
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/mal-001-compact-explanation-audit.mjs 2>&1 | tee dist/quant-v4/mal-001-compact-explanation-audit.log
      - name: Run complete Question Studio connection audit
        shell: bash
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/mal-001-question-studio-complete-connection-audit.mjs 2>&1 | tee dist/quant-v4/mal-001-question-studio-complete-connection-audit.log
      - name: Run Hindi Punjabi 67 QL parity audit
        shell: bash
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/mal-001-multilingual-question-studio-audit.mjs 2>&1 | tee dist/quant-v4/mal-001-multilingual-question-studio-audit.log
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mal-001-multilingual-readiness
          path: |
            artifacts/api-server/dist/quant-v4/mal-001-cp006-wave06-permanent-english-review-audit.log
            artifacts/api-server/dist/quant-v4/MAL-CP-006-WAVE-06-PERMANENT-ENGLISH-56Q-REVIEW.md
            artifacts/api-server/dist/quant-v4/mal-cp006-wave06-permanent-english-review.json
            artifacts/api-server/dist/quant-v4/mal-001-chapter-67ql-english-readiness-audit.log
            artifacts/api-server/dist/quant-v4/MAL-001-CHAPTER-67QL-ENGLISH-READINESS-REVIEW.md
            artifacts/api-server/dist/quant-v4/mal-001-chapter-67ql-english-readiness.json
            artifacts/api-server/dist/quant-v4/mal-001-chapter-value-quality-closure-audit.log
            artifacts/api-server/dist/quant-v4/MAL-001-CHAPTER-VALUE-QUALITY-CLOSURE-36Q.md
            artifacts/api-server/dist/quant-v4/mal-001-chapter-value-quality-closure.json
            artifacts/api-server/dist/quant-v4/mal-001-compact-explanation-audit.log
            artifacts/api-server/dist/quant-v4/mal-001-question-studio-complete-connection-audit.log
            artifacts/api-server/dist/quant-v4/mal-001-multilingual-question-studio-audit.log
            artifacts/api-server/dist/quant-v4/mal-001-multilingual-question-studio-audit.json
            artifacts/api-server/dist/quant-v4/MAL-001-MULTILINGUAL-134Q-REVIEW.md
          if-no-files-found: warn
          retention-days: 14
