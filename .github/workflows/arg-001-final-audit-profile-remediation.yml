name: ARG-001 final audit profile remediation

on:
  push:
    branches:
      - audit/arg-001-final-chapter-audit
    paths:
      - .github/workflows/arg-001-final-audit-profile-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/arg-001-final-chapter-audit
          fetch-depth: 0
      - name: Add explicit state and railway aliases plus capability discovery
        run: |
          python - <<'PY'
          from pathlib import Path

          cp = Path('artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-perceived-diversity-expansion.ts')
          text = cp.read_text(encoding='utf-8')
          sets = '''const TWO_ARGUMENT_PROFILES = new Set(["SSC_RECENT_2X4", "BANKING_CLASSIC_2X5"]);
          const COMBO_PROFILES = new Set(["BANKING_COMBO_3X5", "BANKING_COMBO_4X5"]);
          '''
          catalog = '''const TWO_ARGUMENT_PROFILES = new Set(["SSC_RECENT_2X4", "BANKING_CLASSIC_2X5"]);
          const COMBO_PROFILES = new Set(["BANKING_COMBO_3X5", "BANKING_COMBO_4X5"]);

          export const ARG_CP015_REAL_PAPER_PROFILES = Object.freeze([
            Object.freeze({
              id: "SSC_RECENT_2X4" as const,
              label: "SSC / RRB / state-style two-argument four-option",
              argumentCount: 2 as const,
              optionCount: 4 as const,
              supportedDifficulties: Object.freeze(["Easy", "Medium"] as const),
              aliases: Object.freeze(["RRB_2X4", "RAILWAY_2X4", "PUNJAB_STATE_2X4", "STATE_2X4"] as const),
            }),
            Object.freeze({
              id: "BANKING_CLASSIC_2X5" as const,
              label: "Classic banking two-argument five-option",
              argumentCount: 2 as const,
              optionCount: 5 as const,
              supportedDifficulties: Object.freeze(["Medium", "Hard"] as const),
              aliases: Object.freeze([] as readonly string[]),
            }),
            Object.freeze({
              id: "BANKING_COMBO_3X5" as const,
              label: "Banking three-argument combination",
              argumentCount: 3 as const,
              optionCount: 5 as const,
              supportedDifficulties: Object.freeze(["Medium", "Hard"] as const),
              aliases: Object.freeze([] as readonly string[]),
            }),
            Object.freeze({
              id: "BANKING_COMBO_4X5" as const,
              label: "Banking four-argument combination",
              argumentCount: 4 as const,
              optionCount: 5 as const,
              supportedDifficulties: Object.freeze(["Hard"] as const),
              aliases: Object.freeze([] as readonly string[]),
            }),
          ] as const);

          const ARG_CP015_PROFILE_ALIASES: Readonly<Record<string, string>> = Object.freeze({
            RRB_2X4: "SSC_RECENT_2X4",
            RAILWAY_2X4: "SSC_RECENT_2X4",
            PUNJAB_STATE_2X4: "SSC_RECENT_2X4",
            STATE_2X4: "SSC_RECENT_2X4",
          });
          '''
          if 'ARG_CP015_REAL_PAPER_PROFILES' not in text:
              if text.count(sets) != 1:
                  raise SystemExit('profile-set anchor drifted')
              text = text.replace(sets, catalog, 1)

          old_profile = '''function profileOf(input: ArgCp015QuestionStudioInput): string {
            return text(input.examProfile ?? input.paperProfile ?? input.deliveryProfile).toUpperCase();
          }'''
          new_profile = '''export function normalizeArgCp015Profile(value: unknown): string {
            const normalized = text(value).toUpperCase();
            return ARG_CP015_PROFILE_ALIASES[normalized] ?? normalized;
          }

          function profileOf(input: ArgCp015QuestionStudioInput): string {
            return normalizeArgCp015Profile(input.examProfile ?? input.paperProfile ?? input.deliveryProfile);
          }'''
          if 'export function normalizeArgCp015Profile' not in text:
              if text.count(old_profile) != 1:
                  raise SystemExit('profileOf anchor drifted')
              text = text.replace(old_profile, new_profile, 1)

          old_source = '''function sourceInput(input: ArgCp015QuestionStudioInput): ArgCp014QuestionStudioInput {
            return text(input.cpId).toUpperCase() === ARG_CP015_CHECKPOINT_ID
              ? { ...input, cpId: undefined }
              : input;
          }'''
          new_source = '''function sourceInput(input: ArgCp015QuestionStudioInput): ArgCp014QuestionStudioInput {
            const normalized: ArgCp014QuestionStudioInput = {
              ...input,
              ...(text(input.examProfile) ? { examProfile: normalizeArgCp015Profile(input.examProfile) } : {}),
              ...(text(input.paperProfile) ? { paperProfile: normalizeArgCp015Profile(input.paperProfile) } : {}),
              ...(text(input.deliveryProfile) ? { deliveryProfile: normalizeArgCp015Profile(input.deliveryProfile) } : {}),
            };
            return text(input.cpId).toUpperCase() === ARG_CP015_CHECKPOINT_ID
              ? { ...normalized, cpId: undefined }
              : normalized;
          }'''
          if new_source not in text:
              if text.count(old_source) != 1:
                  raise SystemExit('sourceInput anchor drifted')
              text = text.replace(old_source, new_source, 1)
          cp.write_text(text, encoding='utf-8')

          route = Path('artifacts/api-server/src/routes/admin-question-studio-arguments-cp015.ts')
          r = route.read_text(encoding='utf-8')
          import_anchor = '''  ARG_CP015_LEARNER_RELEASE,
            ARG_CP015_QUESTION_STUDIO_AUTHORITY,'''
          import_new = '''  ARG_CP015_LEARNER_RELEASE,
            ARG_CP015_REAL_PAPER_PROFILES,
            ARG_CP015_QUESTION_STUDIO_AUTHORITY,'''
          if 'ARG_CP015_REAL_PAPER_PROFILES,' not in r:
              if r.count(import_anchor) != 1:
                  raise SystemExit('route import anchor drifted')
              r = r.replace(import_anchor, import_new, 1)
          cap_anchor = '''      languages: ["en", "hi", "pa"],
                maxBatchSize: 50,'''
          cap_new = '''      languages: ["en", "hi", "pa"],
                realPaperProfiles: ARG_CP015_REAL_PAPER_PROFILES,
                maxBatchSize: 50,'''
          if 'realPaperProfiles: ARG_CP015_REAL_PAPER_PROFILES' not in r:
              if r.count(cap_anchor) != 1:
                  raise SystemExit('capabilities anchor drifted')
              r = r.replace(cap_anchor, cap_new, 1)
          route.write_text(r, encoding='utf-8')

          proof = Path('artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-question-studio-registration-proof.test.ts')
          p = proof.read_text(encoding='utf-8')
          cap_guard_anchor = '''  assertContains(route, "ARG_CP015_LEARNER_RELEASE", "CP015 route lost learner-release boundary propagation.");
          '''
          cap_guard = '''  assertContains(route, "ARG_CP015_LEARNER_RELEASE", "CP015 route lost learner-release boundary propagation.");
            assertContains(route, "ARG_CP015_REAL_PAPER_PROFILES", "CP015 capabilities lost real-paper profile discovery.");
            assertContains(route, "realPaperProfiles: ARG_CP015_REAL_PAPER_PROFILES", "CP015 capabilities no longer expose real-paper profiles.");
          '''
          if 'capabilities no longer expose real-paper profiles' not in p:
              if p.count(cap_guard_anchor) != 1:
                  raise SystemExit('registration proof anchor drifted')
              p = p.replace(cap_guard_anchor, cap_guard, 1)
          proof.write_text(p, encoding='utf-8')
          PY
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-perceived-diversity-expansion.ts artifacts/api-server/src/routes/admin-question-studio-arguments-cp015.ts artifacts/api-server/src/reasoning-v1/topics/Statement-and-Arguments/ARG-001/cp015-question-studio-registration-proof.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(arg-001): expose state and railway real-paper routing"
          git push origin HEAD:audit/arg-001-final-chapter-audit
