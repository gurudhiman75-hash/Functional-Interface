name: SCI CP011 Localization V1

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/knowledge-v1/science/matter-properties/**"
      - ".github/workflows/sci-cp011-localization-v1.yml"
  workflow_dispatch:

jobs:
  sci-cp011-localization-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle CP011 localization qualification
        working-directory: artifacts/api-server
        run: >-
          pnpm exec esbuild
          src/knowledge-v1/science/matter-properties/sci-cp011-localization-v1.test.ts
          --bundle
          --platform=node
          --format=esm
          --outfile=dist/sci-cp011-localization-v1.test.mjs

      - name: Run CP011 localization qualification
        working-directory: artifacts/api-server
        run: node dist/sci-cp011-localization-v1.test.mjs
