name: Reasoning BLR-001 CP-007 Read-Only Activation

on:
  push:
    branches:
      - activate/blr-001-cp007-question-studio-read-only
    paths:
      - "artifacts/api-server/src/reasoning-v1/**"
      - "artifacts/api-server/src/question-studio-review-registry.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-reasoning-review.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - "artifacts/admin-app/src/features/question-studio/reasoning-review-api.ts"
      - "artifacts/admin-app/src/pages/content/QuestionStudioReasoningReviewPanel.tsx"
      - "artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx"
      - ".github/workflows/reasoning-blr-001-cp007-read-only-activation.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/**"
      - "artifacts/api-server/src/question-studio-review-registry.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-reasoning-review.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - "artifacts/admin-app/src/features/question-studio/reasoning-review-api.ts"
      - "artifacts/admin-app/src/pages/content/QuestionStudioReasoningReviewPanel.tsx"
      - "artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx"
      - ".github/workflows/reasoning-blr-001-cp007-read-only-activation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blr-001-cp007-read-only-activation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-read-only-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Reprove frozen English authority
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-english-frozen.test.ts | tee english-freeze.log

      - name: Reprove multilingual freeze
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-multilingual-frozen.test.ts | tee multilingual-freeze.log

      - name: Reprove review adapter
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/question-studio-review-adapter.test.ts | tee review-adapter.log

      - name: Prove admin read-only activation
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/question-studio-read-only-activation.test.ts | tee read-only-activation.log

      - name: Typecheck admin Question Studio surface
        run: pnpm --dir artifacts/admin-app typecheck

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Export activation review pack
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/export-question-studio-read-only-activation-review.ts blr-cp007-read-only-activation-output | tee activation-export.log

      - name: Verify activation evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT=blr-cp007-read-only-activation-output
          SUMMARY="$OUT/blr-cp007-read-only-activation-summary.json"
          test -f "$SUMMARY"
          test -f "$OUT/BLR-CP-007-QUESTION-STUDIO-READ-ONLY-ACTIVATION.md"
          test -f "$OUT/blr-cp007-question-studio-read-only-activation.html"
          test -f "$OUT/blr-cp007-read-only-preview-samples.json"
          grep -q '"verdict": "BLR_CP007_ADMIN_READ_ONLY_ACTIVATION_PROVED"' "$SUMMARY"
          grep -q '"adminPanelVisible": true' "$SUMMARY"
          grep -q '"liveApiRouteMounted": true' "$SUMMARY"
          grep -q '"previewableRecordCount": 504' "$SUMMARY"
          grep -q '"enabledGenerationPackageCount": 0' "$SUMMARY"
          grep -q '"databaseWriteEnabled": false' "$SUMMARY"
          grep -q '"persistenceAllowed": false' "$SUMMARY"
          grep -q '"questionBankEligible": false' "$SUMMARY"
          grep -q '"mockTestEligible": false' "$SUMMARY"
          grep -q '"publiclyPublishable": false' "$SUMMARY"
          grep -q '"studentDeliveryEnabled": false' "$SUMMARY"

      - name: Upload activation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp007-read-only-activation-logs
          path: |
            english-freeze.log
            multilingual-freeze.log
            review-adapter.log
            read-only-activation.log
            activation-export.log
          retention-days: 14

      - name: Upload read-only activation review pack
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp007-read-only-activation
          path: blr-cp007-read-only-activation-output
          retention-days: 30
