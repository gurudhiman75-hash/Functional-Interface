name: MEN-001 Trap Instead Parser

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-001-trap-instead-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Parse instead-of distractor actions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-common-traps.ts")
          text = path.read_text()

          replacements = {
              '    case "cost": return `calculating the cost of ${withArticle(afterText)} instead of the required region or boundary`;': '''    case "cost": return instead
                ? `calculating the cost of ${withArticle(instead[0])} instead of ${withArticle(instead[1])}`
                : `calculating the cost of ${withArticle(afterText)} instead of the required region or boundary`;''',
              '    case "count": return `counting ${withArticle(afterText)} instead of the complete requirement`;': '''    case "count": return instead
                ? `counting ${withArticle(instead[0])} instead of ${withArticle(instead[1])}`
                : `counting ${withArticle(afterText)} instead of the complete requirement`;''',
              '    case "tile": return `covering ${withArticle(afterText)} instead of the required region`;': '''    case "tile": return instead
                ? `covering ${withArticle(instead[0])} instead of ${withArticle(instead[1])}`
                : `covering ${withArticle(afterText)} instead of the required region`;''',
              '    case "paint": return `painting ${withArticle(afterText)} instead of the exposed region`;': '''    case "paint": return instead
                ? `painting ${withArticle(instead[0])} instead of ${withArticle(instead[1])}`
                : `painting ${withArticle(afterText)} instead of the exposed region`;''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected action line not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-common-traps.ts
          git commit -m "fix(mensuration): parse instead-of trap actions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
