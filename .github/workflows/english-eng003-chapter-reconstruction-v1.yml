name: Validate ENG-003 Chapter Reconstruction

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/english-v1/tests/eng-003-chapter-reconstruction-v1.test.ts
      - artifacts/api-server/src/english-v1/chapters/grammar-fillers/**
      - artifacts/api-server/src/question-studio/engines/*eng003*
      - .github/workflows/english-eng003-chapter-reconstruction-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-eng003-chapter-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir artifacts/api-server exec esbuild src/english-v1/tests/eng-003-chapter-reconstruction-v1.test.ts --bundle --platform=node --format=esm --outfile=dist/english-v1/eng-003-chapter-reconstruction-v1.test.mjs
      - run: node artifacts/api-server/dist/english-v1/eng-003-chapter-reconstruction-v1.test.mjs
