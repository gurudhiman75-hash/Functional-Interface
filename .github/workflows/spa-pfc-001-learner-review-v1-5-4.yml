name: Validate SPA PFC-001 Learner Review V1.5.4

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pfc-learner-review-v1-5-4:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle learner-review V1.5.4 gate
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-paper-folding-source-saturated-english-review-v1-5-4.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-paper-folding-source-saturated-english-review-v1-5-4.test.mjs

      - name: Validate visible choice separation
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-source-saturated-english-review-v1-5-4.test.mjs

      - name: Upload learner-review V1.5.4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-pfc-tpf-source-saturated-english-review-v1-5-4
          path: |
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-source-saturated-english-review-v1-5-4-evidence.json
            artifacts/api-server/dist/reasoning-v1/spatial/spa-pfc-tpf-source-saturated-english-review-v1-5-4.html
          if-no-files-found: error
