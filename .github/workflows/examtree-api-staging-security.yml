name: Verify Examtree Cloud Run Staging Security Smoke

on:
  pull_request:
    branches: [New-main]
    paths:
      - scripts/verify-examtree-cloudrun-staging-security.sh
      - tests/examtree-cloudrun-staging-security.test.sh
      - scripts/verify-examtree-cloudrun-authenticated.sh
      - tests/examtree-cloudrun-authenticated.test.sh
      - scripts/verify-examtree-cloudrun-paid-test-expiry.sh
      - scripts/verify-examtree-cloudrun-attempt-persistence.sh
      - scripts/verify-examtree-cloudrun-scored-attempt.sh
      - tests/examtree-cloudrun-paid-test-expiry.test.sh
      - tests/examtree-cloudrun-attempt-persistence.test.sh
      - tests/examtree-cloudrun-scored-attempt.test.sh
      - scripts/verify-examtree-cashfree-cloudrun-webhook-replay.py
      - tests/examtree-cashfree-webhook-replay.test.py
      - scripts/close-examtree-cashfree-staging-expired-orders.py
      - tests/examtree-cashfree-expired-order-closure.test.py
      - scripts/inspect-examtree-migration-operations.py
      - tests/examtree-migration-operations-readonly.test.py
      - scripts/verify-examtree-cloudrun-num001-review.py
      - tests/examtree-cloudrun-num001-review.test.py
  push:
    branches: [New-main]
    paths:
      - scripts/verify-examtree-cloudrun-staging-security.sh
      - tests/examtree-cloudrun-staging-security.test.sh
      - scripts/verify-examtree-cloudrun-authenticated.sh
      - tests/examtree-cloudrun-authenticated.test.sh
      - scripts/verify-examtree-cloudrun-paid-test-expiry.sh
      - tests/examtree-cloudrun-paid-test-expiry.test.sh

permissions:
  contents: read

concurrency:
  group: examtree-api-staging-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm non-mutating staging diagnostics
        run: bash tests/examtree-cloudrun-staging-security.test.sh
      - name: Guard hidden Firebase ID-token read checks
        run: bash tests/examtree-cloudrun-authenticated.test.sh
      - name: Guard paid-test entitlement expiry negative check
        run: bash tests/examtree-cloudrun-paid-test-expiry.test.sh
      - name: Guard disposable positive attempt test (static only)
        run: bash tests/examtree-cloudrun-attempt-persistence.test.sh
      - name: Guard scored attempt smoke test (static only)
        run: bash tests/examtree-cloudrun-scored-attempt.test.sh
      - name: Check fixed-order sandbox signed webhook replay safeguards
        run: python3 tests/examtree-cashfree-webhook-replay.test.py
      - name: Check provider-verified expired-order closure safeguards
        run: python3 tests/examtree-cashfree-expired-order-closure.test.py
      - name: Verify read-only cutover operational inspectors
        run: python3 tests/examtree-migration-operations-readonly.test.py
      - name: Guard authenticated NUM-001 staging review-only smoke
        run: python3 tests/examtree-cloudrun-num001-review.test.py
