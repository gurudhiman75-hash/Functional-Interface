name: Verify Examtree Cloud Run Staging Security Smoke

on:
  pull_request:
    branches: [New-main]
    paths:
      - scripts/verify-examtree-cloudrun-staging-security.sh
      - tests/examtree-cloudrun-staging-security.test.sh
      - scripts/verify-examtree-cloudrun-authenticated.sh
      - tests/examtree-cloudrun-authenticated.test.sh
      - scripts/verify-examtree-cloudrun-paid-test-expiry.sh
      - tests/examtree-cloudrun-paid-test-expiry.test.sh
  push:
    branches: [New-main]
    paths:
      - scripts/verify-examtree-cloudrun-staging-security.sh
      - tests/examtree-cloudrun-staging-security.test.sh
      - scripts/verify-examtree-cloudrun-authenticated.sh
      - tests/examtree-cloudrun-authenticated.test.sh
      - scripts/verify-examtree-cloudrun-paid-test-expiry.sh
      - tests/examtree-cloudrun-paid-test-expiry.test.sh

permissions:
  contents: read

concurrency:
  group: examtree-api-staging-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm non-mutating staging diagnostics
        run: bash tests/examtree-cloudrun-staging-security.test.sh
      - name: Guard hidden Firebase ID-token read checks
        run: bash tests/examtree-cloudrun-authenticated.test.sh
      - name: Guard paid-test entitlement expiry negative check
        run: bash tests/examtree-cloudrun-paid-test-expiry.test.sh
