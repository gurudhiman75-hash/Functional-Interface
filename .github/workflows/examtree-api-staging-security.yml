name: Verify Examtree Cloud Run Staging Security Smoke

on:
  pull_request:
    branches: [New-main]
    paths:
      - scripts/verify-examtree-cloudrun-staging-security.sh
      - tests/examtree-cloudrun-staging-security.test.sh
      - scripts/verify-examtree-cloudrun-authenticated.sh
      - tests/examtree-cloudrun-authenticated.test.sh
      - scripts/verify-examtree-cloudrun-paid-test-expiry.sh
      - scripts/verify-examtree-cloudrun-attempt-persistence.sh
      - scripts/verify-examtree-cloudrun-scored-attempt.sh
      - tests/examtree-cloudrun-paid-test-expiry.test.sh
      - tests/examtree-cloudrun-attempt-persistence.test.sh
      - tests/examtree-cloudrun-scored-attempt.test.sh
      - scripts/verify-examtree-cashfree-cloudrun-webhook-replay.py
      - tests/examtree-cashfree-webhook-replay.test.py
      - scripts/close-examtree-cashfree-staging-expired-orders.py
      - tests/examtree-cashfree-expired-order-closure.test.py
      - scripts/validate-examtree-staging-neon-url.py
      - tests/examtree-staging-neon-url.test.py
      - scripts/isolate-examtree-cloudrun-staging-neon.sh
      - scripts/deploy-examtree-api-cloudrun-staging.sh
      - scripts/refresh-examtree-cloudrun-staging-sandbox.sh
      - tests/examtree-staging-sandbox-refresh.test.py
      - tests/examtree-staging-db-isolation.test.mjs
      - artifacts/api-server/src/cloud-run-background.ts
      - artifacts/api-server/src/lib/outbox-publisher.ts
      - artifacts/api-server/src/lib/mobile-notification-delivery.ts
      - tests/examtree-cloudrun-background-handover.test.mjs
      - scripts/enable-examtree-api-background-scheduler.sh
      - scripts/inspect-examtree-cloudrun-production-handover.py
      - tests/examtree-production-handover.test.py
      - scripts/deploy-examtree-api-cloudrun-production-candidate.sh
      - scripts/validate-examtree-production-neon-url.py
      - tests/examtree-production-candidate-safety.test.py
      - artifacts/api-server/src/app.ts
      - artifacts/api-server/src/routes/canonical-commerce-checkout.ts
      - artifacts/examtree/src/pages/store-product.tsx
      - artifacts/examtree/src/lib/commerce.ts
      - tests/examtree-sales-cutover-guard.test.py
      - scripts/inspect-examtree-migration-operations.py
      - tests/examtree-migration-operations-readonly.test.py
      - scripts/verify-examtree-cloudrun-num001-review.py
      - tests/examtree-cloudrun-num001-review.test.py
      - scripts/verify-examtree-question-studio-review-reads.py
      - tests/examtree-question-studio-review-reads.test.py
  push:
    branches: [New-main]
    paths:
      - scripts/verify-examtree-cloudrun-staging-security.sh
      - tests/examtree-cloudrun-staging-security.test.sh
      - scripts/verify-examtree-cloudrun-authenticated.sh
      - tests/examtree-cloudrun-authenticated.test.sh
      - scripts/verify-examtree-cloudrun-paid-test-expiry.sh
      - tests/examtree-cloudrun-paid-test-expiry.test.sh

permissions:
  contents: read

concurrency:
  group: examtree-api-staging-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate guarded staging database isolation
        run: |
          bash -n scripts/isolate-examtree-cloudrun-staging-neon.sh
          bash -n scripts/deploy-examtree-api-cloudrun-staging.sh
          node --test tests/examtree-staging-db-isolation.test.mjs tests/cloudrun-api-migration.test.mjs
          python3 tests/examtree-staging-neon-url.test.py
      - name: Guard Cashfree SANDBOX staging-only image refresh
        run: |
          bash -n scripts/refresh-examtree-cloudrun-staging-sandbox.sh
          python3 tests/examtree-staging-sandbox-refresh.test.py
      - name: Verify purchases-paused cutover API and UI
        run: python3 tests/examtree-sales-cutover-guard.test.py
      - name: Guard private production candidate setup
        run: |
          bash -n scripts/deploy-examtree-api-cloudrun-production-candidate.sh
          python3 tests/examtree-production-candidate-safety.test.py
      - name: Verify Cloud Run production worker handover safeguards
        run: |
          bash -n scripts/enable-examtree-api-background-scheduler.sh
          node --test tests/examtree-cloudrun-background-handover.test.mjs
          python3 tests/examtree-production-handover.test.py
      - name: Confirm non-mutating staging diagnostics
        run: bash tests/examtree-cloudrun-staging-security.test.sh
      - name: Guard hidden Firebase ID-token read checks
        run: bash tests/examtree-cloudrun-authenticated.test.sh
      - name: Guard paid-test entitlement expiry negative check
        run: bash tests/examtree-cloudrun-paid-test-expiry.test.sh
      - name: Guard disposable positive attempt test (static only)
        run: bash tests/examtree-cloudrun-attempt-persistence.test.sh
      - name: Guard scored attempt smoke test (static only)
        run: bash tests/examtree-cloudrun-scored-attempt.test.sh
      - name: Check fixed-order sandbox signed webhook replay safeguards
        run: python3 tests/examtree-cashfree-webhook-replay.test.py
      - name: Check provider-verified expired-order closure safeguards
        run: python3 tests/examtree-cashfree-expired-order-closure.test.py
      - name: Verify read-only cutover operational inspectors
        run: python3 tests/examtree-migration-operations-readonly.test.py
      - name: Guard authenticated NUM-001 staging review-only smoke
        run: python3 tests/examtree-cloudrun-num001-review.test.py
      - name: Guard authenticated admin review-page GET verification
        run: python3 tests/examtree-question-studio-review-reads.test.py
