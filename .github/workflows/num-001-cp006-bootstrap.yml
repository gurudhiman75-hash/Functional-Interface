name: Materialize NUM-CP-006 completion source

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/num-001-cp006-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-num-cp006-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Materialize tested CP-006 source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .github/num-cp006-bootstrap/payload-*.b64 \
            | tr -cd 'A-Za-z0-9+/=' \
            > /tmp/num-cp006-completion.b64
          base64 --decode /tmp/num-cp006-completion.b64 > /tmp/num-cp006-completion.tar.gz
          echo "4f8573a3b5b3b65524636ee08691149e9fd879f54fb4aaf2cd8bc89eae5b14fc  /tmp/num-cp006-completion.tar.gz" | sha256sum --check
          tar -xzf /tmp/num-cp006-completion.tar.gz -C .
          rm -rf .github/num-cp006-bootstrap
          rm -f .github/workflows/num-001-cp006-completion-freeze.yml

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "NUM-CP-006 source is already materialized."
            exit 0
          fi
          git commit -m "feat(num-cp006): materialize complete multilingual authority"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
