name: Bootstrap PNL Canonical Production Release V2

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/pnl-canonical-production-release-bootstrap-v2.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pnl-001-canonical-production-release
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply canonical production release overlay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path("artifacts/api-server/src")
          PNL = ROOT / "quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001"

          def replace_once_text(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one replacement, found {count}")
              return text.replace(old, new, 1)

          def regex_once(text: str, pattern: str, replacement: str, label: str) -> str:
              result, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{label}: expected one regex replacement, found {count}")
              return result

          runtime = PNL / "question-studio-review-runtime.ts"
          runtime_text = runtime.read_text()
          marker = '''export type Pnl001ReviewSafety = Readonly<{
            reviewStatus: "APPROVED_EDITORIAL_CANONICAL";
            questionBankStatus: "NOT_STORED";
            testEligibility: "INELIGIBLE";
            publiclyPublishable: false;
            runtimeMode: "CANONICAL_REVIEW";
          }>;
          '''
          release_policy = marker + '''
          export type Pnl001CanonicalReleasePolicy = Readonly<{
            reviewStatus: "APPROVED_EDITORIAL_CANONICAL";
            questionBankStatus: "WRITABLE";
            testEligibility: "ELIGIBLE";
            publiclyPublishable: true;
            runtimeMode: "CANONICAL_REVIEW";
          }>;

          export const PNL_001_CANONICAL_RELEASE_POLICY = {
            reviewStatus: "APPROVED_EDITORIAL_CANONICAL",
            questionBankStatus: "WRITABLE",
            testEligibility: "ELIGIBLE",
            publiclyPublishable: true,
            runtimeMode: "CANONICAL_REVIEW",
          } as const satisfies Pnl001CanonicalReleasePolicy;
          '''
          runtime_text = replace_once_text(
              runtime_text,
              marker,
              release_policy,
              "canonical release policy insertion",
          )
          runtime_text = regex_once(
              runtime_text,
              r'''    \{\n      name: "question-bank-safety",\n      passed:\n        entry\.safety\.questionBankStatus === "NOT_STORED" &&\n        entry\.safety\.testEligibility === "INELIGIBLE" &&\n        entry\.safety\.publiclyPublishable === false,\n      message: "Canonical review output is not eligible for Question Bank, tests or publication\.",\n    \},\n''',
              '''    {
              name: "canonical-source-freeze",
              passed:
                entry.safety.questionBankStatus === "NOT_STORED" &&
                entry.safety.testEligibility === "INELIGIBLE" &&
                entry.safety.publiclyPublishable === false,
              message: "The frozen source library remains an immutable review authority.",
            },
            {
              name: "canonical-production-release-policy",
              passed:
                PNL_001_CANONICAL_RELEASE_POLICY.questionBankStatus === "WRITABLE" &&
                PNL_001_CANONICAL_RELEASE_POLICY.testEligibility === "ELIGIBLE" &&
                PNL_001_CANONICAL_RELEASE_POLICY.publiclyPublishable === true,
              message: "Approved canonical output is eligible for Question Bank, tests and publication.",
            },
          ''',
              "canonical validation overlay",
          )
          replacements = {
              "runtimeMode: entry.safety.runtimeMode,":
                  "runtimeMode: PNL_001_CANONICAL_RELEASE_POLICY.runtimeMode,",
              "reviewStatus: entry.safety.reviewStatus,":
                  "reviewStatus: PNL_001_CANONICAL_RELEASE_POLICY.reviewStatus,",
              "questionBankStatus: entry.safety.questionBankStatus,":
                  "questionBankStatus: PNL_001_CANONICAL_RELEASE_POLICY.questionBankStatus,",
              "testEligibility: entry.safety.testEligibility,":
                  "testEligibility: PNL_001_CANONICAL_RELEASE_POLICY.testEligibility,",
              "publiclyPublishable: entry.safety.publiclyPublishable,":
                  "publiclyPublishable: PNL_001_CANONICAL_RELEASE_POLICY.publiclyPublishable,",
              "value: entry.safety.runtimeMode":
                  "value: PNL_001_CANONICAL_RELEASE_POLICY.runtimeMode",
          }
          for old, new in replacements.items():
              if old not in runtime_text:
                  raise SystemExit(f"runtime release field not found: {old}")
              runtime_text = runtime_text.replace(old, new)
          runtime.write_text(runtime_text)

          engine = ROOT / "quant-v4/generation-engine.ts"
          engine_text = engine.read_text()
          engine_text = replace_once_text(
              engine_text,
              '''    runtimeMode: "CANONICAL_REVIEW",
            supportedRuntimeModes: ["CANONICAL_REVIEW", "DYNAMIC_CANDIDATE"],
            dynamicCandidateCpIds: [...PNL_DYNAMIC_CP_IDS],
            questionBankStatus: "NOT_STORED",
            testEligibility: "INELIGIBLE",
            publiclyPublishable: false,
          ''',
              '''    runtimeMode: "CANONICAL_REVIEW",
            supportedRuntimeModes: ["CANONICAL_REVIEW", "DYNAMIC_CANDIDATE"],
            dynamicCandidateCpIds: [...PNL_DYNAMIC_CP_IDS],
            reviewStatus: "APPROVED_EDITORIAL_CANONICAL",
            questionBankStatus: "WRITABLE",
            testEligibility: "ELIGIBLE",
            publiclyPublishable: true,
            runtimePolicies: {
              CANONICAL_REVIEW: {
                reviewStatus: "APPROVED_EDITORIAL_CANONICAL",
                questionBankStatus: "WRITABLE",
                testEligibility: "ELIGIBLE",
                publiclyPublishable: true,
              },
              DYNAMIC_CANDIDATE: {
                reviewStatus: "UNREVIEWED_DYNAMIC_CANDIDATE",
                questionBankStatus: "NOT_STORED",
                testEligibility: "INELIGIBLE",
                publiclyPublishable: false,
              },
            },
          ''',
              "PNL package release card",
          )
          engine_text = replace_once_text(
              engine_text,
              '''          questionBankStatus: "NOT_STORED",
                    testEligibility: "INELIGIBLE",
                    publiclyPublishable: false,
          ''',
              '''          questionBankStatus:
                    pnlRuntimeMode === "DYNAMIC_CANDIDATE" ? "NOT_STORED" : "WRITABLE",
                  testEligibility:
                    pnlRuntimeMode === "DYNAMIC_CANDIDATE" ? "INELIGIBLE" : "ELIGIBLE",
                  publiclyPublishable: pnlRuntimeMode !== "DYNAMIC_CANDIDATE",
          ''',
              "PNL mode-specific generation context",
          )
          engine.write_text(engine_text)

          conversion = ROOT / "lib/admin-question-conversion.ts"
          conversion_text = conversion.read_text()
          conversion_text = replace_once_text(
              conversion_text,
              '''  const runtimeMode = asText(payload.runtimeMode || generationContext.runtimeMode).toUpperCase();
            const questionBankStatus = asText(
          ''',
              '''  const runtimeMode = asText(payload.runtimeMode || generationContext.runtimeMode).toUpperCase();
            const reviewStatus = asText(payload.reviewStatus || generationContext.reviewStatus).toUpperCase();
            const questionBankStatus = asText(
          ''',
              "conversion review-status read",
          )
          conversion_text = replace_once_text(
              conversion_text,
              '''  if (runtimeMode === "CANONICAL_REVIEW" || runtimeMode === "DYNAMIC_CANDIDATE") {
              return `runtimeMode ${runtimeMode} is review-only`;
            }
            return null;
          ''',
              '''  if (runtimeMode === "DYNAMIC_CANDIDATE") {
              return `runtimeMode ${runtimeMode} is review-only`;
            }
            if (
              runtimeMode === "CANONICAL_REVIEW" &&
              reviewStatus !== "APPROVED_EDITORIAL_CANONICAL"
            ) {
              return `reviewStatus ${reviewStatus || "MISSING"} is not release-approved`;
            }
            return null;
          ''',
              "conversion runtime gate",
          )
          conversion.write_text(conversion_text)

          runtime_test = PNL / "question-studio-review-runtime.test.ts"
          runtime_test_text = runtime_test.read_text()
          runtime_test_text = runtime_test_text.replace(
              'assert.equal(pkg.traceability.questionBankStatus, "NOT_STORED");',
              'assert.equal(pkg.traceability.questionBankStatus, "WRITABLE");',
          )
          runtime_test_text = runtime_test_text.replace(
              'assert.equal(pkg.traceability.testEligibility, "INELIGIBLE");',
              'assert.equal(pkg.traceability.testEligibility, "ELIGIBLE");',
          )
          runtime_test_text = runtime_test_text.replace(
              'assert.equal(pkg.traceability.publiclyPublishable, false);',
              'assert.equal(pkg.traceability.publiclyPublishable, true);',
          )
          runtime_test_text = runtime_test_text.replace(
              'questionBankStatus: "NOT_STORED",\n      testEligibility: "INELIGIBLE",\n      publiclyPublishable: false,',
              'questionBankStatus: "WRITABLE",\n      testEligibility: "ELIGIBLE",\n      publiclyPublishable: true,',
          )
          runtime_test.write_text(runtime_test_text)

          integration_test = PNL / "question-studio-integration.test.ts"
          integration_text = integration_test.read_text()
          integration_text = replace_once_text(
              integration_text,
              '''assert.equal((pnl as any).questionBankStatus, "NOT_STORED");
          assert.equal((pnl as any).testEligibility, "INELIGIBLE");
          assert.equal((pnl as any).publiclyPublishable, false);
          ''',
              '''assert.equal((pnl as any).questionBankStatus, "WRITABLE");
          assert.equal((pnl as any).testEligibility, "ELIGIBLE");
          assert.equal((pnl as any).publiclyPublishable, true);
          assert.deepEqual((pnl as any).runtimePolicies, {
            CANONICAL_REVIEW: {
              reviewStatus: "APPROVED_EDITORIAL_CANONICAL",
              questionBankStatus: "WRITABLE",
              testEligibility: "ELIGIBLE",
              publiclyPublishable: true,
            },
            DYNAMIC_CANDIDATE: {
              reviewStatus: "UNREVIEWED_DYNAMIC_CANDIDATE",
              questionBankStatus: "NOT_STORED",
              testEligibility: "INELIGIBLE",
              publiclyPublishable: false,
            },
          });
          ''',
              "integration package release assertions",
          )
          canonical_start = integration_text.index('  const canonical = await generateQuestion({')
          dynamic_start = integration_text.index('  const dynamic = await generateQuestion({', canonical_start)
          canonical_block = integration_text[canonical_start:dynamic_start]
          canonical_block = canonical_block.replace('"NOT_STORED"', '"WRITABLE"')
          canonical_block = canonical_block.replace('"INELIGIBLE"', '"ELIGIBLE"')
          canonical_block = canonical_block.replace('publiclyPublishable, false', 'publiclyPublishable, true')
          integration_text = integration_text[:canonical_start] + canonical_block + integration_text[dynamic_start:]
          integration_text = replace_once_text(
              integration_text,
              '''  assertGeneratedQuestionBankEligible,
            getGeneratedQuestionBankEligibilityIssue,
          } = await import("../../../../../../lib/admin-question-conversion");
          const blocked = await generateQuestion({
          ''',
              '''  assertGeneratedQuestionBankEligible,
            getGeneratedQuestionBankEligibilityIssue,
            normalizeGeneratedQuestionPayload,
          } = await import("../../../../../../lib/admin-question-conversion");

          for (const language of LANGUAGES) {
            const released = await generateQuestion({
              packageId: "PNL-001",
              runtimeMode: "CANONICAL_REVIEW",
              language,
              canonicalProblemId: "PNL-CP-001",
              questionLanguageId: "PNL-QL-001",
              seed: `pnl-question-bank-release:${language}`,
            });
            const releasedPreview = released.questions[0]!;
            assert.equal(getGeneratedQuestionBankEligibilityIssue(releasedPreview), null);
            assert.doesNotThrow(() => assertGeneratedQuestionBankEligible(releasedPreview));
            const normalizedReleased = normalizeGeneratedQuestionPayload(releasedPreview, {
              itemId: "00000000-0000-0000-0000-000000000001",
              generationRunCode: `GEN-PNL-RELEASE-${language.toUpperCase()}`,
            });
            assert.equal(normalizedReleased.options.length, 4);
            assert.equal(
              normalizedReleased.options[normalizedReleased.correctIndex],
              releasedPreview.options[releasedPreview.correctIndex],
            );
          }

          const blocked = await generateQuestion({
          ''',
              "integration canonical conversion proof",
          )
          integration_text = replace_once_text(
              integration_text,
              '''assert.throws(
            () => assertGeneratedQuestionBankEligible(preview),
            /cannot be converted to Question Bank: questionBankStatus is NOT_STORED/,
          );
          ''',
              '''assert.throws(
            () => assertGeneratedQuestionBankEligible(preview),
            /cannot be converted to Question Bank: questionBankStatus is NOT_STORED/,
          );
          const tamperedDynamicPreview = {
            ...preview,
            questionBankStatus: "WRITABLE",
            testEligibility: "ELIGIBLE",
            publiclyPublishable: true,
          };
          assert.equal(
            getGeneratedQuestionBankEligibilityIssue(tamperedDynamicPreview),
            "runtimeMode DYNAMIC_CANDIDATE is review-only",
          );
          assert.throws(
            () => assertGeneratedQuestionBankEligible(tamperedDynamicPreview),
            /runtimeMode DYNAMIC_CANDIDATE is review-only/,
          );
          ''',
              "dynamic tamper-hardening proof",
          )
          integration_text = integration_text.replace(
              '''  questionBankStatus: "NOT_STORED",
            testEligibility: "INELIGIBLE",
            publiclyPublishable: false,
          ''',
              '''  canonicalQuestionBankStatus: "WRITABLE",
            canonicalTestEligibility: "ELIGIBLE",
            canonicalPubliclyPublishable: true,
            dynamicQuestionBankStatus: "NOT_STORED",
            dynamicTestEligibility: "INELIGIBLE",
            dynamicPubliclyPublishable: false,
          ''',
              1,
          )
          integration_test.write_text(integration_text)

          release_doc = PNL / "PNL-001-CANONICAL-PRODUCTION-RELEASE.md"
          release_doc.write_text('''# PNL-001 Canonical Production Release

          **Release scope:** approved canonical Question Studio output only.  
          **Languages:** English, Hindi and Punjabi.  
          **QL coverage:** 186 QLs across PNL-CP-001 through PNL-CP-006.

          ## Released policy

          ```text
          runtimeMode: CANONICAL_REVIEW
          reviewStatus: APPROVED_EDITORIAL_CANONICAL
          questionBankStatus: WRITABLE
          testEligibility: ELIGIBLE
          publiclyPublishable: true
          ```

          The historical `CANONICAL_REVIEW` runtime name remains for API compatibility. Its output is governed by the approved canonical release overlay and can be converted into Question Bank records after the normal administrator approval action.

          ## Dynamic safety boundary

          Dynamic candidates remain review-only:

          ```text
          runtimeMode: DYNAMIC_CANDIDATE
          reviewStatus: UNREVIEWED_DYNAMIC_CANDIDATE
          questionBankStatus: NOT_STORED
          testEligibility: INELIGIBLE
          publiclyPublishable: false
          ```

          The conversion gate rejects dynamic candidates by runtime mode even if positive storage, test and publication flags are supplied accidentally.

          ## Source-library integrity

          The compressed canonical review library is unchanged. Its original review-only safety metadata remains frozen as source provenance. Production eligibility is applied at runtime as a separate release policy so editorial content and release state remain independently auditable.
          ''')
          PY

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile

      - name: Prove canonical runtime release
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/question-studio-review-runtime.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.question-studio-review-runtime.release.test.mjs
          node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.question-studio-review-runtime.release.test.mjs

      - name: Prove Question Studio release and dynamic block
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/question-studio-integration.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.question-studio-integration.release.test.mjs
          DATABASE_URL=postgresql://test:test@127.0.0.1:5432/test \
            node artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/.question-studio-integration.release.test.mjs

      - name: Commit release implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/lib/admin-question-conversion.ts \
            artifacts/api-server/src/quant-v4/generation-engine.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/question-studio-review-runtime.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/question-studio-review-runtime.test.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/question-studio-integration.test.ts \
            artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/ProfitAndLoss/PNL-001/PNL-001-CANONICAL-PRODUCTION-RELEASE.md
          git commit -m "release(pnl): enable approved canonical production lifecycle"
          git push origin HEAD:feat/pnl-001-canonical-production-release
