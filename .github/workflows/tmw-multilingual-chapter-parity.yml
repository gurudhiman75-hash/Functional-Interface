name: Validate TMW-001 multilingual chapter parity

on:
  push:
    branches:
      - feat/tmw-001-hi-pa-localisation
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/**
      - .github/workflows/tmw-multilingual-chapter-parity.yml
      - package.json
      - pnpm-lock.yaml
  pull_request:
    branches:
      - design/tmw-001-blueprint
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/**
      - .github/workflows/tmw-multilingual-chapter-parity.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-tmw-multilingual-chapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-complete-multilingual-chapter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: >-
          pnpm exec tsc
          --noEmit
          --target es2022
          --module esnext
          --moduleResolution bundler
          --strictNullChecks
          --noImplicitAny
          --noImplicitReturns
          --noFallthroughCasesInSwitch
          --skipLibCheck
          --types node
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/chapter-editorial-remediation.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/chapter-editorial-remediation-wave02.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/chapter-presentation-sanitizer.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/chapter-explanation-naturalizer.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/foundation/chapter-localized-runtime.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-multilingual-chapter-parity.test.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-multilingual-stem-editorial.test.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-multilingual-stem-editorial-wave02.test.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-multilingual-fraction-presentation.test.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-multilingual-explanation-naturalness.test.ts
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-multilingual-chapter-review-export.ts
      - name: Bundle complete parity proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-multilingual-chapter-parity.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-multilingual-chapter-parity.test.mjs
      - name: Run complete parity proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/tmw-001-multilingual-chapter-parity.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/tmw-001-multilingual-chapter-parity-proof.log
      - name: Bundle multilingual stem editorial proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-multilingual-stem-editorial.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-multilingual-stem-editorial.test.mjs
      - name: Run multilingual stem editorial proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/tmw-001-multilingual-stem-editorial.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/tmw-001-multilingual-stem-editorial-proof.log
      - name: Bundle multilingual stem editorial Wave 02 proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-multilingual-stem-editorial-wave02.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-multilingual-stem-editorial-wave02.test.mjs
      - name: Run multilingual stem editorial Wave 02 proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/tmw-001-multilingual-stem-editorial-wave02.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/tmw-001-multilingual-stem-editorial-wave02-proof.log
      - name: Bundle multilingual fraction-presentation proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-multilingual-fraction-presentation.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-multilingual-fraction-presentation.test.mjs
      - name: Run multilingual fraction-presentation proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/tmw-001-multilingual-fraction-presentation.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/tmw-001-multilingual-fraction-presentation-proof.log
      - name: Bundle multilingual explanation-naturalness proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-multilingual-explanation-naturalness.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-multilingual-explanation-naturalness.test.mjs
      - name: Run multilingual explanation-naturalness proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/tmw-001-multilingual-explanation-naturalness.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/tmw-001-multilingual-explanation-naturalness-proof.log
      - name: Bundle complete review export
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/TimeAndWork/TMW-001/tmw-001-multilingual-chapter-review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/tmw-001-multilingual-chapter-review-export.mjs
      - name: Generate complete review corpus
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/tmw-001-multilingual-chapter-review-export.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/tmw-001-multilingual-chapter-review-export.log
      - name: Upload complete multilingual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmw-001-multilingual-chapter-parity
          path: |
            artifacts/api-server/dist/quant-v4/tmw-001-multilingual-chapter-parity-proof.log
            artifacts/api-server/dist/quant-v4/tmw-001-multilingual-stem-editorial-proof.log
            artifacts/api-server/dist/quant-v4/tmw-001-multilingual-stem-editorial-wave02-proof.log
            artifacts/api-server/dist/quant-v4/tmw-001-multilingual-fraction-presentation-proof.log
            artifacts/api-server/dist/quant-v4/tmw-001-multilingual-explanation-naturalness-proof.log
            artifacts/api-server/dist/quant-v4/tmw-001-multilingual-chapter-review-export.log
            artifacts/api-server/dist/quant-v4/tmw-001-multilingual-chapter-review.json
          if-no-files-found: error
          retention-days: 14
