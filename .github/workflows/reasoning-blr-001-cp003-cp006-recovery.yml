name: Reasoning BLR-001 CP-003 through CP-006 Recovery

on:
  push:
    branches:
      - recovery/blr-001-cp003-cp006-current-main
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-004/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-005/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-006/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/foundation/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-001-MANIFEST-AMENDMENT-CP004.md"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-001-MANIFEST-AMENDMENT-CP005.md"
      - ".github/workflows/reasoning-blr-001-cp003-cp006-recovery.yml"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/**"
      - ".github/workflows/reasoning-blr-001-cp003-cp006-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blr-001-cp003-cp006-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-recovered-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove CP-003 frozen runtime
        run: |
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-final-discovery-freeze.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/cp003-permanent-runtime.test.ts

      - name: Diagnose CP-004 historical zero-count coverage and prove freeze
        shell: bash
        run: |
          set -euo pipefail
          ROOT=artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-004
          set +e
          pnpm dlx tsx@4.20.6 "$ROOT/cp004-runtime.test.ts" > cp004-runtime-diagnostic.log 2>&1
          runtime_status=$?
          set -e
          cat cp004-runtime-diagnostic.log
          if [ "$runtime_status" -ne 0 ]; then
            grep -q 'telemetry.zeroAnswerCount > 0' cp004-runtime-diagnostic.log || exit "$runtime_status"
            echo 'KNOWN_RECOVERY_DIAGNOSTIC: CP-004 frozen bank has zeroAnswerCount=0; historical workflow masked this exact assertion through tee without pipefail.'
          fi
          pnpm dlx tsx@4.20.6 "$ROOT/cp004-final-freeze.test.ts"

      - name: Prove CP-005 frozen runtime
        run: |
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-005/cp005-runtime.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-005/cp005-editorial-remediation.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-005/cp005-final-freeze.test.ts

      - name: Prove CP-006 frozen runtime
        run: |
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-006/cp006-runtime.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-006/cp006-final-freeze.test.ts

      - name: Regress CP-007 production authority
        run: |
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-english-frozen.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-multilingual-frozen.test.ts
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/question-studio-production.test.ts

      - name: Typecheck admin application
        run: pnpm --dir artifacts/admin-app typecheck

      - name: Build API server
        run: pnpm --dir artifacts/api-server build
