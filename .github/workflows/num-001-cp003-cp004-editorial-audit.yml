name: Validate Number System generator V3.1 and Question Studio

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/**"
      - "artifacts/api-server/src/quant-v4/question-studio-generation-engine.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-average.ts"
      - ".github/workflows/num-001-cp003-cp004-editorial-audit.yml"
  workflow_dispatch:

jobs:
  validate-number-system-generator-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle generator audit, integration proof and review exporter
        run: |
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/editorial/english-editorial-audit.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=artifacts/api-server/dist/quant-v4/number-system-generator-v3-audit.mjs
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/editorial/number-system-question-studio-integration.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=artifacts/api-server/dist/quant-v4/number-system-question-studio-integration.mjs

      - name: Run generator contract audit
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/number-system-generator-v3-audit.mjs 2>&1 | tee dist/quant-v4/number-system-generator-v3-audit.log

      - name: Run Question Studio integration proof
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/number-system-question-studio-integration.mjs 2>&1 | tee dist/quant-v4/number-system-question-studio-integration.log

      - name: Upload V3.1 review evidence
        uses: actions/upload-artifact@v4
        with:
          name: number-system-generator-v3-1-question-studio-review
          path: |
            artifacts/api-server/dist/quant-v4/number-system-generator-v3-audit.log
            artifacts/api-server/dist/quant-v4/number-system-question-studio-integration.log
            artifacts/api-server/dist/quant-v4/number-system-generator-v3/number-system-generator-v3-review.json
            artifacts/api-server/dist/quant-v4/number-system-generator-v3/number-system-generator-v3-review.csv
            artifacts/api-server/dist/quant-v4/number-system-generator-v3/number-system-generator-v3-review.md
          if-no-files-found: error
          retention-days: 30
