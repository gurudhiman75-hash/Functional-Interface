name: Validate NUM-CP-003 and NUM-CP-004 English editorial hardening

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/**"
      - ".github/workflows/num-001-cp003-cp004-editorial-audit.yml"
  workflow_dispatch:

jobs:
  validate-number-system-editorial-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle combined editorial audit and review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/editorial/english-editorial-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp003-cp004-english-editorial-audit.mjs

      - name: Run combined English editorial audit
        working-directory: artifacts/api-server
        shell: bash
        run: |
          set -o pipefail
          node dist/quant-v4/num-001-cp003-cp004-english-editorial-audit.mjs 2>&1 | tee dist/quant-v4/num-001-cp003-cp004-english-editorial-audit.log

      - name: Upload editorial review evidence
        uses: actions/upload-artifact@v4
        with:
          name: num-001-cp003-cp004-english-editorial-review
          path: |
            artifacts/api-server/dist/quant-v4/num-001-cp003-cp004-english-editorial-audit.log
            artifacts/api-server/dist/quant-v4/num-001-cp003-cp004-editorial-review.json
            artifacts/api-server/dist/quant-v4/num-001-cp003-cp004-editorial-review.csv
            artifacts/api-server/dist/quant-v4/num-001-cp003-cp004-editorial-review.md
          if-no-files-found: error
          retention-days: 30
