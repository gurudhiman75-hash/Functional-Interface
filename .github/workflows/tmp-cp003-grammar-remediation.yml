name: Temporary CP-003 localization grammar remediation

on:
  push:
    branches:
      - feat/blr-001-cp003-multilingual
    paths:
      - ".github/workflows/tmp-cp003-grammar-remediation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/blr-001-cp003-multilingual
      - name: Expand controlled Hindi Punjabi grammar
        shell: python
        run: |
          from pathlib import Path
          p = Path("artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/localization/cp003-language-pack.ts")
          text = p.read_text()
          old = '  const p = namesInText(record, record.stem);\n  const id = record.sourcePrototypeId;'
          new = '''  const p = namesInText(record, record.stem);
          if (p.length === 0) {
            const referenceId = record.evidencePaths[0]?.referenceId;
            const reference = referenceId
              ? record.proceduralLogic.nodes.find((node) => node.id === referenceId)?.label
              : undefined;
            if (reference) p.push(reference);
          }
          const id = record.sourcePrototypeId;'''
          if old not in text:
            raise SystemExit("stem fallback anchor missing")
          text = text.replace(old, new, 1)

          hi_anchor = '    .replace(/^On the paternal side, (.+)\'s son is (.+); on the maternal side, (.+)\'s daughter is (.+)\\.$/, "पैतृक पक्ष में $1 का पुत्र $2 है; मातृ पक्ष में $3 की पुत्री $4 है।");'
          hi_extra = '''    .replace(/^(.+) is (.+)'s son-in-law\\.$/, "$1, $2 का दामाद है।")
            .replace(/^(.+) is the son of (.+), the only daughter of (.+)\\.$/, "$1, $2 का पुत्र है; $2, $3 की इकलौती पुत्री है।")
            .replace(/^(.+)'s mother (.+) is (.+)'s daughter-in-law\\.$/, "$2, $1 की माता और $3 की बहू है।")
            .replace(/^(.+)'s mother (.+) is one of (.+)'s daughters-in-law\\.$/, "$2, $1 की माता और $3 की बहुओं में से एक है।")
            .replace(/^(.+), the son-in-law of (.+), has one daughter, (.+)\\.$/, "$1, $2 का दामाद है और उसकी एक पुत्री $3 है।")
            .replace(/^(.+) is (.+)'s mother and (.+)'s daughter-in-law, while (.+) is the other son of (.+) and (.+)\\.$/, "$1, $2 की माता और $3 की बहू है, जबकि $4, $5 और $6 का दूसरा पुत्र है।")
            .replace(/^(.+) is neither (.+)'s sibling nor (.+)'s sibling\\.$/, "$1 न $2 का और न $3 का भाई-बहन है।")
            .replace(/^(.+)'s mother (.+) and (.+)'s father (.+) are the only children of (.+) and (.+)\\.$/, "$1 की माता $2 और $3 के पिता $4, $5 और $6 की इकलौती संतानें हैं।")
            .replace(/^(.+)'s paternal cousin is (.+), whose mother is (.+)\\.$/, "$2, $1 का पैतृक कज़िन है और उसकी माता $3 है।")
            .replace(/^(.+) and (.+) have one daughter (.+); (.+) and (.+) have one son (.+)\\.$/, "$1 और $2 की एक पुत्री $3 है; $4 और $5 का एक पुत्र $6 है।")
            .replace(/^(.+) and (.+) are the children of (.+) and (.+); (.+) and (.+) are the children of (.+) and (.+)\\.$/, "$1 और $2, $3 और $4 की संतानें हैं; $5 और $6, $7 और $8 की संतानें हैं।")
            .replace(/^(.+) is the daughter of (.+)'s maternal uncle (.+)\\.$/, "$1, $2 के मामा $3 की पुत्री है।")
            .replace(/^(.+) is the wife of the common great-grandfather of (.+) and (.+)\\.$/, "$1, $2 और $3 के साझा परदादा की पत्नी है।")
            .replace(/^(.+)'s father is (.+), not (.+)\\.$/, "$1 के पिता $2 हैं, $3 नहीं।")
            .replace(/^(.+) is not the sibling of (.+) or (.+)\\.$/, "$1 न $2 का और न $3 का भाई-बहन है।")
            .replace(/^(.+), an unmarried daughter of (.+) and (.+), is the paternal aunt of (.+)\\.$/, "$1, $2 और $3 की अविवाहित पुत्री तथा $4 की बुआ है।")
            .replace(/^(.+) is a daughter-in-law of (.+)\\.$/, "$1, $2 की बहू है।")
            .replace(/^(.+) and (.+) also have two sons, (.+) and (.+)\\.$/, "$1 और $2 के दो पुत्र $3 और $4 भी हैं।")
            .replace(/^(.+), another child of (.+) and (.+), is unmarried and is not a parent\\.$/, "$1, $2 और $3 की एक अन्य संतान है; वह अविवाहित है और माता-पिता नहीं है।")
            .replace(/^(.+)'s wife is (.+), (.+)'s husband is (.+), and their children are (.+) and (.+), respectively\\.$/, "$1 की पत्नी $2 है, $3 के पति $4 हैं, और उनकी संतानें क्रमशः $5 और $6 हैं।")
            .replace(/^The youngest members are (.+), (.+) and (.+), one from each of three married sibling branches\\.$/, "सबसे छोटी पीढ़ी के सदस्य $1, $2 और $3 हैं; प्रत्येक तीन विवाहित भाई-बहन शाखाओं में से एक है।")
            .replace(/^Their daughters (.+) and (.+) are married to (.+) and (.+), respectively\\.$/, "उनकी पुत्रियों $1 और $2 का विवाह क्रमशः $3 और $4 से हुआ है।")
'''
          if hi_anchor not in text:
            raise SystemExit("Hindi grammar anchor missing")
          text = text.replace(hi_anchor, hi_extra + hi_anchor, 1)

          pa_anchor = '    .replace(/^On the paternal side, (.+)\'s son is (.+); on the maternal side, (.+)\'s daughter is (.+)\\.$/, "ਪਿਤਰੀ ਪਾਸੇ $1 ਦਾ ਪੁੱਤਰ $2 ਹੈ; ਮਾਤਰੀ ਪਾਸੇ $3 ਦੀ ਧੀ $4 ਹੈ।");'
          pa_extra = '''    .replace(/^(.+) is (.+)'s son-in-law\\.$/, "$1, $2 ਦਾ ਜਵਾਈ ਹੈ।")
            .replace(/^(.+) is the son of (.+), the only daughter of (.+)\\.$/, "$1, $2 ਦਾ ਪੁੱਤਰ ਹੈ; $2, $3 ਦੀ ਇਕੱਲੀ ਧੀ ਹੈ।")
            .replace(/^(.+)'s mother (.+) is (.+)'s daughter-in-law\\.$/, "$2, $1 ਦੀ ਮਾਤਾ ਅਤੇ $3 ਦੀ ਨੂੰਹ ਹੈ।")
            .replace(/^(.+)'s mother (.+) is one of (.+)'s daughters-in-law\\.$/, "$2, $1 ਦੀ ਮਾਤਾ ਅਤੇ $3 ਦੀਆਂ ਨੂੰਹਾਂ ਵਿੱਚੋਂ ਇੱਕ ਹੈ।")
            .replace(/^(.+), the son-in-law of (.+), has one daughter, (.+)\\.$/, "$1, $2 ਦਾ ਜਵਾਈ ਹੈ ਅਤੇ ਉਸ ਦੀ ਇੱਕ ਧੀ $3 ਹੈ।")
            .replace(/^(.+) is (.+)'s mother and (.+)'s daughter-in-law, while (.+) is the other son of (.+) and (.+)\\.$/, "$1, $2 ਦੀ ਮਾਤਾ ਅਤੇ $3 ਦੀ ਨੂੰਹ ਹੈ, ਜਦਕਿ $4, $5 ਅਤੇ $6 ਦਾ ਦੂਜਾ ਪੁੱਤਰ ਹੈ।")
            .replace(/^(.+) is neither (.+)'s sibling nor (.+)'s sibling\\.$/, "$1 ਨਾ $2 ਦਾ ਅਤੇ ਨਾ $3 ਦਾ ਭਰਾ-ਭੈਣ ਹੈ।")
            .replace(/^(.+)'s mother (.+) and (.+)'s father (.+) are the only children of (.+) and (.+)\\.$/, "$1 ਦੀ ਮਾਤਾ $2 ਅਤੇ $3 ਦੇ ਪਿਤਾ $4, $5 ਅਤੇ $6 ਦੀਆਂ ਇਕੱਲੀਆਂ ਸੰਤਾਨਾਂ ਹਨ।")
            .replace(/^(.+)'s paternal cousin is (.+), whose mother is (.+)\\.$/, "$2, $1 ਦਾ ਪਿਤਰੀ ਕਜ਼ਨ ਹੈ ਅਤੇ ਉਸ ਦੀ ਮਾਤਾ $3 ਹੈ।")
            .replace(/^(.+) and (.+) have one daughter (.+); (.+) and (.+) have one son (.+)\\.$/, "$1 ਅਤੇ $2 ਦੀ ਇੱਕ ਧੀ $3 ਹੈ; $4 ਅਤੇ $5 ਦਾ ਇੱਕ ਪੁੱਤਰ $6 ਹੈ।")
            .replace(/^(.+) and (.+) are the children of (.+) and (.+); (.+) and (.+) are the children of (.+) and (.+)\\.$/, "$1 ਅਤੇ $2, $3 ਅਤੇ $4 ਦੀਆਂ ਸੰਤਾਨਾਂ ਹਨ; $5 ਅਤੇ $6, $7 ਅਤੇ $8 ਦੀਆਂ ਸੰਤਾਨਾਂ ਹਨ।")
            .replace(/^(.+) is the daughter of (.+)'s maternal uncle (.+)\\.$/, "$1, $2 ਦੇ ਮਾਮਾ $3 ਦੀ ਧੀ ਹੈ।")
            .replace(/^(.+) is the wife of the common great-grandfather of (.+) and (.+)\\.$/, "$1, $2 ਅਤੇ $3 ਦੇ ਸਾਂਝੇ ਪਰਦਾਦਾ ਦੀ ਪਤਨੀ ਹੈ।")
            .replace(/^(.+)'s father is (.+), not (.+)\\.$/, "$1 ਦੇ ਪਿਤਾ $2 ਹਨ, $3 ਨਹੀਂ।")
            .replace(/^(.+) is not the sibling of (.+) or (.+)\\.$/, "$1 ਨਾ $2 ਦਾ ਅਤੇ ਨਾ $3 ਦਾ ਭਰਾ-ਭੈਣ ਹੈ।")
            .replace(/^(.+), an unmarried daughter of (.+) and (.+), is the paternal aunt of (.+)\\.$/, "$1, $2 ਅਤੇ $3 ਦੀ ਅਵਿਵਾਹਿਤ ਧੀ ਅਤੇ $4 ਦੀ ਭੂਆ ਹੈ।")
            .replace(/^(.+) is a daughter-in-law of (.+)\\.$/, "$1, $2 ਦੀ ਨੂੰਹ ਹੈ।")
            .replace(/^(.+) and (.+) also have two sons, (.+) and (.+)\\.$/, "$1 ਅਤੇ $2 ਦੇ ਦੋ ਪੁੱਤਰ $3 ਅਤੇ $4 ਵੀ ਹਨ।")
            .replace(/^(.+), another child of (.+) and (.+), is unmarried and is not a parent\\.$/, "$1, $2 ਅਤੇ $3 ਦੀ ਇੱਕ ਹੋਰ ਸੰਤਾਨ ਹੈ; ਉਹ ਅਵਿਵਾਹਿਤ ਹੈ ਅਤੇ ਮਾਤਾ-ਪਿਤਾ ਨਹੀਂ ਹੈ।")
            .replace(/^(.+)'s wife is (.+), (.+)'s husband is (.+), and their children are (.+) and (.+), respectively\\.$/, "$1 ਦੀ ਪਤਨੀ $2 ਹੈ, $3 ਦੇ ਪਤੀ $4 ਹਨ, ਅਤੇ ਉਨ੍ਹਾਂ ਦੀਆਂ ਸੰਤਾਨਾਂ ਕ੍ਰਮਵਾਰ $5 ਅਤੇ $6 ਹਨ।")
            .replace(/^The youngest members are (.+), (.+) and (.+), one from each of three married sibling branches\\.$/, "ਸਭ ਤੋਂ ਛੋਟੀ ਪੀੜ੍ਹੀ ਦੇ ਮੈਂਬਰ $1, $2 ਅਤੇ $3 ਹਨ; ਹਰ ਇੱਕ ਤਿੰਨ ਵਿਆਹੀਆਂ ਭਰਾ-ਭੈਣ ਸ਼ਾਖਾਵਾਂ ਵਿੱਚੋਂ ਇੱਕ ਹੈ।")
            .replace(/^Their daughters (.+) and (.+) are married to (.+) and (.+), respectively\\.$/, "ਉਨ੍ਹਾਂ ਦੀਆਂ ਧੀਆਂ $1 ਅਤੇ $2 ਦਾ ਵਿਆਹ ਕ੍ਰਮਵਾਰ $3 ਅਤੇ $4 ਨਾਲ ਹੋਇਆ ਹੈ।")
'''
          if pa_anchor not in text:
            raise SystemExit("Punjabi grammar anchor missing")
          text = text.replace(pa_anchor, pa_extra + pa_anchor, 1)
          p.write_text(text)
      - name: Remove temporary workflow and commit remediation
        run: |
          rm .github/workflows/tmp-cp003-grammar-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-003/localization/cp003-language-pack.ts .github/workflows/tmp-cp003-grammar-remediation.yml
          git commit -m "fix(reasoning): expand CP-003 localization grammar"
          git push origin HEAD:feat/blr-001-cp003-multilingual
