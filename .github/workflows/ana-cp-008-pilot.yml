name: Validate ANA-CP-008 pilot foundation

on:
  push:
    branches:
      - feat/reasoning-ana-001-cp008-pilot
      - feat/reasoning-ana-001-cp008-presentation-pilot
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/**
      - .github/workflows/ana-cp-008-pilot.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/**
      - .github/workflows/ana-cp-008-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-ana-cp-008-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowSyntheticDefaultImports \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008 -name '*.ts' -print) \
            src/reasoning-v1/topics/Analogy/ANA-001/foundation/alphabet.ts
      - name: Verify mixed-token grammar
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/foundation/mixed-token.test.ts
      - name: Verify source fixtures
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/provisional-source-fixtures.test.ts
      - name: Run provisional yield simulation
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/provisional-yield-simulation.ts
      - name: Prove four-option construction yield
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/provisional-option-yield.ts
      - name: Prove presentation-mode yield
        run: pnpm dlx tsx ./artifacts/api-server/src/reasoning-v1/topics/Analogy/ANA-001/ANA-CP-008/provisional-presentation-yield.ts
