name: Quant V4 CGL 2023 Jul 25 S1 full Quant section Wave 6 P2
# Exact-head evidence gate for the sixth complete CGL Quant section.

on:
  push:
    branches:
      - audit/quant-v4-cgl-2023-07-25-s1-full-quant-section-wave6-p2
    paths:
      - ".github/workflows/quant-v4-cgl-2023-07-25-s1-full-quant-section-wave6-p2.yml"
      - "artifacts/api-server/src/quant-v4/quality/**"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/quality/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-v4-cgl-2023-07-25-s1-full-quant-section-wave6-p2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cgl-2023-jul25-s1-full-quant-section-wave6:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle evidence proofs
        run: |
          mkdir -p artifacts/api-server/dist/quant-v4/quality
          for test in \
            quant-v4-pyq-frequency-evidence-p2.test \
            quant-v4-cgl-2023-07-25-s1-full-quant-section-wave6-p2.test \
            quant-v4-whole-section-frequency-calibration-p2.test \
            quant-v4-cgl-2023-07-26-s2-full-quant-section-wave5-p2.test \
            quant-v4-cgl-2023-07-26-s1-full-quant-section-wave4-p2.test \
            quant-v4-cgl-2022-s1-full-quant-section-wave3-p2.test \
            quant-v4-cgl-2023-s2-full-quant-section-wave2-p2.test \
            quant-v4-cgl-2024-s1-full-quant-section-wave1-p2.test \
            quant-v4-cgl-tier1-cross-topic-pyq-normalization-wave1-p2.test \
            quant-v4-tmw-chsl-pyq-normalization-wave1-p2.test \
            quant-v4-average-chsl-pyq-normalization-wave1-p2.test \
            quant-v4-percentage-chsl-pyq-normalization-wave1-p2.test \
            quant-v4-tsd-pyq-normalization-wave1-p2.test \
            quant-v4-algebra-pyq-normalization-wave2-p2.test \
            quant-v4-algebra-pyq-normalization-wave3-p2.test \
            quant-v4-number-system-ssc-pyq-normalization-wave2-p2.test \
            quant-v4-specialized-profile-selection-evidence-gate-p2.test
          do
            pnpm --dir artifacts/api-server exec esbuild \
              "src/quant-v4/quality/${test}.ts" \
              --bundle --platform=node --format=esm --packages=external \
              --outfile="dist/quant-v4/quality/${test}.mjs"
          done
      - name: Run Wave 6 and frequency proofs
        working-directory: artifacts/api-server
        run: |
          node dist/quant-v4/quality/quant-v4-pyq-frequency-evidence-p2.test.mjs
          node dist/quant-v4/quality/quant-v4-cgl-2023-07-25-s1-full-quant-section-wave6-p2.test.mjs
      - name: Run whole-section regressions
        working-directory: artifacts/api-server
        run: |
          for test in \
            quant-v4-whole-section-frequency-calibration-p2.test \
            quant-v4-cgl-2023-07-26-s2-full-quant-section-wave5-p2.test \
            quant-v4-cgl-2023-07-26-s1-full-quant-section-wave4-p2.test \
            quant-v4-cgl-2022-s1-full-quant-section-wave3-p2.test \
            quant-v4-cgl-2023-s2-full-quant-section-wave2-p2.test \
            quant-v4-cgl-2024-s1-full-quant-section-wave1-p2.test
          do
            node "dist/quant-v4/quality/${test}.mjs"
          done
      - name: Run historical evidence regressions
        working-directory: artifacts/api-server
        run: |
          for test in \
            quant-v4-cgl-tier1-cross-topic-pyq-normalization-wave1-p2.test \
            quant-v4-tmw-chsl-pyq-normalization-wave1-p2.test \
            quant-v4-average-chsl-pyq-normalization-wave1-p2.test \
            quant-v4-percentage-chsl-pyq-normalization-wave1-p2.test \
            quant-v4-tsd-pyq-normalization-wave1-p2.test \
            quant-v4-algebra-pyq-normalization-wave2-p2.test \
            quant-v4-algebra-pyq-normalization-wave3-p2.test \
            quant-v4-number-system-ssc-pyq-normalization-wave2-p2.test
          do
            node "dist/quant-v4/quality/${test}.mjs"
          done
      - name: Run specialized selection regression
        working-directory: artifacts/api-server
        run: node dist/quant-v4/quality/quant-v4-specialized-profile-selection-evidence-gate-p2.test.mjs
      - name: Patch hygiene
        run: git diff --check
