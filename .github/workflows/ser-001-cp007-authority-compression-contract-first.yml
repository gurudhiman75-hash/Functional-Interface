name: Validate SER-001 CP-007 contract-first compression

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-B/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-C/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-D/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-E/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-REMODEL/adaptive-review.ts
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUTHORITY-FREEZE-CANDIDATE/**
      - .github/workflows/ser-001-cp007-authority-compression-contract-first.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-cp007-authority-compression-contract-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contract-first-compression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/cp007-authority-compression-contract-first

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Re-run conservative 17-to-14 candidate
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUTHORITY-FREEZE-CANDIDATE
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-authority-compression-contract-first
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/ser-cp-007-authority-compression-candidate.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-authority-compression-candidate.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-authority-compression-candidate.test.mjs") \
            | tee "$EVIDENCE/authority-compression-17-to-14.json"
          grep -q 'PASS_SER_CP007_AUTHORITY_COMPRESSION_CANDIDATE_17_TO_14' \
            "$EVIDENCE/authority-compression-17-to-14.json"

      - name: Validate contract-first 17-to-13 candidate
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUTHORITY-FREEZE-CANDIDATE
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-authority-compression-contract-first
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/ser-cp-007-authority-compression-contract-first.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-authority-compression-contract-first.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-authority-compression-contract-first.test.mjs") \
            | tee "$EVIDENCE/authority-compression-17-to-13.json"
          grep -q 'PASS_SER_CP007_AUTHORITY_COMPRESSION_CONTRACT_FIRST_17_TO_13' \
            "$EVIDENCE/authority-compression-17-to-13.json"

      - name: Collect candidate reports
        run: |
          set -euo pipefail
          ROOT=artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-AUTHORITY-FREEZE-CANDIDATE
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-authority-compression-contract-first
          cp "$ROOT/ser-cp-007-authority-compression-candidate-report.md" \
            "$EVIDENCE/ser-cp-007-authority-compression-17-to-14-report.md"
          cp "$ROOT/ser-cp-007-authority-compression-contract-first-report.md" \
            "$EVIDENCE/ser-cp-007-authority-compression-17-to-13-report.md"

      - name: Upload contract-first compression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-cp007-authority-compression-contract-first
          path: artifacts/api-server/dist/reasoning-v1/ser-001/cp007-authority-compression-contract-first
          if-no-files-found: error
          retention-days: 30
