name: Validate NUM-CP-005 Wave 04 data sufficiency and solution topology

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/**
      - .github/workflows/num-001-cp005-wave04-ds-solution-topology.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-num-cp005-wave04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-num-cp005-wave04:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Wave 1 regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-005/wave01/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp005-wave01-regression.test.mjs

      - name: Run Wave 1 regression
        run: node artifacts/api-server/dist/quant-v4/num-001-cp005-wave01-regression.test.mjs

      - name: Bundle Wave 2 regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-005/wave02/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp005-wave02-regression.test.mjs

      - name: Run Wave 2 regression
        run: node artifacts/api-server/dist/quant-v4/num-001-cp005-wave02-regression.test.mjs

      - name: Bundle Wave 3 regression
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-005/wave03/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp005-wave03-regression.test.mjs

      - name: Run Wave 3 regression
        run: node artifacts/api-server/dist/quant-v4/num-001-cp005-wave03-regression.test.mjs

      - name: Bundle Wave 4 exact authority proof
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-005/wave04/runtime-authority.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp005-wave04-authority.test.mjs

      - name: Run Wave 4 exact authority proof
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp005-wave04-authority.test.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp005-wave04-authority.log

      - name: Bundle Wave 4 structural audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-005/wave04/runtime-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp005-wave04-audit.mjs

      - name: Run Wave 4 structural audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/quant-v4/num-001-cp005-wave04-audit.mjs 2>&1 | tee artifacts/api-server/dist/quant-v4/num-001-cp005-wave04-audit.log

      - name: Bundle Wave 4 review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/NumberSystem/NUM-001/NUM-CP-005/wave04/review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/num-001-cp005-wave04-review-export.mjs

      - name: Generate Wave 4 review pack
        working-directory: artifacts/api-server
        run: node dist/quant-v4/num-001-cp005-wave04-review-export.mjs

      - name: Upload Wave 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: num-001-cp005-wave04-ds-solution-topology
          path: |
            artifacts/api-server/dist/quant-v4/num-001-cp005-wave04-authority.log
            artifacts/api-server/dist/quant-v4/num-001-cp005-wave04-audit.log
            artifacts/api-server/dist/quant-v4/num-001-cp005-wave04-review.json
            artifacts/api-server/dist/quant-v4/num-001-cp005-wave04-review.md
          if-no-files-found: warn
          retention-days: 14
