name: Reasoning BLR-001 CP-007 Coded Relation Construction

on:
  push:
    branches:
      - feat/blr-001-cp007-coded-construction-runtime
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-006/**"
      - ".github/workflows/reasoning-blr-001-cp007-coded-construction.yml"
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-006/**"
      - ".github/workflows/reasoning-blr-001-cp007-coded-construction.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blr-001-cp007-coded-construction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-cp007-coded-construction:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove CP-006 source runtime
        run: |
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-006/cp006-runtime.test.ts | tee cp006-source.log

      - name: Prove CP-007 permanent runtime and independent verifier
        run: |
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-runtime.test.ts | tee cp007-runtime.log

      - name: Prove CP-007 final discovery freeze
        run: |
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/cp007-final-freeze.test.ts | tee cp007-final-freeze.log

      - name: Export CP-007 final freeze review pack
        run: |
          npx --yes tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Blood-Relations/BLR-001/BLR-CP-007/export-cp007-final-freeze.ts cp007-final-freeze-output | tee cp007-export.log

      - name: Verify CP-007 artifact contracts
        shell: bash
        run: |
          set -euo pipefail
          OUT=cp007-final-freeze-output
          test -f "$OUT/blr-cp007-final-freeze-summary.json"
          test -f "$OUT/blr-cp007-permanent-contracts.json"
          test -f "$OUT/blr-cp007-final-freeze-records.jsonl"
          test -f "$OUT/blr-cp007-final-freeze-records.csv"
          test -f "$OUT/blr-cp007-final-freeze-review.html"
          test -f "$OUT/BLR-CP-007-FINAL-DISCOVERY-FREEZE.md"
          grep -q '"recordCount": 168' "$OUT/blr-cp007-final-freeze-summary.json"
          grep -q '"prototypeCount": 21' "$OUT/blr-cp007-final-freeze-summary.json"
          grep -q '"authorityCount": 5' "$OUT/blr-cp007-final-freeze-summary.json"
          grep -q '"permanentQlCount": 5' "$OUT/blr-cp007-final-freeze-summary.json"
          grep -q '"statementCount": 296' "$OUT/blr-cp007-final-freeze-summary.json"
          grep -q '"permanentQlRange": "BLR-QL-031..BLR-QL-035"' "$OUT/blr-cp007-final-freeze-summary.json"
          grep -q '"nextAvailableChapterQlId": "BLR-QL-036"' "$OUT/blr-cp007-final-freeze-summary.json"
          test "$(wc -l < "$OUT/blr-cp007-final-freeze-records.jsonl")" -eq 168
          grep -q '168 English review questions' "$OUT/blr-cp007-final-freeze-review.html"
          grep -q '@media(max-width:700px)' "$OUT/blr-cp007-final-freeze-review.html"

      - name: Upload CP-007 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp007-coded-construction-logs
          path: |
            cp006-source.log
            cp007-runtime.log
            cp007-final-freeze.log
            cp007-export.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload CP-007 final freeze pack
        uses: actions/upload-artifact@v4
        with:
          name: blr-001-cp007-coded-construction-final-freeze
          path: cp007-final-freeze-output
          if-no-files-found: error
          retention-days: 30
