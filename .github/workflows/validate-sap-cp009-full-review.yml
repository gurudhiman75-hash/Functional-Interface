name: Validate SAP-CP-009 300-question full review

on:
  pull_request:
    branches:
      - freeze/sap-cp004-cp008-product-owner-approved
      - feat/sap-cp008-additive-approximation-foundation
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-009/**
      - .github/workflows/validate-sap-cp009-full-review.yml
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sap-cp009-full-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Bundle remediated review authority
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-009/full-review-authority-v2.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/sap-cp009-full-review-authority.test.mjs
      - name: Run remediated review authority
        run: node artifacts/api-server/dist/quant-v4/sap-cp009-full-review-authority.test.mjs
      - name: Bundle remediated review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/SimplificationAndApproximation/SAP-001/SAP-CP-009/generate-full-review-v2.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/sap-cp009-generate-review.mjs
      - name: Generate review files
        run: node artifacts/api-server/dist/quant-v4/sap-cp009-generate-review.mjs
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: sap-cp009-300-question-full-review
          path: artifacts/api-server/dist/quant-v4/sap-cp009-review/**
          if-no-files-found: error
          retention-days: 30
