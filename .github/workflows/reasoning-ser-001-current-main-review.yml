name: Reasoning SER-001 Current-Main Review Integration

on:
  push:
    branches:
      - New-main
      - feat/ser-001-current-main-review-integration
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/**"
      - "artifacts/api-server/src/routes/admin-question-studio-series.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-bulk-hardening.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - "artifacts/api-server/src/lib/admin-question-studio-approval-policy.ts"
      - "artifacts/api-server/src/lib/admin-question-studio-approval-policy.test.ts"
      - "artifacts/admin-app/src/features/question-studio/series-review-api.ts"
      - "artifacts/admin-app/src/pages/content/QuestionStudioSeriesReviewPanel.tsx"
      - "artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx"
      - ".github/workflows/reasoning-ser-001-current-main-review.yml"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/**"
      - "artifacts/api-server/src/routes/admin-question-studio-series.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-bulk-hardening.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - "artifacts/api-server/src/lib/admin-question-studio-approval-policy.ts"
      - "artifacts/api-server/src/lib/admin-question-studio-approval-policy.test.ts"
      - "artifacts/admin-app/src/features/question-studio/series-review-api.ts"
      - "artifacts/admin-app/src/pages/content/QuestionStudioSeriesReviewPanel.tsx"
      - "artifacts/admin-app/src/pages/content/QuestionStudioOperationsPage.tsx"
      - ".github/workflows/reasoning-ser-001-current-main-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-current-main-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-review-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove SER-001 frozen review adapter and 420 multilingual payload sweep
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-QUESTION-STUDIO-INTEGRATION/question-studio-review-adapter.test.ts | tee ser-review-adapter.log

      - name: Prove current-main Series Question Studio integration
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-QUESTION-STUDIO-INTEGRATION/ser-cp-007-question-studio-integration.test.ts | tee ser-current-main-integration.log

      - name: Prove narrow review-only approval policy
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/lib/admin-question-studio-approval-policy.test.ts | tee ser-approval-policy.log

      - name: Typecheck admin application
        run: pnpm --dir artifacts/admin-app typecheck

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Upload SER-001 validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-current-main-review-logs
          path: |
            ser-review-adapter.log
            ser-current-main-integration.log
            ser-approval-policy.log
          retention-days: 14
