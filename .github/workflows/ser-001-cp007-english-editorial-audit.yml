name: Audit SER-001 CP-007 English editorial system

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-B/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-C/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-D/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-WAVE-E/**
      - artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-EDITORIAL-AUDIT/**
      - .github/workflows/ser-001-cp007-english-editorial-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ser-001-cp007-english-editorial-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-english-editorial-system:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-editorial-audit

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Run full English editorial audit
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-EDITORIAL-AUDIT
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-editorial-audit
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/ser-cp-007-english-editorial-audit.test.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/ser-cp-007-english-editorial-audit.test.mjs"
          (cd artifacts/api-server && node "$OUT/ser-cp-007-english-editorial-audit.test.mjs") \
            | tee "$EVIDENCE/english-editorial-audit.json"
          grep -q 'PASS_SER_CP007_ENGLISH_EDITORIAL_AUDIT_REMODEL_REQUIRED' \
            "$EVIDENCE/english-editorial-audit.json"

      - name: Export one review per temporary template
        run: |
          set -euo pipefail
          ROOT=src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-EDITORIAL-AUDIT
          OUT=dist/reasoning-v1/ser-001
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-editorial-audit
          pnpm --dir artifacts/api-server exec esbuild \
            "$ROOT/export-full-english-review.ts" \
            --bundle --platform=node --format=esm \
            --outfile="$OUT/export-ser-cp007-full-english-review.mjs"
          (cd artifacts/api-server && node "$OUT/export-ser-cp007-full-english-review.mjs") \
            > "$EVIDENCE/ser-cp-007-full-english-review.md"
          grep -q '# SER-CP-007 full English editorial review' \
            "$EVIDENCE/ser-cp-007-full-english-review.md"

      - name: Collect editorial report
        run: |
          set -euo pipefail
          ROOT=artifacts/api-server/src/reasoning-v1/topics/Series/SER-001/SER-CP-007-ENGLISH-EDITORIAL-AUDIT
          EVIDENCE=artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-editorial-audit
          cp "$ROOT/ser-cp-007-english-editorial-audit-report.md" \
            "$EVIDENCE/ser-cp-007-english-editorial-audit-report.md"

      - name: Upload English editorial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ser-001-cp007-english-editorial-audit
          path: artifacts/api-server/dist/reasoning-v1/ser-001/cp007-english-editorial-audit
          if-no-files-found: error
          retention-days: 30
