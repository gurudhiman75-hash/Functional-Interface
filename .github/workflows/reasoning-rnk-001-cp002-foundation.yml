name: Validate RNK-001 CP-002 Foundation

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-002/**"
      - "artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/README.md"
      - "artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/rnk-001-open-ql-discovery.md"
      - ".github/workflows/reasoning-rnk-001-cp002-foundation.yml"
  workflow_dispatch:

jobs:
  cp002-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run two-person deterministic and independent-solver audit
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-002/cp002-foundation.test.ts
          rnk-cp002-foundation-output

      - name: Run source and inverse saturation audit
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-002/cp002-source-wave.test.ts
          rnk-cp002-source-wave-output

      - name: Prove eight-authority consolidation
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-002/cp002-consolidation.test.ts
          rnk-cp002-consolidation-output

      - name: Prove authority English review runtime
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-002/cp002-authority-runtime.test.ts
          rnk-cp002-authority-review-output

      - name: Enforce final source and gap audit
        run: >-
          npx --yes tsx
          artifacts/api-server/src/reasoning-v1/topics/Ranking-and-Order/RNK-001/RNK-CP-002/cp002-final-source-gap.test.ts
          rnk-cp002-final-source-gap-output

      - name: Upload RNK-CP-002 discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: rnk-001-cp002-foundation
          path: |
            rnk-cp002-foundation-output
            rnk-cp002-source-wave-output
            rnk-cp002-consolidation-output
            rnk-cp002-authority-review-output
            rnk-cp002-final-source-gap-output
          retention-days: 14
