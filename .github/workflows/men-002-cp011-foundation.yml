name: Validate MEN-CP-011 foundation wave 01

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/**
      - artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/MEN-CP-011/**
      - .github/workflows/men-002-cp011-foundation.yml
      - build-api.sh
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: validate-men-002-cp011-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove MEN-CP-011 temporary foundation packages
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/foundation.test.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/men-cp011-foundation-wave-01.test.mjs
          node artifacts/api-server/dist/quant-v4/men-cp011-foundation-wave-01.test.mjs

      - name: Export MEN-CP-011 open-container review evidence
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/open-containers-review-export.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/men-cp011-open-containers-wave01-review.mjs
          cd artifacts/api-server
          node dist/quant-v4/men-cp011-open-containers-wave01-review.mjs \
            2>&1 | tee dist/quant-v4/men-cp011-open-containers-wave01-review.log

      - name: Export MEN-CP-011 inverse thickness-length review evidence
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir artifacts/api-server exec esbuild \
            src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/cp011-foundation/inverse-thickness-length-review-export.ts \
            --bundle \
            --packages=external \
            --platform=node \
            --format=esm \
            --outfile=dist/quant-v4/men-cp011-inverse-thickness-length-wave01-review.mjs
          cd artifacts/api-server
          node dist/quant-v4/men-cp011-inverse-thickness-length-wave01-review.mjs \
            2>&1 | tee dist/quant-v4/men-cp011-inverse-thickness-length-wave01-review.log

      - name: Build production API bundle
        shell: bash
        run: bash build-api.sh

      - name: Upload MEN-CP-011 open-container review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-cp011-open-containers-wave01-review
          path: |
            artifacts/api-server/dist/quant-v4/men-cp011-open-containers-wave01-review.log
            artifacts/api-server/dist/quant-v4/men-cp011-open-containers-wave01-review.json
            artifacts/api-server/dist/quant-v4/men-cp011-open-containers-wave01-review.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload MEN-CP-011 inverse thickness-length review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-cp011-inverse-thickness-length-wave01-review
          path: |
            artifacts/api-server/dist/quant-v4/men-cp011-inverse-thickness-length-wave01-review.log
            artifacts/api-server/dist/quant-v4/men-cp011-inverse-thickness-length-wave01-review.json
            artifacts/api-server/dist/quant-v4/men-cp011-inverse-thickness-length-wave01-review.md
          if-no-files-found: error
          retention-days: 14
