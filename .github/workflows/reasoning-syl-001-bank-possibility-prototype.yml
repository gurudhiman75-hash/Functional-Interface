name: Validate SYL-001 Banking possibility prototype

on:
  pull_request:
    branches:
      - audit/syl-001-source-profile-freeze
      - feat/syl-001-learner-v4
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-shell-v1.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-shell-v1-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-combined-diagram-v3.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-review-question-v3.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-combined-diagram-v3-audit.test.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-diagram-completion.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-exact-venn.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-witness-proof.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-existential-completeness.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-witness-closure-finalizer.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-exact-venn-safety.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/learner-v5-directional-containment-safety.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/analysis.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/scenarios.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/localization.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/term-assignment.ts
      - artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/SYL-001-BANKING-POSSIBILITY-SHELL-PROTOTYPE-V1.md
      - .github/workflows/reasoning-syl-001-bank-possibility-prototype.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-syl-001-bank-possibility-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-bank-possibility-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Banking possibility-shell audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-shell-v1-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-bank-possibility-shell-v1-audit.test.mjs

      - name: Run Banking possibility-shell audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-shell-v1-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-shell-v1-audit.log

      - name: Bundle single combined-diagram audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-combined-diagram-v3-audit.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/reasoning-v1/syl-001-bank-possibility-combined-diagram-v3-audit.test.mjs

      - name: Run single combined-diagram audit
        shell: bash
        run: |
          set -o pipefail
          node artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-combined-diagram-v3-audit.test.mjs 2>&1 | tee artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-combined-diagram-v3-audit.log

      - name: Reject legacy split-diagram bridge in active V3 path
        run: |
          if grep -R "renderBankingPossibilityDiagramsV1" \
            artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-review-question-v3.ts \
            artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-combined-diagram-v3.ts; then
            echo "Legacy per-conclusion diagram bridge is referenced by V3." >&2
            exit 1
          fi
          if grep -R "as unknown as" \
            artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-review-question-v3.ts \
            artifacts/api-server/src/reasoning-v1/topics/Syllogism/SYL-001/runtime/banking-possibility-combined-diagram-v3.ts; then
            echo "Unsafe compatibility cast found in V3 combined diagram path." >&2
            exit 1
          fi

      - name: Upload prototype evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syl-001-bank-possibility-shell-v3-combined-diagram
          path: |
            artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-shell-v1-audit.log
            artifacts/api-server/dist/reasoning-v1/syl-001-bank-possibility-combined-diagram-v3-audit.log
          if-no-files-found: error
          retention-days: 30
