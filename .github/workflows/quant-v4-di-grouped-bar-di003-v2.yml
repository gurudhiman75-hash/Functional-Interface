name: Quant V4 Data Interpretation grouped bar DI controlled review

on:
  push:
    branches:
      - feature/di-003-grouped-bar-promotion-v1
    paths:
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/**"
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/visuals/grouped-bar-svg.ts"
      - "artifacts/api-server/src/question-studio/engines/quant-v4-adapter.ts"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/**"
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/visuals/grouped-bar-svg.ts"
      - "artifacts/api-server/src/question-studio/engines/quant-v4-adapter.ts"
  workflow_dispatch:

concurrency:
  group: quant-v4-di003-grouped-bar-controlled-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  grouped-bar-controlled-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Controlled-review lifecycle guard
        run: |
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/grouped-bar-set-v2.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/grouped-bar-v2-types.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/permanent-ql-registry.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/permanent-question-generator.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/question-studio-adapter.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/question-studio-integration.test.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/visuals/grouped-bar-svg.ts
          grep -q 'questionStudioDiscoverable: true' artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/permanent-ql-registry.ts
          grep -q 'questionStudioMode: "CONTROLLED_REVIEW"' artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/permanent-ql-registry.ts
          ! grep -R 'questionBankWritable: true\|testEligibility: "ELIGIBLE"\|testEligible: true\|mockTestEligible: true\|publiclyPublishable: true\|automaticStudentPublication: true\|productionReleaseAuthorized: true' \
            artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/permanent-ql-registry.ts \
            artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/permanent-question-generator.ts \
            artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/question-studio-adapter.ts
      - name: DI-003 V3 no-decimal deterministic, diversity, independent and visual proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/grouped-bar-set-v2.test.ts
      - name: DI-003 V3 whole-percent distractor plausibility proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/distractor-quality-v2.test.ts
      - name: Legacy DI-003 regression
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/grouped-bar-set.test.ts
      - name: DI-003 Question Studio controlled-review proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/question-studio-integration.test.ts
      - name: Hindi Punjabi localization review proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/localization-review-v1.test.ts
      - name: Export Hindi Punjabi localization review pack
        run: |
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/export-localization-review-v1.ts /tmp/DI-003-LOCALIZATION-REVIEW-V1.md
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/export-localization-review-html-v1.ts /tmp/DI-003-LOCALIZATION-REVIEW-V1.html
      - name: Upload Hindi Punjabi localization review pack
        uses: actions/upload-artifact@v4
        with:
          name: di-003-localization-review-v1
          path: |
            /tmp/DI-003-LOCALIZATION-REVIEW-V1.md
            /tmp/DI-003-LOCALIZATION-REVIEW-V1.html
          if-no-files-found: error
          retention-days: 30
      - name: Export Markdown review pack
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/export-review-v2.ts DI-003-REVIEW-V2.md
      - name: Export standalone HTML review pack
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/export-review-v2-html.ts DI-003-REVIEW-V2.html
      - uses: actions/upload-artifact@v4
        with:
          name: di-003-grouped-bar-controlled-review
          path: |
            DI-003-REVIEW-V2.md
            DI-003-REVIEW-V2.html
          if-no-files-found: error
          retention-days: 30
      - name: API server build
        run: pnpm --filter @workspace/api-server build
      - name: Patch hygiene
        run: git diff --check
