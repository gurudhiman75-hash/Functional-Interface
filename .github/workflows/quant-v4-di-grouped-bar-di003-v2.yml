name: Quant V4 Data Interpretation grouped bar DI V2

on:
  push:
    branches:
      - feature/di-003-grouped-bar-v2-review
    paths:
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/**"
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/visuals/grouped-bar-svg.ts"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/**"
      - "artifacts/api-server/src/quant-v4/topics/DataInterpretation/visuals/grouped-bar-svg.ts"
  workflow_dispatch:

concurrency:
  group: quant-v4-di003-grouped-bar-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  grouped-bar-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Review-only lifecycle guard
        run: |
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/grouped-bar-set-v2.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/grouped-bar-set-v2-review.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/grouped-bar-v2-types.ts
          test -f artifacts/api-server/src/quant-v4/topics/DataInterpretation/visuals/grouped-bar-svg.ts
          ! grep -R 'questionStudioDiscoverable: true\|questionBankWritable: true\|testEligibility: "ELIGIBLE"\|testEligible: true\|mockTestEligible: true\|publiclyPublishable: true\|automaticStudentPublication: true\|productionReleaseAuthorized: true' artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/grouped-bar-set-v2.ts artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/grouped-bar-set-v2-review.ts artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/grouped-bar-v2-types.ts
      - name: DI-003 V2 deterministic, diversity, independent and visual proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/grouped-bar-set-v2.test.ts
      - name: DI-003 V2 percentage distractor plausibility proof
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/distractor-quality-v2.test.ts
      - name: Legacy DI-003 regression
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/grouped-bar-set.test.ts
      - name: Export Markdown review pack
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/export-review-v2.ts DI-003-REVIEW-V2.md
      - name: Export standalone HTML review pack
        run: pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/DataInterpretation/DI-003/export-review-v2-html.ts DI-003-REVIEW-V2.html
      - uses: actions/upload-artifact@v4
        with:
          name: di-003-grouped-bar-review-v2
          path: |
            DI-003-REVIEW-V2.md
            DI-003-REVIEW-V2.html
          if-no-files-found: error
          retention-days: 30
      - name: API server build
        run: pnpm --filter @workspace/api-server build
      - name: Patch hygiene
        run: git diff --check
