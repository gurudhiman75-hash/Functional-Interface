name: Diagnose student typecheck

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/examtree/**
      - artifacts/api-server/src/routes/published-test-multilingual-runner.ts
      - .github/workflows/student-typecheck-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: diagnose-student-typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-student-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run student typecheck
        id: student_typecheck
        continue-on-error: true
        run: pnpm --dir artifacts/examtree typecheck 2>&1 | tee student-typecheck.log
      - name: Upload student diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: student-typecheck-log
          path: student-typecheck.log
          if-no-files-found: error
          retention-days: 3
      - name: Enforce student typecheck
        if: steps.student_typecheck.outcome != 'success'
        run: exit 1
