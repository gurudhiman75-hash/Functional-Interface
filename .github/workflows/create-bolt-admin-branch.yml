name: Create Bolt Student Web Branch

on:
  workflow_dispatch:
  push:
    branches:
      - New-main
    paths:
      - '.github/workflows/create-bolt-admin-branch.yml'
      - 'artifacts/examtree/**'
      - 'pnpm-workspace.yaml'

permissions:
  contents: write

concurrency:
  group: create-bolt-student-web-branch
  cancel-in-progress: true

jobs:
  export-student-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create standalone Bolt branch
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          export_dir="$(mktemp -d)"

          cp -a artifacts/examtree/. "$export_dir/"
          cp pnpm-workspace.yaml "$export_dir/pnpm-workspace.yaml"

          cd "$export_dir"
          git init
          git checkout -b bolt-web
          git add -A
          git commit -m "Export ExamTree student frontend for Bolt from ${source_sha}"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/bolt-web --force

      - name: Write summary
        run: |
          echo "Created/updated branch: bolt-web" >> "$GITHUB_STEP_SUMMARY"
          echo "Source app: artifacts/examtree" >> "$GITHUB_STEP_SUMMARY"
          echo "Includes pnpm catalog configuration required by package.json" >> "$GITHUB_STEP_SUMMARY"
