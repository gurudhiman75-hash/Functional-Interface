name: Validate INT-CP-006 V1 Hindi Punjabi Localization

on:
  pull_request:
    branches: [New-main]
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp006-si-ci-relations-localized-v1.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp006-si-ci-relations-localized-v2.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp006-si-ci-relations-localized-v3.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp006-localized-v1-audit.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp006-localized-v1-review-export.ts"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/INT-CP-006/INT-CP-006-SCOPE-v1.md"
      - ".github/workflows/int-cp006-v1-hi-pa-localization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-int-cp006-v1-hi-pa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle CP006 localization audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp006-localized-v1-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-cp006-v1-hi-pa-audit.mjs
      - name: Run CP006 localization audit
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp006-v1-hi-pa-audit.mjs 2>&1 | tee dist/quant-v4/int-cp006-v1-hi-pa-audit.log
      - name: Bundle matched review exporter
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp006-localized-v1-review-export.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-cp006-v1-hi-pa-review-export.mjs
      - name: Export matched English Hindi Punjabi review
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-cp006-v1-hi-pa-review-export.mjs 2>&1 | tee dist/quant-v4/int-cp006-v1-hi-pa-review-export.log
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Verify CP006 localization markers
        run: |
          grep -q 'PASS_INT_CP006_V1_HI_PA_LOCALIZATION_AUDIT' artifacts/api-server/dist/quant-v4/int-cp006-v1-hi-pa-audit.log
          grep -q 'PASS_INT_CP006_V1_HI_PA_REVIEW_EXPORT' artifacts/api-server/dist/quant-v4/int-cp006-v1-hi-pa-review-export.log
      - name: Upload CP006 multilingual review evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-cp006-v1-hi-pa-review
          path: |
            artifacts/api-server/dist/quant-v4/INT-CP-006-HI-PA-MATCHED-REVIEW.md
            artifacts/api-server/dist/quant-v4/int-cp006-v1-hi-pa-audit.log
            artifacts/api-server/dist/quant-v4/int-cp006-v1-hi-pa-review-export.log
          if-no-files-found: error
