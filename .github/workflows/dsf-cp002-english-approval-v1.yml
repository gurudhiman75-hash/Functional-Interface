name: Validate DSF-CP-002 English approval

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-002/**
      - artifacts/api-server/src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-001-MANIFEST-AMENDMENT-CP002-APPROVAL.md
      - .github/workflows/dsf-cp002-english-approval-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsf-cp002-english-approval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dsf-cp002-english-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle English approval proof
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/dsf
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/topics/Data-Sufficiency/DSF-001/DSF-CP-002/english-review-approval-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/dsf/dsf-cp002-english-review-approval.test.mjs
      - name: Run English approval proof
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/dsf/dsf-cp002-english-review-approval.test.mjs
