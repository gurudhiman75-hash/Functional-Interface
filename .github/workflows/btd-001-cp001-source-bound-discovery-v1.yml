name: Validate BTD-001 CP001 Source-Bound Discovery V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/**'
      - '.github/workflows/btd-001-cp001-source-bound-discovery-v1.yml'

jobs:
  validate-btd-001-cp001-source-bound-discovery-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run BTD official-source expansion audit v3
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/btd-cp001-official-source-expansion-v3-audit.ts | tee btd-001-cp001-official-source-expansion-v3.log
          grep -q 'PASS_BTD_001_CP001_OFFICIAL_SOURCE_EXPANSION_AUDIT_V3' btd-001-cp001-official-source-expansion-v3.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Record exact validation head
        shell: bash
        run: |
          echo "validated_head=$(git rev-parse HEAD)" | tee btd-001-cp001-official-source-expansion-v3-head.log
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: btd-001-cp001-official-source-expansion-v3
          path: |
            btd-001-cp001-official-source-expansion-v3.log
            btd-001-cp001-official-source-expansion-v3-head.log
          retention-days: 30
