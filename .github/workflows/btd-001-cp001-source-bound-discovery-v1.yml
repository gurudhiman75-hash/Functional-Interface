name: Validate BTD-001 CP001 Source-Bound Discovery V1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - New-main
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/**'

concurrency:
  group: btd-001-cp001-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-btd-001-cp001-source-bound-discovery-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run BTD dual breadth-remediation audit v5
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/btd-cp001-breadth-remediation-v5-audit.ts | tee btd-001-cp001-breadth-remediation-v5.log
          grep -q 'PASS_BTD_001_CP001_BREADTH_REMEDIATION_AUDIT_V5' btd-001-cp001-breadth-remediation-v5.log

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Record exact validation head
        shell: bash
        run: |
          echo "validated_head=$(git rev-parse HEAD)" | tee btd-001-cp001-breadth-remediation-v5-head.log
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: btd-001-cp001-breadth-remediation-v5
          path: |
            btd-001-cp001-breadth-remediation-v5.log
            btd-001-cp001-breadth-remediation-v5-head.log
          retention-days: 30
