name: MEN-001 Polish Follow-up Patch

on:
  push:
    branches:
      - feat/men-001-exam-strategy-polish
    paths:
      - .github/workflows/men-001-polish-followup-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/men-001-exam-strategy-polish

      - name: Merge adjacent same-purpose steps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-final-polisher.ts")
          text = path.read_text(encoding="utf-8")
          needle = '''    if (section.kind === "STEP" && previous?.kind === "STEP") {
                const previousIdentity = equationIdentity(previous);
                const currentIdentity = equationIdentity(section);
                if (previousIdentity && previousIdentity === currentIdentity) {
                  previous.equations = [...previous.equations, ...section.equations];
                  continue;
                }
              }'''
          replacement = '''    if (section.kind === "STEP" && previous?.kind === "STEP") {
                if (previous.title === section.title) {
                  previous.paragraphs = [...new Set([...previous.paragraphs, ...section.paragraphs])];
                  previous.equations = [...previous.equations, ...section.equations];
                  continue;
                }
                const previousIdentity = equationIdentity(previous);
                const currentIdentity = equationIdentity(section);
                if (previousIdentity && previousIdentity === currentIdentity) {
                  previous.paragraphs = [...new Set([...previous.paragraphs, ...section.paragraphs])];
                  previous.equations = [...previous.equations, ...section.equations];
                  continue;
                }
              }'''
          if "previous.title === section.title" not in text:
              if text.count(needle) != 1:
                  raise SystemExit(f"Expected one merge block; found {text.count(needle)}")
              text = text.replace(needle, replacement)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Strengthen focused regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/exam-strategy-polish.test.ts")
          text = path.read_text(encoding="utf-8")
          old = '''assert(shortcut(uniformDecrease), "QL-415 must expose the uniform-decrease shortcut.");

for (const question of [isosceles, ratioTriplet, ratioNonTriplet, uniformIncrease, uniformDecrease]) {'''
          new = '''assert(shortcut(uniformDecrease), "QL-415 must expose the uniform-decrease shortcut.");
assert(
  uniformDecrease.explanation.sections.every(
    (section) => section.kind !== "STEP" || section.title !== "Continue the Calculation",
  ),
  "QL-415 must merge adjacent new-area steps instead of emitting a generic continuation heading.",
);

for (const question of [isosceles, ratioTriplet, ratioNonTriplet, uniformIncrease, uniformDecrease]) {'''
          if "QL-415 must merge adjacent new-area steps" not in text:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one test insertion point; found {text.count(old)}")
              text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-final-polisher.ts artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/exam-strategy-polish.test.ts
          git diff --cached --quiet || git commit -m "fix(mensuration): merge duplicate calculation steps"
          git push origin HEAD:feat/men-001-exam-strategy-polish
