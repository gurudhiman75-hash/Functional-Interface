name: Validate BTD-001 CP014 Scored Test Projection Materialization V1

on:
  push:
    branches:
      - feature/btd-cp014-scored-test-projection-materialization-v2
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-014/**'
      - 'artifacts/api-server/src/lib/admin-btd-test-projection-materialization.ts'
      - 'artifacts/api-server/src/routes/admin-btd-test-projection-materialization.ts'
      - 'artifacts/api-server/src/routes/index.ts'
      - '.github/workflows/btd-cp014-scored-test-projection-materialization-v1.yml'
  pull_request:
    branches:
      - feature/btd-cp013-test-eligibility-readiness-v1
    paths:
      - 'artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-014/**'
      - 'artifacts/api-server/src/lib/admin-btd-test-projection-materialization.ts'
      - 'artifacts/api-server/src/routes/admin-btd-test-projection-materialization.ts'
      - 'artifacts/api-server/src/routes/index.ts'

permissions:
  contents: read

concurrency:
  group: btd-cp014-scored-test-projection-materialization-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-btd-cp014-scored-test-projection-materialization-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'
          run_install: false

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-prove CP013 scored-test projection readiness authority
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-013/btd-cp013-scored-test-projection-readiness-v1-audit.ts | tee btd-cp014-upstream-cp013.log
          grep -q 'PASS_BTD_001_CP013_SCORED_TEST_PROJECTION_READINESS_AUDIT_V1' btd-cp014-upstream-cp013.log

      - name: Audit CP014 exam-scoped materialization
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx tsx@4.20.6 artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-014/btd-cp014-scored-test-projection-materialization-v1-audit.ts | tee btd-cp014-scored-test-projection-materialization-v1.log
          grep -q 'PASS_BTD_001_CP014_SCORED_TEST_PROJECTION_MATERIALIZATION_AUDIT_V1' btd-cp014-scored-test-projection-materialization-v1.log

      - name: Verify materialization routing and lifecycle locks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'adminBtdTestProjectionMaterializationRouter' artifacts/api-server/src/routes/index.ts
          grep -q 'materializeBtdCp014ScoredTestProjectionV1' artifacts/api-server/src/routes/admin-btd-test-projection-materialization.ts
          grep -q 'content.questions.approve' artifacts/api-server/src/routes/admin-btd-test-projection-materialization.ts
          grep -q 'pg_advisory_xact_lock' artifacts/api-server/src/lib/admin-btd-test-projection-materialization.ts
          grep -q 'testProjectionKey' artifacts/api-server/src/lib/admin-btd-test-projection-materialization.ts
          grep -q "'approved'::question_status" artifacts/api-server/src/lib/admin-btd-test-projection-materialization.ts
          grep -q "'approved'" artifacts/api-server/src/lib/admin-btd-test-projection-materialization.ts
          grep -q 'question_translations' artifacts/api-server/src/lib/admin-btd-test-projection-materialization.ts
          grep -q 'testEligibilityApprovalGranted: false' artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-014/btd-cp014-scored-test-projection-materialization-v1.ts
          grep -q 'testEligible: false' artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-014/btd-cp014-scored-test-projection-materialization-v1.ts
          grep -q 'mockTestEligible: false' artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-014/btd-cp014-scored-test-projection-materialization-v1.ts
          grep -q 'publiclyPublishable: false' artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Bankers-True-Discount/BTD-001/BTD-CP-014/btd-cp014-scored-test-projection-materialization-v1.ts

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Record exact validation head
        shell: bash
        run: |
          echo "validated_head=$(git rev-parse HEAD)" | tee btd-cp014-scored-test-projection-materialization-v1-head.log
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Upload CP014 evidence
        uses: actions/upload-artifact@v4
        with:
          name: btd-cp014-scored-test-projection-materialization-v1
          path: |
            btd-cp014-upstream-cp013.log
            btd-cp014-scored-test-projection-materialization-v1.log
            btd-cp014-scored-test-projection-materialization-v1-head.log
          retention-days: 30
