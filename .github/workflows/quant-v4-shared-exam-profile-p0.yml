name: Quant V4 shared exam profile P0

on:
  push:
    branches:
      - audit/quant-v4-shared-exam-profile-p0
    paths:
      - "artifacts/api-server/src/quant-v4/**"
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/quant-v4/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-v4-exam-profile-p0-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shared-exam-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cross-package exam-profile conformance
        run: npx -y tsx artifacts/api-server/src/quant-v4/quality/quant-v4-exam-profile-conformance.test.ts

      - name: Probability Question Studio profile regression
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/question-studio-profile.test.ts

      - name: Banking Number Series profile regression
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/SpeedMathematics/BankingNumberSeries/BNS-001/bns-001.test.ts

      - name: Patch hygiene
        run: git diff --check
