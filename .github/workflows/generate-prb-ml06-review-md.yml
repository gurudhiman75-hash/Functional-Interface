name: Generate Probability ML-06 review Markdown

on:
  push:
    branches:
      - feat/prb-probability-ml06-review-md
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Probability/generate-native-review-md.ts"
      - "artifacts/api-server/src/quant-v4/topics/Probability/apply-exam-style-native-stems.mjs"
      - "artifacts/api-server/src/quant-v4/topics/Probability/patch-native-explanation-vocabulary*.mjs"
      - "artifacts/api-server/src/quant-v4/topics/Probability/shared/native-*.ts"
      - ".github/workflows/generate-prb-ml06-review-md.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-review-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prb-probability-ml06-review-md
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply exam-style native stem renderer
        run: node artifacts/api-server/src/quant-v4/topics/Probability/apply-exam-style-native-stems.mjs

      - name: Apply controlled explanation vocabulary waves
        run: |
          mirror="artifacts/api-server/src/quant-v4/topics/Probability/shared/native-source-explanation-mirror.ts"
          base="artifacts/api-server/src/quant-v4/topics/Probability/patch-native-explanation-vocabulary.mjs"

          if grep -q 'naturalizeProbabilityExplanationBody' "$mirror"; then
            echo "English-authority explanation mirror already materialized."
            echo "Replaying idempotent post-materialization correction waves 15-23."
            for n in $(seq 15 23); do
              file="artifacts/api-server/src/quant-v4/topics/Probability/patch-native-explanation-vocabulary-wave${n}.mjs"
              if [ -f "$file" ]; then
                echo "Applying $file"
                node "$file"
              fi
            done
          else
            echo "Bootstrapping English-authority explanation mirror."
            node "$base"
            for n in $(seq 2 23); do
              file="artifacts/api-server/src/quant-v4/topics/Probability/patch-native-explanation-vocabulary-wave${n}.mjs"
              if [ -f "$file" ]; then
                echo "Applying $file"
                node "$file"
              fi
            done
          fi

      - name: Generate all 432 native review surfaces
        run: npx -y tsx artifacts/api-server/src/quant-v4/topics/Probability/generate-native-review-md.ts

      - name: Verify four review files
        run: |
          test -f artifacts/api-server/src/quant-v4/topics/Probability/review/PRB-001-HINDI-120Q-REVIEW.md
          test -f artifacts/api-server/src/quant-v4/topics/Probability/review/PRB-001-PUNJABI-120Q-REVIEW.md
          test -f artifacts/api-server/src/quant-v4/topics/Probability/review/PRB-002-HINDI-96Q-REVIEW.md
          test -f artifacts/api-server/src/quant-v4/topics/Probability/review/PRB-002-PUNJABI-96Q-REVIEW.md
          grep -q "## 120\." artifacts/api-server/src/quant-v4/topics/Probability/review/PRB-001-HINDI-120Q-REVIEW.md
          grep -q "## 120\." artifacts/api-server/src/quant-v4/topics/Probability/review/PRB-001-PUNJABI-120Q-REVIEW.md
          grep -q "## 96\." artifacts/api-server/src/quant-v4/topics/Probability/review/PRB-002-HINDI-96Q-REVIEW.md
          grep -q "## 96\." artifacts/api-server/src/quant-v4/topics/Probability/review/PRB-002-PUNJABI-96Q-REVIEW.md
          grep -q "एक बैग में" artifacts/api-server/src/quant-v4/topics/Probability/review/PRB-001-HINDI-120Q-REVIEW.md
          grep -q "ਇੱਕ ਬੈਗ ਵਿੱਚ" artifacts/api-server/src/quant-v4/topics/Probability/review/PRB-001-PUNJABI-120Q-REVIEW.md
          ! grep -q "एक पात्र में.*समान रूप से संभावित" artifacts/api-server/src/quant-v4/topics/Probability/review/PRB-001-HINDI-120Q-REVIEW.md
          ! grep -q "ਪੂਰੇ ਨਮੂਨਾ ਅਵਕਾਸ ਵਿੱਚ ਕੁੱਲ ਇੱਕੋ-ਜਿਹੀ ਸੰਭਾਵਨਾ" artifacts/api-server/src/quant-v4/topics/Probability/review/PRB-001-PUNJABI-120Q-REVIEW.md
          ! grep -Eq "[0-9]+ अभ्यर्थी के एक समूह|[0-9]+ विद्यार्थी के एक समूह|चुने गए गेंदें में|उसके नीला होने|उसके इनाम वाला टिकट होने" artifacts/api-server/src/quant-v4/topics/Probability/review/*HINDI*.md
          ! grep -Eq "[0-9]+ ਉਮੀਦਵਾਰ ਦੇ ਇੱਕ ਸਮੂਹ|[0-9]+ ਵਿਦਿਆਰਥੀ ਦੇ ਇੱਕ ਸਮੂਹ|ਚੁਣੇ ਗੇਂਦਾਂ ਵਿੱਚ|ਉਸ ਦੇ ਨੀਲਾ ਹੋਣ|ਉਸ ਦੇ ਇਨਾਮ ਵਾਲਾ ਟਿਕਟ ਹੋਣ" artifacts/api-server/src/quant-v4/topics/Probability/review/*PUNJABI*.md
          ! grep -Eq "पहली कंचा|पहली पत्थर|पहली पेन" artifacts/api-server/src/quant-v4/topics/Probability/review/*HINDI*.md
          ! grep -Eq "ਪਹਿਲੀ ਕੰਚਾ|ਪਹਿਲੀ ਪੱਥਰ|ਪਹਿਲੀ ਪੈਨ" artifacts/api-server/src/quant-v4/topics/Probability/review/*PUNJABI*.md
          if grep -nHE "ਪੜਾਅਾਂ|ਪੜਾਅਵਾਂ" artifacts/api-server/src/quant-v4/topics/Probability/review/*PUNJABI*.md; then
            echo "Found non-canonical Punjabi stage inflection above."
            exit 1
          fi

      - name: Upload review Markdown bundle
        uses: actions/upload-artifact@v4
        with:
          name: probability-ml06-native-review-md
          path: artifacts/api-server/src/quant-v4/topics/Probability/review/*.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit corrected runtime and review Markdown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/quant-v4/topics/Probability/multilingual-runtime.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/native-language-primitives.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/PRB-002/native-editorial.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/shared/native-student-facing-renderer.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/shared/native-exam-style-renderer.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/shared/native-final-stem-renderer.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/shared/native-final-explanation-renderer.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/shared/native-exam-style-bridge.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/shared/native-source-explanation-mirror.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/shared/native-source-explanation-naturalizer.ts \
            artifacts/api-server/src/quant-v4/topics/Probability/review/*.md
          if git diff --cached --quiet; then
            echo "Native runtime and review Markdown already up to date."
          else
            git commit -m "fix(probability): align Hindi Punjabi explanations with English authority"
            git push origin HEAD:feat/prb-probability-ml06-review-md
          fi
