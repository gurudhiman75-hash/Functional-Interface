name: Validate SEA-001 closure

on:
  push:
    branches:
      - feat/sea-001-cp005-circular-mixed-facing
    paths:
      - artifacts/api-server/src/reasoning-v1/shared/constraint-core/**
      - artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/**
      - .github/workflows/sea-001-cp005.yml
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - artifacts/api-server/src/reasoning-v1/shared/constraint-core/**
      - artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/**
      - .github/workflows/sea-001-cp005.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-sea-001-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Strict TypeScript check
        working-directory: artifacts/api-server
        run: |
          pnpm exec tsc \
            --noEmit \
            --target es2022 \
            --module esnext \
            --moduleResolution bundler \
            --allowImportingTsExtensions \
            --strictNullChecks \
            --noImplicitAny \
            --noImplicitReturns \
            --noFallthroughCasesInSwitch \
            --skipLibCheck \
            --types node \
            $(find src/reasoning-v1/shared/constraint-core src/reasoning-v1/topics/SeatingArrangement/SEA-001 -name '*.ts' -print)

  cp001-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/foundation-proof.test.ts

  cp002-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/cp002-proof.test.ts

  cp003-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/cp003-proof.test.ts

  cp004-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/cp004-proof.test.ts

  cp005-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 400-caselet CP-005 mixed-circle proof
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/cp005-proof.test.ts

  wave4-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/wave4-verification-proof.test.ts

  saturation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run SEA-001 1,600-caselet production-candidate saturation proof
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/sea001-saturation-audit.test.ts \
            2>&1 | tee /tmp/sea001-saturation-audit.log
      - name: Upload saturation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sea-001-saturation-audit
          path: /tmp/sea001-saturation-audit.log
          if-no-files-found: error
          retention-days: 14

  english-review-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate 100-caselet SEA-001 English review baseline
        env:
          SEA_001_REVIEW_OUTPUT_DIR: /tmp/sea-001-review-baseline
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/sea001-review-baseline-export.ts \
            2>&1 | tee /tmp/sea001-review-baseline-export.log
          test -s /tmp/sea-001-review-baseline/sea-001-english-review-baseline.html
          test -s /tmp/sea-001-review-baseline/sea-001-english-review-baseline.json
          test -s /tmp/sea-001-review-baseline/sea-001-english-review-baseline.csv
      - name: Upload English review baseline
        uses: actions/upload-artifact@v4
        with:
          name: sea-001-english-review-baseline
          path: |
            /tmp/sea-001-review-baseline/**
            /tmp/sea001-review-baseline-export.log
          if-no-files-found: error
          retention-days: 14

  cp005-review-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate 48-caselet CP-005 English review pack
        env:
          SEA_CP005_REVIEW_OUTPUT_DIR: /tmp/sea-cp005-review
        run: node --experimental-strip-types ./artifacts/api-server/src/reasoning-v1/topics/SeatingArrangement/SEA-001/cp005-review-export.ts
      - name: Upload CP-005 review evidence
        uses: actions/upload-artifact@v4
        with:
          name: sea-cp005-english-review
          path: /tmp/sea-cp005-review/**
          if-no-files-found: error
          retention-days: 14
