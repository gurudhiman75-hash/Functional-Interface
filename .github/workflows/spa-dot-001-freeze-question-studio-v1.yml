name: Validate SPA DOT-001 Freeze Question Studio V1

on:
  pull_request:
    branches:
      - New-main
    paths:
      - "artifacts/api-server/src/reasoning-v1/foundation/spatial/dot-situation-*.ts"
      - "artifacts/api-server/src/reasoning-v1/foundation/spatial/SPA-DOT-001-REVIEW-V1-STATUS.md"
      - "artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-question-studio-integration-v6.ts"
      - "artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-question-studio-integration-v7.ts"
      - "artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-question-studio-production-v6.ts"
      - "artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-question-studio-production-v7.ts"
      - "artifacts/api-server/src/reasoning-v1/tests/dot-situation-dot-001-freeze-question-studio-v1.test.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-spatial-v5.ts"
      - "artifacts/api-server/src/routes/admin-question-studio-spatial-workflow.ts"
      - "artifacts/api-server/src/lib/admin-question-conversion.ts"
      - "artifacts/admin-app/src/features/question-studio/spatial-review-api.ts"
      - "artifacts/admin-app/src/pages/content/QuestionStudioSpatialReviewPanel.tsx"
  workflow_dispatch:

concurrency:
  group: spa-dot-001-freeze-question-studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The proof imports persistence/conversion helpers that construct the SQL client.
      # No database operation is executed; this inert URL keeps the deterministic proof
      # independent of repository or production secrets.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/examtree_dot_ci
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --dir artifacts/api-server build

      - name: Typecheck admin Question Studio UI
        run: pnpm --dir artifacts/admin-app typecheck

      - name: Bundle DOT-001 freeze integration proof
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/dot-situation-dot-001-freeze-question-studio-v1.test.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=dist/reasoning-v1/spatial/dot-situation-dot-001-freeze-question-studio-v1.test.mjs

      - name: Run DOT-001 freeze integration proof
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/dot-situation-dot-001-freeze-question-studio-v1.test.mjs 2>&1 \
            | tee dist/reasoning-v1/spatial/dot-001-freeze-question-studio-v1-run.log

      - name: Upload DOT-001 freeze integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-dot-001-freeze-question-studio-v1
          path: artifacts/api-server/dist/reasoning-v1/spatial/dot-001-freeze-question-studio-v1-run.log
          if-no-files-found: error
