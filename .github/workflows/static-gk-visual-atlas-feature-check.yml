name: Static GK Visual Atlas Feature Check

on:
  push:
    branches:
      - feature/static-gk-visual-atlas-mvp
    paths:
      - '.github/workflows/static-gk-visual-atlas-feature-check.yml'
      - 'artifacts/api-server/src/static-gk-visual-atlas/**'
      - 'artifacts/api-server/src/routes/admin-static-gk-visual-atlas.ts'
      - 'artifacts/api-server/src/routes/index.ts'
      - 'artifacts/api-server/static-gk-atlas-tool.mjs'
      - 'artifacts/admin-app/src/pages/content/StaticGkVisualAtlasWorkspacePage.tsx'
      - 'artifacts/admin-app/src/pages/content/LearningResourcesHubPage.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-gk-visual-atlas-feature-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Run Visual Atlas compiler, manifest and renderer tests
        run: node static-gk-atlas-tool.mjs test
        working-directory: artifacts/api-server

      - name: Build production API
        if: always()
        run: pnpm run build
        working-directory: artifacts/api-server

      - name: Typecheck admin app
        if: always()
        run: pnpm run typecheck
        working-directory: artifacts/admin-app
