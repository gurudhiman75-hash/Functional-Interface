name: Static GK Visual Atlas Feature Check

on:
  push:
    branches:
      - feature/static-gk-visual-atlas-mvp
    paths:
      - '.github/workflows/static-gk-visual-atlas-feature-check.yml'

permissions:
  contents: read

concurrency:
  group: static-gk-visual-atlas-feature-check
  cancel-in-progress: true

jobs:
  atlas-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Run Visual Atlas compiler and renderer tests
        working-directory: artifacts/api-server
        run: node static-gk-atlas-tool.mjs test

      - name: Build production API
        working-directory: artifacts/api-server
        run: pnpm run build

      - name: Typecheck admin app
        working-directory: artifacts/admin-app
        run: pnpm run typecheck
