name: Validate SPA PFC-001 Option Perceptual Audit V1

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/reasoning-v1/foundation/spatial/**"
      - "artifacts/api-server/src/reasoning-v1/tests/spatial-*.test.ts"
      - "artifacts/admin-app/src/features/question-studio/**"
      - "artifacts/admin-app/src/pages/content/QuestionStudioSpatialReviewPanel.tsx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pfc-option-perceptual-audit-v1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle student-perception option audit
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-paper-folding-option-perceptual-audit-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-paper-folding-option-perceptual-audit-v1.test.mjs
      - name: Audit spacing-only learner choices
        run: cd artifacts/api-server && node dist/reasoning-v1/spatial/spatial-paper-folding-option-perceptual-audit-v1.test.mjs
