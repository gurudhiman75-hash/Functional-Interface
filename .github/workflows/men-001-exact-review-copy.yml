name: MEN-001 Exact Review Copy Patch

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-001-exact-review-copy.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Correct review copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-human-review-export.ts")
          text = path.read_text()
          replacements = {
              '"Each explanation follows Key Rule & Formula → Step-by-Step Solution → Exam Speed Shortcut → Common Traps → Final Answer. Equations are stored as MathJax-ready LaTeX.",':
              '"Each explanation follows exactly four tiers: Key Rule & Formula → Step-by-Step Solution (including the final result) → Exam Speed Shortcut → Common Traps. Equations are stored as MathJax-ready LaTeX.",',
              '<p>Every solution follows the competitive four-tier layout: Key Rule & Formula → Step-by-Step Solution → Exam Speed Shortcut → Common Traps, followed by the Final Answer.</p>':
              '<p>Every solution follows exactly four tiers: Key Rule & Formula → Step-by-Step Solution (including the final result) → Exam Speed Shortcut → Common Traps.</p>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected review copy not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit review copy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-human-review-export.ts
          git commit -m "docs(mensuration): describe exact four-tier review"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
