name: QS production review scope preflight
on:
  pull_request:
    branches: [New-main]
    paths:
      - 'artifacts/api-server/src/question-studio/prod-review-scope-preflight.mjs'
      - 'tests/qs-prod-review-scope-preflight.test.mjs'
  workflow_dispatch:
concurrency:
  group: qs-prod-review-scope-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production scope remains disabled and pinned
        run: node --test tests/qs-prod-review-scope-preflight.test.mjs tests/qs-review-only-rollout-policy.test.mjs
