name: Validate historical TRG-001 Final5 human approval boundary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-historical-final5-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle historical Final5 supersession audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/AdvancedMathematics/subtopics/Trigonometry/TRG-001/localization-human-approval-boundary.test.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/trg-001-final5-boundary-superseded-audit.mjs

      - name: Verify historical Final5 boundary is fail-closed
        run: node artifacts/api-server/dist/quant-v4/trg-001-final5-boundary-superseded-audit.mjs
