name: MEN-001 Trap Preposition Patch

on:
  pull_request:
    branches: [New-main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-001-trap-preposition-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Fix preposition-led distractor grammar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-common-traps.ts")
          lines = path.read_text().splitlines()

          for index, line in enumerate(lines):
              if 'if (/^(the|a|an|one|only|half|double|triple|four|all|both|its|their)' in line:
                  lines[index] = line.replace(
                      'the|a|an|one|only|half|double|triple|four|all|both|its|their',
                      'the|a|an|one|two|three|four|five|six|seven|eight|nine|ten|only|half|double|triple|all|both|its|their|\\d',
                  )
                  break
          else:
              raise SystemExit("withArticle pattern not found")

          for case_name in ("divide", "multiply"):
              marker = f'    case "{case_name}":'
              for index, line in enumerate(lines):
                  if line == marker:
                      guard = f'      if (afterText.startsWith("by ")) return `{case_name[:-1] if case_name.endswith("e") else case_name}ing by ${{afterText.slice(3)}} unnecessarily`;'
                      if case_name == "divide":
                          guard = '      if (afterText.startsWith("by ")) return `dividing by ${afterText.slice(3)} unnecessarily`;'
                      else:
                          guard = '      if (afterText.startsWith("by ")) return `multiplying by ${afterText.slice(3)} unnecessarily`;'
                      if guard not in lines[index + 1:index + 3]:
                          lines.insert(index + 1, guard)
                      break
              else:
                  raise SystemExit(f"{case_name} case not found")

          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-001/structured-common-traps.ts
          git commit -m "fix(mensuration): parse divide-by and multiply-by traps"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
