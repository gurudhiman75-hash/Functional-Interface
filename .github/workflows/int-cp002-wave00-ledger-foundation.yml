name: Validate INT-CP-002 Wave 0 ledger foundation

on:
  pull_request:
    branches:
      - design/int-001-cp002-executable-discovery
    paths:
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/cp002-foundation/**"
      - "artifacts/api-server/src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp002-wave00-ledger-foundation-audit.ts"
      - ".github/workflows/int-cp002-wave00-ledger-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-int-cp002-wave00-ledger-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle CP-002 Wave 0 audit
        run: >-
          pnpm --dir artifacts/api-server exec esbuild
          src/quant-v4/topics/Arithmetic/subtopics/Interest/INT-001/int-001-cp002-wave00-ledger-foundation-audit.ts
          --bundle --platform=node --format=esm
          --outfile=dist/quant-v4/int-001-cp002-wave00-ledger-foundation-audit.mjs

      - name: Run CP-002 Wave 0 audit
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -o pipefail
          cd artifacts/api-server
          node dist/quant-v4/int-001-cp002-wave00-ledger-foundation-audit.mjs 2>&1 | tee dist/quant-v4/int-001-cp002-wave00-ledger-foundation-audit.log

      - name: Verify CP-002 Wave 0 evidence
        run: grep -q 'PASS_INT_CP002_WAVE00_LEDGER_FOUNDATION' artifacts/api-server/dist/quant-v4/int-001-cp002-wave00-ledger-foundation-audit.log

      - name: Upload CP-002 Wave 0 evidence
        uses: actions/upload-artifact@v4
        with:
          name: int-cp002-wave00-ledger-foundation
          path: artifacts/api-server/dist/quant-v4/int-001-cp002-wave00-ledger-foundation-audit.log
          if-no-files-found: error
          retention-days: 14
