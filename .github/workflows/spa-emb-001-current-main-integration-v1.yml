name: Validate SPA EMB-001 Current New-main Integration V1

on:
  push:
    branches:
      - feat/spa-emb-001-current-main-integration-v1
    paths:
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/embedded-figure-graph-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/embedded-figure-source-saturated-discovery-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/embedded-figure-production-generator-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/embedded-figure-visual-realism-remediation-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/embedded-figure-whole-option-connectivity-remediation-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/embedded-figure-product-owner-approval-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/embedded-figure-permanent-english-runtime-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/embedded-figure-english-freeze-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/embedded-figure-localization-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/embedded-figure-localization-product-owner-approval-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/embedded-figure-localization-freeze-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/embedded-figure-question-studio-seeded-runtime-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/embedded-figure-question-studio-product-owner-approval-v1.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-permanent-ql-allocation-v5.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-question-studio-integration-v3.ts
      - artifacts/api-server/src/reasoning-v1/foundation/spatial/spatial-question-studio-production-v3.ts
      - artifacts/api-server/src/routes/admin-question-studio-spatial.ts
      - artifacts/api-server/src/reasoning-v1/tests/spatial-embedded-figure-current-main-integration-v1.test.ts
      - .github/workflows/spa-emb-001-current-main-integration-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-emb-current-main-integration-v1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build current API server
        run: pnpm --dir artifacts/api-server build

      - name: Bundle EMB-001 current New-main integration proof
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/spatial
          pnpm --dir artifacts/api-server exec esbuild \
            src/reasoning-v1/tests/spatial-embedded-figure-current-main-integration-v1.test.ts \
            --bundle --platform=node --format=esm \
            --outfile=dist/reasoning-v1/spatial/spatial-embedded-figure-current-main-integration-v1.test.mjs

      - name: Validate EMB-001 against current New-main
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/spatial/spatial-embedded-figure-current-main-integration-v1.test.mjs \
            | tee dist/reasoning-v1/spatial/spa-emb-001-current-main-integration-v1-evidence.json

      - name: Upload EMB-001 current New-main integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: spa-emb-001-current-main-integration-v1
          path: artifacts/api-server/dist/reasoning-v1/spatial/spa-emb-001-current-main-integration-v1-evidence.json
          if-no-files-found: error
