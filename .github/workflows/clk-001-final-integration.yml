name: Validate CLK-001 final integration

on:
  pull_request:
    branches:
      - New-main
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - artifacts/api-server/src/reasoning-v1/foundation/temporal/**
      - artifacts/api-server/src/reasoning-v1/topics/Clocks/CLK-001/**
      - artifacts/api-server/src/reasoning-v1/tests/clock-**
      - artifacts/api-server/src/question-studio/engines/reasoning-v1-adapter.ts
      - .github/workflows/clk-001-final-integration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clk-001-final-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-clock-final-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle Clock final proofs
        run: |
          mkdir -p artifacts/api-server/dist/reasoning-v1/clock-final
          for file in \
            src/reasoning-v1/tests/clock-foundation.test.ts \
            src/reasoning-v1/tests/clock-end-to-end-v2.test.ts \
            src/reasoning-v1/tests/clock-source-saturation-v2.test.ts \
            src/reasoning-v1/tests/clock-anchor-distractor-quality.test.ts \
            src/reasoning-v1/tests/clock-item-difficulty.test.ts \
            src/reasoning-v1/topics/Clocks/CLK-001/question-studio-integration.test.ts
          do
            name="$(basename "$file" .ts)"
            pnpm --dir artifacts/api-server exec esbuild "$file" \
              --bundle --platform=node --format=esm \
              --outfile="dist/reasoning-v1/clock-final/${name}.mjs"
          done
      - name: Run Clock final proofs
        run: |
          cd artifacts/api-server
          node dist/reasoning-v1/clock-final/clock-foundation.test.mjs
          node dist/reasoning-v1/clock-final/clock-end-to-end-v2.test.mjs
          node dist/reasoning-v1/clock-final/clock-source-saturation-v2.test.mjs
          node dist/reasoning-v1/clock-final/clock-anchor-distractor-quality.test.mjs
          node dist/reasoning-v1/clock-final/clock-item-difficulty.test.mjs
          node dist/reasoning-v1/clock-final/question-studio-integration.test.mjs
