name: COM-003 Distractor One-Off

on:
  push:
    branches:
      - feature/com003-office-productivity-discovery-v1
    paths:
      - 'artifacts/api-server/src/knowledge-v1/computer-awareness/com003-*.ts'

permissions:
  contents: read

concurrency:
  group: com003-distractor-oneoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build API server
        run: pnpm --dir artifacts/api-server build
      - name: Bundle COM-003 checkpoint audits
        run: |
          mkdir -p artifacts/api-server/dist/com003-distractor-oneoff
          for test in \
            com003-distractor-readiness.test \
            com003-controlled-distractor-pools.test \
            com003-editorial-fact-review.test; do
            pnpm --dir artifacts/api-server exec esbuild \
              src/knowledge-v1/computer-awareness/${test}.ts \
              --bundle --platform=node --format=esm \
              --outfile=dist/com003-distractor-oneoff/${test}.mjs
          done
      - name: Run COM-003 checkpoint audits
        run: |
          node artifacts/api-server/dist/com003-distractor-oneoff/com003-distractor-readiness.test.mjs
          node artifacts/api-server/dist/com003-distractor-oneoff/com003-controlled-distractor-pools.test.mjs
          node artifacts/api-server/dist/com003-distractor-oneoff/com003-editorial-fact-review.test.mjs
