name: MEN-002 Wave03 Count Options Patch

on:
  pull_request:
    branches:
      - feat/men-002-cp007-gap-wave-02
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/men-002-wave03-count-options-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Correct count distractors and shortcut MathJax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-03")
          runtime = root / "runtime.ts"
          lines = runtime.read_text().splitlines()

          replacements = {
            '      { value: q(state.wallLMetres * state.wallBMetres * state.wallHMetres, brickVolume), misconceptionId: "MIXED_METRES_AND_CENTIMETRES", explanation: "dividing metre-based wall numbers by a cubic-centimetre brick volume without converting units" },':
            '      { value: q(count, 100n), misconceptionId: "LEFT_ONE_METRE_DIMENSION_UNCONVERTED", explanation: "leaving one wall dimension in metres, which makes the count one hundred times too small" },',
            '      { value: q(wallLCm * state.wallBMetres * state.wallHMetres, brickVolume), misconceptionId: "CONVERTED_ONE_DIMENSION", explanation: "converting only the wall length to centimetres and leaving the other two dimensions in metres" },':
            '      { value: q(alongLength + alongBreadth + alongHeight), misconceptionId: "ADDED_DIRECTION_COUNTS", explanation: "adding the brick counts along the three directions instead of multiplying rows, columns and layers" },',
            '    shortcut: `Use $P=(TSA-2A_{base})/h$.`,':
            '    shortcut: `Use $P=\\frac{TSA-2A_{base}}{h}$.`,',
          }
          for old, new in replacements.items():
            matches = [index for index, line in enumerate(lines) if line == old]
            if len(matches) != 1:
              raise SystemExit(f"Expected one exact line for {old[:48]!r}, found {len(matches)}")
            lines[matches[0]] = new
          runtime.write_text("\n".join(lines) + "\n")

          test = root / "runtime.test.ts"
          lines = test.read_text().splitlines()
          marker_matches = [index for index, line in enumerate(lines) if 'assert.equal(first.answer, first.options[first.correctIndex]?.display);' in line]
          if len(marker_matches) != 1:
            raise SystemExit(f"Expected one answer-display assertion, found {len(marker_matches)}")
          insertion = [
            '    if (["cubes", "blocks", "bricks", "cuts"].includes(first.unit)) {',
            '      assert.ok(',
            '        first.options.every((option) => option.value.kind === "RATIONAL" && option.value.denominator === 1n),',
            '        `${prototypeId} count options must all be whole numbers.`,',
            '      );',
            '    }',
          ]
          index = marker_matches[0] + 1
          lines[index:index] = insertion
          test.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-03/runtime.ts artifacts/api-server/src/quant-v4/topics/AdvancedMathematics/subtopics/Mensuration/MEN-002/gap-wave-03/runtime.test.ts
          git commit -m "fix(mensuration): require whole-number Wave-03 count options"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
