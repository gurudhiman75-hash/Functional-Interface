# Production receiver IMAGE BUILD ONLY. No Cloud Run deploy, IAM, queue, DB or traffic changes.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build','--file','Dockerfile.examtree-qs-prod-task-receiver','--tag','${_IMAGE}','.']
images: ['${_IMAGE}']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
